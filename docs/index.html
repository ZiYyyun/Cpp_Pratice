<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数据结构 · 动画实验室｜从看懂到能写</title>
<style>
:root{
  --bg:#080d19;
  --bg2:#0c1424;
  --panel:#111a2e;
  --panel2:#0e1626;
  --line:#22304d;
  --line2:#2e3f63;
  --text:#e7eefb;
  --dim:#93a6c8;
  --dim2:#6d80a3;
  --accent:#38d9d0;
  --accent2:#8b7cf6;
  --accent3:#ffb454;
  --ok:#3ddc97;
  --danger:#ff6b81;
  --blue:#5aa9ff;
  --code-bg:#070b15;
  --radius:14px;
  --mono:ui-monospace,"Cascadia Code","JetBrains Mono",Consolas,"Courier New",monospace;
  --sans:"Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:
    radial-gradient(1200px 700px at 78% -12%,rgba(139,124,246,.16),transparent 62%),
    radial-gradient(900px 600px at 4% 4%,rgba(56,217,208,.12),transparent 60%),
    var(--bg);
  color:var(--text);font-family:var(--sans);font-size:15.5px;line-height:1.75;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#25334f;border-radius:20px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#33456b;background-clip:content-box}

/* ============ 布局 ============ */
.app{display:flex;min-height:100vh}
.sidebar{
  width:272px;flex:0 0 272px;position:sticky;top:0;height:100vh;overflow-y:auto;
  background:linear-gradient(180deg,rgba(13,20,36,.96),rgba(9,14,26,.96));
  border-right:1px solid var(--line);padding:18px 14px 40px;backdrop-filter:blur(8px);z-index:40;
}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px;border-bottom:1px solid var(--line);margin-bottom:14px}
.brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:800;color:#04121a;font-size:16px;box-shadow:0 6px 18px rgba(56,217,208,.28)}
.brand b{display:block;font-size:15px;letter-spacing:.3px}
.brand small{color:var(--dim2);font-size:11.5px;letter-spacing:.5px}
.search{width:100%;padding:9px 12px;margin-bottom:12px;border-radius:10px;border:1px solid var(--line);
  background:#0b1322;color:var(--text);font-family:var(--sans);font-size:13.5px;outline:none;transition:.2s}
.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(56,217,208,.13)}
.navgroup{margin:14px 0 4px;padding:0 10px;font-size:11px;letter-spacing:1.6px;color:var(--dim2);text-transform:uppercase;font-weight:700}
.navlink{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;color:var(--dim);
  font-size:14px;cursor:pointer;border:1px solid transparent;transition:.16s;user-select:none}
.navlink:hover{background:#14203a;color:var(--text);text-decoration:none}
.navlink.active{background:linear-gradient(90deg,rgba(56,217,208,.16),rgba(139,124,246,.10));border-color:rgba(56,217,208,.35);color:#fff}
.navlink .ico{width:22px;text-align:center;font-size:15px;opacity:.9}
.navlink .done{margin-left:auto;color:var(--ok);font-size:12px;opacity:0;transition:.2s}
.navlink.finished .done{opacity:1}
.navlink .n{margin-left:auto;color:var(--dim2);font-size:11.5px;font-family:var(--mono)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:11px 26px;
  background:rgba(8,13,25,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.crumbs{color:var(--dim2);font-size:13px}
.crumbs b{color:var(--text);font-weight:600}
.topbar .spacer{flex:1}
.pill{font-size:12px;color:var(--dim);border:1px solid var(--line);padding:4px 11px;border-radius:999px;background:#0c1526}
.pill b{color:var(--accent)}
#menuBtn{display:none;background:#12203a;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:6px 11px;cursor:pointer;font-size:16px}
#doc{padding:26px 30px 90px;max-width:1180px;width:100%;margin:0 auto}

/* ============ 通用卡片/标题 ============ */
.card{background:linear-gradient(180deg,rgba(17,26,46,.92),rgba(12,19,34,.92));border:1px solid var(--line);
  border-radius:var(--radius);padding:22px 24px;margin:0 0 22px;box-shadow:0 12px 34px rgba(0,0,0,.28)}
.card>h2{margin:0 0 6px;font-size:21px;display:flex;align-items:center;gap:10px}
.card>h2 .badge{font-size:11px;font-family:var(--mono);padding:3px 8px;border-radius:6px;background:rgba(56,217,208,.14);color:var(--accent);border:1px solid rgba(56,217,208,.3);font-weight:500}
.card .lead{color:var(--dim);margin:0 0 16px;font-size:14.5px}
h3.sec{font-size:16.5px;margin:26px 0 10px;padding-left:12px;border-left:3px solid var(--accent);line-height:1.3}
h4{font-size:14.5px;margin:18px 0 8px;color:#cfe0f7}
p{margin:9px 0}
ul,ol{margin:9px 0;padding-left:22px}
li{margin:5px 0}
code.inl{font-family:var(--mono);font-size:13px;background:#101c31;border:1px solid var(--line);padding:1.5px 6px;border-radius:6px;color:#9fe8ff}
.kbd{font-family:var(--mono);font-size:11.5px;background:#16233c;border:1px solid var(--line2);border-bottom-width:2px;padding:1px 6px;border-radius:6px;color:#c9d8ef}
mark{background:rgba(255,180,84,.18);color:#ffd79a;padding:0 4px;border-radius:4px}
.hl-t{color:var(--accent);font-weight:600}
.hl-p{color:var(--accent2);font-weight:600}
.hl-o{color:var(--accent3);font-weight:600}

.note,.warn,.tip{border-radius:10px;padding:12px 15px;margin:14px 0;font-size:14px;border:1px solid;position:relative}
.note{background:rgba(90,169,255,.08);border-color:rgba(90,169,255,.3)}
.warn{background:rgba(255,107,129,.08);border-color:rgba(255,107,129,.3)}
.tip{background:rgba(61,220,151,.08);border-color:rgba(61,220,151,.3)}
.note b,.warn b,.tip b{display:block;margin-bottom:4px}
.note b{color:var(--blue)} .warn b{color:var(--danger)} .tip b{color:var(--ok)}

table.tb{width:100%;border-collapse:collapse;margin:14px 0;font-size:13.5px}
table.tb th,table.tb td{border:1px solid var(--line);padding:8px 12px;text-align:left}
table.tb th{background:#132038;color:#cfe0f7;font-weight:600;font-size:13px;letter-spacing:.3px}
table.tb tr:nth-child(even) td{background:rgba(255,255,255,.018)}
table.tb td.mono{font-family:var(--mono);color:#9fe8ff;white-space:nowrap}
.tb-wrap{overflow-x:auto}

/* ============ 首页 ============ */
.hero{padding:34px 8px 10px}
.hero h1{font-size:38px;line-height:1.25;margin:0 0 12px;letter-spacing:-.5px}
.hero h1 .g{background:linear-gradient(100deg,var(--accent),var(--accent2) 60%,#ff9ad5);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--dim);font-size:16px;max-width:760px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:14px;margin-top:18px}
.tile{background:linear-gradient(160deg,rgba(20,31,54,.95),rgba(12,19,34,.95));border:1px solid var(--line);
  border-radius:13px;padding:16px 17px;cursor:pointer;transition:.18s;position:relative;overflow:hidden}
.tile:hover{transform:translateY(-3px);border-color:var(--line2);box-shadow:0 14px 30px rgba(0,0,0,.4)}
.tile .t-ico{font-size:22px}
.tile b{display:block;margin:7px 0 3px;font-size:15.5px}
.tile span{color:var(--dim);font-size:12.8px;line-height:1.6;display:block}
.tile .o{position:absolute;right:12px;top:12px;font-family:var(--mono);font-size:11px;color:var(--dim2)}
.tile::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--accent),var(--accent2));opacity:0;transition:.2s}
.tile:hover::after{opacity:1}

/* ============ 实验室（动画台） ============ */
.lab{border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(180deg,#0d1729,#0a1120);margin:16px 0 22px;overflow:hidden}
.lab-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:rgba(19,32,56,.6);flex-wrap:wrap}
.lab-bar .lab-title{font-size:13px;font-weight:600;color:#cfe0f7;letter-spacing:.3px}
.lab-bar .lab-title::before{content:"▶";color:var(--accent);font-size:9px;margin-right:7px;vertical-align:2px}
.lab-tools{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}
.lab-stage{position:relative}
.lab-view{position:relative;overflow:hidden;padding:20px 18px;min-height:220px;display:flex;align-items:center;justify-content:center}
.lab-view .fx{position:absolute;inset:0;pointer-events:none}
.lab-explain{display:flex;gap:11px;align-items:flex-start;padding:11px 16px;border-top:1px dashed var(--line);
  background:rgba(9,15,27,.72);font-size:13.8px;min-height:46px}
.lab-explain .stepno{flex:0 0 auto;font-family:var(--mono);font-size:11px;color:var(--accent);background:rgba(56,217,208,.12);
  border:1px solid rgba(56,217,208,.3);border-radius:6px;padding:2px 7px;margin-top:2px}
.lab-explain .steptext{color:#d6e3f7}
.lab-ctrl{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line);background:rgba(19,32,56,.45);flex-wrap:wrap}
.btn{font-family:var(--sans);font-size:13px;color:#d6e3f7;background:#16233c;border:1px solid var(--line2);
  border-radius:9px;padding:6px 13px;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{background:#1e2f4f;border-color:#3f5586;transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:linear-gradient(135deg,var(--accent),#2bb3c9);color:#04121a;border-color:transparent;font-weight:700}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}
.speed{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);margin-left:6px}
.speed input{width:96px;accent-color:var(--accent)}
.lab-count{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--dim2)}
.step-list{list-style:none;margin:0;padding:0;max-height:0;overflow:hidden;transition:max-height .3s;border-top:0 solid var(--line)}
.step-list.open{max-height:340px;overflow-y:auto;border-top:1px solid var(--line)}
.step-item{display:flex;gap:10px;padding:7px 16px;font-size:13px;color:var(--dim);cursor:pointer;border-bottom:1px solid rgba(34,48,77,.5)}
.step-item:hover{background:#101c31;color:var(--text)}
.step-item.active{background:linear-gradient(90deg,rgba(56,217,208,.12),transparent);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.step-item .sn{font-family:var(--mono);font-size:11px;color:var(--dim2);min-width:20px}

/* ---- 动画通用元素 ---- */
.cell{min-width:48px;height:48px;display:grid;place-items:center;border-radius:10px;font-family:var(--mono);font-size:15px;
  background:#152444;border:1.5px solid #2c4270;color:#e7eefb;transition:.28s cubic-bezier(.4,1.4,.5,1);position:relative}
.cell.dim{opacity:.35}
.cell.hl{background:linear-gradient(180deg,#ffe08a,#ffb454);color:#2b1a00;border-color:#ffd479;transform:translateY(-6px) scale(1.06);box-shadow:0 10px 22px rgba(255,180,84,.32)}
.cell.hl2{background:linear-gradient(180deg,#7ef0e6,#38d9d0);color:#052a28;border-color:#8ff3ea;transform:translateY(-6px) scale(1.06);box-shadow:0 10px 22px rgba(56,217,208,.3)}
.cell.hl3{background:linear-gradient(180deg,#c4b5fd,#8b7cf6);color:#1a0f3a;border-color:#c9bdfd;transform:translateY(-6px) scale(1.06)}
.cell.bad{background:linear-gradient(180deg,#ff9aa8,#ff6b81);color:#3a0511;border-color:#ffb3bf}
.cell.ok{background:linear-gradient(180deg,#7bf0bd,#3ddc97);color:#03291a;border-color:#9bf5cd}
.cell.empty{background:transparent;border-style:dashed;border-color:#2a3854;color:#3d5075}
.cell.pop{animation:pop .34s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
.cell .lbl{position:absolute;bottom:-19px;left:0;right:0;text-align:center;font-size:10.5px;color:var(--dim2);font-family:var(--mono)}
.row{display:flex;gap:10px;align-items:center;position:relative}
.col{display:flex;flex-direction:column;gap:9px;align-items:center;position:relative}
.ptr{position:absolute;font-family:var(--mono);font-size:11.5px;color:var(--accent3);transition:transform .34s cubic-bezier(.4,1.1,.4,1);white-space:nowrap;pointer-events:none;z-index:5}
.ptr::after{content:"▲";display:block;text-align:center;font-size:9px;line-height:1;margin-top:1px}
.ptr.blue{color:var(--blue)} .ptr.purple{color:var(--accent2)} .ptr.green{color:var(--ok)}
.node{display:flex;align-items:stretch;border-radius:10px;overflow:hidden;border:1.5px solid #2c4270;background:#152444;
  transition:.3s cubic-bezier(.4,1.2,.4,1);font-family:var(--mono);font-size:14px;position:relative}
.node .v{padding:10px 14px;min-width:46px;text-align:center;display:grid;place-items:center}
.node .n{padding:10px 10px;min-width:36px;text-align:center;display:grid;place-items:center;background:#0f1a30;color:var(--dim2);font-size:12px;border-left:1.5px solid #2c4270}
.node.hl{background:linear-gradient(180deg,#ffe08a,#ffb454);color:#2b1a00;border-color:#ffd479;transform:translateY(-5px);box-shadow:0 10px 22px rgba(255,180,84,.3)}
.node.hl .n{background:rgba(0,0,0,.14);color:#5a3a00;border-color:rgba(0,0,0,.2)}
.node.ok{background:linear-gradient(180deg,#7bf0bd,#3ddc97);color:#03291a;border-color:#9bf5cd}
.node.ok .n{background:rgba(0,0,0,.12);color:#0a4530;border-color:rgba(0,0,0,.15)}
.node.dim{opacity:.32}
.node.enter{animation:pop .34s cubic-bezier(.2,1.6,.4,1)}
.node.exit{animation:out .3s forwards}
@keyframes out{to{transform:scale(.6);opacity:0}}
.arrow{color:#3f5586;font-size:15px;font-family:var(--mono);transition:.3s}
.arrow.on{color:var(--accent)}

.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12.5px;padding:4px 10px;border-radius:999px;
  background:#152444;border:1px solid #2c4270;color:#cfe0f7}
.chip.on{background:rgba(56,217,208,.16);border-color:var(--accent);color:#a9f6f0}
.chip.warm{background:rgba(255,180,84,.15);border-color:var(--accent3);color:#ffd79a}

.bar{width:34px;border-radius:6px 6px 0 0;background:linear-gradient(180deg,#5aa9ff,#2c4270);transition:.3s;position:relative}
.bar span{position:absolute;top:-19px;left:0;right:0;text-align:center;font-family:var(--mono);font-size:11px;color:var(--dim)}
.bars{display:flex;align-items:flex-end;gap:6px;height:190px;padding-bottom:24px}

.svgwrap{position:relative;width:100%}
svg.viz{display:block;margin:0 auto;overflow:visible}
svg.viz .lnk{stroke:#2e3f63;stroke-width:2;transition:.3s}
svg.viz .lnk.on{stroke:var(--accent);stroke-width:3}
svg.viz .lnk.path{stroke:var(--accent3);stroke-width:3.5}
svg.viz .nd circle{fill:#152444;stroke:#3a5285;stroke-width:2;transition:.3s}
svg.viz .nd text{fill:#e7eefb;font-family:var(--mono);font-size:13px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
svg.viz .nd.vis circle{fill:#4a6bb5;stroke:#8fb4ff}
svg.viz .nd.cur circle{fill:#ffb454;stroke:#ffd479}
svg.viz .nd.cur text{fill:#2b1a00}
svg.viz .nd.done circle{fill:#3ddc97;stroke:#9bf5cd}
svg.viz .nd.done text{fill:#04291a}
svg.viz .nd.open circle{fill:#8b7cf6;stroke:#c4b5fd}
svg.viz .nd.bad circle{fill:#ff6b81;stroke:#ffb0bd}
svg.viz g.nd{transition:transform .4s cubic-bezier(.4,1.2,.4,1);cursor:default}
svg.viz g.nd.enter{animation:fadein .42s ease}
@keyframes fadein{from{opacity:0}}
svg.viz .w{fill:none;stroke:#3ddc97;stroke-width:3;stroke-dasharray:6 5;opacity:.85}
svg.viz .w.hot{stroke:#ffb454}

.stackbox{display:flex;flex-direction:column-reverse;gap:8px;align-items:center;min-height:210px;justify-content:flex-start}
.qbox{display:flex;gap:8px;align-items:center}

/* ============ 代码块 ============ */
.codebox{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:14px 0;background:var(--code-bg)}
.codebar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#0d1626;border-bottom:1px solid var(--line)}
.codebar .fname{font-family:var(--mono);font-size:12px;color:var(--dim)}
.codebar .lang{font-family:var(--mono);font-size:10.5px;padding:2px 7px;border-radius:5px;background:rgba(139,124,246,.16);color:#c4b5fd;border:1px solid rgba(139,124,246,.3)}
.codebar .sp{flex:1}
.copybtn{font-family:var(--sans);font-size:11.5px;padding:3px 10px;border-radius:7px;border:1px solid var(--line2);background:#16233c;color:#cfe0f7;cursor:pointer}
.copybtn:hover{background:#1e2f4f}
.copybtn.ok{background:rgba(61,220,151,.18);border-color:var(--ok);color:#9bf5cd}
pre.code{margin:0;padding:14px 16px;overflow-x:auto;font-family:var(--mono);font-size:13px;line-height:1.7;tab-size:2}
pre.code code{font-family:inherit;color:#d9e6fb}
.tok-kw{color:#ff79c6} .tok-str{color:#a5e88a} .tok-com{color:#5b7099;font-style:italic}
.tok-num{color:#ffb454} .tok-fn{color:#7fd3ff} .tok-bi{color:#8b7cf6} .tok-op{color:#9fb4d8} .tok-cls{color:#4be0d0}
.codetabs{display:flex;gap:5px;padding:8px 12px 0;background:#0d1626}
.codetab{font-family:var(--mono);font-size:12px;padding:6px 13px;border-radius:8px 8px 0 0;border:1px solid transparent;
  border-bottom:none;background:transparent;color:var(--dim);cursor:pointer}
.codetab.active{background:var(--code-bg);border-color:var(--line);color:#9fe8ff}
.pane{display:none} .pane.active{display:block}
/* ---- 分步代码：语言切换 + 步骤块 ---- */
.codelang{display:flex;align-items:center;gap:7px;padding:11px 14px;background:#0d1626;
  border:1px solid var(--line);border-bottom:none;border-radius:12px 12px 0 0;flex-wrap:wrap}
.codelang .cl-label{font-size:12px;color:var(--dim2);margin-right:3px;letter-spacing:.5px}
.langtab{font-family:var(--mono);font-size:13px;padding:5px 15px;border-radius:9px;border:1px solid var(--line2);
  background:#101a2e;color:var(--dim);cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:7px}
.langtab i{font-style:normal;font-size:10.5px;opacity:.65;background:rgba(255,255,255,.08);padding:0 5px;border-radius:5px}
.langtab:hover{color:var(--text);border-color:#3f5586;transform:translateY(-1px)}
.langtab.active{font-weight:700;color:#04121a}
.langtab[data-lang="c"].active{background:linear-gradient(135deg,#7cb6ff,#3b6fd4);color:#fff;border-color:transparent}
.langtab[data-lang="cpp"].active{background:linear-gradient(135deg,#5ce6dd,#1f9e97);color:#04211f;border-color:transparent}
.langtab[data-lang="rs"].active{background:linear-gradient(135deg,#ffc078,#e07b1f);color:#2b1a00;border-color:transparent}
.langtab.active i{background:rgba(0,0,0,.16);opacity:.8}
.codelang .sp{flex:1}
.cl-copy{font-size:12px !important;padding:5px 12px !important}
.stepblocks{border:1px solid var(--line);border-top:none;border-radius:0 0 14px 14px;
  background:linear-gradient(180deg,#0b1120,#080d19);padding:16px 16px 6px;margin:0 0 20px}
.stepgroup.off{display:none}
.stepgroup{position:relative}
.stepgroup::before{content:"";position:absolute;left:10px;top:38px;bottom:34px;width:2px;border-radius:2px;
  background:linear-gradient(180deg,rgba(56,217,208,.55),rgba(139,124,246,.22) 60%,transparent)}
.sg-hint{font-size:12.5px;color:var(--dim2);margin:0 0 15px 2px;font-family:var(--mono)}
.sg-hint b{color:var(--accent)}
.cstep{position:relative;margin-bottom:18px}
.cstep:last-child{margin-bottom:8px}
.cstep-head{display:flex;align-items:baseline;gap:9px;margin-bottom:8px;flex-wrap:wrap}

<script>
/* 教学代码数据 - 由 build 目录自动生成，请勿手改 */
window.DSV_CODE_DATA = {"array":{"c":{"file":"array.c","steps":[{"title":"头文件与数据结构","note":"动态数组用一个指针加 size、capacity 两个计数表示","code":"#include <stdio.h>\n#include <stdlib.h>\n\ntypedef struct\n{\n    int* data;      // 指向堆上申请的连续内存\n    int size;       // 已经放了多少个元素\n    int capacity;   // 一共申请了多少个位置\n} MyArray;"},{"title":"初始化与销毁","note":"一开始不申请内存，等真正插入时再扩容","code":"void arrayInit(MyArray* a)\n{\n    a->data = NULL;\n    a->size = 0;\n    a->capacity = 0;\n}\n\nvoid arrayFree(MyArray* a)\n{\n    free(a->data);   // 堆内存谁申请谁释放\n    a->data = NULL;\n    a->size = 0;\n    a->capacity = 0;\n}"},{"title":"尾部追加 pushBack（含 2 倍扩容）","note":"容量不够就按 2 倍申请新内存","code":"void arrayPushBack(MyArray* a, int value)\n{\n    // size 追上 capacity 说明满了，先把容量翻倍\n    if (a->size == a->capacity)\n    {\n        int newCapacity = (a->capacity == 0) ? 4 : a->capacity * 2;\n        int* newData = (int*)realloc(a->data, newCapacity * sizeof(int));\n        if (newData == NULL)\n        {\n            printf(\"error! : realloc failed!\\n\");\n            return;\n        }\n        a->data = newData;\n        a->capacity = newCapacity;\n    }\n\n    a->data[a->size] = value;\n    a->size++;\n}"},{"title":"按下标读写 get / set","note":"先检查下标是否越界，越界就打印错误并返回","code":"int arrayGet(MyArray* a, int pos)\n{\n    if (pos < 0 || pos >= a->size)\n    {\n        printf(\"error! : index out of range!\\n\");\n        return -1;\n    }\n    return a->data[pos];\n}\n\nvoid arraySet(MyArray* a, int pos, int value)\n{\n    if (pos < 0 || pos >= a->size)\n    {\n        printf(\"error! : index out of range!\\n\");\n        return;\n    }\n    a->data[pos] = value;\n}"},{"title":"中间插入 insert","note":"先追加到末尾腾出空间，再把 pos 之后的元素从后往前挪一格","code":"void arrayInsert(MyArray* a, int pos, int value)\n{\n    if (pos < 0 || pos > a->size)\n    {\n        printf(\"error! : insert position out of range!\\n\");\n        return;\n    }\n\n    arrayPushBack(a, value);   // 复用扩容逻辑，新元素先放在最后\n\n    // 从后往前搬：每个元素挪到它后面那格，不会盖掉还没搬的数据\n    for (int i = a->size - 1; i > pos; i--)\n    {\n        a->data[i] = a->data[i - 1];\n    }\n    a->data[pos] = value;\n}"},{"title":"删除 remove","note":"把 pos 之后的元素从前往后搬一格，覆盖掉要删的那个","code":"void arrayRemove(MyArray* a, int pos)\n{\n    if (pos < 0 || pos >= a->size)\n    {\n        printf(\"error! : remove position out of range!\\n\");\n        return;\n    }\n\n    // 从前往后搬是安全的：左边的空位正好等着接右边的元素\n    for (int i = pos; i < a->size - 1; i++)\n    {\n        a->data[i] = a->data[i + 1];\n    }\n    a->size--;\n}"},{"title":"main：跑一遍","note":"依次演示扩容、读写、插入和删除","code":"void arrayPrint(char* tag, MyArray* a)\n{\n    printf(\"%-20s size=%d capacity=%d [\", tag, a->size, a->capacity);\n    for (int i = 0; i < a->size; i++)\n    {\n        printf(\"%s%d\", i == 0 ? \"\" : \", \", a->data[i]);\n    }\n    printf(\"]\\n\");\n}\n\nint main(void)\n{\n    MyArray a;\n    arrayInit(&a);\n    arrayPrint(\"init\", &a);\n\n    for (int v = 1; v <= 5; v++)\n    {\n        arrayPushBack(&a, v * 10);   // 第 5 次会把容量从 4 扩到 8\n    }\n    arrayPrint(\"pushBack 10..50\", &a);\n\n    arraySet(&a, 2, 99);\n    printf(\"get(2) = %d\\n\", arrayGet(&a, 2));\n\n    arrayInsert(&a, 1, 7);\n    arrayPrint(\"insert(1, 7)\", &a);\n\n    arrayRemove(&a, 0);\n    arrayPrint(\"remove(0)\", &a);\n\n    arrayGet(&a, 100);\n    arrayRemove(&a, 100);\n\n    arrayFree(&a);\n    return 0;\n}"}]},"cpp":{"file":"array.cpp","steps":[{"title":"类声明与数据成员","note":"一个能自动扩容的 int 数组，size 是用了几个，capacity 是开了几个","code":"#include <iostream>\n\nclass MyArray\n{\npublic:\n    MyArray();\n    ~MyArray();\n    void pushBack(int value);\n    int  get(int pos);\n    void set(int pos, int value);\n    void insert(int pos, int value);\n    void remove(int pos);\n    void popBack();\n    void print();\n\nprivate:\n    int* arr;        // 真正存数据的数组\n    int  size;       // 已经放了几个元素\n    int  capacity;   // 最多能放几个元素\n\n    void grow();     // 装满了就把容量翻倍\n};"},{"title":"构造与析构","note":"构造时开一块内存，析构时把这块内存还回去","code":"MyArray::MyArray()\n{\n    capacity = 4;                // 一开始先开 4 个格子\n    size = 0;\n    arr = new int[capacity];\n}\n\nMyArray::~MyArray()\n{\n    delete[] arr;                // new[] 出来的要用 delete[] 还，不然内存泄漏\n}"},{"title":"尾部追加 pushBack（含 2 倍扩容）","note":"满了就新开一块两倍大的内存，把旧数据搬过去","code":"void MyArray::grow()\n{\n    int newCapacity = capacity * 2;\n    int* bigger = new int[newCapacity];\n\n    for (int i = 0; i < size; i++)    // 把旧数组里的元素逐个搬到新数组\n    {\n        bigger[i] = arr[i];\n    }\n\n    delete[] arr;                     // 旧的那块内存不要了\n    arr = bigger;\n    capacity = newCapacity;\n}\n\nvoid MyArray::pushBack(int value)\n{\n    if (size >= capacity)\n    {\n        grow();                       // 没地方了，先扩容\n    }\n\n    arr[size] = value;                // 写在最后一个有效元素的后面\n    size++;\n}"},{"title":"按下标读写 get / set","note":"数组最大的好处就是这两步都是 O(1)","code":"int MyArray::get(int pos)\n{\n    if (pos < 0 || pos >= size)\n    {\n        std::cout << \"error! : index out of range!\" << std::endl;\n        return -1;\n    }\n\n    return arr[pos];\n}\n\nvoid MyArray::set(int pos, int value)\n{\n    if (pos < 0 || pos >= size)\n    {\n        std::cout << \"error! : index out of range!\" << std::endl;\n        return;\n    }\n\n    arr[pos] = value;\n}"},{"title":"中间插入 insert","note":"先把 pos 后面的元素统统往后挪一格，腾出位置再写","code":"void MyArray::insert(int pos, int value)\n{\n    if (pos < 0 || pos > size)\n    {\n        std::cout << \"error! : insert position out of range!\" << std::endl;\n        return;\n    }\n\n    if (size >= capacity)\n    {\n        grow();\n    }\n\n    // 关键：必须从后往前搬，否则前面的元素会被后面的覆盖掉\n    for (int i = size; i > pos; i--)\n    {\n        arr[i] = arr[i - 1];\n    }\n\n    arr[pos] = value;\n    size++;\n}"},{"title":"删除 remove","note":"把 pos 后面的元素统统往前挪一格，size 减一","code":"void MyArray::remove(int pos)\n{\n    if (pos < 0 || pos >= size)\n    {\n        std::cout << \"error! : remove position out of range!\" << std::endl;\n        return;\n    }\n\n    // 从前往后搬，后面的元素覆盖前面的\n    for (int i = pos; i < size - 1; i++)\n    {\n        arr[i] = arr[i + 1];\n    }\n\n    size--;      // 最后一格逻辑上不要了。不用清零，下次 pushBack 会覆盖它\n}\n\nvoid MyArray::popBack()\n{\n    if (size > 0)\n    {\n        size--;\n    }\n}\n\nvoid MyArray::print()\n{\n    std::cout << \"[\";\n    for (int i = 0; i < size; i++)\n    {\n        std::cout << arr[i];\n        if (i != size - 1)\n        {\n            std::cout << \", \";\n        }\n    }\n    std::cout << \"]  size=\" << size << \"  capacity=\" << capacity << std::endl;\n}"},{"title":"main：跑一遍","note":"追加到触发扩容，再演示中间插入和删除","code":"int main()\n{\n    MyArray a;\n\n    a.pushBack(10);\n    a.pushBack(20);\n    a.pushBack(30);\n    a.pushBack(40);          // 到这里 4 个格子正好用完\n    a.pushBack(50);          // 第 5 个触发扩容：capacity 从 4 变成 8\n    a.print();\n\n    a.insert(1, 99);         // 在下标 1 插队\n    a.print();\n\n    a.remove(0);             // 删掉下标 0\n    a.print();\n\n    a.set(2, 77);\n    std::cout << \"get(2) = \" << a.get(2) << std::endl;\n\n    std::cout << \"越界访问会怎样：\" << std::endl;\n    a.get(100);\n\n    return 0;\n}"}]},"rs":{"file":"array.rs","steps":[{"title":"数据结构","note":"Rust 里 Vec 已经把\"连续内存 + 长度 + 容量\"包好了，我们先站在它肩上","code":"pub struct MyArray\n{\n    data: Vec<i32>,     // Vec 帮我们管内存和扩容\n}"},{"title":"构造与析构","note":"Rust 不用写析构函数，Vec 离开作用域会自动释放内存","code":"impl MyArray\n{\n    pub fn new() -> MyArray\n    {\n        MyArray { data: Vec::new() }\n    }\n\n    pub fn new_with_capacity(capacity: usize) -> MyArray\n    {\n        MyArray { data: Vec::with_capacity(capacity) }\n    }\n\n    pub fn len(&self) -> usize\n    {\n        self.data.len()\n    }\n\n    pub fn capacity(&self) -> usize\n    {\n        self.data.capacity()\n    }\n}"},{"title":"尾部追加 push_back","note":"满了 Vec 会按倍数扩容，均摊 O(1)","code":"impl MyArray\n{\n    pub fn push_back(&mut self, value: i32)\n    {\n        self.data.push(value);\n        // 想知道扩容什么时候发生，看 main 里打印的 capacity 就知道了\n    }\n}"},{"title":"按下标读写 get / set","note":"越界时返回 None，而不是读脏内存","code":"impl MyArray\n{\n    pub fn get(&self, pos: usize) -> Option<i32>\n    {\n        if pos >= self.data.len()\n        {\n            return None;            // 越界了，没有这个元素\n        }\n\n        Some(self.data[pos])\n    }\n\n    pub fn set(&mut self, pos: usize, value: i32) -> bool\n    {\n        if pos >= self.data.len()\n        {\n            println!(\"error! : index out of range!\");\n            return false;\n        }\n\n        self.data[pos] = value;\n        true\n    }\n}"},{"title":"中间插入 insert","note":"先在末尾加一格腾出空间，再从后往前搬","code":"impl MyArray\n{\n    pub fn insert(&mut self, pos: usize, value: i32)\n    {\n        if pos > self.data.len()\n        {\n            println!(\"error! : insert position out of range!\");\n            return;\n        }\n\n        self.data.push(0);              // 先撑出一格来，长度加一\n        let mut i = self.data.len() - 1;\n\n        while i > pos                   // 关键：从后往前搬\n        {\n            self.data[i] = self.data[i - 1];\n            i -= 1;\n        }\n\n        self.data[pos] = value;\n    }\n}"},{"title":"删除 remove","note":"从前往后搬，把后面的元素往前覆盖","code":"impl MyArray\n{\n    pub fn remove(&mut self, pos: usize) -> Option<i32>\n    {\n        if pos >= self.data.len()\n        {\n            println!(\"error! : remove position out of range!\");\n            return None;\n        }\n\n        let removed = self.data[pos];\n        let mut i = pos;\n\n        while i + 1 < self.data.len()   // 从前往后搬\n        {\n            self.data[i] = self.data[i + 1];\n            i += 1;\n        }\n\n        self.data.pop();                // 最后一格多出来了，丢掉\n        Some(removed)\n    }\n\n    pub fn pop_back(&mut self) -> Option<i32>\n    {\n        self.data.pop()\n    }\n}"},{"title":"main：跑一遍","note":"盯着 capacity 看它怎么从 0 变成 4、8","code":"fn main()\n{\n    let mut a = MyArray::new();\n\n    for i in 1..=5\n    {\n        a.push_back(i * 10);\n        println!(\"push_back({}) -> len={} capacity={}\", i * 10, a.len(), a.capacity());\n    }\n\n    a.insert(1, 99);\n    println!(\"insert(1, 99) 之后 = {:?}\", a.data);\n\n    let removed = a.remove(0);\n    println!(\"remove(0) 拿回了 {:?}，剩下 = {:?}\", removed, a.data);\n\n    a.set(2, 77);\n    println!(\"get(2) = {:?}\", a.get(2));\n\n    println!(\"越界访问 get(100) = {:?}\", a.get(100));\n}"}]}},"string":{"c":{"file":"string.c","steps":[{"title":"顺序串结构与初始化","note":"用定长字符数组存字符，length 记实际长度","code":"#include <stdio.h>\n\n#define MAX_SIZE 256\n\ntypedef struct\n{\n    char data[256];   // 字符数组，末尾留一个位置放 '\\0'\n    int length;       // 当前串长，不把 '\\0' 算进去\n} SString;\n\nvoid strInit(SString* s)\n{\n    s->length = 0;\n    s->data[0] = '\\0';\n}"},{"title":"串赋值与比较","note":"逐字符拷进来算长度，比较时返回第一个不同字符的差","code":"void strAssign(SString* s, const char* text)\n{\n    int len = 0;\n\n    while (text[len] != '\\0')\n    {\n        len++;\n    }\n\n    if (len > MAX_SIZE - 1)\n    {\n        printf(\"error! : string too long!\\n\");\n        return;\n    }\n\n    for (int i = 0; i < len; i++)\n    {\n        s->data[i] = text[i];\n    }\n    s->data[len] = '\\0';\n    s->length = len;\n}\n\nvoid strPrint(SString* s)\n{\n    printf(\"%s\", s->data);   // data 始终以 '\\0' 收尾\n}\n\nint strCompare(SString* s1, SString* s2)\n{\n    int i = 0;\n\n    while (i < s1->length && i < s2->length)\n    {\n        if (s1->data[i] != s2->data[i])\n        {\n            return s1->data[i] - s2->data[i];   // 第一个不同的字符决定大小\n        }\n        i++;\n    }\n\n    return s1->length - s2->length;   // 前面都一样，长的那个更大\n}"},{"title":"串连接与求子串","note":"连接前先算总长防溢出，求子串按 0 起的下标切","code":"void strConcat(SString* result, SString* s1, SString* s2)\n{\n    if (s1->length + s2->length > MAX_SIZE - 1)\n    {\n        printf(\"error! : concat result too long!\\n\");\n        return;\n    }\n\n    int i = 0;\n    for (i = 0; i < s1->length; i++)\n    {\n        result->data[i] = s1->data[i];\n    }\n    for (int j = 0; j < s2->length; j++)\n    {\n        result->data[i + j] = s2->data[j];\n    }\n\n    result->length = s1->length + s2->length;\n    result->data[result->length] = '\\0';\n}\n\nvoid strSub(SString* sub, SString* s, int pos, int len)\n{\n    if (pos < 0 || len < 0 || pos + len > s->length)\n    {\n        printf(\"error! : substring range out of bounds!\\n\");\n        sub->length = 0;\n        sub->data[0] = '\\0';\n        return;\n    }\n\n    for (int i = 0; i < len; i++)\n    {\n        sub->data[i] = s->data[pos + i];   // 从 pos 开始连续取 len 个\n    }\n    sub->length = len;\n    sub->data[len] = '\\0';\n}"},{"title":"朴素匹配 BF","note":"失配时 i 退回本轮起点的下一格，j 归零重比","code":"int bfMatch(SString* text, SString* pattern)\n{\n    int i = 0;\n    int j = 0;\n\n    while (i < text->length && j < pattern->length)\n    {\n        if (text->data[i] == pattern->data[j])\n        {\n            i++;\n            j++;\n        }\n        else\n        {\n            i = i - j + 1;   // 本轮起点是 i-j，下一轮从它后面一格开始\n            j = 0;\n        }\n    }\n\n    if (j == pattern->length)\n    {\n        return i - pattern->length;   // 全比完了，起点就是 i 减去模式串长度\n    }\n    return -1;\n}"},{"title":"求 next 数组","note":"next[0] = -1 当哨兵，失配时 j 跳到 next[j]","code":"void getNext(SString* pattern, int next[])\n{\n    int i = 0;\n    int j = -1;\n    next[0] = -1;\n\n    while (i < pattern->length - 1)\n    {\n        if (j == -1 || pattern->data[i] == pattern->data[j])\n        {\n            i++;\n            j++;\n            next[i] = j;   // 多匹配一位，next 值就多 1\n        }\n        else\n        {\n            j = next[j];   // 退到更短的公共前后缀继续试\n        }\n    }\n}"},{"title":"KMP 匹配","note":"i 不回退，失配时只把 j 拉到 next[j]","code":"int kmpMatch(SString* text, SString* pattern, int next[])\n{\n    int i = 0;\n    int j = 0;\n\n    while (i < text->length && j < pattern->length)\n    {\n        if (j == -1 || text->data[i] == pattern->data[j])\n        {\n            i++;\n            j++;   // j 为 -1 时也走这里，相当于主串和模式串都从头再来\n        }\n        else\n        {\n            j = next[j];   // 主串指针 i 不动，只挪模式串\n        }\n    }\n\n    if (j == pattern->length)\n    {\n        return i - pattern->length;\n    }\n    return -1;\n}"},{"title":"main：跑一遍","note":"先看连接、子串、比较，再跑 BF 与 KMP 并打印 next","code":"int main(void)\n{\n    SString text;\n    SString pattern;\n    SString s1;\n    SString s2;\n    SString s3;\n    SString sub;\n\n    strInit(&text);\n    strInit(&pattern);\n    strInit(&s1);\n    strInit(&s2);\n    strInit(&s3);\n    strInit(&sub);\n\n    strAssign(&s1, \"data\");\n    strAssign(&s2, \"structure\");\n    strConcat(&s3, &s1, &s2);\n    printf(\"concat  = \");\n    strPrint(&s3);\n    printf(\"\\n\");\n\n    strSub(&sub, &s3, 0, 4);\n    printf(\"sub     = \");\n    strPrint(&sub);\n    printf(\"\\n\");\n    printf(\"compare = %d\\n\", strCompare(&s1, &s2));\n\n    strAssign(&text, \"ababcabcacbab\");\n    strAssign(&pattern, \"abcac\");\n    printf(\"text    = %s\\n\", text.data);\n    printf(\"pattern = %s\\n\", pattern.data);\n\n    int bf = bfMatch(&text, &pattern);\n\n    int next[256];\n    getNext(&pattern, next);\n    printf(\"next    =\");\n    for (int i = 0; i < pattern.length; i++)\n    {\n        printf(\" %d\", next[i]);\n    }\n    printf(\"\\n\");\n\n    int kmp = kmpMatch(&text, &pattern, next);\n    printf(\"BF      = %d\\n\", bf);\n    printf(\"KMP     = %d\\n\", kmp);\n\n    return 0;\n}"}]},"cpp":{"file":"string.cpp","steps":[{"title":"顺序串结构与初始化","note":"用定长字符数组存字符，length 记实际长度","code":"#include <iostream>\n\nclass SString\n{\npublic:\n    SString();\n    void assign(const char* text);\n    void printTagged(const char* tag);\n    int compare(SString* other);\n    void concat(SString* s1, SString* s2);\n    void subString(SString* s, int pos, int len);\n    int bfMatch(SString* pattern);\n    void getNext(int next[]);\n    int kmpMatch(SString* pattern, int next[]);\n    int getLength();\n\nprivate:\n    char data[256];   // 字符数组，末尾留一个位置放 '\\0'\n    int length;       // 当前串长，不把 '\\0' 算进去\n};\n\nSString::SString()\n{\n    length = 0;\n    data[0] = '\\0';\n}"},{"title":"串赋值与比较","note":"逐字符拷进来算长度，比较时返回第一个不同字符的差","code":"void SString::assign(const char* text)\n{\n    int len = 0;\n\n    while (text[len] != '\\0')\n    {\n        len++;\n    }\n\n    if (len > 255)\n    {\n        std::cout << \"error! : string too long!\" << std::endl;\n        return;\n    }\n\n    for (int i = 0; i < len; i++)\n    {\n        data[i] = text[i];\n    }\n    data[len] = '\\0';\n    length = len;\n}\n\nvoid SString::printTagged(const char* tag)\n{\n    std::cout << tag << data << std::endl;   // data 始终以 '\\0' 收尾\n}\n\nint SString::compare(SString* other)\n{\n    int i = 0;\n\n    while (i < length && i < other->length)\n    {\n        if (data[i] != other->data[i])\n        {\n            return data[i] - other->data[i];   // 第一个不同的字符决定大小\n        }\n        i++;\n    }\n\n    return length - other->length;   // 前面都一样，长的那个更大\n}\n\nint SString::getLength()\n{\n    return length;\n}"},{"title":"串连接与求子串","note":"连接前先算总长防溢出，求子串按 0 起的下标切","code":"void SString::concat(SString* s1, SString* s2)\n{\n    if (s1->length + s2->length > 255)\n    {\n        std::cout << \"error! : concat result too long!\" << std::endl;\n        return;\n    }\n\n    int i = 0;\n    for (i = 0; i < s1->length; i++)\n    {\n        data[i] = s1->data[i];\n    }\n    for (int j = 0; j < s2->length; j++)\n    {\n        data[i + j] = s2->data[j];\n    }\n\n    length = s1->length + s2->length;\n    data[length] = '\\0';\n}\n\nvoid SString::subString(SString* s, int pos, int len)\n{\n    if (pos < 0 || len < 0 || pos + len > s->length)\n    {\n        std::cout << \"error! : substring range out of bounds!\" << std::endl;\n        length = 0;\n        data[0] = '\\0';\n        return;\n    }\n\n    for (int i = 0; i < len; i++)\n    {\n        data[i] = s->data[pos + i];   // 从 pos 开始连续取 len 个\n    }\n    length = len;\n    data[len] = '\\0';\n}"},{"title":"朴素匹配 BF","note":"失配时 i 退回本轮起点的下一格，j 归零重比","code":"int SString::bfMatch(SString* pattern)\n{\n    int i = 0;\n    int j = 0;\n\n    while (i < length && j < pattern->length)\n    {\n        if (data[i] == pattern->data[j])\n        {\n            i++;\n            j++;\n        }\n        else\n        {\n            i = i - j + 1;   // 本轮起点是 i-j，下一轮从它后面一格开始\n            j = 0;\n        }\n    }\n\n    if (j == pattern->length)\n    {\n        return i - pattern->length;\n    }\n    return -1;\n}"},{"title":"求 next 数组","note":"next[0] = -1 当哨兵，失配时 j 跳到 next[j]","code":"void SString::getNext(int next[])\n{\n    int i = 0;\n    int j = -1;\n    next[0] = -1;\n\n    while (i < length - 1)\n    {\n        if (j == -1 || data[i] == data[j])\n        {\n            i++;\n            j++;\n            next[i] = j;   // 多匹配一位，next 值就多 1\n        }\n        else\n        {\n            j = next[j];   // 退到更短的公共前后缀继续试\n        }\n    }\n}"},{"title":"KMP 匹配","note":"i 不回退，失配时只把 j 拉到 next[j]","code":"int SString::kmpMatch(SString* pattern, int next[])\n{\n    int i = 0;\n    int j = 0;\n\n    while (i < length && j < pattern->length)\n    {\n        if (j == -1 || data[i] == pattern->data[j])\n        {\n            i++;\n            j++;   // j 为 -1 时也走这里，相当于两边都从头再来\n        }\n        else\n        {\n            j = next[j];   // 主串指针 i 不动，只挪模式串\n        }\n    }\n\n    if (j == pattern->length)\n    {\n        return i - pattern->length;\n    }\n    return -1;\n}"},{"title":"main：跑一遍","note":"先看连接、子串、比较，再跑 BF 与 KMP 并打印 next","code":"int main()\n{\n    SString text, pattern, s1, s2, s3, sub;\n\n    s1.assign(\"data\");\n    s2.assign(\"structure\");\n    s3.concat(&s1, &s2);\n    s3.printTagged(\"concat  = \");\n\n    sub.subString(&s3, 0, 4);\n    sub.printTagged(\"sub     = \");\n    std::cout << \"compare = \" << s1.compare(&s2) << std::endl;\n\n    text.assign(\"ababcabcacbab\");\n    pattern.assign(\"abcac\");\n    text.printTagged(\"text    = \");\n    pattern.printTagged(\"pattern = \");\n\n    int bf = text.bfMatch(&pattern);\n\n    int next[256];\n    pattern.getNext(next);\n    std::cout << \"next    =\";\n    for (int i = 0; i < pattern.getLength(); i++)\n    {\n        std::cout << \" \" << next[i];\n    }\n    std::cout << std::endl;\n\n    int kmp = text.kmpMatch(&pattern, next);\n    std::cout << \"BF      = \" << bf << std::endl;\n    std::cout << \"KMP     = \" << kmp << std::endl;\n\n    return 0;\n}"}]},"rs":{"file":"string.rs","steps":[{"title":"顺序串结构与初始化","note":"用 Vec<char> 存字符，length 记实际长度","code":"struct SString\n{\n    data: Vec<char>,   // 只放有效字符，不放结尾的 '\\0'\n    length: usize,     // 当前串长\n}\n\nimpl SString\n{\n    fn new() -> SString\n    {\n        SString { data: Vec::new(), length: 0 }\n    }\n}"},{"title":"串赋值与比较","note":"逐字符拷进来算长度，比较时返回第一个不同字符的差","code":"impl SString\n{\n    fn assign(&mut self, text: &str)\n    {\n        let len = text.chars().count();\n\n        if len > 255\n        {\n            println!(\"error! : string too long!\");\n            return;\n        }\n\n        self.data.clear();\n        for ch in text.chars()\n        {\n            self.data.push(ch);\n        }\n        self.length = len;\n    }\n\n    fn print_tagged(&self, tag: &str)\n    {\n        print!(\"{}\", tag);\n        for i in 0..self.length\n        {\n            print!(\"{}\", self.data[i]);\n        }\n        println!();\n    }\n\n    fn compare(&self, other: &SString) -> i32\n    {\n        let mut i = 0;\n\n        while i < self.length && i < other.length\n        {\n            if self.data[i] != other.data[i]\n            {\n                return self.data[i] as i32 - other.data[i] as i32;\n            }\n            i += 1;\n        }\n\n        self.length as i32 - other.length as i32\n    }\n}"},{"title":"串连接与求子串","note":"连接前先算总长防溢出，求子串按 0 起的下标切","code":"impl SString\n{\n    fn concat(&mut self, s1: &SString, s2: &SString)\n    {\n        if s1.length + s2.length > 255\n        {\n            println!(\"error! : concat result too long!\");\n            return;\n        }\n\n        self.data.clear();\n        for i in 0..s1.length\n        {\n            self.data.push(s1.data[i]);\n        }\n        for i in 0..s2.length\n        {\n            self.data.push(s2.data[i]);\n        }\n        self.length = self.data.len();\n    }\n\n    fn sub_string(&mut self, s: &SString, pos: usize, len: usize)\n    {\n        if pos + len > s.length\n        {\n            println!(\"error! : substring range out of bounds!\");\n            self.data.clear();\n            self.length = 0;\n            return;\n        }\n\n        self.data.clear();\n        for i in 0..len\n        {\n            self.data.push(s.data[pos + i]);   // 从 pos 开始连续取 len 个\n        }\n        self.length = len;\n    }\n}"},{"title":"朴素匹配 BF","note":"失配时 i 退回本轮起点的下一格，j 归零重比","code":"impl SString\n{\n    fn bf_match(&self, pattern: &SString) -> i32\n    {\n        let mut i: usize = 0;\n        let mut j: usize = 0;\n\n        while i < self.length && j < pattern.length\n        {\n            if self.data[i] == pattern.data[j]\n            {\n                i += 1;\n                j += 1;\n            }\n            else\n            {\n                i = i - j + 1;   // 本轮起点是 i-j，下一轮从它后面一格开始\n                j = 0;\n            }\n        }\n\n        if j == pattern.length\n        {\n            return (i - pattern.length) as i32;\n        }\n        -1\n    }\n}"},{"title":"求 next 数组","note":"next[0] = -1 当哨兵，失配时 j 跳到 next[j]","code":"impl SString\n{\n    fn get_next(&self, next: &mut Vec<i32>)\n    {\n        if self.length == 0\n        {\n            return;\n        }\n\n        let mut i: usize = 0;\n        let mut j: i32 = -1;\n        next[0] = -1;\n\n        while i < self.length - 1\n        {\n            if j == -1 || self.data[i] == self.data[j as usize]\n            {\n                i += 1;\n                j += 1;\n                next[i] = j;   // 多匹配一位，next 值就多 1\n            }\n            else\n            {\n                j = next[j as usize];   // 退到更短的公共前后缀继续试\n            }\n        }\n    }\n}"},{"title":"KMP 匹配","note":"i 不回退，失配时只把 j 拉到 next[j]","code":"impl SString\n{\n    fn kmp_match(&self, pattern: &SString, next: &[i32]) -> i32\n    {\n        let mut i: usize = 0;\n        let mut j: i32 = 0;\n\n        while i < self.length && j < pattern.length as i32\n        {\n            if j == -1 || self.data[i] == pattern.data[j as usize]\n            {\n                i += 1;\n                j += 1;   // j 为 -1 时也走这里，相当于两边都从头再来\n            }\n            else\n            {\n                j = next[j as usize];   // 主串指针 i 不动，只挪模式串\n            }\n        }\n\n        if j == pattern.length as i32\n        {\n            return (i - pattern.length) as i32;\n        }\n        -1\n    }\n}"},{"title":"main：跑一遍","note":"先看连接、子串、比较，再跑 BF 与 KMP 并打印 next","code":"fn main()\n{\n    let mut text = SString::new();\n    let mut pattern = SString::new();\n    let mut s1 = SString::new();\n    let mut s2 = SString::new();\n    let mut s3 = SString::new();\n    let mut sub = SString::new();\n    s1.assign(\"data\");\n    s2.assign(\"structure\");\n    s3.concat(&s1, &s2);\n    s3.print_tagged(\"concat  = \");\n\n    sub.sub_string(&s3, 0, 4);\n    sub.print_tagged(\"sub     = \");\n    println!(\"compare = {}\", s1.compare(&s2));\n\n    text.assign(\"ababcabcacbab\");\n    pattern.assign(\"abcac\");\n    text.print_tagged(\"text    = \");\n    pattern.print_tagged(\"pattern = \");\n\n    let bf = text.bf_match(&pattern);\n    let mut next = vec![0; pattern.length];\n    pattern.get_next(&mut next);\n    print!(\"next    =\");\n    for i in 0..next.len()\n    {\n        print!(\" {}\", next[i]);\n    }\n    println!();\n    let kmp = text.kmp_match(&pattern, &next);\n    println!(\"BF      = {}\", bf);\n    println!(\"KMP     = {}\", kmp);\n}"}]}},"linkedlist":{"c":{"file":"linkedlist.c","steps":[{"title":"节点定义","note":"每个节点存一个 int，外加指向下一个节点的指针","code":"#include <stdio.h>\n#include <stdlib.h>\n\ntypedef struct Node\n{\n    int data;\n    struct Node* next;\n} Node;\n\nNode* listCreateNode(int value)\n{\n    Node* p = (Node*)malloc(sizeof(Node));\n    if (p == NULL)\n    {\n        printf(\"error! : malloc failed!\\n\");\n        return NULL;\n    }\n    p->data = value;\n    p->next = NULL;\n    return p;\n}"},{"title":"头部插入 pushFront","note":"新节点直接插到最前面，一步到位 O(1)","code":"void listPushFront(Node** head, int value)\n{\n    Node* p = listCreateNode(value);\n    if (p == NULL)\n    {\n        return;\n    }\n    p->next = *head;   // 新节点的 next 指向原来的头\n    *head = p;         // 再让头指针指向新节点\n}"},{"title":"尾部插入 pushBack","note":"从头一路走到最后一个节点，再把新节点接上去","code":"void listPushBack(Node** head, int value)\n{\n    Node* p = listCreateNode(value);\n    if (p == NULL)\n    {\n        return;\n    }\n    if (*head == NULL)   // 空链表：新节点就是头\n    {\n        *head = p;\n        return;\n    }\n\n    Node* cur = *head;\n    // 循环到最后一个节点为止，它的 next 是 NULL\n    while (cur->next != NULL)\n    {\n        cur = cur->next;\n    }\n    cur->next = p;\n}"},{"title":"按值删除 remove","note":"用 prev 记住前一个节点，找到后让 prev->next 绕过它","code":"void listRemove(Node** head, int value)\n{\n    Node* prev = NULL;\n    Node* cur = *head;\n    while (cur != NULL && cur->data != value)\n    {\n        prev = cur;   // prev 始终停在 cur 的前一位\n        cur = cur->next;\n    }\n    if (cur == NULL)\n    {\n        printf(\"error! : value %d not found!\\n\", value);\n        return;\n    }\n    if (prev == NULL)\n    {\n        *head = cur->next;       // 删的是头节点，头指针往后移\n    }\n    else\n    {\n        prev->next = cur->next;  // 让前一个节点跳过 cur\n    }\n    free(cur);\n}"},{"title":"反转 reverse","note":"边走边把每个节点的 next 掉头，最后 head 指向原来的尾巴","code":"void listReverse(Node** head)\n{\n    Node* prev = NULL;\n    Node* cur = *head;\n    while (cur != NULL)\n    {\n        Node* next = cur->next;   // 先记下下一个，否则改完 next 就找不到了\n        cur->next = prev;\n        prev = cur;\n        cur = next;\n    }\n    *head = prev;\n}"},{"title":"释放整条链","note":"先存住下一个再 free 当前，避免访问已释放的内存","code":"void listFree(Node** head)\n{\n    Node* cur = *head;\n    while (cur != NULL)\n    {\n        Node* next = cur->next;\n        free(cur);\n        cur = next;\n    }\n    *head = NULL;\n}"},{"title":"main：跑一遍","note":"演示头插、尾插、删除、反转和释放","code":"void listPrint(char* tag, Node* head)\n{\n    printf(\"%-22s [\", tag);\n    Node* cur = head;\n    while (cur != NULL)\n    {\n        printf(\"%s%d\", cur == head ? \"\" : \" -> \", cur->data);\n        cur = cur->next;\n    }\n    printf(\"]\\n\");\n}\n\nint main(void)\n{\n    Node* head = NULL;\n\n    listPushFront(&head, 3);\n    listPushFront(&head, 2);\n    listPushFront(&head, 1);\n    listPrint(\"pushFront 3,2,1\", head);\n\n    listPushBack(&head, 4);\n    listPushBack(&head, 5);\n    listPrint(\"pushBack 4,5\", head);\n\n    listRemove(&head, 3);\n    listPrint(\"remove(3)\", head);\n    listRemove(&head, 42);   // 不存在的值会打印错误\n\n    listReverse(&head);\n    listPrint(\"reverse\", head);\n\n    listFree(&head);\n    printf(\"after free, head is NULL: %s\\n\", head == NULL ? \"yes\" : \"no\");\n    return 0;\n}"}]},"cpp":{"file":"linkedlist.cpp","steps":[{"title":"节点定义","note":"链表节点 = 数据 + 指向下一个节点的指针，head 永远指向第一个节点","code":"#include <iostream>\n\nclass List\n{\npublic:\n    List();\n    ~List();\n    void pushFront(int value);\n    void pushBack(int value);\n    void removeElem(int value);\n    void reverse();\n    void print();\n\nprivate:\n    struct Node\n    {\n        int data;\n        Node* next;\n    };\n\n    Node* head;      // 头指针\n    int length;      // 节点个数\n};"},{"title":"头部插入 pushFront","note":"新节点的 next 指向原来的头，再把 head 挪到新节点上","code":"void List::pushFront(int value)\n{\n    Node* node = new Node;\n    node->data = value;\n    node->next = head;       // 先让新节点接上后面的整条链\n    head = node;             // 再让 head 指向新节点（顺序反了链就断了）\n    length++;\n}"},{"title":"尾部插入 pushBack","note":"一路跟到最后一个节点，把新节点挂在它后面","code":"void List::pushBack(int value)\n{\n    Node* node = new Node;\n    node->data = value;\n    node->next = nullptr;\n\n    if (head == nullptr)              // 空链表：新节点直接当头\n    {\n        head = node;\n    }\n    else\n    {\n        Node* p = head;\n        while (p->next != nullptr)    // 走到最后一个节点\n        {\n            p = p->next;\n        }\n        p->next = node;\n    }\n    length++;\n}"},{"title":"按值删除 removeElem","note":"要改前驱的 next，所以必须同时拿着\"前一个节点\"","code":"void List::removeElem(int value)\n{\n    if (head == nullptr)\n    {\n        return;                       // 空链表，没什么可删的\n    }\n\n    if (head->data == value)          // 特例：要删的正好是头节点\n    {\n        Node* temp = head;\n        head = head->next;\n        delete temp;\n        length--;\n        return;\n    }\n\n    Node* prev = head;\n    while (prev->next != nullptr && prev->next->data != value)\n    {\n        prev = prev->next;            // 往前挪，直到 prev 的下一个就是目标\n    }\n\n    if (prev->next != nullptr)\n    {\n        Node* temp = prev->next;      // 先把要删的节点摘出来\n        prev->next = temp->next;      // 让前驱直接跨过它\n        delete temp;                  // 再删掉，不做这一步就内存泄漏了\n        length--;\n    }\n}"},{"title":"反转 reverse","note":"三指针，口诀是\"备份 -> 掉头 -> prev 前进 -> cur 前进\"","code":"void List::reverse()\n{\n    Node* prev = nullptr;\n    Node* cur = head;\n\n    while (cur != nullptr)\n    {\n        Node* next = cur->next;    // 1. 先记住后面的路，指针一改就找不回来了\n        cur->next = prev;          // 2. 掉头\n        prev = cur;                // 3. prev 前进\n        cur = next;                // 4. cur 前进\n    }\n\n    head = prev;                   // 循环结束时 prev 停在原来的尾节点，它就是新头\n}"},{"title":"构造与析构（释放整条链）","note":"析构里从头到尾逐个 delete，不然全泄漏","code":"List::List()\n{\n    head = nullptr;\n    length = 0;\n}\n\nList::~List()\n{\n    Node* p = head;\n    while (p != nullptr)\n    {\n        Node* next = p->next;      // 先把下一个存下来\n        delete p;                  // 再删当前这个\n        p = next;\n    }\n}"},{"title":"main：跑一遍","note":"尾插、头插、按值删除、反转","code":"void List::print()\n{\n    Node* p = head;\n    while (p != nullptr)\n    {\n        std::cout << p->data << \" -> \";\n        p = p->next;\n    }\n    std::cout << \"null\" << std::endl;\n}\n\nint main()\n{\n    List list;\n\n    list.pushBack(1);\n    list.pushBack(2);\n    list.pushBack(3);\n    list.pushFront(0);\n    list.print();              // 0 -> 1 -> 2 -> 3 -> null\n\n    list.removeElem(2);\n    list.print();              // 0 -> 1 -> 3 -> null\n\n    list.reverse();\n    list.print();              // 3 -> 1 -> 0 -> null\n\n    return 0;\n}"}]},"rs":{"file":"linkedlist.rs","steps":[{"title":"节点定义","note":"Rust 用 Option<Box<Node>> 表示\"下一个节点可能有、可能没有\"","code":"struct Node\n{\n    data: i32,\n    next: Option<Box<Node>>,\n}\n\npub struct List\n{\n    head: Option<Box<Node>>,    // None 就表示链表是空的\n    length: usize,\n}"},{"title":"构造","note":"空链表就是 head 为 None","code":"impl List\n{\n    pub fn new() -> List\n    {\n        List { head: None, length: 0 }\n    }\n\n    pub fn len(&self) -> usize\n    {\n        self.length\n    }\n}"},{"title":"头部插入 push_front","note":"take() 把原来的头取出来，新节点的 next 就指向它","code":"impl List\n{\n    pub fn push_front(&mut self, value: i32)\n    {\n        let old_head = self.head.take();      // 先接上后面的整条链\n        let node = Box::new(Node { data: value, next: old_head });\n        self.head = Some(node);               // 再让 head 指向新节点\n        self.length += 1;\n    }\n}"},{"title":"尾部插入 push_back","note":"用 &mut 一路走到最后一个节点，把新节点挂在后面","code":"impl List\n{\n    pub fn push_back(&mut self, value: i32)\n    {\n        let node = Box::new(Node { data: value, next: None });\n\n        let mut cur = &mut self.head;\n        while let Some(inner) = cur\n        {\n            cur = &mut inner.next;            // 一直往下一个节点走\n        }\n\n        *cur = Some(node);                    // 走到空位，新节点就长在这里\n        self.length += 1;\n    }\n}"},{"title":"按值删除 remove_value","note":"递归写法最贴近链表的形状，也不用和借用检查器打架","code":"fn remove_from(node: Option<Box<Node>>, value: i32) -> (Option<Box<Node>>, bool)\n{\n    match node\n    {\n        None => (None, false),\n\n        Some(mut n) =>\n        {\n            if n.data == value\n            {\n                (n.next.take(), true)         // 找到就把它摘掉，把后面的链接上去\n            }\n            else\n            {\n                let (rest, removed) = remove_from(n.next.take(), value);\n                n.next = rest;\n                (Some(n), removed)\n            }\n        }\n    }\n}\n\nimpl List\n{\n    pub fn remove_value(&mut self, value: i32)\n    {\n        let (head, removed) = remove_from(self.head.take(), value);\n        self.head = head;\n\n        if removed\n        {\n            self.length -= 1;\n        }\n    }\n}"},{"title":"反转 reverse","note":"和 C++ 一样的三步：备份 -> 掉头 -> prev 前进","code":"impl List\n{\n    pub fn reverse(&mut self)\n    {\n        let mut prev: Option<Box<Node>> = None;\n        let mut cur = self.head.take();       // 先把整条链拿下来\n\n        while let Some(mut node) = cur\n        {\n            cur = node.next.take();           // 1. 先记住后面的路\n            node.next = prev;                 // 2. 掉头\n            prev = Some(node);                // 3. prev 前进\n        }\n\n        self.head = prev;                     // 循环结束时 prev 就是新头\n    }\n\n    pub fn print(&self)\n    {\n        let mut cur = self.head.as_deref();\n        while let Some(node) = cur\n        {\n            print!(\"{} -> \", node.data);\n            cur = node.next.as_deref();\n        }\n        println!(\"None    length={}\", self.length);\n    }\n}"},{"title":"main：跑一遍","note":"尾插、头插、按值删除、反转","code":"fn main()\n{\n    let mut list = List::new();\n\n    list.push_back(1);\n    list.push_back(2);\n    list.push_back(3);\n    list.push_front(0);\n    list.print();                 // 0 -> 1 -> 2 -> 3 -> None\n\n    list.remove_value(2);\n    list.print();                 // 0 -> 1 -> 3 -> None\n\n    list.reverse();\n    list.print();                 // 3 -> 1 -> 0 -> None\n}"}]}},"stack":{"c":{"file":"stack.c","steps":[{"title":"结构定义","note":"用可扩容的动态数组存栈，size 指向栈顶后一格","code":"#include <stdio.h>\n#include <stdlib.h>\n#include <stdbool.h>\n\ntypedef struct\n{\n    char* data;     // 堆上的缓冲区\n    int size;       // 栈里有多少个元素，栈顶是 data[size - 1]\n    int capacity;   // 已经申请了多少格\n} MyStack;"},{"title":"初始化与销毁","note":"init 置空，free 释放缓冲区","code":"void stackInit(MyStack* s)\n{\n    s->data = NULL;\n    s->size = 0;\n    s->capacity = 0;\n}\n\nvoid stackFree(MyStack* s)\n{\n    free(s->data);\n    s->data = NULL;\n    s->size = 0;\n    s->capacity = 0;\n}"},{"title":"入栈 push","note":"满了就把容量翻倍，再把新元素放到 size 的位置","code":"void stackPush(MyStack* s, char value)\n{\n    if (s->size == s->capacity)\n    {\n        int newCapacity = (s->capacity == 0) ? 4 : s->capacity * 2;\n        char* newData = (char*)realloc(s->data, newCapacity * sizeof(char));\n        if (newData == NULL)\n        {\n            printf(\"error! : realloc failed!\\n\");\n            return;\n        }\n        s->data = newData;\n        s->capacity = newCapacity;\n    }\n    s->data[s->size] = value;\n    s->size++;\n}"},{"title":"出栈 pop","note":"只把 size 减一，原来的数据留着等下次覆盖","code":"char stackPop(MyStack* s)\n{\n    if (s->size == 0)\n    {\n        printf(\"error! : stack is empty!\\n\");\n        return '\\0';\n    }\n    s->size--;\n    return s->data[s->size];   // 栈顶就是 size 减一之后那一格\n}"},{"title":"查看栈顶 peek / 判空 empty","note":"只看不动，栈的内容不变","code":"char stackPeek(MyStack* s)\n{\n    if (s->size == 0)\n    {\n        printf(\"error! : stack is empty!\\n\");\n        return '\\0';\n    }\n    return s->data[s->size - 1];\n}\n\nbool stackEmpty(MyStack* s)\n{\n    return s->size == 0;\n}\n\nvoid stackPrint(char* tag, MyStack* s)\n{\n    printf(\"%-18s size=%d [\", tag, s->size);\n    for (int i = 0; i < s->size; i++)\n    {\n        printf(\"%s%c\", i == 0 ? \"\" : \", \", s->data[i]);\n    }\n    printf(\"]\\n\");\n}"},{"title":"应用：括号匹配","note":"左括号入栈，右括号和栈顶配对，最后栈必须为空","code":"bool bracketsBalanced(char* text)\n{\n    MyStack s;\n    stackInit(&s);\n    bool ok = true;\n    for (int i = 0; text[i] != '\\0' && ok; i++)\n    {\n        char c = text[i];\n        if (c == '(' || c == '[' || c == '{')\n        {\n            stackPush(&s, c);\n        }\n        else if (c == ')' || c == ']' || c == '}')\n        {\n            if (stackEmpty(&s))\n            {\n                ok = false;   // 右括号多出来了\n            }\n            else\n            {\n                char top = stackPop(&s);\n                // 栈顶必须是和它配对的那一种左括号\n                if ((c == ')' && top != '(') || (c == ']' && top != '[') || (c == '}' && top != '{'))\n                {\n                    ok = false;\n                }\n            }\n        }\n    }\n    if (!stackEmpty(&s))\n    {\n        ok = false;   // 左括号多了，比如 \"((\"\n    }\n    stackFree(&s);\n    return ok;\n}"},{"title":"main：跑一遍","note":"演示入栈、出栈、peek 和括号匹配","code":"int main(void)\n{\n    MyStack s;\n    stackInit(&s);\n    stackPush(&s, '1');\n    stackPush(&s, '2');\n    stackPush(&s, '3');\n    stackPrint(\"after push 1,2,3\", &s);\n    printf(\"peek -> %c\\n\", stackPeek(&s));\n    printf(\"pop  -> %c\\n\", stackPop(&s));\n    stackPrint(\"after pop\", &s);\n    stackPop(&s);\n    stackPop(&s);\n    printf(\"empty -> %s\\n\", stackEmpty(&s) ? \"true\" : \"false\");\n\n    char* cases[] = { \"()\", \"([{}])\", \"([)]\", \"(((\", \"no brackets\" };\n    for (int i = 0; i < 5; i++)\n    {\n        printf(\"balanced(%s) -> %s\\n\", cases[i], bracketsBalanced(cases[i]) ? \"true\" : \"false\");\n    }\n    stackFree(&s);\n    return 0;\n}"}]},"cpp":{"file":"stack.cpp","steps":[{"title":"节点与数据成员","note":"栈就是\"只在头部插入删除的链表\"，top 指向栈顶","code":"#include <iostream>\n\nclass Stack\n{\npublic:\n    Stack();\n    ~Stack();\n    void push(int value);\n    void pop();\n    bool peek(int& value);\n    bool empty();\n    int  getSize();\n    void print();\n\nprivate:\n    struct Node\n    {\n        int data;\n        Node* next;\n    };\n\n    Node* top;      // 栈顶\n    int size;       // 栈里有多少个元素\n};"},{"title":"构造与析构","note":"构造把 top 置空；析构把剩下的节点全部 delete","code":"Stack::Stack()\n{\n    top = nullptr;\n    size = 0;\n}\n\nStack::~Stack()\n{\n    while (top != nullptr)\n    {\n        Node* temp = top;\n        top = top->next;\n        delete temp;\n    }\n    size = 0;\n}"},{"title":"入栈 push","note":"新节点插在头部，它就成了新的栈顶，O(1)","code":"void Stack::push(int value)\n{\n    Node* node = new Node;\n    node->data = value;\n    node->next = top;        // 新节点压在原来栈顶的上面\n    top = node;\n    size++;\n}"},{"title":"出栈 pop","note":"只动栈顶那一个节点，O(1)","code":"void Stack::pop()\n{\n    if (empty())\n    {\n        std::cout << \"error! : stack is empty, nothing to pop!\" << std::endl;\n        return;\n    }\n\n    Node* temp = top;\n    top = top->next;         // 栈顶往下退一格\n    delete temp;\n    size--;\n}"},{"title":"查看栈顶 peek / 判空 empty","note":"peek 只看不弹，用引用的方式把值带出去","code":"bool Stack::peek(int& value)\n{\n    if (empty())\n    {\n        return false;        // 栈空，没有栈顶可取\n    }\n\n    value = top->data;\n    return true;\n}\n\nbool Stack::empty()\n{\n    return top == nullptr;\n}\n\nint Stack::getSize()\n{\n    return size;\n}\n\nvoid Stack::print()\n{\n    std::cout << \"栈顶 -> \";\n    Node* p = top;\n    while (p != nullptr)\n    {\n        std::cout << p->data << \" \";\n        p = p->next;\n    }\n    std::cout << \"<- 栈底   size=\" << size << std::endl;\n}"},{"title":"应用：括号匹配","note":"左括号入栈，右括号就检查栈顶是不是它的搭档","code":"bool isPair(char left, char right)\n{\n    if (left == '(' && right == ')') return true;\n    if (left == '[' && right == ']') return true;\n    if (left == '{' && right == '}') return true;\n    return false;\n}\n\nbool isBalanced(const char* text)\n{\n    Stack s;\n\n    for (int i = 0; text[i] != '\\0'; i++)\n    {\n        char ch = text[i];\n\n        if (ch == '(' || ch == '[' || ch == '{')\n        {\n            s.push(ch);                       // 左括号先存起来，等它的右括号出现\n        }\n        else if (ch == ')' || ch == ']' || ch == '}')\n        {\n            int topValue = 0;\n            if (!s.peek(topValue))            // 栈空却来了右括号 -> 一定不合法\n            {\n                return false;\n            }\n            s.pop();\n            if (!isPair((char)topValue, ch))  // 栈顶不是它的搭档 -> 不合法\n            {\n                return false;\n            }\n        }\n    }\n\n    return s.empty();      // 扫描完栈必须为空，\"((\" 这种情况就靠这一句拦下来\n}"},{"title":"main：跑一遍","note":"push / pop / peek，再跑 5 组括号用例","code":"int main()\n{\n    Stack s;\n    s.push(1);\n    s.push(2);\n    s.push(3);\n    s.print();                 // 3 2 1\n\n    int value = 0;\n    if (s.peek(value))\n    {\n        std::cout << \"peek = \" << value << std::endl;\n    }\n    s.pop();\n    s.print();                 // 2 1\n\n    std::cout << \"empty? \" << (s.empty() ? \"true\" : \"false\") << std::endl;\n    std::cout << \"size  = \" << s.getSize() << std::endl;\n\n    std::cout << \"()        -> \" << isBalanced(\"()\") << std::endl;\n    std::cout << \"([{}])    -> \" << isBalanced(\"([{}])\") << std::endl;\n    std::cout << \"([)]      -> \" << isBalanced(\"([)]\") << std::endl;\n    std::cout << \"(((       -> \" << isBalanced(\"(((\") << std::endl;\n\n    return 0;\n}"}]},"rs":{"file":"stack.rs","steps":[{"title":"节点与数据成员","note":"栈就是\"只在头部插入删除的链表\"，top 指向栈顶","code":"struct Node\n{\n    data: i32,\n    next: Option<Box<Node>>,\n}\n\npub struct Stack\n{\n    top: Option<Box<Node>>,     // 栈顶，None 表示空栈\n    size: usize,\n}"},{"title":"构造与析构","note":"Rust 不用写析构，整条 Box 链离开作用域会自动释放","code":"impl Stack\n{\n    pub fn new() -> Stack\n    {\n        Stack { top: None, size: 0 }\n    }\n\n    pub fn len(&self) -> usize\n    {\n        self.size\n    }\n}"},{"title":"入栈 push","note":"新节点插在头部，它就成了新的栈顶，O(1)","code":"impl Stack\n{\n    pub fn push(&mut self, value: i32)\n    {\n        let old_top = self.top.take();        // 原来的栈顶\n        let node = Box::new(Node { data: value, next: old_top });\n        self.top = Some(node);                // 新节点压在它上面\n        self.size += 1;\n    }\n}"},{"title":"出栈 pop","note":"把栈顶取走，返回 Option，空栈就是 None","code":"impl Stack\n{\n    pub fn pop(&mut self) -> Option<i32>\n    {\n        match self.top.take()\n        {\n            None => None,                     // 空栈，没得弹\n            Some(node) =>\n            {\n                self.top = node.next;         // 栈顶往下退一格\n                self.size -= 1;\n                Some(node.data)\n            }\n        }\n    }\n}"},{"title":"查看栈顶 peek / 判空 empty","note":"peek 只看不弹","code":"impl Stack\n{\n    pub fn peek(&self) -> Option<i32>\n    {\n        match &self.top\n        {\n            None => None,\n            Some(node) => Some(node.data),\n        }\n    }\n\n    pub fn empty(&self) -> bool\n    {\n        self.top.is_none()\n    }\n\n    pub fn print(&self)\n    {\n        print!(\"栈顶 -> \");\n        let mut cur = self.top.as_deref();\n        while let Some(node) = cur\n        {\n            print!(\"{} \", node.data);\n            cur = node.next.as_deref();\n        }\n        println!(\"<- 栈底   size={}\", self.size);\n    }\n}"},{"title":"应用：括号匹配","note":"左括号入栈，右括号就检查栈顶是不是它的搭档","code":"fn is_pair(left: char, right: char) -> bool\n{\n    (left == '(' && right == ')')\n        || (left == '[' && right == ']')\n        || (left == '{' && right == '}')\n}\n\nfn is_balanced(text: &str) -> bool\n{\n    let mut stack: Vec<char> = Vec::new();   // 这里用 Vec 当栈：push 到末尾，pop 也从末尾取\n\n    for ch in text.chars()\n    {\n        if ch == '(' || ch == '[' || ch == '{'\n        {\n            stack.push(ch);                  // 左括号先存起来，等它的右括号出现\n        }\n        else if ch == ')' || ch == ']' || ch == '}'\n        {\n            match stack.pop()\n            {\n                None => return false,        // 栈空却来了右括号 -> 一定不合法\n                Some(left) =>\n                {\n                    if !is_pair(left, ch)\n                    {\n                        return false;        // 栈顶不是它的搭档 -> 不合法\n                    }\n                }\n            }\n        }\n    }\n\n    stack.is_empty()                         // 扫描完栈必须为空，\"((\" 就靠这一句拦下来\n}"},{"title":"main：跑一遍","note":"push / pop / peek，再跑 5 组括号用例","code":"fn main()\n{\n    let mut s = Stack::new();\n    s.push(1);\n    s.push(2);\n    s.push(3);\n    s.print();                    // 3 2 1\n\n    println!(\"peek = {:?}\", s.peek());\n    println!(\"pop  = {:?}\", s.pop());\n    s.print();                    // 2 1\n\n    println!(\"empty = {}\", s.empty());\n    println!(\"len   = {}\", s.len());\n\n    // 注意：println! 的格式串里 {} 是占位符，所以下面测试用的\"嵌套括号\"不能直接写进格式串，\n    // 否则会被当成第二个占位符报错。这里把用例文字换成了中文描述。\n    println!(\"空串       -> {}\", is_balanced(\"\"));\n    println!(\"简单一对   -> {}\", is_balanced(\"()\"));\n    println!(\"嵌套三种   -> {}\", is_balanced(\"([{}])\"));\n    println!(\"交叉不合法 -> {}\", is_balanced(\"([)]\"));\n    println!(\"左括号多   -> {}\", is_balanced(\"(((\"));\n}"}]}},"queue":{"c":{"file":"queue.c","steps":[{"title":"环形队列结构","note":"多申请一格，用 head == tail 判空、(tail+1)%N == head 判满","code":"#include <stdio.h>\n#include <stdlib.h>\n#include <stdbool.h>\n\ntypedef struct\n{\n    int* data;      // 实际长度是 capacity + 1\n    int capacity;   // 用户能存的元素个数\n    int head;       // 队首下标，下一个出队的位置\n    int tail;       // 队尾下标，下一个入队的位置\n} MyQueue;\n\n// 入队和出队要用到判满、判空，先声明一下\nbool queueFull(MyQueue* q);\nbool queueEmpty(MyQueue* q);"},{"title":"初始化与销毁","note":"申请 capacity 加一格，永远留一个空位区分“空”和“满”","code":"void queueInit(MyQueue* q, int capacity)\n{\n    q->data = (int*)malloc((capacity + 1) * sizeof(int));\n    if (q->data == NULL)\n    {\n        printf(\"error! : malloc failed!\\n\");\n        q->capacity = 0;\n        q->head = 0;\n        q->tail = 0;\n        return;\n    }\n    q->capacity = capacity;\n    q->head = 0;\n    q->tail = 0;\n}\n\nvoid queueFree(MyQueue* q)\n{\n    free(q->data);\n    q->data = NULL;\n    q->capacity = 0;\n    q->head = 0;\n    q->tail = 0;\n}"},{"title":"入队 enqueue","note":"先判满，写进 tail，再让 tail 环形前进一格","code":"bool queueEnqueue(MyQueue* q, int value)\n{\n    if (queueFull(q))\n    {\n        printf(\"error! : queue is full!\\n\");\n        return false;\n    }\n    q->data[q->tail] = value;\n    // 走到数组末尾就取模绕回 0，这就是“环形”的来源\n    q->tail = (q->tail + 1) % (q->capacity + 1);\n    return true;\n}"},{"title":"出队 dequeue","note":"从 head 取值，然后 head 也环形前进一格","code":"bool queueDequeue(MyQueue* q, int* out)\n{\n    if (queueEmpty(q))\n    {\n        printf(\"error! : queue is empty!\\n\");\n        return false;\n    }\n    *out = q->data[q->head];\n    q->head = (q->head + 1) % (q->capacity + 1);\n    return true;\n}"},{"title":"判空 / 判满 / 大小","note":"两个下标重合就是空，tail 再走一步撞上 head 就是满","code":"bool queueEmpty(MyQueue* q)\n{\n    return q->head == q->tail;\n}\n\nbool queueFull(MyQueue* q)\n{\n    return (q->tail + 1) % (q->capacity + 1) == q->head;\n}\n\nint queueSize(MyQueue* q)\n{\n    // 先加回一整圈再取模，避免 tail - head 变成负数\n    return (q->tail + q->capacity + 1 - q->head) % (q->capacity + 1);\n}"},{"title":"main：跑一遍","note":"用固定序列让 tail 从末尾绕回 0，再验证先进先出","code":"void queuePrint(char* tag, MyQueue* q)\n{\n    int n = queueSize(q);\n    printf(\"%-18s size=%d head=%d tail=%d :\", tag, n, q->head, q->tail);\n    for (int i = 0; i < n; i++)\n    {\n        printf(\" %d\", q->data[(q->head + i) % (q->capacity + 1)]);\n    }\n    printf(\"\\n\");\n}\n\nint main(void)\n{\n    MyQueue q;\n    queueInit(&q, 4);\n    queuePrint(\"init\", &q);\n\n    for (int v = 1; v <= 5; v++)\n    {\n        printf(\"enqueue(%d) -> %s\\n\", v, queueEnqueue(&q, v) ? \"true\" : \"false\");\n    }\n    queuePrint(\"after enqueue\", &q);   // 队列满，留下 1 个空槽\n\n    int out = 0;\n    queueDequeue(&q, &out);\n    queueDequeue(&q, &out);\n    queuePrint(\"after dequeue x2\", &q);\n\n    queueEnqueue(&q, 6);\n    queueEnqueue(&q, 7);\n    queuePrint(\"after enqueue 6,7\", &q);   // tail 在这里绕回 0\n    printf(\"enqueue(8) -> %s (满了)\\n\", queueEnqueue(&q, 8) ? \"true\" : \"false\");\n\n    printf(\"FIFO:\");\n    while (queueDequeue(&q, &out))\n    {\n        printf(\" %d\", out);\n    }\n    printf(\"\\n\");\n    printf(\"empty -> %s\\n\", queueEmpty(&q) ? \"true\" : \"false\");\n    queueDequeue(&q, &out);\n\n    queueFree(&q);\n    return 0;\n}"}]},"cpp":{"file":"queue.cpp","steps":[{"title":"环形队列结构","note":"把数组首尾接起来用，多开一格专门用来区分\"空\"和\"满\"","code":"#include <iostream>\n\nclass Queue\n{\npublic:\n    Queue(int cap);\n    ~Queue();\n    bool enqueue(int value);\n    int  dequeue();\n    bool empty();\n    bool full();\n    int  getSize();\n    void print();\n\nprivate:\n    int* arr;\n    int  capacity;    // 实际开出来的格子数 = 用户要的容量 + 1\n    int  head;        // 下一个出队的位置\n    int  tail;        // 下一个入队的位置\n};"},{"title":"初始化与销毁","note":"head 和 tail 都从 0 开始，两个指针相等就表示队列空","code":"Queue::Queue(int cap)\n{\n    capacity = cap + 1;              // 故意多开一格，那一格永远不存数据，只用来判满\n    arr = new int[capacity];\n    head = 0;\n    tail = 0;\n}\n\nQueue::~Queue()\n{\n    delete[] arr;\n}"},{"title":"入队 enqueue","note":"写进 tail 指向的格子，然后 tail 用取模的方式往前绕","code":"bool Queue::enqueue(int value)\n{\n    if (full())\n    {\n        std::cout << \"error! : queue is full!\" << std::endl;\n        return false;\n    }\n\n    arr[tail] = value;\n    tail = (tail + 1) % capacity;    // 走到最后一格就绕回 0\n    return true;\n}"},{"title":"出队 dequeue","note":"取走 head 指向的元素，head 同样取模往前绕","code":"int Queue::dequeue()\n{\n    if (empty())\n    {\n        std::cout << \"error! : queue is empty!\" << std::endl;\n        return -1;\n    }\n\n    int value = arr[head];\n    head = (head + 1) % capacity;    // 数据一个都没搬，只动了指针\n    return value;\n}"},{"title":"判空 / 判满 / 大小","note":"多开的那一格就是用来把\"空\"和\"满\"区分开的","code":"bool Queue::empty()\n{\n    return head == tail;\n}\n\nbool Queue::full()\n{\n    return (tail + 1) % capacity == head;\n}\n\nint Queue::getSize()\n{\n    // 加一个 capacity 是为了避免 tail - head 变成负数\n    return (tail - head + capacity) % capacity;\n}\n\nvoid Queue::print()\n{\n    std::cout << \"队头 -> \";\n    int p = head;\n    for (int i = 0; i < getSize(); i++)\n    {\n        std::cout << arr[p] << \" \";\n        p = (p + 1) % capacity;      // 从 head 出发绕一圈才是真正的顺序\n    }\n    std::cout << \"<- 队尾   size=\" << getSize() << \"  head=\" << head << \"  tail=\" << tail << std::endl;\n}"},{"title":"main：跑一遍","note":"重点看 tail 从最后一格绕回下标 0 的那一刻","code":"int main()\n{\n    Queue q(4);              // 最多能存 4 个，内部开 5 格\n\n    q.enqueue(1);\n    q.enqueue(2);\n    q.enqueue(3);\n    q.enqueue(4);\n    q.print();\n    std::cout << \"满了吗？\" << (q.full() ? \"是\" : \"否\") << std::endl;\n\n    std::cout << \"dequeue -> \" << q.dequeue() << std::endl;\n    std::cout << \"dequeue -> \" << q.dequeue() << std::endl;\n\n    q.enqueue(5);            // tail 从 4 绕回 0\n    q.enqueue(6);\n    q.print();               // 3 4 5 6\n\n    std::cout << \"已经满了：\" << std::endl;\n    q.enqueue(7);            // 会被拒绝\n\n    std::cout << \"全部出队：\";\n    while (!q.empty())\n    {\n        std::cout << q.dequeue() << \" \";\n    }\n    std::cout << std::endl;\n\n    return 0;\n}"}]},"rs":{"file":"queue.rs","steps":[{"title":"环形队列结构","note":"把数组首尾接起来用，多开一格专门用来区分\"空\"和\"满\"","code":"pub struct Queue\n{\n    data: Vec<Option<i32>>,   // 用 Option 表示\"这一格现在是空的\"\n    capacity: usize,          // 实际格子数 = 用户要的容量 + 1\n    head: usize,              // 下一个出队的位置\n    tail: usize,              // 下一个入队的位置\n}"},{"title":"初始化与销毁","note":"head 和 tail 都从 0 开始；Rust 不用写析构，Vec 会自动释放","code":"impl Queue\n{\n    pub fn new(cap: usize) -> Queue\n    {\n        let capacity = cap + 1;      // 故意多开一格，那一格永远不存数据\n        let mut data = Vec::new();\n\n        for _ in 0..capacity\n        {\n            data.push(None);\n        }\n\n        Queue { data, capacity, head: 0, tail: 0 }\n    }\n}"},{"title":"入队 enqueue","note":"写进 tail 指向的格子，然后 tail 取模往前绕","code":"impl Queue\n{\n    pub fn enqueue(&mut self, value: i32) -> bool\n    {\n        if self.full()\n        {\n            println!(\"error! : queue is full!\");\n            return false;\n        }\n\n        self.data[self.tail] = Some(value);\n        self.tail = (self.tail + 1) % self.capacity;   // 走到最后一格就绕回 0\n        true\n    }\n}"},{"title":"出队 dequeue","note":"取走 head 指向的元素，head 同样取模往前绕","code":"impl Queue\n{\n    pub fn dequeue(&mut self) -> Option<i32>\n    {\n        if self.empty()\n        {\n            println!(\"error! : queue is empty!\");\n            return None;\n        }\n\n        let value = self.data[self.head];      // Option<i32> 可以直接复制出来\n        self.data[self.head] = None;\n        self.head = (self.head + 1) % self.capacity;\n        value\n    }\n}"},{"title":"判空 / 判满 / 大小","note":"多开的那一格就是用来把\"空\"和\"满\"区分开的","code":"impl Queue\n{\n    pub fn empty(&self) -> bool\n    {\n        self.head == self.tail\n    }\n\n    pub fn full(&self) -> bool\n    {\n        (self.tail + 1) % self.capacity == self.head\n    }\n\n    pub fn size(&self) -> usize\n    {\n        // 先加一个 capacity 再取模，是为了避免 tail - head 变成负数\n        // Rust 里 usize 减出负数是会直接 panic 的\n        (self.tail + self.capacity - self.head) % self.capacity\n    }\n\n    pub fn print(&self)\n    {\n        print!(\"队头 -> \");\n        let mut p = self.head;\n\n        for _ in 0..self.size()\n        {\n            if let Some(v) = self.data[p]\n            {\n                print!(\"{} \", v);\n            }\n            p = (p + 1) % self.capacity;       // 从 head 出发绕一圈才是真正的顺序\n        }\n\n        println!(\"<- 队尾   size={} head={} tail={}\", self.size(), self.head, self.tail);\n    }\n}"},{"title":"main：跑一遍","note":"重点看 tail 从最后一格绕回下标 0 的那一刻","code":"fn main()\n{\n    let mut q = Queue::new(4);      // 最多能存 4 个，内部开 5 格\n\n    q.enqueue(1);\n    q.enqueue(2);\n    q.enqueue(3);\n    q.enqueue(4);\n    q.print();\n    println!(\"满了吗？{}\", q.full());\n\n    println!(\"dequeue -> {:?}\", q.dequeue());\n    println!(\"dequeue -> {:?}\", q.dequeue());\n\n    q.enqueue(5);                   // tail 从 4 绕回 0\n    q.enqueue(6);\n    q.print();\n\n    println!(\"已经满了：\");\n    q.enqueue(7);                   // 会被拒绝\n\n    print!(\"全部出队：\");\n    while !q.empty()\n    {\n        print!(\"{:?} \", q.dequeue());\n    }\n    println!();\n}"}]}},"matrix":{"c":{"file":"matrix.c","steps":[{"title":"二维数组的地址计算","note":"行主序先跨过 i 行，再在行内走 j 格","code":"#include <stdio.h>\n\n// 返回相对于基地址的字节偏移：一行 cols 个元素，每个 int 占 sizeof(int) 字节\nint offsetOf(int i, int j, int cols)\n{\n    return (i * cols + j) * (int)sizeof(int);\n}"},{"title":"对称矩阵的压缩存储","note":"只存下三角（含对角线），共 n*(n+1)/2 个元素","code":"typedef struct\n{\n    int n;            // 阶数\n    int data[100];    // 按行优先存下三角\n} SymMatrix;\n\nint symmetricIndex(int i, int j);   // 下标映射在下一步实现\n\nvoid symInit(SymMatrix* m, int n)\n{\n    if (n <= 0 || n * (n + 1) / 2 > 100)\n    {\n        printf(\"error! : matrix size out of range!\\n\");\n        m->n = 0;\n        return;\n    }\n\n    m->n = n;\n    for (int k = 0; k < n * (n + 1) / 2; k++)\n    {\n        m->data[k] = 0;   // 先全部清零，方便看结果\n    }\n}"},{"title":"对称矩阵的下标映射","note":"i >= j 直接用公式，i < j 就交换成镜像位置","code":"int symmetricIndex(int i, int j)\n{\n    if (i >= j)\n    {\n        // 前面 0..i-1 行一共 1+2+...+i 个，本行前面还有 j 个\n        return i * (i + 1) / 2 + j;\n    }\n\n    // (i,j) 在上三角，但 a[i][j] == a[j][i]，所以取 (j,i) 的下标\n    return j * (j + 1) / 2 + i;\n}\n\nvoid symSet(SymMatrix* m, int i, int j, int value)\n{\n    if (i < 0 || i >= m->n || j < 0 || j >= m->n)\n    {\n        printf(\"error! : index out of range!\\n\");\n        return;\n    }\n\n    m->data[symmetricIndex(i, j)] = value;   // 上三角会自动换成下三角的下标\n}\n\nint symGet(SymMatrix* m, int i, int j)\n{\n    if (i < 0 || i >= m->n || j < 0 || j >= m->n)\n    {\n        printf(\"error! : index out of range!\\n\");\n        return -1;\n    }\n\n    return m->data[symmetricIndex(i, j)];\n}\n\nvoid symPrint(SymMatrix* m)\n{\n    for (int i = 0; i < m->n; i++)\n    {\n        for (int j = 0; j < m->n; j++)\n        {\n            printf(\"%4d\", symGet(m, i, j));\n        }\n        printf(\"\\n\");\n    }\n}"},{"title":"稀疏矩阵的三元组表示","note":"只记非零元的行、列、值，零元不占地方","code":"typedef struct\n{\n    int row;\n    int col;\n    int value;\n} Triple;\n\ntypedef struct\n{\n    Triple data[100];\n    int rows;\n    int cols;\n    int count;        // 非零元个数\n} SparseMatrix;\n\nvoid sparseInit(SparseMatrix* m, int rows, int cols)\n{\n    m->rows = rows;\n    m->cols = cols;\n    m->count = 0;\n}\n\nvoid sparseAdd(SparseMatrix* m, int row, int col, int value)\n{\n    if (m->count >= 100)\n    {\n        printf(\"error! : too many nonzero elements!\\n\");\n        return;\n    }\n    if (value == 0)\n    {\n        return;   // 零元不入表，否则压缩就没意义了\n    }\n\n    m->data[m->count].row = row;\n    m->data[m->count].col = col;\n    m->data[m->count].value = value;\n    m->count++;\n}\n\nvoid sparsePrint(SparseMatrix* m, const char* tag)\n{\n    printf(\"%s  %d x %d, count = %d\\n\", tag, m->rows, m->cols, m->count);\n    for (int k = 0; k < m->count; k++)\n    {\n        printf(\"  (%d, %d, %d)\\n\", m->data[k].row, m->data[k].col, m->data[k].value);\n    }\n}"},{"title":"稀疏矩阵的快速转置","note":"先统计每列个数，再算每列起点，最后一趟放好","code":"void sparseTransposeFast(SparseMatrix* source, SparseMatrix* target)\n{\n    int num[100] = {0};   // num[col] = 原矩阵第 col 列有几个非零元\n    int pos[100] = {0};   // pos[col] = 这一列第一个非零元在目标表里的下标\n\n    target->rows = source->cols;\n    target->cols = source->rows;\n    target->count = source->count;\n\n    for (int k = 0; k < source->count; k++)\n    {\n        num[source->data[k].col]++;   // 第一趟：数每列有多少个\n    }\n\n    pos[0] = 0;\n    for (int col = 1; col < source->cols; col++)\n    {\n        pos[col] = pos[col - 1] + num[col - 1];   // 前一列起点 + 前一列个数\n    }\n\n    for (int k = 0; k < source->count; k++)\n    {\n        int col = source->data[k].col;\n        int dest = pos[col];\n\n        target->data[dest].row = source->data[k].col;     // 行列互换\n        target->data[dest].col = source->data[k].row;\n        target->data[dest].value = source->data[k].value;\n\n        pos[col]
