++;   // 这一列的下一个非零元放到后面一格\n    }\n\n    // 统计和摆放都只扫 count 个元素，算起点扫 cols 列，所以是 O(cols + count)\n    // 普通转置要\"每列都把整个三元组表扫一遍\"，是 O(cols * count)\n}"},{"title":"main：跑一遍","note":"先算地址偏移，再看对称矩阵压缩，最后看稀疏矩阵转置","code":"int main(void)\n{\n    printf(\"offsetOf(1, 2, 5) = %d\\n\", offsetOf(1, 2, 5));   // (1*5+2)*4 = 28\n\n    SymMatrix sym;\n    symInit(&sym, 4);\n    symSet(&sym, 0, 0, 1);\n    symSet(&sym, 1, 0, 2);\n    symSet(&sym, 1, 1, 3);\n    symSet(&sym, 2, 2, 4);\n    symSet(&sym, 3, 0, 5);\n    symSet(&sym, 3, 3, 6);\n\n    printf(\"symmetric 4 x 4:\\n\");\n    symPrint(&sym);\n\n    printf(\"compressed:\");\n    for (int k = 0; k < 4 * 5 / 2; k++)\n    {\n        printf(\" %d\", sym.data[k]);\n    }\n    printf(\"\\n\");\n    printf(\"symGet(0,1) = %d, symGet(1,0) = %d\\n\", symGet(&sym, 0, 1), symGet(&sym, 1, 0));\n\n    SparseMatrix a;\n    SparseMatrix b;\n    sparseInit(&a, 3, 5);\n    sparseAdd(&a, 0, 0, 5);\n    sparseAdd(&a, 0, 3, 2);\n    sparseAdd(&a, 2, 1, 7);\n    sparseAdd(&a, 2, 4, 9);\n\n    sparsePrint(&a, \"before:\");\n    sparseTransposeFast(&a, &b);\n    sparsePrint(&b, \"after :\");\n\n    return 0;\n}"}]},"cpp":{"file":"matrix.cpp","steps":[{"title":"二维数组的地址计算","note":"行主序先跨过 i 行，再在行内走 j 格","code":"#include <iostream>\n\n// 返回相对于基地址的字节偏移：一行 cols 个元素，每个 int 占 sizeof(int) 字节\nint offsetOf(int i, int j, int cols)\n{\n    return (i * cols + j) * (int)sizeof(int);\n}"},{"title":"对称矩阵的压缩存储","note":"只存下三角（含对角线），共 n*(n+1)/2 个元素","code":"class SymMatrix\n{\npublic:\n    SymMatrix();\n    void init(int order);\n    void set(int i, int j, int value);\n    int get(int i, int j);\n    int indexOf(int i, int j);\n    void print();\n    int getCompressed(int k);\n\nprivate:\n    int n;            // 阶数\n    int data[100];    // 按行优先存下三角\n};\nSymMatrix::SymMatrix()\n{\n    n = 0;\n}\nvoid SymMatrix::init(int order)\n{\n    if (order <= 0 || order * (order + 1) / 2 > 100)\n    {\n        std::cout << \"error! : matrix size out of range!\" << std::endl;\n        this->n = 0;\n        return;\n    }\n\n    this->n = order;\n    for (int k = 0; k < order * (order + 1) / 2; k++)\n    {\n        data[k] = 0;   // 先全部清零，方便看结果\n    }\n}"},{"title":"对称矩阵的下标映射","note":"i >= j 直接用公式，i < j 就交换成镜像位置","code":"int SymMatrix::indexOf(int i, int j)\n{\n    if (i >= j)\n    {\n        // 前面 0..i-1 行一共 1+2+...+i 个，本行前面还有 j 个\n        return i * (i + 1) / 2 + j;\n    }\n\n    // (i,j) 在上三角，但 a[i][j] == a[j][i]，所以取 (j,i) 的下标\n    return j * (j + 1) / 2 + i;\n}\n\nvoid SymMatrix::set(int i, int j, int value)\n{\n    if (i < 0 || i >= n || j < 0 || j >= n)\n    {\n        std::cout << \"error! : index out of range!\" << std::endl;\n        return;\n    }\n\n    data[indexOf(i, j)] = value;   // 上三角会自动换成下三角的下标\n}\nint SymMatrix::get(int i, int j)\n{\n    if (i < 0 || i >= n || j < 0 || j >= n)\n    {\n        std::cout << \"error! : index out of range!\" << std::endl;\n        return -1;\n    }\n\n    return data[indexOf(i, j)];\n}\nvoid SymMatrix::print()\n{\n    for (int i = 0; i < n; i++)\n    {\n        for (int j = 0; j < n; j++)\n        {\n            std::cout.width(4);\n            std::cout << get(i, j);\n        }\n        std::cout << std::endl;\n    }\n}\n\nint SymMatrix::getCompressed(int k)\n{\n    return data[k];   // 直接读压缩数组，用来验证存进去的顺序\n}"},{"title":"稀疏矩阵的三元组表示","note":"只记非零元的行、列、值，零元不占地方","code":"class SparseMatrix\n{\npublic:\n    SparseMatrix();\n    void init(int rowCount, int colCount);\n    void add(int row, int col, int value);\n    void print(const char* tag);\n    void transposeFast(SparseMatrix* target);\n\nprivate:\n    struct Triple\n    {\n        int row;\n        int col;\n        int value;\n    };\n\n    Triple data[100];\n    int rows;\n    int cols;\n    int count;        // 非零元个数\n};\n\nSparseMatrix::SparseMatrix()\n{\n    rows = 0;\n    cols = 0;\n    count = 0;\n}\n\nvoid SparseMatrix::init(int rowCount, int colCount)\n{\n    rows = rowCount;\n    cols = colCount;\n    count = 0;\n}\n\nvoid SparseMatrix::add(int row, int col, int value)\n{\n    if (count >= 100)\n    {\n        std::cout << \"error! : too many nonzero elements!\" << std::endl;\n        return;\n    }\n    if (value == 0)\n    {\n        return;   // 零元不入表，否则压缩就没意义了\n    }\n\n    data[count].row = row;\n    data[count].col = col;\n    data[count].value = value;\n    count++;\n}\n\nvoid SparseMatrix::print(const char* tag)\n{\n    std::cout << tag << \"  \" << rows << \" x \" << cols << \", count = \" << count << std::endl;\n    for (int k = 0; k < count; k++)\n    {\n        std::cout << \"  (\" << data[k].row << \", \" << data[k].col << \", \" << data[k].value << \")\" << std::endl;\n    }\n}"},{"title":"稀疏矩阵的快速转置","note":"先统计每列个数，再算每列起点，最后一趟放好","code":"void SparseMatrix::transposeFast(SparseMatrix* target)\n{\n    int num[100] = {0};   // num[col] = 原矩阵第 col 列有几个非零元\n    int pos[100] = {0};   // pos[col] = 这一列第一个非零元在目标表里的下标\n\n    target->rows = cols;\n    target->cols = rows;\n    target->count = count;\n\n    for (int k = 0; k < count; k++)\n    {\n        num[data[k].col]++;   // 第一趟：数每列有多少个\n    }\n\n    for (int col = 1; col < cols; col++)\n    {\n        pos[col] = pos[col - 1] + num[col - 1];   // 前一列起点 + 前一列个数\n    }\n\n    for (int k = 0; k < count; k++)\n    {\n        int col = data[k].col;\n        int dest = pos[col];\n\n        target->data[dest].row = data[k].col;     // 行列互换\n        target->data[dest].col = data[k].row;\n        target->data[dest].value = data[k].value;\n\n        pos[col]++;   // 这一列的下一个非零元放到后面一格\n    }\n\n    // 统计和摆放都只扫 count 个元素，算起点扫 cols 列，所以是 O(cols + count)\n    // 普通转置要\"每列都把整个三元组表扫一遍\"，是 O(cols * count)\n}"},{"title":"main：跑一遍","note":"先算地址偏移，再看对称矩阵压缩，最后看稀疏矩阵转置","code":"int main()\n{\n    std::cout << \"offsetOf(1, 2, 5) = \" << offsetOf(1, 2, 5) << std::endl;   // 28\n    SymMatrix sym;\n    sym.init(4);\n    sym.set(0, 0, 1);\n    sym.set(1, 0, 2);\n    sym.set(1, 1, 3);\n    sym.set(2, 2, 4);\n    sym.set(3, 0, 5);\n    sym.set(3, 3, 6);\n    std::cout << \"symmetric 4 x 4:\" << std::endl;\n    sym.print();\n    std::cout << \"compressed:\";\n    for (int k = 0; k < 10; k++)   // 4 阶下三角一共 4*5/2 = 10 个\n    {\n        std::cout << \" \" << sym.getCompressed(k);\n    }\n    std::cout << std::endl;\n    std::cout << \"symGet(0,1) = \" << sym.get(0, 1) << \", symGet(1,0) = \" << sym.get(1, 0) << std::endl;\n    SparseMatrix a;\n    SparseMatrix b;\n    a.init(3, 5);\n    a.add(0, 0, 5);\n    a.add(0, 3, 2);\n    a.add(2, 1, 7);\n    a.add(2, 4, 9);\n    a.print(\"before:\");\n    a.transposeFast(&b);\n    b.print(\"after :\");\n\n    return 0;\n}"}]},"rs":{"file":"matrix.rs","steps":[{"title":"二维数组的地址计算","note":"行主序先跨过 i 行，再在行内走 j 格","code":"fn offset_of(i: usize, j: usize, cols: usize) -> usize\n{\n    (i * cols + j) * 4   // 假设 int 占 4 字节，和 C 版的 sizeof(int) 对应\n}"},{"title":"对称矩阵的压缩存储","note":"只存下三角（含对角线），共 n*(n+1)/2 个元素","code":"struct SymMatrix\n{\n    n: usize,\n    data: Vec<i32>,   // 按行优先存下三角\n}\n\nimpl SymMatrix\n{\n    fn new() -> SymMatrix\n    {\n        SymMatrix { n: 0, data: Vec::new() }\n    }\n\n    fn init(&mut self, order: usize)\n    {\n        if order == 0 || order * (order + 1) / 2 > 100\n        {\n            println!(\"error! : matrix size out of range!\");\n            self.n = 0;\n            self.data.clear();\n            return;\n        }\n\n        self.n = order;\n        self.data = vec![0; order * (order + 1) / 2];   // 先全部清零\n    }\n}"},{"title":"对称矩阵的下标映射","note":"i >= j 直接用公式，i < j 就交换成镜像位置","code":"impl SymMatrix\n{\n    fn index_of(&self, i: usize, j: usize) -> usize\n    {\n        if i >= j\n        {\n            // 前面 0..i-1 行一共 1+2+...+i 个，本行前面还有 j 个\n            i * (i + 1) / 2 + j\n        }\n        else\n        {\n            // (i,j) 在上三角，但 a[i][j] == a[j][i]，所以取 (j,i) 的下标\n            j * (j + 1) / 2 + i\n        }\n    }\n\n    fn set(&mut self, i: usize, j: usize, value: i32)\n    {\n        if i >= self.n || j >= self.n\n        {\n            println!(\"error! : index out of range!\");\n            return;\n        }\n\n        let k = self.index_of(i, j);\n        self.data[k] = value;   // 上三角会自动换成下三角的下标\n    }\n\n    fn get(&self, i: usize, j: usize) -> i32\n    {\n        if i >= self.n || j >= self.n\n        {\n            println!(\"error! : index out of range!\");\n            return -1;\n        }\n\n        self.data[self.index_of(i, j)]\n    }\n\n    fn get_compressed(&self, k: usize) -> i32\n    {\n        self.data[k]   // 直接读压缩数组，用来验证存进去的顺序\n    }\n\n    fn print(&self)\n    {\n        for i in 0..self.n\n        {\n            for j in 0..self.n\n            {\n                print!(\"{:4}\", self.get(i, j));\n            }\n            println!();\n        }\n    }\n}"},{"title":"稀疏矩阵的三元组表示","note":"只记非零元的行、列、值，零元不占地方","code":"struct Triple\n{\n    row: usize,\n    col: usize,\n    value: i32,\n}\n\nstruct SparseMatrix\n{\n    data: Vec<Triple>,\n    rows: usize,\n    cols: usize,\n}\n\nimpl SparseMatrix\n{\n    fn new(rows: usize, cols: usize) -> SparseMatrix\n    {\n        SparseMatrix { data: Vec::new(), rows: rows, cols: cols }\n    }\n\n    fn add(&mut self, row: usize, col: usize, value: i32)\n    {\n        if self.data.len() >= 100\n        {\n            println!(\"error! : too many nonzero elements!\");\n            return;\n        }\n        if value == 0\n        {\n            return;   // 零元不入表，否则压缩就没意义了\n        }\n\n        self.data.push(Triple { row: row, col: col, value: value });\n    }\n\n    fn print(&self, tag: &str)\n    {\n        println!(\"{}  {} x {}, count = {}\", tag, self.rows, self.cols, self.data.len());\n        for k in 0..self.data.len()\n        {\n            println!(\"  ({}, {}, {})\", self.data[k].row, self.data[k].col, self.data[k].value);\n        }\n    }\n}"},{"title":"稀疏矩阵的快速转置","note":"先统计每列个数，再算每列起点，最后一趟放好","code":"impl SparseMatrix\n{\n    fn transpose_fast(&self) -> SparseMatrix\n    {\n        let mut target = SparseMatrix::new(self.cols, self.rows);\n        let mut num = vec![0; self.cols];   // 每列有几个非零元\n        let mut pos = vec![0; self.cols];   // 每列第一个非零元的目标下标\n\n        for k in 0..self.data.len()\n        {\n            num[self.data[k].col] += 1;   // 第一趟：数每列有多少个\n        }\n\n        for col in 1..self.cols\n        {\n            pos[col] = pos[col - 1] + num[col - 1];   // 前一列起点 + 前一列个数\n        }\n\n        for _ in 0..self.data.len()\n        {\n            target.data.push(Triple { row: 0, col: 0, value: 0 });   // 先撑出位置\n        }\n\n        for k in 0..self.data.len()\n        {\n            let col = self.data[k].col;\n            let dest = pos[col];\n\n            target.data[dest].row = col;                     // 行列互换\n            target.data[dest].col = self.data[k].row;\n            target.data[dest].value = self.data[k].value;\n\n            pos[col] += 1;   // 这一列的下一个非零元放到后面一格\n        }\n\n        // 统计和摆放都只扫 count 个元素，算起点扫 cols 列，所以是 O(cols + count)\n        // 普通转置要\"每列都把整个三元组表扫一遍\"，是 O(cols * count)\n        target\n    }\n}"},{"title":"main：跑一遍","note":"先算地址偏移，再看对称矩阵压缩，最后看稀疏矩阵转置","code":"fn main()\n{\n    println!(\"offsetOf(1, 2, 5) = {}\", offset_of(1, 2, 5));   // 28\n\n    let mut sym = SymMatrix::new();\n    sym.init(4);\n    sym.set(0, 0, 1);\n    sym.set(1, 0, 2);\n    sym.set(1, 1, 3);\n    sym.set(2, 2, 4);\n    sym.set(3, 0, 5);\n    sym.set(3, 3, 6);\n\n    println!(\"symmetric 4 x 4:\");\n    sym.print();\n\n    print!(\"compressed:\");\n    for k in 0..10   // 4 阶下三角一共 4*5/2 = 10 个\n    {\n        print!(\" {}\", sym.get_compressed(k));\n    }\n    println!();\n    println!(\"symGet(0,1) = {}, symGet(1,0) = {}\", sym.get(0, 1), sym.get(1, 0));\n\n    let mut a = SparseMatrix::new(3, 5);\n    a.add(0, 0, 5);\n    a.add(0, 3, 2);\n    a.add(2, 1, 7);\n    a.add(2, 4, 9);\n\n    a.print(\"before:\");\n    let b = a.transpose_fast();\n    b.print(\"after :\");\n}"}]}},"genlist":{"c":{"file":"genlist.c","steps":[{"title":"节点定义（头尾链表表示法）","note":"tag 区分原子和子表，hp 指向表头，tp 指向同层下一个","code":"#include <stdio.h>\n#include <stdlib.h>\n\ntypedef struct GLNode\n{\n    int tag;            // 0 = 原子，1 = 子表\n    char atom;          // tag = 0 时才有意义\n    struct GLNode* hp;  // tag = 1 时指向子表的第一个元素\n    struct GLNode* tp;  // 同一层的下一个元素\n} GLNode;\n\nGLNode* makeAtom(char value)\n{\n    GLNode* node = (GLNode*)malloc(sizeof(GLNode));\n    if (node == NULL)\n    {\n        printf(\"error! : malloc failed!\\n\");\n        return NULL;\n    }\n\n    node->tag = 0;\n    node->atom = value;\n    node->hp = NULL;\n    node->tp = NULL;\n    return node;\n}\n\nGLNode* makeList()\n{\n    GLNode* node = (GLNode*)malloc(sizeof(GLNode));\n    if (node == NULL)\n    {\n        printf(\"error! : malloc failed!\\n\");\n        return NULL;\n    }\n\n    node->tag = 1;\n    node->atom = '\\0';\n    node->hp = NULL;   // hp 为空表示空表\n    node->tp = NULL;\n    return node;\n}"},{"title":"求表头 head 与表尾 tail","note":"表头是 hp，表尾是 hp 后面用 tp 串起来的剩余部分","code":"GLNode* genlistHead(GLNode* list)\n{\n    if (list == NULL || list->hp == NULL)\n    {\n        printf(\"error! : head of empty list!\\n\");\n        return NULL;\n    }\n\n    return list->hp;   // 第一个元素，可能是原子，也可能是子表\n}\n\nGLNode* genlistTail(GLNode* list)\n{\n    if (list == NULL || list->hp == NULL)\n    {\n        printf(\"error! : tail of empty list!\\n\");\n        return NULL;\n    }\n\n    return list->hp->tp;   // 去掉表头后，剩下的节点仍由 tp 串着\n}"},{"title":"求广义表的深度","note":"空表深度 1，原子贡献 0，子表贡献自己的深度","code":"int genlistDepth(GLNode* list)\n{\n    if (list == NULL || list->hp == NULL)\n    {\n        return 1;   // 空表也算一层括号\n    }\n\n    int maxDepth = 0;\n    GLNode* p = list->hp;\n    while (p != NULL)\n    {\n        int childDepth;\n        if (p->tag == 0)\n        {\n            childDepth = 0;   // 原子不再往下\n        }\n        else\n        {\n            childDepth = genlistDepth(p);   // 子表的深度递归算\n        }\n\n        if (childDepth > maxDepth)\n        {\n            maxDepth = childDepth;\n        }\n        p = p->tp;\n    }\n\n    return maxDepth + 1;   // 最外面还要包一层括号\n}"},{"title":"求广义表的长度","note":"长度是同一层元素的个数，只看 tp 串了多少个","code":"int genlistLength(GLNode* list)\n{\n    if (list == NULL)\n    {\n        return 0;\n    }\n\n    int count = 0;\n    GLNode* p = list->hp;\n    while (p != NULL)\n    {\n        count++;\n        p = p->tp;\n    }\n\n    return count;\n}"},{"title":"打印与销毁","note":"打印时遇到子表加括号，销毁时先记住 tp 再释放","code":"void printChain(GLNode* first);\n\nvoid printNode(GLNode* node)\n{\n    if (node->tag == 0)\n    {\n        printf(\"%c\", node->atom);\n        return;\n    }\n\n    printf(\"(\");\n    printChain(node->hp);\n    printf(\")\");\n}\n\nvoid printChain(GLNode* first)\n{\n    GLNode* p = first;\n    while (p != NULL)\n    {\n        printNode(p);\n        if (p->tp != NULL)\n        {\n            printf(\",\");\n        }\n        p = p->tp;\n    }\n}\n\nvoid printGenList(GLNode* list)\n{\n    printf(\"(\");\n    if (list != NULL)\n    {\n        printChain(list->hp);\n    }\n    printf(\")\");\n}\n\nvoid destroyGenList(GLNode* list)\n{\n    if (list == NULL)\n    {\n        return;\n    }\n\n    GLNode* p = list->hp;\n    while (p != NULL)\n    {\n        GLNode* next = p->tp;   // 先记住下一个，释放后就找不到了\n        if (p->tag == 1)\n        {\n            destroyGenList(p);  // 子表连同它的 hp 链一起释放\n        }\n        else\n        {\n            free(p);\n        }\n        p = next;\n    }\n\n    free(list);\n}"},{"title":"main：跑一遍","note":"构造 (a,(b,c),d)，打印长度、深度、head 和 tail","code":"int main(void)\n{\n    GLNode* list = makeList();\n    GLNode* a = makeAtom('a');\n    GLNode* sub = makeList();\n    GLNode* b = makeAtom('b');\n    GLNode* c = makeAtom('c');\n    GLNode* d = makeAtom('d');\n\n    sub->hp = b;\n    b->tp = c;        // 子表 (b,c)\n    sub->tp = d;      // 子表后面接 d\n    a->tp = sub;      // 原子 a 后面接子表\n    list->hp = a;     // 整张表以 a 开头\n\n    printf(\"list   = \");\n    printGenList(list);\n    printf(\"\\n\");\n    printf(\"length = %d\\n\", genlistLength(list));\n    printf(\"depth  = %d\\n\", genlistDepth(list));\n\n    GLNode* h = genlistHead(list);\n    printf(\"head   = \");\n    printNode(h);\n    printf(\"\\n\");\n\n    GLNode* t = genlistTail(list);\n    printf(\"tail   = (\");\n    printChain(t);\n    printf(\")\\n\");\n\n    destroyGenList(list);\n    return 0;\n}"}]},"cpp":{"file":"genlist.cpp","steps":[{"title":"节点定义（头尾链表表示法）","note":"tag 区分原子和子表，hp 指向表头，tp 指向同层下一个","code":"#include <iostream>\n\nclass GenList\n{\npublic:\n    struct GLNode\n    {\n        int tag;            // 0 = 原子，1 = 子表\n        char atom;          // tag = 0 时才有意义\n        GLNode* hp;         // tag = 1 时指向子表的第一个元素\n        GLNode* tp;         // 同一层的下一个元素\n    };\n\n    GenList();\n    ~GenList();\n    GLNode* createAtom(char value);\n    GLNode* createList();\n    GLNode* getHead(GLNode* list);\n    GLNode* getTail(GLNode* list);\n    int getDepth(GLNode* list);\n    int getLength(GLNode* list);\n    void printNode(GLNode* node);\n    void printChain(GLNode* first);\n    void printList(GLNode* list);\n    void destroyList(GLNode* list);\n    void setRoot(GLNode* node);\n\nprivate:\n    GLNode* root;\n};\n\nGenList::GenList()\n{\n    root = nullptr;\n}\n\nGenList::~GenList()\n{\n    destroyList(root);   // 整张表只在这里释放一次\n}\n\nGenList::GLNode* GenList::createAtom(char value)\n{\n    GLNode* node = new GLNode;\n    node->tag = 0;\n    node->atom = value;\n    node->hp = nullptr;\n    node->tp = nullptr;\n    return node;\n}\n\nGenList::GLNode* GenList::createList()\n{\n    GLNode* node = new GLNode;\n    node->tag = 1;\n    node->atom = '\\0';\n    node->hp = nullptr;   // hp 为空表示空表\n    node->tp = nullptr;\n    return node;\n}"},{"title":"求表头 head 与表尾 tail","note":"表头是 hp，表尾是 hp 后面用 tp 串起来的剩余部分","code":"GenList::GLNode* GenList::getHead(GLNode* list)\n{\n    if (list == nullptr || list->hp == nullptr)\n    {\n        std::cout << \"error! : head of empty list!\" << std::endl;\n        return nullptr;\n    }\n\n    return list->hp;   // 第一个元素，可能是原子，也可能是子表\n}\n\nGenList::GLNode* GenList::getTail(GLNode* list)\n{\n    if (list == nullptr || list->hp == nullptr)\n    {\n        std::cout << \"error! : tail of empty list!\" << std::endl;\n        return nullptr;\n    }\n\n    return list->hp->tp;   // 去掉表头后，剩下的节点仍由 tp 串着\n}"},{"title":"求广义表的深度","note":"空表深度 1，原子贡献 0，子表贡献自己的深度","code":"int GenList::getDepth(GLNode* list)\n{\n    if (list == nullptr || list->hp == nullptr)\n    {\n        return 1;   // 空表也算一层括号\n    }\n\n    int maxDepth = 0;\n    GLNode* p = list->hp;\n    while (p != nullptr)\n    {\n        int childDepth;\n        if (p->tag == 0)\n        {\n            childDepth = 0;   // 原子不再往下\n        }\n        else\n        {\n            childDepth = getDepth(p);   // 子表的深度递归算\n        }\n\n        if (childDepth > maxDepth)\n        {\n            maxDepth = childDepth;\n        }\n        p = p->tp;\n    }\n\n    return maxDepth + 1;   // 最外面还要包一层括号\n}"},{"title":"求广义表的长度","note":"长度是同一层元素的个数，只看 tp 串了多少个","code":"int GenList::getLength(GLNode* list)\n{\n    if (list == nullptr)\n    {\n        return 0;\n    }\n\n    int count = 0;\n    GLNode* p = list->hp;\n    while (p != nullptr)\n    {\n        count++;\n        p = p->tp;\n    }\n\n    return count;\n}"},{"title":"打印与销毁","note":"打印时遇到子表加括号，销毁时先记住 tp 再 delete","code":"void GenList::printNode(GLNode* node)\n{\n    if (node->tag == 0)\n    {\n        std::cout << node->atom;\n        return;\n    }\n\n    std::cout << \"(\";\n    printChain(node->hp);\n    std::cout << \")\";\n}\n\nvoid GenList::printChain(GLNode* first)\n{\n    GLNode* p = first;\n    while (p != nullptr)\n    {\n        printNode(p);\n        if (p->tp != nullptr)\n        {\n            std::cout << \",\";\n        }\n        p = p->tp;\n    }\n}\n\nvoid GenList::printList(GLNode* list)\n{\n    std::cout << \"(\";\n    if (list != nullptr)\n    {\n        printChain(list->hp);\n    }\n    std::cout << \")\" << std::endl;\n}\n\nvoid GenList::destroyList(GLNode* list)\n{\n    if (list == nullptr)\n    {\n        return;\n    }\n    GLNode* p = list->hp;\n    while (p != nullptr)\n    {\n        GLNode* next = p->tp;   // 先记住下一个，delete 后就找不到了\n        if (p->tag == 1)\n        {\n            destroyList(p);   // 子表连同它的 hp 链一起释放\n        }\n        else\n        {\n            delete p;\n        }\n        p = next;\n    }\n    delete list;\n}\n\nvoid GenList::setRoot(GLNode* node)\n{\n    root = node;\n}"},{"title":"main：跑一遍","note":"构造 (a,(b,c),d)，打印长度、深度、head 和 tail","code":"int main()\n{\n    GenList g;\n    GenList::GLNode* list = g.createList();\n    GenList::GLNode* a = g.createAtom('a'), *sub = g.createList();\n    GenList::GLNode* b = g.createAtom('b'), *c = g.createAtom('c'), *d = g.createAtom('d');\n    sub->hp = b;\n    b->tp = c;        // 子表 (b,c)\n    sub->tp = d;      // 子表后面接 d\n    a->tp = sub;      // 原子 a 后面接子表\n    list->hp = a;     // 整张表以 a 开头\n    g.setRoot(list);\n\n    std::cout << \"list   = \";\n    g.printList(list);\n    std::cout << \"length = \" << g.getLength(list) << std::endl;\n    std::cout << \"depth  = \" << g.getDepth(list) << std::endl;\n    GenList::GLNode* h = g.getHead(list);\n    std::cout << \"head   = \";\n    g.printNode(h);\n    std::cout << std::endl;\n    GenList::GLNode* t = g.getTail(list);\n    std::cout << \"tail   = (\";\n    g.printChain(t);\n    std::cout << \")\" << std::endl;\n\n    return 0;\n}"}]},"rs":{"file":"genlist.rs","steps":[{"title":"节点定义（头尾链表表示法）","note":"tag 区分原子和子表，hp 指向表头，tp 指向同层下一个","code":"struct GLNode\n{\n    tag: i32,                   // 0 = 原子，1 = 子表\n    atom: char,                 // tag = 0 时才有意义\n    hp: Option<Box<GLNode>>,    // tag = 1 时指向子表的第一个元素\n    tp: Option<Box<GLNode>>,    // 同一层的下一个元素\n}\n\nimpl GLNode\n{\n    fn new() -> GLNode\n    {\n        GLNode { tag: 1, atom: '\\0', hp: None, tp: None }   // 空表\n    }\n\n    fn atom(value: char) -> GLNode\n    {\n        GLNode { tag: 0, atom: value, hp: None, tp: None }\n    }\n}"},{"title":"求表头 head 与表尾 tail","note":"表头是 hp，表尾是 hp 后面用 tp 串起来的剩余部分","code":"impl GLNode\n{\n    fn head(&self) -> Option<&GLNode>\n    {\n        self.hp.as_deref()   // 第一个元素，可能是原子，也可能是子表\n    }\n\n    fn tail(&self) -> Option<&GLNode>\n    {\n        match self.hp.as_deref()\n        {\n            None => None,\n            Some(first) => first.tp.as_deref(),   // 跳过表头，剩下仍由 tp 串着\n        }\n    }\n}"},{"title":"求广义表的深度","note":"空表深度 1，原子贡献 0，子表贡献自己的深度","code":"impl GLNode\n{\n    fn depth(&self) -> i32\n    {\n        if self.hp.is_none()\n        {\n            return 1;   // 空表也算一层括号\n        }\n\n        let mut max_depth = 0;\n        let mut p = self.hp.as_deref();\n        while let Some(node) = p\n        {\n            let child = if node.tag == 0 { 0 } else { node.depth() };\n            if child > max_depth\n            {\n                max_depth = child;\n            }\n            p = node.tp.as_deref();\n        }\n\n        max_depth + 1   // 最外面还要包一层括号\n    }\n}"},{"title":"求广义表的长度","note":"长度是同一层元素的个数，只看 tp 串了多少个","code":"impl GLNode\n{\n    fn length(&self) -> i32\n    {\n        let mut count = 0;\n        let mut p = self.hp.as_deref();\n        while let Some(node) = p\n        {\n            count += 1;\n            p = node.tp.as_deref();\n        }\n\n        count\n    }\n}"},{"title":"打印与销毁","note":"打印时遇到子表加括号，clear 赋 None 会自动释放整条链","code":"impl GLNode\n{\n    fn print_node(node: &GLNode)\n    {\n        if node.tag == 0\n        {\n            print!(\"{}\", node.atom);\n            return;\n        }\n\n        print!(\"(\");\n        GLNode::print_chain(node.hp.as_deref());\n        print!(\")\");\n    }\n\n    fn print_chain(mut p: Option<&GLNode>)\n    {\n        let mut first = true;\n        while let Some(node) = p\n        {\n            if !first\n            {\n                print!(\",\");\n            }\n            GLNode::print_node(node);\n            first = false;\n            p = node.tp.as_deref();\n        }\n    }\n\n    fn print_list(&self)\n    {\n        print!(\"(\");\n        GLNode::print_chain(self.hp.as_deref());\n        println!(\")\");\n    }\n\n    fn clear(&mut self)\n    {\n        self.hp = None;   // Box 的 Drop 会一层层把子表和 tp 链释放掉\n        self.tp = None;\n    }\n}"},{"title":"main：跑一遍","note":"构造 (a,(b,c),d)，打印长度、深度、head 和 tail","code":"fn main()\n{\n    let mut root = GLNode::new();\n    let mut a = GLNode::atom('a');\n    let mut sub = GLNode::new();\n\n    let mut b = GLNode::atom('b');\n    b.tp = Some(Box::new(GLNode::atom('c')));   // 子表里的 b,c\n    sub.hp = Some(Box::new(b));\n    sub.tp = Some(Box::new(GLNode::atom('d'))); // 子表后面接 d\n\n    a.tp = Some(Box::new(sub));                 // 原子 a 后面接子表\n    root.hp = Some(Box::new(a));                // 整张表以 a 开头\n\n    print!(\"list   = \");\n    root.print_list();\n    println!(\"length = {}\", root.length());\n    println!(\"depth  = {}\", root.depth());\n\n    match root.head()\n    {\n        Some(h) =>\n        {\n            print!(\"head   = \");\n            GLNode::print_node(h);\n            println!();\n        }\n        None => println!(\"head   = (empty)\"),\n    }\n\n    print!(\"tail   = (\");\n    GLNode::print_chain(root.tail());\n    println!(\")\");\n\n    root.clear();   // 整个表在这里释放\n}"}]}},"tree":{"c":{"file":"tree.c","steps":[{"title":"二叉链表节点定义","note":"每个节点存一个字符，外加左右两个孩子指针","code":"#include <stdio.h>\n#include <stdlib.h>\n#include <stdbool.h>\n\ntypedef struct TreeNode\n{\n    char data;\n    struct TreeNode* left;\n    struct TreeNode* right;\n} TreeNode;\n\nTreeNode* treeCreateNode(char value)\n{\n    TreeNode* node = (TreeNode*)malloc(sizeof(TreeNode));\n    if (node == NULL)\n    {\n        printf(\"error! : malloc failed!\\n\");\n        return NULL;\n    }\n    node->data = value;\n    node->left = NULL; node->right = NULL;\n    return node;\n}"},{"title":"按前序序列建树","note":"井号表示空，递归读完一棵子树再读下一棵","code":"TreeNode* treeBuild(const char** cursor)\n{\n    char ch = **cursor;\n    if (ch == '\\0')\n    {\n        printf(\"error! : sequence ended too early!\\n\");\n        return NULL;\n    }\n    (*cursor)++;                      // 这个字符用掉了，指针往后挪一格\n    if (ch == '#')\n    {\n        return NULL;                  // 井号就代表空树\n    }\n    TreeNode* node = treeCreateNode(ch);\n    if (node == NULL)\n    {\n        return NULL;\n    }\n    node->left = treeBuild(cursor);   // 先建左子树\n    node->right = treeBuild(cursor);  // 再建右子树\n    return node;\n}"},{"title":"前序 / 中序 / 后序遍历","note":"三个递归函数，区别只是\"自己\"放在什么位置","code":"void preOrder(TreeNode* root)\n{\n    if (root == NULL)\n    {\n        return;\n    }\n    printf(\"%c \", root->data);   // 根\n    preOrder(root->left);        // 左\n    preOrder(root->right);       // 右\n}\nvoid inOrder(TreeNode* root)\n{\n    if (root == NULL)\n    {\n        return;\n    }\n    inOrder(root->left);         // 左\n    printf(\"%c \", root->data);   // 根\n    inOrder(root->right);        // 右\n}\nvoid postOrder(TreeNode* root)\n{\n    if (root == NULL)\n    {\n        return;\n    }\n    postOrder(root->left);       // 左\n    postOrder(root->right);      // 右\n    printf(\"%c \", root->data);   // 根\n}"},{"title":"层序遍历（队列）","note":"用数组当下标队列，出一队就把两个孩子入队","code":"void levelOrder(TreeNode* root)\n{\n    if (root == NULL)\n    {\n        return;\n    }\n    TreeNode* queue[64];\n    int head = 0; int tail = 0;      // 队头出、队尾进\n    queue[tail] = root; tail++;\n    while (head < tail)\n    {\n        TreeNode* cur = queue[head];\n        head++;\n        printf(\"%c \", cur->data);\n        if (tail >= 63)           // 两个孩子都入队，先留够位置\n        {\n            printf(\"error! : queue overflow!\\n\");\n            return;\n        }\n        if (cur->left != NULL)\n        {\n            queue[tail] = cur->left;\n            tail++;\n        }\n        if (cur->right != NULL)\n        {\n            queue[tail] = cur->right;\n            tail++;\n        }\n    }\n}"},{"title":"求节点数与树高","note":"都是递归，树高取左右子树里高的那棵再加一","code":"int countNodes(TreeNode* root)\n{\n    if (root == NULL)\n    {\n        return 0;\n    }\n    return countNodes(root->left) + countNodes(root->right) + 1;\n}\nint treeHeight(TreeNode* root)\n{\n    if (root == NULL)\n    {\n        return 0;\n    }\n    int leftHeight = treeHeight(root->left);\n    int rightHeight = treeHeight(root->right);\n    return (leftHeight > rightHeight ? leftHeight : rightHeight) + 1;\n}\nvoid treeFree(TreeNode* root)\n{\n    if (root == NULL)\n    {\n        return;\n    }\n    treeFree(root->left); treeFree(root->right);\n    free(root);                   // 后序释放：先放孩子再放自己\n}"},{"title":"哈夫曼树与编码","note":"用数组存树，每次线性扫描挑两个最小的合并","code":"void huffmanFindTwo(int weight[], int parent[], int count, int* first, int* second)\n{\n    *first = -1;\n    *second = -1;\n    for (int i = 0; i < count; i++)\n    {\n        if (parent[i] != -1)\n        {\n            continue;             // 已经有父亲的不是根，不参加合并\n        }\n        if (*first == -1 || weight[i] < weight[*first])\n        {\n            *second = *first;     // 原来的最小退成第二小\n            *first = i;\n        }\n        else if (*second == -1 || weight[i] < weight[*second])\n        {\n            *second = i;\n        }\n    }\n}\nvoid huffmanBuild(int weight[], int n, int parent[], int left[], int right[])\n{\n    int total = 2 * n - 1;\n    for (int i = 0; i < total; i++)\n    {\n        parent[i] = -1;\n        left[i] = -1;\n        right[i] = -1;\n    }\n    for (int i = n; i < total; i++)\n    {\n        int first = -1;\n        int second = -1;\n        huffmanFindTwo(weight, parent, i, &first, &second);\n        weight[i] = weight[first] + weight[second];   // 新节点权值 = 两个孩子之和\n        left[i] = first;\n        right[i] = second;\n        parent[first] = i;\n        parent[second] = i;\n    }\n}\nint huffmanPrintCode(int weight[], int parent[], int left[], int n)\n{\n    int wpl = 0;\n    for (int i = 0; i < n; i++)\n    {\n        char code[64];\n        int depth = 0;\n        int cur = i;\n        while (parent[cur] != -1)     // 从叶子往根走，边走边记 0/1\n        {\n            int p = parent[cur];\n            code[depth] = (left[p] == cur) ? '0' : '1';\n            depth++;\n            cur = p;\n        }\n        printf(\"  权值 %2d -> \", weight[i]);\n        for (int k = depth - 1; k >= 0; k--)   // 记下来的是倒的，要反着打印\n        {\n            printf(\"%c\", code[k]);\n        }\n        printf(\"\\n\"); wpl += weight[i] * depth;\n    }\n    return wpl;\n}"},{"title":"main：跑一遍","note":"先建树看四种遍历，再跑一遍哈夫曼","code":"int main(void)\n{\n    const char* sequence = \"ABD##E##CF##G##\";\n    TreeNode* root = treeBuild(&sequence);\n    if (root == NULL)\n    {\n        return 0;\n    }\n    printf(\"前序 = \"); preOrder(root); printf(\"\\n\");\n    printf(\"中序 = \"); inOrder(root); printf(\"\\n\");\n    printf(\"后序 = \"); postOrder(root); printf(\"\\n\");\n    printf(\"层序 = \"); levelOrder(root); printf(\"\\n\");\n    printf(\"节点数 = %d\\n\", countNodes(root));\n    printf(\"树高   = %d\\n\", treeHeight(root));\n    int weight[64] = { 5, 7, 2, 13, 9, 3 };\n    int parent[64]; int left[64]; int right[64];\n    int n = 6;\n    huffmanBuild(weight, n, parent, left, right);\n    printf(\"哈夫曼编码表:\\n\");\n    printf(\"WPL = %d\\n\", huffmanPrintCode(weight, parent, left, n));\n    treeFree(root); return 0;\n}"}]},"cpp":{"file":"tree.cpp","steps":[{"title":"二叉链表节点定义","note":"用 class 包住整棵树，节点里存字符和左右孩子","code":"#include <iostream>\n\nclass Tree\n{\npublic:\n    Tree() { root = nullptr; }\n    ~Tree() { destroy(root); }\n    void build(const char* sequence) { root = buildNode(&sequence); }\n    void preOrder() { preOrderPrint(root); std::cout << std::endl; }\n    void inOrder() { inOrderPrint(root); std::cout << std::endl; }\n    void postOrder() { postOrderPrint(root); std::cout << std::endl; }\n    void levelOrder();\n    int nodeCount() { return countNode(root); }\n    int height() { return nodeHeight(root); }\n\nprivate:\n    struct Node\n    {\n        char data;\n        Node* left;\n        Node* right;\n    };\n    Node* root;\n    Node* buildNode(const char** cursor);\n    void preOrderPrint(Node* node);\n    void inOrderPrint(Node* node);\n    void postOrderPrint(Node* node);\n    int countNode(Node* node);\n    int nodeHeight(Node* node);\n    void destroy(Node* node);\n};\n\nvoid Tree::destroy(Tree::Node* node)\n{\n    if (node == nullptr)\n    {\n        return;\n    }\n    destroy(node->left);\n    destroy(node->right);\n    delete node;                  // 后序释放：先放孩子，再放自己\n}"},{"title":"按前序序列建树","note":"井号表示空，递归读完一棵子树再读下一棵","code":"Tree::Node* Tree::buildNode(const char** cursor)\n{\n    char ch = **cursor;\n    if (ch == '\\0')\n    {\n        std::cout << \"error! : sequence ended too early!\" << std::endl;\n        return nullptr;\n    }\n    (*cursor)++;                  // 这个字符用掉了，指针往后挪一格\n    if (ch == '#')\n    {\n        return nullptr;           // 井号就代表空树\n    }\n    Node* node = new Node;\n    node->data = ch;\n    node->left = buildNode(cursor);    // 先建左子树\n    node->right = buildNode(cursor);   // 再建右子树\n    return node;\n}"},{"title":"前序 / 中序 / 后序遍历","note":"三个递归函数，区别只是\"自己\"放在什么位置","code":"void Tree::preOrderPrint(Tree::Node* node)\n{\n    if (node == nullptr)\n    {\n        return;\n    }\n    std::cout << node->data << \" \";    // 根\n    preOrderPrint(node->left);         // 左\n    preOrderPrint(node->right);        // 右\n}\nvoid Tree::inOrderPrint(Tree::Node* node)\n{\n    if (node == nullptr)\n    {\n        return;\n    }\n    inOrderPrint(node->left);          // 左\n    std::cout << node->data << \" \";    // 根\n    inOrderPrint(node->right);         // 右\n}\nvoid Tree::postOrderPrint(Tree::Node* node)\n{\n    if (node == nullptr)\n    {\n        return;\n    }\n    postOrderPrint(node->left);        // 左\n    postOrderPrint(node->right);       // 右\n    std::cout << node->data << \" \";    // 根\n}"},{"title":"层序遍历（队列）","note":"用数组当下标队列，出一队就把两个孩子入队","code":"void Tree::levelOrder()\n{\n    if (root == nullptr)\n    {\n        return;\n    }\n    Node* queue[64];\n    int head = 0; int tail = 0;\n    queue[tail++] = root;\n    while (head < tail)\n    {\n        Node* cur = queue[head++];\n        std::cout << cur->data << \" \";\n        if (tail >= 63)\n        {\n            std::cout << \"error! : queue overflow!\" << std::endl;\n            return;\n        }\n        if (cur->left != nullptr)\n        {\n            queue[tail++] = cur->left;\n        }\n        if (cur->right != nullptr)\n        {\n            queue[tail++] = cur->right;\n        }\n    }\n    std::cout << std::endl;\n}"},{"title":"求节点数与树高","note":"都是递归，树高取左右子树里高的那棵再加一","code":"int Tree::countNode(Tree::Node* node)\n{\n    if (node == nullptr)\n    {\n        return 0;\n    }\n    return countNode(node->left) + countNode(node->right) + 1;\n}\nint Tree::nodeHeight(Tree::Node* node)\n{\n    if (node == nullptr)\n    {\n        return 0;\n    }\n    int leftHeight = nodeHeight(node->left);\n    int rightHeight = nodeHeight(node->right);\n    return (leftHeight > rightHeight ? leftHeight : rightHeight) + 1;\n}"},{"title":"哈夫曼树与编码","note":"用数组存树，每次线性扫描挑两个最小的合并","code":"void huffmanFindTwo(int weight[], int parent[], int count, int& first, int& second)\n{\n    first = -1;\n    second = -1;\n    for (int i = 0; i < count; i++)\n    {\n        if (parent[i] != -1)\n        {\n            continue;             // 已经有父亲的不是根，不参加合并\n        }\n        if (first == -1 || weight[i] < weight[first])\n        {\n            second = first;       // 原来的最小退成第二小\n            first = i;\n        }\n        else if (second == -1 || weight[i] < weight[second])\n        {\n            second = i;\n        }\n    }\n}\nvoid huffmanBuild(int weight[], int n, int parent[], int left[], int right[])\n{\n    int total = 2 * n - 1;\n    for (int i = 0; i < total; i++)\n    {\n        parent[i] = -1;\n        left[i] = -1;\n        right[i] = -1;\n    }\n    for (int i = n; i < total; i++)\n    {\n        int first = 0; int second = 0;\n        huffmanFindTwo(weight, parent, i, first, second);\n        weight[i] = weight[first] + weight[second];   // 新节点权值 = 两个孩子之和\n        left[i] = first;\n        right[i] = second;\n        parent[first] = i;\n        parent[second] = i;\n    }\n}\nint huffmanPrintCodes(int weight[], int parent[], int left[], int n)\n{\n    int wpl = 0;\n    for (int i = 0; i < n; i++)\n    {\n        char code[64];\n        int depth = 0;\n        int cur = i;\n        while (parent[cur] != -1)     // 从叶子往根走，边走边记 0/1\n        {\n            int p = parent[cur];\n            code[depth] = (left[p] == cur) ? '0' : '1';\n            depth++;\n            cur = p;\n        }\n        std::cout << \"  权值 \" << weight[i] << \" -> \";\n        for (int k = depth - 1; k >= 0; k--)   // 记下来的是倒的，要反着打印\n        {\n            std::cout << code[k];\n        }\n        std::cout << std::endl; wpl += weight[i] * depth;\n    }\n    return wpl;\n}"},{"title":"main：跑一遍","note":"先建树看四种遍历，再跑一遍哈夫曼","code":"int main()\n{\n    Tree tree;\n    tree.build(\"ABD##E##CF##G##\");\n    std::cout << \"前序 = \"; tree.preOrder();\n    std::cout << \"中序 = \"; tree.inOrder();\n    std::cout << \"后序 = \"; tree.postOrder();\n    std::cout << \"层序 = \"; tree.levelOrder();\n    std::cout << \"节点数 = \" << tree.nodeCount() << std::endl;\n    std::cout << \"树高   = \" << tree.height() << std::endl;\n\n    int weight[64] = { 5, 7, 2, 13, 9, 3 };\n    int parent[64]; int left[64]; int right[64];\n    huffmanBuild(weight, 6, parent, left, right);\n    std::cout << \"哈夫曼编码表:\" << std::endl;\n    int wpl = huffmanPrintCodes(weight, parent, left, 6);\n    std::cout << \"WPL = \" << wpl << std::endl;\n    return 0;\n}"}]},"rs":{"file":"tree.rs","steps":[{"title":"二叉链表节点定义","note":"每个节点存一个字符，孩子用 Option<Box<Node>> 表示","code":"struct Node\n{\n    data: char,\n    left: Option<Box<Node>>,\n    right: Option<Box<Node>>,\n}\n\nimpl Node\n{\n    fn new(data: char) -> Self\n    {\n        Node { data, left: None, right: None }\n    }\n}"},{"title":"按前序序列建树","note":"井号表示空，递归读完一棵子树再读下一棵","code":"fn build_node(seq: &[u8], pos: &mut usize) -> Option<Box<Node>>\n{\n    if *pos >= seq.len()\n    {\n        println!(\"error! : sequence ended too early!\");\n        return None;\n    }\n    let ch = seq[*pos] as char;\n    *pos += 1;                        // 这个字符用掉了，下标往后挪一格\n    if ch == '#'\n    {\n        return None;                  // 井号就代表空树\n    }\n    let mut node = Box::new(Node::new(ch));\n    node.left = build_node(seq, pos);     // 先建左子树\n    node.right = build_node(seq, pos);    // 再建右子树\n    Some(node)\n}"},{"title":"前序 / 中序 / 后序遍历","note":"三个递归函数，区别只是\"自己\"放在什么位置","code":"fn pre_order_print(node: &Option<Box<Node>>)\n{\n    if let Some(n) = node\n    {\n        print!(\"{} \", n.data);        // 根\n        pre_order_print(&n.left);     // 左\n        pre_order_print(&n.right);    // 右\n    }\n}\n\nfn in_order_print(node: &Option<Box<Node>>)\n{\n    if let Some(n) = node\n    {\n        in_order_print(&n.left);      // 左\n        print!(\"{} \", n.data);        // 根\n        in_order_print(&n.right);     // 右\n    }\n}\n\nfn post_order_print(node: &Option<Box<Node>>)\n{\n    if let Some(n) = node\n    {\n        post_order_print(&n.left);    // 左\n        post_order_print(&n.right);   // 右\n        print!(\"{} \", n.data);        // 根\n    }\n}"},{"title":"层序遍历（队列）","note":"用 Vec 当下标队列，出一队就把两个孩子入队","code":"fn level_order(root: &Option<Box<Node>>)\n{\n    let mut queue: Vec<&Node> = Vec::new();\n    if let Some(n) = root.as_deref()\n    {\n        queue.push(n);\n    }\n    let mut head = 0;\n    while head < queue.len()\n    {\n        let cur = queue[head];\n        head += 1;\n        print!(\"{} \", cur.data);\n        if let Some(left) = cur.left.as_deref()\n        {\n            queue.push(left);\n        }\n        if let Some(right) = cur.right.as_deref()\n        {\n            queue.push(right);\n        }\n    }\n    println!();\n}"},{"title":"求节点数与树高","note":"都是递归，树高取左右子树里高的那棵再加一","code":"fn count_nodes(node: &Option<Box<Node>>) -> i32\n{\n    match node\n    {\n        None => 0,\n        Some(n) => count_nodes(&n.left) + count_nodes(&n.right) + 1,\n    }\n}\n\nfn tree_height(node: &Option<Box<Node>>) -> i32\n{\n    match node\n    {\n        None => 0,\n        Some(n) =>\n        {\n            let left = tree_height(&n.left);\n            let right = tree_height(&n.right);\n            if left > right\n            {\n                left + 1\n            }\n            else\n            {\n                right + 1\n            }\n        }\n    }\n}"},{"title":"哈夫曼树与编码","note":"用数组存树，每次线性扫描挑两个最小的合并","code":"struct Huffman\n{\n    weight: Vec<i32>,\n    parent: Vec<i32>,\n    left: Vec<i32>,\n    right: Vec<i32>,\n    n: usize,\n}\n\nimpl Huffman\n{\n    fn new(values: &[i32]) -> Self\n    {\n        let n = values.len();\n        let total = 2 * n - 1;\n        let mut weight = values.to_vec();\n        weight.resize(total, 0);\n        Huffman\n        {\n            weight,\n            parent: vec![-1; total],\n            left: vec![-1; total],\n            right: vec![-1; total],\n            n,\n        }\n    }\n    fn find_two_smallest(&self, count: usize) -> (usize, usize)\n    {\n        let mut first: i32 = -1;\n        let mut second: i32 = -1;\n        for i in 0..count\n        {\n            if self.parent[i] != -1\n            {\n                continue;             // 已经有父亲的不是根，不参加合并\n            }\n            if first == -1 || self.weight[i] < self.weight[first as usize]\n            {\n                second = first;       // 原来的最小退成第二小\n                first = i as i32;\n            }\n            else if second == -1 || self.weight[i] < self.weight[second as usize]\n            {\n                second = i as i32;\n            }\n        }\n        (first as usize, second as usize)\n    }\n\n    fn build(&mut self)\n    {\n        for i in self.n..2 * self.n - 1\n        {\n            let (first, second) = self.find_two_smallest(i);\n            self.weight[i] = self.weight[first] + self.weight[second];\n            self.left[i] = first as i32;\n            self.right[i] = second as i32;\n            self.parent[first] = i as i32;\n            self.parent[second] = i as i32;\n        }\n    }\n\n    fn print_codes(&self) -> i32\n    {\n        let mut wpl = 0;\n        for i in 0..self.n\n        {\n            let mut code: Vec<char> = Vec::new();\n            let mut cur = i as i32;\n            while self.parent[cur as usize] != -1     // 从叶子往根走，边走边记 0/1\n            {\n                let p = self.parent[cur as usize] as usize;\n                code.push(if self.left[p] == cur { '0' } else { '1' });\n                cur = p as i32;\n            }\n            print!(\"  权值 {:2} -> \", self.weight[i]);\n            for k in (0..code.len()).rev()            // 记下来的是倒的，要反着打印\n            {\n                print!(\"{}\", code[k]);\n            }\n            println!();\n            wpl += self.weight[i] * code.len() as i32;\n        }\n        wpl\n    }\n}"},{"title":"main：跑一遍","note":"先建树看四种遍历，再跑一遍哈夫曼","code":"fn main()\n{\n    let mut pos = 0;\n    let root = build_node(b\"ABD##E##CF##G##\", &mut pos);\n    print!(\"前序 = \"); pre_order_print(&root); println!();\n    print!(\"中序 = \"); in_order_print(&root); println!();\n    print!(\"后序 = \"); post_order_print(&root); println!();\n    print!(\"层序 = \"); level_order(&root);\n    println!(\"节点数 = {}\", count_nodes(&root));\n    println!(\"树高   = {}\", tree_height(&root));\n    let values = [5, 7, 2, 13, 9, 3];\n    let mut huffman = Huffman::new(&values);\n    huffman.build();\n    println!(\"哈夫曼编码表:\");\n    let wpl = huffman.print_codes();\n    println!(\"WPL = {}\", wpl);\n}"}]}},"bst":{"c":{"file":"bst.c","steps":[{"title":"节点定义","note":"每个节点存一个值，外加左右两个孩子指针","code":"#include <stdio.h>\n#include <stdlib.h>\n#include <stdbool.h>\ntypedef struct BSTNode\n{\n    int data;\n    struct BSTNode* left;\n    struct BSTNode* right;\n} BSTNode;\nBSTNode* bstCreateNode(int value)\n{\n    BSTNode* p = (BSTNode*)malloc(sizeof(BSTNode));\n    if (p == NULL)\n    {\n        printf(\"error! : malloc failed!\\n\");\n        return NULL;\n    }\n    p->data = value;\n    p->left = NULL;\n    p->right = NULL;\n    return p;\n}\nvoid bstFree(BSTNode* root)\n{\n    if (root == NULL)\n    {\n        return;\n    }\n    bstFree(root->left);   // 后序释放：先放左右，再放自己\n    bstFree(root->right);\n    free(root);\n}"},{"title":"插入 insert","note":"比当前节点小就往左走，大就往右走，走到空位就挂上去","code":"BSTNode* bstInsert(BSTNode* root, int value)\n{\n    if (root == NULL)\n    {\n        return bstCreateNode(value);   // 空位置就是它该待的地方\n    }\n    if (value < root->data)\n    {\n        root->left = bstInsert(root->left, value);\n    }\n    else if (value > root->data)\n    {\n        root->right = bstInsert(root->right, value);\n    }\n    return root;   // 相等说明树里已经有了，什么也不做\n}"},{"title":"查找 search","note":"每比较一次就砍掉一半子树，所以用循环就够了","code":"BSTNode* bstSearch(BSTNode* root, int value)\n{\n    while (root != NULL)\n    {\n        if (value == root->data)\n        {\n            return root;\n        }\n        root = (value < root->data) ? root->left : root->right;\n    }\n    return NULL;\n}"},{"title":"找最小值 minNode","note":"一路向左走到底，最左边那个就是最小值","code":"BSTNode* bstMinNode(BSTNode* root)\n{\n    if (root == NULL)\n    {\n        return NULL;\n    }\n    while (root->left != NULL)\n    {\n        root = root->left;\n    }\n    return root;\n}"},{"title":"删除 remove（三种情况）","note":"叶子直接删、单孩子顶替、双孩子用中序后继替换","code":"BSTNode* bstRemove(BSTNode* root, int value)\n{\n    if (root == NULL)\n    {\n        printf(\"error! : value %d not found!\\n\", value);\n        return NULL;\n    }\n    if (value < root->data)\n    {\n        root->left = bstRemove(root->left, value);\n        return root;\n    }\n    if (value > root->data)\n    {\n        root->right = bstRemove(root->right, value);\n        return root;\n    }\n    if (root->left == NULL || root->right == NULL)   // 情况 1 和 2：最多一个孩子\n    {\n        BSTNode* child = (root->left != NULL) ? root->left : root->right;\n        free(root);\n        return child;\n    }\n    // 情况 3：左右都有，用右子树的最小值（中序后继）顶替自己\n    BSTNode* succ = bstMinNode(root->right);\n    root->data = succ->data;\n    root->right = bstRemove(root->right, succ->data);\n    return root;\n}"},{"title":"中序遍历 inorder","note":"左-根-右，打印出来一定是递增的","code":"void bstInorder(BSTNode* root)\n{\n    if (root == NULL)\n    {\n        return;\n    }\n    bstInorder(root->left);\n    printf(\" %d\", root->data);\n    bstInorder(root->right);\n}\nvoid bstPrint(char* tag, BSTNode* root)\n{\n    printf(\"%-22s inorder =\", tag);\n    bstInorder(root);\n    printf(\"\\n\");\n}"},{"title":"main：跑一遍","note":"打印中序序列证明有序，并演示三种删除","code":"int main(void)\n{\n    int keys[] = { 8, 3, 10, 1, 6, 14, 4, 7, 13 };\n    BSTNode* root = NULL;\n    for (int i = 0; i < 9; i++)\n    {\n        root = bstInsert(root, keys[i]);\n    }\n    root = bstInsert(root, 6);   // 重复值会被忽略\n    bstPrint(\"after insert\", root);\n    printf(\"search(7) -> %s\\n\", bstSearch(root, 7) != NULL ? \"found\" : \"not found\");\n    printf(\"search(5) -> %s\\n\", bstSearch(root, 5) != NULL ? \"found\" : \"not found\");\n    printf(\"min value = %d\\n\", bstMinNode(root)->data);\n    root = bstRemove(root, 1);    // 情况 1：叶子\n    bstPrint(\"remove(1) leaf\", root);\n    root = bstRemove(root, 14);   // 情况 2：只有一个孩子\n    bstPrint(\"remove(14) one child\", root);\n    root = bstRemove(root, 6);    // 情况 3：两个孩子都在\n    bstPrint(\"remove(6) two children\", root);\n    bstFree(root);\n    return 0;\n}"}]},"cpp":{"file":"bst.cpp","steps":[{"title":"节点定义与构造析构","note":"每个节点最多两个孩子，并且满足\"左小右大\"","code":"#include <iostream>\n\nclass BST\n{\npublic:\n    BST();\n    ~BST();\n    void insert(int value);\n    bool search(int value);\n    bool minValue(int& value);\n    void remove(int value);\n    void inorder();\n    void print();\n\nprivate:\n    struct Node\n    {\n        int data;\n        Node* left;\n        Node* right;\n    };\n\n    Node* root;\n\n    // 递归函数都返回\"处理完之后这棵子树的新根\"\n    Node* insertNode(Node* node, int value);\n    Node* removeNode(Node* node, int value);\n    void  inorderPrint(Node* node);\n    void  destroy(Node* node);\n};\n\nBST::BST()\n{\n    root = nullptr;\n}\n\nvoid BST::destroy(BST::Node* node)\n{\n    if (node == nullptr)\n    {\n        return;\n    }\n\n    destroy(node->left);\n    destroy(node->right);\n    delete node;                   // 后序释放：先把孩子删干净再删自己\n}\n\nBST::~BST()\n{\n    destroy(root);\n}"},{"title":"插入 insert","note":"从根开始比大小，一路走到空位就把新节点挂上去","code":"// 小坑：函数名前面的返回值类型要写 BST::Node*。\n// 因为读到 Node* 的时候还没进入 BST 的作用域，编译器不认识这个 Node。\nBST::Node* BST::insertNode(BST::Node* node, int value)\n{\n    if (node == nullptr)             // 走到空位了，新节点就长在这里\n    {\n        Node* fresh = new Node;\n        fresh->data = value;\n        fresh->left = nullptr;\n        fresh->right = nullptr;\n        return fresh;\n    }\n\n    if (value < node->data)\n    {\n        node->left = insertNode(node->left, value);     // 小就往左\n    }\n    else if (value > node->data)\n    {\n        node->right = insertNode(node->right, value);   // 大就往右\n    }\n    // 相等就什么都不做：BST 一般不存重复值\n\n    return node;\n}\n\nvoid BST::insert(int value)\n{\n    root = insertNode(root, value);\n}"},{"title":"查找 search","note":"和插入走的路径一模一样，只是走到就停","code":"bool BST::search(int value)\n{\n    Node* p = root;\n\n    while (p != nullptr)\n    {\n        if (value == p->data)\n        {\n            return true;\n        }\n        else if (value < p->data)\n        {\n            p = p->left;      // 比当前节点小，往左走\n        }\n        else\n        {\n            p = p->right;     // 比当前节点大，往右走\n        }\n    }\n\n    return false;\n}"},{"title":"找最小值 minValue","note":"一路往左走到底就是最小值","code":"bool BST::minValue(int& value)\n{\n    if (root == nullptr)\n    {\n        return false;\n    }\n\n    Node* p = root;\n    while (p->left != nullptr)\n    {\n        p = p->left;\n    }\n\n    value = p->data;\n    return true;\n}"},{"title":"删除 remove（三种情况）","note":"叶子直接删 / 一个孩子让娃顶替 / 两个孩子找中序后继","code":"BST::Node* BST::removeNode(BST::Node* node, int value)\n{\n    if (node == nullptr)\n    {\n        return nullptr;\n    }\n\n    if (value < node->data)\n    {\n        node->left = removeNode(node->left, value);\n        return node;\n    }\n\n    if (value > node->data)\n    {\n        node->right = removeNode(node->right, value);\n        return node;\n    }\n\n    // 下面就是找到要删的节点之后的三条路\n\n    if (node->left == nullptr && node->right == nullptr)   // 情况1：叶子\n    {\n        delete node;\n        return nullptr;                 // 直接摘掉，父节点那一侧会变成空\n    }\n\n    if (node->left == nullptr)           // 情况2：只有右孩子\n    {\n        Node* child = node->right;\n        delete node;\n        return child;                    // 让孩子顶替自己的位置\n    }\n\n    if (node->right == nullptr)          // 情况2：只有左孩子\n    {\n        Node* child = node->left;\n        delete node;\n        return child;\n    }\n\n    // 情况3：左右孩子都在。找右子树里的最小值（中序后继）来顶替自己\n    Node* successor = node->right;\n    while (successor->left != nullptr)\n    {\n        successor = successor->left;\n    }\n\n    node->data = successor->data;                             // 先把后继的值复制过来\n    node->right = removeNode(node->right, successor->data);   // 再去右子树把原来的后继删掉\n    return node;\n}\n\nvoid BST::remove(int value)\n{\n    root = removeNode(root, value);\n}"},{"title":"中序遍历 inorder","note":"左 -> 根 -> 右，对 BST 来说这个顺序一定是递增的","code":"void BST::inorderPrint(BST::Node* node)\n{\n    if (node == nullptr)\n    {\n        return;\n    }\n\n    inorderPrint(node->left);      // 1. 先处理左子树\n    std::cout << node->data << \" \";  // 2. 再输出自己\n    inorderPrint(node->right);     // 3. 最后处理右子树\n}\n\nvoid BST::inorder()\n{\n    inorderPrint(root);\n    std::cout << std::endl;\n}"},{"title":"main：跑一遍","note":"依次演示三种删除，每次删完都打印中序序列","code":"void BST::print()\n{\n    std::cout << \"中序 = \";\n    inorder();\n}\n\nint main()\n{\n    BST tree;\n    int keys[] = { 8, 3, 10, 1, 6, 14, 4, 7, 13 };\n\n    for (int i = 0; i < 9; i++)\n    {\n        tree.insert(keys[i]);\n    }\n    tree.print();                     // 1 3 4 6 7 8 10 13 14\n\n    std::cout << \"search(6)  -> \" << (tree.search(6) ? \"找到\" : \"没找到\") << std::endl;\n    std::cout << \"search(7)  -> \" << (tree.search(7) ? \"找到\" : \"没找到\") << std::endl;\n    std::cout << \"search(99) -> \" << (tree.search(99) ? \"找到\" : \"没找到\") << std::endl;\n\n    int minVal = 0;\n    if (tree.minValue(minVal))\n    {\n        std::cout << \"最小值 = \" << minVal << std::endl;\n    }\n\n    tree.remove(1);                   // 情况1：删叶子\n    std::cout << \"删掉 1（叶子）     \"; tree.print();\n\n    tree.remove(14);                  // 情况2：删只有一个孩子的节点\n    std::cout << \"删掉 14（一个孩子）\"; tree.print();\n\n    tree.remove(3);                   // 情况3：删有两个孩子的节点\n    std::cout << \"删掉 3（两个孩子）\"; tree.print();\n\n    return 0;\n}"}]},"rs":{"file":"bst.rs","steps":[{"title":"节点定义","note":"每个节点最多两个孩子，左小右大；孩子用 Option<Box<Node>> 表示","code":"struct Node\n{\n    data: i32,\n    left: Option<Box<Node>>,\n    right: Option<Box<Node>>,\n}\n\npub struct BST\n{\n    root: Option<Box<Node>>,     // None 表示空树\n}"},{"title":"插入 insert","note":"从根开始比大小，递归走到空位就把新节点挂上去","code":"fn insert_node(node: Option<Box<Node>>, value: i32) -> Option<Box<Node>>\n{\n    match node\n    {\n        None =>\n        {\n            // 走到空位了，新节点就长在这里\n            Some(Box::new(Node { data: value, left: None, right: None }))\n        }\n\n        Some(mut n) =>\n        {\n            if value < n.data\n            {\n                n.left = insert_node(n.left.take(), value);       // 小就往左\n            }\n            else if value > n.data\n            {\n                n.right = insert_node(n.right.take(), value);     // 大就往右\n            }\n            // 相等就什么都不做：BST 一般不存重复值\n\n            Some(n)\n        }\n    }\n}\n\nimpl BST\n{\n    pub fn new() -> BST\n    {\n        BST { root: None }\n    }\n\n    pub fn insert(&mut self, value: i32)\n    {\n        self.root = insert_node(self.root.take(), value);\n    }\n}"},{"title":"查找 search","note":"和插入走的路径一模一样，只是走到就停","code":"impl BST\n{\n    pub fn search(&self, value: i32) -> bool\n    {\n        let mut cur = self.root.as_deref();\n\n        while let Some(n) = cur\n        {\n            if value == n.data\n            {\n                return true;\n            }\n            else if value < n.data\n            {\n                cur = n.left.as_deref();     // 比当前节点小，往左走\n            }\n            else\n            {\n                cur = n.right.as_deref();    // 比当前节点大，往右走\n            }\n        }\n\n        false\n    }\n}"},{"title":"找最小值 min_value","note":"一路往左走到底就是最小值","code":"impl BST\n{\n    pub fn min_value(&self) -> Option<i32>\n    {\n        let mut cur = self.root.as_deref();\n        let mut min = None;\n\n        while let Some(n) = cur\n        {\n            min = Some(n.data);              // 每往左走一步就更新一次\n            cur = n.left.as_deref();\n        }\n\n        min                                  // 空树时循环一次都不进，返回 None\n    }\n}\n\n// 求一棵子树里的最小值（找中序后继要用）\nfn min_of(node: &Option<Box<Node>>) -> i32\n{\n    let mut cur = node.as_deref();\n    let mut min = 0;\n\n    while let Some(n) = cur\n    {\n        min = n.data;\n        cur = n.left.as_deref();\n    }\n\n    min\n}"},{"title":"删除 remove（三种情况）","note":"叶子直接删 / 一个孩子让娃顶替 / 两个孩子找中序后继","code":"fn remove_node(node: Option<Box<Node>>, value: i32) -> Option<Box<Node>>\n{\n    let mut n = match node\n    {\n        None => return None,\n        Some(n) => n,\n    };\n\n    if value < n.data\n    {\n        n.left = remove_node(n.left.take(), value);\n        return Some(n);\n    }\n\n    if value > n.data\n    {\n        n.right = remove_node(n.right.take(), value);\n        return Some(n);\n    }\n\n    // 下面就是找到要删的节点之后的三条路\n\n    if n.left.is_none() && n.right.is_none()      // 情况1：叶子\n    {\n        return None;                              // 直接摘掉，父节点那一侧会变成空\n    }\n\n    if n.left.is_none()                           // 情况2：只有右孩子\n    {\n        return n.right;                           // 让孩子顶替自己的位置\n    }\n\n    if n.right.is_none()                          // 情况2：只有左孩子\n    {\n        return n.left;\n    }\n\n    // 情况3：左右孩子都在。找右子树里的最小值（中序后继）来顶替自己\n    let successor = min_of(&n.right);\n    n.data = successor;                                       // 先把后继的值复制过来\n    n.right = remove_node(n.right.take(), successor);         // 再去右子树把原来的后继删掉\n    Some(n)\n}\n\nimpl BST\n{\n    pub fn remove(&mut self, value: i32)\n    {\n        self.root = remove_node(self.root.take(), value);\n    }\n}"},{"title":"中序遍历 inorder","note":"左 -> 根 -> 右，对 BST 来说这个顺序一定是递增的","code":"fn inorder_print(node: &Option<Box<Node>>)\n{\n    if let Some(n) = node\n    {\n        inorder_print(&n.left);       // 1. 先处理左子树\n        print!(\"{} \", n.data);        // 2. 再输出自己\n        inorder_print(&n.right);      // 3. 最后处理右子树\n    }\n}\n\nimpl BST\n{\n    pub fn inorder(&self)\n    {\n        inorder_print(&self.root);\n        println!();\n    }\n}"},{"title":"main：跑一遍","note":"依次演示三种删除，每次删完都打印中序序列","code":"fn main()\n{\n    let mut tree = BST::new();\n    let keys = [8, 3, 10, 1, 6, 14, 4, 7, 13];\n\n    for i in 0..keys.len()\n    {\n        tree.insert(keys[i]);\n    }\n    print!(\"中序 = \"); tree.inorder();          // 1 3 4 6 7 8 10 13 14\n\n    println!(\"search(6)  -> {}\", tree.search(6));\n    println!(\"search(99) -> {}\", tree.search(99));\n    println!(\"最小值     -> {:?}\", tree.min_value());\n\n    tree.remove(1);\n    print!(\"删掉 1（叶子）     中序 = \"); tree.inorder();\n\n    tree.remove(14);\n    print!(\"删掉 14（一个孩子）中序 = \"); tree.inorder();\n\n    tree.remove(3);\n    print!(\"删掉 3（两个孩子） 中序 = \"); tree.inorder();\n}"}]}},"heap":{"c":{"file":"heap.c","steps":[{"title":"结构定义","note":"小顶堆用数组存完全二叉树，左孩子 2i+1、右孩子 2i+2","code":"#include <stdio.h>\n#include <stdlib.h>\n#include <stdbool.h>\ntypedef struct\n{\n    int* data;\n    int size;\n    int capacity;\n} MyHeap;"},{"title":"初始化与销毁","note":"init 置空，free 释放数组","code":"void heapInit(MyHeap* h)\n{\n    h->data = NULL;\n    h->size = 0;\n    h->capacity = 0;\n}\nvoid heapFree(MyHeap* h)\n{\n    free(h->data);\n    h->data = NULL;\n    h->size = 0;\n    h->capacity = 0;\n}"},{"title":"上浮 siftUp + 入堆 push","note":"新元素放末尾，再和父节点逐层比较往上换","code":"void heapSiftUp(MyHeap* h, int i)\n{\n    while (i > 0)\n    {\n        int parent = (i - 1) / 2;\n        if (h->data[parent] <= h->data[i])\n        {\n            break;   // 已经比父亲大，位置对了\n        }\n        int t = h->data[i];          // 孩子比父亲小就交换\n        h->data[i] = h->data[parent];\n        h->data[parent] = t;\n        i = parent;                  // 继续拿新位置往上看\n    }\n}\nvoid heapPush(MyHeap* h, int value)\n{\n    if (h->size == h->capacity)\n    {\n        int newCapacity = (h->capacity == 0) ? 4 : h->capacity * 2;\n        int* newData = (int*)realloc(h->data, newCapacity * sizeof(int));\n        if (newData == NULL)\n        {\n            printf(\"error! : realloc failed!\\n\");\n            return;\n        }\n        h->data = newData;\n        h->capacity = newCapacity;\n    }\n    h->data[h->size] = value;   // 先放到完全二叉树的末尾\n    heapSiftUp(h, h->size);\n    h->size++;\n}"},{"title":"下沉 siftDown + 出堆 pop","note":"堆顶和末尾交换后，从根往下和更小的孩子换","code":"void heapSiftDown(MyHeap* h, int i)\n{\n    while (true)\n    {\n        int left = 2 * i + 1;\n        int right = 2 * i + 2;\n        int smallest = i;\n        if (left < h->size && h->data[left] < h->data[smallest])\n        {\n            smallest = left;\n        }\n        if (right < h->size && h->data[right] < h->data[smallest])\n        {\n            smallest = right;\n        }\n        if (smallest == i)\n        {\n            break;   // 两个孩子都不比自己小，位置对了\n        }\n        int t = h->data[i];\n        h->data[i] = h->data[smallest];\n        h->data[smallest] = t;\n        i = smallest;\n    }\n}\nbool heapPop(MyHeap* h, int* out)\n{\n    if (h->size == 0)\n    {\n        return false;\n    }\n    *out = h->data[0];              // 堆顶就是最小值\n    h->size--;\n    h->data[0] = h->data[h->size];  // 把末尾元素搬到堆顶\n    heapSiftDown(h, 0);\n    return true;\n}"},{"title":"建堆 buildHeap","note":"从最后一个非叶子节点开始往前下沉，整体 O(n)","code":"void heapBuild(MyHeap* h)\n{\n    // 叶子本身已经是合法的小顶堆，所以从 size/2 - 1 开始就够了\n    for (int i = h->size / 2 - 1; i >= 0; i--)\n    {\n        heapSiftDown(h, i);\n    }\n}"},{"title":"main：跑一遍","note":"分别验证 push/pop 和自底向上建堆两条路径","code":"void heapPrint(char* tag, MyHeap* h)\n{\n    printf(\"%-14s [\", tag);\n    for (int i = 0; i < h->size; i++)\n    {\n        printf(\"%s%d\", i == 0 ? \"\" : \" \", h->data[i]);\n    }\n    printf(\"]\\n\");\n}\nint main(void)\n{\n    MyHeap h;\n    heapInit(&h);\n    int vals[] = { 5, 3, 8, 1, 9, 2, 7 };\n    for (int i = 0; i < 7; i++)\n    {\n        heapPush(&h, vals[i]);\n    }\n    heapPrint(\"after push\", &h);\n    printf(\"top = %d, size = %d\\n\", h.data[0], h.size);\n    printf(\"pop:\");\n    int v = 0;\n    while (heapPop(&h, &v))\n    {\n        printf(\" %d\", v);\n    }\n    printf(\"\\n\");\n    heapFree(&h);\n\n    // 第二个例子：直接拿一个乱序数组原地建堆\n    MyHeap g;\n    heapInit(&g);\n    int raw[] = { 9, 5, 8, 1, 3, 2, 7, 6, 4, 0 };\n    g.data = raw;   // 数组归堆使用，但它在栈上，最后不能 free\n    g.size = 10;\n    g.capacity = 10;\n    heapPrint(\"before build\", &g);\n    heapBuild(&g);\n    heapPrint(\"after build\", &g);\n    printf(\"top = %d, size = %d\\n\", g.data[0], g.size);\n    g.data = NULL;   // 交出所有权，避免 heapFree 误删栈上的数组\n    heapFree(&g);\n    return 0;\n}"}]},"cpp":{"file":"heap.cpp","steps":[{"title":"结构定义","note":"小顶堆用数组存完全二叉树，左孩子 2i+1，右孩子 2i+2，父节点 (i-1)/2","code":"#include <iostream>\n\nclass MinHeap\n{\npublic:\n    MinHeap();\n    ~MinHeap();\n    void push(int value);\n    int  pop();\n    bool top(int& value);\n    bool empty();\n    void buildHeap(int values[], int n);\n    void print();\n\nprivate:\n    int* arr;\n    int  size;\n    int  capacity;\n\n    void grow();\n    void siftUp(int i);      // 上浮：和父节点比\n    void siftDown(int i);    // 下沉：和两个孩子里更小的那个比\n};"},{"title":"初始化与销毁","note":"和动态数组一样，满了就开两倍大的新内存搬过去","code":"MinHeap::MinHeap()\n{\n    capacity = 4;\n    size = 0;\n    arr = new int[capacity];\n}\n\nMinHeap::~MinHeap()\n{\n    delete[] arr;\n}\n\nvoid MinHeap::grow()\n{\n    int newCapacity = capacity * 2;\n    int* bigger = new int[newCapacity];\n\n    for (int i = 0; i < size; i++)\n    {\n        bigger[i] = arr[i];\n    }\n\n    delete[] arr;\n    arr = bigger;\n    capacity = newCapacity;\n}"},{"title":"上浮 siftUp + 入堆 push","note":"新元素放到数组末尾，然后一路和父节点比着往上浮","code":"void MinHeap::siftUp(int i)\n{\n    while (i > 0)\n    {\n        int parent = (i - 1) / 2;\n\n        if (arr[parent] <= arr[i])     // 父节点已经比它小，堆序满足，停\n        {\n            break;\n        }\n\n        int temp = arr[i];\n        arr[i] = arr[parent];\n        arr[parent] = temp;\n\n        i = parent;                    // 继续和新的父节点比\n    }\n}\n\nvoid MinHeap::push(int value)\n{\n    if (size >= capacity)\n    {\n        grow();\n    }\n\n    arr[size] = value;      // 1. 先放到末尾，保证完全二叉树的形状\n    size++;\n    siftUp(size - 1);       // 2. 再往上调整，恢复堆序\n}"},{"title":"下沉 siftDown + 出堆 pop","note":"堆顶取走后，把末尾元素补到根，再往下沉","code":"void MinHeap::siftDown(int i)\n{\n    while (true)\n    {\n        int left = 2 * i + 1;\n        int right = 2 * i + 2;\n        int smallest = i;\n\n        if (left < size && arr[left] < arr[smallest])\n        {\n            smallest = left;\n        }\n        if (right < size && arr[right] < arr[smallest])\n        {\n            smallest = right;\n        }\n        if (smallest == i)      // 比两个孩子都小，到位了\n        {\n            break;\n        }\n\n        int temp = arr[i];\n        arr[i] = arr[smallest];\n        arr[smallest] = temp;\n\n        i = smallest;\n    }\n}\n\nint MinHeap::pop()\n{\n    if (size == 0)\n    {\n        std::cout << \"error! : heap is empty!\" << std::endl;\n        return -1;\n    }\n\n    int smallest = arr[0];      // 堆顶就是最小值\n\n    arr[0] = arr[size - 1];     // 把最后一个元素补到堆顶，形状才不破\n    size--;\n\n    if (size > 0)\n    {\n        siftDown(0);\n    }\n\n    return smallest;\n}\n\nbool MinHeap::top(int& value)\n{\n    if (size == 0)\n    {\n        return false;\n    }\n\n    value = arr[0];\n    return true;\n}\n\nbool MinHeap::empty()\n{\n    return size == 0;\n}"},{"title":"建堆 buildHeap（O(n)）","note":"从最后一个非叶节点开始倒着下沉，比一个个 push 快","code":"void MinHeap::buildHeap(int values[], int n)\n{\n    for (int i = 0; i < n; i++)\n    {\n        if (size >= capacity)\n        {\n            grow();\n        }\n        arr[size] = values[i];\n        size++;\n    }\n\n    // 叶子节点本身就是合法的堆，所以只需要处理非叶节点\n    // 最后一个非叶节点的下标是 n/2 - 1\n    for (int i = n / 2 - 1; i >= 0; i--)\n    {\n        siftDown(i);\n    }\n}\n\nvoid MinHeap::print()\n{\n    std::cout << \"堆数组 = [\";\n    for (int i = 0; i < size; i++)\n    {\n        std::cout << arr[i];\n        if (i != size - 1)\n        {\n            std::cout << \", \";\n        }\n    }\n    std::cout << \"]  size=\" << size << std::endl;\n}"},{"title":"main：跑一遍","note":"push/pop 一条路，buildHeap 一条路","code":"int main()\n{\n    MinHeap heap;\n\n    int data[] = { 5, 3, 8, 1, 9, 2, 7 };\n    for (int i = 0; i < 7; i++)\n    {\n        heap.push(data[i]);\n    }\n    heap.print();\n\n    int value = 0;\n    if (heap.top(value))\n    {\n        std::cout << \"堆顶（最小值）= \" << value << std::endl;\n    }\n\n    std::cout << \"连续 pop：\";\n    while (!heap.empty())\n    {\n        std::cout << heap.pop() << \" \";\n    }\n    std::cout << std::endl;\n\n    MinHeap heap2;\n    int raw[] = { 9, 5, 8, 1, 3, 2, 7, 6, 4, 0 };\n    heap2.buildHeap(raw, 10);       // 一次性建堆，O(n)\n    heap2.print();\n\n    std::cout << \"建堆后连续 pop：\";\n    while (!heap2.empty())\n    {\n        std::cout << heap2.pop() << \" \";\n    }\n    std::cout << std::endl;\n\n    return 0;\n}"}]},"rs":{"file":"heap.rs","steps":[{"title":"结构定义","note":"小顶堆用数组存完全二叉树，左孩子 2i+1，右孩子 2i+2，父节点 (i-1)/2","code":"pub struct MinHeap\n{\n    data: Vec<i32>,\n}"},{"title":"初始化与销毁","note":"Rust 不用写析构函数，Vec 离开作用域会自动释放","code":"impl MinHeap\n{\n    pub fn new() -> MinHeap\n    {\n        MinHeap { data: Vec::new() }\n    }\n\n    pub fn len(&self) -> usize\n    {\n        self.data.len()\n    }\n\n    pub fn empty(&self) -> bool\n    {\n        self.data.is_empty()\n    }\n}"},{"title":"上浮 sift_up + 入堆 push","note":"新元素放到数组末尾，然后一路和父节点比着往上浮","code":"impl MinHeap\n{\n    fn sift_up(&mut self, mut i: usize)\n    {\n        while i > 0\n        {\n            let parent = (i - 1) / 2;\n\n            if self.data[parent] <= self.data[i]   // 父节点已经比它小，堆序满足，停\n            {\n                break;\n            }\n\n            self.data.swap(i, parent);\n            i = parent;                            // 继续和新的父节点比\n        }\n    }\n\n    pub fn push(&mut self, value: i32)\n    {\n        self.data.push(value);          // 1. 先放到末尾，保证完全二叉树的形状\n        let last = self.data.len() - 1;\n        self.sift_up(last);             // 2. 再往上调整，恢复堆序\n    }\n}"},{"title":"下沉 sift_down + 出堆 pop","note":"堆顶取走后，把末尾元素补到根，再往下沉","code":"impl MinHeap\n{\n    fn sift_down(&mut self, mut i: usize)\n    {\n        let n = self.data.len();\n\n        loop\n        {\n            let left = 2 * i + 1;\n            let right = 2 * i + 2;\n            let mut smallest = i;\n\n            if left < n && self.data[left] < self.data[smallest]\n            {\n                smallest = left;\n            }\n            if right < n && self.data[right] < self.data[smallest]\n            {\n                smallest = right;\n            }\n            if smallest == i               // 比两个孩子都小，到位了\n            {\n                break;\n            }\n\n            self.data.swap(i, smallest);\n            i = smallest;\n        }\n    }\n\n    pub fn pop(&mut self) -> Option<i32>\n    {\n        if self.data.is_empty()\n        {\n            println!(\"error! : heap is empty!\");\n            return None;\n        }\n\n        let smallest = self.data[0];        // 堆顶就是最小值\n        let last = self.data.len() - 1;\n\n        self.data.swap(0, last);            // 末尾元素补到堆顶，形状才不破\n        self.data.pop();                    // 把原来的堆顶摘掉\n\n        if !self.data.is_empty()\n        {\n            self.sift_down(0);\n        }\n\n        Some(smallest)\n    }\n\n    pub fn top(&self) -> Option<i32>\n    {\n        if self.data.is_empty()\n        {\n            None\n        }\n        else\n        {\n            Some(self.data[0])\n        }\n    }\n}"},{"title":"建堆 build_heap（O(n)）","note":"从最后一个非叶节点开始倒着下沉，比一个个 push 快","code":"impl MinHeap\n{\n    pub fn build_heap(&mut self, values: &[i32])\n    {\n        self.data = values.to_vec();\n\n        if self.data.is_empty()\n        {\n            return;\n        }\n\n        // 叶子节点本身就是合法的堆，所以只需要处理非叶节点\n        // 最后一个非叶节点的下标是 n/2 - 1\n        let mut i = self.data.len() / 2;\n        while i > 0\n        {\n            i -= 1;\n            self.sift_down(i);\n        }\n    }\n\n    pub fn print(&self, name: &str)\n    {\n        println!(\"{}: {:?}\", name, self.data);\n    }\n}"},{"title":"main：跑一遍","note":"push/pop 一条路，build_heap 一条路","code":"fn main()\n{\n    let mut heap = MinHeap::new();\n\n    for value in [5, 3, 8, 1, 9, 2, 7]\n    {\n        heap.push(value);\n    }\n    heap.print(\"push 之后\");\n    println!(\"堆顶（最小值）= {:?}\", heap.top());\n\n    print!(\"连续 pop：\");\n    while !heap.empty()\n    {\n        print!(\"{:?} \", heap.pop());\n    }\n    println!();\n\n    let mut heap2 = MinHeap::new();\n    heap2.build_heap(&[9, 5, 8, 1, 3, 2, 7, 6, 4, 0]);\n    heap2.print(\"建堆之后\");                 // 注意这一步是 O(n)，不是 O(n log n)\n    println!(\"堆顶（最小值）= {:?}\", heap2.top());\n}"}]}},"graph":{"c":{"file":"graph.c","steps":[{"title":"邻接表结构","note":"每个顶点挂一条边结点链表，无向边要存两个方向","code":"#include <stdio.h>\n#include <stdlib.h>\n#include <stdbool.h>\ntypedef struct AdjNode\n{\n    int to;                 // 这条边通向哪个顶点\n    struct AdjNode* next;   // 同一个顶点的下一条边\n} AdjNode;\ntypedef struct\n{\n    AdjNode** heads;   // 每个顶点一条链表\n    int n;             // 顶点个数\n    int m;             // 边数\n} MyGraph;"},{"title":"加边 addEdge","note":"头插法 O(1)，无向边的两边各插一次","code":"void graphAddEdge(MyGraph* g, int u, int v)\n{\n    if (u < 0 || u >= g->n || v < 0 || v >= g->n)\n    {\n        printf(\"error! : vertex out of range!\\n\");\n        return;\n    }\n    AdjNode* p = (AdjNode*)malloc(sizeof(AdjNode));\n    if (p == NULL)\n    {\n        printf(\"error! : malloc failed!\\n\");\n        return;\n    }\n    p->to = v;\n    p->next = g->heads[u];\n    g->heads[u] = p;\n    p = (AdjNode*)malloc(sizeof(AdjNode));\n    if (p == NULL)\n    {\n        printf(\"error! : malloc failed!\\n\");\n        return;\n    }\n    p->to = u;                    // 反方向也要有一条，这样才是无向图\n    p->next = g->heads[v];\n    g->heads[v] = p;\n    g->m++;\n}"},{"title":"建图与销毁","note":"calloc 顶点表，释放时先 free 边结点再 free 顶点表","code":"MyGraph* graphCreate(int n)\n{\n    MyGraph* g = (MyGraph*)malloc(sizeof(MyGraph));\n    if (g == NULL)\n    {\n        printf(\"error! : malloc failed!\\n\");\n        return NULL;\n    }\n    g->heads = (AdjNode**)calloc(n, sizeof(AdjNode*));\n    if (g->heads == NULL)\n    {\n        printf(\"error! : calloc failed!\\n\");\n        free(g);\n        return NULL;\n    }\n    g->n = n;\n    g->m = 0;\n    return g;\n}\nvoid graphFree(MyGraph* g)\n{\n    for (int i = 0; i < g->n; i++)\n    {\n        AdjNode* cur = g->heads[i];\n        while (cur != NULL)\n        {\n            AdjNode* next = cur->next;\n            free(cur);\n            cur = next;\n        }\n    }\n    free(g->heads);\n    free(g);\n}"},{"title":"广度优先 BFS","note":"用数组当队列，入队时就标记 visited，逐层向外扩散","code":"void graphBfs(MyGraph* g, int start)\n{\n    bool* visited = (bool*)calloc(g->n, sizeof(bool));\n    int* queue = (int*)malloc(g->n * sizeof(int));\n    if (visited == NULL || queue == NULL)\n    {\n        printf(\"error! : malloc failed!\\n\");\n        free(visited);\n        free(queue);\n        return;\n    }\n    int head = 0;\n    int tail = 0;\n    visited[start] = true;   // 起点先标记再入队，避免被重复排进去\n    queue[tail] = start;\n    tail++;\n    printf(\"BFS:\");\n    while (head < tail)\n    {\n        int u = queue[head];\n        head++;\n        printf(\" %d\", u);\n        for (AdjNode* p = g->heads[u]; p != NULL; p = p->next)\n        {\n            if (!visited[p->to])\n            {\n                visited[p->to] = true;\n                queue[tail] = p->to;\n                tail++;\n            }\n        }\n    }\n    printf(\"\\n\");\n    free(queue);\n    free(visited);\n}"},{"title":"深度优先 DFS","note":"递归一条路走到黑，走不动再回头换下一条边","code":"void graphDfsVisit(MyGraph* g, int u, bool* visited)\n{\n    visited[u] = true;\n    printf(\" %d\", u);\n    for (AdjNode* p = g->heads[u]; p != NULL; p = p->next)\n    {\n        if (!visited[p->to])\n        {\n            graphDfsVisit(g, p->to, visited);\n        }\n    }\n}\nvoid graphDfs(MyGraph* g, int start)\n{\n    bool* visited = (bool*)calloc(g->n, sizeof(bool));\n    if (visited == NULL)\n    {\n        printf(\"error! : calloc failed!\\n\");\n        return;\n    }\n    printf(\"DFS:\");\n    graphDfsVisit(g, start, visited);\n    printf(\"\\n\");\n    free(visited);\n}"},{"title":"main：跑一遍","note":"6 个顶点 8 条边，打印从 0 号出发的两种遍历","code":"int main(void)\n{\n    MyGraph* g = graphCreate(6);\n    if (g == NULL)\n    {\n        return 1;\n    }\n    int edges[8][2] = { {0, 1}, {0, 2}, {0, 3}, {1, 2}, {1, 3}, {2, 3}, {3, 4}, {4, 5} };\n    for (int i = 0; i < 8; i++)\n    {\n        graphAddEdge(g, edges[i][0], edges[i][1]);\n    }\n    printf(\"n = %d, m = %d\\n\", g->n, g->m);\n    graphBfs(g, 0);\n    graphDfs(g, 0);\n    graphFree(g);\n    return 0;\n}"}]},"cpp":{"file":"graph.cpp","steps":[{"title":"邻接表结构","note":"每个顶点挂一条链表，链表里存\"从这个顶点能直接走到哪些顶点\"","code":"#include <iostream>\n\nclass Graph\n{\npublic:\n    Graph(int n);\n    ~Graph();\n    void addEdge(int u, int v);\n    void BFS(int start);\n    void DFS(int start);\n    int  countComponents();\n    void print();\n\nprivate:\n    struct Edge\n    {\n        int to;          // 这条边通向哪个顶点\n        Edge* next;\n    };\n\n    Edge** adj;          // 邻接表：adj[i] 是顶点 i 的边链表头\n    int vertexCount;     // 顶点个数\n\n    void dfsVisit(int v, bool* visited);\n};"},{"title":"加边 addEdge","note":"无向图一条边要在两个顶点的链表里各加一次","code":"void Graph::addEdge(int u, int v)\n{\n    Edge* e1 = new Edge;\n    e1->to = v;\n    e1->next = adj[u];       // 头插，O(1)\n    adj[u] = e1;\n\n    Edge* e2 = new Edge;\n    e2->to = u;\n    e2->next = adj[v];\n    adj[v] = e2;\n}"},{"title":"建图与销毁","note":"构造时把每个顶点的边链表置空；析构时把边和邻接表都还回去","code":"Graph::Graph(int n)\n{\n    vertexCount = n;\n    adj = new Edge*[vertexCount];\n\n    for (int i = 0; i < vertexCount; i++)\n    {\n        adj[i] = nullptr;\n    }\n}\n\nGraph::~Graph()\n{\n    for (int i = 0; i < vertexCount; i++)\n    {\n        Edge* e = adj[i];\n        while (e != nullptr)\n        {\n            Edge* next = e->next;\n            delete e;\n            e = next;\n        }\n    }\n\n    delete[] adj;\n}"},{"title":"广度优先 BFS","note":"用队列一层一层往外扩，第一次到达某个点走的就是最短路","code":"void Graph::BFS(int start)\n{\n    bool* visited = new bool[vertexCount];\n    for (int i = 0; i < vertexCount; i++)\n    {\n        visited[i] = false;\n    }\n\n    int* queue = new int[vertexCount];   // 每个顶点最多进队一次，开这么大够用\n    int head = 0;\n    int tail = 0;\n\n    visited[start] = true;\n    queue[tail] = start;\n    tail++;\n\n    std::cout << \"BFS: \";\n    while (head < tail)\n    {\n        int v = queue[head];       // 从队头取\n        head++;\n        std::cout << v << \" \";\n\n        for (Edge* e = adj[v]; e != nullptr; e = e->next)\n        {\n            if (!visited[e->to])\n            {\n                visited[e->to] = true;   // 关键：入队时就要标记，不然会重复入队\n                queue[tail] = e->to;\n                tail++;\n            }\n        }\n    }\n    std::cout << std::endl;\n\n    delete[] queue;\n    delete[] visited;\n}"},{"title":"深度优先 DFS","note":"一条路走到黑，走不动再回头（递归本身就用了系统的栈）","code":"void Graph::dfsVisit(int v, bool* visited)\n{\n    visited[v] = true;\n    std::cout << v << \" \";\n\n    for (Edge* e = adj[v]; e != nullptr; e = e->next)\n    {\n        if (!visited[e->to])\n        {\n            dfsVisit(e->to, visited);\n        }\n    }\n}\n\nvoid Graph::DFS(int start)\n{\n    bool* visited = new bool[vertexCount];\n    for (int i = 0; i < vertexCount; i++)\n    {\n        visited[i] = false;\n    }\n\n    std::cout << \"DFS: \";\n    dfsVisit(start, visited);\n    std::cout << std::endl;\n\n    delete[] visited;\n}\n\nint Graph::countComponents()\n{\n    bool* visited = new bool[vertexCount];\n    for (int i = 0; i < vertexCount; i++)\n    {\n        visited[i] = false;\n    }\n\n    int count = 0;\n    for (int v = 0; v < vertexCount; v++)\n    {\n        if (!visited[v])              // 遇到没访问过的顶点，就是一个新的连通块\n        {\n            count++;\n            dfsVisit(v, visited);     // 一次 DFS 把整个连通块吃掉\n        }\n    }\n\n    delete[] visited;\n    return count;\n}"},{"title":"main：跑一遍","note":"造一张不连通的图，看 BFS / DFS 的顺序和连通分量个数","code":"void Graph::print()\n{\n    std::cout << \"顶点数 = \" << vertexCount << std::endl;\n    for (int i = 0; i < vertexCount; i++)\n    {\n        std::cout << \"  \" << i << \": \";\n        for (Edge* e = adj[i]; e != nullptr; e = e->next)\n        {\n            std::cout << e->to << \" \";\n        }\n        std::cout << std::endl;\n    }\n}\n\nint main()\n{\n    Graph g(8);\n\n    // 0~5 构成一个连通块，6 和 7 单独连成一小块，所以一共 2 个连通分量\n    g.addEdge(0, 1);\n    g.addEdge(0, 2);\n    g.addEdge(1, 3);\n    g.addEdge(2, 3);\n    g.addEdge(2, 4);\n    g.addEdge(3, 5);\n    g.addEdge(4, 5);\n    g.addEdge(6, 7);\n\n    g.print();\n    g.BFS(0);\n    g.DFS(0);\n    g.BFS(6);                          // 从 6 出发只能走到 7\n\n    std::cout << \"连通分量个数 = \" << g.countComponents() << std::endl;\n\n    return 0;\n}"}]},"rs":{"file":"graph.rs","steps":[{"title":"邻接表结构","note":"每个顶点挂一个列表，里面存\"从这个顶点能直接走到哪些顶点\"","code":"pub struct Graph\n{\n    adj: Vec<Vec<usize>>,       // adj[i] 是顶点 i 的邻居列表\n    vertex_count: usize,\n}"},{"title":"加边 add_edge","note":"无向图一条边要在两个顶点的列表里各加一次","code":"impl Graph\n{\n    pub fn add_edge(&mut self, u: usize, v: usize)\n    {\n        self.adj[u].push(v);\n        self.adj[v].push(u);\n    }\n}"},{"title":"建图与销毁","note":"new 里把每个顶点的邻居列表置空；Rust 不用写析构","code":"impl Graph\n{\n    pub fn new(n: usize) -> Graph\n    {\n        let mut adj = Vec::new();\n\n        for _ in 0..n\n        {\n            adj.push(Vec::new());\n        }\n\n        Graph { adj, vertex_count: n }\n    }\n}"},{"title":"广度优先 BFS","note":"用队列一层一层往外扩，第一次到达某个点走的就是最短路","code":"impl Graph\n{\n    pub fn bfs(&self, start: usize)\n    {\n        let mut visited = vec![false; self.vertex_count];\n        let mut queue: Vec<usize> = Vec::new();\n        let mut head = 0;                 // 队头下标：从 0 号位取，往末尾加\n\n        visited[start] = true;\n        queue.push(start);\n\n        print!(\"BFS: \");\n        while head < queue.len()\n        {\n            let v = queue[head];          // 从队头取\n            head += 1;\n            print!(\"{} \", v);\n\n            for &nb in &self.adj[v]\n            {\n                if !visited[nb]\n                {\n                    visited[nb] = true;   // 关键：入队时就要标记，不然会重复入队\n                    queue.push(nb);\n                }\n            }\n        }\n        println!();\n    }\n}"},{"title":"深度优先 DFS","note":"一条路走到黑，走不动再回头（递归本身就用了系统的栈）","code":"impl Graph\n{\n    fn dfs_visit(&self, v: usize, visited: &mut Vec<bool>)\n    {\n        visited[v] = true;\n        print!(\"{} \", v);\n\n        for &nb in &self.adj[v]\n        {\n            if !visited[nb]\n            {\n                self.dfs_visit(nb, visited);\n            }\n        }\n    }\n\n    pub
