left, value);     // 小就往左\n    }\n    else if (value > node->data)\n    {\n        node->right = insertNode(node->right, value);   // 大就往右\n    }\n    // 相等就什么都不做：BST 一般不存重复值\n\n    return node;\n}\n\nvoid BST::insert(int value)\n{\n    root = insertNode(root, value);\n}"},{"title":"查找 search","note":"和插入走的路径一模一样，只是走到就停","code":"bool BST::search(int value)\n{\n    Node* p = root;\n\n    while (p != nullptr)\n    {\n        if (value == p->data)\n        {\n            return true;\n        }\n        else if (value < p->data)\n        {\n            p = p->left;      // 比当前节点小，往左走\n        }\n        else\n        {\n            p = p->right;     // 比当前节点大，往右走\n        }\n    }\n\n    return false;\n}"},{"title":"找最小值 minValue","note":"一路往左走到底就是最小值","code":"bool BST::minValue(int& value)\n{\n    if (root == nullptr)\n    {\n        return false;\n    }\n\n    Node* p = root;\n    while (p->left != nullptr)\n    {\n        p = p->left;\n    }\n\n    value = p->data;\n    return true;\n}"},{"title":"删除 remove（三种情况）","note":"叶子直接删 / 一个孩子让娃顶替 / 两个孩子找中序后继","code":"BST::Node* BST::removeNode(BST::Node* node, int value)\n{\n    if (node == nullptr)\n    {\n        return nullptr;\n    }\n\n    if (value < node->data)\n    {\n        node->left = removeNode(node->left, value);\n        return node;\n    }\n\n    if (value > node->data)\n    {\n        node->right = removeNode(node->right, value);\n        return node;\n    }\n\n    // 下面就是找到要删的节点之后的三条路\n\n    if (node->left == nullptr && node->right == nullptr)   // 情况1：叶子\n    {\n        delete node;\n        return nullptr;                 // 直接摘掉，父节点那一侧会变成空\n    }\n\n    if (node->left == nullptr)           // 情况2：只有右孩子\n    {\n        Node* child = node->right;\n        delete node;\n        return child;                    // 让孩子顶替自己的位置\n    }\n\n    if (node->right == nullptr)          // 情况2：只有左孩子\n    {\n        Node* child = node->left;\n        delete node;\n        return child;\n    }\n\n    // 情况3：左右孩子都在。找右子树里的最小值（中序后继）来顶替自己\n    Node* successor = node->right;\n    while (successor->left != nullptr)\n    {\n        successor = successor->left;\n    }\n\n    node->data = successor->data;                             // 先把后继的值复制过来\n    node->right = removeNode(node->right, successor->data);   // 再去右子树把原来的后继删掉\n    return node;\n}\n\nvoid BST::remove(int value)\n{\n    root = removeNode(root, value);\n}"},{"title":"中序遍历 inorder","note":"左 -> 根 -> 右，对 BST 来说这个顺序一定是递增的","code":"void BST::inorderPrint(BST::Node* node)\n{\n    if (node == nullptr)\n    {\n        return;\n    }\n\n    inorderPrint(node->left);      // 1. 先处理左子树\n    std::cout << node->data << \" \";  // 2. 再输出自己\n    inorderPrint(node->right);     // 3. 最后处理右子树\n}\n\nvoid BST::inorder()\n{\n    inorderPrint(root);\n    std::cout << std::endl;\n}"},{"title":"main：跑一遍","note":"依次演示三种删除，每次删完都打印中序序列","code":"void BST::print()\n{\n    std::cout << \"中序 = \";\n    inorder();\n}\n\nint main()\n{\n    BST tree;\n    int keys[] = { 8, 3, 10, 1, 6, 14, 4, 7, 13 };\n\n    for (int i = 0; i < 9; i++)\n    {\n        tree.insert(keys[i]);\n    }\n    tree.print();                     // 1 3 4 6 7 8 10 13 14\n\n    std::cout << \"search(6)  -> \" << (tree.search(6) ? \"找到\" : \"没找到\") << std::endl;\n    std::cout << \"search(7)  -> \" << (tree.search(7) ? \"找到\" : \"没找到\") << std::endl;\n    std::cout << \"search(99) -> \" << (tree.search(99) ? \"找到\" : \"没找到\") << std::endl;\n\n    int minVal = 0;\n    if (tree.minValue(minVal))\n    {\n        std::cout << \"最小值 = \" << minVal << std::endl;\n    }\n\n    tree.remove(1);                   // 情况1：删叶子\n    std::cout << \"删掉 1（叶子）     \"; tree.print();\n\n    tree.remove(14);                  // 情况2：删只有一个孩子的节点\n    std::cout << \"删掉 14（一个孩子）\"; tree.print();\n\n    tree.remove(3);                   // 情况3：删有两个孩子的节点\n    std::cout << \"删掉 3（两个孩子）\"; tree.print();\n\n    return 0;\n}"}]},"rs":{"file":"bst.rs","steps":[{"title":"节点定义","note":"每个节点最多两个孩子，左小右大；孩子用 Option<Box<Node>> 表示","code":"struct Node\n{\n    data: i32,\n    left: Option<Box<Node>>,\n    right: Option<Box<Node>>,\n}\n\npub struct BST\n{\n    root: Option<Box<Node>>,     // None 表示空树\n}"},{"title":"插入 insert","note":"从根开始比大小，递归走到空位就把新节点挂上去","code":"fn insert_node(node: Option<Box<Node>>, value: i32) -> Option<Box<Node>>\n{\n    match node\n    {\n        None =>\n        {\n            // 走到空位了，新节点就长在这里\n            Some(Box::new(Node { data: value, left: None, right: None }))\n        }\n\n        Some(mut n) =>\n        {\n            if value < n.data\n            {\n                n.left = insert_node(n.left.take(), value);       // 小就往左\n            }\n            else if value > n.data\n            {\n                n.right = insert_node(n.right.take(), value);     // 大就往右\n            }\n            // 相等就什么都不做：BST 一般不存重复值\n\n            Some(n)\n        }\n    }\n}\n\nimpl BST\n{\n    pub fn new() -> BST\n    {\n        BST { root: None }\n    }\n\n    pub fn insert(&mut self, value: i32)\n    {\n        self.root = insert_node(self.root.take(), value);\n    }\n}"},{"title":"查找 search","note":"和插入走的路径一模一样，只是走到就停","code":"impl BST\n{\n    pub fn search(&self, value: i32) -> bool\n    {\n        let mut cur = self.root.as_deref();\n\n        while let Some(n) = cur\n        {\n            if value == n.data\n            {\n                return true;\n            }\n            else if value < n.data\n            {\n                cur = n.left.as_deref();     // 比当前节点小，往左走\n            }\n            else\n            {\n                cur = n.right.as_deref();    // 比当前节点大，往右走\n            }\n        }\n\n        false\n    }\n}"},{"title":"找最小值 min_value","note":"一路往左走到底就是最小值","code":"impl BST\n{\n    pub fn min_value(&self) -> Option<i32>\n    {\n        let mut cur = self.root.as_deref();\n        let mut min = None;\n\n        while let Some(n) = cur\n        {\n            min = Some(n.data);              // 每往左走一步就更新一次\n            cur = n.left.as_deref();\n        }\n\n        min                                  // 空树时循环一次都不进，返回 None\n    }\n}\n\n// 求一棵子树里的最小值（找中序后继要用）\nfn min_of(node: &Option<Box<Node>>) -> i32\n{\n    let mut cur = node.as_deref();\n    let mut min = 0;\n\n    while let Some(n) = cur\n    {\n        min = n.data;\n        cur = n.left.as_deref();\n    }\n\n    min\n}"},{"title":"删除 remove（三种情况）","note":"叶子直接删 / 一个孩子让娃顶替 / 两个孩子找中序后继","code":"fn remove_node(node: Option<Box<Node>>, value: i32) -> Option<Box<Node>>\n{\n    let mut n = match node\n    {\n        None => return None,\n        Some(n) => n,\n    };\n\n    if value < n.data\n    {\n        n.left = remove_node(n.left.take(), value);\n        return Some(n);\n    }\n\n    if value > n.data\n    {\n        n.right = remove_node(n.right.take(), value);\n        return Some(n);\n    }\n\n    // 下面就是找到要删的节点之后的三条路\n\n    if n.left.is_none() && n.right.is_none()      // 情况1：叶子\n    {\n        return None;                              // 直接摘掉，父节点那一侧会变成空\n    }\n\n    if n.left.is_none()                           // 情况2：只有右孩子\n    {\n        return n.right;                           // 让孩子顶替自己的位置\n    }\n\n    if n.right.is_none()                          // 情况2：只有左孩子\n    {\n        return n.left;\n    }\n\n    // 情况3：左右孩子都在。找右子树里的最小值（中序后继）来顶替自己\n    let successor = min_of(&n.right);\n    n.data = successor;                                       // 先把后继的值复制过来\n    n.right = remove_node(n.right.take(), successor);         // 再去右子树把原来的后继删掉\n    Some(n)\n}\n\nimpl BST\n{\n    pub fn remove(&mut self, value: i32)\n    {\n        self.root = remove_node(self.root.take(), value);\n    }\n}"},{"title":"中序遍历 inorder","note":"左 -> 根 -> 右，对 BST 来说这个顺序一定是递增的","code":"fn inorder_print(node: &Option<Box<Node>>)\n{\n    if let Some(n) = node\n    {\n        inorder_print(&n.left);       // 1. 先处理左子树\n        print!(\"{} \", n.data);        // 2. 再输出自己\n        inorder_print(&n.right);      // 3. 最后处理右子树\n    }\n}\n\nimpl BST\n{\n    pub fn inorder(&self)\n    {\n        inorder_print(&self.root);\n        println!();\n    }\n}"},{"title":"main：跑一遍","note":"依次演示三种删除，每次删完都打印中序序列","code":"fn main()\n{\n    let mut tree = BST::new();\n    let keys = [8, 3, 10, 1, 6, 14, 4, 7, 13];\n\n    for i in 0..keys.len()\n    {\n        tree.insert(keys[i]);\n    }\n    print!(\"中序 = \"); tree.inorder();          // 1 3 4 6 7 8 10 13 14\n\n    println!(\"search(6)  -> {}\", tree.search(6));\n    println!(\"search(99) -> {}\", tree.search(99));\n    println!(\"最小值     -> {:?}\", tree.min_value());\n\n    tree.remove(1);\n    print!(\"删掉 1（叶子）     中序 = \"); tree.inorder();\n\n    tree.remove(14);\n    print!(\"删掉 14（一个孩子）中序 = \"); tree.inorder();\n\n    tree.remove(3);\n    print!(\"删掉 3（两个孩子） 中序 = \"); tree.inorder();\n}"}]}},"heap":{"c":{"file":"heap.c","steps":[{"title":"结构定义","note":"小顶堆用数组存完全二叉树，左孩子 2i+1、右孩子 2i+2","code":"#include <stdio.h>\n#include <stdlib.h>\n#include <stdbool.h>\ntypedef struct\n{\n    int* data;\n    int size;\n    int capacity;\n} MyHeap;"},{"title":"初始化与销毁","note":"init 置空，free 释放数组","code":"void heapInit(MyHeap* h)\n{\n    h->data = NULL;\n    h->size = 0;\n    h->capacity = 0;\n}\nvoid heapFree(MyHeap* h)\n{\n    free(h->data);\n    h->data = NULL;\n    h->size = 0;\n    h->capacity = 0;\n}"},{"title":"上浮 siftUp + 入堆 push","note":"新元素放末尾，再和父节点逐层比较往上换","code":"void heapSiftUp(MyHeap* h, int i)\n{\n    while (i > 0)\n    {\n        int parent = (i - 1) / 2;\n        if (h->data[parent] <= h->data[i])\n        {\n            break;   // 已经比父亲大，位置对了\n        }\n        int t = h->data[i];          // 孩子比父亲小就交换\n        h->data[i] = h->data[parent];\n        h->data[parent] = t;\n        i = parent;                  // 继续拿新位置往上看\n    }\n}\nvoid heapPush(MyHeap* h, int value)\n{\n    if (h->size == h->capacity)\n    {\n        int newCapacity = (h->capacity == 0) ? 4 : h->capacity * 2;\n        int* newData = (int*)realloc(h->data, newCapacity * sizeof(int));\n        if (newData == NULL)\n        {\n            printf(\"error! : realloc failed!\\n\");\n            return;\n        }\n        h->data = newData;\n        h->capacity = newCapacity;\n    }\n    h->data[h->size] = value;   // 先放到完全二叉树的末尾\n    heapSiftUp(h, h->size);\n    h->size++;\n}"},{"title":"下沉 siftDown + 出堆 pop","note":"堆顶和末尾交换后，从根往下和更小的孩子换","code":"void heapSiftDown(MyHeap* h, int i)\n{\n    while (true)\n    {\n        int left = 2 * i + 1;\n        int right = 2 * i + 2;\n        int smallest = i;\n        if (left < h->size && h->data[left] < h->data[smallest])\n        {\n            smallest = left;\n        }\n        if (right < h->size && h->data[right] < h->data[smallest])\n        {\n            smallest = right;\n        }\n        if (smallest == i)\n        {\n            break;   // 两个孩子都不比自己小，位置对了\n        }\n        int t = h->data[i];\n        h->data[i] = h->data[smallest];\n        h->data[smallest] = t;\n        i = smallest;\n    }\n}\nbool heapPop(MyHeap* h, int* out)\n{\n    if (h->size == 0)\n    {\n        return false;\n    }\n    *out = h->data[0];              // 堆顶就是最小值\n    h->size--;\n    h->data[0] = h->data[h->size];  // 把末尾元素搬到堆顶\n    heapSiftDown(h, 0);\n    return true;\n}"},{"title":"建堆 buildHeap","note":"从最后一个非叶子节点开始往前下沉，整体 O(n)","code":"void heapBuild(MyHeap* h)\n{\n    // 叶子本身已经是合法的小顶堆，所以从 size/2 - 1 开始就够了\n    for (int i = h->size / 2 - 1; i >= 0; i--)\n    {\n        heapSiftDown(h, i);\n    }\n}"},{"title":"main：跑一遍","note":"分别验证 push/pop 和自底向上建堆两条路径","code":"void heapPrint(char* tag, MyHeap* h)\n{\n    printf(\"%-14s [\", tag);\n    for (int i = 0; i < h->size; i++)\n    {\n        printf(\"%s%d\", i == 0 ? \"\" : \" \", h->data[i]);\n    }\n    printf(\"]\\n\");\n}\nint main(void)\n{\n    MyHeap h;\n    heapInit(&h);\n    int vals[] = { 5, 3, 8, 1, 9, 2, 7 };\n    for (int i = 0; i < 7; i++)\n    {\n        heapPush(&h, vals[i]);\n    }\n    heapPrint(\"after push\", &h);\n    printf(\"top = %d, size = %d\\n\", h.data[0], h.size);\n    printf(\"pop:\");\n    int v = 0;\n    while (heapPop(&h, &v))\n    {\n        printf(\" %d\", v);\n    }\n    printf(\"\\n\");\n    heapFree(&h);\n\n    // 第二个例子：直接拿一个乱序数组原地建堆\n    MyHeap g;\n    heapInit(&g);\n    int raw[] = { 9, 5, 8, 1, 3, 2, 7, 6, 4, 0 };\n    g.data = raw;   // 数组归堆使用，但它在栈上，最后不能 free\n    g.size = 10;\n    g.capacity = 10;\n    heapPrint(\"before build\", &g);\n    heapBuild(&g);\n    heapPrint(\"after build\", &g);\n    printf(\"top = %d, size = %d\\n\", g.data[0], g.size);\n    g.data = NULL;   // 交出所有权，避免 heapFree 误删栈上的数组\n    heapFree(&g);\n    return 0;\n}"}]},"cpp":{"file":"heap.cpp","steps":[{"title":"结构定义","note":"小顶堆用数组存完全二叉树，左孩子 2i+1，右孩子 2i+2，父节点 (i-1)/2","code":"#include <iostream>\n\nclass MinHeap\n{\npublic:\n    MinHeap();\n    ~MinHeap();\n    void push(int value);\n    int  pop();\n    bool top(int& value);\n    bool empty();\n    void buildHeap(int values[], int n);\n    void print();\n\nprivate:\n    int* arr;\n    int  size;\n    int  capacity;\n\n    void grow();\n    void siftUp(int i);      // 上浮：和父节点比\n    void siftDown(int i);    // 下沉：和两个孩子里更小的那个比\n};"},{"title":"初始化与销毁","note":"和动态数组一样，满了就开两倍大的新内存搬过去","code":"MinHeap::MinHeap()\n{\n    capacity = 4;\n    size = 0;\n    arr = new int[capacity];\n}\n\nMinHeap::~MinHeap()\n{\n    delete[] arr;\n}\n\nvoid MinHeap::grow()\n{\n    int newCapacity = capacity * 2;\n    int* bigger = new int[newCapacity];\n\n    for (int i = 0; i < size; i++)\n    {\n        bigger[i] = arr[i];\n    }\n\n    delete[] arr;\n    arr = bigger;\n    capacity = newCapacity;\n}"},{"title":"上浮 siftUp + 入堆 push","note":"新元素放到数组末尾，然后一路和父节点比着往上浮","code":"void MinHeap::siftUp(int i)\n{\n    while (i > 0)\n    {\n        int parent = (i - 1) / 2;\n\n        if (arr[parent] <= arr[i])     // 父节点已经比它小，堆序满足，停\n        {\n            break;\n        }\n\n        int temp = arr[i];\n        arr[i] = arr[parent];\n        arr[parent] = temp;\n\n        i = parent;                    // 继续和新的父节点比\n    }\n}\n\nvoid MinHeap::push(int value)\n{\n    if (size >= capacity)\n    {\n        grow();\n    }\n\n    arr[size] = value;      // 1. 先放到末尾，保证完全二叉树的形状\n    size++;\n    siftUp(size - 1);       // 2. 再往上调整，恢复堆序\n}"},{"title":"下沉 siftDown + 出堆 pop","note":"堆顶取走后，把末尾元素补到根，再往下沉","code":"void MinHeap::siftDown(int i)\n{\n    while (true)\n    {\n        int left = 2 * i + 1;\n        int right = 2 * i + 2;\n        int smallest = i;\n\n        if (left < size && arr[left] < arr[smallest])\n        {\n            smallest = left;\n        }\n        if (right < size && arr[right] < arr[smallest])\n        {\n            smallest = right;\n        }\n        if (smallest == i)      // 比两个孩子都小，到位了\n        {\n            break;\n        }\n\n        int temp = arr[i];\n        arr[i] = arr[smallest];\n        arr[smallest] = temp;\n\n        i = smallest;\n    }\n}\n\nint MinHeap::pop()\n{\n    if (size == 0)\n    {\n        std::cout << \"error! : heap is empty!\" << std::endl;\n        return -1;\n    }\n\n    int smallest = arr[0];      // 堆顶就是最小值\n\n    arr[0] = arr[size - 1];     // 把最后一个元素补到堆顶，形状才不破\n    size--;\n\n    if (size > 0)\n    {\n        siftDown(0);\n    }\n\n    return smallest;\n}\n\nbool MinHeap::top(int& value)\n{\n    if (size == 0)\n    {\n        return false;\n    }\n\n    value = arr[0];\n    return true;\n}\n\nbool MinHeap::empty()\n{\n    return size == 0;\n}"},{"title":"建堆 buildHeap（O(n)）","note":"从最后一个非叶节点开始倒着下沉，比一个个 push 快","code":"void MinHeap::buildHeap(int values[], int n)\n{\n    for (int i = 0; i < n; i++)\n    {\n        if (size >= capacity)\n        {\n            grow();\n        }\n        arr[size] = values[i];\n        size++;\n    }\n\n    // 叶子节点本身就是合法的堆，所以只需要处理非叶节点\n    // 最后一个非叶节点的下标是 n/2 - 1\n    for (int i = n / 2 - 1; i >= 0; i--)\n    {\n        siftDown(i);\n    }\n}\n\nvoid MinHeap::print()\n{\n    std::cout << \"堆数组 = [\";\n    for (int i = 0; i < size; i++)\n    {\n        std::cout << arr[i];\n        if (i != size - 1)\n        {\n            std::cout << \", \";\n        }\n    }\n    std::cout << \"]  size=\" << size << std::endl;\n}"},{"title":"main：跑一遍","note":"push/pop 一条路，buildHeap 一条路","code":"int main()\n{\n    MinHeap heap;\n\n    int data[] = { 5, 3, 8, 1, 9, 2, 7 };\n    for (int i = 0; i < 7; i++)\n    {\n        heap.push(data[i]);\n    }\n    heap.print();\n\n    int value = 0;\n    if (heap.top(value))\n    {\n        std::cout << \"堆顶（最小值）= \" << value << std::endl;\n    }\n\n    std::cout << \"连续 pop：\";\n    while (!heap.empty())\n    {\n        std::cout << heap.pop() << \" \";\n    }\n    std::cout << std::endl;\n\n    MinHeap heap2;\n    int raw[] = { 9, 5, 8, 1, 3, 2, 7, 6, 4, 0 };\n    heap2.buildHeap(raw, 10);       // 一次性建堆，O(n)\n    heap2.print();\n\n    std::cout << \"建堆后连续 pop：\";\n    while (!heap2.empty())\n    {\n        std::cout << heap2.pop() << \" \";\n    }\n    std::cout << std::endl;\n\n    return 0;\n}"}]},"rs":{"file":"heap.rs","steps":[{"title":"结构定义","note":"小顶堆用数组存完全二叉树，左孩子 2i+1，右孩子 2i+2，父节点 (i-1)/2","code":"pub struct MinHeap\n{\n    data: Vec<i32>,\n}"},{"title":"初始化与销毁","note":"Rust 不用写析构函数，Vec 离开作用域会自动释放","code":"impl MinHeap\n{\n    pub fn new() -> MinHeap\n    {\n        MinHeap { data: Vec::new() }\n    }\n\n    pub fn len(&self) -> usize\n    {\n        self.data.len()\n    }\n\n    pub fn empty(&self) -> bool\n    {\n        self.data.is_empty()\n    }\n}"},{"title":"上浮 sift_up + 入堆 push","note":"新元素放到数组末尾，然后一路和父节点比着往上浮","code":"impl MinHeap\n{\n    fn sift_up(&mut self, mut i: usize)\n    {\n        while i > 0\n        {\n            let parent = (i - 1) / 2;\n\n            if self.data[parent] <= self.data[i]   // 父节点已经比它小，堆序满足，停\n            {\n                break;\n            }\n\n            self.data.swap(i, parent);\n            i = parent;                            // 继续和新的父节点比\n        }\n    }\n\n    pub fn push(&mut self, value: i32)\n    {\n        self.data.push(value);          // 1. 先放到末尾，保证完全二叉树的形状\n        let last = self.data.len() - 1;\n        self.sift_up(last);             // 2. 再往上调整，恢复堆序\n    }\n}"},{"title":"下沉 sift_down + 出堆 pop","note":"堆顶取走后，把末尾元素补到根，再往下沉","code":"impl MinHeap\n{\n    fn sift_down(&mut self, mut i: usize)\n    {\n        let n = self.data.len();\n\n        loop\n        {\n            let left = 2 * i + 1;\n            let right = 2 * i + 2;\n            let mut smallest = i;\n\n            if left < n && self.data[left] < self.data[smallest]\n            {\n                smallest = left;\n            }\n            if right < n && self.data[right] < self.data[smallest]\n            {\n                smallest = right;\n            }\n            if smallest == i               // 比两个孩子都小，到位了\n            {\n                break;\n            }\n\n            self.data.swap(i, smallest);\n            i = smallest;\n        }\n    }\n\n    pub fn pop(&mut self) -> Option<i32>\n    {\n        if self.data.is_empty()\n        {\n            println!(\"error! : heap is empty!\");\n            return None;\n        }\n\n        let smallest = self.data[0];        // 堆顶就是最小值\n        let last = self.data.len() - 1;\n\n        self.data.swap(0, last);            // 末尾元素补到堆顶，形状才不破\n        self.data.pop();                    // 把原来的堆顶摘掉\n\n        if !self.data.is_empty()\n        {\n            self.sift_down(0);\n        }\n\n        Some(smallest)\n    }\n\n    pub fn top(&self) -> Option<i32>\n    {\n        if self.data.is_empty()\n        {\n            None\n        }\n        else\n        {\n            Some(self.data[0])\n        }\n    }\n}"},{"title":"建堆 build_heap（O(n)）","note":"从最后一个非叶节点开始倒着下沉，比一个个 push 快","code":"impl MinHeap\n{\n    pub fn build_heap(&mut self, values: &[i32])\n    {\n        self.data = values.to_vec();\n\n        if self.data.is_empty()\n        {\n            return;\n        }\n\n        // 叶子节点本身就是合法的堆，所以只需要处理非叶节点\n        // 最后一个非叶节点的下标是 n/2 - 1\n        let mut i = self.data.len() / 2;\n        while i > 0\n        {\n            i -= 1;\n            self.sift_down(i);\n        }\n    }\n\n    pub fn print(&self, name: &str)\n    {\n        println!(\"{}: {:?}\", name, self.data);\n    }\n}"},{"title":"main：跑一遍","note":"push/pop 一条路，build_heap 一条路","code":"fn main()\n{\n    let mut heap = MinHeap::new();\n\n    for value in [5, 3, 8, 1, 9, 2, 7]\n    {\n        heap.push(value);\n    }\n    heap.print(\"push 之后\");\n    println!(\"堆顶（最小值）= {:?}\", heap.top());\n\n    print!(\"连续 pop：\");\n    while !heap.empty()\n    {\n        print!(\"{:?} \", heap.pop());\n    }\n    println!();\n\n    let mut heap2 = MinHeap::new();\n    heap2.build_heap(&[9, 5, 8, 1, 3, 2, 7, 6, 4, 0]);\n    heap2.print(\"建堆之后\");                 // 注意这一步是 O(n)，不是 O(n log n)\n    println!(\"堆顶（最小值）= {:?}\", heap2.top());\n}"}]}},"graph":{"c":{"file":"graph.c","steps":[{"title":"邻接表结构","note":"每个顶点挂一条边结点链表，无向边要存两个方向","code":"#include <stdio.h>\n#include <stdlib.h>\n#include <stdbool.h>\ntypedef struct AdjNode\n{\n    int to;                 // 这条边通向哪个顶点\n    struct AdjNode* next;   // 同一个顶点的下一条边\n} AdjNode;\ntypedef struct\n{\n    AdjNode** heads;   // 每个顶点一条链表\n    int n;             // 顶点个数\n    int m;             // 边数\n} MyGraph;"},{"title":"加边 addEdge","note":"头插法 O(1)，无向边的两边各插一次","code":"void graphAddEdge(MyGraph* g, int u, int v)\n{\n    if (u < 0 || u >= g->n || v < 0 || v >= g->n)\n    {\n        printf(\"error! : vertex out of range!\\n\");\n        return;\n    }\n    AdjNode* p = (AdjNode*)malloc(sizeof(AdjNode));\n    if (p == NULL)\n    {\n        printf(\"error! : malloc failed!\\n\");\n        return;\n    }\n    p->to = v;\n    p->next = g->heads[u];\n    g->heads[u] = p;\n    p = (AdjNode*)malloc(sizeof(AdjNode));\n    if (p == NULL)\n    {\n        printf(\"error! : malloc failed!\\n\");\n        return;\n    }\n    p->to = u;                    // 反方向也要有一条，这样才是无向图\n    p->next = g->heads[v];\n    g->heads[v] = p;\n    g->m++;\n}"},{"title":"建图与销毁","note":"calloc 顶点表，释放时先 free 边结点再 free 顶点表","code":"MyGraph* graphCreate(int n)\n{\n    MyGraph* g = (MyGraph*)malloc(sizeof(MyGraph));\n    if (g == NULL)\n    {\n        printf(\"error! : malloc failed!\\n\");\n        return NULL;\n    }\n    g->heads = (AdjNode**)calloc(n, sizeof(AdjNode*));\n    if (g->heads == NULL)\n    {\n        printf(\"error! : calloc failed!\\n\");\n        free(g);\n        return NULL;\n    }\n    g->n = n;\n    g->m = 0;\n    return g;\n}\nvoid graphFree(MyGraph* g)\n{\n    for (int i = 0; i < g->n; i++)\n    {\n        AdjNode* cur = g->heads[i];\n        while (cur != NULL)\n        {\n            AdjNode* next = cur->next;\n            free(cur);\n            cur = next;\n        }\n    }\n    free(g->heads);\n    free(g);\n}"},{"title":"广度优先 BFS","note":"用数组当队列，入队时就标记 visited，逐层向外扩散","code":"void graphBfs(MyGraph* g, int start)\n{\n    bool* visited = (bool*)calloc(g->n, sizeof(bool));\n    int* queue = (int*)malloc(g->n * sizeof(int));\n    if (visited == NULL || queue == NULL)\n    {\n        printf(\"error! : malloc failed!\\n\");\n        free(visited);\n        free(queue);\n        return;\n    }\n    int head = 0;\n    int tail = 0;\n    visited[start] = true;   // 起点先标记再入队，避免被重复排进去\n    queue[tail] = start;\n    tail++;\n    printf(\"BFS:\");\n    while (head < tail)\n    {\n        int u = queue[head];\n        head++;\n        printf(\" %d\", u);\n        for (AdjNode* p = g->heads[u]; p != NULL; p = p->next)\n        {\n            if (!visited[p->to])\n            {\n                visited[p->to] = true;\n                queue[tail] = p->to;\n                tail++;\n            }\n        }\n    }\n    printf(\"\\n\");\n    free(queue);\n    free(visited);\n}"},{"title":"深度优先 DFS","note":"递归一条路走到黑，走不动再回头换下一条边","code":"void graphDfsVisit(MyGraph* g, int u, bool* visited)\n{\n    visited[u] = true;\n    printf(\" %d\", u);\n    for (AdjNode* p = g->heads[u]; p != NULL; p = p->next)\n    {\n        if (!visited[p->to])\n        {\n            graphDfsVisit(g, p->to, visited);\n        }\n    }\n}\nvoid graphDfs(MyGraph* g, int start)\n{\n    bool* visited = (bool*)calloc(g->n, sizeof(bool));\n    if (visited == NULL)\n    {\n        printf(\"error! : calloc failed!\\n\");\n        return;\n    }\n    printf(\"DFS:\");\n    graphDfsVisit(g, start, visited);\n    printf(\"\\n\");\n    free(visited);\n}"},{"title":"main：跑一遍","note":"6 个顶点 8 条边，打印从 0 号出发的两种遍历","code":"int main(void)\n{\n    MyGraph* g = graphCreate(6);\n    if (g == NULL)\n    {\n        return 1;\n    }\n    int edges[8][2] = { {0, 1}, {0, 2}, {0, 3}, {1, 2}, {1, 3}, {2, 3}, {3, 4}, {4, 5} };\n    for (int i = 0; i < 8; i++)\n    {\n        graphAddEdge(g, edges[i][0], edges[i][1]);\n    }\n    printf(\"n = %d, m = %d\\n\", g->n, g->m);\n    graphBfs(g, 0);\n    graphDfs(g, 0);\n    graphFree(g);\n    return 0;\n}"}]},"cpp":{"file":"graph.cpp","steps":[{"title":"邻接表结构","note":"每个顶点挂一条链表，链表里存\"从这个顶点能直接走到哪些顶点\"","code":"#include <iostream>\n\nclass Graph\n{\npublic:\n    Graph(int n);\n    ~Graph();\n    void addEdge(int u, int v);\n    void BFS(int start);\n    void DFS(int start);\n    int  countComponents();\n    void print();\n\nprivate:\n    struct Edge\n    {\n        int to;          // 这条边通向哪个顶点\n        Edge* next;\n    };\n\n    Edge** adj;          // 邻接表：adj[i] 是顶点 i 的边链表头\n    int vertexCount;     // 顶点个数\n\n    void dfsVisit(int v, bool* visited);\n};"},{"title":"加边 addEdge","note":"无向图一条边要在两个顶点的链表里各加一次","code":"void Graph::addEdge(int u, int v)\n{\n    Edge* e1 = new Edge;\n    e1->to = v;\n    e1->next = adj[u];       // 头插，O(1)\n    adj[u] = e1;\n\n    Edge* e2 = new Edge;\n    e2->to = u;\n    e2->next = adj[v];\n    adj[v] = e2;\n}"},{"title":"建图与销毁","note":"构造时把每个顶点的边链表置空；析构时把边和邻接表都还回去","code":"Graph::Graph(int n)\n{\n    vertexCount = n;\n    adj = new Edge*[vertexCount];\n\n    for (int i = 0; i < vertexCount; i++)\n    {\n        adj[i] = nullptr;\n    }\n}\n\nGraph::~Graph()\n{\n    for (int i = 0; i < vertexCount; i++)\n    {\n        Edge* e = adj[i];\n        while (e != nullptr)\n        {\n            Edge* next = e->next;\n            delete e;\n            e = next;\n        }\n    }\n\n    delete[] adj;\n}"},{"title":"广度优先 BFS","note":"用队列一层一层往外扩，第一次到达某个点走的就是最短路","code":"void Graph::BFS(int start)\n{\n    bool* visited = new bool[vertexCount];\n    for (int i = 0; i < vertexCount; i++)\n    {\n        visited[i] = false;\n    }\n\n    int* queue = new int[vertexCount];   // 每个顶点最多进队一次，开这么大够用\n    int head = 0;\n    int tail = 0;\n\n    visited[start] = true;\n    queue[tail] = start;\n    tail++;\n\n    std::cout << \"BFS: \";\n    while (head < tail)\n    {\n        int v = queue[head];       // 从队头取\n        head++;\n        std::cout << v << \" \";\n\n        for (Edge* e = adj[v]; e != nullptr; e = e->next)\n        {\n            if (!visited[e->to])\n            {\n                visited[e->to] = true;   // 关键：入队时就要标记，不然会重复入队\n                queue[tail] = e->to;\n                tail++;\n            }\n        }\n    }\n    std::cout << std::endl;\n\n    delete[] queue;\n    delete[] visited;\n}"},{"title":"深度优先 DFS","note":"一条路走到黑，走不动再回头（递归本身就用了系统的栈）","code":"void Graph::dfsVisit(int v, bool* visited)\n{\n    visited[v] = true;\n    std::cout << v << \" \";\n\n    for (Edge* e = adj[v]; e != nullptr; e = e->next)\n    {\n        if (!visited[e->to])\n        {\n            dfsVisit(e->to, visited);\n        }\n    }\n}\n\nvoid Graph::DFS(int start)\n{\n    bool* visited = new bool[vertexCount];\n    for (int i = 0; i < vertexCount; i++)\n    {\n        visited[i] = false;\n    }\n\n    std::cout << \"DFS: \";\n    dfsVisit(start, visited);\n    std::cout << std::endl;\n\n    delete[] visited;\n}\n\nint Graph::countComponents()\n{\n    bool* visited = new bool[vertexCount];\n    for (int i = 0; i < vertexCount; i++)\n    {\n        visited[i] = false;\n    }\n\n    int count = 0;\n    for (int v = 0; v < vertexCount; v++)\n    {\n        if (!visited[v])              // 遇到没访问过的顶点，就是一个新的连通块\n        {\n            count++;\n            dfsVisit(v, visited);     // 一次 DFS 把整个连通块吃掉\n        }\n    }\n\n    delete[] visited;\n    return count;\n}"},{"title":"main：跑一遍","note":"造一张不连通的图，看 BFS / DFS 的顺序和连通分量个数","code":"void Graph::print()\n{\n    std::cout << \"顶点数 = \" << vertexCount << std::endl;\n    for (int i = 0; i < vertexCount; i++)\n    {\n        std::cout << \"  \" << i << \": \";\n        for (Edge* e = adj[i]; e != nullptr; e = e->next)\n        {\n            std::cout << e->to << \" \";\n        }\n        std::cout << std::endl;\n    }\n}\n\nint main()\n{\n    Graph g(8);\n\n    // 0~5 构成一个连通块，6 和 7 单独连成一小块，所以一共 2 个连通分量\n    g.addEdge(0, 1);\n    g.addEdge(0, 2);\n    g.addEdge(1, 3);\n    g.addEdge(2, 3);\n    g.addEdge(2, 4);\n    g.addEdge(3, 5);\n    g.addEdge(4, 5);\n    g.addEdge(6, 7);\n\n    g.print();\n    g.BFS(0);\n    g.DFS(0);\n    g.BFS(6);                          // 从 6 出发只能走到 7\n\n    std::cout << \"连通分量个数 = \" << g.countComponents() << std::endl;\n\n    return 0;\n}"}]},"rs":{"file":"graph.rs","steps":[{"title":"邻接表结构","note":"每个顶点挂一个列表，里面存\"从这个顶点能直接走到哪些顶点\"","code":"pub struct Graph\n{\n    adj: Vec<Vec<usize>>,       // adj[i] 是顶点 i 的邻居列表\n    vertex_count: usize,\n}"},{"title":"加边 add_edge","note":"无向图一条边要在两个顶点的列表里各加一次","code":"impl Graph\n{\n    pub fn add_edge(&mut self, u: usize, v: usize)\n    {\n        self.adj[u].push(v);\n        self.adj[v].push(u);\n    }\n}"},{"title":"建图与销毁","note":"new 里把每个顶点的邻居列表置空；Rust 不用写析构","code":"impl Graph\n{\n    pub fn new(n: usize) -> Graph\n    {\n        let mut adj = Vec::new();\n\n        for _ in 0..n\n        {\n            adj.push(Vec::new());\n        }\n\n        Graph { adj, vertex_count: n }\n    }\n}"},{"title":"广度优先 BFS","note":"用队列一层一层往外扩，第一次到达某个点走的就是最短路","code":"impl Graph\n{\n    pub fn bfs(&self, start: usize)\n    {\n        let mut visited = vec![false; self.vertex_count];\n        let mut queue: Vec<usize> = Vec::new();\n        let mut head = 0;                 // 队头下标：从 0 号位取，往末尾加\n\n        visited[start] = true;\n        queue.push(start);\n\n        print!(\"BFS: \");\n        while head < queue.len()\n        {\n            let v = queue[head];          // 从队头取\n            head += 1;\n            print!(\"{} \", v);\n\n            for &nb in &self.adj[v]\n            {\n                if !visited[nb]\n                {\n                    visited[nb] = true;   // 关键：入队时就要标记，不然会重复入队\n                    queue.push(nb);\n                }\n            }\n        }\n        println!();\n    }\n}"},{"title":"深度优先 DFS","note":"一条路走到黑，走不动再回头（递归本身就用了系统的栈）","code":"impl Graph\n{\n    fn dfs_visit(&self, v: usize, visited: &mut Vec<bool>)\n    {\n        visited[v] = true;\n        print!(\"{} \", v);\n\n        for &nb in &self.adj[v]\n        {\n            if !visited[nb]\n            {\n                self.dfs_visit(nb, visited);\n            }\n        }\n    }\n\n    pub fn dfs(&self, start: usize)\n    {\n        let mut visited = vec![false; self.vertex_count];\n\n        print!(\"DFS: \");\n        self.dfs_visit(start, &mut visited);\n        println!();\n    }\n\n    pub fn count_components(&self) -> usize\n    {\n        let mut visited = vec![false; self.vertex_count];\n        let mut count = 0;\n\n        for v in 0..self.vertex_count\n        {\n            if !visited[v]                        // 遇到没访问过的顶点，就是一个新连通块\n            {\n                count += 1;\n                self.dfs_visit(v, &mut visited);  // 一次 DFS 把整个连通块吃掉\n            }\n        }\n\n        count\n    }\n\n    pub fn print(&self)\n    {\n        println!(\"顶点数 = {}\", self.vertex_count);\n\n        for i in 0..self.vertex_count\n        {\n            println!(\"  {}: {:?}\", i, self.adj[i]);\n        }\n    }\n}"},{"title":"main：跑一遍","note":"造一张不连通的图，看 BFS / DFS 的顺序和连通分量个数","code":"fn main()\n{\n    let mut g = Graph::new(8);\n\n    // 0~5 构成一个连通块，6 和 7 单独连成一小块，所以一共 2 个连通分量\n    g.add_edge(0, 1);\n    g.add_edge(0, 2);\n    g.add_edge(1, 3);\n    g.add_edge(2, 3);\n    g.add_edge(2, 4);\n    g.add_edge(3, 5);\n    g.add_edge(4, 5);\n    g.add_edge(6, 7);\n\n    g.print();\n    g.bfs(0);\n    g.dfs(0);\n    g.bfs(6);                       // 从 6 出发只能走到 7\n\n    println!(\"连通分量个数 = {}\", g.count_components());\n}"}]}},"sort":{"c":{"file":"sort.c","steps":[{"title":"冒泡排序 bubbleSort","note":"相邻比较交换，一轮没换过就说明已经有序","code":"#include <stdio.h>\n#include <stdlib.h>\n#include <stdbool.h>\nvoid bubbleSort(int* a, int n)\n{\n    for (int end = n; end > 1; end--)\n    {\n        bool swapped = false;\n        for (int i = 1; i < end; i++)\n        {\n            if (a[i - 1] > a[i])\n            {\n                int t = a[i - 1];\n                a[i - 1] = a[i];\n                a[i] = t;\n                swapped = true;\n            }\n        }\n        if (!swapped)\n        {\n            break;   // 这一轮一次都没换，后面肯定已经有序\n        }\n    }\n}"},{"title":"插入排序 insertionSort","note":"把 a[i] 插进前面已经排好的区间里","code":"void insertionSort(int* a, int n)\n{\n    for (int i = 1; i < n; i++)\n    {\n        int key = a[i];\n        int j = i;\n        while (j > 0 && a[j - 1] > key)   // 比 key 大的元素统统往后挪一格\n        {\n            a[j] = a[j - 1];\n            j--;\n        }\n        a[j] = key;\n    }\n}"},{"title":"归并排序 mergeSort","note":"先递归排好左右两半，再把两个有序区间合并","code":"void mergeSortRange(int* a, int* tmp, int lo, int hi)\n{\n    if (hi - lo < 2)\n    {\n        return;   // 区间里最多一个元素，天然有序\n    }\n    int mid = lo + (hi - lo) / 2;\n    mergeSortRange(a, tmp, lo, mid);\n    mergeSortRange(a, tmp, mid, hi);\n    int i = lo;\n    int j = mid;\n    for (int k = lo; k < hi; k++)\n    {\n        // 左边取完了就取右边，否则比较两边谁小就取谁\n        if (i >= mid || (j < hi && a[j] < a[i]))\n        {\n            tmp[k] = a[j];\n            j++;\n        }\n        else\n        {\n            tmp[k] = a[i];\n            i++;\n        }\n    }\n    for (int k = lo; k < hi; k++)\n    {\n        a[k] = tmp[k];   // 临时数组的结果拷回原数组\n    }\n}\nvoid mergeSort(int* a, int n)\n{\n    if (n < 2)\n    {\n        return;\n    }\n    int* tmp = (int*)malloc(n * sizeof(int));\n    if (tmp == NULL)\n    {\n        printf(\"error! : malloc failed!\\n\");\n        return;\n    }\n    mergeSortRange(a, tmp, 0, n);\n    free(tmp);\n}"},{"title":"快速排序 quickSort（Lomuto 分区）","note":"固定取末尾元素当基准，保证输出确定","code":"int quickPartition(int* a, int lo, int hi)\n{\n    int pivot = a[hi];   // 基准取区间最后一个\n    int i = lo;          // i 左边都小于基准\n    for (int j = lo; j < hi; j++)\n    {\n        if (a[j] < pivot)\n        {\n            int t = a[i];\n            a[i] = a[j];\n            a[j] = t;\n            i++;\n        }\n    }\n    int t = a[i];        // 最后把基准换到分界点上\n    a[i] = a[hi];\n    a[hi] = t;\n    return i;\n}\nvoid quickSortRange(int* a, int lo, int hi)\n{\n    if (lo >= hi)\n    {\n        return;\n    }\n    int p = quickPartition(a, lo, hi);\n    quickSortRange(a, lo, p - 1);\n    quickSortRange(a, p + 1, hi);\n}\nvoid quickSort(int* a, int n)\n{\n    if (n > 1)\n    {\n        quickSortRange(a, 0, n - 1);\n    }\n}"},{"title":"main：跑一遍","note":"同一组数据跑四种排序，结果应该完全一样","code":"void printArray(char* tag, int* a, int n)\n{\n    printf(\"%-14s:\", tag);\n    for (int i = 0; i < n; i++)\n    {\n        printf(\" %d\", a[i]);\n    }\n    printf(\"\\n\");\n}\nvoid resetArray(int* a, int* base, int n)\n{\n    for (int i = 0; i < n; i++)\n    {\n        a[i] = base[i];\n    }\n}\nint main(void)\n{\n    int base[] = { 5, 2, 9, 1, 5, 6, -3, 8, 0, 7, 4, 2 };\n    int n = 12;\n    int a[12];\n    resetArray(a, base, n);\n    bubbleSort(a, n);\n    printArray(\"bubbleSort\", a, n);\n    resetArray(a, base, n);\n    insertionSort(a, n);\n    printArray(\"insertionSort\", a, n);\n    resetArray(a, base, n);\n    mergeSort(a, n);\n    printArray(\"mergeSort\", a, n);\n    resetArray(a, base, n);\n    quickSort(a, n);\n    printArray(\"quickSort\", a, n);\n    printf(\"四种排序结果一致且升序。\\n\");\n    return 0;\n}"}]},"cpp":{"file":"sort.cpp","steps":[{"title":"冒泡排序 bubbleSort","note":"相邻两个比较，大的往后冒；一整轮没交换就可以提前结束","code":"#include <iostream>\n\nvoid bubbleSort(int arr[], int n)\n{\n    for (int end = n - 1; end > 0; end--)\n    {\n        bool swapped = false;\n\n        for (int i = 0; i < end; i++)\n        {\n            if (arr[i] > arr[i + 1])\n            {\n                int temp = arr[i];\n                arr[i] = arr[i + 1];\n                arr[i + 1] = temp;\n                swapped = true;\n            }\n        }\n\n        if (!swapped)      // 这一轮一次都没换，说明已经有序了\n        {\n            break;\n        }\n    }\n}"},{"title":"插入排序 insertionSort","note":"像摸扑克牌，把当前这张插到左边已经排好的那一堆里","code":"void insertionSort(int arr[], int n)\n{\n    for (int i = 1; i < n; i++)\n    {\n        int cur = arr[i];\n        int j = i - 1;\n\n        while (j >= 0 && arr[j] > cur)\n        {\n            arr[j + 1] = arr[j];    // 比它大的元素统统往后挪一格\n            j--;\n        }\n\n        arr[j + 1] = cur;           // 空出来的位置就是它的家\n    }\n}"},{"title":"归并排序 mergeSort","note":"先一分为二递归排好，再把两个有序数组\"拉链式\"合并","code":"void merge(int arr[], int temp[], int lo, int mid, int hi)\n{\n    int i = lo;\n    int j = mid + 1;\n    int k = lo;\n\n    while (i <= mid && j <= hi)\n    {\n        if (arr[i] <= arr[j])       // 相等时先取左边，这样才是稳定排序\n        {\n            temp[k] = arr[i];\n            i++;\n        }\n        else\n        {\n            temp[k] = arr[j];\n            j++;\n        }\n        k++;\n    }\n\n    while (i <= mid)                // 左边还有剩的，整段接上\n    {\n        temp[k] = arr[i];\n        i++;\n        k++;\n    }\n    while (j <= hi)                 // 右边还有剩的，整段接上\n    {\n        temp[k] = arr[j];\n        j++;\n        k++;\n    }\n\n    for (int t = lo; t <= hi; t++)  // 再把临时数组搬回原数组\n    {\n        arr[t] = temp[t];\n    }\n}\n\nvoid mergeSort(int arr[], int temp[], int lo, int hi)\n{\n    if (lo >= hi)                   // 只剩 0 个或 1 个元素，天然有序\n    {\n        return;\n    }\n\n    int mid = lo + (hi - lo) / 2;\n    mergeSort(arr, temp, lo, mid);      // 左半边排好\n    mergeSort(arr, temp, mid + 1, hi);  // 右半边排好\n    merge(arr, temp, lo, mid, hi);      // 合起来\n}"},{"title":"快速排序 quickSort（Lomuto 分区）","note":"选一个基准，比它小的丢左边，大的丢右边","code":"int partition(int arr[], int lo, int hi)\n{\n    int pivot = arr[hi];       // 取最后一个元素当基准\n    int i = lo;                // i 指向\"小于区\"的下一个空位\n\n    for (int j = lo; j < hi; j++)    // 注意是 j < hi，arr[hi] 是基准本身\n    {\n        if (arr[j] < pivot)\n        {\n            int temp = arr[i];\n            arr[i] = arr[j];\n            arr[j] = temp;\n            i++;\n        }\n    }\n\n    int temp = arr[i];         // 最后把基准换到 i 的位置，这一步最容易忘\n    arr[i] = arr[hi];\n    arr[hi] = temp;\n\n    return i;                  // 返回基准的最终下标\n}\n\nvoid quickSort(int arr[], int lo, int hi)\n{\n    if (lo >= hi)\n    {\n        return;\n    }\n\n    int p = partition(arr, lo, hi);\n    quickSort(arr, lo, p - 1);     // 注意是 p-1\n    quickSort(arr, p + 1, hi);     // 和 p+1，写成 p 会死循环\n}"},{"title":"main：跑一遍","note":"同一组数据跑四种排序，结果应该完全一样","code":"void printArray(const char* name, int arr[], int n)\n{\n    std::cout << name;\n    for (int i = 0; i < n; i++)\n    {\n        std::cout << arr[i] << \" \";\n    }\n    std::cout << std::endl;\n}\n\nvoid copyArray(int from[], int to[], int n)\n{\n    for (int i = 0; i < n; i++)\n    {\n        to[i] = from[i];\n    }\n}\n\nint main()\n{\n    int data[] = { 5, 2, 9, 1, 5, 6, -3, 8, 0, 7, 4, 2 };\n    const int n = 12;\n    int work[12];\n    int temp[12];\n\n    printArray(\"原始数组   : \", data, n);\n\n    copyArray(data, work, n);\n    bubbleSort(work, n);\n    printArray(\"bubbleSort : \", work, n);\n\n    copyArray(data, work, n);\n    insertionSort(work, n);\n    printArray(\"insertSort : \", work, n);\n\n    copyArray(data, work, n);\n    mergeSort(work, temp, 0, n - 1);\n    printArray(\"mergeSort  : \", work, n);\n\n    copyArray(data, work, n);\n    quickSort(work, 0, n - 1);\n    printArray(\"quickSort  : \", work, n);\n\n    return 0;\n}"}]},"rs":{"file":"sort.rs","steps":[{"title":"冒泡排序 bubble_sort","note":"相邻两个比较，大的往后冒；一整轮没交换就可以提前结束","code":"fn bubble_sort(arr: &mut [i32])\n{\n    let n = arr.len();\n\n    for end in (1..n).rev()\n    {\n        let mut swapped = false;\n\n        for i in 0..end\n        {\n            if arr[i] > arr[i + 1]\n            {\n                arr.swap(i, i + 1);\n                swapped = true;\n            }\n        }\n\n        if !swapped          // 这一轮一次都没换，说明已经有序了\n        {\n            break;\n        }\n    }\n}"},{"title":"插入排序 insertion_sort","note":"像摸扑克牌，把当前这张插到左边已经排好的那一堆里","code":"fn insertion_sort(arr: &mut [i32])\n{\n    for i in 1..arr.len()\n    {\n        let cur = arr[i];\n        let mut j = i;\n\n        while j > 0 && arr[j - 1] > cur\n        {\n            arr[j] = arr[j - 1];    // 比它大的元素统统往后挪一格\n            j -= 1;\n        }\n\n        arr[j] = cur;               // 空出来的位置就是它的家\n    }\n}"},{"title":"归并排序 merge_sort","note":"一分为二递归排好，再把两个有序数组\"拉链式\"合并","code":"fn merge_sort(arr: &mut [i32])\n{\n    let n = arr.len();\n\n    if n <= 1                       // 只剩 0 个或 1 个元素，天然有序\n    {\n        return;\n    }\n\n    let mid = n / 2;\n    merge_sort(&mut arr[..mid]);        // 左半边排好\n    merge_sort(&mut arr[mid..]);        // 右半边排好\n\n    let mut merged = Vec::new();\n    let (left, right) = arr.split_at(mid);\n    let mut i = 0;\n    let mut j = 0;\n\n    while i < left.len() && j < right.len()\n    {\n        if left[i] <= right[j]          // 相等时先取左边，这样才是稳定排序\n        {\n            merged.push(left[i]);\n            i += 1;\n        }\n        else\n        {\n            merged.push(right[j]);\n            j += 1;\n        }\n    }\n\n    while i < left.len()                // 左边还有剩的，整段接上\n    {\n        merged.push(left[i]);\n        i += 1;\n    }\n    while j < right.len()               // 右边还有剩的，整段接上\n    {\n        merged.push(right[j]);\n        j += 1;\n    }\n\n    arr.copy_from_slice(&merged);       // 把临时结果搬回原数组\n}"},{"title":"快速排序 quick_sort（Lomuto 分区）","note":"选一个基准，比它小的丢左边，大的丢右边","code":"fn partition(arr: &mut [i32]) -> usize\n{\n    let hi = arr.len() - 1;\n    let pivot = arr[hi];        // 取最后一个元素当基准\n    let mut i = 0;              // i 指向\"小于区\"的下一个空位\n\n    for j in 0..hi              // 注意是 j < hi，arr[hi] 是基准本身\n    {\n        if arr[j] < pivot\n        {\n            arr.swap(i, j);\n            i += 1;\n        }\n    }\n\n    arr.swap(i, hi);            // 最后把基准换到 i 的位置，这一步最容易忘\n    i                           // 返回基准的最终下标\n}\n\nfn quick_sort(arr: &mut [i32])\n{\n    if arr.len() <= 1\n    {\n        return;\n    }\n\n    let p = partition(arr);\n    let (left, rest) = arr.split_at_mut(p);\n\n    quick_sort(left);           // 左边继续排\n    quick_sort(&mut rest[1..]); // rest[0] 是基准，已经就位了，跳过它\n}"},{"title":"main：跑一遍","note":"同一组数据跑四种排序，结果应该完全一样","code":"fn main()\n{\n    let data = [5, 2, 9, 1, 5, 6, -3, 8, 0, 7, 4, 2];\n\n    let mut a = data;\n    bubble_sort(&mut a);\n    println!(\"bubbleSort : {:?}\", a);\n\n    let mut b = data;\n    insertion_sort(&mut b);\n    println!(\"insertSort : {:?}\", b);\n\n    let mut c = data;\n    merge_sort(&mut c);\n    println!(\"mergeSort  : {:?}\", c);\n\n    let mut d = data;\n    quick_sort(&mut d);\n    println!(\"quickSort  : {:?}\", d);\n\n    println!(\"原始数组   : {:?}\", data);\n}"}]}}};

window.DSV_EX = {"array":[null,{"c":"/* 原地删除所有等于 value 的元素：读指针扫全部，写指针只在\"该保留\"时前进。\n   O(n) 时间、O(1) 额外空间，不用新建数组，也不会退化成 O(n^2)。 */\nvoid arrayRemoveAll(MyArray* a, int value)\n{\n    int w = 0;\n\n    for (int r = 0; r < a->size; r++)\n    {\n        if (a->data[r] != value)\n        {\n            a->data[w] = a->data[r];   /* 该留：写到 w 位置 */\n            w++;\n        }\n        /* 该删：w 原地不动，后面的元素自然覆盖上来 */\n    }\n\n    a->size = w;      /* 尾巴上的脏数据不用清，下次 pushBack 会覆盖 */\n}","cpp":"// 给 MyArray 再加一个成员函数（类里记得也补一行声明）\nvoid MyArray::removeAll(int value)\n{\n    int w = 0;                        // 写指针：下一个\"该保留\"的元素放到哪\n\n    for (int r = 0; r < size; r++)    // 读指针：扫过每一个元素\n    {\n        if (arr[r] != value)\n        {\n            arr[w] = arr[r];          // 该留 -> 挪到 w 位置\n            w++;\n        }\n        // 该删 -> w 不动，后面的元素自然覆盖上来\n    }\n\n    size = w;\n}","rs":"// 给 MyArray 再加一个方法\nimpl MyArray\n{\n    pub fn remove_all(&mut self, value: i32)\n    {\n        let mut w = 0;                     // 写指针\n\n        for r in 0..self.data.len()        // 读指针\n        {\n            if self.data[r] != value\n            {\n                self.data[w] = self.data[r];\n                w += 1;\n            }\n        }\n\n        self.data.truncate(w);             // 后面的都不要了\n    }\n}"}],"linkedlist":[null,{"c":"/* 删除倒数第 k 个节点，只遍历一趟：\n   快指针先走 k 步，然后两个指针一起走，\n   快指针到尾时慢指针正好停在\"待删节点的前一个\"上。 */\nNode* listRemoveNthFromEnd(Node* head, int k)\n{\n    Node dummy;\n    dummy.data = 0;\n    dummy.next = head;              /* 哑结点：这样删头节点也不用特判 */\n\n    Node* fast = &dummy;\n    Node* slow = &dummy;\n\n    for (int i = 0; i < k; i++)\n    {\n        if (fast->next == NULL) return head;   /* k 比链表还长 */\n        fast = fast->next;\n    }\n\n    while (fast->next != NULL)      /* 两个指针一起走 */\n    {\n        fast = fast->next;\n        slow = slow->next;\n    }\n\n    Node* temp = slow->next;        /* slow 停在倒数第 k+1 个 */\n    slow->next = temp->next;\n    free(temp);\n\n    return dummy.next;\n}","cpp":"// 给 List 再加一个成员函数\nvoid List::removeNthFromEnd(int k)\n{\n    Node dummy;                     // 栈上的哑结点，不用 new\n    dummy.data = 0;\n    dummy.next = head;\n\n    Node* fast = &dummy;\n    Node* slow = &dummy;\n\n    for (int i = 0; i < k; i++)\n    {\n        fast = fast->next;\n    }\n\n    while (fast->next != nullptr)   // 两个指针一起走\n    {\n        fast = fast->next;\n        slow = slow->next;\n    }\n\n    Node* temp = slow->next;        // 先把要删的摘出来\n    slow->next = temp->next;        // 让前驱跨过它\n    delete temp;\n\n    head = dummy.next;              // 头可能变了，写回去\n    length--;\n}","rs":"// 给 List 再加上一个方法（写在 impl List { ... } 里面）\n//\n// 注意：C/C++ 里\"快慢指针一趟走完\"的写法在安全 Rust 里写不出来 ——\n// 它要同时持有两个 &mut 引用。所以这里退一步：先把值读进 Vec，删完再重建。\nimpl List\n{\n    pub fn remove_nth_from_end(&mut self, k: usize)\n    {\n        let mut values: Vec<i32> = Vec::new();\n        let mut cur = self.head.as_deref();\n\n        while let Some(node) = cur\n        {\n            values.push(node.data);\n            cur = node.next.as_deref();\n        }\n\n        let n = values.len();\n        if k == 0 || k > n\n        {\n            return;\n        }\n\n        values.remove(n - k);\n\n        let mut head: Option<Box<Node>> = None;\n        for i in (0..values.len()).rev()\n        {\n            head = Some(Box::new(Node { data: values[i], next: head }));\n        }\n\n        self.head = head;\n        self.length = values.len();\n    }\n}"},{"c":"/* 合并两个有序链表：哑结点 + 每次接上较小的那个头，\n   最后把没走完的那条链整段挂上去。 */\nNode* listMergeSorted(Node* a, Node* b)\n{\n    Node dummy;\n    dummy.data = 0;\n    dummy.next = NULL;\n\n    Node* tail = &dummy;\n\n    while (a != NULL && b != NULL)\n    {\n        if (a->data <= b->data) { tail->next = a; a = a->next; }\n        else                    { tail->next = b; b = b->next; }\n        tail = tail->next;\n    }\n\n    tail->next = (a != NULL) ? a : b;   /* 剩下的整条链直接接上 */\n    return dummy.next;\n}","cpp":"// 合并两个有序链表\nNode* mergeSorted(Node* a, Node* b)\n{\n    Node dummy;\n    dummy.data = 0;\n    dummy.next = nullptr;\n\n    Node* tail = &dummy;\n\n    while (a != nullptr && b != nullptr)\n    {\n        if (a->data <= b->data)\n        {\n            tail->next = a;\n            a = a->next;\n        }\n        else\n        {\n            tail->next = b;\n            b = b->next;\n        }\n        tail = tail->next;\n    }\n\n    tail->next = (a != nullptr) ? a : b;   // 剩下那条链整段接上\n    return dummy.next;\n}","rs":"// 合并两个有序链表（安全 Rust 版本：读成 Vec 归并后重建）\nfn collect_values(mut cur: Option<&Node>) -> Vec<i32>\n{\n    let mut out = Vec::new();\n\n    while let Some(node) = cur\n    {\n        out.push(node.data);\n        cur = node.next.as_deref();\n    }\n\n    out\n}\n\nfn merge_sorted(a: Option<Box<Node>>, b: Option<Box<Node>>) -> Option<Box<Node>>\n{\n    let va = collect_values(a.as_deref());\n    let vb = collect_values(b.as_deref());\n\n    let mut merged = Vec::new();\n    let mut i = 0;\n    let mut j = 0;\n\n    while i < va.len() && j < vb.len()\n    {\n        if va[i] <= vb[j] { merged.push(va[i]); i += 1; }\n        else              { merged.push(vb[j]); j += 1; }\n    }\n    while i < va.len() { merged.push(va[i]); i += 1; }\n    while j < vb.len() { merged.push(vb[j]); j += 1; }\n\n    let mut head: Option<Box<Node>> = None;\n    for k in (0..merged.len()).rev()\n    {\n        head = Some(Box::new(Node { data: merged[k], next: head }));\n    }\n\n    head\n}"}],"stack":[null,{"c":"/* 用两个栈实现队列：in 负责入队，out 负责出队。\n   只有当 out 为空时，才把 in 里的元素整体\"倒\"过去 —— 均摊 O(1)。\n\n     入队 1,2,3    in: [1,2,3]  out: []\n     出队          out 空 -> 倒过来 in: []  out: [3,2,1]  -> 弹出 1\n     再入队 4      in: [4]      out: [3,2]                 -> 弹出 2\n*/\ntypedef struct\n{\n    Stack in;\n    Stack out;\n} QueueByStacks;\n\nvoid qbsPush(QueueByStacks* q, int value)\n{\n    stackPush(&q->in, value);\n}\n\nint qbsPop(QueueByStacks* q)\n{\n    int value = 0;\n\n    if (q->out.size == 0)                  /* out 非空就别倒，否则顺序会乱 */\n    {\n        while (q->in.size != 0)\n        {\n            stackPop(&q->in, &value);\n            stackPush(&q->out, value);\n        }\n    }\n\n    stackPop(&q->out, &value);\n    return value;\n}","cpp":"// 用两个栈实现队列：in 负责入队，out 负责出队；均摊 O(1)\nclass QueueByStacks\n{\npublic:\n    void push(int value)\n    {\n        in.push(value);\n    }\n\n    int pop()\n    {\n        if (out.empty())            // 只在 out 空的时候倒一次\n        {\n            int value = 0;\n            while (in.peek(value))\n            {\n                in.pop();\n                out.push(value);\n            }\n        }\n\n        int top = 0;\n        out.peek(top);\n        out.pop();\n        return top;\n    }\n\nprivate:\n    Stack in;\n    Stack out;\n};","rs":"// 用两个栈实现队列：in 负责入队，out 负责出队；均摊 O(1)\npub struct QueueByStacks\n{\n    in_stack: Vec<i32>,\n    out_stack: Vec<i32>,\n}\n\nimpl QueueByStacks\n{\n    pub fn new() -> QueueByStacks\n    {\n        QueueByStacks { in_stack: Vec::new(), out_stack: Vec::new() }\n    }\n\n    pub fn push(&mut self, value: i32)\n    {\n        self.in_stack.push(value);\n    }\n\n    pub fn pop(&mut self) -> Option<i32>\n    {\n        if self.out_stack.is_empty()          // 只在 out 空的时候整体倒一次\n        {\n            while let Some(value) = self.in_stack.pop()\n            {\n                self.out_stack.push(value);\n            }\n        }\n\n        self.out_stack.pop()\n    }\n}"},{"c":"/* 最小栈：data 存数据，mins 存\"到当前为止的最小值\"，两个栈必须同步进出。\n   push / pop / min 全是 O(1)，代价是多一倍空间。 */\n#define MS_CAP 100\n\ntypedef struct\n{\n    int data[MS_CAP];\n    int mins[MS_CAP];\n    int size;\n} MinStack;\n\nvoid msInit(MinStack* m)\n{\n    m->size = 0;\n}\n\nvoid msPush(MinStack* m, int value)\n{\n    m->data[m->size] = value;\n\n    if (m->size == 0)\n    {\n        m->mins[m->size] = value;\n    }\n    else if (value < m->mins[m->size - 1])\n    {\n        m->mins[m->size] = value;                  /* 新的最小值 */\n    }\n    else\n    {\n        m->mins[m->size] = m->mins[m->size - 1];   /* 沿用上一轮的最小值 */\n    }\n\n    m->size++;\n}\n\nvoid msPop(MinStack* m)\n{\n    if (m->size > 0)\n    {\n        m->size--;      /* mins 跟着一起退，两个数组必须同步，漏了就全错 */\n    }\n}\n\nint msMin(MinStack* m)\n{\n    return m->mins[m->size - 1];\n}","cpp":"// 最小栈：数据数组 + \"历史最小值\"数组，push / pop / top / min 全是 O(1)\nclass MinStack\n{\npublic:\n    MinStack()\n    {\n        size = 0;\n    }\n\n    void push(int value)\n    {\n        data[size] = value;\n\n        if (size == 0)\n        {\n            mins[size] = value;\n        }\n        else if (value < mins[size - 1])\n        {\n            mins[size] = value;\n        }\n        else\n        {\n            mins[size] = mins[size - 1];\n        }\n\n        size++;\n    }\n\n    void pop()\n    {\n        if (size > 0)\n        {\n            size--;         // 两个数组必须同步\n        }\n    }\n\n    int top()\n    {\n        return data[size - 1];\n    }\n\n    int min()\n    {\n        return mins[size - 1];   // O(1) 取最小值\n    }\n\nprivate:\n    int data[100];\n    int mins[100];\n    int size;\n};","rs":"// 最小栈：mins 里记的是\"到当前为止的最小值\"，两个 Vec 必须同步进出\npub struct MinStack\n{\n    data: Vec<i32>,\n    mins: Vec<i32>,\n}\n\nimpl MinStack\n{\n    pub fn new() -> MinStack\n    {\n        MinStack { data: Vec::new(), mins: Vec::new() }\n    }\n\n    pub fn push(&mut self, value: i32)\n    {\n        let cur_min = match self.mins.last()\n        {\n            Some(&m) if m < value => m,     // 上一轮的最小值更小，就沿用\n            _ => value,                     // 否则新的最小值就是自己\n        };\n\n        self.data.push(value);\n        self.mins.push(cur_min);\n    }\n\n    pub fn pop(&mut self) -> Option<i32>\n    {\n        self.mins.pop();                    // 两个 Vec 必须同步\n        self.data.pop()\n    }\n\n    pub fn min(&self) -> Option<i32>\n    {\n        self.mins.last().copied()\n    }\n}"}],"queue":[null,{"c":"/* 用两个队列实现栈：每次 pop 时把 q[cur] 的前 n-1 个元素搬到另一个队列，\n   剩下的那一个就是栈顶；然后用 1-cur 这个下标技巧 O(1) 交换两个队列的角色。 */\ntypedef struct\n{\n    Queue q[2];\n    int cur;               /* 当前\"装数据\"的那个队列 */\n} StackByQueues;\n\nvoid sbqInit(StackByQueues* s, int cap)\n{\n    queueInit(&s->q[0], cap);\n    queueInit(&s->q[1], cap);\n    s->cur = 0;\n}\n\nvoid sbqPush(StackByQueues* s, int value)\n{\n    queueEnqueue(&s->q[s->cur], value);\n}\n\nint sbqPop(StackByQueues* s)\n{\n    int other = 1 - s->cur;\n\n    while (queueSize(&s->q[s->cur]) > 1)      /* 倒走 n-1 个 */\n    {\n        queueEnqueue(&s->q[other], queueDequeue(&s->q[s->cur]));\n    }\n\n    int top = queueDequeue(&s->q[s->cur]);\n    s->cur = other;                           /* O(1) 交换角色 */\n    return top;\n}","cpp":"// 用两个队列实现栈：push O(1)，pop O(n)\nclass StackByQueues\n{\npublic:\n    StackByQueues()\n    {\n        cur = 0;\n    }\n\n    void push(int value)\n    {\n        q[cur].enqueue(value);\n    }\n\n    int pop()\n    {\n        int other = 1 - cur;\n\n        while (q[cur].getSize() > 1)          // 倒走 n-1 个\n        {\n            int value = q[cur].dequeue();\n            q[other].enqueue(value);\n        }\n\n        int top = q[cur].dequeue();\n        cur = other;                          // O(1) 交换角色\n        return top;\n    }\n\nprivate:\n    Queue q[2];\n    int cur;\n};","rs":"// 用两个队列实现栈：push O(1)，pop O(n)\npub struct StackByQueues\n{\n    q: [Vec<i32>; 2],\n    cur: usize,\n}\n\nimpl StackByQueues\n{\n    pub fn new() -> StackByQueues\n    {\n        StackByQueues { q: [Vec::new(), Vec::new()], cur: 0 }\n    }\n\n    pub fn push(&mut self, value: i32)\n    {\n        self.q[self.cur].push(value);\n    }\n\n    pub fn pop(&mut self) -> Option<i32>\n    {\n        let other = 1 - self.cur;\n\n        while self.q[self.cur].len() > 1       // 倒走 n-1 个\n        {\n            let value = self.q[self.cur].remove(0);\n            self.q[other].push(value);\n        }\n\n        let top = self.q[self.cur].pop();\n        self.cur = other;                      // O(1) 交换角色\n        top\n    }\n}"},{"c":"/* 不牺牲格子的环形队列：多维护一个 size 字段来区分空和满，\n   容量就能 100% 用上。代价是多存一个计数器。 */\nbool rqFull(RingQueue* q)\n{\n    return q->size == q->capacity;\n}\n\nbool rqEmpty(RingQueue* q)\n{\n    return q->size == 0;\n}\n\nbool rqEnqueue(RingQueue* q, int value)\n{\n    if (rqFull(q))\n    {\n        return false;\n    }\n\n    q->data[q->tail] = value;\n    q->tail = (q->tail + 1) % q->capacity;\n    q->size++;\n    return true;\n}\n\nbool rqDequeue(RingQueue* q, int* out)\n{\n    if (rqEmpty(q))\n    {\n        return false;\n    }\n\n    *out = q->data[q->head];\n    q->head = (q->head + 1) % q->capacity;\n    q->size--;\n    return true;\n}","cpp":"// 用 size 字段区分空/满的环形队列：容量 100% 可用，不用牺牲格子\nclass RingQueue\n{\npublic:\n    RingQueue(int cap)\n    {\n        capacity = cap;\n        data = new int[capacity];\n        head = 0;\n        tail = 0;\n        count = 0;\n    }\n\n    ~RingQueue()\n    {\n        delete[] data;\n    }\n\n    bool full()\n    {\n        return count == capacity;\n    }\n\n    bool empty()\n    {\n        return count == 0;\n    }\n\n    bool enqueue(int value)\n    {\n        if (full())\n        {\n            return false;\n        }\n\n        data[tail] = value;\n        tail = (tail + 1) % capacity;\n        count++;\n        return true;\n    }\n\n    bool dequeue(int& out)\n    {\n        if (empty())\n        {\n            return false;\n        }\n\n        out = data[head];\n        head = (head + 1) % capacity;\n        count--;\n        return true;\n    }\n\nprivate:\n    int* data;\n    int capacity;\n    int head;\n    int tail;\n    int count;\n};","rs":"// 用 size 字段区分空/满的环形队列：容量 100% 可用\npub struct RingQueue\n{\n    data: Vec<Option<i32>>,\n    head: usize,\n    tail: usize,\n    count: usize,\n}\n\nimpl RingQueue\n{\n    pub fn new(capacity: usize) -> RingQueue\n    {\n        let mut data = Vec::new();\n        for _ in 0..capacity\n        {\n            data.push(None);\n        }\n\n        RingQueue { data, head: 0, tail: 0, count: 0 }\n    }\n\n    pub fn full(&self) -> bool\n    {\n        self.count == self.data.len()\n    }\n\n    pub fn empty(&self) -> bool\n    {\n        self.count == 0\n    }\n\n    pub fn enqueue(&mut self, value: i32) -> bool\n    {\n        if self.full()\n        {\n            return false;\n        }\n\n        self.data[self.tail] = Some(value);\n        self.tail = (self.tail + 1) % self.data.len();\n        self.count += 1;\n        true\n    }\n\n    pub fn dequeue(&mut self) -> Option<i32>\n    {\n        if self.empty()\n        {\n            return None;\n        }\n\n        let value = self.data[self.head];\n        self.data[self.head] = None;\n        self.head = (self.head + 1) % self.data.len();\n        self.count -= 1;\n        value\n    }\n}"}],"hash":[null,{"c":"/* FNV-1a 字符串哈希：三行就能把一个字符串压成一个 32 位整数，\n   而且分布挺均匀，是真实工程里常用的哈希函数。 */\nunsigned int hashStr(const char* text)\n{\n    unsigned int h = 2166136261u;          /* FNV 的固定起点 */\n\n    for (int i = 0; text[i] != '\\0'; i++)\n    {\n        h = h ^ (unsigned char)text[i];    /* 1. 先异或一个字节 */\n        h = h * 16777619u;                 /* 2. 再乘 FNV 质数 */\n    }\n\n    return h;\n}\n\n/* 桶下标 = hash % 桶数。注意要用无符号数，不然取模可能得到负数 */\nint bucketOf(const char* text, int bucketCount)\n{\n    return (int)(hashStr(text) % (unsigned int)bucketCount);\n}","cpp":"// FNV-1a 字符串哈希：实现极简，分布均匀\nunsigned int hashStr(const char* text)\n{\n    unsigned int h = 2166136261u;          // FNV 的固定起点\n\n    for (int i = 0; text[i] != '\\0'; i++)\n    {\n        h = h ^ (unsigned char)text[i];    // 1. 先异或一个字节\n        h = h * 16777619u;                 // 2. 再乘 FNV 质数\n    }\n\n    return h;\n}\n\n// 算桶下标。用无符号数取模，省得去处理负数\nint bucketOf(const char* text, int bucketCount)\n{\n    return (int)(hashStr(text) % (unsigned int)bucketCount);\n}","rs":"// FNV-1a 字符串哈希：实现极简，分布均匀\nfn hash_str(text: &str) -> u32\n{\n    let mut h: u32 = 2_166_136_261;        // FNV 的固定起点\n\n    for b in text.as_bytes()\n    {\n        h = h ^ (*b as u32);               // 1. 先异或一个字节\n        h = h.wrapping_mul(16_777_619);    // 2. 再乘 FNV 质数\n        // 必须用 wrapping_mul：Rust 的整数乘法溢出在 debug 下会直接 panic\n    }\n\n    h\n}\n\nfn bucket_of(text: &str, bucket_count: usize) -> usize\n{\n    hash_str(text) as usize % bucket_count\n}"}],"bst":[null,{"c":"/* 判断一棵树是不是 BST：不能只比较\"父子\"，必须给每个节点带上一个区间。\n   反例 [10,5,15,3,12]：12 是 5 的右孩子（12 > 5 通过），但 12 < 10，所以不是 BST。 */\nbool bstIsValid(BSTNode* node, int low, int high)\n{\n    if (node == NULL)\n    {\n        return true;\n    }\n\n    if (node->data <= low || node->data >= high)\n    {\n        return false;                 /* 跑到祖先给的区间外面去了 */\n    }\n\n    return bstIsValid(node->left, low, node->data)        /* 左孩子的上限是自己 */\n        && bstIsValid(node->right, node->data, high);     /* 右孩子的下限是自己 */\n}\n\n/* 调用：bstIsValid(root, INT_MIN, INT_MAX)，需要 #include <limits.h> */","cpp":"// 给 BST 再加一个成员函数（类里补一行：bool isValid(Node* node, int low, int high);）\nbool BST::isValid(Node* node, int low, int high)\n{\n    if (node == nullptr)\n    {\n        return true;\n    }\n\n    if (node->data <= low || node->data >= high)\n    {\n        return false;\n    }\n\n    return isValid(node->left, low, node->data)\n        && isValid(node->right, node->data, high);\n}\n\n// 调用：isValid(root, INT_MIN, INT_MAX)","rs":"// 用 i64 当边界，就不会被 i32 的极值卡住\nfn is_valid(node: &Option<Box<Node>>, low: i64, high: i64) -> bool\n{\n    let n = match node\n    {\n        Some(n) => n,\n        None => return true,\n    };\n\n    let v = n.data as i64;\n    if v <= low || v >= high\n    {\n        return false;\n    }\n\n    is_valid(&n.left, low, v) && is_valid(&n.right, v, high)\n}\n\n// 调用：is_valid(&root, i64::MIN, i64::MAX)"},{"c":"/* 有序数组 -> 高度最小的 BST：每次取中间元素做根，左右两半递归。\n   取中点能保证左右子树节点数尽量相等，树高就是 O(log n)。 */\nBSTNode* bstFromSorted(int arr[], int lo, int hi)\n{\n    if (lo > hi)\n    {\n        return NULL;                       /* 空区间 -> 空子树 */\n    }\n\n    int mid = lo + (hi - lo) / 2;          /* 这样写不会溢出 */\n\n    BSTNode* node = bstNodeNew(arr[mid]);\n    node->left = bstFromSorted(arr, lo, mid - 1);\n    node->right = bstFromSorted(arr, mid + 1, hi);\n\n    return node;\n}","cpp":"// 给 BST 再加一个成员函数\nBST::Node* BST::buildFromSorted(int arr[], int lo, int hi)\n{\n    if (lo > hi)\n    {\n        return nullptr;                    // 空区间 -> 空子树\n    }\n\n    int mid = lo + (hi - lo) / 2;          // 取中间，左右子树节点数才尽量相等\n\n    Node* node = new Node;\n    node->data = arr[mid];\n    node->left = buildFromSorted(arr, lo, mid - 1);\n    node->right = buildFromSorted(arr, mid + 1, hi);\n\n    return node;\n}","rs":"// 有序切片 -> 高度最小的 BST\nfn sorted_to_bst(values: &[i32]) -> Option<Box<Node>>\n{\n    if values.is_empty()\n    {\n        return None;                       // 空区间 -> 空子树\n    }\n\n    let mid = values.len() / 2;            // 取中间做根\n\n    Some(Box::new(Node {\n        data: values[mid],\n        left: sorted_to_bst(&values[..mid]),\n        right: sorted_to_bst(&values[mid + 1..]),\n    }))\n}"}],"heap":[null,{"c":"/* 数据流中位数：小的一半放 lo，大的一半放 hi，两边数量差不超过 1。\n   大顶堆偷个懒 —— 用\"存负数的小顶堆\"来实现，这样只要写一份堆的代码。 */\ntypedef struct\n{\n    MinHeap lo;        /* 实际是大顶堆（里面存的是相反数） */\n    MinHeap hi;        /* 小顶堆 */\n    int loCount;\n    int hiCount;\n} MedianFinder;\n\nvoid mfInit(MedianFinder* m)\n{\n    heapInit(&m->lo);\n    heapInit(&m->hi);\n    m->loCount = 0;\n    m->hiCount = 0;\n}\n\nvoid mfAdd(MedianFinder* m, int value)\n{\n    heapPush(&m->lo, -value);                 /* 1. 先无脑塞进 lo */\n    m->loCount++;\n\n    heapPush(&m->hi, -heapPop(&m->lo));       /* 2. lo 里最大的挪给 hi */\n    m->loCount--;\n    m->hiCount++;\n\n    if (m->hiCount > m->loCount)              /* 3. 平衡两边 */\n    {\n        heapPush(&m->lo, -heapPop(&m->hi));\n        m->hiCount--;\n        m->loCount++;\n    }\n}\n\ndouble mfMedian(MedianFinder* m)\n{\n    if (m->loCount > m->hiCount)\n    {\n        return -heapTop(&m->lo);              /* lo 存的是负数，取回来要变号 */\n    }\n\n    return (heapTop(&m->hi) - heapTop(&m->lo)) / 2.0;\n}","cpp":"// 数据流中位数：小的一半放 lo，大的一半放 hi\nclass MedianFinder\n{\npublic:\n    MedianFinder()\n    {\n        loCount = 0;\n        hiCount = 0;\n    }\n\n    void addNum(int value)\n    {\n        lo.push(-value);                   // 1. 先无脑塞进 lo（存的是相反数）\n        loCount++;\n\n        int biggest = lo.pop();            // 2. lo 里最大的挪给 hi\n        loCount--;\n        hi.push(-biggest);\n        hiCount++;\n\n        if (hiCount > loCount)             // 3. 两边数量差不超过 1\n        {\n            lo.push(-hi.pop());\n            hiCount--;\n            loCount++;\n        }\n    }\n\n    double findMedian()\n    {\n        int topLo = 0;\n        int topHi = 0;\n        lo.top(topLo);\n        hi.top(topHi);\n\n        if (loCount > hiCount)\n        {\n            return -topLo;                 // lo 存的是负数，取回来要变号\n        }\n\n        return (topHi - topLo) / 2.0;\n    }\n\nprivate:\n    MinHeap lo;        // 实际是大顶堆\n    MinHeap hi;        // 小顶堆\n    int loCount;\n    int hiCount;\n};","rs":"// 数据流中位数：小的一半放 lo，大的一半放 hi\npub struct MedianFinder\n{\n    lo: MinHeap,       // 实际是大顶堆（存的是相反数）\n    hi: MinHeap,       // 小顶堆\n}\n\nimpl MedianFinder\n{\n    pub fn new() -> MedianFinder\n    {\n        MedianFinder { lo: MinHeap::new(), hi: MinHeap::new() }\n    }\n\n    pub fn add_num(&mut self, value: i32)\n    {\n        self.lo.push(-value);                     // 1. 先无脑塞进 lo\n\n        if let Some(biggest) = self.lo.pop()      // 2. lo 里最大的挪给 hi\n        {\n            self.hi.push(-biggest);\n        }\n\n        if self.hi.len() > self.lo.len()          // 3. 平衡两边\n        {\n            if let Some(smallest) = self.hi.pop()\n            {\n                self.lo.push(-smallest);\n            }\n        }\n    }\n\n    pub fn find_median(&self) -> f64\n    {\n        let top_lo = match self.lo.top() { Some(v) => -v, None => 0 };\n        let top_hi = match self.hi.top() { Some(v) => v, None => 0 };\n\n        if self.lo.len() > self.hi.len()\n        {\n            return top_lo as f64;\n        }\n\n        (top_lo + top_hi) as f64 / 2.0\n    }\n}"},{"c":"/* 原地堆排序（大顶堆）：先把数组整理成大顶堆，再反复把堆顶换到末尾。\n   时间 O(n log n)，额外空间 O(1)。 */\nstatic void siftDownMax(int arr[], int n, int i)\n{\n    while (true)\n    {\n        int left = 2 * i + 1;\n        int right = 2 * i + 2;\n        int biggest = i;\n\n        if (left < n && arr[left] > arr[biggest])   biggest = left;\n        if (right < n && arr[right] > arr[biggest]) biggest = right;\n        if (biggest == i) break;                    /* 比两个孩子都大，到位了 */\n\n        int temp = arr[i];\n        arr[i] = arr[biggest];\n        arr[biggest] = temp;\n        i = biggest;\n    }\n}\n\nvoid heapSort(int arr[], int n)\n{\n    for (int i = n / 2 - 1; i >= 0; i--)      /* 1. 自底向上建大顶堆，O(n) */\n    {\n        siftDownMax(arr, n, i);\n    }\n\n    for (int end = n - 1; end > 0; end--)     /* 2. 每轮把最大值换到末尾 */\n    {\n        int temp = arr[0];\n        arr[0] = arr[end];\n        arr[end] = temp;\n\n        siftDownMax(arr, end, 0);\n    }\n}","cpp":"// 原地堆排序（大顶堆）：建堆 O(n) + 反复取堆顶 O(n log n)\nvoid siftDownMax(int arr[], int n, int i)\n{\n    while (true)\n    {\n        int left = 2 * i + 1;\n        int right = 2 * i + 2;\n        int biggest = i;\n\n        if (left < n && arr[left] > arr[biggest])   biggest = left;\n        if (right < n && arr[right] > arr[biggest]) biggest = right;\n        if (biggest == i) break;\n\n        int temp = arr[i];\n        arr[i] = arr[biggest];\n        arr[biggest] = temp;\n        i = biggest;\n    }\n}\n\nvoid heapSort(int arr[], int n)\n{\n    for (int i = n / 2 - 1; i >= 0; i--)       // 1. 自底向上建大顶堆\n    {\n        siftDownMax(arr, n, i);\n    }\n\n    for (int end = n - 1; end > 0; end--)      // 2. 堆顶换到末尾，再修复堆\n    {\n        int temp = arr[0];\n        arr[0] = arr[end];\n        arr[end] = temp;\n\n        siftDownMax(arr, end, 0);\n    }\n}","rs":"// 原地堆排序（大顶堆）：建堆 O(n) + 反复取堆顶 O(n log n)\nfn sift_down_max(arr: &mut [i32], n: usize, mut i: usize)\n{\n    loop\n    {\n        let left = 2 * i + 1;\n        let right = 2 * i + 2;\n        let mut biggest = i;\n\n        if left < n && arr[left] > arr[biggest] { biggest = left; }\n        if right < n && arr[right] > arr[biggest] { biggest = right; }\n        if biggest == i { break; }\n\n        arr.swap(i, biggest);\n        i = biggest;\n    }\n}\n\nfn heap_sort(arr: &mut [i32])\n{\n    let n = arr.len();\n    if n < 2\n    {\n        return;\n    }\n\n    let mut i = n / 2;                  // 1. 自底向上建大顶堆\n    while i > 0\n    {\n        i -= 1;\n        sift_down_max(arr, n, i);\n    }\n\n    let mut end = n - 1;                // 2. 每轮把最大值换到末尾\n    while end > 0\n    {\n        arr.swap(0, end);\n        sift_down_max(arr, end, 0);\n        end -= 1;\n    }\n}"}],"graph":[null,{"c":"/* 从 start 出发，求\"到每个顶点的最短边数\"。\n   关键：BFS 第一次到达某个顶点时，走的一定是最短路 ——\n   因为队列保证了\"距离小的先被处理\"。dist[i] = -1 表示走不到。 */\nvoid graphBfsDist(Graph* g, int start, int dist[])\n{\n    for (int i = 0; i < g->vertexCount; i++)\n    {\n        dist[i] = -1;\n    }\n    dist[start] = 0;\n\n    int* queue = (int*)malloc(sizeof(int) * g->vertexCount);\n    int head = 0;\n    int tail = 0;\n\n    queue[tail] = start;\n    tail++;\n\n    while (head < tail)\n    {\n        int v = queue[head];\n        head++;\n\n        for (Edge* e = g->adj[v]; e != NULL; e = e->next)\n        {\n            if (dist[e->to] == -1)          /* 第一次到达 = 最短路 */\n            {\n                dist[e->to] = dist[v] + 1;\n                queue[tail] = e->to;\n                tail++;\n            }\n        }\n    }\n\n    free(queue);\n}","cpp":"// 从 start 出发求到每个顶点的最短边数（无权图最短路）\nvoid Graph::bfsDistance(int start, int dist[])\n{\n    for (int i = 0; i < vertexCount; i++)\n    {\n        dist[i] = -1;                  // -1 表示还没走到\n    }\n    dist[start] = 0;\n\n    int* queue = new int[vertexCount];\n    int head = 0;\n    int tail = 0;\n\n    queue[tail] = start;\n    tail++;\n\n    while (head < tail)\n    {\n        int v = queue[head];\n        head++;\n\n        for (Edge* e = adj[v]; e != nullptr; e = e->next)\n        {\n            if (dist[e->to] == -1)     // 第一次到达，走的就是最短路\n            {\n                dist[e->to] = dist[v] + 1;\n                queue[tail] = e->to;\n                tail++;\n            }\n        }\n    }\n\n    delete[] queue;\n}","rs":"// 从 start 出发求到每个顶点的最短边数\nfn bfs_distance(adj: &Vec<Vec<usize>>, start: usize) -> Vec<i32>\n{\n    let mut dist = vec![-1; adj.len()];    // -1 表示还没走到\n    dist[start] = 0;\n\n    let mut queue: Vec<usize> = Vec::new();\n    let mut head = 0;\n\n    queue.push(start);\n\n    while head < queue.len()\n    {\n        let v = queue[head];\n        head += 1;\n\n        for &nb in &adj[v]\n        {\n            if dist[nb] == -1              // 第一次到达，走的就是最短路\n            {\n                dist[nb] = dist[v] + 1;\n                queue.push(nb);\n            }\n        }\n    }\n\n    dist\n}"},{"c":"/* 统计无向图有几个连通分量：\n   外层扫每个顶点，遇到没访问过的就启动一次 DFS，计数器加一。\n   一次 DFS 会把整个连通块吃掉。 */\nint graphCountComponents(Graph* g)\n{\n    bool* visited = (bool*)calloc(g->vertexCount, sizeof(bool));\n    int count = 0;\n\n    for (int v = 0; v < g->vertexCount; v++)\n    {\n        if (!visited[v])                 /* 遇到一个还没访问过的顶点 */\n        {\n            count++;\n            graphDfsVisit(g, v, visited);   /* 一次 DFS 吞掉整个连通块 */\n        }\n    }\n\n    free(visited);\n    return count;\n}","cpp":"// 统计无向图的连通分量个数（\"岛屿数量\"的抽象版）\nint Graph::countComponents()\n{\n    bool* visited = new bool[vertexCount];\n\n    for (int i = 0; i < vertexCount; i++)\n    {\n        visited[i] = false;\n    }\n\n    int count = 0;\n\n    for (int v = 0; v < vertexCount; v++)\n    {\n        if (!visited[v])              // 遇到一个还没访问过的顶点\n        {\n            count++;\n            dfsVisit(v, visited);     // 一次 DFS 吞掉整个连通块\n        }\n    }\n\n    delete[] visited;\n    return count;\n}","rs":"// 统计无向图的连通分量个数（用栈做迭代 DFS，避免递归太深）\nfn count_components(adj: &Vec<Vec<usize>>) -> usize\n{\n    let mut visited = vec![false; adj.len()];\n    let mut count = 0;\n\n    for start in 0..adj.len()\n    {\n        if visited[start]\n        {\n            continue;\n        }\n\n        count += 1;                       // 发现一个新的连通块\n\n        let mut stack: Vec<usize> = Vec::new();\n        stack.push(start);\n\n        while let Some(v) = stack.pop()\n        {\n            if visited[v]\n            {\n                continue;\n            }\n            visited[v] = true;\n\n            for &nb in &adj[v]\n            {\n                if !visited[nb]\n                {\n                    stack.push(nb);\n                }\n            }\n        }\n    }\n\n    count\n}"},{"c":"/* 课程表：判断一堆\"先修关系\"能不能全部修完。\n   等价于判断有向图有没有环 —— 用拓扑排序，排不完就说明有环。\n   这里用邻接矩阵 + 入度数组，只要 20 行，慢一点但好懂。 */\nbool canFinish(int numCourses, int prereq[][2], int n)\n{\n    bool graph[100][100] = { false };      /* graph[b][a] = true 表示先修 b 再修 a */\n    int indegree[100] = { 0 };\n\n    for (int i = 0; i < n; i++)\n    {\n        int a = prereq[i][0];\n        int b = prereq[i][1];\n        graph[b][a] = true;\n        indegree[a]++;\n    }\n\n    int learned = 0;\n\n    for (int round = 0; round < numCourses; round++)\n    {\n        for (int v = 0; v < numCourses; v++)\n        {\n            if (indegree[v] == 0)          /* 入度为 0 就能先修 */\n            {\n                indegree[v] = -1;          /* 标记成\"已经修了\" */\n                learned++;\n\n                for (int w = 0; w < numCourses; w++)\n                {\n                    if (graph[v][w])\n                    {\n                        indegree[w]--;\n                    }\n                }\n\n                break;                     /* 一轮修一门，简单优先 */\n            }\n        }\n    }\n\n    return learned == numCourses;          /* 排不完 -> 有环 */\n}","cpp":"// 课程表：判断有向图有没有环（拓扑排序）\nbool canFinish(int numCourses, bool graph[100][100])\n{\n    int indegree[100] = { 0 };\n\n    for (int v = 0; v < numCourses; v++)\n    {\n        for (int w = 0; w < numCourses; w++)\n        {\n            if (graph[v][w])               // v -> w\n            {\n                indegree[w]++;\n            }\n        }\n    }\n\n    int learned = 0;\n\n    for (int round = 0; round < numCourses; round++)\n    {\n        for (int v = 0; v < numCourses; v++)\n        {\n            if (indegree[v] == 0)          // 入度为 0 就能先修\n            {\n                indegree[v] = -1;          // 标记成\"已经修了\"\n                learned++;\n\n                for (int w = 0; w < numCourses; w++)\n                {\n                    if (graph[v][w])\n                    {\n                        indegree[w]--;\n                    }\n                }\n\n                break;\n            }\n        }\n    }\n\n    return learned == numCourses;          // 排不完 -> 有环\n}","rs":"// 课程表：判断有向图有没有环（拓扑排序）\nfn can_finish(num_courses: usize, prereq: &[(usize, usize)]) -> bool\n{\n    let mut graph = vec![vec![false; num_courses]; num_courses];   // graph[b][a] 表示 b -> a\n    let mut indegree = vec![0i32; num_courses];\n\n    for &(a, b) in prereq\n    {\n        graph[b][a] = true;\n        indegree[a] += 1;\n    }\n\n    let mut learned = 0;\n\n    for _ in 0..num_courses\n    {\n        for v in 0..num_courses\n        {\n            if indegree[v] == 0                // 入度为 0 就能先修\n            {\n                indegree[v] = -1;              // 标记成\"已经修了\"\n                learned += 1;\n\n                for w in 0..num_courses\n                {\n                    if graph[v][w]\n                    {\n                        indegree[w] -= 1;\n                    }\n                }\n\n                break;\n            }\n        }\n    }\n\n    learned == num_courses                     // 排不完 -> 有环\n}"}],"sort":[null,{"c":"/* 归并排序求逆序对：在合并的时候顺手统计。\n   关键：如果这一步取的是右半边的元素，说明左半边剩下的**每一个**都比它大，\n   一次就能加上好几个逆序对。总复杂度 O(n log n)。 */\nlong long mergeCount(int arr[], int temp[], int lo, int mid, int hi)\n{\n    int i = lo;\n    int j = mid + 1;\n    int k = lo;\n    long long count = 0;\n\n    while (i <= mid && j <= hi)\n    {\n        if (arr[i] <= arr[j])\n        {\n            temp[k] = arr[i];\n            i++;\n        }\n        else\n        {\n            temp[k] = arr[j];\n            j++;\n            count += (mid - i + 1);      /* 左半边剩下的这么多都比它大 */\n        }\n        k++;\n    }\n\n    while (i <= mid) { temp[k] = arr[i]; i++; k++; }\n    while (j <= hi)  { temp[k] = arr[j]; j++; k++; }\n\n    for (int t = lo; t <= hi; t++)\n    {\n        arr[t] = temp[t];\n    }\n\n    return count;\n}\n\nlong long countInversions(int arr[], int temp[], int lo, int hi)\n{\n    if (lo >= hi)\n    {\n        return 0;\n    }\n\n    int mid = lo + (hi - lo) / 2;\n\n    long long count = countInversions(arr, temp, lo, mid);\n    count += countInversions(arr, temp, mid + 1, hi);\n    count += mergeCount(arr, temp, lo, mid, hi);\n\n    return count;\n}","cpp":"// 归并排序求逆序对：合并时若取右半边的元素，\n// 说明左半边剩下的每一个都比它大，一次就能加上好几个逆序对\nlong long mergeCount(int arr[], int temp[], int lo, int mid, int hi)\n{\n    int i = lo;\n    int j = mid + 1;\n    int k = lo;\n    long long count = 0;\n\n    while (i <= mid && j <= hi)\n    {\n        if (arr[i] <= arr[j])\n        {\n            temp[k] = arr[i];\n            i++;\n        }\n        else\n        {\n            temp[k] = arr[j];\n            j++;\n            count += (mid - i + 1);\n        }\n        k++;\n    }\n\n    while (i <= mid) { temp[k] = arr[i]; i++; k++; }\n    while (j <= hi)  { temp[k] = arr[j]; j++; k++; }\n\n    for (int t = lo; t <= hi; t++)\n    {\n        arr[t] = temp[t];\n    }\n\n    return count;\n}\n\nlong long countInversions(int arr[], int temp[], int lo, int hi)\n{\n    if (lo >= hi)\n    {\n        return 0;\n    }\n\n    int mid = lo + (hi - lo) / 2;\n\n    long long count = countInversions(arr, temp, lo, mid);\n    count += countInversions(arr, temp, mid + 1, hi);\n    count += mergeCount(arr, temp, lo, mid, hi);\n\n    return count;\n}","rs":"// 归并排序求逆序对：O(n log n)，比双层循环的 O(n^2) 快得多\nfn count_inversions(arr: &mut [i32]) -> usize\n{\n    let n = arr.len();\n    if n < 2\n    {\n        return 0;\n    }\n\n    let mid = n / 2;\n    let mut count = count_inversions(&mut arr[..mid]) + count_inversions(&mut arr[mid..]);\n\n    let (left, right) = arr.split_at(mid);\n    let mut merged = Vec::new();\n    let mut i = 0;\n    let mut j = 0;\n\n    while i < left.len() && j < right.len()\n    {\n        if left[i] <= right[j]\n        {\n            merged.push(left[i]);\n            i += 1;\n        }\n        else\n        {\n            count += left.len() - i;      // 左半边剩下的全都比 right[j] 大\n            merged.push(right[j]);\n            j += 1;\n        }\n    }\n\n    while i < left.len() { merged.push(left[i]); i += 1; }\n    while j < right.len() { merged.push(right[j]); j += 1; }\n\n    arr.copy_from_slice(&merged);\n    count\n}"},{"c":"/* 快速排序的核心：Lomuto 分区。\n   i 指向\"小于区\"的下一个空位，j 从左往右扫；\n   j 遇到比基准小的就和 i 交换。最后把基准换到 i 的位置。 */\nint partition(int arr[], int lo, int hi)\n{\n    int pivot = arr[hi];               /* 取末尾元素当基准 */\n    int i = lo;\n\n    for (int j = lo; j < hi; j++)      /* 注意是 j < hi，arr[hi] 是基准本身 */\n    {\n        if (arr[j] < pivot)\n        {\n            int temp = arr[i];\n            arr[i] = arr[j];\n            arr[j] = temp;\n            i++;\n        }\n    }\n\n    int temp = arr[i];                 /* 基准归位，这一步最容易忘 */\n    arr[i] = arr[hi];\n    arr[hi] = temp;\n\n    return i;                          /* 返回基准的最终下标 */\n}\n\nvoid quickSort(int arr[], int lo, int hi)\n{\n    if (lo >= hi)\n    {\n        return;\n    }\n\n    int p = partition(arr, lo, hi);\n    quickSort(arr, lo, p - 1);         /* 注意是 p-1 */\n    quickSort(arr, p + 1, hi);         /* 和 p+1，写成 p 会死循环 */\n}","cpp":"// 快速排序的核心：Lomuto 分区\nint partition(int arr[], int lo, int hi)\n{\n    int pivot = arr[hi];               // 取末尾元素当基准\n    int i = lo;   const raw = SRC_DATA[topic];

  raw.split('\n').forEach(function (line) {
    const t = line.trim();
    if (!t || t.charAt(0) === '#') return;
    const item = t.match(/^(?:[-*]|\d+[.、)])\s*(.*)$/);
    if (item) {
      let text = item[1].trim();
      let url = '';
      const m = text.match(/^(.*)[：:]\s*(https?:\/\/\S+)$/);
      if (m) { text = m[1]; url = cleanUrl(m[2]); }

    if (urls && urls.length && cur) {
      urls.forEach(function (u) { u = cleanUrl(u); if (u && cur.urls.indexOf(u) < 0) cur.urls.push(u); });
    } else if (cur && !cur.urls.length) {

    return '<li><span class="src-t">' + esc(it.text) + '</span>' +
