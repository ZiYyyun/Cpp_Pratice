 fn dfs(&self, start: usize)\n    {\n        let mut visited = vec![false; self.vertex_count];\n\n        print!(\"DFS: \");\n        self.dfs_visit(start, &mut visited);\n        println!();\n    }\n\n    pub fn count_components(&self) -> usize\n    {\n        let mut visited = vec![false; self.vertex_count];\n        let mut count = 0;\n\n        for v in 0..self.vertex_count\n        {\n            if !visited[v]                        // 遇到没访问过的顶点，就是一个新连通块\n            {\n                count += 1;\n                self.dfs_visit(v, &mut visited);  // 一次 DFS 把整个连通块吃掉\n            }\n        }\n\n        count\n    }\n\n    pub fn print(&self)\n    {\n        println!(\"顶点数 = {}\", self.vertex_count);\n\n        for i in 0..self.vertex_count\n        {\n            println!(\"  {}: {:?}\", i, self.adj[i]);\n        }\n    }\n}"},{"title":"main：跑一遍","note":"造一张不连通的图，看 BFS / DFS 的顺序和连通分量个数","code":"fn main()\n{\n    let mut g = Graph::new(8);\n\n    // 0~5 构成一个连通块，6 和 7 单独连成一小块，所以一共 2 个连通分量\n    g.add_edge(0, 1);\n    g.add_edge(0, 2);\n    g.add_edge(1, 3);\n    g.add_edge(2, 3);\n    g.add_edge(2, 4);\n    g.add_edge(3, 5);\n    g.add_edge(4, 5);\n    g.add_edge(6, 7);\n\n    g.print();\n    g.bfs(0);\n    g.dfs(0);\n    g.bfs(6);                       // 从 6 出发只能走到 7\n\n    println!(\"连通分量个数 = {}\", g.count_components());\n}"}]}},"search":{"c":{"file":"search.c","steps":[{"title":"顺序查找（带哨兵）","note":"把 key 放到 a[0]，从后往前比，省掉越界判断","code":"#include <stdio.h>\n#include <stdlib.h>\n#include <stdbool.h>\n#include <string.h>\n\nint sequentialSearch(int a[], int n, int key)\n{\n    int i = n;\n    a[0] = key;                    // 0 号位当哨兵，不存真数据\n    while (a[i] != key)\n    {\n        i--;                       // 哨兵一定拦得住，不用写 i >= 1\n    }\n    return i;                      // 返回 0 表示没找到\n}"},{"title":"折半查找","note":"每比较一次就丢掉一半区间，所以只要 log2(n) 次","code":"int binarySearch(int a[], int n, int key)\n{\n    int low = 0;\n    int high = n - 1;\n    while (low <= high)\n    {\n        int mid = (low + high) / 2;\n        if (a[mid] == key)\n        {\n            return mid;\n        }\n        if (a[mid] < key)\n        {\n            low = mid + 1;         // key 在右半边\n        }\n        else\n        {\n            high = mid - 1;        // key 在左半边\n        }\n    }\n    return -1;\n}"},{"title":"折半查找的判定树与 ASL","note":"比较次数就是节点在判定树上的层数","code":"int binaryCompare(int a[], int n, int key)\n{\n    int low = 0;\n    int high = n - 1;\n    int compare = 0;\n    while (low <= high)\n    {\n        int mid = (low + high) / 2;\n        compare++;\n        if (a[mid] == key)\n        {\n            return compare;\n        }\n        if (a[mid] < key)\n        {\n            low = mid + 1;\n        }\n        else\n        {\n            high = mid - 1;\n        }\n    }\n    return compare;\n}\n\nvoid printAsl(int a[], int n)\n{\n    int total = 0;\n    int levelCount[32] = { 0 };\n    for (int i = 0; i < n; i++)\n    {\n        int compare = binaryCompare(a, n, a[i]);\n        printf(\"  %2d 比较 %d 次\\n\", a[i], compare);\n        total += compare;\n        levelCount[compare]++;\n    }\n\n    for (int level = 1; level < 32; level++)\n    {\n        if (levelCount[level] > 0)\n        {\n            printf(\"  判定树第 %d 层: %d 个节点\\n\", level, levelCount[level]);\n        }\n    }\n    printf(\"  ASL = %d / %d = %.3f\\n\", total, n, (double)total / n);\n}"},{"title":"分块查找的索引表","note":"每块记最大关键字、起始下标和块长，块内可以无序","code":"typedef struct\n{\n    int maxKey;\n    int start;\n    int length;\n} IndexItem;\n\nint buildIndex(int a[], int n, int blockSize, IndexItem index[])\n{\n    int count = 0;\n    for (int start = 0; start < n; start += blockSize)\n    {\n        int length = n - start;\n        if (length > blockSize)\n        {\n            length = blockSize;\n        }\n\n        int maxKey = a[start];\n        for (int i = 1; i < length; i++)\n        {\n            if (a[start + i] > maxKey)\n            {\n                maxKey = a[start + i];\n            }\n        }\n\n        index[count].maxKey = maxKey;\n        index[count].start = start;\n        index[count].length = length;\n        count++;\n    }\n    return count;\n}"},{"title":"分块查找的实现","note":"先顺着索引表找到块，再在块内顺序找","code":"int blockSearch(int a[], IndexItem index[], int blockCount, int key)\n{\n    int block = -1;\n    for (int i = 0; i < blockCount; i++)\n    {\n        if (key <= index[i].maxKey)      // 第一个能装下 key 的块\n        {\n            block = i;\n            break;\n        }\n    }\n    if (block == -1)\n    {\n        return -1;                       // 比所有块的最大值都大\n    }\n\n    for (int i = 0; i < index[block].length; i++)\n    {\n        int pos = index[block].start + i;\n        if (a[pos] == key)\n        {\n            return pos;\n        }\n    }\n    return -1;                           // 块里也没有\n}\n\nvoid printIndex(IndexItem index[], int blockCount)\n{\n    for (int i = 0; i < blockCount; i++)\n    {\n        printf(\"  块 %d: maxKey = %2d, start = %2d, length = %d\\n\",\n            i, index[i].maxKey, index[i].start, index[i].length);\n    }\n}"},{"title":"main：跑一遍","note":"先跑顺序和折半，再算 ASL，最后跑分块","code":"int main(void)\n{\n    int table[10] = { 0, 8, 14, 23, 37, 45, 51, 68, 79, 93 };  // 0 号位留给哨兵\n    int sorted[9] = { 8, 14, 23, 37, 45, 51, 68, 79, 93 };\n    int n = 9;\n\n    printf(\"顺序查找（带哨兵）:\\n\");\n    printf(\"  查 45 -> 位置 %d\\n\", sequentialSearch(table, n, 45));\n    printf(\"  查 50 -> 位置 %d（0 表示没找到）\\n\", sequentialSearch(table, n, 50));\n\n    printf(\"折半查找:\\n\");\n    printf(\"  查 45 -> 下标 %d\\n\", binarySearch(sorted, n, 45));\n    printf(\"  查 50 -> 下标 %d（-1 表示没找到）\\n\", binarySearch(sorted, n, 50));\n\n    printf(\"判定树与 ASL:\\n\");\n    printAsl(sorted, n);\n\n    int blocks[18] = { 22, 12, 9, 18, 5, 30,\n                       40, 35, 48, 33, 52, 45,\n                       70, 66, 58, 75, 61, 80 };\n    IndexItem index[8];\n    int blockCount = buildIndex(blocks, 18, 6, index);\n    printf(\"分块查找（18 个元素，每块 6 个）:\\n\");\n    printIndex(index, blockCount);\n    printf(\"  查 45 -> 下标 %d\\n\", blockSearch(blocks, index, blockCount, 45));\n    printf(\"  查 61 -> 下标 %d\\n\", blockSearch(blocks, index, blockCount, 61));\n    printf(\"  查 65 -> 下标 %d（-1 表示没找到）\\n\", blockSearch(blocks, index, blockCount, 65));\n\n    return 0;\n}"}]},"cpp":{"file":"search.cpp","steps":[{"title":"顺序查找（带哨兵）","note":"把 key 放到 a[0]，从后往前比，省掉越界判断","code":"#include <iostream>\n#include <iomanip>\n\nclass Search\n{\npublic:\n    Search(int values[], int count);\n    int sequential(int key);\n    int binary(int key);\n    int binaryCompare(int key);\n    void printAsl();\n\nprivate:\n    int table[32];      // table[0] 当哨兵，真数据在 1..size\n    int data[32];       // 折半查找用，真数据在 0..size-1\n    int size;\n};\n\nSearch::Search(int values[], int count)\n{\n    size = count;\n    table[0] = 0;                    // 哨兵位先占住\n    for (int i = 0; i < size; i++)\n    {\n        table[i + 1] = values[i];\n        data[i] = values[i];\n    }\n}\n\nint Search::sequential(int key)\n{\n    table[0] = key;                  // 借 0 号位当哨兵\n    int i = size;\n    while (table[i] != key)\n    {\n        i--;                         // 不用判断 i >= 1，哨兵会拦住\n    }\n    return i;                        // 返回 0 表示没找到\n}"},{"title":"折半查找","note":"每比较一次就丢掉一半区间，所以只要 log2(n) 次","code":"int Search::binary(int key)\n{\n    int low = 0;\n    int high = size - 1;\n    while (low <= high)\n    {\n        int mid = (low + high) / 2;\n        if (data[mid] == key)\n        {\n            return mid;\n        }\n        if (data[mid] < key)\n        {\n            low = mid + 1;           // key 在右半边\n        }\n        else\n        {\n            high = mid - 1;          // key 在左半边\n        }\n    }\n    return -1;\n}"},{"title":"折半查找的判定树与 ASL","note":"比较次数就是节点在判定树上的层数","code":"int Search::binaryCompare(int key)\n{\n    int low = 0;\n    int high = size - 1;\n    int compare = 0;\n    while (low <= high)\n    {\n        int mid = (low + high) / 2;\n        compare++;\n        if (data[mid] == key)\n        {\n            return compare;\n        }\n        if (data[mid] < key)\n        {\n            low = mid + 1;\n        }\n        else\n        {\n            high = mid - 1;\n        }\n    }\n    return compare;\n}\n\nvoid Search::printAsl()\n{\n    int total = 0;\n    int levelCount[32] = { 0 };\n    for (int i = 0; i < size; i++)\n    {\n        int compare = binaryCompare(data[i]);\n        std::cout << \"  \" << data[i] << \" 比较 \" << compare << \" 次\" << std::endl;\n        total += compare;\n        levelCount[compare]++;\n    }\n    for (int level = 1; level < 32; level++)\n    {\n        if (levelCount[level] > 0)\n        {\n            std::cout << \"  判定树第 \" << level << \" 层: \" << levelCount[level] << \" 个节点\" << std::endl;\n        }\n    }\n    std::cout << \"  ASL = \" << total << \" / \" << size << \" = \"\n        << std::fixed << std::setprecision(3) << (double)total / size << std::endl;\n}"},{"title":"分块查找的索引表","note":"每块记最大关键字、起始下标和块长，块内可以无序","code":"class BlockTable\n{\npublic:\n    BlockTable(int values[], int count, int perBlock);\n    int blockSearch(int key);\n    void printIndex();\n\nprivate:\n    struct IndexItem\n    {\n        int maxKey;\n        int start;\n        int length;\n    };\n\n    int data[32];\n    int size;\n    int blockSize;\n    IndexItem index[8];\n    int blockCount;\n};\n\nBlockTable::BlockTable(int values[], int count, int perBlock)\n{\n    size = count;\n    blockSize = perBlock;\n    for (int i = 0; i < size; i++)\n    {\n        data[i] = values[i];\n    }\n    blockCount = 0;\n    for (int start = 0; start < size; start += blockSize)\n    {\n        int length = size - start;\n        if (length > blockSize)\n        {\n            length = blockSize;\n        }\n        int maxKey = data[start];\n        for (int i = 1; i < length; i++)\n        {\n            if (data[start + i] > maxKey)\n            {\n                maxKey = data[start + i];\n            }\n        }\n        index[blockCount].maxKey = maxKey;\n        index[blockCount].start = start;\n        index[blockCount].length = length;\n        blockCount++;\n    }\n}"},{"title":"分块查找的实现","note":"先顺着索引表找到块，再在块内顺序找","code":"int BlockTable::blockSearch(int key)\n{\n    int block = -1;\n    for (int i = 0; i < blockCount; i++)\n    {\n        if (key <= index[i].maxKey)      // 第一个能装下 key 的块\n        {\n            block = i;\n            break;\n        }\n    }\n    if (block == -1)\n    {\n        return -1;                       // 比所有块的最大值都大\n    }\n    for (int i = 0; i < index[block].length; i++)\n    {\n        int pos = index[block].start + i;\n        if (data[pos] == key)\n        {\n            return pos;\n        }\n    }\n    return -1;                           // 块里也没有\n}\n\nvoid BlockTable::printIndex()\n{\n    for (int i = 0; i < blockCount; i++)\n    {\n        std::cout << \"  块 \" << i << \": maxKey = \" << index[i].maxKey\n            << \", start = \" << index[i].start\n            << \", length = \" << index[i].length << std::endl;\n    }\n}"},{"title":"main：跑一遍","note":"先跑顺序和折半，再算 ASL，最后跑分块","code":"int main()\n{\n    int sorted[9] = { 8, 14, 23, 37, 45, 51, 68, 79, 93 };\n    Search search(sorted, 9);\n    std::cout << \"顺序查找（带哨兵）:\" << std::endl;\n    std::cout << \"  查 45 -> 位置 \" << search.sequential(45) << std::endl;\n    std::cout << \"  查 50 -> 位置 \" << search.sequential(50) << \"（0 表示没找到）\" << std::endl;\n\n    std::cout << \"折半查找:\" << std::endl;\n    std::cout << \"  查 45 -> 下标 \" << search.binary(45) << std::endl;\n    std::cout << \"  查 50 -> 下标 \" << search.binary(50) << \"（-1 表示没找到）\" << std::endl;\n\n    std::cout << \"判定树与 ASL:\" << std::endl;\n    search.printAsl();\n    int blocks[18] = { 22, 12, 9, 18, 5, 30,\n                       40, 35, 48, 33, 52, 45,\n                       70, 66, 58, 75, 61, 80 };\n    BlockTable table(blocks, 18, 6);\n    std::cout << \"分块查找（18 个元素，每块 6 个）:\" << std::endl;\n    table.printIndex();\n    std::cout << \"  查 45 -> 下标 \" << table.blockSearch(45) << std::endl;\n    std::cout << \"  查 61 -> 下标 \" << table.blockSearch(61) << std::endl;\n    std::cout << \"  查 65 -> 下标 \" << table.blockSearch(65) << \"（-1 表示没找到）\" << std::endl;\n    return 0;\n}"}]},"rs":{"file":"search.rs","steps":[{"title":"顺序查找（带哨兵）","note":"把 key 放到 a[0]，从后往前比，省掉越界判断","code":"fn sequential_search(table: &mut Vec<i32>, n: usize, key: i32) -> usize\n{\n    table[0] = key;                // 0 号位当哨兵，不存真数据\n    let mut i = n;\n    while table[i] != key\n    {\n        i -= 1;                    // 哨兵一定拦得住，不用写 i >= 1\n    }\n    i                              // 返回 0 表示没找到\n}"},{"title":"折半查找","note":"每比较一次就丢掉一半区间，所以只要 log2(n) 次","code":"fn binary_search(a: &[i32], key: i32) -> i32\n{\n    let mut low: i32 = 0;\n    let mut high = a.len() as i32 - 1;\n    while low <= high\n    {\n        let mid = (low + high) / 2;\n        if a[mid as usize] == key\n        {\n            return mid;\n        }\n        if a[mid as usize] < key\n        {\n            low = mid + 1;         // key 在右半边\n        }\n        else\n        {\n            high = mid - 1;        // key 在左半边\n        }\n    }\n    -1\n}"},{"title":"折半查找的判定树与 ASL","note":"比较次数就是节点在判定树上的层数","code":"fn binary_compare(a: &[i32], key: i32) -> i32\n{\n    let mut low: i32 = 0;\n    let mut high = a.len() as i32 - 1;\n    let mut compare = 0;\n    while low <= high\n    {\n        let mid = (low + high) / 2;\n        compare += 1;\n        if a[mid as usize] == key\n        {\n            return compare;\n        }\n        if a[mid as usize] < key\n        {\n            low = mid + 1;\n        }\n        else\n        {\n            high = mid - 1;\n        }\n    }\n    compare\n}\n\nfn print_asl(a: &[i32])\n{\n    let mut total = 0;\n    let mut level_count = vec![0; 32];\n    for i in 0..a.len()\n    {\n        let compare = binary_compare(a, a[i]);\n        println!(\"  {:2} 比较 {} 次\", a[i], compare);\n        total += compare;\n        level_count[compare as usize] += 1;\n    }\n    for level in 1..32\n    {\n        if level_count[level] > 0\n        {\n            println!(\"  判定树第 {} 层: {} 个节点\", level, level_count[level]);\n        }\n    }\n    println!(\"  ASL = {} / {} = {:.3}\", total, a.len(), total as f64 / a.len() as f64);\n}"},{"title":"分块查找的索引表","note":"每块记最大关键字、起始下标和块长，块内可以无序","code":"struct IndexItem\n{\n    max_key: i32,\n    start: usize,\n    length: usize,\n}\n\nfn build_index(a: &[i32], block_size: usize) -> Vec<IndexItem>\n{\n    let mut index: Vec<IndexItem> = Vec::new();\n    let mut start = 0;\n    while start < a.len()\n    {\n        let mut length = a.len() - start;\n        if length > block_size\n        {\n            length = block_size;\n        }\n\n        let mut max_key = a[start];\n        for i in 1..length\n        {\n            if a[start + i] > max_key\n            {\n                max_key = a[start + i];\n            }\n        }\n        index.push(IndexItem { max_key, start, length });\n        start += block_size;\n    }\n    index\n}"},{"title":"分块查找的实现","note":"先顺着索引表找到块，再在块内顺序找","code":"fn block_search(a: &[i32], index: &[IndexItem], key: i32) -> i32\n{\n    let mut block: i32 = -1;\n    for i in 0..index.len()\n    {\n        if key <= index[i].max_key     // 第一个能装下 key 的块\n        {\n            block = i as i32;\n            break;\n        }\n    }\n    if block == -1\n    {\n        return -1;                     // 比所有块的最大值都大\n    }\n\n    let b = block as usize;\n    for i in 0..index[b].length\n    {\n        let pos = index[b].start + i;\n        if a[pos] == key\n        {\n            return pos as i32;\n        }\n    }\n    -1                                 // 块里也没有\n}\n\nfn print_index(index: &[IndexItem])\n{\n    for i in 0..index.len()\n    {\n        println!(\"  块 {}: maxKey = {:2}, start = {:2}, length = {}\",\n            i, index[i].max_key, index[i].start, index[i].length);\n    }\n}"},{"title":"main：跑一遍","note":"先跑顺序和折半，再算 ASL，最后跑分块","code":"fn main()\n{\n    let mut table = vec![0, 8, 14, 23, 37, 45, 51, 68, 79, 93];  // vec![0] 是哨兵位\n    let sorted = [8, 14, 23, 37, 45, 51, 68, 79, 93];\n\n    println!(\"顺序查找（带哨兵）:\");\n    println!(\"  查 45 -> 位置 {}\", sequential_search(&mut table, 9, 45));\n    println!(\"  查 50 -> 位置 {}（0 表示没找到）\", sequential_search(&mut table, 9, 50));\n\n    println!(\"折半查找:\");\n    println!(\"  查 45 -> 下标 {}\", binary_search(&sorted, 45));\n    println!(\"  查 50 -> 下标 {}（-1 表示没找到）\", binary_search(&sorted, 50));\n\n    println!(\"判定树与 ASL:\");\n    print_asl(&sorted);\n\n    let blocks = [22, 12, 9, 18, 5, 30,\n                  40, 35, 48, 33, 52, 45,\n                  70, 66, 58, 75, 61, 80];\n    let index = build_index(&blocks, 6);\n    println!(\"分块查找（18 个元素，每块 6 个）:\");\n    print_index(&index);\n    println!(\"  查 45 -> 下标 {}\", block_search(&blocks, &index, 45));\n    println!(\"  查 61 -> 下标 {}\", block_search(&blocks, &index, 61));\n    println!(\"  查 65 -> 下标 {}（-1 表示没找到）\", block_search(&blocks, &index, 65));\n}"}]}},"hash":{"c":{"file":"hash.c","steps":[{"title":"桶与节点结构","note":"拉链法，用链表把落到同一个桶的键值对串起来","code":"#include <stdio.h>\n#include <stdlib.h>\n#include <stdbool.h>\ntypedef struct Entry\n{\n    int key;\n    int value;\n    struct Entry* next;   // 同一个桶里的下一个节点\n} Entry;\ntypedef struct\n{\n    Entry** buckets;      // 桶数组，每个元素是一条链的头指针\n    int bucketCount;      // 桶的个数\n    int size;             // 一共存了多少个键值对\n} MyHash;"},{"title":"哈希函数","note":"乘一个质数把关键字打散，取绝对值后再对桶数取模","code":"int hashKey(int key)\n{\n    int h = key * 31;\n    if (h < 0)\n    {\n        h = -h;   // 保证非负，取模后才不会出现负下标\n    }\n    return h;\n}"},{"title":"初始化与销毁","note":"calloc 把桶数组清零，free 时逐条链释放","code":"void hashInit(MyHash* m)\n{\n    m->bucketCount = 4;\n    m->size = 0;\n    m->buckets = (Entry**)calloc(4, sizeof(Entry*));\n    if (m->buckets == NULL)\n    {\n        printf(\"error! : calloc failed!\\n\");\n    }\n}\nvoid hashFree(MyHash* m)\n{\n    for (int i = 0; i < m->bucketCount; i++)\n    {\n        Entry* cur = m->buckets[i];\n        while (cur != NULL)\n        {\n            Entry* next = cur->next;   // 先记住下一个再释放当前的\n            free(cur);\n            cur = next;\n        }\n    }\n    free(m->buckets);\n    m->size = 0;\n}"},{"title":"插入或更新 put","note":"元素超过桶数的 3/4 就先扩容，再头插新节点","code":"void hashPut(MyHash* m, int key, int value)\n{\n    // 负载因子 = (size+1)/bucketCount，超过 3/4 就把桶数翻倍\n    if ((m->size + 1) * 4 > m->bucketCount * 3)\n    {\n        int count = m->bucketCount * 2;\n        Entry** fresh = (Entry**)calloc(count, sizeof(Entry*));\n        if (fresh == NULL)\n        {\n            printf(\"error! : calloc failed!\\n\");\n            return;\n        }\n        for (int i = 0; i < m->bucketCount; i++)\n        {\n            Entry* cur = m->buckets[i];\n            while (cur != NULL)\n            {\n                Entry* next = cur->next;\n                int j = hashKey(cur->key) % count;\n                cur->next = fresh[j];   // 旧节点重新算桶号挂到新数组\n                fresh[j] = cur;\n                cur = next;\n            }\n        }\n        free(m->buckets);\n        m->buckets = fresh;\n        m->bucketCount = count;\n    }\n    int idx = hashKey(key) % m->bucketCount;\n    Entry* cur = m->buckets[idx];\n    while (cur != NULL)\n    {\n        if (cur->key == key)\n        {\n            cur->value = value;   // 键已经在了，只更新值\n            return;\n        }\n        cur = cur->next;\n    }\n    Entry* e = (Entry*)malloc(sizeof(Entry));\n    if (e == NULL)\n    {\n        printf(\"error! : malloc failed!\\n\");\n        return;\n    }\n    e->key = key;\n    e->value = value;\n    e->next = m->buckets[idx];   // 头插，O(1)\n    m->buckets[idx] = e;\n    m->size++;\n}"},{"title":"查找 get","note":"先算桶号，再沿着这条链顺序比较","code":"bool hashGet(MyHash* m, int key, int* out)\n{\n    Entry* cur = m->buckets[hashKey(key) % m->bucketCount];\n    while (cur != NULL)\n    {\n        if (cur->key == key)\n        {\n            *out = cur->value;\n            return true;\n        }\n        cur = cur->next;\n    }\n    return false;\n}"},{"title":"删除 remove","note":"用 prev 记住前一个节点，把匹配节点从链上摘掉","code":"bool hashRemove(MyHash* m, int key)\n{\n    int idx = hashKey(key) % m->bucketCount;\n    Entry* prev = NULL;\n    Entry* cur = m->buckets[idx];\n    while (cur != NULL && cur->key != key)\n    {\n        prev = cur;\n        cur = cur->next;\n    }\n    if (cur == NULL)\n    {\n        return false;\n    }\n    if (prev == NULL)\n    {\n        m->buckets[idx] = cur->next;   // 删的是链首\n    }\n    else\n    {\n        prev->next = cur->next;\n    }\n    free(cur);\n    m->size--;\n    return true;\n}"},{"title":"main：跑一遍","note":"插入 7 个键观察扩容，再验证 get 和 remove","code":"int main(void)\n{\n    MyHash m;\n    hashInit(&m);\n    for (int i = 1; i <= 7; i++)\n    {\n        hashPut(&m, i, i * 10);   // 第 7 个会触发扩容\n        printf(\"put(%d) -> buckets=%d size=%d\\n\", i, m.bucketCount, m.size);\n    }\n    hashPut(&m, 1, 111);   // 键重复，只改值\n    int out = 0;\n    hashGet(&m, 1, &out);\n    printf(\"get(1) = %d\\n\", out);\n    printf(\"get(99) -> %s\\n\", hashGet(&m, 99, &out) ? \"found\" : \"not found\");\n    printf(\"remove(2) -> %s\\n\", hashRemove(&m, 2) ? \"true\" : \"false\");\n    hashFree(&m);\n    return 0;\n}"}]},"cpp":{"file":"hash.cpp","steps":[{"title":"桶与节点结构","note":"拉链法，每个桶挂一条链表，撞到一起的就挂在同一条链上","code":"#include <iostream>\n\nclass HashTable\n{\npublic:\n    HashTable();\n    ~HashTable();\n    void put(int key, int value);\n    bool get(int key, int& value);      // 找到返回 true，并把值带出去\n    void remove(int key);\n    void print();\n\nprivate:\n    struct Node\n    {\n        int key;\n        int value;\n        Node* next;\n    };\n\n    Node** buckets;      // 桶数组，每个元素是一条链表的头\n    int bucketCount;     // 桶的个数\n    int size;            // 一共存了多少对键值\n\n    int  hash(int key);\n    void resize();\n};"},{"title":"哈希函数","note":"用 key 对桶数取模，负数要先掰正","code":"int HashTable::hash(int key)\n{\n    int index = key % bucketCount;\n\n    if (index < 0)\n    {\n        index = index + bucketCount;   // C++ 里 -3 % 5 还是 -3，不掰正就成负下标了\n    }\n\n    return index;\n}"},{"title":"初始化与销毁","note":"构造时把每个桶都置空；析构时把每条链和桶数组都还回去","code":"HashTable::HashTable()\n{\n    bucketCount = 4;\n    size = 0;\n    buckets = new Node*[bucketCount];\n\n    for (int i = 0; i < bucketCount; i++)\n    {\n        buckets[i] = nullptr;\n    }\n}\n\nHashTable::~HashTable()\n{\n    for (int i = 0; i < bucketCount; i++)\n    {\n        Node* p = buckets[i];\n        while (p != nullptr)\n        {\n            Node* next = p->next;\n            delete p;\n            p = next;\n        }\n    }\n\n    delete[] buckets;\n}"},{"title":"插入或更新 put","note":"key 已经有了就改 value，没有才头插进链里","code":"void HashTable::put(int key, int value)\n{\n    int index = hash(key);\n    Node* p = buckets[index];\n\n    while (p != nullptr)             // 先沿着链找一遍，看 key 是不是已经存在\n    {\n        if (p->key == key)\n        {\n            p->value = value;        // 已存在 -> 只更新值\n            return;\n        }\n        p = p->next;\n    }\n\n    Node* node = new Node;           // 不存在 -> 头插，O(1)\n    node->key = key;\n    node->value = value;\n    node->next = buckets[index];\n    buckets[index] = node;\n    size++;\n\n    if (size > bucketCount * 3 / 4)  // 负载因子超过 0.75 就扩容\n    {\n        resize();\n    }\n}\n\nvoid HashTable::resize()\n{\n    Node** old = buckets;\n    int oldCount = bucketCount;\n\n    bucketCount = bucketCount * 2;   // 换一块两倍大的桶\n    buckets = new Node*[bucketCount];\n    for (int i = 0; i < bucketCount; i++)\n    {\n        buckets[i] = nullptr;\n    }\n    size = 0;\n\n    for (int i = 0; i < oldCount; i++)   // 把旧桶里的元素重新\"算一遍下标\"放进来\n    {\n        Node* p = old[i];\n        while (p != nullptr)\n        {\n            Node* next = p->next;\n            put(p->key, p->value);       // 注意：每个 key 的新下标和旧下标没关系\n            p = next;\n        }\n    }\n\n    delete[] old;\n}"},{"title":"查找 get","note":"先算出桶下标，再沿着那条链逐个比 key","code":"bool HashTable::get(int key, int& value)\n{\n    int index = hash(key);\n    Node* p = buckets[index];\n\n    while (p != nullptr)\n    {\n        if (p->key == key)\n        {\n            value = p->value;\n            return true;\n        }\n        p = p->next;\n    }\n\n    return false;                    // 走完整条链都没有，说明不存在\n}"},{"title":"删除 remove","note":"同样是链表删除，要同时拿着前驱","code":"void HashTable::remove(int key)\n{\n    int index = hash(key);\n    Node* prev = nullptr;\n    Node* p = buckets[index];\n\n    while (p != nullptr && p->key != key)\n    {\n        prev = p;\n        p = p->next;\n    }\n\n    if (p == nullptr)\n    {\n        return;                      // 没找到\n    }\n\n    if (prev == nullptr)             // 删的是链头\n    {\n        buckets[index] = p->next;\n    }\n    else\n    {\n        prev->next = p->next;        // 让前驱跨过它\n    }\n\n    delete p;\n    size--;\n}\n\nvoid HashTable::print()\n{\n    std::cout << \"桶数 = \" << bucketCount << \"  元素数 = \" << size << std::endl;\n\n    for (int i = 0; i < bucketCount; i++)\n    {\n        std::cout << \"  [\" << i << \"] \";\n        Node* p = buckets[i];\n        while (p != nullptr)\n        {\n            std::cout << p->key << \"=\" << p->value << \" -> \";\n            p = p->next;\n        }\n        std::cout << \"null\" << std::endl;\n    }\n}"},{"title":"main：跑一遍","note":"故意让几个 key 撞到同一个桶，再看扩容后的分布","code":"int main()\n{\n    HashTable table;\n\n    table.put(12, 120);\n    table.put(7, 70);        // 12 % 4 == 7 % 4 == 3，撞上了\n    table.put(20, 200);\n    table.put(17, 170);      // 又撞到 3 号桶\n    table.print();\n\n    table.put(5, 50);        // 这一步会触发扩容，桶数 4 -> 8\n    table.print();\n\n    int value = 0;\n    if (table.get(17, value))\n    {\n        std::cout << \"get(17) = \" << value << std::endl;\n    }\n\n    if (!table.get(99, value))\n    {\n        std::cout << \"get(99) 没找到\" << std::endl;\n    }\n\n    table.remove(7);\n    table.print();\n\n    return 0;\n}"}]},"rs":{"file":"hash.rs","steps":[{"title":"桶与节点结构","note":"拉链法，每个桶挂一条链表，撞到一起的就挂在同一条链上","code":"struct Node\n{\n    key: i32,\n    value: i32,\n    next: Option<Box<Node>>,\n}\n\npub struct HashTable\n{\n    buckets: Vec<Option<Box<Node>>>,   // 每个桶存的是这条链的头\n    bucket_count: usize,\n    size: usize,\n}"},{"title":"哈希函数","note":"用 key 对桶数取模，负数要先掰正","code":"impl HashTable\n{\n    fn hash(&self, key: i32) -> usize\n    {\n        let mut index = key % self.bucket_count as i32;\n\n        if index < 0\n        {\n            index += self.bucket_count as i32;   // Rust 里 -3 % 5 还是 -3，不掰正就成负下标\n        }\n\n        index as usize\n    }\n}"},{"title":"初始化与销毁","note":"一开始 4 个桶；Rust 不用写析构，Vec 和 Box 会自动释放","code":"impl HashTable\n{\n    pub fn new() -> HashTable\n    {\n        let mut buckets = Vec::new();\n\n        for _ in 0..4\n        {\n            buckets.push(None);\n        }\n\n        HashTable { buckets, bucket_count: 4, size: 0 }\n    }\n}\n\n// 在一条链上找 key：找到了就改 value 并返回 true\nfn chain_put(node: &mut Option<Box<Node>>, key: i32, value: i32) -> bool\n{\n    match node\n    {\n        None => false,                       // 走到链尾都没有，说明 key 不存在\n\n        Some(n) =>\n        {\n            if n.key == key\n            {\n                n.value = value;             // 已存在 -> 只更新值\n                true\n            }\n            else\n            {\n                chain_put(&mut n.next, key, value)   // 继续往链的下一节找\n            }\n        }\n    }\n}"},{"title":"插入或更新 put","note":"key 已经有了就改 value，没有才头插进链里","code":"impl HashTable\n{\n    pub fn put(&mut self, key: i32, value: i32)\n    {\n        let index = self.hash(key);\n\n        if chain_put(&mut self.buckets[index], key, value)\n        {\n            return;\n        }\n\n        // 不存在 -> 头插，O(1)\n        let old_head = self.buckets[index].take();\n        self.buckets[index] = Some(Box::new(Node { key, value, next: old_head }));\n        self.size += 1;\n\n        if self.size * 4 > self.bucket_count * 3     // 负载因子超过 0.75 就扩容\n        {\n            self.resize();\n        }\n    }\n}\n\n// 在一条链上找 key，找到就把 value 带出来\nfn chain_get(node: &Option<Box<Node>>, key: i32) -> Option<i32>\n{\n    match node\n    {\n        None => None,\n\n        Some(n) =>\n        {\n            if n.key == key\n            {\n                Some(n.value)\n            }\n            else\n            {\n                chain_get(&n.next, key)\n            }\n        }\n    }\n}"},{"title":"查找 get","note":"先算出桶下标，再沿着那条链逐个比 key","code":"impl HashTable\n{\n    pub fn get(&self, key: i32) -> Option<i32>\n    {\n        chain_get(&self.buckets[self.hash(key)], key)\n    }\n}\n\n// 在一条链上摘掉 key\nfn chain_remove(node: &mut Option<Box<Node>>, key: i32) -> bool\n{\n    if node.is_none()\n    {\n        return false;\n    }\n\n    if node.as_ref().unwrap().key == key\n    {\n        let mut old = node.take().unwrap();   // 先把整条链摘下来\n        *node = old.next.take();              // 再挂上它的下一个\n        return true;\n    }\n\n    chain_remove(&mut node.as_mut().unwrap().next, key)\n}"},{"title":"删除 remove","note":"和链表删除一样，要改前驱的 next","code":"impl HashTable\n{\n    pub fn remove(&mut self, key: i32)\n    {\n        let index = self.hash(key);\n\n        if chain_remove(&mut self.buckets[index], key)\n        {\n            self.size -= 1;\n        }\n    }\n\n    fn resize(&mut self)\n    {\n        // 把旧的桶整个拿走，self.buckets 变成一个空 Vec\n        let old = std::mem::take(&mut self.buckets);\n        let old_count = self.bucket_count;\n\n        self.bucket_count = old_count * 2;    // 换一块两倍大的桶\n        self.buckets = Vec::new();\n        for _ in 0..self.bucket_count\n        {\n            self.buckets.push(None);\n        }\n        self.size = 0;\n\n        for i in 0..old_count                 // 把旧桶里的元素重新算一遍下标放进来\n        {\n            let mut cur = old[i].as_deref();\n\n            while let Some(n) = cur\n            {\n                self.put(n.key, n.value);     // 注意：每个 key 的新下标和旧下标没关系\n                cur = n.next.as_deref();\n            }\n        }\n    }\n\n    pub fn print(&self)\n    {\n        println!(\"桶数 = {}  元素数 = {}\", self.bucket_count, self.size);\n\n        for i in 0..self.bucket_count\n        {\n            print!(\"  [{}] \", i);\n\n            let mut cur = self.buckets[i].as_deref();\n            while let Some(n) = cur\n            {\n                print!(\"{}={} -> \", n.key, n.value);\n                cur = n.next.as_deref();\n            }\n\n            println!(\"None\");\n        }\n    }\n}"},{"title":"main：跑一遍","note":"故意让几个 key 撞到同一个桶，再看扩容后的分布","code":"fn main()\n{\n    let mut table = HashTable::new();\n\n    table.put(12, 120);\n    table.put(7, 70);        // 12 % 4 == 7 % 4 == 3，撞上了\n    table.put(20, 200);\n    table.put(17, 170);      // 又撞到 3 号桶\n    table.print();\n\n    table.put(5, 50);        // 这一步会触发扩容，桶数 4 -> 8\n    table.print();\n\n    println!(\"get(17) = {:?}\", table.get(17));\n    println!(\"get(99) = {:?}\", table.get(99));\n\n    table.remove(7);\n    table.print();\n}"}]}},"sort":{"c":{"file":"sort.c","steps":[{"title":"冒泡排序 bubbleSort","note":"相邻比较交换，一轮没换过就说明已经有序","code":"#include <stdio.h>\n#include <stdlib.h>\n#include <stdbool.h>\nvoid bubbleSort(int* a, int n)\n{\n    for (int end = n; end > 1; end--)\n    {\n        bool swapped = false;\n        for (int i = 1; i < end; i++)\n        {\n            if (a[i - 1] > a[i])\n            {\n                int t = a[i - 1];\n                a[i - 1] = a[i];\n                a[i] = t;\n                swapped = true;\n            }\n        }\n        if (!swapped)\n        {\n            break;   // 这一轮一次都没换，后面肯定已经有序\n        }\n    }\n}"},{"title":"插入排序 insertionSort","note":"把 a[i] 插进前面已经排好的区间里","code":"void insertionSort(int* a, int n)\n{\n    for (int i = 1; i < n; i++)\n    {\n        int key = a[i];\n        int j = i;\n        while (j > 0 && a[j - 1] > key)   // 比 key 大的元素统统往后挪一格\n        {\n            a[j] = a[j - 1];\n            j--;\n        }\n        a[j] = key;\n    }\n}"},{"title":"归并排序 mergeSort","note":"先递归排好左右两半，再把两个有序区间合并","code":"void mergeSortRange(int* a, int* tmp, int lo, int hi)\n{\n    if (hi - lo < 2)\n    {\n        return;   // 区间里最多一个元素，天然有序\n    }\n    int mid = lo + (hi - lo) / 2;\n    mergeSortRange(a, tmp, lo, mid);\n    mergeSortRange(a, tmp, mid, hi);\n    int i = lo;\n    int j = mid;\n    for (int k = lo; k < hi; k++)\n    {\n        // 左边取完了就取右边，否则比较两边谁小就取谁\n        if (i >= mid || (j < hi && a[j] < a[i]))\n        {\n            tmp[k] = a[j];\n            j++;\n        }\n        else\n        {\n            tmp[k] = a[i];\n            i++;\n        }\n    }\n    for (int k = lo; k < hi; k++)\n    {\n        a[k] = tmp[k];   // 临时数组的结果拷回原数组\n    }\n}\nvoid mergeSort(int* a, int n)\n{\n    if (n < 2)\n    {\n        return;\n    }\n    int* tmp = (int*)malloc(n * sizeof(int));\n    if (tmp == NULL)\n    {\n        printf(\"error! : malloc failed!\\n\");\n        return;\n    }\n    mergeSortRange(a, tmp, 0, n);\n    free(tmp);\n}"},{"title":"快速排序 quickSort（Lomuto 分区）","note":"固定取末尾元素当基准，保证输出确定","code":"int quickPartition(int* a, int lo, int hi)\n{\n    int pivot = a[hi];   // 基准取区间最后一个\n    int i = lo;          // i 左边都小于基准\n    for (int j = lo; j < hi; j++)\n    {\n        if (a[j] < pivot)\n        {\n            int t = a[i];\n            a[i] = a[j];\n            a[j] = t;\n            i++;\n        }\n    }\n    int t = a[i];        // 最后把基准换到分界点上\n    a[i] = a[hi];\n    a[hi] = t;\n    return i;\n}\nvoid quickSortRange(int* a, int lo, int hi)\n{\n    if (lo >= hi)\n    {\n        return;\n    }\n    int p = quickPartition(a, lo, hi);\n    quickSortRange(a, lo, p - 1);\n    quickSortRange(a, p + 1, hi);\n}\nvoid quickSort(int* a, int n)\n{\n    if (n > 1)\n    {\n        quickSortRange(a, 0, n - 1);\n    }\n}"},{"title":"main：跑一遍","note":"同一组数据跑四种排序，结果应该完全一样","code":"void printArray(char* tag, int* a, int n)\n{\n    printf(\"%-14s:\", tag);\n    for (int i = 0; i < n; i++)\n    {\n        printf(\" %d\", a[i]);\n    }\n    printf(\"\\n\");\n}\nvoid resetArray(int* a, int* base, int n)\n{\n    for (int i = 0; i < n; i++)\n    {\n        a[i] = base[i];\n    }\n}\nint main(void)\n{\n    int base[] = { 5, 2, 9, 1, 5, 6, -3, 8, 0, 7, 4, 2 };\n    int n = 12;\n    int a[12];\n    resetArray(a, base, n);\n    bubbleSort(a, n);\n    printArray(\"bubbleSort\", a, n);\n    resetArray(a, base, n);\n    insertionSort(a, n);\n    printArray(\"insertionSort\", a, n);\n    resetArray(a, base, n);\n    mergeSort(a, n);\n    printArray(\"mergeSort\", a, n);\n    resetArray(a, base, n);\n    quickSort(a, n);\n    printArray(\"quickSort\", a, n);\n    printf(\"四种排序结果一致且升序。\\n\");\n    return 0;\n}"}]},"cpp":{"file":"sort.cpp","steps":[{"title":"冒泡排序 bubbleSort","note":"相邻两个比较，大的往后冒；一整轮没交换就可以提前结束","code":"#include <iostream>\n\nvoid bubbleSort(int arr[], int n)\n{\n    for (int end = n - 1; end > 0; end--)\n    {\n        bool swapped = false;\n\n        for (int i = 0; i < end; i++)\n        {\n            if (arr[i] > arr[i + 1])\n            {\n                int temp = arr[i];\n                arr[i] = arr[i + 1];\n                arr[i + 1] = temp;\n                swapped = true;\n            }\n        }\n\n        if (!swapped)      // 这一轮一次都没换，说明已经有序了\n        {\n            break;\n        }\n    }\n}"},{"title":"插入排序 insertionSort","note":"像摸扑克牌，把当前这张插到左边已经排好的那一堆里","code":"void insertionSort(int arr[], int n)\n{\n    for (int i = 1; i < n; i++)\n    {\n        int cur = arr[i];\n        int j = i - 1;\n\n        while (j >= 0 && arr[j] > cur)\n        {\n            arr[j + 1] = arr[j];    // 比它大的元素统统往后挪一格\n            j--;\n        }\n\n        arr[j + 1] = cur;           // 空出来的位置就是它的家\n    }\n}"},{"title":"归并排序 mergeSort","note":"先一分为二递归排好，再把两个有序数组\"拉链式\"合并","code":"void merge(int arr[], int temp[], int lo, int mid, int hi)\n{\n    int i = lo;\n    int j = mid + 1;\n    int k = lo;\n\n    while (i <= mid && j <= hi)\n    {\n        if (arr[i] <= arr[j])       // 相等时先取左边，这样才是稳定排序\n        {\n            temp[k] = arr[i];\n            i++;\n        }\n        else\n        {\n            temp[k] = arr[j];\n            j++;\n        }\n        k++;\n    }\n\n    while (i <= mid)                // 左边还有剩的，整段接上\n    {\n        temp[k] = arr[i];\n        i++;\n        k++;\n    }\n    while (j <= hi)                 // 右边还有剩的，整段接上\n    {\n        temp[k] = arr[j];\n        j++;\n        k++;\n    }\n\n    for (int t = lo; t <= hi; t++)  // 再把临时数组搬回原数组\n    {\n        arr[t] = temp[t];\n    }\n}\n\nvoid mergeSort(int arr[], int temp[], int lo, int hi)\n{\n    if (lo >= hi)                   // 只剩 0 个或 1 个元素，天然有序\n    {\n        return;\n    }\n\n    int mid = lo + (hi - lo) / 2;\n    mergeSort(arr, temp, lo, mid);      // 左半边排好\n    mergeSort(arr, temp, mid + 1, hi);  // 右半边排好\n    merge(arr, temp, lo, mid, hi);      // 合起来\n}"},{"title":"快速排序 quickSort（Lomuto 分区）","note":"选一个基准，比它小的丢左边，大的丢右边","code":"int partition(int arr[], int lo, int hi)\n{\n    int pivot = arr[hi];       // 取最后一个元素当基准\n    int i = lo;                // i 指向\"小于区\"的下一个空位\n\n    for (int j = lo; j < hi; j++)    // 注意是 j < hi，arr[hi] 是基准本身\n    {\n        if (arr[j] < pivot)\n        {\n            int temp = arr[i];\n            arr[i] = arr[j];\n            arr[j] = temp;\n            i++;\n        }\n    }\n\n    int temp = arr[i];         // 最后把基准换到 i 的位置，这一步最容易忘\n    arr[i] = arr[hi];\n    arr[hi] = temp;\n\n    return i;                  // 返回基准的最终下标\n}\n\nvoid quickSort(int arr[], int lo, int hi)\n{\n    if (lo >= hi)\n    {\n        return;\n    }\n\n    int p = partition(arr, lo, hi);\n    quickSort(arr, lo, p - 1);     // 注意是 p-1\n    quickSort(arr, p + 1, hi);     // 和 p+1，写成 p 会死循环\n}"},{"title":"main：跑一遍","note":"同一组数据跑四种排序，结果应该完全一样","code":"void printArray(const char* name, int arr[], int n)\n{\n    std::cout << name;\n    for (int i = 0; i < n; i++)\n    {\n        std::cout << arr[i] << \" \";\n    }\n    std::cout << std::endl;\n}\n\nvoid copyArray(int from[], int to[], int n)\n{\n    for (int i = 0; i < n; i++)\n    {\n        to[i] = from[i];\n    }\n}\n\nint main()\n{\n    int data[] = { 5, 2, 9, 1, 5, 6, -3, 8, 0, 7, 4, 2 };\n    const int n = 12;\n    int work[12];\n    int temp[12];\n\n    printArray(\"原始数组   : \", data, n);\n\n    copyArray(data, work, n);\n    bubbleSort(work, n);\n    printArray(\"bubbleSort : \", work, n);\n\n    copyArray(data, work, n);\n    insertionSort(work, n);\n    printArray(\"insertSort : \", work, n);\n\n    copyArray(data, work, n);\n    mergeSort(work, temp, 0, n - 1);\n    printArray(\"mergeSort  : \", work, n);\n\n    copyArray(data, work, n);\n    quickSort(work, 0, n - 1);\n    printArray(\"quickSort  : \", work, n);\n\n    return 0;\n}"}]},"rs":{"file":"sort.rs","steps":[{"title":"冒泡排序 bubble_sort","note":"相邻两个比较，大的往后冒；一整轮没交换就可以提前结束","code":"fn bubble_sort(arr: &mut [i32])\n{\n    let n = arr.len();\n\n    for end in (1..n).rev()\n    {\n        let mut swapped = false;\n\n        for i in 0..end\n        {\n            if arr[i] > arr[i + 1]\n            {\n                arr.swap(i, i + 1);\n                swapped = true;\n            }\n        }\n\n        if !swapped          // 这一轮一次都没换，说明已经有序了\n        {\n            break;\n        }\n    }\n}"},{"title":"插入排序 insertion_sort","note":"像摸扑克牌，把当前这张插到左边已经排好的那一堆里","code":"fn insertion_sort(arr: &mut [i32])\n{\n    for i in 1..arr.len()\n    {\n        let cur = arr[i];\n        let mut j = i;\n\n        while j > 0 && arr[j - 1] > cur\n        {\n            arr[j] = arr[j - 1];    // 比它大的元素统统往后挪一格\n            j -= 1;\n        }\n\n        arr[j] = cur;               // 空出来的位置就是它的家\n    }\n}"},{"title":"归并排序 merge_sort","note":"一分为二递归排好，再把两个有序数组\"拉链式\"合并","code":"fn merge_sort(arr: &mut [i32])\n{\n    let n = arr.len();\n\n    if n <= 1                       // 只剩 0 个或 1 个元素，天然有序\n    {\n        return;\n    }\n\n    let mid = n / 2;\n    merge_sort(&mut arr[..mid]);        // 左半边排好\n    merge_sort(&mut arr[mid..]);        // 右半边排好\n\n    let mut merged = Vec::new();\n    let (left, right) = arr.split_at(mid);\n    let mut i = 0;\n    let mut j = 0;\n\n    while i < left.len() && j < right.len()\n    {\n        if left[i] <= right[j]          // 相等时先取左边，这样才是稳定排序\n        {\n            merged.push(left[i]);\n            i += 1;\n        }\n        else\n        {\n            merged.push(right[j]);\n            j += 1;\n        }\n    }\n\n    while i < left.len()                // 左边还有剩的，整段接上\n    {\n        merged.push(left[i]);\n        i += 1;\n    }\n    while j < right.len()               // 右边还有剩的，整段接上\n    {\n        merged.push(right[j]);\n        j += 1;\n    }\n\n    arr.copy_from_slice(&merged);       // 把临时结果搬回原数组\n}"},{"title":"快速排序 quick_sort（Lomuto 分区）","note":"选一个基准，比它小的丢左边，大的丢右边","code":"fn partition(arr: &mut [i32]) -> usize\n{\n    let hi = arr.len() - 1;\n    let pivot = arr[hi];        // 取最后一个元素当基准\n    let mut i = 0;              // i 指向\"小于区\"的下一个空位\n\n    for j in 0..hi              // 注意是 j < hi，arr[hi] 是基准本身\n    {\n        if arr[j] < pivot\n        {\n            arr.swap(i, j);\n            i += 1;\n        }\n    }\n\n    arr.swap(i, hi);            // 最后把基准换到 i 的位置，这一步最容易忘\n    i                           // 返回基准的最终下标\n}\n\nfn quick_sort(arr: &mut [i32])\n{\n    if arr.len() <= 1\n    {\n        return;\n    }\n\n    let p = partition(arr);\n    let (left, rest) = arr.split_at_mut(p);\n\n    quick_sort(left);           // 左边继续排\n    quick_sort(&mut rest[1..]); // rest[0] 是基准，已经就位了，跳过它\n}"},{"title":"main：跑一遍","note":"同一组数据跑四种排序，结果应该完全一样","code":"fn main()\n{\n    let data = [5, 2, 9, 1, 5, 6, -3, 8, 0, 7, 4, 2];\n\n    let mut a = data;\n    bubble_sort(&mut a);\n    println!(\"bubbleSort : {:?}\", a);\n\n    let mut b = data;\n    insertion_sort(&mut b);\n    println!(\"insertSort : {:?}\", b);\n\n    let mut c = data;\n    merge_sort(&mut c);\n    println!(\"mergeSort  : {:?}\", c);\n\n    let mut d = data;\n    quick_sort(&mut d);\n    println!(\"quickSort  : {:?}\", d);\n\n    println!(\"原始数组   : {:?}\", data);\n}"}]}}};
