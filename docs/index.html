/* ============================ 1. 动态数组 ============================ */
(function () {
'use strict';
const D = window.DSV;

function P(arr, size, cap, o) {
  const s = { arr: arr.slice(), size: size, cap: cap, hl: [], ok: [], bad: [], dim: [], op: '', tag: '' };
  return Object.assign(s, o || {});
}

const steps = [
  { text: '初始状态：申请了一块能放 4 个格子的连续内存（capacity = 4），但一个元素都还没放（size = 0）。注意数组长度和"用了几格"是两回事。',
    s: P([], 0, 4, { op: 'new DynamicArray(4)', tag: 'size = 0, capacity = 4' }) },

  { text: 'push(1)：直接把 1 写进下标 0，size 变成 1。因为还在容量范围内，这一步是 O(1)。',
    s: P([1], 1, 4, { op: 'push(1)', hl: [0], tag: 'O(1)' }) },

  { text: 'push(2)、push(3)、push(4)：继续往尾部写。只要 size < capacity，每次都只是"写一格 + size 加一"，全是 O(1)。',
    s: P([1, 2, 3, 4], 4, 4, { op: 'push(2) push(3) push(4)', hl: [3], tag: 'O(1) × 3' }) },

  { text: 'push(5) 来了 —— 但是 size == capacity，4 格全满，后面没有位置了。这时候必须"扩容"。',
    s: P([1, 2, 3, 4], 4, 4, { op: 'push(5)  →  满了！', bad: [0, 1, 2, 3], tag: 'size == capacity' }) },

  { text: '扩容第一步：申请一块 2 倍大小的新内存（capacity 从 4 变成 8）。注意这里是"新开一块"，不是"原地变大"——连续内存没法凭空延长。',
    s: P([1, 2, 3, 4], 4, 8, { op: 'new Array(8)', dim: [0, 1, 2, 3], tag: 'capacity: 4 → 8' }) },

  { text: '扩容第二步：把旧数组的 4 个元素按顺序复制到新数组。这一步要碰每一个元素，所以是 O(n)——这是动态数组唯一"贵"的操作。',
    s: P([1, 2, 3, 4], 4, 8, { op: 'copy 旧数组 → 新数组', hl: [0, 1, 2, 3], tag: 'O(n)' }) },

  { text: '扩容完成后，终于能把 5 写进下标 4 了。size = 5，capacity = 8。关键洞察：一次扩容后剩下的 3 个位置都免费，所以把"扩容的代价"摊到每次 push 上，平均还是 O(1)（均摊复杂度）。',
    s: P([1, 2, 3, 4, 5], 5, 8, { op: 'push(5) 成功', ok: [4], tag: '均摊 O(1)' }) },

  { text: 'insert(2, 99)：要在下标 2 插队。可下标 2 已经被 3 占了，所以必须把 2 号及以后的元素统统往后挪一格。注意必须"从后往前"挪，否则前面的值会被后面的覆盖。',
    s: P([1, 2, 3, 4, 5], 5, 8, { op: 'insert(2, 99) → 先搬移', hl: [2, 3, 4], tag: 'O(n)' }) },

  { text: '腾出位置后写入 99，size = 6。一次插入最坏要搬 n 个元素，所以 insert 是 O(n)——这也是为什么"频繁在头部插入"的场景不该用数组。',
    s: P([1, 2, 99, 3, 4, 5], 6, 8, { op: 'arr[2] = 99', ok: [2], tag: 'size = 6' }) },

  { text: 'remove(0)：删除下标 0。删完之后序列中间出现空档，所以后面的元素必须集体往前挪一格。同样是 O(n)。',
    s: P([1, 2, 99, 3, 4, 5], 6, 8, { op: 'remove(0) → 前移', hl: [0], bad: [0], tag: 'O(n)' }) },

  { text: 'size 变成 5。注意最后那一格（下标 5）的值我们只是"逻辑上不要了"，并没有真的擦掉——下次 push 会直接覆盖它。这就是数组的删除比插入"便宜一点点"的地方：不用清零。',
    s: P([2, 99, 3, 4, 5, 5], 5, 8, { op: 'size--', ok: [0], dim: [5], tag: '脏数据下标 5 会被下次 push 覆盖' }) }
];

  lead: '数组是唯一能让你"用一下标就瞬间拿到元素"的结构。它的代价是：内存必须连续，插入删除要搬元素。',
  build(doc) {
    /* ---- 概念 ---- */
    const c1 = D.card({ title: '一句话讲清', icon: '💡', badge: 'Array / List' });
    D.html(c1.querySelector('.body'),
      '<p>数组就是<b>一块连续的内存</b>，里面整齐地排着一模一样的格子，每格编号 0、1、2……' +
      '因为格子大小相同、地址连续，所以"第 i 个格子在哪"可以<b>直接算出来</b>：' +
      '<code class="inl">地址 = 基地址 + i × 单格大小</code>。这就是"随机访问 O(1)"的全部秘密。</p>' +
      '<p>但固定长度的数组不好用（现实中你常常不知道要存多少），于是有了<b>动态数组</b>：' +
      '它内部还是一个普通数组，只是额外记录了 <code class="inl">size</code>（用了几个）和 ' +
      '<code class="inl">capacity</code>（开了几个），满了就申请一块 2 倍大的新内存把数据搬过去。</p>' +
      D.mini([['O(1)', '按下标读/写'], ['均摊 O(1)', '尾部 push/pop'], ['O(n)', '中间插入/删除'], ['O(n)', '按值查找']]) +
      D.note('warn', '最容易搞混的两个词',
        '<b>size</b> 是"我存了几个元素"（逻辑长度），<b>capacity</b> 是"我申请了几格"（物理容量）。' +
        '遍历、判断越界只能用 size；访问 <code class="inl">data[i]</code> 且 i &lt; capacity 是安全的，' +
        '但 i ≥ size 时读到的是"垃圾值"，逻辑上不算元素。'));

    /* ---- 动画 ---- */
    const c2 = D.card({ title: '动画：扩容 / 插入 / 删除到底搬了什么', icon: '🎬', badge: '必须看 3 遍' });
    const body2 = c2.querySelector('.body');
    D.html(body2, '<p>下面这个动画演示了动态数组最重要的一次"内部事件"——<b>扩容</b>，以及为什么插入删除要 O(n)。' +
      '建议顺序：先播一遍看个整体，再一步步走，每步停下来问自己"这一格现在是脏的还是有效的"。</p>');
    D.lab(body2, {
      title: '动态数组 · 扩容与搬移',
      height: 300,
      steps: steps,
      setup(view) {
        const inner = D.el('div');
        inner.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:14px;';
        inner.innerHTML =
          '<div class="row" style="gap:10px;flex-wrap:wrap;justify-content:center">' +
          '<span class="chip" data-k="size">size = 0</span>' +
          '<span class="chip" data-k="cap">capacity = 4</span>' +
          '<span class="chip warm" data-k="op">—</span>' +
          '</div>' +
          '<div data-k="box" style="position:relative;border:1.5px dashed #2e3f63;border-radius:14px;padding:14px 16px 30px;">' +
          '<div data-k="caplabel" style="position:absolute;left:14px;top:-11px;background:#0a1120;padding:0 8px;font-family:var(--mono);font-size:11px;color:#6d80a3">capacity = 4</div>' +
          '<div class="row" data-k="cells" style="gap:10px"></div>' +
          '</div>' +
          '<div data-k="tag" style="font-size:12.5px;color:#93a6c8;font-family:var(--mono)"></div>';
        view.appendChild(inner);
        return {
          cells: inner.querySelector('[data-k="cells"]'),
          size: inner.querySelector('[data-k="size"]'),
          cap: inner.querySelector('[data-k="cap"]'),
          op: inner.querySelector('[data-k="op"]'),
          caplabel: inner.querySelector('[data-k="caplabel"]'),
          tag: inner.querySelector('[data-k="tag"]')
        };
      },
      draw(c, step) {
        const s = step.s;
        const items = [];
        for (let i = 0; i < s.cap; i++) {
          let cls = '';
          const has = i < s.size;
          if (!has) cls = 'empty';
          if (s.dim.indexOf(i) >= 0) cls += ' dim';
          if (s.hl.indexOf(i) >= 0) cls += ' hl';
          if (s.ok.indexOf(i) >= 0) cls += ' ok';
          if (s.bad.indexOf(i) >= 0) cls += ' bad';
          items.push({ i: i, v: has ? s.arr[i] : (s.dim.indexOf(i) >= 0 ? s.arr[i] : null), cls: cls });
        }
        D.reconcile(c.cells, items, it => it.i,
          () => D.el('div', 'cell'),
          (node, it) => {
            node.className = 'cell' + (it.cls ? ' ' + it.cls : '');
            node.innerHTML = (it.v === null ? '' : '<span>' + it.v + '</span>') +
              '<span class="lbl">' + it.i + '</span>';
          });
        c.size.textContent = 'size = ' + s.size;
        c.cap.textContent = 'capacity = ' + s.cap;
        c.op.textContent = s.op;
        c.caplabel.textContent = 'capacity = ' + s.cap;
        c.tag.textContent = s.tag;
        c.caplabel.parentElement.style.borderColor = s.cap > 4 ? 'rgba(56,217,208,.45)' : '#2e3f63';
      }
    });
    doc.appendChild(c2);

    /* ---- 要点 ---- */
    const c3 = D.card({ title: '自己写的时候，这 6 个点必须想清楚', icon: '🔧', badge: '实现要点' });
    D.html(c3.querySelector('.body'),
      '<h3 class="sec">1. 扩容为什么是"2 倍"而不是"+1"</h3>' +
      '<p>如果每次满了只加 1 格，那 push n 次就要搬 1+2+3+…+n ≈ O(n²) 次，等于白干。' +
      '翻倍的话，第 k 次扩容要搬 2^k 个元素，但那次扩容之后又能免费塞 2^k 个，' +
      '把总代价摊到 n 次 push 上就是 O(1)。<b>记住结论：扩容倍数必须是常数倍。</b></p>' +
      '<h3 class="sec">2. 插入必须"从后往前"搬</h3>' +
      '<p>要在下标 2 插入，得把 2、3、4 依次后移。如果你从下标 2 开始正着搬，' +
      '<code class="inl">data[3] = data[2]</code> 之后 <code class="inl">data[2]</code> 还是原值，' +
      '下一步 <code class="inl">data[4] = data[3]</code> 就会把刚写进去的复制一遍，原 data[3] 丢了。' +
      '<b>倒着搬，才能保证读的位置永远在被写位置的前面。</b></p>' +
      '<h3 class="sec">3. 删除是"从前往后"搬</h3>' +
      '<p>正好反过来：把后面的元素往前覆盖。<code class="inl">data[0] = data[1]</code> 之后 data[1] 已经没用了，' +
      '再 <code class="inl">data[1] = data[2]</code>，正着走就不会丢数据。删完只要 <code class="inl">size--</code>，不用擦值。</p>' +
      '<h3 class="sec">4. size 和 capacity 的分工</h3>' +
      '<p>凡是"逻辑"（有几个元素、越不越界、遍历到哪）都看 size；凡是"物理"（能不能直接写下标 i）都看 capacity。' +
      '很多人写 push 时忘了先判断 <code class="inl">size === capacity</code>，结果数据被静默丢掉。</p>' +
      '<h3 class="sec">5. 删/缩容时的内存泄漏</h3>' +
      '<p>在 Java/JS 这类有 GC 的语言里，<code class="inl">pop</code> 之后如果对象引用还留在数组里，' +
      '那块内存就回收不掉。所以 pop 里要写 <code class="inl">data[size] = null</code> 主动断开引用。' +
      '大数组里存大对象时，这是个真实的性能问题。</p>' +
      '<h3 class="sec">6. 什么时候不该用数组</h3>' +
      '<p>频繁在头部插删（用链表或双端队列）、元素类型差异巨大（用链表/哈希）、' +
      '需要按 key 找（用哈希）。数组的强项只有两个：<b>按下标随机访问</b> 和 <b>尾部追加</b>，' +
      '以及一个隐藏优势——<b>缓存友好</b>（连续内存，CPU 预读友好，同样 O(n) 遍历比链表快好几倍）。');
    doc.appendChild(c3);

    /* ---- 代码 ---- */
    const c4 = D.card({ title: '分步实现 · C / C++ / Rust', icon: '⌨️', badge: '7 个步骤' });
    D.html(c4.querySelector('.body'),
      '<p>三种语言、同一套步骤。<b>点右上角切换语言，整页跟着一起换。</b>' +
      '把每一步按顺序拼起来，就是一份能直接 <code class="inl">cl</code> / <code class="inl">gcc</code> / ' +
      '<code class="inl">cargo</code> 编译运行的完整程序。' +
      'C 版本手写 <code class="inl">malloc</code> + <code class="inl">realloc</code>；' +
      'C++ 版本用 RAII 与 <code class="inl">std::unique_ptr&lt;T[]&gt;</code> 管所有权；' +
      'Rust 版本用 <code class="inl">Vec</code> 做零 unsafe 的安全封装。</p>' +
      D.codeSteps('array') +
      D.sources('array') +
      D.note('tip', '亲手验证"均摊 O(1)"',
        '在扩容分支里加一行打印（C：<code class="inl">fprintf(stderr, "grow -> %zu\\n", cap)</code>，' +
        'C++：<code class="inl">std::cerr</code>，Rust：<code class="inl">eprintln!</code>），' +
        '然后连续追加 100 个元素。你会看到扩容只发生了 5～6 次（4→8→16→32→64→128）——' +
        '这就是"均摊"最直观的证据。'));
    doc.appendChild(c4);

    /* ---- 练习 ---- */
    const c5 = D.card({ title: '动手练', icon: '✎', badge: '不做等于没学' });
    D.html(c5.querySelector('.body'),
      D.ex('合上页面，只给你签名 <code class="inl">insert(index, v)</code>，默写完整实现（越界检查 → 扩容 → 倒着搬 → 写入 → size++）。' +
        '写完对照上面<b>第 5 步</b>，检查三件事：① 搬移方向对不对 ② 有没有"先扩容再搬" ③ size 最后加没加。') +
      D.ex('实现 <code class="inl">remove_all(v)</code>：删除数组里所有等于 v 的元素，要求 <b>O(n)</b> 时间、<b>O(1)</b> 额外空间' +
        '（不允许新建数组，也不允许反复 remove 造成 O(n²)）。提示：双指针——读指针扫全部，写指针只在"该保留"时前进。',
        D.answerFor('array', 1)) +
      D.ex('如果扩容改成"每次 +4"，push 1000 个元素总共要搬多少次？改成"每次 ×2"呢？请用计算说明为什么后者是均摊 O(1)。',
        '<p>每次 +4：第 k 次扩容搬 4k 个元素，搬完能免费写 4 个，所以在第 k 次扩容前要 push 4k 次。' +
        '总搬移量 ≈ 4(1+2+…+k) ≈ 2k²，而总元素数 n ≈ 4k²/…——总之是 <b>O(n²)</b>。</p>' +
        '<p>每次 ×2：第 k 次扩容搬 2^k 个，扩容前刚好 push 了 2^k 次。总搬移量 ≈ 2^1+2^2+…+2^k ≈ 2^(k+1) ≈ 2n，' +
        '摊到 n 次 push 上就是常数 → <b>均摊 O(1)</b>。</p>'));
    doc.appendChild(c5);
  }
});
})();

</script>

<script>
/* ==================== 05-linkedlist.js ==================== */
/* ============================ 2. 链表 ============================ */
(function () {
'use strict';
const D = window.DSV;

/* ---------- 动画数据 ---------- */
const V1 = { n1: 1, n2: 2, n3: 3, n9: 9 };
function L1(ids, o) { return Object.assign({ ids: ids.slice(), hl: [], head: ids[0] || null, note: '' }, o || {}); }

const steps1 = [
  { text: '链表的每个节点在内存里是散落的，靠 next 指针串在一起。head 指向第一个节点，最后一个节点的 next 是 null（画成 ∅），表示"到此为止"。',
    s: L1(['n1', 'n2', 'n3'], { note: 'head → [1]，链表长度 3' }) },
  { text: '想找第 3 个元素？没有办法"跳过去"——必须从 head 出发，跟 3 次 next。这就是链表随机访问 O(n) 的根源，也是它相比数组唯一的硬伤。',
    s: L1(['n1', 'n2', 'n3'], { hl: ['n1', 'n2', 'n3'], note: '访问 [3]：走了 3 步（先过 [1]、[2]）' }) },
  { text: '插入：在 [2] 后面插入 [9]。第 1 步——先把新节点 [9] 的 next 指向 [3]，让新节点先接管后面那一整条链。',
    s: L1(['n1', 'n2', 'n9', 'n3'], { hl: ['n9'], note: '新节点先接上后面：9.next = 3', link: 2 }) },
  { text: '第 2 步——再把 [2] 的 next 改成指向新节点。顺序绝对不能反！如果先改 [2].next = [9]，那 [3] 的地址就丢了，[3] 及其后面所有节点会变成"没人引用的垃圾"。',
    s: L1(['n1', 'n2', 'n9', 'n3'], { hl: ['n2'], note: '前驱改指向：2.next = 9', link: 1 }) },
  { text: '插入完成。全程只改了 2 根指针，没有任何元素被搬动——这就是"已知前驱时插入是 O(1)"的含义。（找前驱本身是 O(n)，那部分没省。）',
    s: L1(['n1', 'n2', 'n9', 'n3'], { hl: ['n9'], note: '插入只需 2 次指针赋值，对比数组要搬 2 个元素' }) },
  { text: '现在删除 [9]：被删节点的前驱是 [2]，让它直接指向 [3]，也就是"跨过" [9]。',
    s: L1(['n1', 'n2', 'n3'], { hl: ['n2'], note: '2.next = 3（跨过 9）' }) },
  { text: '[9] 从链上摘下来了，它会自己淡出。真实代码里你还会把它的 next 置 null，主动断开引用，避免大对象长期被"挂着"回收不掉。',
    s: L1(['n1', 'n2', 'n3'], { hl: [], note: '9.next = null → 交给垃圾回收' }) },
  { text: '总结：链表在"头部插删"和"已知节点插删"上是 O(1)，但换来的是 ① 无法随机访问 ② 每个节点多一个指针的内存开销 ③ 缓存不友好（遍历比数组慢几倍）。',
    s: L1(['n1', 'n2', 'n3'], { hl: ['n1'], note: '头插 O(1) 是链表最大的优势' }) }
];

const V2 = { a: 1, b: 2, c: 3, d: 4 };
function L2(next, o) {
  return Object.assign({ next: Object.assign({ a: 'b', b: 'c', c: 'd', d: null }, next), prev: null, cur: 'a', nxt: null, hl: [], note: '' }, o || {});
}
const steps2 = [
  { text: '初始：1 → 2 → 3 → 4 → ∅。我们要把它变成 4 → 3 → 2 → 1 → ∅。三个指针的初始状态：prev = null，cur = 1，next 还没有值。',
    s: L2({}, { note: 'prev = ∅, cur = 1' }) },
  { text: '第 1 步：把 cur 的下一站存起来 next = cur.next = 2。<b>这一步是必须的</b>——因为下一步就要把 cur.next 改掉，改完就再也找不到 2 了。',
    s: L2({}, { nxt: 'b', hl: ['a'], note: 'next = cur.next → 2（先备份！）' }) },
  { text: '第 2 步：翻转指针 cur.next = prev。节点 1 的 next 从 2 变成 ∅，它成了新的尾节点。注意此时 1 已经和后面的链断开了，但因为 next 备份了 2，我们仍然能继续往前走。',
    s: L2({ a: null }, { nxt: 'b', hl: ['a'], note: 'cur.next = prev → 1 指向 ∅' }) },
  { text: '第 3、4 步：两个指针一起前进。prev = cur（prev 变成 1），cur = next（cur 变成 2）。三个指针整体向右挪一格。',
    s: L2({ a: null }, { prev: 'a', cur: 'b', nxt: null, note: 'prev = 1, cur = 2' }) },
  { text: '对节点 2 重复同样的四步：先备份 next = 3，再让 2.next 指向 prev（也就是 1）。现在已经有 2 → 1 → ∅ 了。',
    s: L2({ a: null, b: 'a' }, { prev: 'a', cur: 'b', nxt: 'c', hl: ['b'], note: 'next = 3，2.next = 1' }) },
  { text: '指针整体后移：prev = 2，cur = 3。',
    s: L2({ a: null, b: 'a' }, { prev: 'b', cur: 'c', note: 'prev = 2, cur = 3' }) },
  { text: '对节点 3 重复：备份 next = 4，翻转 3.next = 2。现在 3 → 2 → 1 → ∅。',
    s: L2({ a: null, b: 'a', c: 'b' }, { prev: 'b', cur: 'c', nxt: 'd', hl: ['c'], note: '3.next = 2' }) },
  { text: '指针后移：prev = 3，cur = 4。',
    s: L2({ a: null, b: 'a', c: 'b' }, { prev: 'c', cur: 'd', note: 'prev = 3, cur = 4' }) },
  { text: '最后一个节点：备份 next = ∅（它本来就是尾），翻转 4.next = 3。整条链的方向完全倒过来了。',
    s: L2({ a: null, b: 'a', c: 'b', d: 'c' }, { prev: 'c', cur: 'd', hl: ['d'], note: '4.next = 3' }) },
  { text: '指针后移：prev = 4，cur = next = ∅。循环条件 cur !== null 不成立，退出。',
    s: L2({ a: null, b: 'a', c: 'b', d: 'c' }, { prev: 'd', cur: null, note: 'cur 变成 ∅，循环结束' }) },
  { text: '返回 prev：它就是新链表的头。整段代码只用了 3 个指针变量、遍历一遍，所以是 O(n) 时间 + O(1) 空间。',
    s: L2({ a: null, b: 'a', c: 'b', d: 'c' }, { prev: 'd', cur: null, hl: ['d'], note: 'head = prev → 4' }) }
];

/* ---------- 渲染辅助 ---------- */
function renderListRow(row, ids, hls, linkAfter) {
  const items = [];
  ids.forEach((id, i) => {
    if (i > 0) items.push({ type: 'link', key: 'L' + ids[i - 1], on: linkAfter === i });
    items.push({ type: 'node', id: id, key: id, hl: hls.indexOf(id) >= 0 });
  });
  items.push({ type: 'link', key: 'L' + ids[ids.length - 1], on: false });
  items.push({ type: 'null', key: 'NULL' });
  const map = {};
  D.reconcile(row, items, it => it.key,
    it => {
      if (it.type === 'link') return D.el('span', 'arrow', '→');
      const n = D.el('div', 'node');
      if (it.type === 'null') n.innerHTML = '<span class="v" style="color:#6d80a3">∅</span>';
      return n;
    },
    (node, it) => {
      if (it.type === 'link') { node.className = 'arrow' + (it.on ? ' on' : ''); node.textContent = '→'; return; }
      if (it.type === 'null') return;
      node.className = 'node' + (it.hl ? ' hl' : '');
      node.innerHTML = '<span class="v">' + V1[it.id] + '</span><span class="n">next</span>';
      map[it.id] = node;
    });
  return map;
}

D.register({
  id: 'linkedlist', title: '链表', icon: '🔗', group: '一、线性结构', order: 20,
  blurb: '用指针把散落的内存串起来，换来 O(1) 的插入删除',
  badge: '指针操作',
  keywords: 'linked list 单链表 双链表 反转 快慢指针 指针 节点',
  lead: '链表考的不是语法，是"画图"能力。所有链表题都可以归结为一句话：改几根指针，先备份再断链。',
  build(doc) {
    const c1 = D.card({ title: '一句话讲清', icon: '💡', badge: 'Linked List' });
    D.html(c1.querySelector('.body'),
      '<p>数组要求内存连续，好处是能算地址、随机访问快；坏处是"插入/删除要搬家"。' +
      '链表反过来：<b>每个数据单独申请一块内存（叫节点），节点里额外存一个指针指向下一个节点</b>。' +
      '内存不再连续，但插入删除只要改指针，不用搬家。</p>' +
      '<p>一个节点长这样：<code class="inl">{ val: 1, next: → 下一个节点 }</code>。' +
      '链表本身只保存一个 <code class="inl">head</code>（头指针），顺着 head 一路 next 就能走完整条链。</p>' +
      D.mini([['O(1)', '头部插入/删除'], ['O(1)', '已知前驱的插入删除'], ['O(n)', '按下标访问 / 按值查找'], ['O(n)', '额外空间（每节点一个指针）']]) +
      D.note('warn', '和数组最本质的区别',
        '数组是"位置决定内容"（下标 → 值），链表是"关系决定顺序"（指针 → 下一个）。' +
        '所以数组能二分查找，链表不能；链表能在 O(1) 插入，数组不能。' +
        '<b>看到"频繁在中间插删"，就该想到链表。</b>'));

    const c2 = D.card({ title: '动画 ①：插入和删除，为什么"先连后断"', icon: '🎬', badge: '核心' });
    const b2 = c2.querySelector('.body');

    D.lab(b2, {

    const c3 = D.card({ title: '动画 ②：反转链表（三指针）', icon: '🔄', badge: '面试必考' });
    const b3 = c3.querySelector('.body');
    D.html(b3, '<p>反转链表是"指针操作"的终极练习。记住四步口诀：' +

    D.lab(b3, {
      title: '反转链表 · 三指针走位',

      setup(view) {

        inner.innerHTML = '<div class="row" data-k="row" style="gap:34px;min-height:64px"></div>' +
          '<div data-k="note" style="font-family:var(--mono);font-size:12.5px;color:#93a6c8;text-align:center"></div>';
        view.appendChild(inner);
        const ctx = { row: inner.querySelector('[data-k="row"]'), note: inner.querySelector('[data-k="note"]'), nodes: {} };
        ['a', 'b', 'c', 'd'].forEach(id => {
          const n = D.el('div', 'node');

        ctx.pNxt = D.ptr(view, 'next', 'green');

      },
      draw(c, step) {
        const s = step.s;
        ['a', 'b', 'c', 'd'].forEach(id => {
          const t = s.next[id];
          c.nodes[id].className = 'node' + (s.hl.indexOf(id) >= 0 ? ' hl' : '');

        D.placePtr(c.pPrev, s.prev ? c.nodes[s.prev] : null, c.view, -42, 12);
        D.placePtr(c.pCur, s.cur ? c.nodes[s.cur] : null, c.view, 0, 12);

      }
    });
    doc.appendChild(c3);

    const c4 = D.card({ title: '写链表代码的 5 个保命技巧', icon: '🛡️', badge: '踩坑总结' });
    D.html(c4.querySelector('.body'),
      '<h3 class="sec">技巧 1：用「哑结点 dummy」消灭所有头节点特判</h3>' +
      '<p>删除头节点时，没有"前驱"可以改指向，代码里就会冒出一堆 <code class="inl">if (head === target)</code>。' +
      '做法是：先造一个假的头 <code class="inl">dummy = new Node(0, head)</code>，让所有真实节点都有前驱。' +
      '最后再 <code class="inl">head = dummy.next</code> 写回去。<b>一行代码消灭一半的边界 bug。</b></p>' +
      '<h3 class="sec">技巧 2：改指针前，先问"改完之后还能找到它吗"</h3>' +
      '<p>插入时先连新节点的 next，再改前驱的 next；删除时先接上新的链，再断开旧的链。' +
      '任何"先断后连"的写法都会丢节点。写代码前在纸上画三个框（prev / cur / next），把线画出来再敲键盘。</p>' +
      '<h3 class="sec">技巧 3：需要"前驱"时，就用双指针（prev + cur）一起走</h3>' +
      '<p>单链表没法 backward，所以要删除某个节点时必须同时持有它的前驱。' +
      '标准写法：<code class="inl">let prev = null, cur = head; while (cur) { ... prev = cur; cur = cur.next; }</code>。</p>' +
      '<h3 class="sec">技巧 4：快慢指针解决 80% 的"位置"问题</h3>' +
      '<p>找中点、判断环、找倒数第 k 个、判断回文——全是快慢指针。' +
      '核心直觉：<b>快指针走的路程是慢指针的两倍</b>，所以快指针到头时慢指针在中间；' +
      '有环时两者必定相遇（就像跑道上跑得快的人一定会套圈）。</p>' +
      '<h3 class="sec">技巧 5：不要用"改值"冒充"删节点"除了一道题</h3>' +
      '<p>有一种取巧写法是"把下一个节点的值复制到当前节点，然后删掉下一个"，用于"只给一个待删节点、不给 head"的题。' +
      '但它在"删尾节点"和"节点被外部引用"时会失效，别当通用解法背。</p>' +
      D.note('tip', '单链表 vs 双链表怎么选',
        '双链表多存一个 <code class="inl">prev</code> 指针（内存 +1 个指针/节点），换来"已知节点就能 O(1) 删除"和"可以反向遍历"。' +
        'LRU 缓存、浏览器前进后退、文本编辑器都是双链表。面试手写一般要求单链表，但你要知道双链表的存在价值。'));
    doc.appendChild(c4);

    const c5 = D.card({ title: '分步实现 · C / C++ / Rust', icon: '⌨️', badge: '手写重点' });
    D.html(c5.querySelector('.body'),
      '<p>三种语言、同一套步骤。<b>点右上角切换语言，整页跟着一起换。</b>按顺序把每一步拼起来，就是一份能直接编译运行的完整程序。' +
      'C 版本用裸指针 + 手写 <code class="inl">free</code>；C++ 版本用 <code class="inl">std::unique_ptr</code> 管所有权（移动语义自动成立）；' +
      'Rust 版本用 <code class="inl">Option&lt;Box&lt;Node&gt;&gt;</code> 和「槽位引用」游标，零 unsafe。</p>' +
      D.codeSteps('linkedlist') +
      D.sources('linkedlist') +
      D.note('tip', '一个自测脚本', '把 <code class="inl">reverse()</code> 写完后，用 1→2→3→4→5 和"只有一个节点"、' +
        '"空链表"三种情况各跑一遍。链表题 90% 的 bug 都出在这两个边界上。'));
    doc.appendChild(c5);

    const c6 = D.card({ title: '动手练', icon: '✎', badge: '白纸手写' });
    D.html(c6.querySelector('.body'),
      D.ex('合上页面，默写 <code class="inl">reverse()</code>。写完对照上面<b>第 5 步</b>，检查四件事：' +
        '① 循环开始前 prev 是不是 NULL / nullptr / None ② 顺序是不是严格"备份 → 掉头 → prev 前移 → cur 前移" ' +
        '③ 返回的是 prev 而不是 cur ④ 空链表会不会崩。') +
      D.ex('删除链表中倒数第 k 个结点，要求 <b>只遍历一趟</b>。提示：还是双指针——快指针先走 k 步，然后两个一起走，' +
        '快指针到尾时慢指针正好停在倒数第 k+1 个。<b>另外想想：这个写法为什么在安全 Rust 里写不出来？</b>',
        D.answerFor('linkedlist', 1)) +
      D.ex('给定两个<b>有序</b>链表，合并成一个有序链表。（提示：哑结点 + 每次比较两个头，谁小接谁；最后把没走完的那条链整段接上。）',
        D.answerFor('linkedlist', 2)));
    doc.appendChild(c6);
  }
});
})();

<script>
/* ==================== 06-stack.js ==================== */
/* ============================ 3. 栈 ============================ */
(function () {
'use strict';
const D = window.DSV;

/* ---------- 动画 1：push / pop ---------- */
function S1(items, o) { return Object.assign({ items: items.slice(), act: '', msg: '' }, o || {}); }
const steps1 = [
  { text: '空栈。栈底和栈顶是同一个位置，size = 0。栈是一条"只能从一端进出"的通道，这一端叫栈顶。',
    s: S1([], { act: 'new Stack()', msg: 'size = 0，isEmpty() = true' }) },
  { text: 'push(1)：1 被放到栈顶。它是目前唯一能"立刻拿出来"的元素。',
    s: S1([1], { act: 'push(1)', msg: 'size = 1，top = 1' }) },
  { text: 'push(2)：新元素永远压在<b>上面</b>。注意 1 被压在底下了——它上面的元素不搬走，就永远出不来。这就是 LIFO（后进先出）。',
    s: S1([1, 2], { act: 'push(2)', msg: 'size = 2，top = 2' }) },
  { text: 'push(3)：再压一个。现在栈里从上到下是 3、2、1。',
    s: S1([1, 2, 3], { act: 'push(3)', msg: 'size = 3，top = 3' }) },
  { text: 'pop()：弹出<b>栈顶</b>的 3。栈是"谁最后进来谁先出去"。',
    s: S1([1, 2], { act: 'pop() → 3', msg: 'size = 2，top 变成 2' }) },
  { text: 'peek()：只"看"栈顶，不弹出。需要根据栈顶做判断（比如括号匹配）时用它。',
    s: S1([1, 2], { act: 'peek() → 2', msg: 'size 不变，仍是 2' }) },
  { text: 'pop() 两次：2 和 1 依次出栈，栈又空了。',
    s: S1([], { act: 'pop(), pop()', msg: 'size = 0' }) },
  { text: '空栈再 pop() 会怎样？必须返回 undefined / None / 抛异常——绝不能"读到一片野内存"。这是实现栈时最容易漏的边界检查。',
    s: S1([], { act: 'pop() → undefined', msg: '只有 3 个地方要改：push / pop / peek，别的都不变' }) }
];

/* ---------- 动画 2：括号匹配 ---------- */
function S2(str, i, stack, o) { return Object.assign({ str: str, i: i, stack: stack.slice(), msg: '', bad: false, done: [] }, o || {}); }
const steps2 = [
  { text: '输入 "{ [ ( ) ] }"。用一个栈来记住"有哪些左括号还没被配对"。指针从左往右扫，一次只看一个字符。',
    s: S2('{[()]}', -1, [], { msg: '栈为空，准备开始' }) },
  { text: '读到 "{"，是左括号 → 入栈，期待后面出现 "}"。',
    s: S2('{[()]}', 0, ['{'], { msg: 'push("{"）' }) },
  { text: '读到 "["，入栈。现在栈里是 { [，说明"最近的未配对左括号"是 "[".',
    s: S2('{[()]}', 1, ['{', '['], { msg: 'push("[")' }) },
  { text: '读到 "("，入栈。栈里 { [ (。',
    s: S2('{[()]}', 2, ['{', '[', '('], { msg: 'push("(")' }) },
  { text: '读到 ")"，是右括号 → 检查<b>栈顶</b>是不是它的搭档 "("。是 → 弹出栈顶，配对成功。为什么只看栈顶？因为括号必须"最近的最先闭合"，这正是 LIFO。',
    s: S2('{[()]}', 3, ['{', '['], { msg: '栈顶 "(" == 期望 "(" → pop()，匹配成功', done: [3, 4] }) },
  { text: '读到 "]" → 栈顶是 "["，配对，弹出。',
    s: S2('{[()]}', 4, ['{'], { msg: '栈顶 "[" 匹配 → pop()', done: [4, 5] }) },
  { text: '读到 "}" → 栈顶是 "{"，配对，弹出。栈空了。',
    s: S2('{[()]}', 5, [], { msg: '栈顶 "{" 匹配 → pop()', done: [5, 6] }) },
  { text: '扫描结束，栈正好为空 → 说明所有左括号都被配对了。判定：<b>合法</b>。两个条件缺一不可：中途不能配错，结尾必须栈空。',
    s: S2('{[()]}', 6, [], { msg: '√ 合法', done: [6] }) },
  { text: '换个失败例子："( [ ) ]"。前面 "( [" 依次入栈。',
    s: S2('([)]', 1, ['(', '['], { msg: 'push("("), push("[")' }) },
  { text: '读到 ")"：栈顶是 "["，而 ")" 的搭档是 "("，不匹配 → 直接返回 false。',
    s: S2('([)]', 2, ['(', '['], { msg: '栈顶 "[" != "(" → 判定非法', bad: true }) },
  { text: '如果忘了"结尾检查栈空"，"((" 这种只有左括号的串会被误判为合法。所以最后一定要 <b>return st.length === 0</b>。',
    s: S2('([)]', 3, ['(', '['], { msg: '× 非法', bad: true }) }
];

D.register({
  id: 'stack', title: '栈', icon: '🥞', group: '二、受限线性结构', order: 30,
  blurb: '只能在一端进出的"叠盘子"，LIFO',
  badge: 'LIFO',
  keywords: 'stack 栈 后进先出 LIFO 括号匹配 单调栈 最小栈',
  lead: '栈不是一种新容器，而是给数组/链表加了一条规则：只允许在一端插入和删除。规则越少，语义越强。',
  build(doc) {
    const c1 = D.card({ title: '一句话讲清', icon: '💡', badge: 'Stack' });
    D.html(c1.querySelector('.body'),
      '<p>栈就是<b>一摞盘子</b>：你只能把新盘子放在最上面，也只能从最上面拿走。' +
      '所以"最后放上去的"必然是"最先被拿走的"——这就是 <b>LIFO（Last In First Out，后进先出）</b>。</p>' +
      '<p>实现上它没有新东西：<b>用数组从尾部操作</b>就是栈（push/pop 都是 O(1)），' +
      '<b>用链表从头插</b>也是栈。栈的全部 API 只有 5 个：' +
      '<code class="inl">push / pop / peek / isEmpty / size</code>。</p>' +
      D.mini([['O(1)', 'push 入栈'], ['O(1)', 'pop 出栈'], ['O(1)', 'peek 看栈顶'], ['O(n)', '查找某个元素']]) +
      D.note('note', '为什么数组尾就是"栈顶"',
        '因为数组尾部 push/pop 是 O(1)，而头部是 O(n)。所以用数组实现栈时，' +
        '<b>数组末尾 = 栈顶</b>，下标 0 = 栈底。这个映射关系记住，代码就不会写反。'));

    const c2 = D.card({ title: '动画 ①：push / pop / peek', icon: '🎬', badge: '基础' });
    const b2 = c2.querySelector('.body');
    D.html(b2, '<p>注意观察：被压在下面的元素，在它上面的元素出栈之前，是绝对拿不到的。</p>');
    D.lab(b2, {
      title: '栈 · 基本操作',
      height: 300,
      steps: steps1,
      setup(view) {
        const wrap = D.el('div');
        wrap.style.cssText = 'display:flex;gap:44px;align-items:flex-end;justify-content:center;width:100%';
        wrap.innerHTML =
          '<div style="display:flex;flex-direction:column;align-items:center;gap:10px">' +
          '<div data-k="act" style="font-family:var(--mono);font-size:13px;color:#ffb454"></div>' +
          '<div class="col" data-k="col" style="justify-content:flex-end;min-height:200px;border-bottom:3px solid #2e3f63;padding:0 14px 8px"></div>' +
          '</div>' +
          '<div style="display:flex;flex-direction:column;gap:8px;font-family:var(--mono);font-size:12.5px;color:#93a6c8;padding-bottom:56px">' +
          '<span class="chip" data-k="size">size = 0</span><span data-k="msg" style="color:#6d80a3;max-width:220px;line-height:1.6"></span></div>';
        view.appendChild(wrap);
        return { col: wrap.querySelector('[data-k="col"]'), act: wrap.querySelector('[data-k="act"]'), size: wrap.querySelector('[data-k="size"]'), msg: wrap.querySelector('[data-k="msg"]') };
      },
      draw(c, step) {
        const s = step.s;
        const items = s.items.map((v, i) => ({ key: i + '-' + v, v: v, top: i === s.items.length - 1 }));
        D.reconcile(c.col, items, it => it.key,
          () => D.el('div', 'cell'),
          (node, it) => {
            node.className = 'cell' + (it.top ? ' hl' : '');
            node.style.minWidth = '110px';
            node.innerHTML = '<span>' + it.v + '</span>' + (it.top ? '<span class="lbl">栈顶 ← 只能从这里进出</span>' : '');
          });
        c.act.textContent = s.act;
        c.size.textContent = 'size = ' + s.items.length;
        c.msg.textContent = s.msg;
      }
    });
    doc.appendChild(c2);

    const c3 = D.card({ title: '动画 ②：经典应用——括号匹配', icon: '🧩', badge: '必会' });
    const b3 = c3.querySelector('.body');
    D.html(b3, '<p>这是"栈"最经典的应用：<b>凡是需要"记住最近的、尚未处理完的东西"，就用栈</b>。' +
      '括号、函数调用、表达式求值、撤销操作，全是同一个套路。</p>');
    D.lab(b3, {
      title: '括号匹配 · 扫描 + 栈',
      height: 320,
      steps: steps2,
      setup(view) {
        const wrap = D.el('div');
        wrap.style.cssText = 'display:flex;gap:50px;align-items:flex-start;justify-content:center;width:100%;flex-wrap:wrap';
        wrap.innerHTML =
          '<div style="display:flex;flex-direction:column;align-items:center;gap:12px">' +
          '<div style="font-size:12px;color:#6d80a3">待扫描字符串</div>' +
          '<div class="row" data-k="chars" style="gap:8px"></div>' +
          '<div data-k="msg" style="font-family:var(--mono);font-size:12.5px;color:#93a6c8;text-align:center;min-height:20px"></div>' +
          '</div>' +
          '<div style="display:flex;flex-direction:column;align-items:center;gap:12px">' +
          '<div style="font-size:12px;color:#6d80a3">栈（栈底在下）</div>' +
          '<div class="col" data-k="col" style="justify-content:flex-end;min-height:180px;border-bottom:3px solid #2e3f63;padding:0 10px 6px"></div>' +
          '</div>';
        view.appendChild(wrap);
        const ctx = { chars: wrap.querySelector('[data-k="chars"]'), col: wrap.querySelector('[data-k="col"]'), msg: wrap.querySelector('[data-k="msg"]') };
        ctx.cur = D.ptr(view, 'i', 'blue');
        return ctx;
      },
      draw(c, step) {
        const s = step.s;
        const chars = [];
        for (let i = 0; i < s.str.length; i++) {
          let cls = '';
          if (s.done.indexOf(i) >= 0) cls = 'ok';
          if (i === s.i) cls = s.bad ? 'bad' : 'hl';
          chars.push({ key: i, ch: s.str[i], cls: cls });
        }
        const map = {};
        D.reconcile(c.chars, chars, it => it.key,
          () => D.el('div', 'cell'),
          (node, it) => {
            node.className = 'cell' + (it.cls ? ' ' + it.cls : '');
            node.style.minWidth = '44px';
            node.innerHTML = '<span style="font-size:17px">' + D.esc(it.ch) + '</span>';
            map[it.key] = node;
          });
        const sitems = s.stack.map((ch, i) => ({ key: i + '-' + ch, ch: ch, top: i === s.stack.length - 1 }));
        D.reconcile(c.col, sitems, it => it.key,
          () => D.el('div', 'cell'),
          (node, it) => {
            node.className = 'cell' + (it.top ? ' hl2' : '');
            node.style.minWidth = '52px';
            node.innerHTML = '<span style="font-size:17px">' + D.esc(it.ch) + '</span>';
          });
        c.msg.textContent = s.msg;
        D.placePtr(c.cur, map[s.i], c.view, 0, 6);
      }
    });
    doc.appendChild(c3);

    const c4 = D.card({ title: '栈能解决哪类问题', icon: '🎯', badge: '模型识别' });
    D.html(c4.querySelector('.body'),

<script>
/* ==================== 07-queue.js ==================== */
/* ============================ 4. 队列 ============================ */
(function () {
'use strict';
const D = window.DSV;

/* ---------- 动画数据 ---------- */
const CAP = 5;
function Q(data, head, tail, o) {
  return Object.assign({ data: data.slice(), head: head, tail: tail, cap: CAP, hl: [], ok: [], bad: [], dim: [], op: '', msg: '' }, o || {});
}
const steps = [
  { text: '循环队列就是"把数组首尾接起来"。capacity = 4，但内部开了 5 格：多出来的那一格专门用来区分"空"和"满"。初始 head = tail = 0，队列为空。',
    s: Q([null, null, null, null, null], 0, 0, { op: 'new CircularQueue(4)', msg: 'isEmpty: head === tail' }) },
  { text: 'enqueue(10)：写到 tail 指向的格子，然后 tail 前移一格。取模运算 (tail + 1) % 5 保证了走到末尾会自动回到 0。',
    s: Q([10, null, null, null, null], 0, 1, { op: 'enqueue(10)', hl: [0], msg: 'size = 1' }) },
  { text: 'enqueue(20)、enqueue(30)：tail 一路前移。此时 head = 0，tail = 3，size = 3。注意队头永远在 head，队尾在 tail 的前一格。',
    s: Q([10, 20, 30, null, null], 0, 3, { op: 'enqueue(20), enqueue(30)', hl: [2], msg: 'size = 3' }) },
  { text: 'dequeue()：取出 head 指向的 10，head 前移到 1。**注意：后面的元素一个都没搬！**' +
      '如果用普通数组实现，出队后要不就把所有元素往前挪（O(n)），要不就浪费前面的空间（假溢出）。循环队列用"移动指针"代替"搬数据"。',
    s: Q([null, 20, 30, null, null], 1, 3, { op: 'dequeue() → 10', hl: [1], msg: 'size = 2，下标 0 已经空了' }) },
  { text: 'enqueue(40)：写到下标 3，tail 变成 4。',
    s: Q([null, 20, 30, 40, null], 1, 4, { op: 'enqueue(40)', hl: [3], msg: 'size = 3' }) },
  { text: '重点来了！enqueue(50)：先写进 tail 指向的下标 4，然后 tail = (4 + 1) % 5 = 0 —— 指针<b>绕回了开头</b>。物理上它还是一个普通数组，只是我们约定"下标 4 的后面跟着下标 0"，这就是"循环队列"名字的由来。',
    s: Q([null, 20, 30, 40, 50], 1, 0, { op: 'enqueue(50)   tail: 4 → 0 (取模)', hl: [4], msg: 'size = 4，tail 绕回了下标 0' }) },
  { text: '现在 head = 1、tail = 0、size = 4，逻辑顺序是 20 → 30 → 40 → 50（从 head 出发绕一圈读）。还能再入队吗？判满公式 (tail + 1) % cap === head：' +
      '(0 + 1) % 5 = 1，正好等于 head → <b>队满</b>。注意下标 1 物理上是空的，但它是"用来分辨空和满"的哨兵格，永远不存数据。',
    s: Q([null, 20, 30, 40, 50], 1, 0, { op: 'isFull() → true', hl: [1], msg: 'size = 4 = capacity，队满' }) },
  { text: '所以再 enqueue(60) 会抛"队列已满"。这"牺牲一格"就是双指针法的代价。如果你不想浪费，可以额外维护一个 size 计数器：用 size === capacity 判满、size === 0 判空。',
    s: Q([null, 20, 30, 40, 50], 1, 0, { op: 'enqueue(60) → 抛异常', bad: [1], msg: '容量已满，拒绝入队' }) },
  { text: 'dequeue()：取出 head 指向的 20，head 前移到 2，同时把下标 1 清空。这时候队里腾出了一格，而且这一格马上就能被 tail 重新利用。',
    s: Q([null, null, 30, 40, 50], 2, 0, { op: 'dequeue() → 20', hl: [1], msg: 'size = 3，下标 1 空出来了' }) },
  { text: 'enqueue(60)：先判满——(tail + 1) % 5 = (0 + 1) % 5 = 1，而 head = 2，1 ≠ 2，所以没满。写进 data[0]（这一格已经没人用了），再把 tail 变成 1。size 回到 4。',
    s: Q([60, null, 30, 40, 50], 2, 1, { op: 'enqueue(60)   data[0] = 60, tail: 0 → 1', ok: [0], hl: [0], msg: 'size = 4' }) },
  { text: '最终逻辑顺序：从 head = 2 出发走 4 步 —— 30、40、50、60。它们躺在数组里的物理位置是 2、3、4、0，是"断开"的，但按环形顺序读就是连续的。' +
      '所以遍历循环队列必须从 head 出发走 size 步（每步取模），绝不能直接 for i = 0..cap。',
    s: Q([60, null, 30, 40, 50], 2, 1, { op: 'toArray() → [30, 40, 50, 60]', hl: [0, 2, 3, 4], ok: [0], msg: '物理断开、逻辑连续' }) }
];

D.register({
  id: 'queue', title: '队列', icon: '🚶', group: '二、受限线性结构', order: 40,
  blurb: '只能队尾进、队头出，FIFO；循环数组实现是重点',
  badge: 'FIFO',
  keywords: 'queue 队列 先进先出 FIFO 循环队列 双端队列 deque 假溢出',
  lead: '队列是"排队"：新人从队尾加入，老人从队头离开。实现难点只有一个——怎么在数组里优雅地"绕圈"。',
  build(doc) {
    const c1 = D.card({ title: '一句话讲清', icon: '💡', badge: 'Queue' });
    D.html(c1.querySelector('.body'),
      '<p>队列只有两条规则：<b>只能在队尾插入（enqueue），只能在队头删除（dequeue）</b>。' +
      '先来的先走，叫 <b>FIFO（First In First Out，先进先出）</b>——和栈正好相反。</p>' +
      '<p>用链表实现最自然（头删尾插都是 O(1)），但面试更爱考 <b>循环队列</b>：' +
      '用一个定长数组 + 两个指针 <code class="inl">head</code> / <code class="inl">tail</code>，' +
      '指针走到末尾就用 <code class="inl">% capacity</code> 绕回开头。</p>' +
      D.mini([['O(1)', 'enqueue 入队'], ['O(1)', 'dequeue 出队'], ['O(1)', 'peek 看队头'], ['O(k)', '定长数组的空间']]) +
      D.note('warn', '数组实现队列的"假溢出"',
        '如果用普通数组：出队后 head 前移，前面的空间就再也用不到了；' +
        '等你一路 enqueue 到数组末尾，明明前面还有空位，却报"满了"——这叫<b>假溢出</b>。' +
        '两个解法：① 出队时把后面所有元素前移（O(n)，太慢）；② <b>循环队列</b>（O(1)，正解）。'));

    const c2 = D.card({ title: '动画：循环队列怎么"绕圈"', icon: '🎬', badge: '面试重点' });
    const b2 = c2.querySelector('.body');
    D.html(b2, '<p>盯着 <b>head</b> 和 <b>tail</b> 两个指针：它们只前进、不后退，走到下标 4 就"瞬移"回下标 0。' +
      '数据本身一动不动。</p>');
    D.lab(b2, {
      title: '循环队列 · head / tail 绕圈',
      height: 300,
      steps: steps,
      setup(view) {
        const inner = D.el('div');
        inner.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:18px;width:100%';
        inner.innerHTML =
          '<div class="row" style="gap:10px;flex-wrap:wrap;justify-content:center">' +
          '<span class="chip warm" data-k="op">—</span>' +
          '<span class="chip" data-k="info">size = 0</span>' +
          '</div>' +
          '<div style="position:relative;border:1.5px dashed #2e3f63;border-radius:14px;padding:14px 18px 52px">' +
          '<div style="position:absolute;left:16px;top:-11px;background:#0a1120;padding:0 8px;font-family:var(--mono);font-size:11px;color:#6d80a3">' +
          'capacity = 4（物理 5 格，牺牲 1 格用来判满）</div>' +
          '<div class="row" data-k="cells" style="gap:10px"></div>' +
          '</div>' +
          '<div data-k="msg" style="font-family:var(--mono);font-size:12.5px;color:#93a6c8;text-align:center"></div>';
        view.appendChild(inner);
        const ctx = {
          cells: inner.querySelector('[data-k="cells"]'), op: inner.querySelector('[data-k="op"]'),
          info: inner.querySelector('[data-k="info"]'), msg: inner.querySelector('[data-k="msg"]'), map: {}
        };
        ctx.pHead = D.ptr(view, 'head 出队', 'blue');
        ctx.pTail = D.ptr(view, 'tail 入队', 'green');
        return ctx;
      },
      draw(c, step) {
        const s = step.s;
        const size = (s.tail - s.head + s.cap) % s.cap;
        const items = [];
        for (let i = 0; i < s.cap; i++) {
          let cls = s.data[i] === null ? 'empty' : '';
          if (s.hl.indexOf(i) >= 0) cls += ' hl';
          if (s.ok.indexOf(i) >= 0) cls += ' ok';
          if (s.bad.indexOf(i) >= 0) cls += ' bad';
          items.push({ key: i, i: i, v: s.data[i], cls: cls });
        }
        c.map = {};
        D.reconcile(c.cells, items, it => it.key,
          () => D.el('div', 'cell'),
          (node, it) => {
            node.className = 'cell' + (it.cls ? ' ' + it.cls : '');
            node.style.minWidth = '56px';
            node.innerHTML = '<span>' + (it.v === null ? '' : it.v) + '</span><span class="lbl">下标 ' + it.i + '</span>';
            c.map['k' + it.i] = node;
          });
        c.op.textContent = s.op;
        c.info.textContent = 'size = ' + size + ' / 4        head = ' + s.head + '   tail = ' + s.tail;
        c.msg.textContent = s.msg;
        D.placePtr(c.pHead, c.map['k' + s.head], c.view, -34, 34);
        D.placePtr(c.pTail, c.map['k' + s.tail], c.view, 34, 34);
      }
    });
    doc.appendChild(c2);

    const c3 = D.card({ title: '踩坑清单', icon: '🕳️', badge: '写完必查' });
    D.html(c3.querySelector('.body'),
      '<h3 class="sec">坑 1：判空和判满的条件</h3>' +
      '<p>双指针法里 <code class="inl">head === tail</code> 既能是空也能是满，所以必须"牺牲一格"：' +
      '空 → <code class="inl">head === tail</code>；满 → <code class="inl">(tail + 1) % cap === head</code>。' +
      '另一种更直观的做法是额外维护一个 <code class="inl">size</code> 计数器，空看 size===0、满看 size===cap，不用牺牲格子。</p>' +
      '<h3 class="sec">坑 2：size 的计算要加 cap 再取模</h3>' +
      '<p>写成 <code class="inl">tail - head</code> 会在 tail 绕回后变成负数。正确写法：' +
      '<code class="inl">(tail - head + cap) % cap</code>。<b>加 cap 是为了消灭负数</b>，这是所有循环下标问题的通用技巧。</p>' +
      '<h3 class="sec">坑 3：链表队列删空后必须把 tail 置 null</h3>' +
      '<p><code class="inl">dequeue</code> 里删掉最后一个节点后，head 变成 null，但 tail 还指着那个已经被摘掉的节点。' +
      '下一次 enqueue 会执行 <code class="inl">this.tail.next = node</code>，写到一个已经脱离链表的节点上，新元素直接消失在虚空里。' +
      '<b>这是链表队列最经典的一个 bug。</b></p>' +
      '<h3 class="sec">坑 4：遍历循环队列不能用 for i in 0..cap</h3>' +
      '<p>物理下标顺序 ≠ 逻辑顺序。必须从 head 出发，走 size 步，每步 <code class="inl">p = (p + 1) % cap</code>。</p>' +
      D.note('tip', '别忘了双端队列 deque',
        '如果两端都能进出，那就是双端队列（deque）：<code class="inl">pushFront / pushBack / popFront / popBack</code> 全 O(1)。' +
        'C++ 的 <code class="inl">std::deque</code>、Rust 的 <code class="inl">VecDeque</code> 都是它（Rust 标准库的 VecDeque 底层就是一个可增长的环形缓冲）。' +
        '滑动窗口最大值（单调队列）、0-1 BFS 都要用它。'));
    doc.appendChild(c3);

    const c4 = D.card({ title: '队列都被用在哪', icon: '🎯', badge: '模型识别' });
    D.html(c4.querySelector('.body'),
      D.table(['场景', '为什么是队列', '典型问题'], [
        ['广度优先搜索 BFS', '一层一层地访问，先发现的先扩展', '无权图最短路、迷宫最短步数、岛屿数量'],
        ['任务调度 / 消息队列', '先到的请求先被处理，保证公平', '线程池、生产者消费者、Kafka/RabbitMQ'],
        ['缓冲区', '生产和消费速度不一致时中间排队', '键盘输入缓冲、打印机队列、网络包缓冲'],
        ['滑动窗口', '窗口右移时左边的元素按时间顺序出去', '单调队列求滑动窗口最大值'],
        ['树的层序遍历', '按层从左到右输出', '二叉树层序、按层打印、右视图'],
      ]) +
      D.note('tip', '一眼分辨栈和队列',
        '"先进先出、按顺序来、一层一层、排队" → <b>队列</b>；' +
        '"最近的、嵌套、配对、回退、一条路走到黑" → <b>栈</b>。' +
        'BFS 用队列，DFS 用栈，这是图论里最重要的对应关系。'));
    doc.appendChild(c4);

    const c5 = D.card({ title: '分步实现 · C / C++ / Rust', icon: '⌨️', badge: '手写重点' });
    D.html(c5.querySelector('.body'),
      '<p>三种语言、同一套步骤。<b>点右上角切换语言，整页跟着一起换。</b>按顺序把每一步拼起来，就是一份能直接编译运行的完整程序。' +
      'C 版本手写环形缓冲；C++ 版本另外给出 <code class="inl">std::deque</code> 的工程对照；' +
      'Rust 版本手写 <code class="inl">Vec&lt;Option&lt;T&gt;&gt;</code> 环形缓冲，并说明为什么 <code class="inl">VecDeque</code> 才是工程答案。</p>' +
      D.codeSteps('queue') +
      D.sources('queue') +
      D.note('tip', '自测思路', '构造一个容量 4 的循环队列，反复"入 3 个、出 1 个"，跑 20 轮，' +
        '每轮都用 <code class="inl">toArray()</code> 打印逻辑顺序，看看是不是始终先进先出。' +
        '如果顺序错乱，八成是取模写漏了。'));
    doc.appendChild(c5);

    const c6 = D.card({ title: '动手练', icon: '✎', badge: '白纸手写' });
    D.html(c6.querySelector('.body'),
      D.ex('合上页面，默写循环队列。写完对照上面<b>第 2~5 步</b>，逐个确认：① 内部为什么多开一格 ② 判空 / 判满公式 ③ size 为什么要 <code class="inl">(tail - head + cap) % cap</code> ④ 出队有没有把引用置空。') +
            D.ex('用两个队列实现一个栈（push / pop）。提示：每次 pop 时，把当前队列的前 n-1 个元素搬到另一个空队列，剩下的那个就是栈顶；然后用 O(1) 交换两个队列的角色。',

            D.ex('改写循环队列，<b>不再牺牲那一格</b>：额外维护一个 <code class="inl">size</code> 字段，用 <code class="inl">size == cap</code> 判满、<code class="inl">size == 0</code> 判空。说说这两种方案各自的取舍。',
              D.answerFor('queue', 2)));

  }

<script>
/* ==================== 08-hash.js ==================== */
/* ============================ 5. 哈希表 ============================ */
(function () {
'use strict';
const D = window.DSV;

/* ---------- 动画数据 ---------- */
function E() { return [[], [], [], [], []]; }
function HT(m, buckets, o) {
  return Object.assign({ m: m, buckets: buckets.map(b => b.slice()), hlB: -1, hlK: null, op: '', msg: '', hash: '' }, o || {});
}
const steps = [
  { text: '哈希表的核心思想只有一句话：<b>用哈希函数 h(key) 把 key 直接算成数组下标</b>，这样存和取都不用查找，直接跳过去。这里桶数组长度 m = 5，哈希函数取最简单的 h(k) = k % 5。',
    s: HT(5, E(), { op: 'new HashTable(5)', hash: 'h(k) = k % 5', msg: '5 个桶，全空' }) },
  { text: 'put(12)：先算 h(12) = 12 % 5 = 2，然后直接写进 2 号桶。整个过程和表里已经有多少元素<b>无关</b>，所以是 O(1)。',
    s: HT(5, [[], [], [12], [], []], { op: 'put(12)', hash: 'h(12) = 12 % 5 = 2', hlB: 2, msg: '落到 2 号桶' }) },
  { text: 'put(7)：h(7) = 7 % 5 = 2 —— 又是 2 号桶！但那里已经被 12 占了。这就是<b>哈希冲突</b>。' +
      '冲突不是bug，是数学必然：key 有无穷多个，桶只有 5 个，根据鸽巢原理，冲突一定存在。',
    s: HT(5, [[], [], [12], [], []], { op: 'put(7) → 冲突！', hash: 'h(7) = 7 % 5 = 2', hlB: 2, msg: '两个不同的 key 算出了同一个下标' }) },
  { text: '解决冲突的第一种主流办法：<b>拉链法（Separate Chaining）</b>。每个桶里不是存一个元素，而是一条链表，冲突的元素全挂在这条链上。把 7 头插到 2 号桶的链上。',
    s: HT(5, [[], [], [7, 12], [], []], { op: 'bucket[2].unshift([7])', hash: '冲突 -> 挂到链上', hlB: 2, hlK: 7, msg: '同一个桶里的元素必须逐个比较 key' }) },
  { text: 'put(20)：h(20) = 20 % 5 = 0，0 号桶是空的，直接放。',
    s: HT(5, [[20], [], [7, 12], [], []], { op: 'put(20)', hash: 'h(20) = 20 % 5 = 0', hlB: 0, msg: '落到 0 号桶，没有冲突' }) },
  { text: 'put(17)：h(17) = 17 % 5 = 2，又撞到 2 号桶。头插进去。现在 2 号桶的链是 17 → 7 → 12。' +
      '注意：<b>链越长，查找越慢</b>——最坏情况所有 key 都撞到一个桶，退化成 O(n)。所以哈希函数要尽量均匀。',
    s: HT(5, [[20], [], [17, 7, 12], [], []], { op: 'put(17)', hash: 'h(17) = 17 % 5 = 2', hlB: 2, hlK: 17, msg: '链长变成 3' }) },
  { text: 'get(17)：算 h(17) = 2，走到 2 号桶，沿链逐个比较 key。第一个就是 17，命中。' +
      '如果链很长，这一步就要走很多次——所以哈希表是"<b>平均 O(1)，最坏 O(n)</b>"。',
    s: HT(5, [[20], [], [17, 7, 12], [], []], { op: 'get(17) → 命中', hash: 'h(17) = 2 → 扫描 2 号桶', hlB: 2, hlK: 17, msg: '比较 1 次就找到' }) },
  { text: 'get(99)：算 h(99) = 99 % 5 = 4，4 号桶是空的 —— 说明 key 不存在。' +
      '<b>注意这里为什么能直接判定"不存在"</b>：因为 put 的时候 99 一定会落到 4 号桶，既然 4 号桶空，那它必然没被存过。这是哈希表设计的关键不变量。',
    s: HT(5, [[20], [], [17, 7, 12], [], []], { op: 'get(99) → 未命中', hash: 'h(99) = 99 % 5 = 4', hlB: 4, msg: '空桶 -> 一定不存在，不用扫全表' }) },
  { text: '现在 size = 4，桶数 m = 5，<b>负载因子 = 4/5 = 0.8</b>。负载因子越高，链越长，性能越差。' +
      '所以哈希表会设一个阈值（常见 0.75），一旦超过就<b>扩容</b>。',
    s: HT(5, [[20], [], [17, 7, 12], [], []], { op: '检查负载因子', hash: 'load = size / m = 4 / 5 = 0.80 > 0.75', hlB: -1, msg: '触发扩容！' }) },
  { text: '扩容不是简单地把桶数改大——必须<b>把每个元素重新算一遍哈希</b>，因为 h(k) = k % m 里的 m 变了。' +
      '这个过程叫 <b>rehash</b>。选一个更大的质数（5 → 11）能进一步减少冲突。',
    s: HT(11, [[], [], [], [], [], [], [], [], [], [], []], { op: 'new Array(11)', hash: 'rehash: 12%11, 7%11, 20%11, 17%11', msg: '新表 11 个桶，准备逐个搬迁' }) },
  { text: '逐个搬迁：12 → 12 % 11 = 1；7 → 7 % 11 = 7；20 → 20 % 11 = 9；17 → 17 % 11 = 6。' +
      '注意它们的新位置和旧位置<b>毫无关系</b>——这就是"哈希表的遍历顺序是无序的"的根本原因。',
    s: HT(11, [[], [12], [], [], [], [], [17], [7], [], [20], []], { op: 'rehash 完成', hash: '每个 key 都换了位置', hlB: -1, msg: 'size = 4，负载降到 4/11 ≈ 0.36' }) },
  { text: 'remove(7)：算 h(7) = 7 % 11 = 7，走到 7 号桶，把 7 从链上摘掉。扩容之后，原来挤在一起的 key 被拆散了，链变短，查找更快。',
    s: HT(11, [[], [12], [], [], [], [], [17], [], [], [20], []], { op: 'remove(7) → true', hash: 'h(7) = 7 % 11 = 7', hlB: 7, msg: '链上摘除，size = 3' }) },
  { text: '总结：哈希表用"空间换时间"，把 O(n) 的查找变成平均 O(1)。代价是 ① 内存用得多 ② 无序 ③ 最坏情况仍可能 O(n) ④ 扩容那一次是 O(n)（但均摊下来仍是 O(1)）。',
    s: HT(11, [[], [12], [], [], [], [], [17], [], [], [20], []], { op: '最终状态', hash: '平均 O(1) / 最坏 O(n)', hlB: -1, msg: 'size = 3, m = 11' }) }
];

D.register({

      title: '哈希表 · 拉链法与 rehash',

    doc.appendChild(c2);

    const c3 = D.card({ title: '冲突处理的两种流派', icon: '⚔️', badge: '面试常问' });
    D.html(c3.querySelector('.body'),

        ['<b>拉链法</b><br>Separate Chaining', '每个桶挂一条链表，冲突就挂上去', '实现简单；删除容易；负载因子可以 &gt; 1；不怕聚集',

    D.html(c4.querySelector('.body'),
      '<h3 class="sec">三个要求</h3>' +
      '<ol><li><b>快</b>：每次 put/get 都要算一次，不能太重。</li>' +
      '<li><b>结果稳定</b>：同一个 key 每次必须算出同一个值。所以不能用随机数、不能用当前时间。</li>' +
      '<li><b>分布均匀</b>：不同 key 要尽量散到不同桶，否则链表退化成 O(n)。</li></ol>' +
      '<h3 class="sec">常见技巧</h3>' +
      '<p><b>取模用质数</b>：<code class="inl">key % m</code> 里的 m 取质数（如 31、101、1009）能让分布更均匀；' +
      '如果 m 是 2 的幂，低位重复的 key 会大量撞车。</p>' +
      '<p><b>字符串哈希</b>：经典写法是 <code class="inl">h = h * 31 + ch</code> 一路滚下去（31 是经验质数），' +
      '这个套路叫"滚动哈希"，还能用来做子串匹配（Rabin-Karp）。</p>' +
      '<p><b>负数取模一定要小心</b>：在 C 和 C++ 里 <code class="inl">-3 % 5 == -3</code>（结果符号跟着被除数走），Rust 也一样。' +
      '所以算桶下标之前必须把它掰正：转成无符号再取模，或者 <code class="inl">&amp; 0x7FFFFFFF</code>。' +
      '否则拿到负下标就是一次数组越界 —— 在 C 里这是未定义行为。</p>' +
      '<h3 class="sec">几条不在课本上但很重要的性质</h3>' +

      'C 版本自己写链表、用二级指针摘链；C++ 版本用 <code class="inl">std::forward_list</code> 做桶；Rust 版本用 <code class="inl">Vec&lt;Vec&lt;(String, i32)&gt;&gt;</code>。' +

              '<p>如果 key 存进去之后被改了，它的哈希值就变了 —— 再去查它时会被导航到<b>错误的桶</b>，' +
              '于是既查不到、也删不掉，那条记录变成永远回收不了的"幽灵数据"。</p>' +
              '<p>所以：<b>std::unordered_map</b> 要求 key 满足 <code class="inl">Hash</code> 与 <code class="inl">Equal</code> 两个概念，' +
              '并且规定必须能用 <code class="inl">const K</code> 求出哈希 —— 实务上就是别拿会被修改的对象当 key；' +
              '<b>Rust 的 HashMap</b> 更硬：要求 <code class="inl">K: Hash + Eq</code>，而 <code class="inl">Hash</code> 只对 <code class="inl">&self</code> 实现，' +
              '配合所有权系统基本堵死了"边用边改"。这也是 <code class="inl">String</code> 能当 key、而可变引用不能的原因。</p>' +
              '<p>还有一条铁律：<b>两个对象相等，则哈希值必须相等</b>；反之哈希值相等，对象不一定相等（这就是冲突）。' +
              '在 C++ 里自己写 <code class="inl">operator==</code> 和 <code class="inl">std::hash</code> 特化时，必须同时满足这两条。</p>'));
    doc.appendChild(c6);
  }
});
})();

<script>
/* ==================== 09-bst.js ==================== */
/* ============================ 6. 二叉搜索树 ============================ */
(function () {
'use strict';
const D = window.DSV;
const W = 760, H = 360, RH = 19, DY = 72;

function posOf(path) {
  const d = path.length;
  let idx = 0;
  for (let i = 0; i < d; i++) idx = idx * 2 + (path[i] === 'R' ? 1 : 0);
  const slot = W / Math.pow(2, d);
  return { x: (idx + 0.5) * slot, y: 26 + d * DY };
}

function makeSvg() {
  const svg = D.svgEl('svg', { class: 'viz', viewBox: '0 0 ' + W + ' ' + H, preserveAspectRatio: 'xMidYMid meet' });
  svg.style.cssText = 'width:100%;max-width:740px;height:auto';
  svg.appendChild(D.svgEl('g', { class: 'edges' }));
  svg.appendChild(D.svgEl('g', { class: 'nodes' }));
  return svg;
}

function renderTree(svg, tree, cls) {
  const gN = svg.querySelector('g.nodes'), gE = svg.querySelector('g.edges');
  const paths = Object.keys(tree);
  Array.prototype.forEach.call(gN.children, g => {
    if (!(g.dataset.p.substring(2) in tree)) g.remove();
  });
  paths.forEach(p => {
    let g = gN.querySelector('[data-p="p_' + p + '"]');
    const fresh = !g;
    if (fresh) {
      g = D.svgEl('g', { class: 'nd', 'data-p': 'p_' + p });
      g.appendChild(D.svgEl('circle', { r: RH }));
      g.appendChild(D.svgEl('text', {}));
      gN.appendChild(g);
    }
    const pos = posOf(p);
    g.setAttribute('transform', 'translate(' + pos.x.toFixed(1) + ',' + pos.y + ')');
    g.querySelector('text').textContent = tree[p];
    g.setAttribute('class', 'nd' + (cls && cls[p] ? ' ' + cls[p] : ''));
    if (fresh) { g.classList.add('enter'); setTimeout(() => g.classList.remove('enter'), 450); }
  });
  gE.innerHTML = '';
  paths.forEach(p => {
    if (!p) return;
    const par = p.slice(0, -1);
    if (!(par in tree)) return;
    const a = posOf(par), b = posOf(p);
    const on = cls && (cls[p] === 'cur' || cls[p] === 'done');
    gE.appendChild(D.svgEl('line', {
      class: 'lnk' + (on ? ' on' : ''), x1: a.x.toFixed(1), y1: a.y + RH, x2: b.x.toFixed(1), y2: b.y - RH
    }));
  });
}

        '反例：[10, 5, 15, 3, 12] —— 12 是 5 的右孩子（12 &gt; 5 通过），但 12 &lt; 10，整棵树不是 BST。' +
        '正解是<b>给每个节点带上区间约束</b>（C / C++ / Rust 三种写法见下面的动手练第 2 题）：' +
        D.answer({
          cpp: 'template <typename T>\n' +
               'bool isValidBST(const Node<T> *node,\n' +
               '                const std::optional<T> &lo = std::nullopt,\n' +
               '                const std::optional<T> &hi = std::nullopt) {\n' +
               '    if (node == nullptr) return true;\n' +
               '    if (lo && node->val <= *lo) return false;\n' +
               '    if (hi && node->val >= *hi) return false;\n' +

               '           isValidBST(node->right, node->val, hi);\n' +
               '}',
          rs: 'fn is_valid_bst(node: &Option<Box<Node>>, lo: Option<i32>, hi: Option<i32>) -> bool {\n' +
              '    match node {\n' +
              '        None => true,\n' +
              '        Some(n) => {\n' +
              '            if let Some(l) = lo { if n.val <= l { return false; } }\n' +
              '            if let Some(h) = hi { if n.val >= h { return false; } }\n' +
              '            is_valid_bst(&n.left, lo, Some(n.val)) && is_valid_bst(&n.right, Some(n.val), hi)\n' +
              '        }\n' +
              '    }\n' +

              D.answerFor('bst', 2)));
    doc.appendChild(c7);

<script>
/* ==================== 10-heap.js ==================== */
/* ============================ 7. 堆 ============================ */
(function () {
'use strict';
const D = window.DSV;
const W = 700, RH = 18, DY = 66;

function posIdx(i) {
  const level = Math.floor(Math.log2(i + 1));
  const posIn = i - (Math.pow(2, level) - 1);
  const slot = W / Math.pow(2, level);
  return { x: (posIn + 0.5) * slot, y: 24 + level * DY };
}
function makeSvg() {
  const svg = D.svgEl('svg', { class: 'viz', viewBox: '0 0 ' + W + ' 300', preserveAspectRatio: 'xMidYMid meet' });
  svg.style.cssText = 'width:100%;max-width:700px;height:auto';
  svg.appendChild(D.svgEl('g', { class: 'edges' }));
  svg.appendChild(D.svgEl('g', { class: 'nodes' }));
  return svg;
}
function renderHeap(svg, arr, cls) {
  const gN = svg.querySelector('g.nodes'), gE = svg.querySelector('g.edges');
  const n = arr.length;
  Array.prototype.forEach.call(gN.children, g => { if (+g.dataset.i >= n) g.remove(); });
  for (let i = 0; i < n; i++) {
    let g = gN.querySelector('[data-i="' + i + '"]');
    const fresh = !g;
    if (fresh) {
      g = D.svgEl('g', { class: 'nd', 'data-i': i });
      g.appendChild(D.svgEl('circle', { r: RH }));
      g.appendChild(D.svgEl('text', {}));
      gN.appendChild(g);
    }
    const pos = posIdx(i);
    g.setAttribute('transform', 'translate(' + pos.x.toFixed(1) + ',' + pos.y + ')');
    g.querySelector('text').textContent = arr[i];
    g.setAttribute('class', 'nd' + (cls && cls[i] ? ' ' + cls[i] : ''));
    if (fresh) { g.classList.add('enter'); setTimeout(() => g.classList.remove('enter'), 450); }
  }
  gE.innerHTML = '';
  for (let i = 1; i < n; i++) {
    const par = (i - 1) >> 1;
    const a = posIdx(par), b = posIdx(i);
    const on = cls && (cls[i] === 'cur' || cls[par] === 'cur');
    gE.appendChild(D.svgEl('line', {
      class: 'lnk' + (on ? ' on' : ''), x1: a.x.toFixed(1), y1: a.y + RH, x2: b.x.toFixed(1), y2: b.y - RH
    }));
  }
}

/* ---------- 动画数据 ---------- */
function HP(arr, cls, o) { return Object.assign({ arr: arr.slice(), cls: Object.assign({}, cls), op: '', msg: '' }, o || {}); }

const steps = [
  { text: '堆是一棵<b>完全二叉树</b>，并且满足"堆序性"：小顶堆里每个父节点都 ≤ 两个孩子。' +
      '两条性质合起来给出一个极有用的结论：<b>堆顶一定是整个堆里的最小值（大顶堆则是最大值）</b>，而且取它是 O(1)。',
    s: HP([5, 20, 10, 40, 50, 30, 60], {}, { op: '一个合法的小顶堆', msg: '每个父节点都 ≤ 孩子' }) },
  { text: '堆最妙的地方：<b>它不需要任何指针</b>。因为完全二叉树的节点是"一层一层填满"的，' +
      '所以可以直接按下标映射：下标 i 的左孩子是 2i+1、右孩子 2i+2、父节点是 (i-1)/2 向下取整。' +
      '上面那排数组和下面这棵树，是<b>同一份数据</b>的两种画法。',
    s: HP([5, 20, 10, 40, 50, 30, 60], {}, { op: '数组 ↔ 完全二叉树', msg: '左 2i+1  右 2i+2  父 (i-1)/2' }) },
  { text: 'push(3)：第一步先把 3 放到数组<b>末尾</b>（下标 7）。为什么放末尾？因为只有放在末尾才能保持"完全二叉树"的形状——' +
      '堆的结构约束是不能破坏的，否则下标映射就不成立了。',
    s: HP([5, 20, 10, 40, 50, 30, 60, 3], { 7: 'cur' }, { op: 'push(3)  放到末尾', msg: '形状对了，但堆序被破坏了' }) },
  { text: '第二步：<b>上浮（sift up）</b>。3 的父节点是下标 (7-1)/2 = 3，值是 40。3 &lt; 40，违反堆序 → 交换。',
    s: HP([5, 20, 10, 3, 50, 30, 60, 40], { 3: 'cur', 7: 'done' }, { op: '3 < 40 → 交换', msg: '下标 7 与下标 3 交换' }) },
  { text: '继续上浮：3 现在在下标 3，父节点是下标 1，值是 20。3 &lt; 20 → 再交换。',
    s: HP([5, 3, 10, 20, 50, 30, 60, 40], { 1: 'cur', 3: 'done' }, { op: '3 < 20 → 交换', msg: '下标 3 与下标 1 交换' }) },
  { text: '继续上浮：3 在下标 1，父节点是根，值是 5。3 &lt; 5 → 交换。到根了，停下。' +
      '整个过程中 3 最多走"树高"步，所以 push 是 <b>O(log n)</b>。',
    s: HP([3, 5, 10, 20, 50, 30, 60, 40], { 0: 'cur', 1: 'done' }, { op: '3 < 5 → 交换，到达堆顶', msg: 'push 完成，O(log n)' }) },
  { text: 'pop()：先记下堆顶 3（它是全局最小值）。但堆顶空出来怎么办？' +
      '如果随便找个节点补上去会破坏"完全二叉树"的形状。所以标准做法是：<b>把数组最后一个元素挪到堆顶</b>，再 size--。',
    s: HP([40, 5, 10, 20, 50, 30, 60], { 0: 'cur' }, { op: 'pop() → 3；末尾 40 补到堆顶', msg: '形状保住了，堆序坏了' }) },
  { text: '第二步：<b>下沉（sift down）</b>。40 的两个孩子是 5 和 10。注意——必须和<b>更小的那个</b>孩子交换（这里是 5），' +
      '否则换完还是违反堆序。40 &gt; 5 → 交换。',
    s: HP([5, 40, 10, 20, 50, 30, 60], { 1: 'cur', 0: 'done' }, { op: '孩子 min(5,10)=5 → 交换', msg: '下沉到下标 1' }) },
  { text: '继续下沉：40 现在的孩子是 20 和 50，较小的是 20。40 &gt; 20 → 交换。',
    s: HP([5, 20, 10, 40, 50, 30, 60], { 3: 'cur', 1: 'done' }, { op: '孩子 min(20,50)=20 → 交换', msg: '下沉到下标 3' }) },
  { text: '40 在下标 3，它没有孩子了（2×3+1 = 7 ≥ 数组长度）→ 停止。堆序恢复。' +
      '下沉的步数也是树高，所以 pop 是 <b>O(log n)</b>。',
    s: HP([5, 20, 10, 40, 50, 30, 60], { 3: 'done' }, { op: 'pop 完成', msg: 'peek() 仍然是 O(1)' }) },
  { text: '为什么堆要用"完全二叉树 + 数组"而不是普通二叉树？因为完全二叉树天然没有空洞，' +
      '用数组一维存储既省掉所有指针，又让内存连续（缓存友好），还能 O(1) 定位任意父子。这是数据结构设计里非常漂亮的一手。',
    s: HP([5, 20, 10, 40, 50, 30, 60], {}, { op: '为什么这么设计', msg: '无指针、内存连续、O(1) 寻址' }) }
];

const B = [3, 9, 2, 1, 4, 5];
const stepsB = [
  { text: '建堆：给一个乱序数组 [3, 9, 2, 1, 4, 5]。它天生满足"完全二叉树"的形状，但不满足堆序。' +
      '暴力做法是依次 push n 次，那是 O(n log n)；有个更快的办法能到 O(n)。',
    s: HP(B, {}, { op: 'buildHeap', msg: '怎样最快地变成一个合法堆？' }) },
  { text: '关键观察：<b>叶子节点本身就是合法的堆</b>（它没有孩子，没有堆序可违反）。' +
      '所以只需要调整"非叶节点"。n = 6，最后一个非叶节点下标是 n/2 - 1 = 2。',
    s: HP(B, { 3: 'done', 4: 'done', 5: 'done' }, { op: '下标 3、4、5 是叶子，天然合法', msg: '从下标 2 开始往前处理' }) },
  { text: '处理下标 2（值 2）：孩子是下标 5 的 5。2 &lt; 5，已经满足堆序 → 不用动。' +
      '（如果违反了就下沉。）',
    s: HP(B, { 2: 'cur', 3: 'done', 4: 'done', 5: 'done' }, { op: '下标 2：2 ≤ 5，不动', msg: '继续往前' }) },
  { text: '处理下标 1（值 9）：孩子是下标 3 的 1 和下标 4 的 4。较小的是 1，9 &gt; 1 → 交换。' +
      '交换后 9 到了下标 3，它没有孩子了，停止。',
    s: HP([3, 1, 2, 9, 4, 5], { 1: 'cur', 3: 'done' }, { op: '下标 1：9 > min(1,4)=1 → 交换', msg: '下沉结束' }) },
  { text: '处理下标 0（值 3）：孩子是下标 1 的 1 和下标 2 的 2。较小的是 1，3 &gt; 1 → 交换。',
    s: HP([1, 3, 2, 9, 4, 5], { 0: 'cur', 1: 'done' }, { op: '下标 0：3 > min(1,2)=1 → 交换', msg: '3 沉到下标 1' }) },
  { text: '3 到了下标 1，它的孩子是下标 3 的 9 和下标 4 的 4。较小的是 4，3 &lt; 4 → 停止。' +
      '<b>建堆完成</b>：[1, 3, 2, 9, 4, 5]。',
    s: HP([1, 3, 2, 9, 4, 5], { 1: 'cur', 3: 'done', 4: 'done' }, { op: '3 ≤ min(9,4)=4 → 停', msg: '整棵树满足堆序' }) },
  { text: '为什么是 O(n) 而不是 O(n log n)？因为<b>越靠下的节点越多，但它们能下沉的距离越短</b>。' +
      '精确求和：Σ (每层节点数 × 该层最大下沉距离) = n/2×0 + n/4×1 + n/8×2 + … ≈ 2n = O(n)。这是个很经典的结论。',
    s: HP([1, 3, 2, 9, 4, 5], {}, { op: '复杂度', msg: '奇数层便宜、偶数层便宜 → 总和 O(n)' }) }
];

D.register({
  id: 'heap', title: '堆 / 优先队列', icon: '⛰️', group: '四、树与堆', order: 70,
  blurb: '用数组装完全二叉树，O(1) 取最值、O(log n) 插删',

  lead: '堆是用来"随时取最值"的结构。它不保证整体有序，只保证堆顶最值——这恰好是很多场景真正需要的。',
  build(doc) {
    const c1 = D.card({ title: '一句话讲清', icon: '💡', badge: 'Heap / PriorityQueue' });
    D.html(c1.querySelector('.body'),
      '<p>堆是一棵<b>完全二叉树</b>，并且每个父节点都 ≤ 它的两个孩子（小顶堆；大顶堆则 ≥）。' +
      '这两个约束合起来，保证了<b>堆顶就是全局最值</b>。</p>' +
      '<p>"完全二叉树"这个额外的结构约束，让堆可以<b>直接用数组存，一个指针都不需要</b>：' +
      '下标 <code class="inl">i</code> 的左孩子是 <code class="inl">2i+1</code>、右孩子 <code class="inl">2i+2</code>、' +
      '父节点是 <code class="inl">(i-1)/2</code>。</p>' +
      D.mini([['O(1)', 'peek 看最值'], ['O(log n)', 'push 入堆'], ['O(log n)', 'pop 出堆'], ['O(n)', 'buildHeap 建堆']]) +
      D.note('note', '堆和 BST 的区别（很重要的直觉）',
        'BST 追求"<b>全局有序</b>"：中序遍历能拿到完整排序。堆只要求"<b>局部有序</b>"：父 ≤ 子即可。' +
        '约束越松，维护成本越低——所以 BST 插入是 O(log n) 但常数大、还要平衡，' +

    const b2 = c2.querySelector('.body');
    D.html(b2, '<p>上面是数组、下面是同一棵树的两种视角。注意观察：<b>每次只有一条路径上的元素在动</b>，' +

    D.lab(b2, {
      title: '小顶堆 · push / pop',

      steps: steps,
      setup(view) {
        const wrap = D.el('div');

    const c3 = D.card({ title: '动画 ②：O(n) 建堆', icon: '🏗️', badge: '常考' });
    const b3 = c3.querySelector('.body');
    D.html(b3, '<p>给定一个乱序数组，怎么最快变成堆？<b>从最后一个非叶节点开始，倒着对每个节点做一次下沉</b>。</p>');

      setup(view) {

        wrap.innerHTML = '<div class="row" style="gap:10px;flex-wrap:wrap;justify-content:center">' +
          '<span class="chip warm" data-k="op">—</span><span class="chip" data-k="msg">—</span></div>' +
          '<div class="row" data-k="cells" style="gap:8px"></div>';
        const svg = makeSvg();
        wrap.appendChild(svg);
        view.appendChild(wrap);
        return { svg: svg, cells: wrap.querySelector('[data-k="cells"]'), op: wrap.querySelector('[data-k="op"]'), msg: wrap.querySelector('[data-k="msg"]') };
      },
      draw(c, step) {
        const s = step.s;
        const items = s.arr.map((v, i) => ({ key: i, i: i, v: v, cls: s.cls[i] || '' }));
        D.reconcile(c.cells, items, it => it.key,
          () => D.el('div', 'cell'),
          (node, it) => {
            node.className = 'cell' + (it.cls ? ' ' + it.cls : '');
            node.style.minWidth = '44px';
            node.style.height = '44px';
            node.innerHTML = '<span>' + it.v + '</span><span class="lbl">' + it.i + '</span>';
          });
        renderHeap(c.svg, s.arr, s.cls);
        c.op.textContent = s.op;
        c.msg.textContent = s.msg;
      }
    });
    doc.appendChild(c3);

    const c4 = D.card({ title: '手写时的 5 个关键点', icon: '🔧', badge: '细节' });
    D.html(c4.querySelector('.body'),
      '<h3 class="sec">1. 上浮和下沉是"对称"的两件事</h3>' +
      '<p><b>上浮（sift up）</b>：只和<b>一个</b>父节点比，小了就换，用于 push。' +
      '<b>下沉（sift down）</b>：要和<b>两个孩子里较小的那个</b>比，用于 pop 和建堆。' +
      '为什么下沉必须挑更小的孩子？因为如果你和大的那个换了，换完之后它比另一个孩子大，还是违反堆序，得再换一次。</p>' +
      '<h3 class="sec">2. 边界：孩子下标越界</h3>' +
      '<p>下沉时必须先判断 <code class="inl">l &lt; n</code> / <code class="inl">r &lt; n</code>。' +
      '完全二叉树的叶子节点没有孩子，直接访问会越界。<b>这是堆代码最常见的崩溃点。</b></p>' +
      '<h3 class="sec">3. pop 的顺序不能颠倒</h3>' +
      '<p>正确顺序：<b>先记下堆顶 → 弹出末尾 → 把末尾放到堆顶 → 下沉</b>。' +
      '很多人写成"先弹出堆顶再补位"，结果数组中间出现空洞，完全二叉树的性质就没了。' +
      '注意只有当数组还非空时才需要补位，否则会把 undefined 写进去。</p>' +
      '<h3 class="sec">4. 大顶堆还是小顶堆，看题目要什么</h3>' +
      '<p>求"第 K 大"要用<b>小顶堆</b>（留大值、踢小值，堆顶正好是第 K 大）——很多人第一反应会反过来，记住这个反直觉点。' +
      '求"第 K 小"则用大顶堆。另外注意：Rust 的 <code class="inl">BinaryHeap</code> 只有<b>大</b>顶堆，要小顶堆得用 <code class="inl">std::cmp::Reverse&lt;T&gt;</code> 包一层；' +
        'C++ 的 <code class="inl">std::priority_queue</code> 默认也是大顶堆，要小顶堆得写 <code class="inl">std::greater&lt;T&gt;</code>。' +
        '这个"方向反了"的坑，三个语言里都有人踩。</p>' +
      '<h3 class="sec">5. 建堆为什么是 O(n)</h3>' +
      '<p>因为下沉的总代价是"每层节点数 × 下沉距离"之和：第 1 层 1 个节点最多沉 log n 层，' +
      '但最后一层有 n/2 个节点、一个都不用沉。求和后收敛到 2n。' +
      '<b>而"逐个 push"是从上往下插，最底层每个节点都要浮 log n 层，所以是 O(n log n)。</b>' +
      '方向不一样，代价差一个 log。</p>');
    doc.appendChild(c4);

    const c5 = D.card({ title: '堆的三大应用场景', icon: '🎯', badge: '识别信号' });
    D.html(c5.querySelector('.body'),
      D.table(['场景', '为什么用堆', '复杂度'], [
        ['优先队列', '任务按优先级排队，永远先处理最高优先级的', 'push/pop O(log n)'],
        ['Top-K 问题', '求"最大的 K 个"：维护大小为 K 的小顶堆，堆顶就是第 K 大', 'O(n log K)，比全排序 O(n log n) 快'],
        ['数据流中位数', '一个大顶堆放左半、一个小顶堆放右半，堆顶就是中位数', '每次插入 O(log n)'],
        ['堆排序', '建堆 + 反复 pop 堆顶', 'O(n log n)，原地（大顶堆版本）'],
        ['Dijkstra / A*', '每次从"未访问节点"里取距离最小的', 'O((V+E) log V)'],
        ['合并 K 个有序链表', 'K 个链表头放进小顶堆，每次取最小的', 'O(N log K)'],
      ]) +
      D.note('tip', '看到这些字眼就想堆',
        '"前 K 个"、"最……的"、"动态地取最值"、"优先处理"、"流式数据"。' +
        '反过来说，如果题目要求"全部有序输出"，那应该是排序而不是堆。'));
    doc.appendChild(c5);

    const c6 = D.card({ title: '分步实现 · C / C++ / Rust', icon: '⌨️', badge: '手写重点' });
    D.html(c6.querySelector('.body'),
      '<p>三种语言、同一套步骤。<b>点右上角切换语言，整页跟着一起换。</b>按顺序把每一步拼起来，就是一份能直接编译运行的完整程序。' +
      'C 版本手写 <code class="inl">realloc</code> 扩容；C++ 版本在手写 <code class="inl">sift_up/sift_down</code> 之外，还给出 ' +
      '<code class="inl">std::push_heap / std::pop_heap</code> 的标准库对照；Rust 版本用 <code class="inl">Vec&lt;i32&gt;</code>，零 unsafe。</p>' +
      D.codeSteps('heap') +
      D.sources('heap') +
      D.note('tip', '自测方法', 'push 一堆随机数再用 pop 全部取出，输出的序列必须是<b>严格递增</b>的。' +
        '如果中间出现逆序，多半是 siftDown 里"挑更小的孩子"写错了，或者边界判断漏了。'));
    doc.appendChild(c6);

    const c7 = D.card({ title: '动手练', icon: '✎', badge: '白纸手写' });
    D.html(c7.querySelector('.body'),
      D.ex('合上页面，默写 <code class="inl">sift_down(i)</code>。写完对照上面<b>第 4 步</b>，自查三件事：' +
              '① 是不是先假设"当前位置最小" ② 是不是分别和左右孩子比了两次 ③ 循环结束条件是什么。' +
              '然后再想一遍：为什么必须和<b>更小的那个</b>孩子交换？') +
            D.ex('设计一个类，支持不断往数据流里加数字，并随时以 O(1) 返回当前中位数。<br>提示：大顶堆存较小的一半，小顶堆存较大的一半，保持两边数量差不超过 1。',
              D.answerFor('heap', 1)) +
            D.ex('实现<b>原地</b>堆排序（升序）。提示：先建大顶堆，然后把堆顶和未排序区间的末尾交换、size 减 1、再对堆顶下沉；重复 n-1 次。',
              D.answerFor('heap', 2)));
    doc.appendChild(c7);
  }
});
})();

</script>

<script>
/* ==================== 11-graph.js ==================== */
/* ============================ 8. 图 ============================ */
(function () {
'use strict';
const D = window.DSV;

const POS = { A: [70, 90], B: [230, 40], C: [230, 165], D: [410, 90], E: [410, 205], F: [580, 130] };
const EDGES = [['A', 'B'], ['A', 'C'], ['B', 'D'], ['C', 'D'], ['C', 'E'], ['D', 'F'], ['E', 'F']];
const GW = 660, GH = 260, R = 21;

function makeSvg() {
  const svg = D.svgEl('svg', { class: 'viz', viewBox: '0 0 ' + GW + ' ' + GH, preserveAspectRatio: 'xMidYMid meet' });
  svg.style.cssText = 'width:100%;max-width:660px;height:auto';
  const gE = D.svgEl('g', { class: 'edges' }), gN = D.svgEl('g', { class: 'nodes' });
  svg.appendChild(gE); svg.appendChild(gN);
  EDGES.forEach(e => {
    const a = POS[e[0]], b = POS[e[1]];
    gE.appendChild(D.svgEl('line', { class: 'lnk', 'data-e': e[0] + e[1], x1: a[0], y1: a[1], x2: b[0], y2: b[1] }));
  });
  Object.keys(POS).forEach(v => {
    const g = D.svgEl('g', { class: 'nd', 'data-v': v, transform: 'translate(' + POS[v][0] + ',' + POS[v][1] + ')' });
    g.appendChild(D.svgEl('circle', { r: R }));
    g.appendChild(D.svgEl('text', {}, v));
    gN.appendChild(g);
  });
  return svg;
}
function renderGraph(svg, cls, treeEdges) {
  Object.keys(POS).forEach(v => {
    const g = svg.querySelector('[data-v="' + v + '"]');
    g.setAttribute('class', 'nd' + (cls[v] ? ' ' + cls[v] : ''));
  });
  EDGES.forEach(e => {
    const key = e[0] + e[1];
    const line = svg.querySelector('[data-e="' + key + '"]');
    const used = treeEdges && treeEdges[key];
    const hot = cls[e[0]] === 'cur' || cls[e[1]] === 'cur';
    line.setAttribute('class', 'lnk' + (used ? ' path' : (hot ? ' on' : '')));
  });
}

/* ---------- 动画数据 ---------- */
function GP(cls, o) { return Object.assign({ cls: Object.assign({}, cls), list: [], listName: '队列', order: [], msg: '', tree: {} }, o || {}); }

const stepsBFS = [
  { text: '先认识这张图：6 个顶点、7 条无向边。存储上用<b>邻接表</b>——每个顶点挂一个"邻居列表"，空间是 O(V+E)。' +
      '（另一种是邻接矩阵 V×V 的二维数组，判断两点是否相邻是 O(1)，但空间 O(V²)，只适合稠密图。）',
    s: GP({}, { listName: '队列', msg: 'adj: A→[B,C]  B→[A,D]  C→[A,D,E]  D→[B,C,F]  E→[C,F]  F→[D,E]' }) },
  { text: 'BFS（广度优先搜索）= "一层一层往外扩散"。它的实现只需要一个<b>队列</b>：把起点入队，然后不断"取出队头、把它的邻居入队"。' +
      '因为队列是先进先出，所以离起点近的节点一定先被处理。',
    s: GP({}, { listName: '队列', list: ['A'], msg: 'A 入队，标记为已发现' }) },
  { text: '取出队头 A，访问它（输出 A），然后把 A 的邻居里"还没发现过"的标记并入队：B、C。',
    s: GP({ A: 'cur', B: 'open', C: 'open' }, { list: ['B', 'C'], order: ['A'], tree: { 'AB': 1, 'AC': 1 }, msg: '访问 A → B、C 入队' }) },
  { text: '取出队头 B，访问。B 的邻居：A（已发现，跳过）、D（新）→ D 入队。' +
      '注意 A 被跳过了——这就是 visited 集合的作用，避免走回头路和无限循环。',
    s: GP({ A: 'done', B: 'cur', C: 'open', D: 'open' }, { list: ['C', 'D'], order: ['A', 'B'], tree: { 'AB': 1, 'AC': 1, 'BD': 1 }, msg: '访问 B → D 入队' }) },
  { text: '取出队头 C，访问。邻居 A、D 都已发现，E 是新节点 → E 入队。' +
      '此时队列里是 D、E，它们离 A 的距离都是 2。',
    s: GP({ A: 'done', B: 'done', C: 'cur', D: 'open', E: 'open' }, { list: ['D', 'E'], order: ['A', 'B', 'C'], tree: { 'AB': 1, 'AC': 1, 'BD': 1, 'CE': 1 }, msg: '访问 C → E 入队' }) },
  { text: '取出队头 D，访问。邻居 B、C 已发现，F 是新节点 → F 入队（距离 3）。',
    s: GP({ A: 'done', B: 'done', C: 'done', D: 'cur', E: 'open', F: 'open' }, { list: ['E', 'F'], order: ['A', 'B', 'C', 'D'], tree: { 'AB': 1, 'AC': 1, 'BD': 1, 'CE': 1, 'DF': 1 }, msg: '访问 D → F 入队' }) },
  { text: '取出队头 E，访问。邻居 C、F 都已发现 → 没有新节点入队。',
    s: GP({ A: 'done', B: 'done', C: 'done', D: 'done', E: 'cur', F: 'open' }, { list: ['F'], order: ['A', 'B', 'C', 'D', 'E'], tree: { 'AB': 1, 'AC': 1, 'BD': 1, 'CE': 1, 'DF': 1 }, msg: '访问 E，无新节点' }) },
  { text: '取出队头 F，访问。邻居 D、E 都已发现 → 队列空了，BFS 结束。',
    s: GP({ A: 'done', B: 'done', C: 'done', D: 'done', E: 'done', F: 'cur' }, { list: [], order: ['A', 'B', 'C', 'D', 'E', 'F'], tree: { 'AB': 1, 'AC': 1, 'BD': 1, 'CE': 1, 'DF': 1 }, msg: '访问 F，队列空，结束' }) },
  { text: '访问顺序：<b>A → B → C → D → E → F</b>。仔细看这个顺序：A 距离 0，B/C 距离 1，D/E 距离 2，F 距离 3 —— ' +
      '<b>BFS 的输出顺序就是"按到起点的距离从小到大"</b>。这就是"BFS 能求无权图最短路"的根本原因。',
    s: GP({ A: 'done', B: 'done', C: 'done', D: 'done', E: 'done', F: 'done' }, { list: [], order: ['A', 'B', 'C', 'D', 'E', 'F'], tree: { 'AB': 1, 'AC': 1, 'BD': 1, 'CE': 1, 'DF': 1 }, msg: 'A(0) B,C(1) D,E(2) F(3)' }) },
  { text: '一个必考的细节：<b>visited 必须在"入队的时候"标记，而不是"出队的时候"</b>。' +
      '如果等到出队才标记，同一个节点会沿着多条边被重复入队，队列规模可能爆炸。' +
      '（DFS 的迭代版则可以等到出栈时再标记，但那时要写好 continue。）',
    s: GP({ A: 'done', B: 'done', C: 'done', D: 'done', E: 'done', F: 'done' }, { list: [], order: ['A', 'B', 'C', 'D', 'E', 'F'], msg: 'BFS 时间复杂度 O(V + E)' }) }
];

const stepsDFS = [
  { text: 'DFS（深度优先搜索）的口诀：<b>一条路走到黑，走不动了再回头</b>。实现上就是递归：访问自己，然后对第一个没访问过的邻居递归下去。',
    s: GP({}, { listName: '递归栈', list: [], msg: '从 A 出发' }) },
  { text: '访问 A（输出 A），看它的第一个邻居 B，B 没访问过 → 递归进入 B。',
    s: GP({ A: 'cur', B: 'open' }, { list: ['A'], order: ['A'], tree: { 'AB': 1 }, msg: 'A 的第 1 个邻居 B，进入' }) },
  { text: '访问 B。B 的邻居依次是 A（已访问）、D（没访问）→ 进入 D。注意 B 不会去管"其他的路"，它只认第一个没走过的。',
    s: GP({ A: 'done', B: 'cur', D: 'open' }, { list: ['A', 'B'], order: ['A', 'B'], tree: { 'AB': 1, 'BD': 1 }, msg: 'B → D' }) },
  { text: '访问 D。邻居 B（已访问）、C（没访问）→ 进入 C。',
    s: GP({ A: 'done', B: 'done', D: 'cur', C: 'open' }, { list: ['A', 'B', 'D'], order: ['A', 'B', 'D'], tree: { 'AB': 1, 'BD': 1, 'CD': 1 }, msg: 'D → C' }) },
  { text: '访问 C。邻居 A、D 已访问，E 没访问 → 进入 E。',
    s: GP({ A: 'done', B: 'done', D: 'done', C: 'cur', E: 'open' }, { list: ['A', 'B', 'D', 'C'], order: ['A', 'B', 'D', 'C'], tree: { 'AB': 1, 'BD': 1, 'CD': 1, 'CE': 1 }, msg: 'C → E' }) },
  { text: '访问 E。邻居 C 已访问，F 没访问 → 进入 F。',
    s: GP({ A: 'done', B: 'done', D: 'done', C: 'done', E: 'cur', F: 'open' }, { list: ['A', 'B', 'D', 'C', 'E'], order: ['A', 'B', 'D', 'C', 'E'], tree: { 'AB': 1, 'BD': 1, 'CD': 1, 'CE': 1, 'EF': 1 }, msg: 'E → F' }) },
  { text: '访问 F。F 的邻居 D、E 都已经访问过了 → 无路可走，函数返回。' +
      '这一层返回后，E、C、D、B 的邻居也全都访问完了，于是一路返回到 A。',
    s: GP({ A: 'done', B: 'done', D: 'done', C: 'done', E: 'done', F: 'cur' }, { list: ['A', 'B', 'D', 'C', 'E', 'F'], order: ['A', 'B', 'D', 'C', 'E', 'F'], tree: { 'AB': 1, 'BD': 1, 'CD': 1, 'CE': 1, 'EF': 1 }, msg: 'F 无路可走，开始回溯' }) },
  { text: 'DFS 结束，访问顺序 <b>A → B → D → C → E → F</b>。和 BFS 的 A B C D E F 对比一下：' +
      'DFS 明显"偏心"，它会一路钻到底才回头。',
    s: GP({ A: 'done', B: 'done', D: 'done', C: 'done', E: 'done', F: 'done' }, { list: [], order: ['A', 'B', 'D', 'C', 'E', 'F'], tree: { 'AB': 1, 'BD': 1, 'CD': 1, 'CE': 1, 'EF': 1 }, msg: 'DFS 顺序：A B D C E F' }) },
  { text: '递归看起来没有用到"栈"，但其实<b>函数调用本身就是栈</b>：每进入一层递归就压一帧，返回就弹一帧。' +
      '所以递归太深会"栈溢出"。把它改写成迭代版时要自己维护这个栈——' +
      '注意压栈顺序必须<b>反过来</b>（邻居列表倒着压），先出栈的才是第一个邻居。',
    s: GP({ A: 'done', B: 'done', D: 'done', C: 'done', E: 'done', F: 'done' }, { list: [], order: ['A', 'B', 'D', 'C', 'E', 'F'], msg: 'DFS 复杂度同样是 O(V + E)' }) },
  { text: '最后对比一句话：<b>BFS 用队列，求"最少几步 / 最短路径"；DFS 用栈（或递归），求"是否存在路径 / 连通分量 / 拓扑序 / 判环"</b>。' +
      '看到"最短"两个字，条件反射想 BFS。',
    s: GP({ A: 'done', B: 'done', D: 'done', C: 'done', E: 'done', F: 'done' }, { list: [], order: ['A', 'B', 'D', 'C', 'E', 'F'], msg: 'BFS=队列=最短路；DFS=栈=连通性' }) }
];

D.register({
  id: 'graph', title: '图', icon: '🕸️', group: '五、图与算法', order: 80,
  blurb: '邻接表 + BFS/DFS，一切"关系网络"问题的起点',
  badge: 'V + E',
  keywords: 'graph 图 邻接表 邻接矩阵 BFS DFS 广度 深度 拓扑排序 最短路',
  lead: '图是最通用的数据结构：把"关系"抽象成边，社交网络、地图、依赖关系、状态机全都是图。',
  build(doc) {
    const c1 = D.card({ title: '一句话讲清', icon: '💡', badge: 'Graph' });
    D.html(c1.querySelector('.body'),
      '<p>图 = <b>顶点（Vertex）的集合 + 边（Edge）的集合</b>。链表是"每个节点最多一个后继"的图，' +
      '树是"没有环的连通图"。所以图是前面所有结构的推广。</p>' +
      '<p>存储方式主流有两种：<b>邻接表</b>（每个顶点挂一个邻居列表，空间 O(V+E)，稀疏图首选）和' +
      '<b>邻接矩阵</b>（V×V 的二维表，判相邻 O(1)，但空间 O(V²)）。</p>' +
      D.mini([['O(V+E)', 'BFS / DFS 遍历'], ['O(V+E)', '邻接表空间'], ['O(V²)', '邻接矩阵空间'], ['V+E', '图的"规模"']]) +
      D.note('note', '为什么复杂度里既有 V 又有 E',
        '遍历图要"访问每个顶点一次"（V），还要"检查每条边一次"（E）——检查邻居列表就是要遍历所有的边。' +
        '所以写成 O(V+E)。在稀疏图里 E 和 V 同量级；稠密图里 E 可以到 V²。'));

    const c2 = D.card({ title: '动画 ①：BFS 广度优先（队列）', icon: '🌊', badge: '最短路' });
    const b2 = c2.querySelector('.body');
    D.html(b2, '<p>紫色 = 已发现待处理（在队列里），橙色 = 正在访问，绿色 = 已完成。' +
      '注意右侧队列的变化：永远从<b>队头</b>取，往<b>队尾</b>加。</p>');
    D.lab(b2, {
      title: 'BFS · 一层一层扩散',
      height: 400,
      steps: stepsBFS,
      setup(view) {
        const wrap = D.el('div');
        wrap.style.cssText = 'display:flex;gap:26px;align-items:center;justify-content:center;width:100%;flex-wrap:wrap';
        wrap.innerHTML = '<div data-k="gwrap" style="flex:1 1 420px;max-width:520px"></div>' +

        };

      draw(c, step) {

        D.reconcile(c.list, s.list.map((v, i) => ({ k: v, i: i })), it => it.k,
          () => D.el('span', 'chip on'),
          (node, it) => { node.textContent = it.k; node.className = 'chip' + (it.i === 0 ? ' warm' : ' on'); });
        D.reconcile(c.order, s.order.map((v, i) => ({ k: v + i, v: v })), it => it.k,
          () => D.el('span', 'chip'),
          (node, it) => { node.textContent = it.v; node.className = 'chip on'; });
        c.msg.textContent = s.msg;
      }
    });
    doc.appendChild(c2);

    const c3 = D.card({ title: '动画 ②：DFS 深度优先（递归 / 栈）', icon: '🕳️', badge: '一条路走到黑' });
    const b3 = c3.querySelector('.body');
    D.html(b3, '<p>右侧展示的是"递归栈"的深度——每进一层就压一帧。看它先一路钻到底，再一层层往回弹。</p>');
    D.lab(b3, {
      title: 'DFS · 一路钻到底',
      height: 400,
      steps: stepsDFS,
      setup(view) {
        const wrap = D.el('div');

          '<div style="display:flex;flex-direction:column;gap:10px;min-width:230px;font-family:var(--mono);font-size:12.5px">' +

        return {

        };
      },
      draw(c, step) {
        const s = step.s;
        renderGraph(c.svg, s.cls, s.tree);
        c.listName.textContent = s.listName;
        D.reconcile(c.list, s.list.map((v, i) => ({ k: v, i: i })), it => it.k,
          () => D.el('span', 'chip'),
          (node, it) => { node.textContent = it.k; node.className = 'chip' + (it.i === s.list.length - 1 ? ' warm' : ''); });
        D.reconcile(c.order, s.order.map((v, i) => ({ k: v + i, v: v })), it => it.k,
          () => D.el('span', 'chip'),
          (node, it) => { node.textContent = it.v; node.className = 'chip on'; });
        c.msg.textContent = s.msg;
      }
    });
    doc.appendChild(c3);

    const c4 = D.card({ title: '邻接表 vs 邻接矩阵，怎么选', icon: '⚖️', badge: '选型' });
    D.html(c4.querySelector('.body'),
      D.table(['对比项', '邻接表 Map&lt;V, List&gt;', '邻接矩阵 bool[V][V]'], [
        ['空间', '<b>O(V+E)</b>，省', 'O(V²)，稠密图才划算'],
        ['判断 u-v 是否相邻', 'O(degree)，要扫邻居列表', '<b>O(1)</b>，直接查表'],
        ['遍历 v 的所有邻居', '<b>O(degree)</b>，正好是要处理的量', 'O(V)，哪怕只有一个邻居也得扫一整行'],
        ['加边 / 删边', 'O(1) 加，删要 O(degree)', 'O(1)'],
        ['适用', '<b>稀疏图</b>（边远少于 V²）：社交网络、网页链接', '<b>稠密图</b>、需要频繁判相邻、Floyd 算法'],
      ]) +
      D.note('tip', '工程上的默认选择', '绝大多数现实问题是稀疏图，所以<b>默认用邻接表</b>。' +
        '如果顶点是用字符串标识的，C++ 里就用 <code class="inl">std::unordered_map&lt;std::string, std::vector&lt;int&gt;&gt;</code>，' +
        'Rust 里用 <code class="inl">HashMap&lt;&amp;str, Vec&lt;usize&gt;&gt;</code>；' +
        '如果是 <code class="inl">0..n-1</code> 的整数编号，直接用 <code class="inl">vector&lt;vector&lt;int&gt;&gt;</code> / ' +
        '<code class="inl">Vec&lt;Vec&lt;usize&gt;&gt;</code> 最快 —— 少一层哈希，还省内存。'));
    doc.appendChild(c4);

    const c5 = D.card({ title: '图上的常见算法套路', icon: '🧭', badge: '模型识别' });
    D.html(c5.querySelector('.body'),
      D.table(['问题', '算法', '关键点'], [
        ['无权图最短路', '<b>BFS</b>', '第一次到达某点时，走的就是最短路径；用 prev 数组还原路径'],
        ['连通分量 / 岛屿数量', 'DFS 或 BFS 计数', '遍历每个未访问顶点，每次搜索吞掉一个连通块，计数 +1'],
        ['判断有向图有没有环', 'DFS 三色标记', '白=未访问，灰=正在递归栈上，黑=完成。遇到"灰"就是环'],
        ['判断无向图有没有环', '并查集 / DFS', '加边时如果两个端点已在同一集合，这条边就成环'],
        ['拓扑排序（任务调度）', '<b>Kahn 算法</b>（BFS）', '不断取出入度为 0 的点，把邻居入度减 1；若最终输出不足 V 个则说明有环'],
        ['带权最短路（非负权）', 'Dijkstra', '用小顶堆每次取当前距离最小的点，松弛它的邻居'],
        ['多源最短路 / 负权', 'Floyd（O(V³)）/ Bellman-Ford', 'Floyd 三重循环，适合小图'],
        ['最小生成树', 'Kruskal（并查集）/ Prim（堆）', 'Kruskal：把边按权排序，用并查集判断加进来会不会成环'],
      ]));
    doc.appendChild(c5);

    const c6 = D.card({ title: '分步实现 · C / C++ / Rust', icon: '⌨️', badge: '手写重点' });
    D.html(c6.querySelector('.body'),
      '<p>三种语言、同一套步骤。<b>点右上角切换语言，整页跟着一起换。</b>按顺序把每一步拼起来，就是一份能直接编译运行的完整程序。' +
      'C 版本用链表实现邻接表；C++ / Rust 用 <code class="inl">std::vector&lt;std::vector&lt;int&gt;&gt;</code> / <code class="inl">Vec&lt;Vec&lt;usize&gt;&gt;</code>。' +
      '两种遍历都会处理「图不连通」的情况。</p>' +
      D.codeSteps('graph') +
      D.sources('graph') +
      D.note('warn', 'BFS/DFS 最容易错的三个地方',
        '① <b>BFS 的 visited 标记时机</b>：必须入队时标记，不能出队时标记。' +
        '② <b>DFS 迭代版的压栈顺序</b>：要倒序压，否则访问顺序和递归版不一致（很多题会因此判错）。' +
        '③ <b>图可能不连通</b>：从一个点出发的 BFS/DFS 只能覆盖它所在的连通分量。' +
        '要遍历整张图，必须对<b>每个未访问顶点</b>都启动一次搜索。'));
    doc.appendChild(c6);

    const c7 = D.card({ title: '动手练', icon: '✎', badge: '白纸手写' });
    D.html(c7.querySelector('.body'),
      D.ex('合上页面，默写 BFS，并输出"从起点到每个顶点的最短距离"。写完对照上面<b>第 4 步</b>，确认：' +
              '① <code class="inl">visited</code> 是在<b>入队时</b>标记还是出队时标记 ② 为什么 BFS 第一次到达某点就是最短路 ③ 图不连通时会怎样。') +
            D.ex('统计一张无向图有多少个连通分量（"岛屿数量"的抽象版）。提示：外层遍历每个顶点，遇到没访问过的就启动一次 DFS，计数器 +1。',
              D.answerFor('graph', 1)) +
            D.ex('给出一堆课程和它们的先修关系，判断能不能修完所有课。提示：这等价于"判断有向图有没有环"，用拓扑排序 —— 能排出的序列长度等于课程数就没环。',
              D.answerFor('graph', 2)));
    doc.appendChild(c7);
  }
});
})();
