<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数据结构 · 动画实验室｜从看懂到能写</title>
<style>
:root{
  --bg:#080d19;
  --bg2:#0c1424;
  --panel:#111a2e;
  --panel2:#0e1626;
  --line:#22304d;
  --line2:#2e3f63;
  --text:#e7eefb;
  --dim:#93a6c8;
  --dim2:#6d80a3;
  --accent:#38d9d0;
  --accent2:#8b7cf6;
  --accent3:#ffb454;
  --ok:#3ddc97;
  --danger:#ff6b81;
  --blue:#5aa9ff;
  --code-bg:#070b15;
  --radius:14px;
  --mono:ui-monospace,"Cascadia Code","JetBrains Mono",Consolas,"Courier New",monospace;
  --sans:"Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:
    radial-gradient(1200px 700px at 78% -12%,rgba(139,124,246,.16),transparent 62%),
    radial-gradient(900px 600px at 4% 4%,rgba(56,217,208,.12),transparent 60%),
    var(--bg);
  color:var(--text);font-family:var(--sans);font-size:15.5px;line-height:1.75;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#25334f;border-radius:20px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#33456b;background-clip:content-box}

/* ============ 布局 ============ */
.app{display:flex;min-height:100vh}
.sidebar{
  width:272px;flex:0 0 272px;position:sticky;top:0;height:100vh;overflow-y:auto;
  background:linear-gradient(180deg,rgba(13,20,36,.96),rgba(9,14,26,.96));
  border-right:1px solid var(--line);padding:18px 14px 40px;backdrop-filter:blur(8px);z-index:40;
}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px;border-bottom:1px solid var(--line);margin-bottom:14px}
.brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:800;color:#04121a;font-size:16px;box-shadow:0 6px 18px rgba(56,217,208,.28)}
.brand b{display:block;font-size:15px;letter-spacing:.3px}
.brand small{color:var(--dim2);font-size:11.5px;letter-spacing:.5px}
.search{width:100%;padding:9px 12px;margin-bottom:12px;border-radius:10px;border:1px solid var(--line);
  background:#0b1322;color:var(--text);font-family:var(--sans);font-size:13.5px;outline:none;transition:.2s}
.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(56,217,208,.13)}
.navgroup{margin:14px 0 4px;padding:0 10px;font-size:11px;letter-spacing:1.6px;color:var(--dim2);text-transform:uppercase;font-weight:700}
.navlink{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;color:var(--dim);
  font-size:14px;cursor:pointer;border:1px solid transparent;transition:.16s;user-select:none}
.navlink:hover{background:#14203a;color:var(--text);text-decoration:none}
.navlink.active{background:linear-gradient(90deg,rgba(56,217,208,.16),rgba(139,124,246,.10));border-color:rgba(56,217,208,.35);color:#fff}
.navlink .ico{width:22px;text-align:center;font-size:15px;opacity:.9}
.navlink .done{margin-left:auto;color:var(--ok);font-size:12px;opacity:0;transition:.2s}
.navlink.finished .done{opacity:1}
.navlink .n{margin-left:auto;color:var(--dim2);font-size:11.5px;font-family:var(--mono)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:11px 26px;
  background:rgba(8,13,25,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.crumbs{color:var(--dim2);font-size:13px}
.crumbs b{color:var(--text);font-weight:600}
.topbar .spacer{flex:1}
.pill{font-size:12px;color:var(--dim);border:1px solid var(--line);padding:4px 11px;border-radius:999px;background:#0c1526}
.pill b{color:var(--accent)}
#menuBtn{display:none;background:#12203a;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:6px 11px;cursor:pointer;font-size:16px}
#doc{padding:26px 30px 90px;max-width:1180px;width:100%;margin:0 auto}

/* ============ 通用卡片/标题 ============ */
.card{background:linear-gradient(180deg,rgba(17,26,46,.92),rgba(12,19,34,.92));border:1px solid var(--line);
  border-radius:var(--radius);padding:22px 24px;margin:0 0 22px;box-shadow:0 12px 34px rgba(0,0,0,.28)}
.card>h2{margin:0 0 6px;font-size:21px;display:flex;align-items:center;gap:10px}
.card>h2 .badge{font-size:11px;font-family:var(--mono);padding:3px 8px;border-radius:6px;background:rgba(56,217,208,.14);color:var(--accent);border:1px solid rgba(56,217,208,.3);font-weight:500}
.card .lead{color:var(--dim);margin:0 0 16px;font-size:14.5px}
h3.sec{font-size:16.5px;margin:26px 0 10px;padding-left:12px;border-left:3px solid var(--accent);line-height:1.3}
h4{font-size:14.5px;margin:18px 0 8px;color:#cfe0f7}
p{margin:9px 0}
ul,ol{margin:9px 0;padding-left:22px}
li{margin:5px 0}
code.inl{font-family:var(--mono);font-size:13px;background:#101c31;border:1px solid var(--line);padding:1.5px 6px;border-radius:6px;color:#9fe8ff}
.kbd{font-family:var(--mono);font-size:11.5px;background:#16233c;border:1px solid var(--line2);border-bottom-width:2px;padding:1px 6px;border-radius:6px;color:#c9d8ef}
mark{background:rgba(255,180,84,.18);color:#ffd79a;padding:0 4px;border-radius:4px}
.hl-t{color:var(--accent);font-weight:600}
.hl-p{color:var(--accent2);font-weight:600}
.hl-o{color:var(--accent3);font-weight:600}

.note,.warn,.tip{border-radius:10px;padding:12px 15px;margin:14px 0;font-size:14px;border:1px solid;position:relative}
.note{background:rgba(90,169,255,.08);border-color:rgba(90,169,255,.3)}
.warn{background:rgba(255,107,129,.08);border-color:rgba(255,107,129,.3)}
.tip{background:rgba(61,220,151,.08);border-color:rgba(61,220,151,.3)}
.note b,.warn b,.tip b{display:block;margin-bottom:4px}
.note b{color:var(--blue)} .warn b{color:var(--danger)} .tip b{color:var(--ok)}

table.tb{width:100%;border-collapse:collapse;margin:14px 0;font-size:13.5px}
table.tb th,table.tb td{border:1px solid var(--line);padding:8px 12px;text-align:left}
table.tb th{background:#132038;color:#cfe0f7;font-weight:600;font-size:13px;letter-spacing:.3px}
table.tb tr:nth-child(even) td{background:rgba(255,255,255,.018)}
table.tb td.mono{font-family:var(--mono);color:#9fe8ff;white-space:nowrap}
.tb-wrap{overflow-x:auto}

/* ============ 首页 ============ */
.hero{padding:34px 8px 10px}
.hero h1{font-size:38px;line-height:1.25;margin:0 0 12px;letter-spacing:-.5px}
.hero h1 .g{background:linear-gradient(100deg,var(--accent),var(--accent2) 60%,#ff9ad5);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--dim);font-size:16px;max-width:760px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:14px;margin-top:18px}
.tile{background:linear-gradient(160deg,rgba(20,31,54,.95),rgba(12,19,34,.95));border:1px solid var(--line);
  border-radius:13px;padding:16px 17px;cursor:pointer;transition:.18s;position:relative;overflow:hidden}
.tile:hover{transform:translateY(-3px);border-color:var(--line2);box-shadow:0 14px 30px rgba(0,0,0,.4)}
.tile .t-ico{font-size:22px}
.tile b{display:block;margin:7px 0 3px;font-size:15.5px}
.tile span{color:var(--dim);font-size:12.8px;line-height:1.6;display:block}
.tile .o{position:absolute;right:12px;top:12px;font-family:var(--mono);font-size:11px;color:var(--dim2)}
.tile::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--accent),var(--accent2));opacity:0;transition:.2s}
.tile:hover::after{opacity:1}

/* ============ 实验室（动画台） ============ */
.lab{border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(180deg,#0d1729,#0a1120);margin:16px 0 22px;overflow:hidden}
.lab-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:rgba(19,32,56,.6);flex-wrap:wrap}
.lab-bar .lab-title{font-size:13px;font-weight:600;color:#cfe0f7;letter-spacing:.3px}
.lab-bar .lab-title::before{content:"▶";color:var(--accent);font-size:9px;margin-right:7px;vertical-align:2px}
.lab-tools{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}
.lab-stage{position:relative}
.lab-view{position:relative;overflow:hidden;padding:20px 18px;min-height:220px;display:flex;align-items:center;justify-content:center}
.lab-view .fx{position:absolute;inset:0;pointer-events:none}
.lab-explain{display:flex;gap:11px;align-items:flex-start;padding:11px 16px;border-top:1px dashed var(--line);
  background:rgba(9,15,27,.72);font-size:13.8px;min-height:46px}
.lab-explain .stepno{flex:0 0 auto;font-family:var(--mono);font-size:11px;color:var(--accent);background:rgba(56,217,208,.12);
  border:1px solid rgba(56,217,208,.3);border-radius:6px;padding:2px 7px;margin-top:2px}
.lab-explain .steptext{color:#d6e3f7}
.lab-ctrl{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line);background:rgba(19,32,56,.45);flex-wrap:wrap}
.btn{font-family:var(--sans);font-size:13px;color:#d6e3f7;background:#16233c;border:1px solid var(--line2);
  border-radius:9px;padding:6px 13px;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{background:#1e2f4f;border-color:#3f5586;transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:linear-gradient(135deg,var(--accent),#2bb3c9);color:#04121a;border-color:transparent;font-weight:700}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}
.speed{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);margin-left:6px}
.speed input{width:96px;accent-color:var(--accent)}
.lab-count{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--dim2)}
.step-list{list-style:none;margin:0;padding:0;max-height:0;overflow:hidden;transition:max-height .3s;border-top:0 solid var(--line)}
.step-list.open{max-height:340px;overflow-y:auto;border-top:1px solid var(--line)}
.step-item{display:flex;gap:10px;padding:7px 16px;font-size:13px;color:var(--dim);cursor:pointer;border-bottom:1px solid rgba(34,48,77,.5)}
.step-item:hover{background:#101c31;color:var(--text)}
.step-item.active{background:linear-gradient(90deg,rgba(56,217,208,.12),transparent);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.step-item .sn{font-family:var(--mono);font-size:11px;color:var(--dim2);min-width:20px}

/* ---- 动画通用元素 ---- */
.cell{min-width:48px;height:48px;display:grid;place-items:center;border-radius:10px;font-family:var(--mono);font-size:15px;
  background:#152444;border:1.5px solid #2c4270;color:#e7eefb;transition:.28s cubic-bezier(.4,1.4,.5,1);position:relative}
.cell.dim{opacity:.35}
.cell.hl{background:linear-gradient(180deg,#ffe08a,#ffb454);color:#2b1a00;border-color:#ffd479;transform:translateY(-6px) scale(1.06);box-shadow:0 10px 22px rgba(255,180,84,.32)}
.cell.hl2{background:linear-gradient(180deg,#7ef0e6,#38d9d0);color:#052a28;border-color:#8ff3ea;transform:translateY(-6px) scale(1.06);box-shadow:0 10px 22px rgba(56,217,208,.3)}
.cell.hl3{background:linear-gradient(180deg,#c4b5fd,#8b7cf6);color:#1a0f3a;border-color:#c9bdfd;transform:translateY(-6px) scale(1.06)}
.cell.bad{background:linear-gradient(180deg,#ff9aa8,#ff6b81);color:#3a0511;border-color:#ffb3bf}
.cell.ok{background:linear-gradient(180deg,#7bf0bd,#3ddc97);color:#03291a;border-color:#9bf5cd}
.cell.empty{background:transparent;border-style:dashed;border-color:#2a3854;color:#3d5075}
.cell.pop{animation:pop .34s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
.cell .lbl{position:absolute;bottom:-19px;left:0;right:0;text-align:center;font-size:10.5px;color:var(--dim2);font-family:var(--mono)}
.row{display:flex;gap:10px;align-items:center;position:relative}
.col{display:flex;flex-direction:column;gap:9px;align-items:center;position:relative}
.ptr{position:absolute;font-family:var(--mono);font-size:11.5px;color:var(--accent3);transition:transform .34s cubic-bezier(.4,1.1,.4,1);white-space:nowrap;pointer-events:none;z-index:5}
.ptr::after{content:"▲";display:block;text-align:center;font-size:9px;line-height:1;margin-top:1px}
.ptr.blue{color:var(--blue)} .ptr.purple{color:var(--accent2)} .ptr.green{color:var(--ok)}
.node{display:flex;align-items:stretch;border-radius:10px;overflow:hidden;border:1.5px solid #2c4270;background:#152444;
  transition:.3s cubic-bezier(.4,1.2,.4,1);font-family:var(--mono);font-size:14px;position:relative}
.node .v{padding:10px 14px;min-width:46px;text-align:center;display:grid;place-items:center}
.node .n{padding:10px 10px;min-width:36px;text-align:center;display:grid;place-items:center;background:#0f1a30;color:var(--dim2);font-size:12px;border-left:1.5px solid #2c4270}
.node.hl{background:linear-gradient(180deg,#ffe08a,#ffb454);color:#2b1a00;border-color:#ffd479;transform:translateY(-5px);box-shadow:0 10px 22px rgba(255,180,84,.3)}
.node.hl .n{background:rgba(0,0,0,.14);color:#5a3a00;border-color:rgba(0,0,0,.2)}
.node.ok{background:linear-gradient(180deg,#7bf0bd,#3ddc97);color:#03291a;border-color:#9bf5cd}
.node.ok .n{background:rgba(0,0,0,.12);color:#0a4530;border-color:rgba(0,0,0,.15)}
.node.dim{opacity:.32}
.node.enter{animation:pop .34s cubic-bezier(.2,1.6,.4,1)}
.node.exit{animation:out .3s forwards}
@keyframes out{to{transform:scale(.6);opacity:0}}
.arrow{color:#3f5586;font-size:15px;font-family:var(--mono);transition:.3s}
.arrow.on{color:var(--accent)}

.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12.5px;padding:4px 10px;border-radius:999px;
  background:#152444;border:1px solid #2c4270;color:#cfe0f7}
.chip.on{background:rgba(56,217,208,.16);border-color:var(--accent);color:#a9f6f0}
.chip.warm{background:rgba(255,180,84,.15);border-color:var(--accent3);color:#ffd79a}

.bar{width:34px;border-radius:6px 6px 0 0;background:linear-gradient(180deg,#5aa9ff,#2c4270);transition:.3s;position:relative}
.bar span{position:absolute;top:-19px;left:0;right:0;text-align:center;font-family:var(--mono);font-size:11px;color:var(--dim)}
.bars{display:flex;align-items:flex-end;gap:6px;height:190px;padding-bottom:24px}

.svgwrap{position:relative;width:100%}
svg.viz{display:block;margin:0 auto;overflow:visible}
svg.viz .lnk{stroke:#2e3f63;stroke-width:2;transition:.3s}
svg.viz .lnk.on{stroke:var(--accent);stroke-width:3}
svg.viz .lnk.path{stroke:var(--accent3);stroke-width:3.5}
svg.viz .nd circle{fill:#152444;stroke:#3a5285;stroke-width:2;transition:.3s}
svg.viz .nd text{fill:#e7eefb;font-family:var(--mono);font-size:13px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
svg.viz .nd.vis circle{fill:#4a6bb5;stroke:#8fb4ff}
svg.viz .nd.cur circle{fill:#ffb454;stroke:#ffd479}
svg.viz .nd.cur text{fill:#2b1a00}
svg.viz .nd.done circle{fill:#3ddc97;stroke:#9bf5cd}
svg.viz .nd.done text{fill:#04291a}
svg.viz .nd.open circle{fill:#8b7cf6;stroke:#c4b5fd}
svg.viz .nd.bad circle{fill:#ff6b81;stroke:#ffb0bd}
svg.viz g.nd{transition:transform .4s cubic-bezier(.4,1.2,.4,1);cursor:default}
svg.viz g.nd.enter{animation:fadein .42s ease}
@keyframes fadein{from{opacity:0}}
svg.viz .w{fill:none;stroke:#3ddc97;stroke-width:3;stroke-dasharray:6 5;opacity:.85}
svg.viz .w.hot{stroke:#ffb454}

.stackbox{display:flex;flex-direction:column-reverse;gap:8px;align-items:center;min-height:210px;justify-content:flex-start}
.qbox{display:flex;gap:8px;align-items:center}

/* ============ 代码块 ============ */
.codebox{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:14px 0;background:var(--code-bg)}
.codebar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#0d1626;border-bottom:1px solid var(--line)}
.codebar .fname{font-family:var(--mono);font-size:12px;color:var(--dim)}
.codebar .lang{font-family:var(--mono);font-size:10.5px;padding:2px 7px;border-radius:5px;background:rgba(139,124,246,.16);color:#c4b5fd;border:1px solid rgba(139,124,246,.3)}
.codebar .sp{flex:1}
.copybtn{font-family:var(--sans);font-size:11.5px;padding:3px 10px;border-radius:7px;border:1px solid var(--line2);background:#16233c;color:#cfe0f7;cursor:pointer}
.copybtn:hover{background:#1e2f4f}
.copybtn.ok{background:rgba(61,220,151,.18);border-color:var(--ok);color:#9bf5cd}
pre.code{margin:0;padding:14px 16px;overflow-x:auto;font-family:var(--mono);font-size:13px;line-height:1.7;tab-size:2}
pre.code code{font-family:inherit;color:#d9e6fb}
.tok-kw{color:#ff79c6} .tok-str{color:#a5e88a} .tok-com{color:#5b7099;font-style:italic}
.tok-num{color:#ffb454} .tok-fn{color:#7fd3ff} .tok-bi{color:#8b7cf6} .tok-op{color:#9fb4d8} .tok-cls{color:#4be0d0}
.codetabs{display:flex;gap:5px;padding:8px 12px 0;background:#0d1626}
.codetab{font-family:var(--mono);font-size:12px;padding:6px 13px;border-radius:8px 8px 0 0;border:1px solid transparent;
  border-bottom:none;background:transparent;color:var(--dim);cursor:pointer}
.codetab.active{background:var(--code-bg);border-color:var(--line);color:#9fe8ff}
.pane{display:none} .pane.active{display:block}
/* ---- 分步代码：语言切换 + 步骤块 ---- */
.codelang{display:flex;align-items:center;gap:7px;padding:11px 14px;background:#0d1626;
  border:1px solid var(--line);border-bottom:none;border-radius:12px 12px 0 0;flex-wrap:wrap}
.codelang .cl-label{font-size:12px;color:var(--dim2);margin-right:3px;letter-spacing:.5px}
.langtab{font-family:var(--mono);font-size:13px;padding:5px 15px;border-radius:9px;border:1px solid var(--line2);
  background:#101a2e;color:var(--dim);cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:7px}
.langtab i{font-style:normal;font-size:10.5px;opacity:.65;background:rgba(255,255,255,.08);padding:0 5px;border-radius:5px}
.langtab:hover{color:var(--text);border-color:#3f5586;transform:translateY(-1px)}
.langtab.active{font-weight:700;color:#04121a}
.langtab[data-lang="c"].active{background:linear-gradient(135deg,#7cb6ff,#3b6fd4);color:#fff;border-color:transparent}
.langtab[data-lang="cpp"].active{background:linear-gradient(135deg,#5ce6dd,#1f9e97);color:#04211f;border-color:transparent}
.langtab[data-lang="rs"].active{background:linear-gradient(135deg,#ffc078,#e07b1f);color:#2b1a00;border-color:transparent}
.langtab.active i{background:rgba(0,0,0,.16);opacity:.8}
.codelang .sp{flex:1}
.cl-copy{font-size:12px !important;padding:5px 12px !important}
.stepblocks{border:1px solid var(--line);border-top:none;border-radius:0 0 14px 14px;
  background:linear-gradient(180deg,#0b1120,#080d19);padding:16px 16px 6px;margin:0 0 20px}
.stepgroup.off{display:none}
.stepgroup{position:relative}
.stepgroup::before{content:"";position:absolute;left:10px;top:38px;bottom:34px;width:2px;border-radius:2px;
  background:linear-gradient(180deg,rgba(56,217,208,.55),rgba(139,124,246,.22) 60%,transparent)}
.sg-hint{font-size:12.5px;color:var(--dim2);margin:0 0 15px 2px;font-family:var(--mono)}
.sg-hint b{color:var(--accent)}
.cstep{position:relative;margin-bottom:18px}
.cstep:last-child{margin-bottom:8px}
.cstep-head{display:flex;align-items:baseline;gap:9px;margin-bottom:8px;flex-wrap:wrap}

window.DSV_CODE_DATA = {"array":{"c":{"file":"array.c","steps":[{"title":"头文件与数据结构","note":"引入标准库并定义 size 与 capacity 分离的整型动态数组","code":"#include <stdio.h>\n#include <stdlib.h>\n#include <stdbool.h>\n#include <string.h>\n#include <assert.h>\n#include <stdint.h>\n\n#define ARRAY_INIT_CAP 4u   /* 初始容量，避免第一次插入就扩容 */\n\ntypedef struct {\n    int    *data;      /* 堆缓冲区，容量为 capacity */\n    size_t  size;      /* 已用元素个数 */\n    size_t  capacity;  /* 已分配槽位数，恒有 capacity >= size */\n} IntArray;"},{"title":"初始化与销毁","note":"array_init 置空，array_free 释放缓冲区并复位字段","code":"static void array_init(IntArray *a) {\n    a->data = NULL;\n    a->size = 0;\n    a->capacity = 0;\n}\n\nstatic void array_free(IntArray *a) {\n    free(a->data);      /* 与 realloc 配对，全部所有权集中在这里释放 */\n    a->data = NULL;\n    a->size = 0;\n    a->capacity = 0;\n}"},{"title":"尾部追加 push_back（含 2 倍扩容）","note":"容量不足就按 2 倍增长，均摊时间复杂度 O(1)","code":"static bool array_reserve(IntArray *a, size_t need) {\n    if (need <= a->capacity) {\n        return true;\n    }\n    size_t cap = (a->capacity == 0) ? (size_t)ARRAY_INIT_CAP : a->capacity;\n    while (cap < need) {\n        if (cap > SIZE_MAX / 2) {   /* 防 size_t 乘法溢出 */\n            cap = need;\n            break;\n        }\n        cap *= 2;                   /* 2 倍扩容：把搬移成本摊薄到每次 push，均摊 O(1) */\n    }\n    int *grown = (int *)realloc(a->data, cap * sizeof *grown);\n    if (grown == NULL) {\n        return false;               /* 失败时原缓冲区仍然有效，不泄漏 */\n    }\n    a->data = grown;\n    a->capacity = cap;\n    return true;\n}\n\nstatic bool array_push_back(IntArray *a, int value) {\n    if (!array_reserve(a, a->size + 1)) {\n        return false;\n    }\n    a->data[a->size++] = value;\n    return true;\n}"},{"title":"按下标读写 get / set","note":"越界返回 false，调用者自行决定断言还是容错","code":"static bool array_get(const IntArray *a, size_t index, int *out) {\n    if (index >= a->size) {\n        return false;\n    }\n    *out = a->data[index];\n    return true;\n}\n\nstatic bool array_set(IntArray *a, size_t index, int value) {\n    if (index >= a->size) {\n        return false;\n    }\n    a->data[index] = value;\n    return true;\n}"},{"title":"中间插入 insert","note":"下标 index 及其后的元素整体后移一格，最坏 O(n)","code":"static bool array_insert(IntArray *a, size_t index, int value) {\n    if (index > a->size) {\n        return false;\n    }\n    if (!array_reserve(a, a->size + 1)) {\n        return false;\n    }\n    if (index < a->size) {\n        memmove(a->data + index + 1, a->data + index, (a->size - index) * sizeof *a->data);\n    }\n    a->data[index] = value;\n    a->size++;\n    return true;\n}"},{"title":"删除 remove","note":"删除下标 index 处元素并把后续元素前移，最坏 O(n)","code":"static bool array_remove(IntArray *a, size_t index, int *removed) {\n    if (index >= a->size) {\n        return false;\n    }\n    if (removed != NULL) {\n        *removed = a->data[index];\n    }\n    if (index + 1 < a->size) {\n        memmove(a->data + index, a->data + index + 1, (a->size - index - 1) * sizeof *a->data);\n    }\n    a->size--;\n    return true;\n}"},{"title":"main：跑一遍","note":"演示扩容、读写、插入与删除的完整过程","code":"static void array_print(const char *tag, const IntArray *a) {\n    printf(\"%-26s size=%zu cap=%zu [\", tag, a->size, a->capacity);\n    for (size_t i = 0; i < a->size; ++i) {\n        printf(\"%s%d\", (i == 0) ? \"\" : \", \", a->data[i]);\n    }\n    printf(\"]\\n\");\n}\n\nint main(void) {\n    IntArray a;\n    array_init(&a);\n    array_print(\"init\", &a);\n\n    for (int v = 1; v <= 5; ++v) {\n        bool ok = array_push_back(&a, v * 10);\n        printf(\"push_back %2d -> %s\\n\", v * 10, ok ? \"ok\" : \"fail\");\n    }\n    array_print(\"after push_back x5\", &a);\n\n    int value = 0;\n    printf(\"get[2] -> %s, value=%d\\n\", array_get(&a, 2, &value) ? \"ok\" : \"fail\", value);\n    printf(\"set[2]=99 -> %s\\n\", array_set(&a, 2, 99) ? \"ok\" : \"fail\");\n    array_print(\"after set[2]=99\", &a);\n\n    printf(\"insert(1, 7) -> %s\\n\", array_insert(&a, 1, 7) ? \"ok\" : \"fail\");\n    array_print(\"after insert(1, 7)\", &a);\n\n    int removed = 0;\n    printf(\"remove(0) -> %s, removed=%d\\n\", array_remove(&a, 0, &removed) ? \"ok\" : \"fail\", removed);\n    array_print(\"after remove(0)\", &a);\n\n    printf(\"get[100] -> %s (out of range)\\n\", array_get(&a, 100, &value) ? \"ok\" : \"fail\");\n    printf(\"remove[100] -> %s (out of range)\\n\", array_remove(&a, 100, &removed) ? \"ok\" : \"fail\");\n\n    array_free(&a);\n    array_print(\"after free\", &a);\n    return 0;\n}"}]},"cpp":{"file":"array.cpp","steps":[{"title":"头文件与数据结构","note":"引入标准库并声明手写模板类 DynamicArray<T>，std","code":"#include <cstddef>\n#include <cstdint>\n#include <iostream>\n#include <memory>\n#include <stdexcept>\n#include <string>\n#include <utility>\n#include <vector>\n\ntemplate <typename T>\nclass DynamicArray {\npublic:\n    DynamicArray() noexcept = default;\n    explicit DynamicArray(std::size_t initialCapacity);\n    ~DynamicArray() noexcept = default;\n\n    /* 三/五法则：拷贝做深拷贝，移动 O(1) 转移所有权 */\n    DynamicArray(const DynamicArray& other);\n    DynamicArray(DynamicArray&& other) noexcept;\n    DynamicArray& operator=(const DynamicArray& other);\n    DynamicArray& operator=(DynamicArray&& other) noexcept;\n\n    std::size_t size() const noexcept { return size_; }\n    std::size_t capacity() const noexcept { return capacity_; }\n    bool empty() const noexcept { return size_ == 0; }\n\n    void push_back(const T& value);\n    void push_back(T&& value);\n\n    T& operator[](std::size_t index) noexcept { return data_[index]; }\n    const T& operator[](std::size_t index) const noexcept { return data_[index]; }\n    T& at(std::size_t index);\n    const T& at(std::size_t index) const;\n\n    void insert(std::size_t index, const T& value);\n    void insert(std::size_t index, T&& value);\n    T remove(std::size_t index);\n\nprivate:\n    void reserve(std::size_t need);\n\n    std::unique_ptr<T[]> data_{};  /* 用 unique_ptr<T[]> 而不是裸指针：异常安全、自动释放 */\n    std::size_t size_ = 0;         /* 已用元素个数 */\n    std::size_t capacity_ = 0;     /* 已分配槽位数；size_ 与 capacity_ 分离是动态数组的核心 */\n};"},{"title":"初始化与销毁","note":"构造函数分配缓冲区，析构由 unique_ptr 自动完成，同时实现深浅拷贝语义","code":"template <typename T>\nDynamicArray<T>::DynamicArray(std::size_t initialCapacity)\n    : data_(initialCapacity != 0 ? std::make_unique<T[]>(initialCapacity) : nullptr),\n      size_(0),\n      capacity_(initialCapacity) {}\n\ntemplate <typename T>\nDynamicArray<T>::DynamicArray(const DynamicArray& other)\n    : data_(other.capacity_ != 0 ? std::make_unique<T[]>(other.capacity_) : nullptr),\n      size_(other.size_),\n      capacity_(other.capacity_) {\n    for (std::size_t i = 0; i < size_; ++i) {\n        data_[i] = other.data_[i];\n    }\n}\n\ntemplate <typename T>\nDynamicArray<T>::DynamicArray(DynamicArray&& other) noexcept\n    : data_(std::move(other.data_)), size_(other.size_), capacity_(other.capacity_) {\n    other.size_ = 0;\n    other.capacity_ = 0;\n}\n\ntemplate <typename T>\nDynamicArray<T>& DynamicArray<T>::operator=(const DynamicArray& other) {\n    if (this != &other) {\n        DynamicArray<T> copy(other);      /* copy-and-swap：自赋值安全且异常安全 */\n        *this = std::move(copy);\n    }\n    return *this;\n}\n\ntemplate <typename T>\nDynamicArray<T>& DynamicArray<T>::operator=(DynamicArray&& other) noexcept {\n    if (this != &other) {\n        data_ = std::move(other.data_);\n        size_ = other.size_;\n        capacity_ = other.capacity_;\n        other.size_ = 0;\n        other.capacity_ = 0;\n    }\n    return *this;\n}"},{"title":"尾部追加 push_back（含 2 倍扩容）","note":"扩容时对每个元素 std","code":"template <typename T>\nvoid DynamicArray<T>::reserve(std::size_t need) {\n    if (need <= capacity_) {\n        return;\n    }\n    std::size_t cap = (capacity_ == 0) ? 4 : capacity_;\n    while (cap < need) {\n        if (cap > SIZE_MAX / 2) {   /* 防溢出 */\n            cap = need;\n            break;\n        }\n        cap *= 2;                   /* 2 倍扩容，均摊 O(1) */\n    }\n    std::unique_ptr<T[]> grown = std::make_unique<T[]>(cap);\n    for (std::size_t i = 0; i < size_; ++i) {\n        grown[i] = std::move_if_noexcept(data_[i]);  /* 可移动类型走 move，否则退化为拷贝 */\n    }\n    data_ = std::move(grown);       /* 旧缓冲区由 unique_ptr 自动释放 */\n    capacity_ = cap;\n}\n\ntemplate <typename T>\nvoid DynamicArray<T>::push_back(const T& value) {\n    reserve(size_ + 1);\n    data_[size_] = value;\n    ++size_;\n}\n\ntemplate <typename T>\nvoid DynamicArray<T>::push_back(T&& value) {\n    reserve(size_ + 1);\n    data_[size_] = std::move(value);\n    ++size_;\n}"},{"title":"按下标读写 get / set","note":"operator[] 不做检查，at() 越界抛 std","code":"template <typename T>\nT& DynamicArray<T>::at(std::size_t index) {\n    if (index >= size_) {\n        throw std::out_of_range(\"DynamicArray::at\");\n    }\n    return data_[index];\n}\n\ntemplate <typename T>\nconst T& DynamicArray<T>::at(std::size_t index) const {\n    if (index >= size_) {\n        throw std::out_of_range(\"DynamicArray::at\");\n    }\n    return data_[index];\n}"},{"title":"中间插入 insert","note":"从尾部倒序后移一格，右值重载避免多余拷贝","code":"template <typename T>\nvoid DynamicArray<T>::insert(std::size_t index, const T& value) {\n    if (index > size_) {\n        throw std::out_of_range(\"DynamicArray::insert\");\n    }\n    reserve(size_ + 1);\n    for (std::size_t i = size_; i > index; --i) {\n        data_[i] = std::move(data_[i - 1]);\n    }\n    data_[index] = value;\n    ++size_;\n}\n\ntemplate <typename T>\nvoid DynamicArray<T>::insert(std::size_t index, T&& value) {\n    if (index > size_) {\n        throw std::out_of_range(\"DynamicArray::insert\");\n    }\n    reserve(size_ + 1);\n    for (std::size_t i = size_; i > index; --i) {\n        data_[i] = std::move(data_[i - 1]);\n    }\n    data_[index] = std::move(value);\n    ++size_;\n}"},{"title":"删除 remove","note":"左移补齐空洞并返回被删元素","code":"template <typename T>\nT DynamicArray<T>::remove(std::size_t index) {\n    if (index >= size_) {\n        throw std::out_of_range(\"DynamicArray::remove\");\n    }\n    T removed = std::move(data_[index]);\n    for (std::size_t i = index; i + 1 < size_; ++i) {\n        data_[i] = std::move(data_[i + 1]);\n    }\n    --size_;\n    return removed;\n}"},{"title":"main：跑一遍","note":"演示手写模板类与 std","code":"template <typename T>\nstatic void print_array(const char *tag, const DynamicArray<T>& a) {\n    std::cout << tag << \" size=\" << a.size() << \" cap=\" << a.capacity() << \" [\";\n    for (std::size_t i = 0; i < a.size(); ++i) {\n        if (i != 0) {\n            std::cout << \", \";\n        }\n        std::cout << a[i];\n    }\n    std::cout << \"]\\n\";\n}\n\nint main() {\n    DynamicArray<int> a;\n    print_array(\"init\", a);\n    for (int v = 1; v <= 5; ++v) {\n        a.push_back(v * 10);\n        std::cout << \"push_back \" << (v * 10) << \" -> size=\" << a.size()\n                  << \" cap=\" << a.capacity() << \"\\n\";\n    }\n    print_array(\"after push_back x5\", a);\n\n    std::cout << \"get[2] -> \" << a.at(2) << \"\\n\";\n    a[2] = 99;\n    std::cout << \"set[2]=99 -> \" << a.at(2) << \"\\n\";\n    print_array(\"after set[2]=99\", a);\n\n    a.insert(1, 7);\n    print_array(\"after insert(1, 7)\", a);\n\n    int removed = a.remove(0);\n    std::cout << \"remove(0) -> \" << removed << \"\\n\";\n    print_array(\"after remove(0)\", a);\n\n    try {\n        (void)a.at(100);\n    } catch (const std::out_of_range& e) {\n        std::cout << \"at(100) -> out_of_range: \" << e.what() << \"\\n\";\n    }\n\n    DynamicArray<std::string> words;\n    words.push_back(\"alpha\");\n    words.push_back(\"gamma\");\n    words.insert(1, \"beta\");\n    print_array(\"words\", words);\n    words.remove(0);\n    print_array(\"words after remove(0)\", words);\n\n    DynamicArray<int> copied = a;                 /* 拷贝构造：深拷贝 */\n    DynamicArray<int> moved = std::move(copied);  /* 移动构造：O(1) 转移所有权 */\n    print_array(\"moved\", moved);\n\n    std::vector<int> reference;\n    for (int v = 1; v <= 5; ++v) {\n        reference.push_back(v * 10);\n    }\n    std::cout << \"std::vector<int> size=\" << reference.size() << \" cap=\" << reference.capacity()\n              << \" front=\" << reference.front() << \" back=\" << reference.back() << \"\\n\";\n    return 0;\n}"}]},"rs":{"file":"array.rs","steps":[{"title":"头文件与数据结构","note":"定义泛型动态数组，内部由 Vec 承担堆内存与 2 倍扩容","code":"use std::fmt::Debug;\n\n/// 动态数组：对外暴露 len / capacity，内部用 Vec<T> 管理堆内存（禁止 unsafe）。\n#[derive(Debug, Default, Clone, PartialEq, Eq)]\npub struct DynamicArray<T> {\n    data: Vec<T>,\n}"},{"title":"初始化与销毁","note":"new 与 with_capacity；释放由 Vec 的 Drop 自动完成","code":"impl<T> DynamicArray<T> {\n    /// 创建一个空数组，不做任何预分配。\n    pub fn new() -> Self {\n        DynamicArray { data: Vec::new() }\n    }\n\n    /// 创建一个至少能容纳 capacity 个元素的空数组。\n    pub fn with_capacity(capacity: usize) -> Self {\n        DynamicArray { data: Vec::with_capacity(capacity) }\n    }\n}"},{"title":"尾部追加 push_back（含 2 倍扩容）","note":"Vec 容量耗尽时按倍数增长，均摊 O(1)","code":"impl<T> DynamicArray<T> {\n    /// 追加一个元素；容量不足时 Vec 自动扩容，均摊 O(1)。\n    pub fn push_back(&mut self, value: T) {\n        self.data.push(value);\n    }\n\n    /// 当前元素个数（size）。\n    pub fn len(&self) -> usize {\n        self.data.len()\n    }\n\n    /// 当前已分配容量（capacity）。\n    pub fn capacity(&self) -> usize {\n        self.data.capacity()\n    }\n\n    /// 是否为空。\n    pub fn is_empty(&self) -> bool {\n        self.data.is_empty()\n    }\n}"},{"title":"按下标读写 get / set","note":"get 返回 Option 引用，set 越界返回 Err 并返回旧值","code":"impl<T> DynamicArray<T> {\n    /// 只读访问：越界返回 None。\n    pub fn get(&self, index: usize) -> Option<&T> {\n        self.data.get(index)\n    }\n\n    /// 可变访问：越界返回 None。\n    pub fn get_mut(&mut self, index: usize) -> Option<&mut T> {\n        self.data.get_mut(index)\n    }\n\n    /// 写入下标 index，成功时返回被替换的旧值。\n    pub fn set(&mut self, index: usize, value: T) -> Result<T, &'static str> {\n        match self.data.get_mut(index) {\n            Some(slot) => Ok(std::mem::replace(slot, value)),\n            None => Err(\"index out of range\"),\n        }\n    }\n}"},{"title":"中间插入 insert","note":"Vec","code":"impl<T> DynamicArray<T> {\n    /// 在下标 index 处插入元素；index == len 等价于尾部追加。\n    pub fn insert(&mut self, index: usize, value: T) -> Result<(), &'static str> {\n        if index > self.data.len() {\n            return Err(\"index out of range\");\n        }\n        self.data.insert(index, value);\n        Ok(())\n    }\n}"},{"title":"删除 remove","note":"Vec","code":"impl<T> DynamicArray<T> {\n    /// 删除下标 index 处元素并返回它；越界返回 None。\n    pub fn remove(&mut self, index: usize) -> Option<T> {\n        if index < self.data.len() {\n            Some(self.data.remove(index))\n        } else {\n            None\n        }\n    }\n}"},{"title":"main：跑一遍","note":"演示追加、扩容、读写、插入与删除","code":"fn print_array<T: Debug>(tag: &str, array: &DynamicArray<T>) {\n    println!(\n        \"{:<24} len={} cap={} {:?}\",\n        tag,\n        array.len(),\n        array.capacity(),\n        array.data\n    );\n}\n\nfn main() {\n    let mut a: DynamicArray<i32> = DynamicArray::new();\n    print_array(\"init\", &a);\n    println!(\"is_empty -> {}\", a.is_empty());\n\n    for v in 1..=5 {\n        a.push_back(v * 10);\n        println!(\"push_back {:<3} -> len={} cap={}\", v * 10, a.len(), a.capacity());\n    }\n    print_array(\"after push_back x5\", &a);\n\n    println!(\"get(2) -> {:?}\", a.get(2));\n    match a.get_mut(0) {\n        Some(slot) => *slot += 1,\n        None => println!(\"get_mut(0) out of range\"),\n    }\n    println!(\"set(2, 99) -> {:?}\", a.set(2, 99));\n    print_array(\"after set(2, 99)\", &a);\n\n    println!(\"insert(1, 7) -> {:?}\", a.insert(1, 7));\n    print_array(\"after insert(1, 7)\", &a);\n\n    println!(\"remove(0) -> {:?}\", a.remove(0));\n    print_array(\"after remove(0)\", &a);\n\n    println!(\"get(100) -> {:?}\", a.get(100));\n    println!(\"remove(100) -> {:?}\", a.remove(100));\n\n    let mut words: DynamicArray<String> = DynamicArray::with_capacity(4);\n    words.push_back(String::from(\"alpha\"));\n    words.push_back(String::from(\"gamma\"));\n    println!(\"insert(1, beta) -> {:?}\", words.insert(1, String::from(\"beta\")));\n    print_array(\"words\", &words);\n    println!(\"words.remove(0) -> {:?}\", words.remove(0));\n    print_array(\"words after remove(0)\", &words);\n}"}]}},"linkedlist":{"c":{"file":"linkedlist.c","steps":[{"title":"节点定义","note":"单链表节点保存 int 值并指向下一个节点","code":"#include <stdio.h>\n#include <stdlib.h>\n#include <stdbool.h>\n\ntypedef struct Node {\n    int          value;\n    struct Node *next;\n} Node;\n\nstatic Node *node_create(int value) {\n    Node *node = (Node *)malloc(sizeof *node);\n    if (node == NULL) {\n        return NULL;\n    }\n    node->value = value;\n    node->next = NULL;\n    return node;\n}"},{"title":"头部插入 push_front","note":"新节点直接挂到头部，O(1)","code":"static bool list_push_front(Node **head, int value) {\n    Node *node = node_create(value);\n    if (node == NULL) {\n        return false;\n    }\n    node->next = *head;\n    *head = node;\n    return true;\n}"},{"title":"尾部插入 push_back","note":"从头遍历到尾部再接上，O(n)","code":"static bool list_push_back(Node **head, int value) {\n    Node *node = node_create(value);\n    if (node == NULL) {\n        return false;\n    }\n    if (*head == NULL) {\n        *head = node;\n        return true;\n    }\n    Node *cur = *head;\n    while (cur->next != NULL) {\n        cur = cur->next;\n    }\n    cur->next = node;\n    return true;\n}"},{"title":"按值删除 remove_value","note":"用二级指针遍历，摘除第一个值匹配的节点","code":"static bool list_remove_value(Node **head, int value) {\n    Node **link = head;                       /* link 指向“保存当前节点的那个指针” */\n    while (*link != NULL && (*link)->value != value) {\n        link = &(*link)->next;\n    }\n    if (*link == NULL) {\n        return false;\n    }\n    Node *dead = *link;\n    *link = dead->next;                       /* 摘链后再 free，避免悬空指针 */\n    free(dead);\n    return true;\n}"},{"title":"反转 reverse","note":"三指针就地翻转 next 方向，O(n) 时间 O(1) 空间","code":"static void list_reverse(Node **head) {\n    Node *prev = NULL;\n    Node *cur = *head;\n    while (cur != NULL) {\n        Node *next = cur->next;\n        cur->next = prev;\n        prev = cur;\n        cur = next;\n    }\n    *head = prev;\n}"},{"title":"释放整条链","note":"逐个 free，最后把调用者的头指针置空","code":"static void list_free(Node **head) {\n    Node *cur = *head;\n    while (cur != NULL) {\n        Node *next = cur->next;\n        free(cur);\n        cur = next;\n    }\n    *head = NULL;\n}"},{"title":"main：跑一遍","note":"演示头插、尾插、删除、反转与释放","code":"static void list_print(const char *tag, const Node *head) {\n    printf(\"%-24s [\", tag);\n    for (const Node *cur = head; cur != NULL; cur = cur->next) {\n        printf(\"%s%d\", (cur == head) ? \"\" : \" -> \", cur->value);\n    }\n    printf(\"]\\n\");\n}\n\nstatic size_t list_size(const Node *head) {\n    size_t n = 0;\n    for (const Node *cur = head; cur != NULL; cur = cur->next) {\n        n++;\n    }\n    return n;\n}\n\nint main(void) {\n    Node *head = NULL;\n\n    printf(\"push_front 3 -> %s\\n\", list_push_front(&head, 3) ? \"ok\" : \"fail\");\n    list_push_front(&head, 2);\n    list_push_front(&head, 1);\n    list_print(\"after push_front 3,2,1\", head);\n\n    list_push_back(&head, 4);\n    list_push_back(&head, 5);\n    printf(\"push_back 4,5 (size=%zu)\\n\", list_size(head));\n    list_print(\"after push_back 4,5\", head);\n\n    printf(\"remove_value(3) -> %s\\n\", list_remove_value(&head, 3) ? \"ok\" : \"fail\");\n    list_print(\"after remove_value(3)\", head);\n    printf(\"remove_value(42) -> %s\\n\", list_remove_value(&head, 42) ? \"ok\" : \"fail\");\n\n    list_reverse(&head);\n    list_print(\"after reverse\", head);\n\n    list_free(&head);\n    printf(\"after free, head=%s, size=%zu\\n\", head == NULL ? \"NULL\" : \"?\", list_size(head));\n    return 0;\n}"}]},"cpp":{"file":"linkedlist.cpp","steps":[{"title":"节点定义","note":"模板链表类，节点用 std","code":"#include <cstddef>\n#include <iostream>\n#include <memory>\n#include <string>\n#include <utility>\n\ntemplate <typename T>\nclass LinkedList {\npublic:\n    struct Node {\n        T value;\n        std::unique_ptr<Node> next;\n\n        explicit Node(const T& v) : value(v), next(nullptr) {}\n        explicit Node(T&& v) : value(std::move(v)), next(nullptr) {}\n\n        Node(const Node&) = delete;             /* 节点归 unique_ptr 独占，禁止拷贝 */\n        Node& operator=(const Node&) = delete;\n    };\n\n    LinkedList() noexcept = default;\n    LinkedList(const LinkedList& other);\n    LinkedList(LinkedList&& other) noexcept = default;\n    LinkedList& operator=(const LinkedList& other);\n    LinkedList& operator=(LinkedList&& other) noexcept = default;\n    ~LinkedList() noexcept;\n\n    bool empty() const noexcept { return head_ == nullptr; }\n    const Node *head() const noexcept { return head_.get(); }\n\n    void push_front(const T& value);\n    void push_front(T&& value);\n    void push_back(const T& value);\n    void push_back(T&& value);\n    bool remove_value(const T& value);\n    void reverse() noexcept;\n\nprivate:\n    std::unique_ptr<Node> head_{};\n};"},{"title":"头部插入 push_front","note":"新节点接管旧头，O(1)","code":"template <typename T>\nvoid LinkedList<T>::push_front(const T& value) {\n    std::unique_ptr<Node> node = std::make_unique<Node>(value);\n    node->next = std::move(head_);\n    head_ = std::move(node);\n}\n\ntemplate <typename T>\nvoid LinkedList<T>::push_front(T&& value) {\n    std::unique_ptr<Node> node = std::make_unique<Node>(std::move(value));\n    node->next = std::move(head_);\n    head_ = std::move(node);\n}"},{"title":"尾部插入 push_back","note":"先走到尾节点再接上，O(n)","code":"template <typename T>\nvoid LinkedList<T>::push_back(const T& value) {\n    std::unique_ptr<Node> node = std::make_unique<Node>(value);\n    if (head_ == nullptr) {\n        head_ = std::move(node);\n        return;\n    }\n    Node *tail = head_.get();\n    while (tail->next != nullptr) {\n        tail = tail->next.get();\n    }\n    tail->next = std::move(node);\n}\n\ntemplate <typename T>\nvoid LinkedList<T>::push_back(T&& value) {\n    std::unique_ptr<Node> node = std::make_unique<Node>(std::move(value));\n    if (head_ == nullptr) {\n        head_ = std::move(node);\n        return;\n    }\n    Node *tail = head_.get();\n    while (tail->next != nullptr) {\n        tail = tail->next.get();\n    }\n    tail->next = std::move(node);\n}"},{"title":"按值删除 remove_value","note":"用 unique_ptr 的地址做前驱链接，摘除即自动回收","code":"template <typename T>\nbool LinkedList<T>::remove_value(const T& value) {\n    std::unique_ptr<Node> *link = &head_;\n    while (*link != nullptr && (*link)->value != value) {\n        link = &(*link)->next;\n    }\n    if (*link == nullptr) {\n        return false;\n    }\n    std::unique_ptr<Node> dead = std::move(*link);\n    *link = std::move(dead->next);   /* 先把后继交还给链表，dead 析构时只释放一个节点 */\n    return true;\n}"},{"title":"反转 reverse","note":"用 unique_ptr 就地翻转，不分配任何新节点","code":"template <typename T>\nvoid LinkedList<T>::reverse() noexcept {\n    std::unique_ptr<Node> prev;\n    std::unique_ptr<Node> cur = std::move(head_);\n    while (cur != nullptr) {\n        std::unique_ptr<Node> next = std::move(cur->next);\n        cur->next = std::move(prev);\n        prev = std::move(cur);\n        cur = std::move(next);\n    }\n    head_ = std::move(prev);\n}"},{"title":"释放整条链","note":"析构改成迭代拆链避免递归爆栈，并补齐深拷贝五法则","code":"template <typename T>\nLinkedList<T>::~LinkedList() noexcept {\n    while (head_ != nullptr) {\n        std::unique_ptr<Node> rest = std::move(head_->next);  /* 先断开，再让 head_ 析构 */\n        head_ = std::move(rest);\n    }\n}\n\ntemplate <typename T>\nLinkedList<T>::LinkedList(const LinkedList& other) {\n    Node *tail = nullptr;\n    for (const Node *cur = other.head_.get(); cur != nullptr; cur = cur->next.get()) {\n        std::unique_ptr<Node> node = std::make_unique<Node>(cur->value);\n        if (tail == nullptr) {\n            head_ = std::move(node);\n            tail = head_.get();\n        } else {\n            tail->next = std::move(node);\n            tail = tail->next.get();\n        }\n    }\n}\n\ntemplate <typename T>\nLinkedList<T>& LinkedList<T>::operator=(const LinkedList& other) {\n    if (this != &other) {\n        LinkedList<T> copy(other);     /* copy-and-swap */\n        *this = std::move(copy);\n    }\n    return *this;\n}"},{"title":"main：跑一遍","note":"演示头插、尾插、删除、反转，并验证深拷贝与移动","code":"template <typename T>\nstatic void print_list(const char *tag, const LinkedList<T>& list) {\n    std::cout << tag << \" [\";\n    bool first = true;\n    for (const typename LinkedList<T>::Node *cur = list.head(); cur != nullptr; cur = cur->next.get()) {\n        if (!first) {\n            std::cout << \" -> \";\n        }\n        first = false;\n        std::cout << cur->value;\n    }\n    std::cout << \"]\\n\";\n}\n\nint main() {\n    LinkedList<int> list;\n    list.push_front(3);\n    list.push_front(2);\n    list.push_front(1);\n    print_list(\"after push_front 3,2,1\", list);\n\n    list.push_back(4);\n    list.push_back(5);\n    print_list(\"after push_back 4,5\", list);\n\n    std::cout << \"remove_value(3) -> \" << (list.remove_value(3) ? \"ok\" : \"fail\") << \"\\n\";\n    print_list(\"after remove_value(3)\", list);\n    std::cout << \"remove_value(42) -> \" << (list.remove_value(42) ? \"ok\" : \"fail\") << \"\\n\";\n\n    list.reverse();\n    print_list(\"after reverse\", list);\n\n    LinkedList<int> copied = list;      /* 深拷贝：两个链表互不影响 */\n    copied.push_back(99);\n    print_list(\"copied (deep copy)\", copied);\n    print_list(\"original untouched\", list);\n\n    LinkedList<int> moved = std::move(copied);   /* 移动：O(1) 转移整条链 */\n    print_list(\"moved\", moved);\n    std::cout << \"copied empty after move -> \" << (copied.empty() ? \"true\" : \"false\") << \"\\n\";\n\n    LinkedList<std::string> words;\n    words.push_back(\"beta\");\n    words.push_front(\"alpha\");\n    words.push_back(\"gamma\");\n    print_list(\"words\", words);\n    std::cout << \"head value -> \" << words.head()->value << \"\\n\";\n    return 0;\n}"}]},"rs":{"file":"linkedlist.rs","steps":[{"title":"节点定义","note":"节点用 Option<Box<Node>> 独占持有 next，全程禁止 unsafe","code":"/// 单链表节点：用 Box 在堆上独占一个节点，用 Option 表示“可能没有下一个”。\n#[derive(Debug)]\nstruct Node<T> {\n    value: T,\n    next: Option<Box<Node<T>>>,\n}\n\n/// 单向链表：只持有头指针 head，节点由 Box 独占管理。\n#[derive(Debug, Default)]\npub struct LinkedList<T> {\n    head: Option<Box<Node<T>>>,\n}\n\nimpl<T> Node<T> {\n    /// 创建一个 next 为 None 的新节点。\n    fn new(value: T) -> Self {\n        Node { value, next: None }\n    }\n}"},{"title":"头部插入 push_front","note":"新节点接管旧头，O(1)","code":"impl<T> LinkedList<T> {\n    /// 在链表头部插入元素。\n    pub fn push_front(&mut self, value: T) {\n        let mut node = Box::new(Node::new(value));\n        node.next = self.head.take();   // 旧头交给新节点\n        self.head = Some(node);\n    }\n\n    /// 链表是否为空。\n    pub fn is_empty(&self) -> bool {\n        self.head.is_none()\n    }\n\n    /// 链表长度，O(n)。\n    pub fn len(&self) -> usize {\n        let mut count = 0;\n        let mut cur = self.head.as_deref();\n        while let Some(node) = cur {\n            count += 1;\n            cur = node.next.as_deref();\n        }\n        count\n    }\n}"},{"title":"尾部插入 push_back","note":"用「槽位引用」走到尾部再接上，O(n)","code":"impl<T> LinkedList<T> {\n    /// 在链表尾部追加元素。\n    pub fn push_back(&mut self, value: T) {\n        let mut link = &mut self.head;\n        while let Some(node) = link {\n            link = &mut node.next;   // 不断把 link 指向下一个“槽位”，也就是 next 字段本身\n        }\n        *link = Some(Box::new(Node::new(value)));\n    }\n}"},{"title":"按值删除 remove_value","note":"用槽位引用找到目标，take 出来后让前驱直接指向后继","code":"impl<T: PartialEq> LinkedList<T> {\n    /// 删除第一个等于 value 的节点，返回是否真的删掉了。\n    pub fn remove_value(&mut self, value: &T) -> bool {\n        let mut link: &mut Option<Box<Node<T>>> = &mut self.head;\n        loop {\n            // 先比较：不可变借用在这一行结束时就被释放\n            if link.as_ref().map_or(false, |node| node.value == *value) {\n                let mut removed = link.take().expect(\"matched node exists\");\n                *link = removed.next.take();   // 后继交回链表，removed 的 Box 在这里释放\n                return true;\n            }\n            // 走到链尾仍未命中\n            if link.as_ref().is_none() {\n                return false;\n            }\n            // 前进到下一个槽位（next 字段本身）\n            link = &mut link.as_mut().expect(\"checked some\").next;\n        }\n    }\n}"},{"title":"反转 reverse","note":"while let Some(mut node) = head 三行大法，O(n) 时间 O(1) 空间","code":"impl<T> LinkedList<T> {\n    /// 原地反转整条链。\n    pub fn reverse(&mut self) {\n        let mut prev: Option<Box<Node<T>>> = None;\n        let mut head = self.head.take();\n        while let Some(mut node) = head {\n            let next = node.next.take();   // 先存下后继\n            node.next = prev;              // 翻转指针\n            prev = Some(node);             // 当前节点成为新的头\n            head = next;                   // 继续处理原来的后继\n        }\n        self.head = prev;\n    }\n}"},{"title":"释放整条链","note":"手写 Drop 迭代拆链，避免 Box 链式析构造成深递归","code":"impl<T> Drop for LinkedList<T> {\n    fn drop(&mut self) {\n        let mut cur = self.head.take();\n        while let Some(mut node) = cur {\n            cur = node.next.take();   // 每轮只释放一个节点，next 已经先被摘走\n        }\n    }\n}"},{"title":"main：跑一遍","note":"演示头插、尾插、删除、反转与自动释放","code":"fn print_list<T: std::fmt::Debug>(tag: &str, list: &LinkedList<T>) {\n    print!(\"{:<24} [\", tag);\n    let mut cur = list.head.as_deref();\n    let mut first = true;\n    while let Some(node) = cur {\n        if !first {\n            print!(\" -> \");\n        }\n        first = false;\n        print!(\"{:?}\", node.value);\n        cur = node.next.as_deref();\n    }\n    println!(\"]\");\n}\n\nfn main() {\n    let mut list: LinkedList<i32> = LinkedList::default();\n\n    list.push_front(3);\n    list.push_front(2);\n    list.push_front(1);\n    print_list(\"after push_front 3,2,1\", &list);\n\n    list.push_back(4);\n    list.push_back(5);\n    println!(\"after push_back 4,5 -> len={}\", list.len());\n    print_list(\"after push_back 4,5\", &list);\n\n    println!(\"remove_value(&3) -> {}\", list.remove_value(&3));\n    print_list(\"after remove_value(3)\", &list);\n    println!(\"remove_value(&42) -> {}\", list.remove_value(&42));\n    println!(\"remove_value(&5) -> {}\", list.remove_value(&5));\n\n    list.reverse();\n    print_list(\"after reverse\", &list);\n\n    println!(\"empty -> {}\", list.is_empty());\n\n    let mut words: LinkedList<String> = LinkedList::default();\n    words.push_back(String::from(\"beta\"));\n    words.push_front(String::from(\"alpha\"));\n    words.push_back(String::from(\"gamma\"));\n    print_list(\"words\", &words);\n    println!(\"words.remove_value(&beta) -> {}\", words.remove_value(&\"beta\".to_string()));\n    print_list(\"words after remove\", &words);\n}"}]}},"stack":{"c":{"file":"stack.c","steps":[{"title":"结构定义","note":"用可扩容的动态数组保存栈元素，size 指向栈顶后一位","code":"#include <stdio.h>\n#include <stdlib.h>\n#include <stdbool.h>\n#include <stdint.h>\n\n#define STACK_INIT_CAP 4u\n\ntypedef struct {\n    char   *data;      /* 堆缓冲区 */\n    size_t  size;      /* 栈中元素个数，data[size-1] 是栈顶 */\n    size_t  capacity;  /* 已分配槽位数 */\n} CharStack;"},{"title":"初始化与销毁","note":"stack_init 置空，stack_free 释放缓冲区，扩容统一走 stack_reserve","code":"static void stack_init(CharStack *s) {\n    s->data = NULL;\n    s->size = 0;\n    s->capacity = 0;\n}\n\nstatic void stack_free(CharStack *s) {\n    free(s->data);\n    s->data = NULL;\n    s->size = 0;\n    s->capacity = 0;\n}\n\nstatic bool stack_reserve(CharStack *s, size_t need) {\n    if (need <= s->capacity) {\n        return true;\n    }\n    size_t cap = (s->capacity == 0) ? (size_t)STACK_INIT_CAP : s->capacity;\n    while (cap < need) {\n        if (cap > SIZE_MAX / 2) {\n            cap = need;\n            break;\n        }\n        cap *= 2;                   /* 2 倍扩容，push 均摊 O(1) */\n    }\n    char *grown = (char *)realloc(s->data, cap * sizeof *grown);\n    if (grown == NULL) {\n        return false;\n    }\n    s->data = grown;\n    s->capacity = cap;\n    return true;\n}"},{"title":"入栈 push","note":"容量不足时自动 2 倍扩容，均摊 O(1)","code":"static bool stack_push(CharStack *s, char value) {\n    if (!stack_reserve(s, s->size + 1)) {\n        return false;\n    }\n    s->data[s->size++] = value;\n    return true;\n}"},{"title":"出栈 pop","note":"用输出参数返回栈顶，空栈返回 false","code":"static bool stack_pop(CharStack *s, char *out) {\n    if (s->size == 0) {\n        return false;\n    }\n    if (out != NULL) {\n        *out = s->data[s->size - 1];\n    }\n    s->size--;                      /* 只需挪动 size，元素留着等下次覆盖 */\n    return true;\n}"},{"title":"查看栈顶 peek / 判空","note":"只读访问栈顶，不改变栈的状态","code":"static bool stack_peek(const CharStack *s, char *out) {\n    if (s->size == 0) {\n        return false;\n    }\n    *out = s->data[s->size - 1];\n    return true;\n}\n\nstatic bool stack_empty(const CharStack *s) {\n    return s->size == 0;\n}\n\nstatic size_t stack_size(const CharStack *s) {\n    return s->size;\n}"},{"title":"应用：括号匹配","note":"左括号入栈，右括号必须与栈顶配对，结束时栈必须为空","code":"static bool brackets_balanced(const char *text) {\n    CharStack s;\n    stack_init(&s);\n    bool ok = true;\n    for (const char *p = text; *p != '\\0' && ok; ++p) {\n        switch (*p) {\n            case '(': case '[': case '{':\n                if (!stack_push(&s, *p)) {\n                    ok = false;     /* 内存不足，保守地判为不匹配 */\n                }\n                break;\n            case ')': {\n                char top = '\\0';\n                if (!stack_pop(&s, &top) || top != '(') { ok = false; }\n                break;\n            }\n            case ']': {\n                char top = '\\0';\n                if (!stack_pop(&s, &top) || top != '[') { ok = false; }\n                break;\n            }\n            case '}': {\n                char top = '\\0';\n                if (!stack_pop(&s, &top) || top != '{') { ok = false; }\n                break;\n            }\n            default:\n                break;\n        }\n    }\n    if (ok && !stack_empty(&s)) {\n        ok = false;                 /* \"(((\" 这种结尾栈非空也要判负 */\n    }\n    stack_free(&s);\n    return ok;\n}"},{"title":"main：跑一遍","note":"演示入栈出栈、peek、判空与括号匹配","code":"static void stack_show(const char *tag, const CharStack *s) {\n    printf(\"%-22s size=%zu [\", tag, s->size);\n    for (size_t i = 0; i < s->size; ++i) {\n        printf(\"%s%c\", (i == 0) ? \"\" : \", \", s->data[i]);\n    }\n    printf(\"]\\n\");\n}\n\nint main(void) {\n    CharStack s;\n    stack_init(&s);\n    stack_show(\"init\", &s);\n\n    for (char ch = '1'; ch <= '3'; ++ch) {\n        bool ok = stack_push(&s, ch);\n        printf(\"push %c -> %s\\n\", ch, ok ? \"ok\" : \"fail\");\n    }\n    stack_show(\"after push 1..3\", &s);\n\n    char top = '\\0';\n    printf(\"peek -> %s, top=%c\\n\", stack_peek(&s, &top) ? \"ok\" : \"fail\", top);\n    printf(\"pop  -> %s, top=%c\\n\", stack_pop(&s, &top) ? \"ok\" : \"fail\", top);\n    stack_show(\"after pop\", &s);\n    printf(\"empty -> %s, size=%zu\\n\", stack_empty(&s) ? \"true\" : \"false\", stack_size(&s));\n\n    stack_pop(&s, &top);\n    stack_pop(&s, &top);\n    printf(\"pop on empty -> %s\\n\", stack_pop(&s, &top) ? \"ok\" : \"fail\");\n    printf(\"empty -> %s\\n\", stack_empty(&s) ? \"true\" : \"false\");\n\n    const char *cases[] = {\"()\", \"([{}])\", \"([)]\", \"(((\", \"no brackets\"};\n    for (size_t i = 0; i < sizeof cases / sizeof cases[0]; ++i) {\n        printf(\"balanced(\\\"%s\\\") -> %s\\n\", cases[i], brackets_balanced(cases[i]) ? \"true\" : \"false\");\n    }\n\n    stack_free(&s);\n    stack_show(\"after free\", &s);\n    return 0;\n}"}]},"cpp":{"file":"stack.cpp","steps":[{"title":"结构定义","note":"模板类 Stack<T> 以 std","code":"#include <cstddef>\n#include <iostream>\n#include <optional>\n#include <stdexcept>\n#include <string>\n#include <utility>\n#include <vector>\n\ntemplate <typename T>\nclass Stack {\npublic:\n    Stack() noexcept;\n    explicit Stack(std::size_t hint);\n    ~Stack() noexcept;\n    Stack(const Stack&);\n    Stack(Stack&&) noexcept;\n    Stack& operator=(const Stack&);\n    Stack& operator=(Stack&&) noexcept;\n\n    bool empty() const noexcept { return data_.empty(); }\n    std::size_t size() const noexcept { return data_.size(); }\n    void clear() noexcept { data_.clear(); }\n\n    void push(const T& value);\n    void push(T&& value);\n    std::optional<T> pop();\n    const T& peek() const;\n    T& peek();\n\nprivate:\n    std::vector<T> data_;   /* 底层容器负责扩容，Stack 只暴露栈语义 */\n};"},{"title":"初始化与销毁","note":"构造/析构交给 vector，RAII 保证异常安全，可预留容量","code":"template <typename T>\nStack<T>::Stack() noexcept = default;\n\ntemplate <typename T>\nStack<T>::Stack(std::size_t hint) {\n    data_.reserve(hint);\n}\n\ntemplate <typename T>\nStack<T>::~Stack() noexcept = default;\n\ntemplate <typename T>\nStack<T>::Stack(const Stack&) = default;\n\ntemplate <typename T>\nStack<T>::Stack(Stack&&) noexcept = default;\n\ntemplate <typename T>\nStack<T>& Stack<T>::operator=(const Stack&) = default;\n\ntemplate <typename T>\nStack<T>& Stack<T>::operator=(Stack&&) noexcept = default;"},{"title":"入栈 push","note":"vector","code":"template <typename T>\nvoid Stack<T>::push(const T& value) {\n    data_.push_back(value);\n}\n\ntemplate <typename T>\nvoid Stack<T>::push(T&& value) {\n    data_.push_back(std::move(value));\n}"},{"title":"出栈 pop","note":"返回 std","code":"template <typename T>\nstd::optional<T> Stack<T>::pop() {\n    if (data_.empty()) {\n        return std::nullopt;\n    }\n    T value = std::move(data_.back());\n    data_.pop_back();\n    return value;\n}"},{"title":"查看栈顶 peek / 判空","note":"空栈 peek 抛 std","code":"template <typename T>\nconst T& Stack<T>::peek() const {\n    if (data_.empty()) {\n        throw std::out_of_range(\"Stack::peek on empty stack\");\n    }\n    return data_.back();\n}\n\ntemplate <typename T>\nT& Stack<T>::peek() {\n    if (data_.empty()) {\n        throw std::out_of_range(\"Stack::peek on empty stack\");\n    }\n    return data_.back();\n}"},{"title":"应用：括号匹配","note":"左括号入栈，右括号必须与栈顶配对，结束时栈必须为空","code":"inline bool brackets_balanced(const std::string& text) {\n    Stack<char> stack;\n    for (char ch : text) {\n        switch (ch) {\n            case '(': case '[': case '{':\n                stack.push(ch);\n                break;\n            case ')': {\n                std::optional<char> top = stack.pop();\n                if (!top || *top != '(') { return false; }\n                break;\n            }\n            case ']': {\n                std::optional<char> top = stack.pop();\n                if (!top || *top != '[') { return false; }\n                break;\n            }\n            case '}': {\n                std::optional<char> top = stack.pop();\n                if (!top || *top != '{') { return false; }\n                break;\n            }\n            default:\n                break;\n        }\n    }\n    return stack.empty();   /* \"(((\" 结尾栈非空即判负 */\n}"},{"title":"main：跑一遍","note":"演示三种栈操作，并用 \"([)]\" 与 \"(((\" 验证括号匹配","code":"int main() {\n    Stack<int> stack;\n    std::cout << \"empty -> \" << (stack.empty() ? \"true\" : \"false\") << \"\\n\";\n    for (int v = 1; v <= 3; ++v) {\n        stack.push(v);\n        std::cout << \"push \" << v << \" -> size=\" << stack.size() << \" top=\" << stack.peek() << \"\\n\";\n    }\n    std::cout << \"peek -> \" << stack.peek() << \"\\n\";\n    std::cout << \"pop  -> \" << stack.pop().value_or(-1) << \"\\n\";\n    std::cout << \"pop  -> \" << stack.pop().value_or(-1) << \"\\n\";\n    std::cout << \"pop  -> \" << stack.pop().value_or(-1) << \"\\n\";\n    std::cout << \"pop on empty -> \" << (stack.pop().has_value() ? \"value\" : \"nullopt\") << \"\\n\";\n    std::cout << \"empty -> \" << (stack.empty() ? \"true\" : \"false\") << \"\\n\";\n\n    try {\n        (void)stack.peek();\n    } catch (const std::out_of_range& e) {\n        std::cout << \"peek on empty -> out_of_range: \" << e.what() << \"\\n\";\n    }\n\n    const std::string cases[] = {\"()\", \"([{}])\", \"([)]\", \"(((\", \"no brackets\"};\n    for (const std::string& s : cases) {\n        std::cout << \"balanced(\\\"\" << s << \"\\\") -> \" << (brackets_balanced(s) ? \"true\" : \"false\") << \"\\n\";\n    }\n\n    Stack<char> chars(8);   /* 带容量提示的构造 */\n    chars.push('a');\n    chars.push('b');\n    std::cout << \"char stack top -> \" << chars.peek() << \", size=\" << chars.size() << \"\\n\";\n    return 0;\n}"}]},"rs":{"file":"stack.rs","steps":[{"title":"结构定义","note":"用 Vec<T> 保存栈元素，栈顶就是 Vec 的末尾","code":"/// 泛型栈：底层用 Vec 承担扩容，对外只暴露栈语义。\n#[derive(Debug, Default, Clone, PartialEq, Eq)]\npub struct Stack<T> {\n    data: Vec<T>,\n}"},{"title":"初始化与销毁","note":"new 与 with_capacity；释放由 Vec 的 Drop 自动完成","code":"impl<T> Stack<T> {\n    /// 创建一个空栈。\n    pub fn new() -> Self {\n        Stack { data: Vec::new() }\n    }\n\n    /// 创建一个至少能容纳 capacity 个元素的空栈。\n    pub fn with_capacity(capacity: usize) -> Self {\n        Stack { data: Vec::with_capacity(capacity) }\n    }\n}"},{"title":"入栈 push","note":"Vec","code":"impl<T> Stack<T> {\n    /// 把元素压入栈顶。\n    pub fn push(&mut self, value: T) {\n        self.data.push(value);\n    }\n}"},{"title":"出栈 pop","note":"返回 Option，空栈返回 None","code":"impl<T> Stack<T> {\n    /// 弹出并返回栈顶元素；空栈返回 None。\n    pub fn pop(&mut self) -> Option<T> {\n        self.data.pop()\n    }\n}"},{"title":"查看栈顶 peek / 判空","note":"peek 返回 Option 引用，empty 判断是否为空","code":"impl<T> Stack<T> {\n    /// 查看栈顶元素但不弹出；空栈返回 None。\n    pub fn peek(&self) -> Option<&T> {\n        self.data.last()\n    }\n\n    /// 栈是否为空。\n    pub fn is_empty(&self) -> bool {\n        self.data.is_empty()\n    }\n\n    /// 栈中元素个数。\n    pub fn len(&self) -> usize {\n        self.data.len()\n    }\n\n    /// 清空栈但保留已分配的容量。\n    pub fn clear(&mut self) {\n        self.data.clear();\n    }\n}"},{"title":"应用：括号匹配","note":"左括号入栈，右括号必须与栈顶配对，结束时栈必须为空","code":"/// 判断字符串里的括号是否合法匹配。\npub fn brackets_balanced(text: &str) -> bool {\n    let mut stack: Stack<char> = Stack::new();\n    for ch in text.chars() {\n        match ch {\n            '(' | '[' | '{' => stack.push(ch),\n            ')' => {\n                if stack.pop() != Some('(') {\n                    return false;   // \"([)]\" 会在这里失败\n                }\n            }\n            ']' => {\n                if stack.pop() != Some('[') {\n                    return false;\n                }\n            }\n            '}' => {\n                if stack.pop() != Some('{') {\n                    return false;\n                }\n            }\n            _ => {}\n        }\n    }\n    stack.is_empty()   // \"(((\" 走到这里栈非空，返回 false\n}"},{"title":"main：跑一遍","note":"演示入栈出栈、peek、判空与括号匹配","code":"fn main() {\n    let mut stack: Stack<i32> = Stack::with_capacity(4);\n    println!(\"empty -> {}\", stack.is_empty());\n    for v in 1..=3 {\n        stack.push(v);\n        println!(\"push {} -> len={} top={:?}\", v, stack.len(), stack.peek());\n    }\n    println!(\"peek -> {:?}\", stack.peek());\n    println!(\"pop  -> {:?}\", stack.pop());\n    println!(\"pop  -> {:?}\", stack.pop());\n    println!(\"pop  -> {:?}\", stack.pop());\n    println!(\"pop on empty -> {:?}\", stack.pop());\n    println!(\"empty -> {}\", stack.is_empty());\n\n    for case in [\"()\", \"([{}])\", \"([)]\", \"(((\", \"no brackets\"] {\n        println!(\"balanced({:?}) -> {}\", case, brackets_balanced(case));\n    }\n\n    let mut chars: Stack<char> = Stack::new();\n    chars.push('a');\n    chars.push('b');\n    println!(\"char stack top -> {:?}, len={}\", chars.peek(), chars.len());\n    chars.clear();\n    println!(\"after clear -> empty={}\", chars.is_empty());\n}"}]}},"queue":{"c":{"file":"queue.c","steps":[{"title":"环形队列结构","note":"用「牺牲一格」策略定义定长环形缓冲区的成员与容量约定","code":"#include <stdio.h>\n#include <stdlib.h>\n#include <stdbool.h>\n#include <assert.h>\n\n/*\n * 环形队列（circular queue / ring buffer），元素类型为 int。\n *\n * 「牺牲一格」策略：申请 capacity + 1 个槽位，永远留一个槽不存数据，\n * 于是「空」和「满」再也不会撞车：\n *      空: head == tail\n *      满: (tail + 1) % (capacity + 1) == head\n * 代价是容量为 capacity 的队列最多只能放 capacity 个元素（浪费一个槽）；\n * 好处是不需要额外的 count 字段，判据完全由两个下标表达。\n */\ntypedef struct {\n    int    *data;      /* 底层缓冲区，实际长度为 capacity + 1 */\n    size_t  capacity;  /* 用户可见容量：最多可存放的元素个数 */\n    size_t  head;      /* 队首下标（下一个出队位置） */\n    size_t  tail;      /* 队尾下标（下一个入队位置） */\n} IntQueue;\n\n/* 接口前置声明：让后面的步骤可以按教学顺序自由排列 */\nstatic size_t queue_slots(const IntQueue *q);\nbool   queue_is_empty(const IntQueue *q);\nbool   queue_is_full(const IntQueue *q);\nsize_t queue_size(const IntQueue *q);"},{"title":"初始化与销毁","note":"分配 capacity 加一格缓冲区，并让所有失败路径都可回收","code":"/* 初始化：成功返回 true；capacity 为 0 或内存不足时返回 false 且不改动 *q。 */\nbool queue_init(IntQueue *q, size_t capacity)\n{\n    if (q == NULL || capacity == 0) {\n        return false;\n    }\n    size_t slots = capacity + 1;            /* 多开一格，这就是「牺牲一格」的物理代价 */\n    if (slots <= capacity) {                /* size_t 回绕保护 */\n        return false;\n    }\n    int *buf = (int *)malloc(slots * sizeof(int));\n    if (buf == NULL) {                      /* malloc 返回值必须检查 */\n        return false;\n    }\n    q->data     = buf;\n    q->capacity = capacity;\n    q->head     = 0;\n    q->tail     = 0;\n    return true;\n}\n\n/* 销毁：释放缓冲区并把结构体复位，重复调用是安全的。 */\nvoid queue_free(IntQueue *q)\n{\n    if (q == NULL) {\n        return;\n    }\n    free(q->data);\n    q->data     = NULL;\n    q->capacity = 0;\n    q->head     = 0;\n    q->tail     = 0;\n}"},{"title":"入队 enqueue","note":"先判满、再写入、最后把 tail 环形推进一格","code":"bool queue_enqueue(IntQueue *q, int value)\n{\n    assert(q != NULL && q->data != NULL);\n    if (queue_is_full(q)) {\n        return false;                       /* 队列满：拒绝写入，由调用者决定丢谁 */\n    }\n    q->data[q->tail] = value;\n    q->tail = (q->tail + 1) % queue_slots(q);   /* 走到末尾时自动回绕到 0 */\n    return true;\n}"},{"title":"出队 dequeue","note":"从 head 取值写出并环形推进，空队列返回 false","code":"bool queue_dequeue(IntQueue *q, int *out)\n{\n    assert(q != NULL && q->data != NULL);\n    if (queue_is_empty(q)) {\n        return false;\n    }\n    if (out != NULL) {\n        *out = q->data[q->head];\n    }\n    q->head = (q->head + 1) % queue_slots(q);   /* 与入队同构，也是环形推进 */\n    return true;\n}"},{"title":"判空 / 判满 / 大小","note":"head 与 tail 的相对位置就是队列的全部状态","code":"static size_t queue_slots(const IntQueue *q)\n{\n    return q->capacity + 1;                 /* 含那个永远留空的哨兵槽 */\n}\n\nbool queue_is_empty(const IntQueue *q)\n{\n    assert(q != NULL);\n    return q->head == q->tail;              /* 空：两下标重合 */\n}\n\nbool queue_is_full(const IntQueue *q)\n{\n    assert(q != NULL);\n    /* 满：tail 再走一步就会撞上 head，即那个空槽被「预定」掉了 */\n    return (q->tail + 1) % queue_slots(q) == q->head;\n}\n\nsize_t queue_size(const IntQueue *q)\n{\n    assert(q != NULL);\n    /* 先加回一圈再取模，避免 tail - head 为负（size_t 无符号下会变成天文数字） */\n    return (q->tail + queue_slots(q) - q->head) % queue_slots(q);\n}"},{"title":"main：跑一遍","note":"用固定序列制造 tail 从 4 回绕到 0，并逐行打印状态","code":"static void queue_dump(const char *tag, const IntQueue *q)\n{\n    size_t n = queue_size(q);\n    printf(\"%-18s size=%zu head=%zu tail=%zu | front->back:\", tag, n, q->head, q->tail);\n    for (size_t i = 0; i < n; ++i) {\n        printf(\" %d\", q->data[(q->head + i) % queue_slots(q)]);\n    }\n    printf(\"\\n\");\n}\n\nint main(void)\n{\n    IntQueue q;\n    if (!queue_init(&q, 4)) {               /* 容量 4，底层实际 5 个槽位 */\n        fprintf(stderr, \"queue_init failed\\n\");\n        return 1;\n    }\n    printf(\"capacity=%zu slots=%zu (牺牲一格)\\n\", q.capacity, queue_slots(&q));\n    queue_dump(\"init\", &q);\n\n    /* 阶段一：一路入队到满，tail 从 0 走到 4 */\n    for (int v = 1; v <= 5; ++v) {\n        bool ok = queue_enqueue(&q, v);\n        printf(\"enqueue(%-2d) -> %-5s | head=%zu tail=%zu size=%zu\\n\",\n               v, ok ? \"true\" : \"false\", q.head, q.tail, queue_size(&q));\n    }\n\n    /* 阶段二：出队两个，把队首空间空出来 */\n    int out = 0;\n    for (int i = 0; i < 2; ++i) {\n        bool ok = queue_dequeue(&q, &out);\n        printf(\"dequeue()   -> %-5s | value=%-2d head=%zu tail=%zu size=%zu\\n\",\n               ok ? \"true\" : \"false\", out, q.head, q.tail, queue_size(&q));\n    }\n\n    /* 阶段三：再入队两个，tail 会从 4 回绕到 0，这就是环形队列的关键一步 */\n    for (int v = 6; v <= 7; ++v) {\n        bool ok = queue_enqueue(&q, v);\n        printf(\"enqueue(%-2d) -> %-5s | head=%zu tail=%zu size=%zu\\n\",\n               v, ok ? \"true\" : \"false\", q.head, q.tail, queue_size(&q));\n    }\n    queue_dump(\"after wrap\", &q);\n    printf(\"enqueue(8)  -> %s  (判满生效，拒绝写入)\\n\",\n           queue_enqueue(&q, 8) ? \"true\" : \"false\");\n    printf(\"queue_is_full -> %s (此时不再取数据，保留 3 4 6 7)\\n\", queue_is_full(&q) ? \"true\" : \"false\");\n\n    /* 阶段四：全部出队，验证先进先出次序 */\n    printf(\"FIFO drain:\");\n    while (queue_dequeue(&q, &out)) {\n        printf(\" %d\", out);\n    }\n    printf(\"\\n\");\n    printf(\"drained: is_empty=%s size=%zu\\n\", queue_is_empty(&q) ? \"true\" : \"false\", queue_size(&q));\n    printf(\"dequeue on empty -> %s\\n\", queue_dequeue(&q, &out) ? \"true\" : \"false\");\n\n    queue_free(&q);\n    printf(\"queue_free done\\n\");\n    return 0;\n}"}]},"cpp":{"file":"queue.cpp","steps":[{"title":"环形队列结构","note":"用 std","code":"#include <cstddef>\n#include <deque>\n#include <iostream>\n#include <optional>\n#include <stdexcept>\n#include <string>\n#include <utility>\n#include <vector>\n\n/*\n * RingQueue<T>：与 C 版同构的「牺牲一格」环形队列。\n * 缓冲区交给 std::vector<T> 持有，容量在构造时固定，释放完全由 RAII 负责。\n *\n * 为什么工程代码通常直接用 std::deque<T> 而不是手写这个类？\n *   1. std::deque 是分块（chunked）双端队列，push_back / pop_front 都是摊销 O(1)，\n *      容量按需增长；RingQueue 写满后必须由调用者处理溢出，或者自己搬移扩容——\n *      那基本就是在重写 std::deque。\n *   2. std::deque 不需要牺牲一个槽位，也没有每次访问都要做的取模运算；\n *      RingQueue 的 head/tail 递推是模运算，运行期容量无法被编译器折成位与。\n *   3. std::deque 提供随机访问迭代器、范围 for、稳定的引用语义；手写环形缓冲\n *      要把这些再实现一遍，而迭代器正是最容易写出 UB 的地方。\n * 只有在「容量固定 + 无堆分配 + 内存布局可控」的场合（嵌入式、实时音频回调、\n * 单生产者单消费者无锁队列，例如 Linux 内核的 kfifo）手写环形缓冲才更有优势，\n * 而那时通常配一条静态数组，而不是 std::vector。\n */\ntemplate <typename T>\nclass RingQueue {\npublic:\n    explicit RingQueue(std::size_t capacity);\n\n    RingQueue(const RingQueue&) = default;          // vector 深拷贝：副本各自持有缓冲\n    RingQueue(RingQueue&&) noexcept = default;      // 移动只是转移 vector 的所有权\n    RingQueue& operator=(const RingQueue&) = default;\n    RingQueue& operator=(RingQueue&&) noexcept = default;\n    ~RingQueue();\n\n    bool enqueue(const T& value);\n    bool enqueue(T&& value);\n    std::optional<T> dequeue();\n    const T& front() const;\n\n    bool empty() const noexcept;\n    bool full() const noexcept;\n    std::size_t size() const noexcept;\n    std::size_t capacity() const noexcept;\n    std::size_t slots() const noexcept;\n    std::size_t head_index() const noexcept;\n    std::size_t tail_index() const noexcept;\n\nprivate:\n    std::vector<T> buf_;        // 长度 = capacity_ + 1\n    std::size_t    capacity_;\n    std::size_t    head_;\n    std::size_t    tail_;\n};"},{"title":"初始化与销毁","note":"构造函数固定容量，析构函数交给 RAII 无需手写 free","code":"template <typename T>\nRingQueue<T>::RingQueue(std::size_t capacity)\n    : buf_(capacity + 1), capacity_(capacity), head_(0), tail_(0)\n{\n    if (capacity == 0) {\n        throw std::invalid_argument(\"RingQueue: capacity must be greater than zero\");\n    }\n}\n\ntemplate <typename T>\nRingQueue<T>::~RingQueue()\n{\n    /* 函数体执行时 buf_ 还活着，离开作用域后由 vector 的析构自动归还内存。\n       这里显式写出析构函数，是为了说明：环形队列不需要任何手写 free，\n       也不存在 C 版里忘记调用 queue_free 造成的泄漏。 */\n    head_ = 0;\n    tail_ = 0;\n}"},{"title":"入队 enqueue","note":"先判满再写入，然后把 tail 环形推进","code":"template <typename T>\nbool RingQueue<T>::enqueue(const T& value)\n{\n    if (full()) {\n        return false;                   // 满：拒绝写入，不覆盖已有元素\n    }\n    buf_[tail_] = value;\n    tail_ = (tail_ + 1) % slots();      // 到末尾自动回绕到 0\n    return true;\n}\n\ntemplate <typename T>\nbool RingQueue<T>::enqueue(T&& value)\n{\n    if (full()) {\n        return false;\n    }\n    buf_[tail_] = std::move(value);     // 右值重载：只发生一次移动\n    tail_ = (tail_ + 1) % slots();\n    return true;\n}"},{"title":"出队 dequeue","note":"用 std","code":"template <typename T>\nstd::optional<T> RingQueue<T>::dequeue()\n{\n    if (empty()) {\n        return std::nullopt;                    // 空队列：类型系统里就没有值可给\n    }\n    std::optional<T> out{std::move(buf_[head_])};   // 搬走元素，原槽位留下 moved-from 对象\n    head_ = (head_ + 1) % slots();\n    return out;\n}\n\ntemplate <typename T>\nconst T& RingQueue<T>::front() const\n{\n    if (empty()) {\n        throw std::out_of_range(\"RingQueue::front called on an empty queue\");\n    }\n    return buf_[head_];\n}"},{"title":"判空 / 判满 / 大小","note":"全部只是 head 与 tail 的模运算，且都不抛异常","code":"template <typename T>\nbool RingQueue<T>::empty() const noexcept\n{\n    return head_ == tail_;\n}\n\ntemplate <typename T>\nbool RingQueue<T>::full() const noexcept\n{\n    return (tail_ + 1) % slots() == head_;      // tail 再走一步就撞上 head\n}\n\ntemplate <typename T>\nstd::size_t RingQueue<T>::size() const noexcept\n{\n    return (tail_ + slots() - head_) % slots(); // 先加一圈再取模，永不出现负数\n}\n\ntemplate <typename T>\nstd::size_t RingQueue<T>::capacity() const noexcept\n{\n    return capacity_;\n}\n\ntemplate <typename T>\nstd::size_t RingQueue<T>::slots() const noexcept\n{\n    return capacity_ + 1;\n}\n\ntemplate <typename T>\nstd::size_t RingQueue<T>::head_index() const noexcept\n{\n    return head_;\n}\n\ntemplate <typename T>\nstd::size_t RingQueue<T>::tail_index() const noexcept\n{\n    return tail_;\n}"},{"title":"main：跑一遍","note":"按值拷贝出来随便出队打印，并展示 tail 回绕与 std","code":"#include <deque>\n\nstatic void dump(const std::string& tag, RingQueue<int> q)   // 按值传参：顺便验证拷贝构造正确\n{\n    std::cout << tag;\n    std::cout << \" size=\" << q.size() << \" head=\" << q.head_index()\n              << \" tail=\" << q.tail_index() << \" | front->back:\";\n    while (std::optional<int> v = q.dequeue()) {\n        std::cout << ' ' << *v;\n    }\n    std::cout << '\\n';\n}\n\nint main()\n{\n    RingQueue<int> q(4);                        // 容量 4，底层 5 个槽位\n    std::cout << \"capacity=\" << q.capacity() << \" slots=\" << q.slots() << \" (牺牲一格)\\n\";\n    dump(\"init\", q);\n\n    /* 阶段一：一路入队到满，tail 从 0 走到 4 */\n    for (int v = 1; v <= 5; ++v) {\n        const bool ok = q.enqueue(v);\n        std::cout << \"enqueue(\" << v << \") -> \" << (ok ? \"true \" : \"false\")\n                  << \" | head=\" << q.head_index() << \" tail=\" << q.tail_index()\n                  << \" size=\" << q.size() << '\\n';\n    }\n\n    /* 阶段二：出队两个，腾出队首空间 */\n    for (int i = 0; i < 2; ++i) {\n        const std::optional<int> v = q.dequeue();\n        std::cout << \"dequeue() -> value=\" << (v ? std::to_string(*v) : std::string(\"none\"))\n                  << \" | head=\" << q.head_index() << \" tail=\" << q.tail_index()\n                  << \" size=\" << q.size() << '\\n';\n    }\n\n    /* 阶段三：再入队两个，tail 从 4 回绕到 0 */\n    for (int v = 6; v <= 7; ++v) {\n        const bool ok = q.enqueue(v);\n        std::cout << \"enqueue(\" << v << \") -> \" << (ok ? \"true \" : \"false\")\n                  << \" | head=\" << q.head_index() << \" tail=\" << q.tail_index()\n                  << \" size=\" << q.size() << '\\n';\n    }\n    dump(\"after wrap\", q);\n    std::cout << \"enqueue(8) -> \" << (q.enqueue(8) ? \"true\" : \"false\") << \" (判满生效)\\n\";\n    std::cout << \"front() = \" << q.front() << \"\\n\";\n\n    /* 阶段四：全部出队，验证先进先出 */\n    std::cout << \"FIFO drain:\";\n    while (std::optional<int> v = q.dequeue()) {\n        std::cout << ' ' << *v;\n    }\n    std::cout << '\\n';\n    std::cout << \"drained: empty=\" << (q.empty() ? \"true\" : \"false\") << \" size=\" << q.size() << '\\n';\n\n    try {\n        (void)q.front();                        // 空队列取队首：抛 std::out_of_range\n        std::cout << \"front() on empty did not throw (unexpected)\\n\";\n    } catch (const std::out_of_range& e) {\n        std::cout << \"front() on empty throws std::out_of_range: \" << e.what() << '\\n';\n    }\n\n    /* 对照：同样的事情用 std::deque 只需四行，容量还会自动增长 */\n    std::deque<int> dq;\n    for (int v = 1; v <= 5; ++v) {\n        dq.push_back(v);                        // 第 5 个不会失败，deque 自己扩容\n    }\n    const int a = dq.front(); dq.pop_front();\n    const int b = dq.front(); dq.pop_front();\n    dq.push_back(6);\n    dq.push_back(7);\n    std::cout << \"std::deque 对照: push_back(5) 成功(自动扩容), pop_front=\" << a << '/' << b\n              << \", 内容:\";\n    for (int v : dq) {\n        std::cout << ' ' << v;\n    }\n    std::cout << '\\n';\n    return 0;\n}"}]},"rs":{"file":"queue.rs","steps":[{"title":"环形队列结构","note":"用 Vec of Option 手工实现「牺牲一格」的环形缓冲","code":"//! 循环队列（circular queue / ring buffer）教学实现。\n//!\n//! 为什么答案不是 VecDeque？std::collections::VecDeque 就是标准库提供的环形缓冲，\n//! 工程代码应当直接使用它：容量按需增长、不必牺牲槽位、两端操作摊销 O(1) 且支持随机访问。\n//! 本文件用 Vec<Option<T>> 手工实现，是为了把 head / tail / 判满的算术摊开讲清楚；\n//! 第 6 步会给出 VecDeque 的等价写法做对照。\n\n/// 定长环形队列，用户可见容量为 capacity，底层缓冲区长度为 capacity + 1。\n///\n/// 多出来的那一格永远保持 None，用来区分「空」与「满」：\n///   - 空：head == tail\n///   - 满：(tail + 1) % (capacity + 1) == head\n#[derive(Debug, Clone)]\nstruct RingQueue<T> {\n    buf: Vec<Option<T>>, // 长度 = capacity + 1\n    capacity: usize,     // 用户可见容量\n    head: usize,         // 队首下标（出队位置）\n    tail: usize,         // 队尾下标（下一个入队位置）\n}"},{"title":"初始化与销毁","note":"new 分配 capacity 加一格缓冲，Drop 负责确定性释放","code":"impl<T> RingQueue<T> {\n    /// 新建一个最多容纳 capacity 个元素的环形队列。capacity 必须大于 0。\n    fn new(capacity: usize) -> Self {\n        assert!(capacity > 0, \"capacity must be greater than zero\");\n        // 注意：不能用 vec![None; n]，那会要求 Option<T>: Clone（即 T: Clone）。\n        // 用迭代器构造，只要求 T 本身，没有任何额外约束。\n        let buf: Vec<Option<T>> = (0..=capacity).map(|_| None).collect();\n        RingQueue {\n            buf,\n            capacity,\n            head: 0,\n            tail: 0,\n        }\n    }\n\n    /// 清空队列但保留缓冲区容量，语义等价于反复出队直到为空。\n    fn clear(&mut self) {\n        while self.dequeue().is_some() {}\n    }\n}\n\nimpl<T> Drop for RingQueue<T> {\n    /// Rust 没有手写的 free：Vec 会在字段析构时自动归还内存。\n    /// 这里显式实现 Drop，只是把「销毁时队列必须为空」这条不变量写进代码。\n    fn drop(&mut self) {\n        self.buf.clear();\n        self.head = 0;\n        self.tail = 0;\n    }\n}"},{"title":"入队 enqueue","note":"判满后写入 tail 位置，再把 tail 环形推进一格","code":"impl<T> RingQueue<T> {\n    /// 入队。队列满时把值原样还给调用者（Err(value)），绝不静默丢弃数据。\n    fn enqueue(&mut self, value: T) -> Result<(), T> {\n        if self.is_full() {\n            return Err(value);\n        }\n        let tail = self.tail;\n        self.buf[tail] = Some(value);\n        self.tail = (tail + 1) % self.slots(); // 走到末尾自动回绕到 0\n        Ok(())\n    }\n}"},{"title":"出队 dequeue","note":"Option","code":"impl<T> RingQueue<T> {\n    /// 出队。空队列返回 None，而不是 panic。\n    fn dequeue(&mut self) -> Option<T> {\n        if self.is_empty() {\n            return None;\n        }\n        let head = self.head;\n        let value = self.buf[head].take(); // take() 取值并把槽位留成 None\n        self.head = (head + 1) % self.slots();\n        value\n    }\n\n    /// 只读地看一眼队首，不出队。\n    fn front(&self) -> Option<&T> {\n        self.buf[self.head].as_ref()\n    }\n}"},{"title":"判空 / 判满 / 大小","note":"全部由 head 与 tail 的模运算推出","code":"impl<T> RingQueue<T> {\n    /// 底层缓冲区长度，含那个永远留空的哨兵槽。\n    fn slots(&self) -> usize {\n        self.capacity + 1\n    }\n\n    /// 空：两个下标重合。\n    fn is_empty(&self) -> bool {\n        self.head == self.tail\n    }\n\n    /// 满：tail 再走一步就撞上 head。\n    fn is_full(&self) -> bool {\n        (self.tail + 1) % self.slots() == self.head\n    }\n\n    /// 元素个数。先加一圈再取模，避免 usize 下溢。\n    fn len(&self) -> usize {\n        (self.tail + self.slots() - self.head) % self.slots()\n    }\n\n    fn capacity(&self) -> usize {\n        self.capacity\n    }\n\n
