const PAT = 'abcac';

function S(o) {
  return Object.assign({ i: 0, j: 0, matched: 0, cmp: 0, note: '', next: null, flash: '' }, o || {});
}

const bfSteps = [
  { text: '主串 T = "ababcabcacbab"，模式串 P = "abcac"。把两个串都当字符数组看，i 指着主串、j 指着模式串，从 0 开始逐字符比。',
    s: S({ i: 0, j: 0, note: '准备开始' }) },
  { text: 'T[0] = a，P[0] = a，相等 → i 和 j 一起往后走。',
    s: S({ i: 1, j: 1, matched: 1, cmp: 1, note: 'a == a，两边都前进' }) },
  { text: 'T[1] = b，P[1] = b，相等 → 继续。',
    s: S({ i: 2, j: 2, matched: 2, cmp: 2, note: 'b == b' }) },
  { text: 'T[2] = a，P[2] = c —— <b>失配</b>。这只说明"从 0 开始的这次尝试失败了"，主串要从下标 1 重新试：i = i - j + 1 = 1，j 归零。',
    s: S({ i: 1, j: 0, matched: 0, cmp: 3, note: '失配 → i 回退到 1，j = 0', flash: 'retreat' }) },
  { text: 'i = 1：T[1] = b，P[0] = a，第一个字符就不等。i 再回退到 2。',
    s: S({ i: 2, j: 0, matched: 0, cmp: 4, note: 'b != a，继续回退' }) },
  { text: 'i = 2：T[2]=a、T[3]=b、T[4]=c、T[5]=a 都对上了，到 T[6] = b 和 P[4] = c 又失配。i 回退到 3。',
    s: S({ i: 3, j: 0, matched: 0, cmp: 9, note: '又失配 → i = 6-4+1 = 3', flash: 'retreat' }) },
  { text: 'i = 3、i = 4 都在第一个字符就失配（b、c 都不等于 a），i 一路挪到 5。',
    s: S({ i: 5, j: 0, matched: 0, cmp: 11, note: 'i 挪到 5' }) },
  { text: 'i = 5 开始：T[5]=a、T[6]=b、T[7]=c、T[8]=a、T[9]=c，5 个字符全对上！返回 i - j = 5 —— 模式串第一次出现在主串的下标 5。',
    s: S({ i: 10, j: 5, matched: 5, cmp: 16, note: '匹配成功！返回 10 - 5 = 5', flash: 'win' }) },
  { text: 'BF 的问题：一旦失配，i 就要往回跳，前面比过的字符可能还要再比一遍。最坏情况（比如 T="aaaaaaab"、P="aaab"）是 O(n*m)。',
    s: S({ i: 5, j: 5, matched: 5, cmp: 16, note: '时间复杂度 O(n*m)' }) }
];

const KNEXT = [-1, 0, 0, 0, 1];
const kmpSteps = [
  { text: 'KMP 的核心思路：<b>主串的 i 永远不往回退</b>。失配时只让模式串的 j 往回跳，跳到 next[j] 继续比。先看模式串 "abcac" 的 next 数组：[-1, 0, 0, 0, 1]。',
    s: S({ i: 0, j: 0, next: KNEXT, note: 'next[j] 表示"失配时 j 该退到哪"' }) },
  { text: 'next[j] 的含义是：P[0..j-1] 这段里，最长的"既是前缀又是后缀"的长度。比如 j=4 时前缀 "a" 和后缀 "a" 相等，所以 next[4] = 1。',
    s: S({ i: 0, j: 0, next: KNEXT, note: '前缀 = 后缀 的最长长度' }) },
  { text: '开始匹配：T[0]=a 对 P[0]=a，i=1、j=1。',
    s: S({ i: 1, j: 1, matched: 1, next: KNEXT, cmp: 1, note: 'a == a' }) },
  { text: 'T[1]=b 对 P[1]=b，相等，i=2、j=2。',
    s: S({ i: 2, j: 2, matched: 2, next: KNEXT, cmp: 2, note: 'b == b' }) },
  { text: 'T[2]=a 对 P[2]=c，<b>失配</b>。这时候 i <b>不动</b>（还是 2），只把 j 跳到 next[2] = 0。对比 BF 那一版：BF 是把 i 退回到 1、j 归零。',
    s: S({ i: 2, j: 0, matched: 0, next: KNEXT, cmp: 3, note: '失配 → j = next[2] = 0，i 不动！', flash: 'jump' }) },
  { text: '继续：T[2]=a 对 P[0]=a，i=3、j=1。',
    s: S({ i: 3, j: 1, matched: 1, next: KNEXT, cmp: 4, note: 'a == a' }) },
  { text: 'T[3]=b 对 P[1]=b，i=4、j=2。',
    s: S({ i: 4, j: 2, matched: 2, next: KNEXT, cmp: 5, note: 'b == b' }) },
  { text: 'T[4]=c 对 P[2]=c，i=5、j=3。',
    s: S({ i: 5, j: 3, matched: 3, next: KNEXT, cmp: 6, note: 'c == c' }) },
  { text: 'T[5]=a 对 P[3]=a，i=6、j=4。',
    s: S({ i: 6, j: 4, matched: 4, next: KNEXT, cmp: 7, note: 'a == a' }) },
  { text: 'T[6]=b 对 P[4]=c，又失配。j 跳到 next[4] = 1（不是 0！因为 "abca" 的前缀 a 和后缀 a 已经相等，那一位不用再比了）。i 依然不动。',
    s: S({ i: 6, j: 1, matched: 1, next: KNEXT, cmp: 8, note: '失配 → j = next[4] = 1', flash: 'jump' }) },
  { text: 'T[6]=b 对 P[1]=b，i=7、j=2；接着 T[7]=c 对 P[2]=c，i=8、j=3；T[8]=a 对 P[3]=a，i=9、j=4。',
    s: S({ i: 9, j: 4, matched: 4, next: KNEXT, cmp: 11, note: '一路对到 j=4' }) },
  { text: 'T[9]=c 对 P[4]=c，匹配成功！返回 i - j = 5，和 BF 结果一样。但 KMP 的 i 从 0 走到 10，<b>一步都没退</b>。',
    s: S({ i: 10, j: 5, matched: 5, next: KNEXT, cmp: 12, note: '匹配成功，返回 5 —— i 全程没回退', flash: 'win' }) },
  { text: '所以 KMP 是 O(n + m)：求 next 数组 O(m)，匹配 O(n)。代价是要先把 next 数组算出来——这就是代码里第 5 步要做的事。',
    s: S({ i: 5, j: 5, matched: 5, next: KNEXT, cmp: 12, note: 'KMP：O(n + m)' }) }
];

function renderMatchLab(host, steps, title, showNext) {
  D.lab(host, {
    title: title,
    height: showNext ? 330 : 280,
    steps: steps,
    setup(view) {
      const wrap = D.el('div');
      wrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:10px;width:100%';
      wrap.innerHTML =
        '<div class="row" style="gap:8px;flex-wrap:wrap;justify-content:center">' +
        '<span class="chip warm" data-k="note">—</span>' +
        '<span class="chip" data-k="cmp">比较 0 次</span>' +
        '</div>' +
        '<div style="font-family:var(--mono);font-size:12px;color:#6d80a3">主串 T</div>' +
        '<div class="row" data-k="text" style="gap:2px"></div>' +
        '<div style="font-family:var(--mono);font-size:12px;color:#6d80a3;margin-top:6px">模式串 P</div>' +
        '<div class="row" data-k="pat" style="gap:2px"></div>' +
        '<div class="row" data-k="nextrow" style="gap:2px;margin-top:6px"></div>' +
        '<div data-k="msg" style="font-family:var(--mono);font-size:12px;color:#ffb454;min-height:16px"></div>';
      view.appendChild(wrap);
      const ctx = {
        text: wrap.querySelector('[data-k="text"]'),
        pat: wrap.querySelector('[data-k="pat"]'),
        nextrow: wrap.querySelector('[data-k="nextrow"]'),
        note: wrap.querySelector('[data-k="note"]'),
        cmp: wrap.querySelector('[data-k="cmp"]'),
        msg: wrap.querySelector('[data-k="msg"]')
      };
      ctx.ptI = D.ptr(view, 'i', 'blue');
      ctx.ptJ = D.ptr(view, 'j', 'purple');
      return ctx;
    },
    draw(c, step) {
      const s = step.s;
      const tmap = {}, pmap = {};

      const tItems = [];
      for (let k = 0; k < TEXT.length; k++) {
        let cls = '';
        if (k < s.i) cls = 'dim';
        if (k === s.i && s.j < PAT.length) cls = 'hl';
        tItems.push({ k: k, ch: TEXT[k], cls: cls });
      }
      D.reconcile(c.text, tItems, it => it.k,
        () => D.el('div', 'cell'),
        (node, it) => {
          node.className = 'cell' + (it.cls ? ' ' + it.cls : '');
          node.style.cssText = 'min-width:30px;height:34px;font-size:12px;border-radius:7px';
          node.innerHTML = '<span>' + it.ch + '</span><span class="lbl" style="font-size:9px;bottom:-15px">' + it.k + '</span>';
          tmap['t' + it.k] = node;
        });

      const pItems = [];
      for (let k = 0; k < PAT.length; k++) {
        let cls = '';
        if (k < s.j) cls = 'dim';
        if (k === s.j) cls = 'hl2';
        pItems.push({ k: k, ch: PAT[k], cls: cls });
      }
      D.reconcile(c.pat, pItems, it => it.k,
        () => D.el('div', 'cell'),
        (node, it) => {
          node.className = 'cell' + (it.cls ? ' ' + it.cls : '');
          node.style.cssText = 'min-width:30px;height:30px;font-size:12px;border-radius:7px';
          node.innerHTML = '<span>' + it.ch + '</span>';
          pmap['p' + it.k] = node;
        });

      if (s.next) {
        c.nextrow.style.display = 'flex';
        const nItems = s.next.map(function (v, k) { return { k: k, v: v }; });
        D.reconcile(c.nextrow, nItems, it => it.k,
          () => D.el('div', 'chip'),
          (node, it) => {
            node.className = 'chip' + (it.k === s.j ? ' warm' : '');
            node.style.cssText = 'min-width:30px;justify-content:center;font-size:11px;padding:2px 0';
            node.textContent = 'next[' + it.k + ']=' + it.v;
          });
      } else {
        c.nextrow.style.display = 'none';
      }

      c.note.textContent = s.note;
      c.cmp.textContent = '比较 ' + (s.cmp || 0) + ' 次';
      c.msg.textContent = s.flash === 'retreat' ? '← i 回退了' : (s.flash === 'jump' ? '↑ j 跳到 next[j]，i 不动' : '');

      D.placePtr(c.ptI, tmap['t' + s.i], c.view, 0, 20);
      D.placePtr(c.ptJ, s.j < PAT.length ? pmap['p' + s.j] : null, c.view, 0, 8);
    }
  });
}

<script>
/* ==================== 05-linkedlist.js ==================== */
/* ============================ 2. 链表 ============================ */
(function () {
'use strict';
const D = window.DSV;

/* ---------- 动画数据 ---------- */
const V1 = { n1: 1, n2: 2, n3: 3, n9: 9 };
function L1(ids, o) { return Object.assign({ ids: ids.slice(), hl: [], head: ids[0] || null, note: '' }, o || {}); }

const steps1 = [
  { text: '链表的每个节点在内存里是散落的，靠 next 指针串在一起。head 指向第一个节点，最后一个节点的 next 是 null（画成 ∅），表示"到此为止"。',
    s: L1(['n1', 'n2', 'n3'], { note: 'head → [1]，链表长度 3' }) },
  { text: '想找第 3 个元素？没有办法"跳过去"——必须从 head 出发，跟 3 次 next。这就是链表随机访问 O(n) 的根源，也是它相比数组唯一的硬伤。',
    s: L1(['n1', 'n2', 'n3'], { hl: ['n1', 'n2', 'n3'], note: '访问 [3]：走了 3 步（先过 [1]、[2]）' }) },
  { text: '插入：在 [2] 后面插入 [9]。第 1 步——先把新节点 [9] 的 next 指向 [3]，让新节点先接管后面那一整条链。',
    s: L1(['n1', 'n2', 'n9', 'n3'], { hl: ['n9'], note: '新节点先接上后面：9.next = 3', link: 2 }) },
  { text: '第 2 步——再把 [2] 的 next 改成指向新节点。顺序绝对不能反！如果先改 [2].next = [9]，那 [3] 的地址就丢了，[3] 及其后面所有节点会变成"没人引用的垃圾"。',
    s: L1(['n1', 'n2', 'n9', 'n3'], { hl: ['n2'], note: '前驱改指向：2.next = 9', link: 1 }) },
  { text: '插入完成。全程只改了 2 根指针，没有任何元素被搬动——这就是"已知前驱时插入是 O(1)"的含义。（找前驱本身是 O(n)，那部分没省。）',
    s: L1(['n1', 'n2', 'n9', 'n3'], { hl: ['n9'], note: '插入只需 2 次指针赋值，对比数组要搬 2 个元素' }) },
  { text: '现在删除 [9]：被删节点的前驱是 [2]，让它直接指向 [3]，也就是"跨过" [9]。',
    s: L1(['n1', 'n2', 'n3'], { hl: ['n2'], note: '2.next = 3（跨过 9）' }) },
  { text: '[9] 从链上摘下来了，它会自己淡出。真实代码里你还会把它的 next 置 null，主动断开引用，避免大对象长期被"挂着"回收不掉。',
    s: L1(['n1', 'n2', 'n3'], { hl: [], note: '9.next = null → 交给垃圾回收' }) },
  { text: '总结：链表在"头部插删"和"已知节点插删"上是 O(1)，但换来的是 ① 无法随机访问 ② 每个节点多一个指针的内存开销 ③ 缓存不友好（遍历比数组慢几倍）。',
    s: L1(['n1', 'n2', 'n3'], { hl: ['n1'], note: '头插 O(1) 是链表最大的优势' }) }
];

const V2 = { a: 1, b: 2, c: 3, d: 4 };
function L2(next, o) {
  return Object.assign({ next: Object.assign({ a: 'b', b: 'c', c: 'd', d: null }, next), prev: null, cur: 'a', nxt: null, hl: [], note: '' }, o || {});
}
const steps2 = [
  { text: '初始：1 → 2 → 3 → 4 → ∅。我们要把它变成 4 → 3 → 2 → 1 → ∅。三个指针的初始状态：prev = null，cur = 1，next 还没有值。',
    s: L2({}, { note: 'prev = ∅, cur = 1' }) },
  { text: '第 1 步：把 cur 的下一站存起来 next = cur.next = 2。<b>这一步是必须的</b>——因为下一步就要把 cur.next 改掉，改完就再也找不到 2 了。',
    s: L2({}, { nxt: 'b', hl: ['a'], note: 'next = cur.next → 2（先备份！）' }) },
  { text: '第 2 步：翻转指针 cur.next = prev。节点 1 的 next 从 2 变成 ∅，它成了新的尾节点。注意此时 1 已经和后面的链断开了，但因为 next 备份了 2，我们仍然能继续往前走。',
    s: L2({ a: null }, { nxt: 'b', hl: ['a'], note: 'cur.next = prev → 1 指向 ∅' }) },
  { text: '第 3、4 步：两个指针一起前进。prev = cur（prev 变成 1），cur = next（cur 变成 2）。三个指针整体向右挪一格。',
    s: L2({ a: null }, { prev: 'a', cur: 'b', nxt: null, note: 'prev = 1, cur = 2' }) },
  { text: '对节点 2 重复同样的四步：先备份 next = 3，再让 2.next 指向 prev（也就是 1）。现在已经有 2 → 1 → ∅ 了。',
    s: L2({ a: null, b: 'a' }, { prev: 'a', cur: 'b', nxt: 'c', hl: ['b'], note: 'next = 3，2.next = 1' }) },
  { text: '指针整体后移：prev = 2，cur = 3。',
    s: L2({ a: null, b: 'a' }, { prev: 'b', cur: 'c', note: 'prev = 2, cur = 3' }) },
  { text: '对节点 3 重复：备份 next = 4，翻转 3.next = 2。现在 3 → 2 → 1 → ∅。',
    s: L2({ a: null, b: 'a', c: 'b' }, { prev: 'b', cur: 'c', nxt: 'd', hl: ['c'], note: '3.next = 2' }) },
  { text: '指针后移：prev = 3，cur = 4。',
    s: L2({ a: null, b: 'a', c: 'b' }, { prev: 'c', cur: 'd', note: 'prev = 3, cur = 4' }) },
  { text: '最后一个节点：备份 next = ∅（它本来就是尾），翻转 4.next = 3。整条链的方向完全倒过来了。',
    s: L2({ a: null, b: 'a', c: 'b', d: 'c' }, { prev: 'c', cur: 'd', hl: ['d'], note: '4.next = 3' }) },
  { text: '指针后移：prev = 4，cur = next = ∅。循环条件 cur !== null 不成立，退出。',
    s: L2({ a: null, b: 'a', c: 'b', d: 'c' }, { prev: 'd', cur: null, note: 'cur 变成 ∅，循环结束' }) },
  { text: '返回 prev：它就是新链表的头。整段代码只用了 3 个指针变量、遍历一遍，所以是 O(n) 时间 + O(1) 空间。',
    s: L2({ a: null, b: 'a', c: 'b', d: 'c' }, { prev: 'd', cur: null, hl: ['d'], note: 'head = prev → 4' }) }
];

/* ---------- 渲染辅助 ---------- */
function renderListRow(row, ids, hls, linkAfter) {
  const items = [];
  ids.forEach((id, i) => {
    if (i > 0) items.push({ type: 'link', key: 'L' + ids[i - 1], on: linkAfter === i });
    items.push({ type: 'node', id: id, key: id, hl: hls.indexOf(id) >= 0 });
  });
  items.push({ type: 'link', key: 'L' + ids[ids.length - 1], on: false });
  items.push({ type: 'null', key: 'NULL' });
  const map = {};
  D.reconcile(row, items, it => it.key,
    it => {
      if (it.type === 'link') return D.el('span', 'arrow', '→');
      const n = D.el('div', 'node');
      if (it.type === 'null') n.innerHTML = '<span class="v" style="color:#6d80a3">∅</span>';
      return n;
    },
    (node, it) => {
      if (it.type === 'link') { node.className = 'arrow' + (it.on ? ' on' : ''); node.textContent = '→'; return; }
      if (it.type === 'null') return;
      node.className = 'node' + (it.hl ? ' hl' : '');
      node.innerHTML = '<span class="v">' + V1[it.id] + '</span><span class="n">next</span>';
      map[it.id] = node;
    });
  return map;
}

<script>
/* ==================== 06-stack.js ==================== */
/* ============================ 3. 栈 ============================ */
(function () {
'use strict';
const D = window.DSV;

/* ---------- 动画 1：push / pop ---------- */
function S1(items, o) { return Object.assign({ items: items.slice(), act: '', msg: '' }, o || {}); }
const steps1 = [
  { text: '空栈。栈底和栈顶是同一个位置，size = 0。栈是一条"只能从一端进出"的通道，这一端叫栈顶。',
    s: S1([], { act: 'new Stack()', msg: 'size = 0，isEmpty() = true' }) },
  { text: 'push(1)：1 被放到栈顶。它是目前唯一能"立刻拿出来"的元素。',
    s: S1([1], { act: 'push(1)', msg: 'size = 1，top = 1' }) },
  { text: 'push(2)：新元素永远压在<b>上面</b>。注意 1 被压在底下了——它上面的元素不搬走，就永远出不来。这就是 LIFO（后进先出）。',
    s: S1([1, 2], { act: 'push(2)', msg: 'size = 2，top = 2' }) },
  { text: 'push(3)：再压一个。现在栈里从上到下是 3、2、1。',
    s: S1([1, 2, 3], { act: 'push(3)', msg: 'size = 3，top = 3' }) },
  { text: 'pop()：弹出<b>栈顶</b>的 3。栈是"谁最后进来谁先出去"。',
    s: S1([1, 2], { act: 'pop() → 3', msg: 'size = 2，top 变成 2' }) },
  { text: 'peek()：只"看"栈顶，不弹出。需要根据栈顶做判断（比如括号匹配）时用它。',
    s: S1([1, 2], { act: 'peek() → 2', msg: 'size 不变，仍是 2' }) },
  { text: 'pop() 两次：2 和 1 依次出栈，栈又空了。',
    s: S1([], { act: 'pop(), pop()', msg: 'size = 0' }) },
  { text: '空栈再 pop() 会怎样？必须返回 undefined / None / 抛异常——绝不能"读到一片野内存"。这是实现栈时最容易漏的边界检查。',
    s: S1([], { act: 'pop() → undefined', msg: '只有 3 个地方要改：push / pop / peek，别的都不变' }) }
];

/* ---------- 动画 2：括号匹配 ---------- */
function S2(str, i, stack, o) { return Object.assign({ str: str, i: i, stack: stack.slice(), msg: '', bad: false, done: [] }, o || {}); }
const steps2 = [
  { text: '输入 "{ [ ( ) ] }"。用一个栈来记住"有哪些左括号还没被配对"。指针从左往右扫，一次只看一个字符。',
    s: S2('{[()]}', -1, [], { msg: '栈为空，准备开始' }) },
  { text: '读到 "{"，是左括号 → 入栈，期待后面出现 "}"。',
    s: S2('{[()]}', 0, ['{'], { msg: 'push("{"）' }) },
  { text: '读到 "["，入栈。现在栈里是 { [，说明"最近的未配对左括号"是 "[".',
    s: S2('{[()]}', 1, ['{', '['], { msg: 'push("[")' }) },
  { text: '读到 "("，入栈。栈里 { [ (。',
    s: S2('{[()]}', 2, ['{', '[', '('], { msg: 'push("(")' }) },
  { text: '读到 ")"，是右括号 → 检查<b>栈顶</b>是不是它的搭档 "("。是 → 弹出栈顶，配对成功。为什么只看栈顶？因为括号必须"最近的最先闭合"，这正是 LIFO。',
    s: S2('{[()]}', 3, ['{', '['], { msg: '栈顶 "(" == 期望 "(" → pop()，匹配成功', done: [3, 4] }) },
  { text: '读到 "]" → 栈顶是 "["，配对，弹出。',
    s: S2('{[()]}', 4, ['{'], { msg: '栈顶 "[" 匹配 → pop()', done: [4, 5] }) },
  { text: '读到 "}" → 栈顶是 "{"，配对，弹出。栈空了。',
    s: S2('{[()]}', 5, [], { msg: '栈顶 "{" 匹配 → pop()', done: [5, 6] }) },
  { text: '扫描结束，栈正好为空 → 说明所有左括号都被配对了。判定：<b>合法</b>。两个条件缺一不可：中途不能配错，结尾必须栈空。',
    s: S2('{[()]}', 6, [], { msg: '√ 合法', done: [6] }) },
  { text: '换个失败例子："( [ ) ]"。前面 "( [" 依次入栈。',
    s: S2('([)]', 1, ['(', '['], { msg: 'push("("), push("[")' }) },
  { text: '读到 ")"：栈顶是 "["，而 ")" 的搭档是 "("，不匹配 → 直接返回 false。',
    s: S2('([)]', 2, ['(', '['], { msg: '栈顶 "[" != "(" → 判定非法', bad: true }) },
  { text: '如果忘了"结尾检查栈空"，"((" 这种只有左括号的串会被误判为合法。所以最后一定要 <b>return st.length === 0</b>。',
    s: S2('([)]', 3, ['(', '['], { msg: '× 非法', bad: true }) }
];

D.register({
  id: 'stack', title: '栈', icon: '🥞', group: '二、受限线性结构', order: 30,

  badge: 'LIFO',
  keywords: 'stack 栈 后进先出 LIFO 括号匹配 单调栈 最小栈',
  lead: '栈不是一种新容器，而是给数组/链表加了一条规则：只允许在一端插入和删除。规则越少，语义越强。',
  build(doc) {
    const c1 = D.card({ title: '一句话讲清', icon: '💡', badge: 'Stack' });
    D.html(c1.querySelector('.body'),
      '<p>栈就是<b>一摞盘子</b>：你只能把新盘子放在最上面，也只能从最上面拿走。' +
      '所以"最后放上去的"必然是"最先被拿走的"——这就是 <b>LIFO（Last In First Out，后进先出）</b>。</p>' +
      '<p>实现上它没有新东西：<b>用数组从尾部操作</b>就是栈（push/pop 都是 O(1)），' +
      '<b>用链表从头插</b>也是栈。栈的全部 API 只有 5 个：' +
      '<code class="inl">push / pop / peek / isEmpty / size</code>。</p>' +
      D.mini([['O(1)', 'push 入栈'], ['O(1)', 'pop 出栈'], ['O(1)', 'peek 看栈顶'], ['O(n)', '查找某个元素']]) +
      D.note('note', '为什么数组尾就是"栈顶"',
        '因为数组尾部 push/pop 是 O(1)，而头部是 O(n)。所以用数组实现栈时，' +
        '<b>数组末尾 = 栈顶</b>，下标 0 = 栈底。这个映射关系记住，代码就不会写反。'));

    const c2 = D.card({ title: '动画 ①：push / pop / peek', icon: '🎬', badge: '基础' });
    const b2 = c2.querySelector('.body');
    D.html(b2, '<p>注意观察：被压在下面的元素，在它上面的元素出栈之前，是绝对拿不到的。</p>');
    D.lab(b2, {
      title: '栈 · 基本操作',
      height: 300,
      steps: steps1,
      setup(view) {
        const wrap = D.el('div');
        wrap.style.cssText = 'display:flex;gap:44px;align-items:flex-end;justify-content:center;width:100%';
        wrap.innerHTML =
          '<div style="display:flex;flex-direction:column;align-items:center;gap:10px">' +
          '<div data-k="act" style="font-family:var(--mono);font-size:13px;color:#ffb454"></div>' +
          '<div class="col" data-k="col" style="justify-content:flex-end;min-height:200px;border-bottom:3px solid #2e3f63;padding:0 14px 8px"></div>' +
          '</div>' +
          '<div style="display:flex;flex-direction:column;gap:8px;font-family:var(--mono);font-size:12.5px;color:#93a6c8;padding-bottom:56px">' +
          '<span class="chip" data-k="size">size = 0</span><span data-k="msg" style="color:#6d80a3;max-width:220px;line-height:1.6"></span></div>';
        view.appendChild(wrap);
        return { col: wrap.querySelector('[data-k="col"]'), act: wrap.querySelector('[data-k="act"]'), size: wrap.querySelector('[data-k="size"]'), msg: wrap.querySelector('[data-k="msg"]') };
      },
      draw(c, step) {
        const s = step.s;
        const items = s.items.map((v, i) => ({ key: i + '-' + v, v: v, top: i === s.items.length - 1 }));
        D.reconcile(c.col, items, it => it.key,
          () => D.el('div', 'cell'),
          (node, it) => {
            node.className = 'cell' + (it.top ? ' hl' : '');
            node.style.minWidth = '110px';
            node.innerHTML = '<span>' + it.v + '</span>' + (it.top ? '<span class="lbl">栈顶 ← 只能从这里进出</span>' : '');
          });
        c.act.textContent = s.act;
        c.size.textContent = 'size = ' + s.items.length;
        c.msg.textContent = s.msg;
      }
    });
    doc.appendChild(c2);

    const c3 = D.card({ title: '动画 ②：经典应用——括号匹配', icon: '🧩', badge: '必会' });
    const b3 = c3.querySelector('.body');
    D.html(b3, '<p>这是"栈"最经典的应用：<b>凡是需要"记住最近的、尚未处理完的东西"，就用栈</b>。' +
      '括号、函数调用、表达式求值、撤销操作，全是同一个套路。</p>');
    D.lab(b3, {
      title: '括号匹配 · 扫描 + 栈',
      height: 320,
      steps: steps2,
      setup(view) {
        const wrap = D.el('div');
        wrap.style.cssText = 'display:flex;gap:50px;align-items:flex-start;justify-content:center;width:100%;flex-wrap:wrap';
        wrap.innerHTML =
          '<div style="display:flex;flex-direction:column;align-items:center;gap:12px">' +
          '<div style="font-size:12px;color:#6d80a3">待扫描字符串</div>' +
          '<div class="row" data-k="chars" style="gap:8px"></div>' +
          '<div data-k="msg" style="font-family:var(--mono);font-size:12.5px;color:#93a6c8;text-align:center;min-height:20px"></div>' +
          '</div>' +
          '<div style="display:flex;flex-direction:column;align-items:center;gap:12px">' +
          '<div style="font-size:12px;color:#6d80a3">栈（栈底在下）</div>' +
          '<div class="col" data-k="col" style="justify-content:flex-end;min-height:180px;border-bottom:3px solid #2e3f63;padding:0 10px 6px"></div>' +
          '</div>';
        view.appendChild(wrap);
        const ctx = { chars: wrap.querySelector('[data-k="chars"]'), col: wrap.querySelector('[data-k="col"]'), msg: wrap.querySelector('[data-k="msg"]') };
        ctx.cur = D.ptr(view, 'i', 'blue');
        return ctx;
      },
      draw(c, step) {
        const s = step.s;
        const chars = [];
        for (let i = 0; i < s.str.length; i++) {
          let cls = '';
          if (s.done.indexOf(i) >= 0) cls = 'ok';
          if (i === s.i) cls = s.bad ? 'bad' : 'hl';
          chars.push({ key: i, ch: s.str[i], cls: cls });
        }
        const map = {};
        D.reconcile(c.chars, chars, it => it.key,
          () => D.el('div', 'cell'),
          (node, it) => {
            node.className = 'cell' + (it.cls ? ' ' + it.cls : '');
            node.style.minWidth = '44px';
            node.innerHTML = '<span style="font-size:17px">' + D.esc(it.ch) + '</span>';
            map[it.key] = node;
          });
        const sitems = s.stack.map((ch, i) => ({ key: i + '-' + ch, ch: ch, top: i === s.stack.length - 1 }));
        D.reconcile(c.col, sitems, it => it.key,
          () => D.el('div', 'cell'),
          (node, it) => {
            node.className = 'cell' + (it.top ? ' hl2' : '');
            node.style.minWidth = '52px';
            node.innerHTML = '<span style="font-size:17px">' + D.esc(it.ch) + '</span>';
          });
        c.msg.textContent = s.msg;
        D.placePtr(c.cur, map[s.i], c.view, 0, 6);
      }
    });
    doc.appendChild(c3);

    const c4 = D.card({ title: '栈能解决哪类问题', icon: '🎯', badge: '模型识别' });
    D.html(c4.querySelector('.body'),
      D.table(['场景', '为什么用栈', '典型题目'], [
        ['括号 / 标签配对', '左括号等着右括号，最近的最先被配对', '有效括号、HTML 标签闭合、表达式合法性'],
        ['函数调用 / 递归', '每一层调用要记住"回到哪里"，最深的一层最先返回', '递归本质就是系统帮你开了个栈；递归太深会栈溢出'],
        ['表达式求值', '运算符优先级：遇到低优先级运算符时，先结算栈里高优先级的', '逆波兰表达式、中缀转后缀'],
        ['撤销 / 撤销的撤销', '最近的操作最先被撤销', '编辑器 Ctrl+Z、浏览器后退'],
        ['单调栈', '维护一个"单调递减/递增"的栈，用来找左边/右边第一个更大/更小的元素', '下一个更大元素、接雨水、柱状图最大矩形'],
        ['深度优先搜索 DFS', '走不通要退回上一个岔路口', '图/树的非递归 DFS、迷宫求解'],
      ]) +
      D.note('tip', '识别信号', '看到"<b>最近的</b>"、"<b>嵌套</b>"、"<b>配对</b>"、"<b>撤销</b>"、"<b>回退到上一步</b>"这些字眼，' +
        '第一反应就应该是"这里要一个栈"。'));
    doc.appendChild(c4);

    const c5 = D.card({ title: '分步实现 · C / C++ / Rust', icon: '⌨️', badge: '手写重点' });
    D.html(c5.querySelector('.body'),
      '<p>三种语言、同一套步骤。<b>点右上角切换语言，整页跟着一起换。</b>把每一步按顺序拼起来，就是一份能直接编译运行的完整程序。</p>' +
      '<p>这些代码刻意写得<b>朴素</b>：不用 template、不用智能指针、不用 STL 容器，就是最普通的 ' +
      '<code class="inl">class</code> / <code class="inl">struct</code> + 指针 + 循环，' +
      '和你在 Dev-C++ 里手写出来的样子一样 —— 每一行都能看懂，也都能自己敲出来。</p>' +
      '<p><b>关于文件组织：</b>平时是把类声明放 <code class="inl">.h</code>、实现放 <code class="inl">.cpp</code>；' +
      '这里为了能直接复制下来编译运行，把两部分放在同一个文件里了，工程里再拆开即可。</p>' +
      D.codeSteps('stack') +
      D.sources('stack') +
      D.note('warn', '三个必考的边界', '① <b>空栈 pop</b>：返回 undefined/None 还是抛异常？必须先判断。' +
        '② <b>空栈 peek</b>：同上。③ <b>MinStack 的两个栈必须同步进出</b>，pop 时忘记 pop 辅助栈，多测几次就会出错。'));
    doc.appendChild(c5);

    const c6 = D.card({ title: '动手练', icon: '✎', badge: '白纸手写' });
    D.html(c6.querySelector('.body'),
      D.ex('合上页面，默写 <code class="inl">is_balanced(const char *s)</code>。写完对照上面<b>第 6 步</b>，用这 5 个用例验：' +
        '<code class="inl">""</code>（空串）、<code class="inl">"("</code>（只有左）、<code class="inl">")"</code>（只有右）、' +
        '<code class="inl">"()"</code>、<code class="inl">"([)]"</code>。' +
        '重点检查两条分支：<b>栈空时出栈</b>、<b>扫描完栈非空</b>。') +
      D.ex('用两个栈实现一个队列（push / pop）。提示：一个"进栈"、一个"出栈"；只有当出栈为空时，才把进栈里的元素<b>整体倒过去</b>。想一想为什么这是均摊 O(1)。',
        D.answerFor('stack', 1)) +
      D.ex('实现 <code class="inl">MinStack</code>，要求 push / pop / top / min 全部 O(1)。提示：空间换时间，用第二个栈记录"到当前为止的最小值"，并保证两个栈同步进出。',
        D.answerFor('stack', 2)));
    doc.appendChild(c6);
  }
});
})();

</script>

<script>
/* ==================== 07-queue.js ==================== */
/* ============================ 4. 队列 ============================ */
(function () {
'use strict';
const D = window.DSV;

/* ---------- 动画数据 ---------- */
const CAP = 5;
function Q(data, head, tail, o) {
  return Object.assign({ data: data.slice(), head: head, tail: tail, cap: CAP, hl: [], ok: [], bad: [], dim: [], op: '', msg: '' }, o || {});
}
const steps = [
  { text: '循环队列就是"把数组首尾接起来"。capacity = 4，但内部开了 5 格：多出来的那一格专门用来区分"空"和"满"。初始 head = tail = 0，队列为空。',
    s: Q([null, null, null, null, null], 0, 0, { op: 'new CircularQueue(4)', msg: 'isEmpty: head === tail' }) },
  { text: 'enqueue(10)：写到 tail 指向的格子，然后 tail 前移一格。取模运算 (tail + 1) % 5 保证了走到末尾会自动回到 0。',
    s: Q([10, null, null, null, null], 0, 1, { op: 'enqueue(10)', hl: [0], msg: 'size = 1' }) },
  { text: 'enqueue(20)、enqueue(30)：tail 一路前移。此时 head = 0，tail = 3，size = 3。注意队头永远在 head，队尾在 tail 的前一格。',
    s: Q([10, 20, 30, null, null], 0, 3, { op: 'enqueue(20), enqueue(30)', hl: [2], msg: 'size = 3' }) },
  { text: 'dequeue()：取出 head 指向的 10，head 前移到 1。**注意：后面的元素一个都没搬！**' +
      '如果用普通数组实现，出队后要不就把所有元素往前挪（O(n)），要不就浪费前面的空间（假溢出）。循环队列用"移动指针"代替"搬数据"。',
    s: Q([null, 20, 30, null, null], 1, 3, { op: 'dequeue() → 10', hl: [1], msg: 'size = 2，下标 0 已经空了' }) },
  { text: 'enqueue(40)：写到下标 3，tail 变成 4。',
    s: Q([null, 20, 30, 40, null], 1, 4, { op: 'enqueue(40)', hl: [3], msg: 'size = 3' }) },
  { text: '重点来了！enqueue(50)：先写进 tail 指向的下标 4，然后 tail = (4 + 1) % 5 = 0 —— 指针<b>绕回了开头</b>。物理上它还是一个普通数组，只是我们约定"下标 4 的后面跟着下标 0"，这就是"循环队列"名字的由来。',
    s: Q([null, 20, 30, 40, 50], 1, 0, { op: 'enqueue(50)   tail: 4 → 0 (取模)', hl: [4], msg: 'size = 4，tail 绕回了下标 0' }) },
  { text: '现在 head = 1、tail = 0、size = 4，逻辑顺序是 20 → 30 → 40 → 50（从 head 出发绕一圈读）。还能再入队吗？判满公式 (tail + 1) % cap === head：' +
      '(0 + 1) % 5 = 1，正好等于 head → <b>队满</b>。注意下标 1 物理上是空的，但它是"用来分辨空和满"的哨兵格，永远不存数据。',
    s: Q([null, 20, 30, 40, 50], 1, 0, { op: 'isFull() → true', hl: [1], msg: 'size = 4 = capacity，队满' }) },
  { text: '所以再 enqueue(60) 会抛"队列已满"。这"牺牲一格"就是双指针法的代价。如果你不想浪费，可以额外维护一个 size 计数器：用 size === capacity 判满、size === 0 判空。',
    s: Q([null, 20, 30, 40, 50], 1, 0, { op: 'enqueue(60) → 抛异常', bad: [1], msg: '容量已满，拒绝入队' }) },
  { text: 'dequeue()：取出 head 指向的 20，head 前移到 2，同时把下标 1 清空。这时候队里腾出了一格，而且这一格马上就能被 tail 重新利用。',
    s: Q([null, null, 30, 40, 50], 2, 0, { op: 'dequeue() → 20', hl: [1], msg: 'size = 3，下标 1 空出来了' }) },
  { text: 'enqueue(60)：先判满——(tail + 1) % 5 = (0 + 1) % 5 = 1，而 head = 2，1 ≠ 2，所以没满。写进 data[0]（这一格已经没人用了），再把 tail 变成 1。size 回到 4。',
    s: Q([60, null, 30, 40, 50], 2, 1, { op: 'enqueue(60)   data[0] = 60, tail: 0 → 1', ok: [0], hl: [0], msg: 'size = 4' }) },
  { text: '最终逻辑顺序：从 head = 2 出发走 4 步 —— 30、40、50、60。它们躺在数组里的物理位置是 2、3、4、0，是"断开"的，但按环形顺序读就是连续的。' +
      '所以遍历循环队列必须从 head 出发走 size 步（每步取模），绝不能直接 for i = 0..cap。',
    s: Q([60, null, 30, 40, 50], 2, 1, { op: 'toArray() → [30, 40, 50, 60]', hl: [0, 2, 3, 4], ok: [0], msg: '物理断开、逻辑连续' }) }
];

D.register({
  id: 'queue', title: '队列', icon: '🚶', group: '二、受限线性结构', order: 40,
  blurb: '只能队尾进、队头出，FIFO；循环数组实现是重点',
  badge: 'FIFO',
  keywords: 'queue 队列 先进先出 FIFO 循环队列 双端队列 deque 假溢出',
  lead: '队列是"排队"：新人从队尾加入，老人从队头离开。实现难点只有一个——怎么在数组里优雅地"绕圈"。',
  build(doc) {
    const c1 = D.card({ title: '一句话讲清', icon: '💡', badge: 'Queue' });
    D.html(c1.querySelector('.body'),
      '<p>队列只有两条规则：<b>只能在队尾插入（enqueue），只能在队头删除（dequeue）</b>。' +
      '先来的先走，叫 <b>FIFO（First In First Out，先进先出）</b>——和栈正好相反。</p>' +
      '<p>用链表实现最自然（头删尾插都是 O(1)），但面试更爱考 <b>循环队列</b>：' +
      '用一个定长数组 + 两个指针 <code class="inl">head</code> / <code class="inl">tail</code>，' +
      '指针走到末尾就用 <code class="inl">% capacity</code> 绕回开头。</p>' +
      D.mini([['O(1)', 'enqueue 入队'], ['O(1)', 'dequeue 出队'], ['O(1)', 'peek 看队头'], ['O(k)', '定长数组的空间']]) +
      D.note('warn', '数组实现队列的"假溢出"',
        '如果用普通数组：出队后 head 前移，前面的空间就再也用不到了；' +
        '等你一路 enqueue 到数组末尾，明明前面还有空位，却报"满了"——这叫<b>假溢出</b>。' +
        '两个解法：① 出队时把后面所有元素前移（O(n)，太慢）；② <b>循环队列</b>（O(1)，正解）。'));

    const c2 = D.card({ title: '动画：循环队列怎么"绕圈"', icon: '🎬', badge: '面试重点' });
    const b2 = c2.querySelector('.body');
    D.html(b2, '<p>盯着 <b>head</b> 和 <b>tail</b> 两个指针：它们只前进、不后退，走到下标 4 就"瞬移"回下标 0。' +
      '数据本身一动不动。</p>');
    D.lab(b2, {
      title: '循环队列 · head / tail 绕圈',
      height: 300,
      steps: steps,
      setup(view) {
        const inner = D.el('div');
        inner.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:18px;width:100%';
        inner.innerHTML =
          '<div class="row" style="gap:10px;flex-wrap:wrap;justify-content:center">' +
          '<span class="chip warm" data-k="op">—</span>' +
          '<span class="chip" data-k="info">size = 0</span>' +
          '</div>' +
          '<div style="position:relative;border:1.5px dashed #2e3f63;border-radius:14px;padding:14px 18px 52px">' +
          '<div style="position:absolute;left:16px;top:-11px;background:#0a1120;padding:0 8px;font-family:var(--mono);font-size:11px;color:#6d80a3">' +
          'capacity = 4（物理 5 格，牺牲 1 格用来判满）</div>' +
          '<div class="row" data-k="cells" style="gap:10px"></div>' +
          '</div>' +
          '<div data-k="msg" style="font-family:var(--mono);font-size:12.5px;color:#93a6c8;text-align:center"></div>';
        view.appendChild(inner);
        const ctx = {
          cells: inner.querySelector('[data-k="cells"]'), op: inner.querySelector('[data-k="op"]'),
          info: inner.querySelector('[data-k="info"]'), msg: inner.querySelector('[data-k="msg"]'), map: {}
        };
        ctx.pHead = D.ptr(view, 'head 出队', 'blue');
        ctx.pTail = D.ptr(view, 'tail 入队', 'green');
        return ctx;
      },
      draw(c, step) {
        const s = step.s;
        const size = (s.tail - s.head + s.cap) % s.cap;
        const items = [];
        for (let i = 0; i < s.cap; i++) {
          let cls = s.data[i] === null ? 'empty' : '';
          if (s.hl.indexOf(i) >= 0) cls += ' hl';
          if (s.ok.indexOf(i) >= 0) cls += ' ok';
          if (s.bad.indexOf(i) >= 0) cls += ' bad';
          items.push({ key: i, i: i, v: s.data[i], cls: cls });
        }
        c.map = {};
        D.reconcile(c.cells, items, it => it.key,
          () => D.el('div', 'cell'),
          (node, it) => {
            node.className = 'cell' + (it.cls ? ' ' + it.cls : '');
            node.style.minWidth = '56px';
            node.innerHTML = '<span>' + (it.v === null ? '' : it.v) + '</span><span class="lbl">下标 ' + it.i + '</span>';
            c.map['k' + it.i] = node;
          });
        c.op.textContent = s.op;
        c.info.textContent = 'size = ' + size + ' / 4        head = ' + s.head + '   tail = ' + s.tail;
        c.msg.textContent = s.msg;
        D.placePtr(c.pHead, c.map['k' + s.head], c.view, -34, 34);
        D.placePtr(c.pTail, c.map['k' + s.tail], c.view, 34, 34);
      }
    });
    doc.appendChild(c2);

      '<code class="inl">class</code> / <code class="inl">struct</code> + 指针 + 循环，' +

      '<p><b>关于文件组织：</b>平时是把类声明放 <code class="inl">.h</code>、实现放 <code class="inl">.cpp</code>；' +
      '这里为了能直接复制下来编译运行，把两部分放在同一个文件里了，工程里再拆开即可。</p>' +

<script>

const addrSteps = [
  { text: '一个 3 行 4 列的二维数组，在内存里其实是<b>一条连续的一维线</b>。我们约定按"一行接一行"存放，这叫<b>行主序</b>（C / C++ / Pascal 都这样）。',

/* ---------- Lab 2：对称矩阵压缩存储 ---------- */

const symSteps = [
  { text: '对称矩阵满足 a[i][j] = a[j][i]，沿着对角线两边完全镜像。4 阶矩阵本来要存 16 个元素，但因为有一半是重复的，只需要存<b>下三角（含对角线）</b>：4+3+2+1 = <b>10</b> 个。',
    s: Y({ txt: 'n 阶对称矩阵 → n(n+1)/2 个存储单元' }) },
  { text: '把下三角按行"压扁"到一维数组里：第 0 行 1 个、第 1 行 2 个、第 2 行 3 个……所以下标 k 是"前面所有行的个数"加上"本行的列号"。',
    s: Y({ txt: 'k = i(i+1)/2 + j   （要求 i >= j）' }) },
  { text: '求 a[1][0]：它在第 1 行，前面第 0 行有 1 个元素，所以 k = 0+1 = <b>1</b>。用公式 i(i+1)/2 + j = 1*2/2 + 0 = 1，对上了。',

  { text: '求 a[2][1]：前面两行一共 1+2 = 3 个，本行列号 1 → k = 3+1 = 4。公式 2*3/2 + 1 = 4，一致。',

];

  { text: '继续：(0,3)=2 → 列 3 → pos[3]=2 → 放 (3,0,2) 到下标 2，pos[3] 变 3。',

  { text: '(2,0)=7 → 列 0 → pos[0]=0 → 放 (0,2,7) 到下标 0。注意它是最后才读到的，却放到了最前面 —— 因为 pos 早就给它留好位置了。',
    s: P({ phase: '第 3 步：一趟扫描直接放到位', num: [1, 1, 0, 1, 1], pos: [1, 2, 2, 3, 3], done: [[0, 1, 5], [0, 3, 2], [2, 0, 7]], place: 2, txt: '(2,0)=7 → 放到下标 0' }) },

          if (i >= j) k = i * (i + 1) / 2 + j;
          const isHi = (i === s.hi && j === s.hj) || (i === s.hj && j === s.hi && s.hj >= 0);
          items.push({ r: i, cc: j, v: SYM[i][j], k: k, upper: i < j, hi: isHi, lower: i >= j });
        }
        D.reconcile(c.grid, items, it => it.r * 10 + it.cc,
          () => D.el('div'),
          (node, it) => {
            let cls = 'cell';
            if (it.upper) cls += ' empty';
            if (it.hi) cls += ' hl';
            node.className = cls;
            node.style.cssText = 'height:44px;font-size:13px;min-width:0';
            node.innerHTML = '<span>' + it.v + '</span>' +
              (it.lower ? '<span class="lbl" style="bottom:-14px;font-size:9px">k=' + it.k + '</span>' : '');
          });
        const fl = SYM_FLAT.map(function (v, k) { return { k: k, v: v, on: k === s.k }; });
        D.reconcile(c.flat, fl, it => it.k,
          () => D.el('div'),
          (node, it) => {
            node.className = 'cell' + (it.on ? ' hl' : '');
            node.style.cssText = 'min-width:34px;height:34px;font-size:12px;border-radius:7px';
            node.innerHTML = '<span>' + it.v + '</span><span class="lbl" style="bottom:-13px;font-size:9px">' + it.k + '</span>';
          });
        c.txt.textContent = s.txt;
        c.formula.textContent = s.formula;
      }
    });
    doc.appendChild(c3);

    const c4 = D.card({ title: '动画 ③：稀疏矩阵的快速转置', icon: '⚡', badge: 'O(cols+count)' });
    const b4 = c4.querySelector('.body');
    D.html(b4, '<p>左边是原矩阵的三元组表，右边是转置结果。<b>重点看中间的 num[] 和 pos[]</b>——它们就是"每个元素该放到第几格"的座位表。</p>');
    D.lab(b4, {
      title: '快速转置 · 先算座位，再一次放好',
      height: 330,
      steps: fastSteps,
      setup(view) {
        const wrap = D.el('div');
        wrap.style.cssText = 'display:flex;gap:26px;align-items:flex-start;justify-content:center;width:100%;flex-wrap:wrap';
        wrap.innerHTML =
          '<div style="display:flex;flex-direction:column;gap:8px;align-items:center">' +
          '<div style="font-size:11.5px;color:#6d80a3">原三元组表（按行优先）</div>' +
          '<div data-k="src" style="display:flex;flex-direction:column;gap:4px"></div></div>' +
          '<div style="display:flex;flex-direction:column;gap:8px;align-items:center;min-width:230px">' +
          '<div data-k="phase" style="font-family:var(--mono);font-size:11.5px;color:#38d9d0"></div>' +
          '<div data-k="tables" style="font-family:var(--mono);font-size:11px;color:#93a6c8;text-align:center;line-height:1.8"></div>' +
          '</div>' +
          '<div style="display:flex;flex-direction:column;gap:8px;align-items:center">' +
          '<div style="font-size:11.5px;color:#6d80a3">转置结果</div>' +
          '<div data-k="dst" style="display:flex;flex-direction:column;gap:4px"></div></div>';
        view.appendChild(wrap);
        return { src: wrap.querySelector('[data-k="src"]'), dst: wrap.querySelector('[data-k="dst"]'),
          phase: wrap.querySelector('[data-k="phase"]'), tables: wrap.querySelector('[data-k="tables"]'),
          txt: wrap.querySelector('[data-k="txt"]') };
      },
      draw(c, step) {
        const s = step.s;
        const srcItems = TRIPLES.map(function (tr, i) { return { i: i, tr: tr, on: i === s.place }; });
        D.reconcile(c.src, srcItems, it => it.i,
          () => D.el('div', 'chip'),
          (node, it) => {
            node.className = 'chip' + (it.on ? ' warm' : '');
            node.style.cssText = 'justify-content:center;min-width:150px;font-size:11.5px';
            node.textContent = '(' + it.tr[0] + ', ' + it.tr[1] + ', ' + it.tr[2] + ')';
          });
        const dstItems = TRIPLES.map(function (tr, i) { return { i: i, tr: tr, on: i === s.place, show: i < s.done.length }; });
        D.reconcile(c.dst, dstItems, it => it.i,
          () => D.el('div', 'chip'),
          (node, it) => {
            node.className = 'chip' + (it.on ? ' warm' : '') + (it.show ? ' on' : '');
            node.style.cssText = 'justify-content:center;min-width:150px;font-size:11.5px';
            if (it.show) {
              var tr = it.tr;
              node.textContent = '(' + tr[1] + ', ' + tr[0] + ', ' + tr[2] + ')';
            } else {
              node.textContent = '( , , )';
            }
          });
        c.phase.textContent = s.phase;
        var lines = [];
        if (s.num) lines.push('列号 : 0  1  2  3  4');
        if (s.num) lines.push('num  : ' + s.num.join('  '));
        if (s.pos) lines.push('pos  : ' + s.pos.join('  '));
        lines.push('');
        lines.push(s.txt);
        c.tables.innerHTML = lines.join('<br>');
      }
    });
    doc.appendChild(c4);

    const c5 = D.card({ title: '三个公式，一张表记住', icon: '📐', badge: '背下来' });
    D.html(c5.querySelector('.body'),
      D.table(['存储方式', '要存多少个', '映射公式', '注意'], [
        ['二维数组（行主序）', 'm × n', 'offset = i * n + j', 'i、j 都从 0 开始；列主序则是 j * m + i'],
        ['对称矩阵（下三角）', 'n(n+1)/2', 'k = i(i+1)/2 + j', '只对 i ≥ j 成立；i &lt; j 时先交换 i、j'],
        ['三角矩阵（上三角）', 'n(n+1)/2 + 1', '比对称矩阵多存一个常数，放在最后', '上三角映射时把 i、j 换成"反向行号"'],
        ['三对角矩阵', '3n − 2', 'k = 2i + j', '只有主对角线和上下两条次对角线非零'],
        ['稀疏矩阵（三元组）', '3 × 非零元个数', '按 (行, 列, 值) 直接存', '转置时行列互换，再用快速转置保持有序'],
      ]) +
      D.note('tip', '考试里怎么快速推公式',
        '不要死背。问自己两个问题：<br>' +
        '① <b>这一行前面有几整行？</b>——对应公式里那个"前面有多少个元素"的求和项；<br>' +
        '② <b>本行里它是第几个？</b>——对应最后那个 +j 或者 +i。<br>' +
        '把 (0,0)、(1,0)、(1,1) 几个特殊点代进去验算一下，公式对不对立刻就知道了。'));
    doc.appendChild(c5);

    const c6 = D.card({ title: '分步实现 · C / C++ / Rust', icon: '⌨️', badge: '6 个步骤' });
    D.html(c6.querySelector('.body'),
      '<p>三种语言、同一套步骤。<b>点右上角切换语言，整页跟着一起换。</b>把每一步按顺序拼起来，就是一份能直接编译运行的完整程序。</p>' +
      '<p>代码里有三块：<b>地址计算</b>、<b>对称矩阵的压缩存取</b>、<b>稀疏矩阵的快速转置</b>。都是裸数组，不用任何容器。</p>' +
      D.codeSteps('matrix') +
      D.sources('matrix') +
      D.note('tip', '自测方法',
        '对称矩阵那部分，写完之后遍历所有 (i,j)，检查 <code class="inl">get(i,j) == get(j,i)</code> 是否恒成立；' +
        '快速转置那部分，检查转置两次能不能还原成原矩阵。这两个检查能抓住绝大部分下标错误。'));
    doc.appendChild(c6);

    const c7 = D.card({ title: '动手练', icon: '✎', badge: '白纸手写' });
    D.html(c7.querySelector('.body'),
      D.ex('写出 <code class="inl">symmetricIndex(i, j)</code>：把 n 阶对称矩阵的 (i,j) 映射到一维数组下标（下三角压缩）。' +
        '写完用 4 阶矩阵验算：(0,0)→0、(1,0)→1、(1,1)→2、(2,0)→3、(3,3)→9，并说明 n 阶对称矩阵一共要多少个存储单元。',
        D.answerFor('matrix', 1)) +
      D.ex('写一个<b>普通转置</b>（不用 pos 数组那一套）：对转置结果的每一行，回去原表扫一遍找出该行需要的元素。' +
        '写完后和快速转置对比复杂度，说说为什么它慢。',
        D.answerFor('matrix', 2)));
    doc.appendChild(c7);
  }
});
})();

</script>

<script>
/* ==================== 15-genlist.js ==================== */
/* ============================ 0. 广义表 ============================ */
(function () {
'use strict';
const D = window.DSV;

const POS = {
  root: [310, 44],
  a: [110, 140],
  sub: [310, 140],
  d: [510, 140],
  b: [246, 232],
  c: [374, 232]
};
const EDGES = [['root', 'a'], ['root', 'sub'], ['root', 'd'], ['sub', 'b'], ['sub', 'c']];
const LABEL = { root: 'GL', a: 'a', sub: '( )', d: 'd', b: 'b', c: 'c' };

function G(o) { return Object.assign({ hl: [], hd: [], len: '', dep: '', head: '', tail: '', note: '' }, o || {}); }
const steps = [
  { text: '广义表 GL = <b>(a, (b, c), d)</b>。它是线性表的推广：线性表里每个元素都是原子，而广义表里<b>元素可以是原子，也可以是另一个表</b>。这里第一层的三项分别是：原子 a、子表 (b,c)、原子 d。',
    s: G({ hl: ['root'], note: '括号里逗号分隔的每一项，要么是原子，要么是子表' }) },
  { text: '<b>表长</b>：看第一层有几个元素。a 算 1 个、(b,c) <b>整个子表也只算 1 个</b>、d 算 1 个 → 长度 = 3。注意别把 b、c 也数进去，那是第二层的事。',
    s: G({ hl: ['a', 'sub', 'd'], len: '3', note: '长度只看最外层有几项' }) },
  { text: '<b>表头 head</b>：就是括号里的第一个元素。这里是原子 a。→ head(GL) = a',
    s: G({ hl: ['a'], head: 'a', len: '3', note: 'head 一定是第一个元素，可能原子也可能子表' }) },
  { text: '<b>表尾 tail</b>：去掉表头之后剩下的所有元素。等于 ((b,c), d) —— <b>注意外面要再套一层括号</b>，因为表尾还是一个广义表。',
    s: G({ hl: ['sub', 'd'], head: 'a', tail: '((b,c), d)', len: '3', note: 'tail 永远是广义表，不是元素' }) },
  { text: '<b>深度 depth</b> 的定义：原子的深度是 0；空表深度是 1；一张表的深度 = <b>1 + 它所有元素里深度的最大值</b>。所以算深度就是递归往下找"最深的那层括号"。',
    s: G({ hl: ['root'], dep: '?', note: '深度 = 括号最多套了几层' }) },
  { text: '来算：a 是原子 → 深度 0；d 是原子 → 深度 0；(b,c) 里 b、c 都是原子，所以 max=0，它的深度 = 1+0 = <b>1</b>。整个表取最大值 max(0,1,0)=1，再加 1 → <b>深度 = 2</b>。',
    s: G({ hl: ['sub', 'b', 'c'], hd: ['root'], dep: '2', len: '3', note: '1 + max(0, 1, 0) = 2' }) },
  { text: '换个例子验证：<b>(a, (b, (c, d)))</b>。最外层深度 = 1 + (a 的 0、(b,(c,d)) 的深度) 里的最大值。(b,(c,d)) = 1 + (b 的 0、(c,d) 的 1) = 2。所以整体 = 1 + 2 = <b>3</b>。括号套了几层，深度就是几。',
    s: G({ hl: ['root'], dep: '3（换成 (a,(b,(c,d))) 时）', note: '深度就是"括号最多套了几层"' }) },
  { text: '广义表在代码里怎么存？最常用的是<b>头尾链表表示法</b>：每个节点有一个 tag 标记"我是原子还是子表"，再用两个指针——hp 指向子表、tp 指向同层的下一个。这样表头和表尾天然就能取出来。',
    s: G({ hl: ['root', 'a', 'sub', 'd'], len: '3', dep: '2', head: 'a', tail: '((b,c), d)', note: 'tag=0 原子 / tag=1 子表；hp 指向子表，tp 指向同层下一个' }) }
];

D.register({
  id: 'genlist', title: '广义表', icon: '🧬', group: '三、数组与广义表', order: 48,
  blurb: '元素可以是子表；重点是 head / tail / 长度 / 深度',
  badge: '递归结构',
  keywords: '广义表 genlist 表头 head 表尾 tail 长度 深度 递归 头尾链表',
  lead: '广义表是"表里还能放表"的线性表。它本身用不上，但它是最便宜的一次"递归数据结构"练习——树、图都是它的亲戚。',
  build(doc) {
    const c1 = D.card({ title: '一句话讲清', icon: '💡', badge: 'Generalized List' });
    D.html(c1.querySelector('.body'),
      '<p>广义表（简称"表"）是线性表的推广：<b>它的元素既可以是原子，也可以是另一个广义表</b>。' +
      '写成 <code class="inl">(a, (b, c), d)</code> 这样，括号里的每一项用逗号分开。</p>' +
      '<p>四个必会的基本概念：</p>' +
      D.table(['概念', '定义', '例子 (a, (b,c), d)'], [
        ['<b>表头 head</b>', '括号里的第一个元素', 'a'],
        ['<b>表尾 tail</b>', '去掉表头剩下的部分（还是一个表）', '((b,c), d)'],
        ['<b>长度 length</b>', '最外层有几个元素', '3'],
        ['<b>深度 depth</b>', '括号最多套了几层', '2'],
      ]) +
      D.note('warn', '三个最容易错的地方',
        '① <b>子表只算 1 个元素</b>：(b,c) 在长度里只贡献 1，不是 2；<br>' +
        '② <b>表尾永远是表</b>：tail 的结果要再套一层括号，写成 (b,c),d 就错了；<br>' +
        '③ <b>空表深度是 1 不是 0</b>：这是教材的约定，因为 "()" 也算套了一层括号。'));

    const c2 = D.card({ title: '动画：head / tail / 长度 / 深度 怎么算', icon: '🎬', badge: '一次看懂' });
    const b2 = c2.querySelector('.body');
    D.html(b2, '<p>把广义表画成树：根是整张表，第一层的三个元素是它的三个孩子，子表 (b,c) 再往下展开。' +
      '<b>长度看根有几个孩子，深度看最深的叶子在第几层。</b></p>');
    D.lab(b2, {
      title: '广义表 (a, (b, c), d)',
      height: 370,
      steps: steps,
      setup(view) {
        const wrap = D.el('div');
        wrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:10px;width:100%';
        wrap.innerHTML =
          '<div class="row" style="gap:8px;flex-wrap:wrap;justify-content:center">' +
          '<span class="chip" data-k="len">长度 = ?</span>' +
          '<span class="chip" data-k="dep">深度 = ?</span>' +
          '<span class="chip on" data-k="head">head = ?</span>' +
          '<span class="chip on" data-k="tail">tail = ?</span>' +
          '</div>';
        const svg = D.svgEl('svg', { class: 'viz', viewBox: '0 0 620 280', preserveAspectRatio: 'xMidYMid meet' });
        svg.style.cssText = 'width:100%;max-width:620px;height:auto';
        svg.appendChild(D.svgEl('g', { class: 'edges' }));
        svg.appendChild(D.svgEl('g', { class: 'nodes' }));
        EDGES.forEach(function (e) {
          var a = POS[e[0]], b = POS[e[1]];
          svg.querySelector('g.edges').appendChild(D.svgEl('line', {
            class: 'lnk', 'data-e': e[0] + '-' + e[1], x1: a[0], y1: a[1] + 18, x2: b[0], y2: b[1] - 18
          }));
        });
        Object.keys(POS).forEach(function (k) {
          var g = D.svgEl('g', { class: 'nd', 'data-v': k, transform: 'translate(' + POS[k][0] + ',' + POS[k][1] + ')' });
          g.appendChild(D.svgEl('circle', { r: k === 'sub' ? 24 : 19 }));
          g.appendChild(D.svgEl('text', {}, LABEL[k]));
          svg.querySelector('g.nodes').appendChild(g);
        });
        wrap.appendChild(svg);
        var msg = D.el('div');
        msg.style.cssText = 'font-family:var(--mono);font-size:12px;color:#93a6c8;text-align:center';
        msg.setAttribute('data-k', 'note');
        wrap.appendChild(msg);
        view.appendChild(wrap);
        return {
          svg: svg, note: msg,
          len: wrap.querySelector('[data-k="len"]'), dep: wrap.querySelector('[data-k="dep"]'),
          head: wrap.querySelector('[data-k="head"]'), tail: wrap.querySelector('[data-k="tail"]')
        };
      },
      draw(c, step) {
        var s = step.s;
        Object.keys(POS).forEach(function (k) {
          var g = c.svg.querySelector('[data-v="' + k + '"]');
          var cls = 'nd';
          if (s.hd.indexOf(k) >= 0) cls += ' cur';
          else if (s.hl.indexOf(k) >= 0) cls += ' done';
          g.setAttribute('class', cls);
        });
        EDGES.forEach(function (e) {
          var ln = c.svg.querySelector('[data-e="' + e[0] + '-' + e[1] + '"]');
          var on = s.hl.indexOf(e[0]) >= 0 && s.hl.indexOf(e[1]) >= 0;
          ln.setAttribute('class', 'lnk' + (on ? ' on' : ''));
        });
        c.len.textContent = '长度 = ' + (s.len || '?');
        c.dep.textContent = '深度 = ' + (s.dep || '?');
        c.head.textContent = 'head = ' + (s.head || '?');
        c.tail.textContent = 'tail = ' + (s.tail || '?');
        c.note.textContent = s.note;
      }
    });
    doc.appendChild(c2);

    const c3 = D.card({ title: '代码里怎么表示：头尾链表', icon: '🔗', badge: '存储结构' });
    D.html(c3.querySelector('.body'),
      '<p>广义表的每个节点要能表达"我是原子还是表"这件事，所以用一个 <code class="inl">tag</code> 区分：</p>' +
      '<div class="codebox"><pre class="code"><code>' +
      'tag = 0  原子：值放在 atom 里<br>' +
      'tag = 1  子表：hp 指向子表的第一个节点<br>' +
      'tp  -----------> 指向同一层的下一个节点（两种节点都有）' +
      '</code></pre></div>' +
      '<p>这样画出来就是一条"头尾链"：</p>' +
      '<div class="codebox"><pre class="code"><code>' +
      'GL ──► [tag=1|hp|tp] ──► [tag=1|hp|tp] ──► [tag=0|atom=d|tp=null]<br>' +
      '            │ hp                │ hp<br>' +
      '            ▼                   ▼<br>' +
      '        [tag=0|atom=a|tp=null]  [tag=0|atom=b|tp] ──► [tag=0|atom=c|tp=null]' +
      '</code></pre></div>' +
      D.note('note', '为什么用这种结构',
        '因为"表头"就是第一个节点，"表尾"就是第一个节点的 tp 之后那串——<b>取 head 和 tail 都只用走一步</b>。' +
        '这和 Lisp 里 car / cdr 的表示法是同一个思路。'));
    doc.appendChild(c3);

    const c4 = D.card({ title: '递归结构，就有递归解法', icon: '🌀', badge: '套路' });
    D.html(c4.querySelector('.body'),
      '<p>广义表的深度定义本身就是递归的，所以代码也直接照着定义写：</p>' +
      D.table(['操作', '递归定义', '代码骨架'], [
        ['<b>深度 depth</b>', '空表 = 1；原子 = 0；表 = 1 + 所有元素深度的最大值',
          'if (空) return 1;<br>if (原子) return 0;<br>遍历同层每个元素，取 max，返回 max+1'],
        ['<b>长度 length</b>', '同一层用 tp 数节点个数（子表也只算 1 个）',
          'len = 0;<br>while (p) { len++; p = p->tp; }'],
        ['<b>打印</b>', '遇到 tag=1 就加一层括号',
          '遇到子表先输出 "(" 递归再输出 ")"'],
      ]) +
      D.note('tip', '一个自测用例',
        '把书上的经典例题都手算一遍，再和代码结果对：<br>' +
        'E = () → 长度 0、深度 1<br>' +
        'L = (a, (b, c)) → 长度 2、深度 2<br>' +
        'S = (a, (b, (c, d))) → 长度 2、深度 3<br>' +
        'T = ((), (())) → 长度 2、深度 3（空表也算一层，很容易算错）'));
    doc.appendChild(c4);

    D.html(c5.querySelector('.body'),

<script>
/* ==================== 16-tree.js ==================== */
/* ============================ 0. 树和二叉树 ============================ */
(function () {
'use strict';
const D = window.DSV;

/* 固定的一棵满二叉树：A(B(D,E), C(F,G))，前序扩展序列 ABD##E##CF##G## */
const NODES = [
  { id: 'A', path: '', parent: null },
  { id: 'B', path: 'L', parent: 'A' },
  { id: 'C', path: 'R', parent: 'A' },
  { id: 'D', path: 'LL', parent: 'B' },
  { id: 'E', path: 'LR', parent: 'B' },
  { id: 'F', path: 'RL', parent: 'C' },
  { id: 'G', path: 'RR', parent: 'C' }
];
const W = 620;
function posOf(path) {
  var d = path.length, idx = 0;
  for (var i = 0; i < d; i++) idx = idx * 2 + (path[i] === 'R' ? 1 : 0);
  var slot = W / Math.pow(2, d);
  return { x: (idx + 0.5) * slot, y: 46 + d * 92 };
}
function makeSvg() {
  var svg = D.svgEl('svg', { class: 'viz', viewBox: '0 0 620 300', preserveAspectRatio: 'xMidYMid meet' });
  svg.style.cssText = 'width:100%;max-width:620px;height:auto';
  svg.appendChild(D.svgEl('g', { class: 'edges' }));
  svg.appendChild(D.svgEl('g', { class: 'nodes' }));
  NODES.forEach(function (n) {
    var p = posOf(n.path);
    var g = D.svgEl('g', { class: 'nd', 'data-v': n.id, transform: 'translate(' + p.x + ',' + p.y + ')' });
    g.appendChild(D.svgEl('circle', { r: 19 }));
    g.appendChild(D.svgEl('text', {}, n.id));
    svg.querySelector('g.nodes').appendChild(g);
  });
  NODES.forEach(function (n) {
    if (n.parent === null) return;
    var par = NODES.filter(function (m) { return m.id === n.parent; })[0];
    var a = posOf(par.path), b = posOf(n.path);
    svg.querySelector('g.edges').appendChild(D.svgEl('line', {
      class: 'lnk', 'data-e': n.parent + n.id, x1: a.x, y1: a.y + 19, x2: b.x, y2: b.y - 19
    }));
  });
  return svg;
}
function paintTree(svg, cur, done) {
  NODES.forEach(function (n) {
    var g = svg.querySelector('[data-v="' + n.id + '"]');
    var cls = 'nd';
    if (n.id === cur) cls += ' cur';
    else if (done.indexOf(n.id) >= 0) cls += ' done';
    g.setAttribute('class', cls);
  });
}

/* ---------- Lab 1：前序遍历 ---------- */
function T(o) { return Object.assign({ cur: null, done: [], out: [], note: '', stack: [] }, o || {}); }
const preSteps = [
  { text: '这棵二叉树：A 是根，B、C 是它的左右孩子，D、E 是 B 的孩子，F、G 是 C 的孩子。一共 7 个节点，是一棵满二叉树。',
    s: T({ note: '满二叉树：每一层的节点数都达到最大' }) },
  { text: '<b>前序遍历</b>的口诀是"根 → 左 → 右"：先访问自己，再递归左子树，最后递归右子树。从根 A 开始。',
    s: T({ cur: 'A', out: ['A'], stack: ['A'], note: '访问 A（前序：先根）' }) },
  { text: 'A 输出完了（前序是"进节点就输出"），现在递归进左子树 B。',
    s: T({ cur: 'B', done: ['A'], out: ['A', 'B'], stack: ['A', 'B'], note: '访问 B' }) },
  { text: 'B 也有左孩子，继续往左钻到 D。',
    s: T({ cur: 'D', done: ['A', 'B'], out: ['A', 'B', 'D'], stack: ['A', 'B', 'D'], note: '访问 D' }) },
  { text: 'D 没有孩子了 —— 递归返回上一层 B，B 的左子树处理完了，接着处理右子树 E。',
    s: T({ cur: 'E', done: ['A', 'B', 'D'], out: ['A', 'B', 'D', 'E'], stack: ['A', 'B', 'E'], note: 'D 无孩子，回溯到 B，访问 E' }) },
  { text: 'E 也没有孩子，B 的左右都处理完了，返回 A。A 的左子树完成，进入右子树 C。',
    s: T({ cur: 'C', done: ['A', 'B', 'D', 'E'], out: ['A', 'B', 'D', 'E', 'C'], stack: ['A', 'C'], note: '左子树完成，回到 A，访问 C' }) },
  { text: 'C 往左到 F。',
    s: T({ cur: 'F', done: ['A', 'B', 'D', 'E', 'C'], out: ['A', 'B', 'D', 'E', 'C', 'F'], stack: ['A', 'C', 'F'], note: '访问 F' }) },
  { text: 'F 无孩子，回溯到 C，再到右孩子 G。',
    s: T({ cur: 'G', done: ['A', 'B', 'C', 'D', 'E', 'F'], out: ['A', 'B', 'D', 'E', 'C', 'F', 'G'], stack: ['A', 'C', 'G'], note: '访问 G' }) },
  { text: 'G 也没有孩子，一路返回。前序遍历完成：<b>A B D E C F G</b>。注意这个顺序就是"图中节点被第一次经过的顺序"。',
    s: T({ done: ['A', 'B', 'C', 'D', 'E', 'F', 'G'], out: ['A', 'B', 'D', 'E', 'C', 'F', 'G'], note: '前序 = A B D E C F G' }) },
  { text: '把三种深度优先遍历对比一下：只有"访问自己"这一行位置不同。<b>前序在进节点时输出、中序在左子树回来时输出、后序在右子树回来后输出。</b>中序结果是 D B E A F C G，后序是 D E B F G C A。',
    s: T({ done: ['A', 'B', 'C', 'D', 'E', 'F', 'G'], out: ['A', 'B', 'D', 'E', 'C', 'F', 'G'], note: '中序：D B E A F C G　后序：D E B F G C A' }) }
];

/* ---------- Lab 2：层序遍历 ---------- */
function Q(o) { return Object.assign({ cur: null, done: [], out: [], queue: [], note: '', ptr: 0 }, o || {}); }
const lvlSteps = [
  { text: '层序遍历就是"一层一层、从左到右"。它不用递归，而是用一个<b>队列</b>：根先进队，然后每次取出队头、把它访问掉，再把它的孩子依次入队。',
    s: Q({ queue: ['A'], note: 'A 入队' }) },
  { text: '取出队头 A，访问它，然后把 A 的左右孩子 B、C 依次入队。',
    s: Q({ cur: 'A', out: ['A'], done: ['A'], queue: ['B', 'C'], note: '访问 A → 入队 B、C' }) },
  { text: '取出 B，访问，把 B 的孩子 D、E 入队。队列变成 C、D、E —— 注意 C 还排在 D、E 前面，所以下一层的一定在后面。',
    s: Q({ cur: 'B', out: ['A', 'B'], done: ['A', 'B'], queue: ['C', 'D', 'E'], note: '访问 B → 入队 D、E' }) },
  { text: '取出 C，访问，把 F、G 入队。',
    s: Q({ cur: 'C', out: ['A', 'B', 'C'], done: ['A', 'B', 'C'], queue: ['D', 'E', 'F', 'G'], note: '访问 C → 入队 F、G' }) },
  { text: '接下来队列里只剩叶子节点了，依次取出来访问即可。',
    s: Q({ cur: 'D', out: ['A', 'B', 'C', 'D'], done: ['A', 'B', 'C', 'D'], queue: ['E', 'F', 'G'], note: '访问 D' }) },
  { text: '继续取出 E。',
    s: Q({ cur: 'E', out: ['A', 'B', 'C', 'D', 'E'], done: ['A', 'B', 'C', 'D', 'E'], queue: ['F', 'G'], note: '访问 E' }) },
  { text: '继续取出 F。',
    s: Q({ cur: 'F', out: ['A', 'B', 'C', 'D', 'E', 'F'], done: ['A', 'B', 'C', 'D', 'E', 'F'], queue: ['G'], note: '访问 F' }) },
  { text: '取出 G，队列空了，结束。层序结果：<b>A B C D E F G</b>。你会发现它正好是"按层从左到右"，因为队列保证了"先进先出"。',
    s: Q({ cur: 'G', out: ['A', 'B', 'C', 'D', 'E', 'F', 'G'], done: ['A', 'B', 'C', 'D', 'E', 'F', 'G'], queue: [], note: '层序 = A B C D E F G' }) }
];

/* ---------- Lab 3：哈夫曼树 ---------- */
function H(o) { return Object.assign({ forest: [], pick: [], merged: null, note: '', round: 0 }, o || {}); }
const huffSteps = [
  { text: '哈夫曼树用来做"最优编码"：权值越大的字符，编码越短。给 6 个字符权值 5、7、2、13、9、3，先把它们各自看成一棵只有一个节点的树（森林）。',
    s: H({ forest: [['a', 5], ['b', 7], ['c', 2], ['d', 13], ['e', 9], ['f', 3]], note: '每个字符先单独成树' }) },
  { text: '第 1 轮：在森林里挑<b>权值最小的两棵</b>——c(2) 和 f(3)，合并成新树 5。森林变成 {a5, b7, d13, e9, (cf)5}。',
    s: H({ forest: [['a', 5], ['b', 7], ['d', 13], ['e', 9], ['cf', 5]], pick: ['c', 'f'], merged: ['cf', 5], round: 1, note: '2 + 3 = 5' }) },
  { text: '第 2 轮：最小的是 a(5) 和刚合并出来的 (cf)(5)，合并成 10。森林 {b7, d13, e9, 10}。',
    s: H({ forest: [['b', 7], ['d', 13], ['e', 9], ['a(cf)', 10]], pick: ['a', 'cf'], merged: ['a(cf)', 10], round: 2, note: '5 + 5 = 10' }) },
  { text: '第 3 轮：最小的是 b(7) 和 e(9)，合并成 16。森林 {d13, 10, 16}。',
    s: H({ forest: [['d', 13], ['a(cf)', 10], ['be', 16]], pick: ['b', 'e'], merged: ['be', 16], round: 3, note: '7 + 9 = 16' }) },
  { text: '第 4 轮：最小的是 10 和 d(13)，合并成 23。森林 {16, 23}。',
    s: H({ forest: [['be', 16], ['d(a(cf))', 23]], pick: ['a(cf)', 'd'], merged: ['d(a(cf))', 23], round: 4, note: '10 + 13 = 23' }) },
  { text: '第 5 轮：只剩两棵了，合并成根 39。哈夫曼树建成：<b>每次挑两个最小的合并</b>，一共合并 n-1 次。',
    s: H({ forest: [['ROOT', 39]], pick: ['be', 'd(a(cf))'], merged: ['ROOT', 39], round: 5, note: '16 + 23 = 39' }) },
  { text: '最后从根往下走：往左记 0、往右记 1，每个叶子的路径就是它的哈夫曼编码。权值大的（d=13）离根近、编码短；权值小的（c=2、f=3）离根远、编码长——这就是"最优"。',
    s: H({ forest: [['ROOT', 39]], pick: [], merged: null, round: 6, note: '总编码长度最小（带权路径长度 WPL 最小）' }) },
  { text: '为什么它是"最优"的？因为每次合并都让当前最小的两个权值沉到树的最深处，它们被重复计算的次数最少。严格证明用"贪心选择性质"，这里只要记住：<b>权值小的往下压，权值大的往上提</b>。',
    s: H({ forest: [['ROOT', 39]], pick: [], merged: null, round: 6, note: '贪心：每次合并最小的两个' }) }
];

D.register({
  id: 'tree', title: '树和二叉树', icon: '🌲', group: '四、树与二叉树', order: 55,
  blurb: '二叉链表、四种遍历、哈夫曼树——树这一章的入口',
  badge: '递归', 
  keywords: '树 二叉树 遍历 前序 中序 后序 层序 哈夫曼 编码 二叉链表 满二叉树 完全二叉树',
  lead: '树是第一种"分叉"的数据结构。二叉树的四种遍历是后面所有树形结构（BST、堆、字典树）的地基，必须练到闭眼能写。',
  build(doc) {

    D.html(c1.querySelector('.body'),
      '<p>二叉树就是每个节点最多两个孩子、并且左右孩子<b>有严格区分</b>（左边就是左边，不能换）的树。' +
      '它有两种最常用的存法：</p>' +
      D.table(['存储方式', '怎么做', '适合'], [
        ['<b>顺序存储</b>', '按完全二叉树的编号把节点放进数组：i 的孩子是 2i+1 / 2i+2', '完全二叉树（比如堆）；普通二叉树会浪费大量空间'],
        ['<b>二叉链表</b>', '每个节点存 data + left 指针 + right 指针', '通用，本章代码就用这个'],
      ]) +
      '<p>几个必须张嘴就能说的性质：</p>' +
      '<ul>' +
      '<li>第 i 层最多有 <b>2^(i-1)</b> 个节点（根算第 1 层）</li>' +
      '<li>深度为 h 的二叉树最多有 <b>2^h - 1</b> 个节点</li>' +
      '<li>叶子数 n0 和度为 2 的节点数 n2 满足 <b>n0 = n2 + 1</b>（常考！）</li>' +
      '<li>n 个节点的完全二叉树深度是 <b>⌊log2(n)⌋ + 1</b></li>' +
      '</ul>' +
      D.note('note', '为什么二叉树这么重要',
        '因为"最多两个孩子"这个限制太合适了：既能表达层次关系，又能用递归优雅地处理，' +
        '还能用数组紧凑存储。BST、堆、AVL、红黑树、字典树，全都是二叉树的变种。'));

    const c2 = D.card({ title: '动画 ①：前序遍历（递归到底是怎么回事）', icon: '🎬', badge: 'DFS' });
    const b2 = c2.querySelector('.body');
    D.html(b2, '<p>口诀：<b>根 → 左 → 右</b>。注意看下面的"递归栈"——每进一层就压一帧，没有孩子了就弹回去。' +
      '这个栈是<b>系统帮你维护的</b>，你写递归的时候不用自己管。</p>');
    D.lab(b2, {
      title: '前序遍历 · A B D E C F G',

    D.lab(b5, {

      setup(view) {
        var wrap = D.el('div');
        wrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:14px;width:100%';

          });
        c.note.textContent = s.note;
      }
    });
    doc.appendChild(c5);

    const c6 = D.card({ title: '分步实现 · C / C++ / Rust', icon: '⌨️', badge: '7 个步骤' });
    D.html(c6.querySelector('.body'),
      '<p>三种语言、同一套步骤。<b>点右上角切换语言，整页跟着一起换。</b>把每一步按顺序拼起来，就是一份能直接编译运行的完整程序。</p>' +
      '<p>C 版本要注意"二级指针传参"和"递归返回新根"这两件事；C++ 用类 + 嵌套 struct；Rust 用 <code class="inl">Option&lt;Box&lt;Node&gt;&gt;</code>。</p>' +
      D.codeSteps('tree') +
      D.sources('tree') +
      D.note('tip', '建树那一步的输入',
        '按"扩展前序序列"建树：遇到字符就建节点，遇到 <code class="inl">#</code> 就返回空。' +
        '序列 <code class="inl">ABD##E##CF##G##</code> 建出来正好是动画里这棵树（7 个节点）。这种写法叫"先序扩展序列"，' +
        '优点是可以唯一确定一棵二叉树。'));
    doc.appendChild(c6);

    const c7 = D.card({ title: '动手练', icon: '✎', badge: '白纸手写' });
    D.html(c7.querySelector('.body'),
      D.ex('默写"求叶子节点个数"的递归函数。提示：空树返回 0；左右都空（叶子）返回 1；否则返回左子树叶子数 + 右子树叶子数。' +
        '写完用动画里那棵树验算，答案应该是 4（D、E、F、G）。',
        D.answerFor('tree', 1)) +
      D.ex('默写"交换每个节点的左右孩子"。想一想：用前序、中序还是后序最方便？为什么？' +
        '再想想这题和"判断两棵树是否互为镜像"有什么关系。',

    doc.appendChild(c7);

});

<script>
/* ==================== 09-bst.js ==================== */
/* ============================ 6. 二叉搜索树 ============================ */
(function () {
'use strict';
const D = window.DSV;
const W = 760, H = 360, RH = 19, DY = 72;

function posOf(path) {
  const d = path.length;
  let idx = 0;
  for (let i = 0; i < d; i++) idx = idx * 2 + (path[i] === 'R' ? 1 : 0);
  const slot = W / Math.pow(2, d);
  return { x: (idx + 0.5) * slot, y: 26 + d * DY };
}

function makeSvg() {
  const svg = D.svgEl('svg', { class: 'viz', viewBox: '0 0 ' + W + ' ' + H, preserveAspectRatio: 'xMidYMid meet' });
  svg.style.cssText = 'width:100%;max-width:740px;height:auto';
  svg.appendChild(D.svgEl('g', { class: 'edges' }));
  svg.appendChild(D.svgEl('g', { class: 'nodes' }));
  return svg;
}

function renderTree(svg, tree, cls) {
  const gN = svg.querySelector('g.nodes'), gE = svg.querySelector('g.edges');
  const paths = Object.keys(tree);
  Array.prototype.forEach.call(gN.children, g => {
    if (!(g.dataset.p.substring(2) in tree)) g.remove();
  });
  paths.forEach(p => {
    let g = gN.querySelector('[data-p="p_' + p + '"]');
    const fresh = !g;
    if (fresh) {
      g = D.svgEl('g', { class: 'nd', 'data-p': 'p_' + p });
      g.appendChild(D.svgEl('circle', { r: RH }));
      g.appendChild(D.svgEl('text', {}));
      gN.appendChild(g);
    }
    const pos = posOf(p);
    g.setAttribute('transform', 'translate(' + pos.x.toFixed(1) + ',' + pos.y + ')');
    g.querySelector('text').textContent = tree[p];
    g.setAttribute('class', 'nd' + (cls && cls[p] ? ' ' + cls[p] : ''));
    if (fresh) { g.classList.add('enter'); setTimeout(() => g.classList.remove('enter'), 450); }
  });
  gE.innerHTML = '';
  paths.forEach(p => {
    if (!p) return;
    const par = p.slice(0, -1);
    if (!(par in tree)) return;
    const a = posOf(par), b = posOf(p);
    const on = cls && (cls[p] === 'cur' || cls[p] === 'done');
    gE.appendChild(D.svgEl('line', {
      class: 'lnk' + (on ? ' on' : ''), x1: a.x.toFixed(1), y1: a.y + RH, x2: b.x.toFixed(1), y2: b.y - RH
    }));
  });
}

/* ---------- 动画 1：插入与查找 ---------- */
function T1(tree, cls, o) { return Object.assign({ tree: Object.assign({}, tree), cls: Object.assign({}, cls), op: '', msg: '' }, o || {}); }

const steps1 = [
  { text: '一棵空的二叉搜索树。BST 只有一条规则：<b>对任意节点，左子树里所有值都比它小，右子树里所有值都比它大</b>。' +
      '这条规则让查找变成了"走楼梯"——每一步都能丢掉一半的候选。',
    s: T1({}, {}, { op: 'new BST()', msg: '空树' }) },
  { text: 'insert(8)：树是空的，8 直接成为根节点。',
    s: T1({ '': 8 }, { '': 'cur' }, { op: 'insert(8)', msg: '比较 0 次' }) },
  { text: 'insert(3)：3 &lt; 8，所以只能往<b>左</b>走。左边是空的 → 3 成为 8 的左孩子。' +
      '注意：每个新节点最终一定是作为<b>叶子</b>挂上去的，BST 里没有"插入到中间"这种事。',
    s: T1({ '': 8, 'L': 3 }, { '': 'done', 'L': 'cur' }, { op: 'insert(3)', msg: '1 &lt; 8 → 左，空位 → 挂上' }) },
  { text: 'insert(10)：10 &gt; 8，往右走，右边空 → 成为 8 的右孩子。',
    s: T1({ '': 8, 'L': 3, 'R': 10 }, { '': 'done', 'R': 'cur' }, { op: 'insert(10)', msg: '1 &gt; 8 → 右' }) },
  { text: 'insert(1)：1 &lt; 8 往左；到 3 之后 1 &lt; 3 继续往左；空 → 挂上。' +
      '<b>插入的路径和查找完全相同</b>，最后停下来的那个空位置就是它的家。',
    s: T1({ '': 8, 'L': 3, 'R': 10, 'LL': 1 }, { '': 'done', 'L': 'done', 'LL': 'cur' }, { op: 'insert(1)', msg: '8 → 3 → 空位' }) },
  { text: 'insert(6)：6 &lt; 8 往左；6 &gt; 3 往右；空 → 挂上。',
    s: T1({ '': 8, 'L': 3, 'R': 10, 'LL': 1, 'LR': 6 }, { '': 'done', 'L': 'done', 'LR': 'cur' }, { op: 'insert(6)', msg: '8 → 3 → 空位' }) },
  { text: 'insert(14)：14 &gt; 8 往右；14 &gt; 10 往右；空 → 挂上。',
    s: T1({ '': 8, 'L': 3, 'R': 10, 'LL': 1, 'LR': 6, 'RR': 14 }, { '': 'done', 'R': 'done', 'RR': 'cur' }, { op: 'insert(14)', msg: '8 → 10 → 空位' }) },
  { text: 'search(6)：6 &lt; 8 往左 → 6 &gt; 3 往右 → 6 == 6 命中。只比较了 3 次，而且每一次都把候选范围砍掉一半。' +
      '平衡的时候树高 ≈ log₂n，100 万个节点也只要 20 次比较。',
    s: T1({ '': 8, 'L': 3, 'R': 10, 'LL': 1, 'LR': 6, 'RR': 14 }, { '': 'done', 'L': 'done', 'LR': 'cur' }, { op: 'search(6) → 命中', msg: '比较 3 次' }) },
  { text: 'search(7)：7 &lt; 8 左 → 7 &gt; 3 右 → 7 &gt; 6 右 → 走到空指针，说明 7 不存在。' +
      '<b>查找失败时停下的那个空位，正好就是插入 7 时该放的位置</b>——这也是为什么"查找"和"插入"代码长得几乎一样。',
    s: T1({ '': 8, 'L': 3, 'R': 10, 'LL': 1, 'LR': 6, 'RR': 14 }, { '': 'done', 'L': 'done', 'LR': 'bad' }, { op: 'search(7) → 未命中', msg: '走了 3 步到空指针' }) },
  { text: '但 BST 有个致命弱点：<b>如果按 1、2、3、4、5 的顺序插入</b>，每个新值都比前一个大，全都往右挂 —— 树退化成了一条链表，树高变成 n，查找又回到 O(n)。' +
      '所以工程上用的是 AVL 树、红黑树、B 树这些"会自己平衡"的变种（Java 的 TreeMap、C++ 的 std::map、数据库索引都是）。',
    s: T1({ '': 1, 'R': 2, 'RR': 3, 'RRR': 4, 'RRRR': 5 }, { 'RRRR': 'bad' }, { op: '顺序插入 1..5', msg: '退化成链表：树高 = 5 = n' }) }
];

/* ---------- 动画 2：删除的三种情况 ---------- */
const BASE = { '': 8, 'L': 3, 'R': 10, 'LL': 1, 'LR': 6, 'RR': 14, 'LRL': 4, 'LRR': 7, 'RRL': 13 };
function T2(tree, cls, o) { return Object.assign({ tree: Object.assign({}, tree), cls: Object.assign({}, cls), op: '', msg: '' }, o || {}); }

const steps2 = [
  { text: '初始的一棵 BST。删除是 BST 里最难的操作为什么难？因为删掉一个节点之后，还得保证"左小右大"依旧成立。按被删节点的孩子数量，分三种情况。',
    s: T2(BASE, {}, { op: '初始树', msg: '三种情况：叶子 / 一个孩子 / 两个孩子' }) },
  { text: '情况 1 — 删叶子。delete(7)：7 &lt; 8 左，7 &gt; 3 右，7 &gt; 6 右，找到 7。它是叶子，没有子树要安置，直接把父节点（6）的右指针置空即可。',
    s: T2(BASE, { '': 'done', 'L': 'done', 'LR': 'done', 'LRR': 'cur' }, { op: 'delete(7)  【情况1：叶子】', msg: '路径 8 → 3 → 6 → 7' }) },
  { text: '7 被摘掉，其余节点一个都没动。情况 1 只改一根指针，O(1)。',
    s: T2({ '': 8, 'L': 3, 'R': 10, 'LL': 1, 'LR': 6, 'RR': 14, 'LRL': 4, 'RRL': 13 }, {}, { op: '7 已删除', msg: '父节点 6 的 right = null' }) },
  { text: '情况 2 — 删只有一个孩子的节点。delete(14)：14 &gt; 8 右，14 &gt; 10 右，找到 14。它只有一个左孩子 13。',
    s: T2({ '': 8, 'L': 3, 'R': 10, 'LL': 1, 'LR': 6, 'RR': 14, 'LRL': 4, 'RRL': 13 }, { '': 'done', 'R': 'done', 'RR': 'cur' }, { op: 'delete(14)  【情况2：单个孩子】', msg: '路径 8 → 10 → 14' }) },
  { text: '做法：让 14 的父节点（10）直接指向 14 的唯一孩子 13 —— 相当于"用孩子顶替自己的位置"。' +
      '有序性能保持吗？能：13 比 10 大（本来就在 10 的右子树里），又比 14 原来的位置更靠近 10，中间没有别的节点。',
    s: T2({ '': 8, 'L': 3, 'R': 10, 'LL': 1, 'LR': 6, 'RR': 13, 'LRL': 4 }, { 'R': 'done', 'RR': 'cur' }, { op: '10.right = 13', msg: '13 顶替 14 的位置' }) },
  { text: '情况 3 — 删有两个孩子的节点（最难）。delete(3)：3 &lt; 8 往左，找到 3。它有左孩子 1、右孩子 6，' +
      '左边有东西、右边也有东西，不管让谁"顶替"都会破坏顺序。',
    s: T2({ '': 8, 'L': 3, 'R': 10, 'LL': 1, 'LR': 6, 'RR': 13, 'LRL': 4 }, { '': 'done', 'L': 'cur' }, { op: 'delete(3)  【情况3：两个孩子】', msg: '左右都有孩子' }) },
  { text: '标准解法：找它的<b>中序后继</b> —— 右子树里的最小值。为什么是它？因为中序后继是"比 3 大的所有值里最小的那个"，' +
      '用它替换 3，既比左子树都大，又比右子树其余都小。找法：从右孩子出发，一路向左走到底。',
    s: T2({ '': 8, 'L': 3, 'R': 10, 'LL': 1, 'LR': 6, 'RR': 13, 'LRL': 4 }, { 'L': 'cur', 'LR': 'open', 'LRL': 'done' }, { op: '找中序后继：6 → 4', msg: '右子树最小值 = 4' }) },
  { text: '第一步：把后继的值<b>复制</b>到被删节点的位置。现在 3 这个位置上是 4。注意——我们改的是"值"，节点的位置和整棵树的形状都没有变。',
    s: T2({ '': 8, 'L': 4, 'R': 10, 'LL': 1, 'LR': 6, 'RR': 13, 'LRL': 4 }, { 'L': 'cur', 'LRL': 'open' }, { op: 'node.val = succ.val', msg: '3 的位置变成 4（临时重复）' }) },
  { text: '第二步：右子树里还留着一个真正的 4，它是多余的，要删掉。' +
      '关键洞察：<b>中序后继一定没有左孩子</b>（否则还能更小），所以删它要么是叶子，要么只有右孩子 —— 又退化成情况 1 或 2！' +
      '这就是递归能收尾的原因。',
    s: T2({ '': 8, 'L': 4, 'R': 10, 'LL': 1, 'LR': 6, 'RR': 13, 'LRL': 4 }, { 'L': 'done', 'LR': 'done', 'LRL': 'bad' }, { op: '删除原来的 4（叶子）', msg: '情况3 转化成了情况1' }) },
  { text: '删除完成，整棵树依旧是合法 BST：左小右大处处成立。' +
      '总代价 = 查找 O(h) + 找后继 O(h) + 删除 O(h) = <b>O(h)</b>，h 是树高（平衡时 O(log n)，退化时 O(n)）。',
    s: T2({ '': 8, 'L': 4, 'R': 10, 'LL': 1, 'LR': 6, 'RR': 13 }, { 'L': 'done' }, { op: '删除完成', msg: '中序依然是递增序列' }) }
];

/* ---------- 动画 3：中序遍历为什么有序 ---------- */
const steps3 = [
  { text: '中序遍历的口诀只有四个字：<b>左 → 根 → 右</b>。对 BST 来说，这个顺序恰好就是"从小到大"。为什么？因为"左子树全部小于根，右子树全部大于根"，先左再根再右，自然升序。',
    s: T1({ '': 8, 'L': 3, 'R': 10, 'LL': 1, 'LR': 6, 'RR': 14 }, { '': 'open' }, { op: 'inorder()', msg: '输出：' }) },
  { text: '从根 8 出发，第一步不是访问 8，而是"先去处理它的左子树"。所以递归进入 3。',
    s: T1({ '': 8, 'L': 3, 'R': 10, 'LL': 1, 'LR': 6, 'RR': 14 }, { '': 'done', 'L': 'open' }, { op: '进入 3 的左子树', msg: '输出：' }) },
  { text: '3 也要先处理自己的左子树，递归进入 1。',
    s: T1({ '': 8, 'L': 3, 'R': 10, 'LL': 1, 'LR': 6, 'RR': 14 }, { '': 'done', 'L': 'done', 'LL': 'open' }, { op: '进入 1', msg: '输出：' }) },
  { text: '1 的左子树是空的 → 立刻访问 1。这是整棵树里最小的值，也是中序遍历输出的第一个数。',
    s: T1({ '': 8, 'L': 3, 'R': 10, 'LL': 1, 'LR': 6, 'RR': 14 }, { 'LL': 'vis' }, { op: '访问 1', msg: '输出：1' }) },
  { text: '1 的右子树也是空的 → 这一层递归结束，返回 3。3 的左子树处理完了，轮到访问 3 自己。',
    s: T1({ '': 8, 'L': 3, 'R': 10, 'LL': 1, 'LR': 6, 'RR': 14 }, { 'LL': 'vis', 'L': 'vis' }, { op: '访问 3', msg: '输出：1, 3' }) },
  { text: '接着处理 3 的右子树：进入 6。6 没有左孩子 → 直接访问 6。',
    s: T1({ '': 8, 'L': 3, 'R': 10, 'LL': 1, 'LR': 6, 'RR': 14 }, { 'LL': 'vis', 'L': 'vis', 'LR': 'vis' }, { op: '访问 6', msg: '输出：1, 3, 6' }) },
  { text: '左子树全部处理完，回到根 8 —— 这时才访问它。所以 8 一定是第 4 个输出，它前面的三个都来自左子树，后面都来自右子树。',
    s: T1({ '': 8, 'L': 3, 'R': 10, 'LL': 1, 'LR': 6, 'RR': 14 }, { 'LL': 'vis', 'L': 'vis', 'LR': 'vis', '': 'vis' }, { op: '访问 8', msg: '输出：1, 3, 6, 8' }) },
  { text: '最后处理右子树：10 没有左孩子 → 访问 10；再进入它的右子树 14，访问 14。',
    s: T1({ '': 8, 'L': 3, 'R': 10, 'LL': 1, 'LR': 6, 'RR': 14 }, { 'LL': 'vis', 'L': 'vis', 'LR': 'vis', '': 'vis', 'R': 'vis' }, { op: '访问 10', msg: '输出：1, 3, 6, 8, 10' }) },
  { text: '最终输出 <b>1, 3, 6, 8, 10, 14</b> —— 严格递增。这个性质用途极广：' +
      '判断一棵树是不是 BST、求第 k 小、求有序数组转平衡 BST、找中序前驱/后继，全都靠它。',
    s: T1({ '': 8, 'L': 3, 'R': 10, 'LL': 1, 'LR': 6, 'RR': 14 }, { 'LL': 'vis', 'L': 'vis', 'LR': 'vis', '': 'vis', 'R': 'vis', 'RR': 'vis' }, { op: '遍历结束', msg: '输出：1, 3, 6, 8, 10, 14（递增）' }) }
];

D.register({
  id: 'bst', title: '二叉搜索树', icon: '🌳', group: '四、树与二叉树', order: 60,
  blurb: '左小右大，查找插入删除都 O(log n)（前提是不退化）',
  badge: 'O(log n)',
  keywords: 'bst 二叉搜索树 二叉树 排序树 遍历 中序 删除 前驱 后继',
  lead: 'BST 把"有序"和"树形"结合了起来：查找时每走一步就丢掉一半候选，这是二分查找的树形版本。',
  build(doc) {
    const c1 = D.card({ title: '一句话讲清', icon: '💡', badge: 'Binary Search Tree' });
    D.html(c1.querySelector('.body'),
      '<p>BST 就是一棵每个节点最多两个孩子、并且满足这条规则的树：' +
      '<b>左子树里所有值 &lt; 根 &lt; 右子树里所有值</b>（注意是"所有"，不只是直接孩子）。</p>' +
      '<p>这条规则带来的直接结果：查找时"比当前节点小就往左、大就往右"，每走一步砍掉一半，' +
      '所以查找/插入/删除的代价都等于<b>树高 h</b>。理想情况 h = log₂n，最坏情况 h = n（退化成链表）。</p>' +
      D.mini([['O(log n)', '查找 / 插入 / 删除（平衡）'], ['O(n)', '最坏（退化成链）'], ['O(h)', '空间（递归栈）'], ['中序', '遍历结果一定递增']]) +
      D.note('note', '为什么"左小右大"这么重要',
        '因为有了顺序，你就得到了 3 个超能力：① 查找能二分（走楼梯）；' +
        '② 中序遍历直接得到有序序列；③ 能回答"最接近 x 的值是谁""区间内有多少个元素"这类<b>范围查询</b>——' +
        '这是哈希表做不到的。'));

    const c2 = D.card({ title: '动画 ①：插入与查找（走楼梯）', icon: '🎬', badge: '基础' });
    const b2 = c2.querySelector('.body');
    D.html(b2, '<p>绿色是走过的路径，橙色是当前比较的节点。注意插入和查找的路径<b>完全一样</b>，' +
      '区别只是最后一步：查找走到节点就停，插入走到空位才挂。</p>');
    D.lab(b2, {
      title: 'BST · insert / search',
      height: 440,
      steps: steps1,
      setup(view) {
        const wrap = D.el('div');
        wrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:8px;width:100%';
        wrap.innerHTML = '<div class="row" style="gap:10px;flex-wrap:wrap;justify-content:center">' +
          '<span class="chip warm" data-k="op">—</span><span class="chip" data-k="msg">—</span></div>';
        const svg = makeSvg();
        wrap.appendChild(svg);
        view.appendChild(wrap);
        return { svg: svg, op: wrap.querySelector('[data-k="op"]'), msg: wrap.querySelector('[data-k="msg"]') };
      },
      draw(c, step) {
        renderTree(c.svg, step.s.tree, step.s.cls);
        c.op.textContent = step.s.op;
        c.msg.textContent = step.s.msg;
      }
    });
    doc.appendChild(c2);

    const b3 = c3.querySelector('.body');

<script>
/* ==================== 10-heap.js ==================== */
/* ============================ 7. 堆 ============================ */
(function () {
'use strict';
const D = window.DSV;
const W = 700, RH = 18, DY = 66;

function posIdx(i) {
  const level = Math.floor(Math.log2(i + 1));
  const posIn = i - (Math.pow(2, level) - 1);
  const slot = W / Math.pow(2, level);
  return { x: (posIn + 0.5) * slot, y: 24 + level * DY };
}
function makeSvg() {
  const svg = D.svgEl('svg', { class: 'viz', viewBox: '0 0 ' + W + ' 300', preserveAspectRatio: 'xMidYMid meet' });
  svg.style.cssText = 'width:100%;max-width:700px;height:auto';
  svg.appendChild(D.svgEl('g', { class: 'edges' }));
  svg.appendChild(D.svgEl('g', { class: 'nodes' }));
  return svg;
}
function renderHeap(svg, arr, cls) {
  const gN = svg.querySelector('g.nodes'), gE = svg.querySelector('g.edges');
  const n = arr.length;
  Array.prototype.forEach.call(gN.children, g => { if (+g.dataset.i >= n) g.remove(); });
  for (let i = 0; i < n; i++) {
    let g = gN.querySelector('[data-i="' + i + '"]');
    const fresh = !g;
    if (fresh) {
      g = D.svgEl('g', { class: 'nd', 'data-i': i });
      g.appendChild(D.svgEl('circle', { r: RH }));
      g.appendChild(D.svgEl('text', {}));
      gN.appendChild(g);
    }
    const pos = posIdx(i);
    g.setAttribute('transform', 'translate(' + pos.x.toFixed(1) + ',' + pos.y + ')');
    g.querySelector('text').textContent = arr[i];
    g.setAttribute('class', 'nd' + (cls && cls[i] ? ' ' + cls[i] : ''));
    if (fresh) { g.classList.add('enter'); setTimeout(() => g.classList.remove('enter'), 450); }
  }
  gE.innerHTML = '';
  for (let i = 1; i < n; i++) {
    const par = (i - 1) >> 1;
    const a = posIdx(par), b = posIdx(i);
    const on = cls && (cls[i] === 'cur' || cls[par] === 'cur');
    gE.appendChild(D.svgEl('line', {
      class: 'lnk' + (on ? ' on' : ''), x1: a.x.toFixed(1), y1: a.y + RH, x2: b.x.toFixed(1), y2: b.y - RH
    }));
  }
}

/* ---------- 动画数据 ---------- */
function HP(arr, cls, o) { return Object.assign({ arr: arr.slice(), cls: Object.assign({}, cls), op: '', msg: '' }, o || {}); }

const steps = [
  { text: '堆是一棵<b>完全二叉树</b>，并且满足"堆序性"：小顶堆里每个父节点都 ≤ 两个孩子。' +
      '两条性质合起来给出一个极有用的结论：<b>堆顶一定是整个堆里的最小值（大顶堆则是最大值）</b>，而且取它是 O(1)。',
    s: HP([5, 20, 10, 40, 50, 30, 60], {}, { op: '一个合法的小顶堆', msg: '每个父节点都 ≤ 孩子' }) },
  { text: '堆最妙的地方：<b>它不需要任何指针</b>。因为完全二叉树的节点是"一层一层填满"的，' +
      '所以可以直接按下标映射：下标 i 的左孩子是 2i+1、右孩子 2i+2、父节点是 (i-1)/2 向下取整。' +
      '上面那排数组和下面这棵树，是<b>同一份数据</b>的两种画法。',
    s: HP([5, 20, 10, 40, 50, 30, 60], {}, { op: '数组 ↔ 完全二叉树', msg: '左 2i+1  右 2i+2  父 (i-1)/2' }) },
  { text: 'push(3)：第一步先把 3 放到数组<b>末尾</b>（下标 7）。为什么放末尾？因为只有放在末尾才能保持"完全二叉树"的形状——' +
      '堆的结构约束是不能破坏的，否则下标映射就不成立了。',
    s: HP([5, 20, 10, 40, 50, 30, 60, 3], { 7: 'cur' }, { op: 'push(3)  放到末尾', msg: '形状对了，但堆序被破坏了' }) },
  { text: '第二步：<b>上浮（sift up）</b>。3 的父节点是下标 (7-1)/2 = 3，值是 40。3 &lt; 40，违反堆序 → 交换。',
    s: HP([5, 20, 10, 3, 50, 30, 60, 40], { 3: 'cur', 7: 'done' }, { op: '3 < 40 → 交换', msg: '下标 7 与下标 3 交换' }) },
  { text: '继续上浮：3 现在在下标 3，父节点是下标 1，值是 20。3 &lt; 20 → 再交换。',
    s: HP([5, 3, 10, 20, 50, 30, 60, 40], { 1: 'cur', 3: 'done' }, { op: '3 < 20 → 交换', msg: '下标 3 与下标 1 交换' }) },
  { text: '继续上浮：3 在下标 1，父节点是根，值是 5。3 &lt; 5 → 交换。到根了，停下。' +
      '整个过程中 3 最多走"树高"步，所以 push 是 <b>O(log n)</b>。',
    s: HP([3, 5, 10, 20, 50, 30, 60, 40], { 0: 'cur', 1: 'done' }, { op: '3 < 5 → 交换，到达堆顶', msg: 'push 完成，O(log n)' }) },
  { text: 'pop()：先记下堆顶 3（它是全局最小值）。但堆顶空出来怎么办？' +
      '如果随便找个节点补上去会破坏"完全二叉树"的形状。所以标准做法是：<b>把数组最后一个元素挪到堆顶</b>，再 size--。',
    s: HP([40, 5, 10, 20, 50, 30, 60], { 0: 'cur' }, { op: 'pop() → 3；末尾 40 补到堆顶', msg: '形状保住了，堆序坏了' }) },
  { text: '第二步：<b>下沉（sift down）</b>。40 的两个孩子是 5 和 10。注意——必须和<b>更小的那个</b>孩子交换（这里是 5），' +
      '否则换完还是违反堆序。40 &gt; 5 → 交换。',
    s: HP([5, 40, 10, 20, 50, 30, 60], { 1: 'cur', 0: 'done' }, { op: '孩子 min(5,10)=5 → 交换', msg: '下沉到下标 1' }) },
  { text: '继续下沉：40 现在的孩子是 20 和 50，较小的是 20。40 &gt; 20 → 交换。',
    s: HP([5, 20, 10, 40, 50, 30, 60], { 3: 'cur', 1: 'done' }, { op: '孩子 min(20,50)=20 → 交换', msg: '下沉到下标 3' }) },
  { text: '40 在下标 3，它没有孩子了（2×3+1 = 7 ≥ 数组长度）→ 停止。堆序恢复。' +
      '下沉的步数也是树高，所以 pop 是 <b>O(log n)</b>。',
    s: HP([5, 20, 10, 40, 50, 30, 60], { 3: 'done' }, { op: 'pop 完成', msg: 'peek() 仍然是 O(1)' }) },
  { text: '为什么堆要用"完全二叉树 + 数组"而不是普通二叉树？因为完全二叉树天然没有空洞，' +
      '用数组一维存储既省掉所有指针，又让内存连续（缓存友好），还能 O(1) 定位任意父子。这是数据结构设计里非常漂亮的一手。',
    s: HP([5, 20, 10, 40, 50, 30, 60], {}, { op: '为什么这么设计', msg: '无指针、内存连续、O(1) 寻址' }) }
];

const B = [3, 9, 2, 1, 4, 5];
const stepsB = [
  { text: '建堆：给一个乱序数组 [3, 9, 2, 1, 4, 5]。它天生满足"完全二叉树"的形状，但不满足堆序。' +
      '暴力做法是依次 push n 次，那是 O(n log n)；有个更快的办法能到 O(n)。',
    s: HP(B, {}, { op: 'buildHeap', msg: '怎样最快地变成一个合法堆？' }) },
  { text: '关键观察：<b>叶子节点本身就是合法的堆</b>（它没有孩子，没有堆序可违反）。' +
      '所以只需要调整"非叶节点"。n = 6，最后一个非叶节点下标是 n/2 - 1 = 2。',
    s: HP(B, { 3: 'done', 4: 'done', 5: 'done' }, { op: '下标 3、4、5 是叶子，天然合法', msg: '从下标 2 开始往前处理' }) },
  { text: '处理下标 2（值 2）：孩子是下标 5 的 5。2 &lt; 5，已经满足堆序 → 不用动。' +
      '（如果违反了就下沉。）',
    s: HP(B, { 2: 'cur', 3: 'done', 4: 'done', 5: 'done' }, { op: '下标 2：2 ≤ 5，不动', msg: '继续往前' }) },
  { text: '处理下标 1（值 9）：孩子是下标 3 的 1 和下标 4 的 4。较小的是 1，9 &gt; 1 → 交换。' +
      '交换后 9 到了下标 3，它没有孩子了，停止。',
    s: HP([3, 1, 2, 9, 4, 5], { 1: 'cur', 3: 'done' }, { op: '下标 1：9 > min(1,4)=1 → 交换', msg: '下沉结束' }) },
  { text: '处理下标 0（值 3）：孩子是下标 1 的 1 和下标 2 的 2。较小的是 1，3 &gt; 1 → 交换。',
    s: HP([1, 3, 2, 9, 4, 5], { 0: 'cur', 1: 'done' }, { op: '下标 0：3 > min(1,2)=1 → 交换', msg: '3 沉到下标 1' }) },
  { text: '3 到了下标 1，它的孩子是下标 3 的 9 和下标 4 的 4。较小的是 4，3 &lt; 4 → 停止。' +
      '<b>建堆完成</b>：[1, 3, 2, 9, 4, 5]。',
    s: HP([1, 3, 2, 9, 4, 5], { 1: 'cur', 3: 'done', 4: 'done' }, { op: '3 ≤ min(9,4)=4 → 停', msg: '整棵树满足堆序' }) },
  { text: '为什么是 O(n) 而不是 O(n log n)？因为<b>越靠下的节点越多，但它们能下沉的距离越短</b>。' +
      '精确求和：Σ (每层节点数 × 该层最大下沉距离) = n/2×0 + n/4×1 + n/8×2 + … ≈ 2n = O(n)。这是个很经典的结论。',
    s: HP([1, 3, 2, 9, 4, 5], {}, { op: '复杂度', msg: '奇数层便宜、偶数层便宜 → 总和 O(n)' }) }
];

D.register({
  id: 'heap', title: '堆 / 优先队列', icon: '⛰️', group: '四、树与二叉树', order: 70,
  blurb: '用数组装完全二叉树，O(1) 取最值、O(log n) 插删',
  badge: 'O(log n)',
  keywords: 'heap 堆 优先队列 priority queue 上浮 下沉 sift 建堆 topk 堆排序',
  lead: '堆是用来"随时取最值"的结构。它不保证整体有序，只保证堆顶最值——这恰好是很多场景真正需要的。',
  build(doc) {
    const c1 = D.card({ title: '一句话讲清', icon: '💡', badge: 'Heap / PriorityQueue' });
    D.html(c1.querySelector('.body'),
      '<p>堆是一棵<b>完全二叉树</b>，并且每个父节点都 ≤ 它的两个孩子（小顶堆；大顶堆则 ≥）。' +
      '这两个约束合起来，保证了<b>堆顶就是全局最值</b>。</p>' +
      '<p>"完全二叉树"这个额外的结构约束，让堆可以<b>直接用数组存，一个指针都不需要</b>：' +
      '下标 <code class="inl">i</code> 的左孩子是 <code class="inl">2i+1</code>、右孩子 <code class="inl">2i+2</code>、' +

      D.mini([['O(1)', 'peek 看最值'], ['O(log n)', 'push 入堆'], ['O(log n)', 'pop 出堆'], ['O(n)', 'buildHeap 建堆']]) +
      D.note('note', '堆和 BST 的区别（很重要的直觉）',
        'BST 追求"<b>全局有序</b>"：中序遍历能拿到完整排序。堆只要求"<b>局部有序</b>"：父 ≤ 子即可。' +
        '约束越松，维护成本越低——所以 BST 插入是 O(log n) 但常数大、还要平衡，' +
        '堆插入只要沿着一条路径上浮，简单又快。' +

    const c2 = D.card({ title: '动画 ①：上浮与下沉', icon: '🎬', badge: '核心机制' });
    const b2 = c2.querySelector('.body');
    D.html(b2, '<p>上面是数组、下面是同一棵树的两种视角。注意观察：<b>每次只有一条路径上的元素在动</b>，' +

      title: '小顶堆 · push / pop',
      height: 470,
      steps: steps,

    doc.appendChild(c2);

    const c3 = D.card({ title: '动画 ②：O(n) 建堆', icon: '🏗️', badge: '常考' });

    D.html(b3, '<p>给定一个乱序数组，怎么最快变成堆？<b>从最后一个非叶节点开始，倒着对每个节点做一次下沉</b>。</p>');
    D.lab(b3, {

    const c4 = D.card({ title: '手写时的 5 个关键点', icon: '🔧', badge: '细节' });
    D.html(c4.querySelector('.body'),
      '<h3 class="sec">1. 上浮和下沉是"对称"的两件事</h3>' +
      '<p><b>上浮（sift up）</b>：只和<b>一个</b>父节点比，小了就换，用于 push。' +
      '<b>下沉（sift down）</b>：要和<b>两个孩子里较小的那个</b>比，用于 pop 和建堆。' +
      '为什么下沉必须挑更小的孩子？因为如果你和大的那个换了，换完之后它比另一个孩子大，还是违反堆序，得再换一次。</p>' +
      '<h3 class="sec">2. 边界：孩子下标越界</h3>' +
      '<p>下沉时必须先判断 <code class="inl">l &lt; n</code> / <code class="inl">r &lt; n</code>。' +
      '完全二叉树的叶子节点没有孩子，直接访问会越界。<b>这是堆代码最常见的崩溃点。</b></p>' +
      '<h3 class="sec">3. pop 的顺序不能颠倒</h3>' +
      '<p>正确顺序：<b>先记下堆顶 → 弹出末尾 → 把末尾放到堆顶 → 下沉</b>。' +
      '很多人写成"先弹出堆顶再补位"，结果数组中间出现空洞，完全二叉树的性质就没了。' +
      '注意只有当数组还非空时才需要补位，否则会把 undefined 写进去。</p>' +
      '<h3 class="sec">4. 大顶堆还是小顶堆，看题目要什么</h3>' +

      '<h3 class="sec">5. 建堆为什么是 O(n)</h3>' +

      '<b>而"逐个 push"是从上往下插，最底层每个节点都要浮 log n 层，所以是 O(n log n)。</b>' +

    doc.appendChild(c4);

    const c5 = D.card({ title: '堆的三大应用场景', icon: '🎯', badge: '识别信号' });

        ['Top-K 问题', '求"最大的 K 个"：维护大小为 K 的小顶堆，堆顶就是第 K 大', 'O(n log K)，比全排序 O(n log n) 快'],
        ['数据流中位数', '一个大顶堆放左半、一个小顶堆放右半，堆顶就是中位数', '每次插入 O(log n)'],
        ['堆排序', '建堆 + 反复 pop 堆顶', 'O(n log n)，原地（大顶堆版本）'],
        ['Dijkstra / A*', '每次从"未访问节点"里取距离最小的', 'O((V+E) log V)'],
        ['合并 K 个有序链表', 'K 个链表头放进小顶堆，每次取最小的', 'O(N log K)'],
      ]) +
      D.note('tip', '看到这些字眼就想堆',
        '"前 K 个"、"最……的"、"动态地取最值"、"优先处理"、"流式数据"。' +
        '反过来说，如果题目要求"全部有序输出"，那应该是排序而不是堆。'));
    doc.appendChild(c5);

    const c6 = D.card({ title: '分步实现 · C / C++ / Rust', icon: '⌨️', badge: '手写重点' });
    D.html(c6.querySelector('.body'),
      '<p>三种语言、同一套步骤。<b>点右上角切换语言，整页跟着一起换。</b>把每一步按顺序拼起来，就是一份能直接编译运行的完整程序。</p>' +
      '<p>这些代码刻意写得<b>朴素</b>：不用 template、不用智能指针、不用 STL 容器，就是最普通的 ' +
      '<code class="inl">class</code> / <code class="inl">struct</code> + 指针 + 循环，' +
      '和你在 Dev-C++ 里手写出来的样子一样 —— 每一行都能看懂，也都能自己敲出来。</p>' +
      '<p><b>关于文件组织：</b>平时是把类声明放 <code class="inl">.h</code>、实现放 <code class="inl">.cpp</code>；' +
      '这里为了能直接复制下来编译运行，把两部分放在同一个文件里了，工程里再拆开即可。</p>' +
      D.codeSteps('heap') +
      D.sources('heap') +
      D.note('tip', '自测方法', 'push 一堆随机数再用 pop 全部取出，输出的序列必须是<b>严格递增</b>的。' +
        '如果中间出现逆序，多半是 siftDown 里"挑更小的孩子"写错了，或者边界判断漏了。'));
    doc.appendChild(c6);

    const c7 = D.card({ title: '动手练', icon: '✎', badge: '白纸手写' });
    D.html(c7.querySelector('.body'),
      D.ex('合上页面，默写 <code class="inl">sift_down(i)</code>。写完对照上面<b>第 4 步</b>，自查三件事：' +
              '① 是不是先假设"当前位置最小" ② 是不是分别和左右孩子比了两次 ③ 循环结束条件是什么。' +
              '然后再想一遍：为什么必须和<b>更小的那个</b>孩子交换？') +
            D.ex('设计一个类，支持不断往数据流里加数字，并随时以 O(1) 返回当前中位数。<br>提示：大顶堆存较小的一半，小顶堆存较大的一半，保持两边数量差不超过 1。',
              D.answerFor('heap', 1)) +
            D.ex('实现<b>原地</b>堆排序（升序）。提示：先建大顶堆，然后把堆顶和未排序区间的末尾交换、size 减 1、再对堆顶下沉；重复 n-1 次。',
              D.answerFor('heap', 2)));
    doc.appendChild(c7);
  }
});
})();
