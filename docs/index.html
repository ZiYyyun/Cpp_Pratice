<script>
/* ==================== 11-graph.js ==================== */
/* ============================ 8. 图 ============================ */
(function () {
'use strict';
const D = window.DSV;

const POS = { A: [70, 90], B: [230, 40], C: [230, 165], D: [410, 90], E: [410, 205], F: [580, 130] };
const EDGES = [['A', 'B'], ['A', 'C'], ['B', 'D'], ['C', 'D'], ['C', 'E'], ['D', 'F'], ['E', 'F']];
const GW = 660, GH = 260, R = 21;

function makeSvg() {
  const svg = D.svgEl('svg', { class: 'viz', viewBox: '0 0 ' + GW + ' ' + GH, preserveAspectRatio: 'xMidYMid meet' });
  svg.style.cssText = 'width:100%;max-width:660px;height:auto';
  const gE = D.svgEl('g', { class: 'edges' }), gN = D.svgEl('g', { class: 'nodes' });
  svg.appendChild(gE); svg.appendChild(gN);
  EDGES.forEach(e => {
    const a = POS[e[0]], b = POS[e[1]];
    gE.appendChild(D.svgEl('line', { class: 'lnk', 'data-e': e[0] + e[1], x1: a[0], y1: a[1], x2: b[0], y2: b[1] }));
  });
  Object.keys(POS).forEach(v => {
    const g = D.svgEl('g', { class: 'nd', 'data-v': v, transform: 'translate(' + POS[v][0] + ',' + POS[v][1] + ')' });
    g.appendChild(D.svgEl('circle', { r: R }));
    g.appendChild(D.svgEl('text', {}, v));
    gN.appendChild(g);
  });
  return svg;
}
function renderGraph(svg, cls, treeEdges) {
  Object.keys(POS).forEach(v => {
    const g = svg.querySelector('[data-v="' + v + '"]');
    g.setAttribute('class', 'nd' + (cls[v] ? ' ' + cls[v] : ''));
  });
  EDGES.forEach(e => {
    const key = e[0] + e[1];
    const line = svg.querySelector('[data-e="' + key + '"]');
    const used = treeEdges && treeEdges[key];
    const hot = cls[e[0]] === 'cur' || cls[e[1]] === 'cur';
    line.setAttribute('class', 'lnk' + (used ? ' path' : (hot ? ' on' : '')));
  });
}

/* ---------- 动画数据 ---------- */
function GP(cls, o) { return Object.assign({ cls: Object.assign({}, cls), list: [], listName: '队列', order: [], msg: '', tree: {} }, o || {}); }

const stepsBFS = [
  { text: '先认识这张图：6 个顶点、7 条无向边。存储上用<b>邻接表</b>——每个顶点挂一个"邻居列表"，空间是 O(V+E)。' +
      '（另一种是邻接矩阵 V×V 的二维数组，判断两点是否相邻是 O(1)，但空间 O(V²)，只适合稠密图。）',
    s: GP({}, { listName: '队列', msg: 'adj: A→[B,C]  B→[A,D]  C→[A,D,E]  D→[B,C,F]  E→[C,F]  F→[D,E]' }) },
  { text: 'BFS（广度优先搜索）= "一层一层往外扩散"。它的实现只需要一个<b>队列</b>：把起点入队，然后不断"取出队头、把它的邻居入队"。' +
      '因为队列是先进先出，所以离起点近的节点一定先被处理。',
    s: GP({}, { listName: '队列', list: ['A'], msg: 'A 入队，标记为已发现' }) },
  { text: '取出队头 A，访问它（输出 A），然后把 A 的邻居里"还没发现过"的标记并入队：B、C。',
    s: GP({ A: 'cur', B: 'open', C: 'open' }, { list: ['B', 'C'], order: ['A'], tree: { 'AB': 1, 'AC': 1 }, msg: '访问 A → B、C 入队' }) },
  { text: '取出队头 B，访问。B 的邻居：A（已发现，跳过）、D（新）→ D 入队。' +
      '注意 A 被跳过了——这就是 visited 集合的作用，避免走回头路和无限循环。',
    s: GP({ A: 'done', B: 'cur', C: 'open', D: 'open' }, { list: ['C', 'D'], order: ['A', 'B'], tree: { 'AB': 1, 'AC': 1, 'BD': 1 }, msg: '访问 B → D 入队' }) },
  { text: '取出队头 C，访问。邻居 A、D 都已发现，E 是新节点 → E 入队。' +
      '此时队列里是 D、E，它们离 A 的距离都是 2。',
    s: GP({ A: 'done', B: 'done', C: 'cur', D: 'open', E: 'open' }, { list: ['D', 'E'], order: ['A', 'B', 'C'], tree: { 'AB': 1, 'AC': 1, 'BD': 1, 'CE': 1 }, msg: '访问 C → E 入队' }) },
  { text: '取出队头 D，访问。邻居 B、C 已发现，F 是新节点 → F 入队（距离 3）。',
    s: GP({ A: 'done', B: 'done', C: 'done', D: 'cur', E: 'open', F: 'open' }, { list: ['E', 'F'], order: ['A', 'B', 'C', 'D'], tree: { 'AB': 1, 'AC': 1, 'BD': 1, 'CE': 1, 'DF': 1 }, msg: '访问 D → F 入队' }) },
  { text: '取出队头 E，访问。邻居 C、F 都已发现 → 没有新节点入队。',
    s: GP({ A: 'done', B: 'done', C: 'done', D: 'done', E: 'cur', F: 'open' }, { list: ['F'], order: ['A', 'B', 'C', 'D', 'E'], tree: { 'AB': 1, 'AC': 1, 'BD': 1, 'CE': 1, 'DF': 1 }, msg: '访问 E，无新节点' }) },
  { text: '取出队头 F，访问。邻居 D、E 都已发现 → 队列空了，BFS 结束。',
    s: GP({ A: 'done', B: 'done', C: 'done', D: 'done', E: 'done', F: 'cur' }, { list: [], order: ['A', 'B', 'C', 'D', 'E', 'F'], tree: { 'AB': 1, 'AC': 1, 'BD': 1, 'CE': 1, 'DF': 1 }, msg: '访问 F，队列空，结束' }) },
  { text: '访问顺序：<b>A → B → C → D → E → F</b>。仔细看这个顺序：A 距离 0，B/C 距离 1，D/E 距离 2，F 距离 3 —— ' +
      '<b>BFS 的输出顺序就是"按到起点的距离从小到大"</b>。这就是"BFS 能求无权图最短路"的根本原因。',
    s: GP({ A: 'done', B: 'done', C: 'done', D: 'done', E: 'done', F: 'done' }, { list: [], order: ['A', 'B', 'C', 'D', 'E', 'F'], tree: { 'AB': 1, 'AC': 1, 'BD': 1, 'CE': 1, 'DF': 1 }, msg: 'A(0) B,C(1) D,E(2) F(3)' }) },
  { text: '一个必考的细节：<b>visited 必须在"入队的时候"标记，而不是"出队的时候"</b>。' +
      '如果等到出队才标记，同一个节点会沿着多条边被重复入队，队列规模可能爆炸。' +
      '（DFS 的迭代版则可以等到出栈时再标记，但那时要写好 continue。）',
    s: GP({ A: 'done', B: 'done', C: 'done', D: 'done', E: 'done', F: 'done' }, { list: [], order: ['A', 'B', 'C', 'D', 'E', 'F'], msg: 'BFS 时间复杂度 O(V + E)' }) }
];

const stepsDFS = [
  { text: 'DFS（深度优先搜索）的口诀：<b>一条路走到黑，走不动了再回头</b>。实现上就是递归：访问自己，然后对第一个没访问过的邻居递归下去。',
    s: GP({}, { listName: '递归栈', list: [], msg: '从 A 出发' }) },
  { text: '访问 A（输出 A），看它的第一个邻居 B，B 没访问过 → 递归进入 B。',
    s: GP({ A: 'cur', B: 'open' }, { list: ['A'], order: ['A'], tree: { 'AB': 1 }, msg: 'A 的第 1 个邻居 B，进入' }) },
  { text: '访问 B。B 的邻居依次是 A（已访问）、D（没访问）→ 进入 D。注意 B 不会去管"其他的路"，它只认第一个没走过的。',
    s: GP({ A: 'done', B: 'cur', D: 'open' }, { list: ['A', 'B'], order: ['A', 'B'], tree: { 'AB': 1, 'BD': 1 }, msg: 'B → D' }) },
  { text: '访问 D。邻居 B（已访问）、C（没访问）→ 进入 C。',
    s: GP({ A: 'done', B: 'done', D: 'cur', C: 'open' }, { list: ['A', 'B', 'D'], order: ['A', 'B', 'D'], tree: { 'AB': 1, 'BD': 1, 'CD': 1 }, msg: 'D → C' }) },
  { text: '访问 C。邻居 A、D 已访问，E 没访问 → 进入 E。',
    s: GP({ A: 'done', B: 'done', D: 'done', C: 'cur', E: 'open' }, { list: ['A', 'B', 'D', 'C'], order: ['A', 'B', 'D', 'C'], tree: { 'AB': 1, 'BD': 1, 'CD': 1, 'CE': 1 }, msg: 'C → E' }) },
  { text: '访问 E。邻居 C 已访问，F 没访问 → 进入 F。',
    s: GP({ A: 'done', B: 'done', D: 'done', C: 'done', E: 'cur', F: 'open' }, { list: ['A', 'B', 'D', 'C', 'E'], order: ['A', 'B', 'D', 'C', 'E'], tree: { 'AB': 1, 'BD': 1, 'CD': 1, 'CE': 1, 'EF': 1 }, msg: 'E → F' }) },
  { text: '访问 F。F 的邻居 D、E 都已经访问过了 → 无路可走，函数返回。' +
      '这一层返回后，E、C、D、B 的邻居也全都访问完了，于是一路返回到 A。',

<script>
/* ==================== 08-hash.js ==================== */
/* ============================ 5. 哈希表 ============================ */
(function () {
'use strict';
const D = window.DSV;

/* ---------- 动画数据 ---------- */
function E() { return [[], [], [], [], []]; }
function HT(m, buckets, o) {
  return Object.assign({ m: m, buckets: buckets.map(b => b.slice()), hlB: -1, hlK: null, op: '', msg: '', hash: '' }, o || {});
}
const steps = [
  { text: '哈希表的核心思想只有一句话：<b>用哈希函数 h(key) 把 key 直接算成数组下标</b>，这样存和取都不用查找，直接跳过去。这里桶数组长度 m = 5，哈希函数取最简单的 h(k) = k % 5。',
    s: HT(5, E(), { op: 'new HashTable(5)', hash: 'h(k) = k % 5', msg: '5 个桶，全空' }) },
  { text: 'put(12)：先算 h(12) = 12 % 5 = 2，然后直接写进 2 号桶。整个过程和表里已经有多少元素<b>无关</b>，所以是 O(1)。',
    s: HT(5, [[], [], [12], [], []], { op: 'put(12)', hash: 'h(12) = 12 % 5 = 2', hlB: 2, msg: '落到 2 号桶' }) },
  { text: 'put(7)：h(7) = 7 % 5 = 2 —— 又是 2 号桶！但那里已经被 12 占了。这就是<b>哈希冲突</b>。' +
      '冲突不是bug，是数学必然：key 有无穷多个，桶只有 5 个，根据鸽巢原理，冲突一定存在。',
    s: HT(5, [[], [], [12], [], []], { op: 'put(7) → 冲突！', hash: 'h(7) = 7 % 5 = 2', hlB: 2, msg: '两个不同的 key 算出了同一个下标' }) },
  { text: '解决冲突的第一种主流办法：<b>拉链法（Separate Chaining）</b>。每个桶里不是存一个元素，而是一条链表，冲突的元素全挂在这条链上。把 7 头插到 2 号桶的链上。',
    s: HT(5, [[], [], [7, 12], [], []], { op: 'bucket[2].unshift([7])', hash: '冲突 -> 挂到链上', hlB: 2, hlK: 7, msg: '同一个桶里的元素必须逐个比较 key' }) },
  { text: 'put(20)：h(20) = 20 % 5 = 0，0 号桶是空的，直接放。',
    s: HT(5, [[20], [], [7, 12], [], []], { op: 'put(20)', hash: 'h(20) = 20 % 5 = 0', hlB: 0, msg: '落到 0 号桶，没有冲突' }) },
  { text: 'put(17)：h(17) = 17 % 5 = 2，又撞到 2 号桶。头插进去。现在 2 号桶的链是 17 → 7 → 12。' +
      '注意：<b>链越长，查找越慢</b>——最坏情况所有 key 都撞到一个桶，退化成 O(n)。所以哈希函数要尽量均匀。',
    s: HT(5, [[20], [], [17, 7, 12], [], []], { op: 'put(17)', hash: 'h(17) = 17 % 5 = 2', hlB: 2, hlK: 17, msg: '链长变成 3' }) },
  { text: 'get(17)：算 h(17) = 2，走到 2 号桶，沿链逐个比较 key。第一个就是 17，命中。' +
      '如果链很长，这一步就要走很多次——所以哈希表是"<b>平均 O(1)，最坏 O(n)</b>"。',
    s: HT(5, [[20], [], [17, 7, 12], [], []], { op: 'get(17) → 命中', hash: 'h(17) = 2 → 扫描 2 号桶', hlB: 2, hlK: 17, msg: '比较 1 次就找到' }) },
  { text: 'get(99)：算 h(99) = 99 % 5 = 4，4 号桶是空的 —— 说明 key 不存在。' +
      '<b>注意这里为什么能直接判定"不存在"</b>：因为 put 的时候 99 一定会落到 4 号桶，既然 4 号桶空，那它必然没被存过。这是哈希表设计的关键不变量。',
    s: HT(5, [[20], [], [17, 7, 12], [], []], { op: 'get(99) → 未命中', hash: 'h(99) = 99 % 5 = 4', hlB: 4, msg: '空桶 -> 一定不存在，不用扫全表' }) },
  { text: '现在 size = 4，桶数 m = 5，<b>负载因子 = 4/5 = 0.8</b>。负载因子越高，链越长，性能越差。' +
      '所以哈希表会设一个阈值（常见 0.75），一旦超过就<b>扩容</b>。',
    s: HT(5, [[20], [], [17, 7, 12], [], []], { op: '检查负载因子', hash: 'load = size / m = 4 / 5 = 0.80 > 0.75', hlB: -1, msg: '触发扩容！' }) },
  { text: '扩容不是简单地把桶数改大——必须<b>把每个元素重新算一遍哈希</b>，因为 h(k) = k % m 里的 m 变了。' +
      '这个过程叫 <b>rehash</b>。选一个更大的质数（5 → 11）能进一步减少冲突。',
    s: HT(11, [[], [], [], [], [], [], [], [], [], [], []], { op: 'new Array(11)', hash: 'rehash: 12%11, 7%11, 20%11, 17%11', msg: '新表 11 个桶，准备逐个搬迁' }) },
  { text: '逐个搬迁：12 → 12 % 11 = 1；7 → 7 % 11 = 7；20 → 20 % 11 = 9；17 → 17 % 11 = 6。' +
      '注意它们的新位置和旧位置<b>毫无关系</b>——这就是"哈希表的遍历顺序是无序的"的根本原因。',
    s: HT(11, [[], [12], [], [], [], [], [17], [7], [], [20], []], { op: 'rehash 完成', hash: '每个 key 都换了位置', hlB: -1, msg: 'size = 4，负载降到 4/11 ≈ 0.36' }) },
  { text: 'remove(7)：算 h(7) = 7 % 11 = 7，走到 7 号桶，把 7 从链上摘掉。扩容之后，原来挤在一起的 key 被拆散了，链变短，查找更快。',
    s: HT(11, [[], [12], [], [], [], [], [17], [], [], [20], []], { op: 'remove(7) → true', hash: 'h(7) = 7 % 11 = 7', hlB: 7, msg: '链上摘除，size = 3' }) },
  { text: '总结：哈希表用"空间换时间"，把 O(n) 的查找变成平均 O(1)。代价是 ① 内存用得多 ② 无序 ③ 最坏情况仍可能 O(n) ④ 扩容那一次是 O(n)（但均摊下来仍是 O(1)）。',
    s: HT(11, [[], [12], [], [], [], [], [17], [], [], [20], []], { op: '最终状态', hash: '平均 O(1) / 最坏 O(n)', hlB: -1, msg: 'size = 3, m = 11' }) }
];

D.register({
  id: 'hash', title: '哈希表', icon: '🗂️', group: '六、查找', order: 86,
  blurb: '用函数把 key 变成下标，平均 O(1) 查找；重点在冲突处理',
  badge: '平均 O(1)',
  keywords: 'hash 哈希 散列 map dict 字典 冲突 拉链 开放寻址 rehash 负载因子',
  lead: '哈希表是工程中使用频率最高的结构。它的全部难点就两个：哈希函数怎么设计、冲突了怎么办。',
  build(doc) {
    const c1 = D.card({ title: '一句话讲清', icon: '💡', badge: 'Hash Table / Map' });
    D.html(c1.querySelector('.body'),
      '<p>普通数组找东西要靠"逐个比对"，O(n)。哈希表的想法很暴力：' +
      '<b>我干脆用一个函数把 key 直接算成数组下标，一步跳过去</b>。' +
      '比如存电话号码，用"后 4 位"当下标，那查的时候算一下后 4 位就到了。</p>' +
      '<p>三个必备零件：<b>桶数组</b>（一块连续空间，存数据的地方）、' +
      '<b>哈希函数</b>（key → 下标，要求快且均匀）、' +
      '<b>冲突处理</b>（不同 key 算出同一下标时怎么办）。</p>' +
      D.mini([['平均 O(1)', 'put / get / remove'], ['最坏 O(n)', '所有 key 撞进一个桶'], ['O(n)', '空间（桶 + 元素）'], ['0.75', '常见扩容阈值']]) +
      D.note('note', '哈希表的两大不变量',
        '① <b>同一个 key，每次算出的下标必定相同</b>（否则就找不回来了）；' +
        '② <b>没找到 key 时只能去它该在的那个桶里找</b>——桶是空的就一定不存在。' +
        '理解了第 ② 条，你就明白为什么哈希表能 O(1) 判"不存在"。'));

    const c2 = D.card({ title: '动画：从哈希到冲突，再到扩容', icon: '🎬', badge: '完整流程' });
    const b2 = c2.querySelector('.body');
    D.html(b2, '<p>这个动画演示了哈希表的一生：插入 → 冲突 → 拉链 → 查找 → 负载过高 → rehash。</p>');
    D.lab(b2, {
      title: '哈希表 · 拉链法与 rehash',
      height: 440,
      steps: steps,
      setup(view) {
        const inner = D.el('div');
        inner.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:12px;width:100%';
        inner.innerHTML =
          '<div class="row" style="gap:10px;flex-wrap:wrap;justify-content:center">' +
          '<span class="chip warm" data-k="op">—</span>' +
          '<span class="chip" data-k="hash" style="max-width:520px;white-space:normal">h(k) = k % m</span>' +
          '</div>' +
          '<div data-k="rows" style="display:flex;flex-direction:column;gap:4px;align-items:flex-start"></div>' +
          '<div data-k="msg" style="font-family:var(--mono);font-size:12.5px;color:#93a6c8;text-align:center"></div>';
        view.appendChild(inner);
        return { rows: inner.querySelector('[data-k="rows"]'), op: inner.querySelector('[data-k="op"]'), hash: inner.querySelector('[data-k="hash"]'), msg: inner.querySelector('[data-k="msg"]') };
      },
      draw(c, step) {
        const s = step.s;
        const rows = [];
        for (let i = 0; i < s.m; i++) rows.push(i);
        D.reconcile(c.rows, rows, i => i,
          () => {
            const r = D.el('div', 'row');
            r.style.cssText = 'gap:6px;min-height:26px;align-items:center';
            const idx = D.el('span', 'chip', '0');
            idx.style.cssText = 'min-width:26px;padding:2px 6px;font-size:11px;justify-content:center;font-family:var(--mono)';
            r.appendChild(idx);
            const arrow = D.el('span', 'arrow', '→');
            r.appendChild(arrow);
            const chain = D.el('span', 'row');
            chain.style.cssText = 'gap:6px;align-items:center';
            r.appendChild(chain);
            const nul = D.el('span', '', '∅');
            nul.style.cssText = 'color:#3d5075;font-family:var(--mono)';
            r.appendChild(nul);
            r.__parts = { idx: idx, chain: chain, arrow: arrow };
            return r;
          },
          (row, i) => {
            const p = row.__parts;
            p.idx.textContent = i;
            p.idx.className = 'chip' + (s.hlB === i ? ' warm' : '');
            p.arrow.className = 'arrow' + (s.hlB === i ? ' on' : '');
            const list = s.buckets[i];
            p.chain.innerHTML = list.map((k, j) =>
              (j > 0 ? '<span class="arrow">→</span>' : '') +
              '<span class="node' + (s.hlK === k && s.hlB === i ? ' hl' : '') + '" style="font-size:12px">' +
              '<span class="v" style="padding:3px 10px;min-width:28px">' + k + '</span></span>'
            ).join('');
          });
        c.op.textContent = s.op;
        c.hash.textContent = s.hash;
        c.msg.textContent = s.msg;
      }
    });
    doc.appendChild(c2);

    const c3 = D.card({ title: '冲突处理的两种流派', icon: '⚔️', badge: '面试常问' });
    D.html(c3.querySelector('.body'),
      D.table(['方案', '做法', '优点', '缺点', '代表'], [
        ['<b>拉链法</b><br>Separate Chaining', '每个桶挂一条链表，冲突就挂上去', '实现简单；删除容易；负载因子可以 &gt; 1；不怕聚集',
          '有指针开销；缓存不友好（链表节点分散）', 'Java 7 HashMap、Redis dict、本文示例'],
        ['<b>开放寻址 · 线性探测</b><br>Open Addressing', '桶被占了就往后找下一个空位', '全是连续内存，缓存友好；不用指针',
          '删除麻烦（要墓碑标记）；容易"聚集"，越挤越慢；负载因子必须 &lt; 1', 'Rust 的 HashMap（hashbrown / SwissTable）、Go 的 map'],
        ['<b>开放寻址 · 二次探测</b>', '冲突后按 +1²、+2²、+3² 跳着找', '缓解聚集', '探测序列可能覆盖不到所有桶', '—'],
        ['<b>再哈希 / 双散列</b>', '用第二个哈希函数决定步长', '分布最均匀', '计算量翻倍', '—'],
      ]) +
      D.note('tip', '一句话选型', '面试手写就用<b>拉链法</b>：逻辑清晰、删除简单、代码短。' +
        '真实实现常用开放寻址（Rust 的 HashMap、Go 的 map），因为它对 CPU 缓存更友好、常数更小。'));
    doc.appendChild(c3);

    const c4 = D.card({ title: '哈希函数怎么写才算"好"', icon: '🧪', badge: '关键细节' });
    D.html(c4.querySelector('.body'),
      '<h3 class="sec">三个要求</h3>' +
      '<ol><li><b>快</b>：每次 put/get 都要算一次，不能太重。</li>' +
      '<li><b>结果稳定</b>：同一个 key 每次必须算出同一个值。所以不能用随机数、不能用当前时间。</li>' +
      '<li><b>分布均匀</b>：不同 key 要尽量散到不同桶，否则链表退化成 O(n)。</li></ol>' +
      '<h3 class="sec">常见技巧</h3>' +
      '<p><b>取模用质数</b>：<code class="inl">key % m</code> 里的 m 取质数（如 31、101、1009）能让分布更均匀；' +
      '如果 m 是 2 的幂，低位重复的 key 会大量撞车。</p>' +
      '<p><b>字符串哈希</b>：经典写法是 <code class="inl">h = h * 31 + ch</code> 一路滚下去（31 是经验质数），' +
      '这个套路叫"滚动哈希"，还能用来做子串匹配（Rabin-Karp）。</p>' +
      '<p><b>负数取模一定要小心</b>：在 C 和 C++ 里 <code class="inl">-3 % 5 == -3</code>（结果符号跟着被除数走），Rust 也一样。' +
      '所以算桶下标之前必须把它掰正：转成无符号再取模，或者 <code class="inl">&amp; 0x7FFFFFFF</code>。' +
      '否则拿到负下标就是一次数组越界 —— 在 C 里这是未定义行为。</p>' +
      '<h3 class="sec">几条不在课本上但很重要的性质</h3>' +
      '<ul>' +
      '<li><b>无序</b>：不能指望遍历时按插入顺序输出。想同时有哈希的 O(1) 和链表的顺序，就得额外维护一条顺序链（Java 的 LinkedHashMap 就是这么做的）。</li>' +
      '<li><b>key 必须可哈希</b>：C++ 的 <code class="inl">std::unordered_map</code> 要求 key 满足 Hash 与 Equal 两个概念；' +
      'Rust 要求 <code class="inl">K: Hash + Eq</code>，而且 <code class="inl">Hash</code> 只对 <code class="inl">&amp;self</code> 实现。' +
      '归根结底是因为哈希要求 key 不可变。</li>' +
      '<li><b>扩容那一次是 O(n)</b>：所有元素要重算位置。但和动态数组一样，均摊到每次操作还是 O(1)。</li>' +
      '<li><b>哈希表怕攻击</b>：如果能预测你的哈希函数，攻击者可以构造大量同桶的 key，把 O(1) 拖成 O(n)——这叫哈希碰撞攻击，' +
      '所以生产环境的哈希函数常加随机种子。</li>' +
      '</ul>');
    doc.appendChild(c4);

    const c5 = D.card({ title: '分步实现 · C / C++ / Rust', icon: '⌨️', badge: '手写重点' });
    D.html(c5.querySelector('.body'),
      '<p>三种语言、同一套步骤。<b>点右上角切换语言，整页跟着一起换。</b>把每一步按顺序拼起来，就是一份能直接编译运行的完整程序。</p>' +
      '<p>这些代码刻意写得<b>朴素</b>：不用 template、不用智能指针、不用 STL 容器，就是最普通的 ' +
      '<code class="inl">class</code> / <code class="inl">struct</code> + 指针 + 循环，' +
      '和你在 Dev-C++ 里手写出来的样子一样 —— 每一行都能看懂，也都能自己敲出来。</p>' +
      '<p><b>关于文件组织：</b>平时是把类声明放 <code class="inl">.h</code>、实现放 <code class="inl">.cpp</code>；' +
      '这里为了能直接复制下来编译运行，把两部分放在同一个文件里了，工程里再拆开即可。</p>' +
      D.codeSteps('hash') +
      D.sources('hash') +
      D.note('warn', '手写时最容易错的三个地方',
        '① <b>put 的"更新 vs 插入"</b>：先遍历桶找同 key，找到就改 value，找不到才插入——漏了这步会出现重复 key。' +
        '② <b>resize 时重新 put</b>：必须重新计算下标，直接把旧桶复制过去是大错。' +
        '③ <b>resize 里对 size 的处理</b>：如果 put 里会 size++，resize 前要先把 size 归零，否则数字会翻倍。'));
    doc.appendChild(c5);

    const c6 = D.card({ title: '动手练', icon: '✎', badge: '白纸手写' });
    D.html(c6.querySelector('.body'),
      D.ex('合上页面，默写拉链法哈希表：桶数组 + 链表 + 负载因子扩容。写完对照上面<b>第 3~6 步</b>，确认三件事：' +
              '① put 里"已存在就更新、不存在才插入" ② rehash 时每个 key 都<b>重新计算下标</b>（不是把整条桶搬过去）③ 扩容前后 size 不变。') +
            D.ex('手写一个字符串哈希函数，把任意字符串压成 32 位无符号整数。要求同一个字符串每次得到同一个值，且分布尽量均匀。',
              D.answerFor('hash', 1)) +
            D.ex('哈希表的 key 为什么必须"不可变"？如果用一个能被修改的对象当 key 会发生什么？<code class="inl">std::unordered_map</code> 和 Rust 的 <code class="inl">HashMap</code> 分别对 key 提了什么要求？',
              '<p>哈希表的全部正确性都建立在一个不变量上：<b>同一个 key，每次算出的哈希值必须相同</b>。</p>' +
              '<p>如果 key 存进去之后被改了，它的哈希值就变了 —— 再去查它时会被导航到<b>错误的桶</b>，' +
              '于是既查不到、也删不掉，那条记录变成永远回收不了的"幽灵数据"。</p>' +
              '<p>所以：<b>std::unordered_map</b> 要求 key 满足 <code class="inl">Hash</code> 与 <code class="inl">Equal</code> 两个概念，' +
              '并且规定必须能用 <code class="inl">const K</code> 求出哈希 —— 实务上就是别拿会被修改的对象当 key；' +
              '<b>Rust 的 HashMap</b> 更硬：要求 <code class="inl">K: Hash + Eq</code>，而 <code class="inl">Hash</code> 只对 <code class="inl">&self</code> 实现，' +
              '配合所有权系统基本堵死了"边用边改"。这也是 <code class="inl">String</code> 能当 key、而可变引用不能的原因。</p>' +
              '<p>还有一条铁律：<b>两个对象相等，则哈希值必须相等</b>；反之哈希值相等，对象不一定相等（这就是冲突）。' +
              '在 C++ 里自己写 <code class="inl">operator==</code> 和 <code class="inl">std::hash</code> 特化时，必须同时满足这两条。</p>'));
    doc.appendChild(c6);
  }
});
})();

</script>

<script>
/* ==================== 12-sort.js ==================== */
/* ============================ 9. 排序（附赠） ============================ */
(function () {
'use strict';
const D = window.DSV;

/* ---------- 柱子渲染 ---------- */
function makeBars(view, arr) {
  const box = D.el('div');
  box.style.cssText = 'position:relative;height:180px;width:100%;max-width:560px;margin-top:22px';
  view.appendChild(box);
  let max = 1;
  arr.forEach(v => { if (v > max) max = v; });
  return { box: box, max: max };
}
function drawBars(ctx, items, o) {
  const o2 = o || {};
  D.reconcile(ctx.box, items, it => it.id,
    () => { const b = D.el('div', 'bar'); b.appendChild(D.el('span')); return b; },
    (node, it) => {
      node.style.cssText = 'position:absolute;bottom:0;width:34px;transition:left .35s cubic-bezier(.4,1.2,.4,1),height .3s,background .2s,box-shadow .2s;' +
        'left:' + (it.pos * 46 + 6) + 'px;height:' + (it.v / ctx.max * 125 + 12) + 'px;' +
        (o2.sorted && o2.sorted[it.pos] ? 'background:linear-gradient(180deg,#7bf0bd,#3ddc97);'
          : o2.pivot === it.pos ? 'background:linear-gradient(180deg,#c4b5fd,#8b7cf6);'
          : (o2.hl && o2.hl.indexOf(it.pos) >= 0) ? 'background:linear-gradient(180deg,#ffe08a,#ffb454);box-shadow:0 0 18px rgba(255,180,84,.5);'
          : 'background:linear-gradient(180deg,#5aa9ff,#2c4270);');
      node.querySelector('span').textContent = it.v;
    });
}

/* ---------- 冒泡 ---------- */
function A(arr, o) { return Object.assign({ arr: arr.slice(), hl: [], sorted: {}, op: '', msg: '' }, o || {}); }
const V0 = [5, 1, 4, 2, 8];
const stepsB = [
  { text: '冒泡排序的思路最朴素：<b>每一轮从头到尾比较相邻两个数，左边比右边大就交换</b>。这样一轮扫下来，最大的元素一定会被"推"到最右边。',
    s: A(V0, { op: '开始第 1 轮', msg: '数组 [5, 1, 4, 2, 8]' }) },
  { text: '第 1 轮 · 比较第 1 对：5 &gt; 1 → 交换。',
    s: A([1, 5, 4, 2, 8], { hl: [0, 1], op: '5 > 1 → 交换', msg: '比较次数 1' }) },
  { text: '继续：5 &gt; 4 → 交换。可以看到 5 在一步步往右"冒"。',
    s: A([1, 4, 5, 2, 8], { hl: [1, 2], op: '5 > 4 → 交换', msg: '比较次数 2' }) },
  { text: '继续：5 &gt; 2 → 交换。',
    s: A([1, 4, 2, 5, 8], { hl: [2, 3], op: '5 > 2 → 交换', msg: '比较次数 3' }) },
  { text: '5 &lt; 8 → 不交换。第 1 轮结束，<b>8 一定已经在最终位置上了</b>（因为它是最大的）。所以下一轮只需要扫到下标 3 为止。',
    s: A([1, 4, 2, 5, 8], { hl: [3, 4], sorted: { 4: 1 }, op: '5 < 8 → 不换', msg: '第 1 轮结束，8 就位' }) },
  { text: '第 2 轮：只比较前 4 个。<b>1 和 4 不换</b>；<b>4 和 2 交换</b> → [1,2,4,5]；<b>4 和 5 不换</b>。5 就位。',
    s: A([1, 2, 4, 5, 8], { hl: [1, 2], sorted: { 3: 1, 4: 1 }, op: '4 > 2 → 交换', msg: '第 2 轮结束，5 就位' }) },
  { text: '第 3 轮：比较 1 和 2（不换）、2 和 4（不换）。<b>整轮一次交换都没有发生</b> —— 这说明数组已经有序了，可以直接 break 提前结束。这是个很实用的优化。',
    s: A([1, 2, 4, 5, 8], { hl: [0, 1], sorted: { 2: 1, 3: 1, 4: 1 }, op: '整轮无交换 → 提前结束', msg: '最优情况 O(n)' }) },
  { text: '完成。冒泡的时间复杂度是 O(n²)（两层循环），实际工程里几乎不用它——但它是理解"比较排序"最好的入口，也是考察你是否会加"提前退出"优化的经典题。',
    s: A([1, 2, 4, 5, 8], { sorted: { 0: 1, 1: 1, 2: 1, 3: 1, 4: 1 }, op: '排序完成', msg: 'O(n²) / 稳定 / 原地' }) }
];

/* ---------- 快排 partition ---------- */
const V1 = [7, 3, 8, 2, 9, 4, 6];
const stepsQ = [
  { text: '快速排序的核心只有一件事：<b>分区（partition）</b>。选定一个"基准"（pivot），把数组分成"比它小的"和"比它大的"两半，' +
      '基准归位后，左右两半各自递归。这里取最后一个元素 6 作为基准。',
    s: A(V1, { pivot: 6, op: 'pivot = arr[hi] = 6', msg: 'lo = 0, hi = 6, i = 0' }) },
  { text: '用两个指针：<b>j 从左往右扫描</b>，<b>i 指向"小于区的下一个空位"</b>。j 扫到比基准小的就丢进小于区（和 i 交换），然后 i 前进。' +
      '现在 j = 0，7 &gt; 6，不进小于区。',
    s: A(V1, { pivot: 6, hl: [0], op: 'j=0: 7 >= 6，跳过', msg: 'i = 0' }) },
  { text: 'j = 1：3 &lt; 6 → 交换 arr[i] 和 arr[j]（i = 0, j = 1），i 变成 1。3 进入了小于区。',
    s: A([3, 7, 8, 2, 9, 4, 6], { pivot: 6, hl: [0, 1], op: 'j=1: 3 < 6 → swap(0,1)', msg: 'i = 1' }) },
  { text: 'j = 2：8 &gt; 6 → 跳过。j = 3：2 &lt; 6 → 交换 arr[1] 和 arr[3]，i 变成 2。',
    s: A([3, 2, 8, 7, 9, 4, 6], { pivot: 6, hl: [1, 3], op: 'j=3: 2 < 6 → swap(1,3)', msg: 'i = 2' }) },
  { text: 'j = 4：9 &gt; 6 → 跳过。j = 5：4 &lt; 6 → 交换 arr[2] 和 arr[5]，i 变成 3。' +
      '扫描结束（j 走到 hi 之前停下来）。',
    s: A([3, 2, 4, 7, 9, 8, 6], { pivot: 6, hl: [2, 5], op: 'j=5: 4 < 6 → swap(2,5)', msg: 'i = 3，扫描结束' }) },
  { text: '最后一步：把基准换到 i 的位置。现在 <b>下标 3 左边的全都 &lt; 6，右边的全都 &gt; 6</b>，基准 6 已经站在它最终该在的地方了。' +
      '注意：分区结束后基准的位置就永久确定了，后面再也不用动它。',
    s: A([3, 2, 4, 6, 9, 8, 7], { pivot: 3, sorted: { 3: 1 }, op: 'swap(i, hi) → 基准归位', msg: 'partition 返回 3' }) },
  { text: '接着对左半 [3,2,4] 和右半 [9,8,7] 各自递归做同样的事，直到区间里只剩 0 或 1 个元素（天然有序）。' +
      '平均情况每次把区间对半分，递归深度 log n，每层总共比较 n 次 → <b>O(n log n)</b>。',
    s: A([3, 2, 4, 6, 9, 8, 7], { pivot: 3, sorted: { 3: 1 }, hl: [0, 1, 2], op: '递归左半 [3,2,4]', msg: '平均 O(n log n)' }) },
  { text: '快排最坏情况是 O(n²)：如果每次都取到最大/最小值做基准（比如对<b>已经有序</b>的数组固定取末尾元素），' +
      '分区会变成 1 和 n-1，递归退化成链表。工业界的解法是<b>随机选基准</b>，或者用三数取中。',
    s: A([3, 2, 4, 6, 9, 8, 7], { pivot: 6, sorted: { 3: 1 }, bad: undefined, hl: [4, 5, 6], op: '有序输入 + 固定基准 = O(n²)', msg: '所以要随机化基准' }) },
  { text: '总结：快排<b>原地排序</b>（额外空间 O(log n) 递归栈）、常数最小、实际最快；代价是<b>不稳定</b>、最坏 O(n²)。' +

/* ---------- 归并 ---------- */
const V2 = [8, 3, 6, 1];
const stepsM = [

      '递归的终点是"只剩一个元素"——单个元素天然有序，不需要排。',

  { text: '第一步：从中间切开 → [8,3] 和 [6,1]。',

  { text: '继续切：[8,3] → [8] 和 [3]；[6,1] → [6] 和 [1]。现在全都是长度 1 的数组，递归到底了。',

  { text: '合并 [8] 和 [3]：比较两个头，3 &lt; 8 → 先取 3，再取 8 → [3, 8]。' +

    s: A([3, 8, 6, 1], { hl: [0, 1], op: 'merge([8],[3]) → [3,8]', msg: '取 3，再取 8' }) },
  { text: '合并 [6] 和 [1]：1 &lt; 6 → 先取 1，再取 6 → [1, 6]。',

  { text: '最后合并两个长度为 2 的有序数组 [3,8] 和 [1,6]。左边指针指 3，右边指针指 1。',
    s: A([3, 8, 1, 6], { hl: [0, 2], op: 'merge([3,8],[1,6])', msg: '比较 3 和 1' }) },
  { text: '1 &lt; 3 → 取 1。结果 [1]。右边指针移到 6。',
    s: A([1, 3, 8, 6], { hl: [0, 1], op: '取 1', msg: '结果 [1]' }) },
  { text: '比较 3 和 6：3 &lt; 6 → 取 3。结果 [1, 3]。',
    s: A([1, 3, 8, 6], { hl: [1, 3], op: '取 3', msg: '结果 [1, 3]' }) },
  { text: '比较 8 和 6：6 &lt; 8 → 取 6。结果 [1, 3, 6]。',
    s: A([1, 3, 6, 8], { hl: [2, 3], op: '取 6', msg: '结果 [1, 3, 6]' }) },

      '"剩下的整段直接拼接"这一步是归并的收尾，不能漏。',
    s: A([1, 3, 6, 8], { sorted: { 0: 1, 1: 1, 2: 1, 3: 1 }, op: '拼接剩余 → [1,3,6,8]', msg: '排序完成' }) },
  { text: '复杂度：每次合并要扫过所有元素 O(n)，一共分 log n 层，所以是 <b>O(n log n)</b>，而且最好、最坏、平均都一样。' +
      '代价是需要一个 O(n) 的临时数组。它是<b>稳定</b>的（合并时相等取左边）。',
    s: A([1, 3, 6, 8], { sorted: { 0: 1, 1: 1, 2: 1, 3: 1 }, op: 'O(n log n) 稳定', msg: '空间 O(n)' }) }

function mkLab(host, title, steps, arr) {
  D.lab(host, {
    title: title,
    height: 300,
    steps: steps,
    setup(view) {
      const wrap = D.el('div');
      wrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:8px;width:100%';
      wrap.innerHTML = '<div class="row" style="gap:10px;flex-wrap:wrap;justify-content:center">' +
        '<span class="chip warm" data-k="op">—</span><span class="chip" data-k="msg">—</span></div>';
      view.appendChild(wrap);
      const c = makeBars(wrap, arr);
      c.op = wrap.querySelector('[data-k="op"]');
      c.msg = wrap.querySelector('[data-k="msg"]');
      return c;
    },
    draw(c, step) {
      const s = step.s;
      const items = s.arr.map((v, i) => ({ id: 'v' + v + '_' + s.arr.slice(0, i).filter(x => x === v).length, v: v, pos: i }));
      drawBars(c, items, { hl: s.hl, sorted: s.sorted, pivot: s.pivot });
      c.op.textContent = s.op;
      c.msg.textContent = s.msg;
    }
  });
}
