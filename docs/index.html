0, 7, 4, 2 };\n    const int expected[] = { -3, 0, 1, 2, 2, 4, 5, 5, 6, 7, 8, 9 };\n    const size_t n = sizeof base / sizeof base[0];\n\n    printf(\"原始数组:\");\n    for (size_t i = 0; i < n; ++i) {\n        printf(\" %d\", base[i]);\n    }\n    printf(\"\\n\");\n\n    run_and_check(\"bubble_sort\", bubble_sort, base, expected, n);\n    run_and_check(\"insertion_sort\", insertion_sort, base, expected, n);\n    run_and_check(\"merge_sort\", merge_sort, base, expected, n);\n    run_and_check(\"quick_sort\", quick_sort, base, expected, n);\n\n    printf(\"四种排序结果完全一致且升序。\\n\");\n    return 0;\n}"}]},"cpp":{"file":"sort.cpp","steps":[{"title":"冒泡排序 bubble_sort","note":"相邻比较交换，一轮无交换则提前结束","code":"#include <algorithm>\n#include <cstddef>\n#include <cstdlib>\n#include <iostream>\n#include <utility>\n#include <vector>\n\ntemplate <typename T>\nvoid bubble_sort(std::vector<T>& a)\n{\n    for (std::size_t end = a.size(); end > 1; --end) {\n        bool swapped = false;\n        for (std::size_t i = 1; i < end; ++i) {\n            if (a[i - 1] > a[i]) {\n                std::swap(a[i - 1], a[i]);\n                swapped = true;\n            }\n        }\n        if (!swapped) {\n            break;\n        }\n    }\n}"},{"title":"插入排序 insertion_sort","note":"把 a[i] 插入前面已经有序的区间","code":"template <typename T>\nvoid insertion_sort(std::vector<T>& a)\n{\n    for (std::size_t i = 1; i < a.size(); ++i) {\n        T key = std::move(a[i]);\n        std::size_t j = i;\n        while (j > 0 && a[j - 1] > key) {\n            a[j] = std::move(a[j - 1]);\n            --j;\n        }\n        a[j] = std::move(key);\n    }\n}"},{"title":"归并排序 merge_sort","note":"辅助 vector 作临时数组，稳定分治合并","code":"template <typename T>\nstatic void merge(std::vector<T>& a, std::vector<T>& tmp,\n                  std::size_t lo, std::size_t mid, std::size_t hi)\n{\n    std::size_t i = lo;\n    std::size_t j = mid;\n    std::size_t k = lo;\n    while (i < mid && j < hi) {\n        if (a[j] < a[i]) {\n            tmp[k++] = std::move(a[j++]);\n        } else {\n            tmp[k++] = std::move(a[i++]);\n        }\n    }\n    while (i < mid) {\n        tmp[k++] = std::move(a[i++]);\n    }\n    while (j < hi) {\n        tmp[k++] = std::move(a[j++]);\n    }\n    for (std::size_t t = lo; t < hi; ++t) {\n        a[t] = std::move(tmp[t]);\n    }\n}\n\ntemplate <typename T>\nstatic void merge_sort_rec(std::vector<T>& a, std::vector<T>& tmp,\n                           std::size_t lo, std::size_t hi)\n{\n    if (hi - lo < 2) {\n        return;\n    }\n    const std::size_t mid = lo + (hi - lo) / 2;\n    merge_sort_rec(a, tmp, lo, mid);\n    merge_sort_rec(a, tmp, mid, hi);\n    merge(a, tmp, lo, mid, hi);\n}\n\ntemplate <typename T>\nvoid merge_sort(std::vector<T>& a)\n{\n    if (a.size() < 2) {\n        return;\n    }\n    std::vector<T> tmp(a.size());\n    merge_sort_rec(a, tmp, 0, a.size());\n}"},{"title":"快速排序 quick_sort（Lomuto 分区）","note":"固定末尾主元保证确定性；最坏 O(n^2)，三数取中或随机主元可改善","code":"template <typename T>\nstatic std::size_t lomuto_partition(std::vector<T>& a, std::size_t lo, std::size_t hi)\n{\n    const T pivot = a[hi];\n    std::size_t i = lo;\n    for (std::size_t j = lo; j < hi; ++j) {\n        if (a[j] < pivot) {\n            std::swap(a[i], a[j]);\n            ++i;\n        }\n    }\n    std::swap(a[i], a[hi]);\n    return i;\n}\n\ntemplate <typename T>\nstatic void quick_sort_range(std::vector<T>& a, std::size_t lo, std::size_t hi)\n{\n    while (hi - lo > 1) {\n        const std::size_t p = lomuto_partition(a, lo, hi - 1);\n        if (p - lo < hi - (p + 1)) {\n            quick_sort_range(a, lo, p);\n            lo = p + 1;\n        } else {\n            quick_sort_range(a, p + 1, hi);\n            hi = p;\n        }\n    }\n}\n\ntemplate <typename T>\nvoid quick_sort(std::vector<T>& a)\n{\n    if (a.size() > 1) {\n        quick_sort_range(a, 0, a.size());\n    }\n}"},{"title":"main：跑一遍","note":"同一组数据跑四种排序，与 std","code":"static void print_array(const char *tag, const std::vector<int>& a)\n{\n    std::cout << tag << ':';\n    for (const int v : a) {\n        std::cout << ' ' << v;\n    }\n    std::cout << '\\n';\n}\n\nint main()\n{\n    const std::vector<int> base{5, 2, 9, 1, 5, 6, -3, 8, 0, 7, 4, 2};\n    std::vector<int> expected = base;\n    std::sort(expected.begin(), expected.end());\n\n    print_array(\"原始数组\", base);\n\n    const auto run_and_check = [&expected, &base](const char *name, auto sorter) {\n        std::vector<int> a = base;\n        sorter(a);\n        print_array(name, a);\n        if (!std::is_sorted(a.begin(), a.end()) || a != expected) {\n            std::cout << \"  [失败] \" << name << \" 结果不正确\\n\";\n            std::exit(EXIT_FAILURE);\n        }\n        std::cout << \"  \" << name << \" 结果正确\\n\";\n    };\n\n    run_and_check(\"bubble_sort\", [](std::vector<int>& a) { bubble_sort(a); });\n    run_and_check(\"insertion_sort\", [](std::vector<int>& a) { insertion_sort(a); });\n    run_and_check(\"merge_sort\", [](std::vector<int>& a) { merge_sort(a); });\n    run_and_check(\"quick_sort\", [](std::vector<int>& a) { quick_sort(a); });\n\n    std::cout << \"四种排序结果与 std::sort 一致且升序。\\n\";\n    return 0;\n}"}]},"rs":{"file":"sort.rs","steps":[{"title":"冒泡排序 bubble_sort","note":"相邻比较交换，一轮无交换则提前结束","code":"/// 冒泡排序：原地升序。\npub fn bubble_sort(a: &mut [i32]) {\n    if a.len() < 2 {\n        return;\n    }\n    let mut end = a.len();\n    while end > 1 {\n        let mut swapped = false;\n        for i in 1..end {\n            if a[i - 1] > a[i] {\n                a.swap(i - 1, i);\n                swapped = true;\n            }\n        }\n        if !swapped {\n            break;\n        }\n        end -= 1;\n    }\n}"},{"title":"插入排序 insertion_sort","note":"把 a[i] 插入前面已经有序的区间","code":"/// 插入排序：原地升序，对小数组很快。\npub fn insertion_sort(a: &mut [i32]) {\n    for i in 1..a.len() {\n        let key = a[i];\n        let mut j = i;\n        while j > 0 && a[j - 1] > key {\n            a[j] = a[j - 1];\n            j -= 1;\n        }\n        a[j] = key;\n    }\n}"},{"title":"归并排序 merge_sort","note":"临时 Vec 做归并，稳定；std 的 slice","code":"/// 归并排序：原地接口，内部使用临时 Vec，稳定。\npub fn merge_sort(a: &mut [i32]) {\n    let n = a.len();\n    if n < 2 {\n        return;\n    }\n    let mut tmp = vec![0i32; n];\n    merge_sort_rec(a, &mut tmp, 0, n);\n}\n\nfn merge_sort_rec(a: &mut [i32], tmp: &mut [i32], lo: usize, hi: usize) {\n    if hi - lo < 2 {\n        return;\n    }\n    let mid = lo + (hi - lo) / 2;\n    merge_sort_rec(a, tmp, lo, mid);\n    merge_sort_rec(a, tmp, mid, hi);\n    merge(a, tmp, lo, mid, hi);\n}\n\nfn merge(a: &mut [i32], tmp: &mut [i32], lo: usize, mid: usize, hi: usize) {\n    let mut i = lo;\n    let mut j = mid;\n    let mut k = lo;\n    while i < mid && j < hi {\n        if a[j] < a[i] {\n            tmp[k] = a[j];\n            j += 1;\n        } else {\n            tmp[k] = a[i];\n            i += 1;\n        }\n        k += 1;\n    }\n    while i < mid {\n        tmp[k] = a[i];\n        i += 1;\n        k += 1;\n    }\n    while j < hi {\n        tmp[k] = a[j];\n        j += 1;\n        k += 1;\n    }\n    a[lo..hi].copy_from_slice(&tmp[lo..hi]);\n}"},{"title":"快速排序 quick_sort（Lomuto 分区）","note":"固定末尾为主元；最坏 O(n^2)，三数取中或随机主元可缓解","code":"/// 快速排序：原地升序，Lomuto 分区，固定取末尾为主元。\npub fn quick_sort(a: &mut [i32]) {\n    if a.len() > 1 {\n        quick_sort_range(a, 0, a.len());\n    }\n}\n\nfn lomuto_partition(a: &mut [i32], lo: usize, hi: usize) -> usize {\n    let pivot = a[hi];\n    let mut i = lo;\n    for j in lo..hi {\n        if a[j] < pivot {\n            a.swap(i, j);\n            i += 1;\n        }\n    }\n    a.swap(i, hi);\n    i\n}\n\nfn quick_sort_range(a: &mut [i32], lo: usize, hi: usize) {\n    if hi - lo < 2 {\n        return;\n    }\n    let p = lomuto_partition(a, lo, hi - 1);\n    quick_sort_range(a, lo, p);\n    quick_sort_range(a, p + 1, hi);\n}"},{"title":"main：跑一遍","note":"同一组数据跑四种排序，逐一与期望升序数组比对","code":"fn main() {\n    let base: Vec<i32> = vec![5, 2, 9, 1, 5, 6, -3, 8, 0, 7, 4, 2];\n    let mut expected = base.clone();\n    expected.sort();\n\n    println!(\"原始数组: {base:?}\");\n\n    let sorts: [(&str, fn(&mut [i32])); 4] = [\n        (\"bubble_sort\", bubble_sort),\n        (\"insertion_sort\", insertion_sort),\n        (\"merge_sort\", merge_sort),\n        (\"quick_sort\", quick_sort),\n    ];\n\n    for (name, sort_fn) in sorts {\n        let mut a = base.clone();\n        sort_fn(&mut a);\n        println!(\"{name}: {a:?}\");\n        assert!(a == expected, \"{name} 结果不正确\");\n        println!(\"  {name} 结果正确\");\n    }\n\n    println!(\"四种排序结果完全一致且升序。\");\n}"}]}}};

window.DSV_EX = {"array":[null,{"c":"/* 原地删除所有等于 value 的元素：O(n) 时间、O(1) 额外空间。\n   读指针 r 扫全部，写指针 w 只在\"该保留\"时前进；该删时 w 原地不动，\n   后面的元素自然会覆盖上来。 */\nvoid arr_remove_all(IntArray *a, int value) {\n    size_t w = 0;\n    for (size_t r = 0; r < a->size; ++r) {\n        if (a->data[r] != value) {\n            a->data[w++] = a->data[r];\n        }\n    }\n    a->size = w;      /* 尾部留下的脏数据不用清，下次 push_back 会覆盖它 */\n}","cpp":"// 原地删除所有等于 value 的元素：O(n) 时间、O(1) 额外空间\ntemplate <typename T>\nvoid DynamicArray<T>::remove_all(const T &value) {\n    std::size_t w = 0;\n    for (std::size_t r = 0; r < size_; ++r) {\n        if (!(data_[r] == value)) {\n            if (w != r) data_[w] = std::move(data_[r]);   // 用 move 避免多余拷贝\n            ++w;\n        }\n        // 该删：w 不动，后面的元素自然覆盖上来\n    }\n    size_ = w;\n}","rs":"/// 原地删除所有等于 value 的元素：O(n) 时间、O(1) 额外空间。\n/// 读指针 r 扫全部，写指针 w 只在\"该保留\"时前进。\npub fn remove_all(&mut self, value: i32) {\n    let mut w = 0;\n    for r in 0..self.len {\n        if self.data[r] != value {\n            self.data[w] = self.data[r];\n            w += 1;\n        }\n    }\n    self.len = w;   // 尾部脏数据不用清，下次 push 会覆盖\n}"}],"linkedlist":[null,{"c":"/* 删除倒数第 k 个结点，只遍历一趟。\n   快指针先走 k 步，然后两指针同步走；\n   快指针到尾时，慢指针正好停在\"待删结点的前驱\"上。 */\nNode *list_remove_nth_from_end(Node *head, int k)\n{\n    Node dummy = {0, head};            /* 哑结点：把\"删头结点\"也变成一般情况 */\n    Node *fast = &dummy, *slow = &dummy;\n\n    for (int i = 0; i < k; ++i) {\n        if (fast->next == NULL) return head;   /* k 越界，原样返回 */\n        fast = fast->next;\n    }\n    while (fast->next != NULL) {       /* 两个指针一起走 */\n        fast = fast->next;\n        slow = slow->next;\n    }\n    Node *victim = slow->next;         /* slow 停在倒数第 k+1 个 */\n    slow->next = victim->next;\n    free(victim);\n    return dummy.next;\n}","cpp":"// 删除倒数第 k 个结点，只遍历一趟（unique_ptr 管理所有权）\nstd::unique_ptr<Node> remove_nth_from_end(std::unique_ptr<Node> head, int k) {\n    auto dummy = std::make_unique<Node>(0);\n    dummy->next = std::move(head);\n\n    Node *fast = dummy.get();\n    Node *slow = dummy.get();\n    for (int i = 0; i < k; ++i) {\n        if (!fast->next) return std::move(dummy->next);   // k 越界\n        fast = fast->next.get();\n    }\n    while (fast->next) {\n        fast = fast->next.get();\n        slow = slow->next.get();\n    }\n    slow->next = std::move(slow->next->next);   // 被跳过的结点在这里自动析构\n    return std::move(dummy->next);\n}","rs":"/// 删除倒数第 k 个结点。\n///\n/// 注意：C/C++ 里\"快慢指针一趟走完\"的写法在**安全 Rust** 里写不出来 ——\n/// 它需要同时持有两个 &mut 引用，直接违反借用规则。\n/// 所以这里退一步：读成 Vec 处理完再重建。\n/// 这正是 Rust 标准库对 LinkedList 的官方说明所说的情况：\n/// \"几乎总是应该用 Vec 或 VecDeque，因为基于数组的容器通常更快、\n/// 更省内存、对 CPU 缓存更友好。\"（见 std::collections::LinkedList 文档）\nfn remove_nth_from_end(head: Option<Box<Node>>, k: usize) -> Option<Box<Node>> {\n    let mut vals: Vec<i32> = Vec::new();\n    let mut cur = head.as_deref();\n    while let Some(node) = cur {\n        vals.push(node.val);\n        cur = node.next.as_deref();\n    }\n    let n = vals.len();\n    if k == 0 || k > n {\n        return None;\n    }\n    vals.remove(n - k);\n\n    let mut out: Option<Box<Node>> = None;\n    for &v in vals.iter().rev() {\n        out = Some(Box::new(Node { val: v, next: out }));\n    }\n    out\n}"},{"c":"/* 合并两个有序链表：哑结点 + 每次接上较小的那个头，\n   最后把没走完的那条链整段挂上去。 */\nNode *list_merge_sorted(Node *a, Node *b)\n{\n    Node dummy = {0, NULL};\n    Node *tail = &dummy;\n\n    while (a != NULL && b != NULL) {\n        if (a->val <= b->val) { tail->next = a; a = a->next; }\n        else                  { tail->next = b; b = b->next; }\n        tail = tail->next;\n    }\n    tail->next = (a != NULL) ? a : b;   /* 剩下的整条链直接接上，不用逐个搬 */\n    return dummy.next;\n}","cpp":"// 合并两个有序链表\nstd::unique_ptr<Node> merge_sorted(std::unique_ptr<Node> a, std::unique_ptr<Node> b) {\n    auto dummy = std::make_unique<Node>(0);\n    Node *tail = dummy.get();\n    while (a && b) {\n        auto &pick = (a->val <= b->val) ? a : b;   // 选较小的那条链\n        auto rest = std::move(pick->next);\n        tail->next = std::move(pick);\n        tail = tail->next.get();\n        pick = std::move(rest);\n    }\n    tail->next = a ? std::move(a) : std::move(b);\n    return std::move(dummy->next);\n}","rs":"/// 合并两个有序链表：安全 Rust 版本（读成 Vec 归并后重建）。\nfn collect_vals(mut cur: Option<&Node>) -> Vec<i32> {\n    let mut out = Vec::new();\n    while let Some(node) = cur {\n        out.push(node.val);\n        cur = node.next.as_deref();\n    }\n    out\n}\n\nfn merge_sorted(a: Option<Box<Node>>, b: Option<Box<Node>>) -> Option<Box<Node>> {\n    let va = collect_vals(a.as_deref());\n    let vb = collect_vals(b.as_deref());\n\n    let (mut i, mut j) = (0, 0);\n    let mut merged = Vec::with_capacity(va.len() + vb.len());\n    while i < va.len() && j < vb.len() {\n        if va[i] <= vb[j] { merged.push(va[i]); i += 1; }\n        else              { merged.push(vb[j]); j += 1; }\n    }\n    merged.extend_from_slice(&va[i..]);\n    merged.extend_from_slice(&vb[j..]);\n\n    let mut out: Option<Box<Node>> = None;\n    for &v in merged.iter().rev() {\n        out = Some(Box::new(Node { val: v, next: out }));\n    }\n    out\n}"}],"stack":[null,{"c":"/* 用两个栈实现队列：in 负责入队，out 负责出队。\n   只有当 out 为空时，才把 in 里的元素整体\"倒\"过去 —— 均摊 O(1)。\n\n     入队 1,2,3    in: [1,2,3]  out: []\n     出队          out 空 -> 倒过来 in: []  out: [3,2,1]  -> pop 得到 1\n     再入队 4      in: [4]      out: [3,2]                 -> pop 得到 2\n*/\ntypedef struct {\n    IntStack in;      /* 只进不出 */\n    IntStack out;     /* 只出不进 */\n} QueueByStacks;\n\nvoid qbs_push(QueueByStacks *q, int v)\n{\n    stack_push(&q->in, v);\n}\n\nstatic void qbs_transfer(QueueByStacks *q)\n{\n    if (q->out.size != 0) return;                  /* out 非空就别倒，否则顺序会乱 */\n    while (q->in.size != 0) {\n        stack_push(&q->out, stack_pop(&q->in));    /* 倒一次，顺序就正过来了 */\n    }\n}\n\nint qbs_pop(QueueByStacks *q)\n{\n    qbs_transfer(q);\n    return stack_pop(&q->out);\n}","cpp":"// 用两个栈实现队列：in 负责入队，out 负责出队；均摊 O(1)\ntemplate <typename T>\nclass QueueByStacks {\npublic:\n    void push(const T &v) { in_.push(v); }\n\n    T pop() {\n        transfer();\n        T v = out_.top();\n        out_.pop();\n        return v;\n    }\n    bool empty() const { return in_.empty() && out_.empty(); }\n    std::size_t size() const { return in_.size() + out_.size(); }\n\nprivate:\n    void transfer() {\n        if (!out_.empty()) return;                 // 只在 out 空的时候倒一次\n        while (!in_.empty()) {\n            out_.push(std::move(in_.top()));\n            in_.pop();\n        }\n    }\n    std::stack<T> in_, out_;\n};","rs":"/// 用两个栈实现队列：in 负责入队，out 负责出队；均摊 O(1)。\n#[derive(Default)]\npub struct QueueByStacks<T> {\n    in_stack: Vec<T>,\n    out_stack: Vec<T>,\n}\n\nimpl<T> QueueByStacks<T> {\n    pub fn push(&mut self, v: T) {\n        self.in_stack.push(v);\n    }\n\n    pub fn pop(&mut self) -> Option<T> {\n        self.transfer();\n        self.out_stack.pop()\n    }\n\n    pub fn len(&self) -> usize {\n        self.in_stack.len() + self.out_stack.len()\n    }\n\n    pub fn is_empty(&self) -> bool {\n        self.in_stack.is_empty() && self.out_stack.is_empty()\n    }\n\n    /// 只在 out 为空时整体倒一次，所以每个元素最多被搬运两次。\n    fn transfer(&mut self) {\n        if self.out_stack.is_empty() {\n            while let Some(v) = self.in_stack.pop() {\n                self.out_stack.push(v);\n            }\n        }\n    }\n}"},{"c":"/* 最小栈：data 存数据，mins 存\"到当前为止的最小值\"，两个栈必须同步进出。\n   这是 O(1) 取最小值的标准解法（空间换时间）。 */\n#define MS_CAP 128\n\ntypedef struct {\n    int data[MS_CAP];\n    int mins[MS_CAP];\n    int n;\n} MinStack;\n\nvoid ms_push(MinStack *m, int v)\n{\n    m->data[m->n] = v;\n    m->mins[m->n] = (m->n == 0) ? v\n                  : (v < m->mins[m->n - 1] ? v : m->mins[m->n - 1]);\n    ++m->n;\n}\n\nint ms_pop(MinStack *m)\n{\n    if (m->n == 0) return -1;\n    --m->n;                       /* mins 跟着一起退 —— 漏了它 min() 就错 */\n    return m->data[m->n];\n}\n\nint ms_top(const MinStack *m) { return m->n ? m->data[m->n - 1] : -1; }\n\nint ms_min(const MinStack *m) { return m->n ? m->mins[m->n - 1] : -1; }","cpp":"// 最小栈：数据栈 + 辅助的\"历史最小值\"栈，push / pop / top / min 全部 O(1)\ntemplate <typename T>\nclass MinStack {\npublic:\n    void push(const T &v) {\n        data_.push(v);\n        mins_.push(mins_.empty() ? v : std::min(v, mins_.top()));\n    }\n    void pop() {\n        if (data_.empty()) return;\n        mins_.pop();                 // 两个栈必须同步进出，漏一个就全错\n        data_.pop();\n    }\n    const T &top() const { return data_.top(); }\n    T min() const { return mins_.top(); }\n    bool empty() const { return data_.empty(); }\n    std::size_t size() const { return data_.size(); }\n\nprivate:\n    std::stack<T> data_, mins_;\n};","rs":"/// 最小栈：mins[i] 记录 data[0..=i] 的最小值，两栈同步进出。\n/// push / pop / top / min 全部 O(1)，代价是额外一倍空间。\n#[derive(Default)]\npub struct MinStack<T> {\n    data: Vec<T>,\n    mins: Vec<T>,\n}\n\nimpl<T: Ord + Copy> MinStack<T> {\n    pub fn push(&mut self, v: T) {\n        let cur_min = match self.mins.last() {\n            Some(&m) if m < v => m,\n            _ => v,\n        };\n        self.data.push(v);\n        self.mins.push(cur_min);\n    }\n\n    pub fn pop(&mut self) -> Option<T> {\n        self.mins.pop();             // 两栈必须同步\n        self.data.pop()\n    }\n\n    pub fn top(&self) -> Option<T> { self.data.last().copied() }\n\n    /// O(1) 取最小值。\n    pub fn min(&self) -> Option<T> { self.mins.last().copied() }\n}"}],"queue":[null,{"c":"/* 用两个队列实现栈：每次 pop 时把 q 的前 n-1 个元素搬到另一个队列，\n   剩下的那一个就是栈顶；然后用下标异或 O(1) 交换两个队列的角色。\n\n   push 1,2,3   q0: [1,2,3]   q1: []\n   pop          搬走 1,2 -> q1: [1,2]，q0 剩 [3] -> 弹出 3，角色交换\n*/\ntypedef struct {\n    IntQueue q[2];\n    int      cur;          /* 当前\"装数据\"的那个队列 */\n} StackByQueues;\n\nvoid sbq_init(StackByQueues *s, size_t cap)\n{\n    queue_init(&s->q[0], cap);\n    queue_init(&s->q[1], cap);\n    s->cur = 0;\n}\n\nvoid sbq_push(StackByQueues *s, int v)\n{\n    queue_enqueue(&s->q[s->cur], v);\n}\n\nint sbq_pop(StackByQueues *s)\n{\n    IntQueue *from = &s->q[s->cur];\n    IntQueue *to   = &s->q[s->cur ^ 1];\n    int v = 0;\n\n    while (queue_size(from) > 1) {                 /* 倒走 n-1 个 */\n        queue_dequeue(from, &v);\n        queue_enqueue(to, v);\n    }\n    int top = 0;\n    queue_dequeue(from, &top);\n    s->cur ^= 1;                                   /* O(1) 交换角色 */\n    return top;\n}","cpp":"// 用两个队列实现栈：push O(1)，pop O(n)（要把前 n-1 个元素搬走）\ntemplate <typename T>\nclass StackByQueues {\npublic:\n    void push(const T &v) { q_[cur_].push(v); }\n\n    T pop() {\n        std::size_t other = cur_ ^ 1u;\n        while (q_[cur_].size() > 1) {          // 倒走 n-1 个\n            T v = std::move(q_[cur_].front());\n            q_[cur_].pop();\n            q_[other].push(std::move(v));\n        }\n        T top = std::move(q_[cur_].front());\n        q_[cur_].pop();\n        cur_ = other;                          // O(1) 交换角色\n        return top;\n    }\n    bool empty() const { return q_[cur_].empty(); }\n\nprivate:\n    std::queue<T> q_[2];\n    std::size_t   cur_ = 0;\n};","rs":"/// 用两个队列实现栈：push O(1)，pop O(n)。\n/// 每次 pop 把前 n-1 个元素搬到另一个队列，剩下的就是栈顶。\npub struct StackByQueues<T> {\n    q: [VecDeque<T>; 2],\n    cur: usize,\n}\n\nimpl<T> StackByQueues<T> {\n    pub fn new() -> Self {\n        Self { q: [VecDeque::new(), VecDeque::new()], cur: 0 }\n    }\n\n    pub fn push(&mut self, v: T) {\n        self.q[self.cur].push_back(v);\n    }\n\n    pub fn pop(&mut self) -> Option<T> {\n        let other = self.cur ^ 1;\n        while self.q[self.cur].len() > 1 {\n            let v = self.q[self.cur].pop_front().expect(\"len > 1\");\n            self.q[other].push_back(v);\n        }\n        let top = self.q[self.cur].pop_front();\n        self.cur = other;                  // O(1) 交换角色\n        top\n    }\n\n    pub fn is_empty(&self) -> bool {\n        self.q[self.cur].is_empty()\n    }\n}"},{"c":"/* 不牺牲格子的循环队列：用 size 字段区分空和满，\n   容量就是 cap，空间利用率 100%。代价是多维护一个计数器。 */\ntypedef struct {\n    int    *data;\n    size_t  cap;      /* 真正能存 cap 个元素 */\n    size_t  head;     /* 下一个出队位置 */\n    size_t  tail;     /* 下一个入队位置 */\n    size_t  size;     /* 当前元素个数 */\n} RingQueue;\n\nbool rq_empty(const RingQueue *q) { return q->size == 0; }\nbool rq_full(const RingQueue *q)  { return q->size == q->cap; }\n\nbool rq_enqueue(RingQueue *q, int v)\n{\n    if (rq_full(q)) return false;\n    q->data[q->tail] = v;\n    q->tail = (q->tail + 1) % q->cap;\n    ++q->size;\n    return true;\n}\n\nbool rq_dequeue(RingQueue *q, int *out)\n{\n    if (rq_empty(q)) return false;\n    *out = q->data[q->head];\n    q->head = (q->head + 1) % q->cap;\n    --q->size;\n    return true;\n}","cpp":"// 用 size 字段区分空/满的环形队列：容量 100% 可用\ntemplate <typename T>\nclass RingQueue {\npublic:\n    explicit RingQueue(std::size_t capacity)\n        : data_(capacity), cap_(capacity), head_(0), tail_(0), size_(0) {}\n\n    bool empty() const { return size_ == 0; }\n    bool full()  const { return size_ == cap_; }\n    std::size_t size() const { return size_; }\n\n    bool enqueue(const T &v) {\n        if (full()) return false;\n        data_[tail_] = v;\n        tail_ = (tail_ + 1) % cap_;\n        ++size_;\n        return true;\n    }\n\n    std::optional<T> dequeue() {\n        if (empty()) return std::nullopt;\n        T v = std::move(data_[head_]);\n        head_ = (head_ + 1) % cap_;\n        --size_;\n        return v;\n    }\n\nprivate:\n    std::vector<T> data_;\n    std::size_t cap_, head_, tail_, size_;\n};","rs":"/// 用 size 字段区分空/满的环形队列：容量 100% 可用，不牺牲格子。\n#[derive(Debug)]\npub struct RingQueue<T> {\n    data: Vec<Option<T>>,\n    head: usize,\n    tail: usize,\n    len: usize,\n}\n\nimpl<T> RingQueue<T> {\n    pub fn with_capacity(cap: usize) -> Self {\n        let mut data = Vec::with_capacity(cap);\n        data.resize_with(cap, || None);        // 不需要 T: Clone\n        Self { data, head: 0, tail: 0, len: 0 }\n    }\n\n    pub fn is_empty(&self) -> bool { self.len == 0 }\n    pub fn is_full(&self) -> bool { self.len == self.data.len() }\n    pub fn len(&self) -> usize { self.len }\n\n    pub fn enqueue(&mut self, v: T) -> bool {\n        if self.is_full() { return false; }\n        self.data[self.tail] = Some(v);\n        self.tail = (self.tail + 1) % self.data.len();\n        self.len += 1;\n        true\n    }\n\n    pub fn dequeue(&mut self) -> Option<T> {\n        if self.is_empty() { return None; }\n        let v = self.data[self.head].take();\n        self.head = (self.head + 1) % self.data.len();\n        self.len -= 1;\n        v\n    }\n}"}],"hash":[null,{"c":"/* FNV-1a 32 位字符串哈希：实现只有三行，分布却足够均匀，\n   是真实工程里常用的哈希函数（Redis、Nginx 等都用过 FNV 家族）。 */\n#include <stdint.h>\n\nuint32_t hash_str(const char *s)\n{\n    uint32_t h = 2166136261u;              /* FNV offset basis */\n    for (; *s != '\\0'; ++s) {\n        h ^= (uint32_t)(unsigned char)*s;  /* 1. 先异或一个字节 */\n        h *= 16777619u;                    /* 2. 再乘 FNV prime */\n    }\n    return h;\n}\n\n/* 桶下标 = hash % m，m 取质数能让分布更均匀 */\nsize_t bucket_of(const char *key, size_t m)\n{\n    return (size_t)(hash_str(key) % m);\n}","cpp":"// FNV-1a 32 位字符串哈希：工程上常用，实现极简、分布均匀\nstd::uint32_t hash_str(std::string_view s) {\n    std::uint32_t h = 2166136261u;                 // FNV offset basis\n    for (unsigned char c : s) {\n        h ^= c;                                    // 1. 先异或\n        h *= 16777619u;                            // 2. 再乘 FNV prime\n    }\n    return h;\n}\n\n// 标准库的做法：直接用 std::hash（libstdc++ / MSVC STL 各自实现）\nstd::size_t std_hash_of(const std::string &s) {\n    return std::hash<std::string>{}(s);\n}","rs":"/// FNV-1a 32 位字符串哈希：三行实现，分布均匀。\n///\n/// 注意 Rust 里必须用 wrapping_mul —— 整数溢出在 debug 下会 panic，\n/// 这正是 Rust 相比 C 更安全的地方（C 里无符号溢出是合法且静默的）。\npub fn hash_str(s: &str) -> u32 {\n    let mut h: u32 = 2_166_136_261;      // FNV offset basis\n    for b in s.as_bytes() {\n        h ^= *b as u32;                  // 1. 先异或\n        h = h.wrapping_mul(16_777_619);  // 2. 再乘 FNV prime\n    }\n    h\n}\n\n/// 桶下标：hash % m，m 取质数分布更均匀。\npub fn bucket_of(key: &str, m: usize) -> usize {\n    hash_str(key) as usize % m\n}\n\n/// 标准库的对照：Rust 的 HashMap 默认用 SipHash-1-3（RandomState），\n/// 每个进程的随机种子不同，用来抵抗\"哈希碰撞攻击\"。"}],"bst":[null,{"c":"/* 判断一棵树是不是 BST：不能只比较\"父子\"，必须给每个结点带上区间约束。\n   反例 [10,5,15,3,12]：12 是 5 的右孩子（12 > 5 通过），但 12 < 10，整棵树不是 BST。 */\n#include <limits.h>\n\nbool bst_is_valid(const BSTNode *node, long lo, long hi)\n{\n    if (node == NULL) {\n        return true;\n    }\n    if ((long)node->val <= lo || (long)node->val >= hi) {\n        return false;                    /* 越出祖先给的区间 -> 不是 BST */\n    }\n    return bst_is_valid(node->left,  lo,              (long)node->val)\n        && bst_is_valid(node->right, (long)node->val, hi);\n}\n\n/* 调用：bst_is_valid(root, LONG_MIN, LONG_MAX) */","cpp":"// 判断一棵树是不是 BST：给每个结点带上 (lo, hi) 开区间约束\ntemplate <typename T>\nbool isValidBST(const Node<T> *node,\n                const std::optional<T> &lo = std::nullopt,\n                const std::optional<T> &hi = std::nullopt) {\n    if (node == nullptr) return true;\n    if (lo && node->val <= *lo) return false;\n    if (hi && node->val >= *hi) return false;\n    return isValidBST(node->left,  lo,             node->val) &&\n           isValidBST(node->right, node->val,      hi);\n}","rs":"/// 判断一棵树是不是 BST：给每个结点带上下界，而不是只比较父子。\n/// 反例：10 的左孩子 5、5 的右孩子 12 —— 12 > 5 通过，但 12 < 10，整棵树不是 BST。\nfn is_valid_bst(node: &Option<Box<Node>>, lo: Option<i32>, hi: Option<i32>) -> bool {\n    match node {\n        None => true,\n        Some(n) => {\n            if let Some(l) = lo { if n.val <= l { return false; } }\n            if let Some(h) = hi { if n.val >= h { return false; } }\n            is_valid_bst(&n.left, lo, Some(n.val)) && is_valid_bst(&n.right, Some(n.val), hi)\n        }\n    }\n}"},{"c":"/* 有序数组 -> 高度最小的 BST：每次取中间元素做根，左右两半递归。\n   取中点保证左右子树结点数尽量相等，树高 = O(log n)。 */\nBSTNode *bst_from_sorted_array(const int *a, int lo, int hi)\n{\n    if (lo > hi) {\n        return NULL;                     /* 空区间 -> 空子树 */\n    }\n    int mid = lo + (hi - lo) / 2;        /* 这样写可以避免 lo + hi 溢出 */\n    BSTNode *node = bst_node_new(a[mid]);\n    if (node == NULL) {\n        return NULL;\n    }\n    node->left  = bst_from_sorted_array(a, lo, mid - 1);\n    node->right = bst_from_sorted_array(a, mid + 1, hi);\n    return node;\n}","cpp":"// 有序数组 -> 高度最小的 BST\ntemplate <typename T>\nstd::unique_ptr<Node<T>> sortedArrayToBST(const std::vector<T> &a,\n                                          std::ptrdiff_t lo, std::ptrdiff_t hi) {\n    if (lo > hi) return nullptr;\n    const std::ptrdiff_t mid = lo + (hi - lo) / 2;      // 防溢出的中点写法\n    auto node = std::make_unique<Node<T>>(a[static_cast<std::size_t>(mid)]);\n    node->left  = sortedArrayToBST(a, lo, mid - 1);\n    node->right = sortedArrayToBST(a, mid + 1, hi);\n    return node;\n}","rs":"/// 有序切片 -> 高度最小的 BST：每次取中点做根，左右两半递归。\n/// 因为切片可以安全地再切片，Rust 里这个算法反而比 C/C++ 更短。\npub fn sorted_to_bst(a: &[i32]) -> Option<Box<Node>> {\n    if a.is_empty() {\n        return None;\n    }\n    let mid = a.len() / 2;\n    Some(Box::new(Node {\n        val: a[mid],\n        left: sorted_to_bst(&a[..mid]),\n        right: sorted_to_bst(&a[mid + 1..]),\n    }))\n}"}],"heap":[null,{"c":"/* 数据流中位数：大顶堆 lo 存较小的一半，小顶堆 hi 存较大的一半。\n   两堆大小差不超过 1，中位数就落在堆顶上。每次插入 O(log n)。\n   （MaxHeap / MinHeap 复用上面的实现。） */\ntypedef struct {\n    MaxHeap lo;    /* 较小的一半，堆顶是这一半的最大值 */\n    MinHeap hi;    /* 较大的一半，堆顶是这一半的最小值 */\n} MedianFinder;\n\nvoid mf_add(MedianFinder *mf, int v)\n{\n    maxheap_push(&mf->lo, v);                        /* 1. 先无脑塞进 lo */\n    minheap_push(&mf->hi, maxheap_pop(&mf->lo));     /* 2. 把 lo 的最大值挪给 hi */\n    if (minheap_size(&mf->hi) > maxheap_size(&mf->lo)) {\n        maxheap_push(&mf->lo, minheap_pop(&mf->hi)); /* 3. 平衡两堆大小 */\n    }\n}\n\ndouble mf_median(const MedianFinder *mf)\n{\n    size_t nl = maxheap_size(&mf->lo);\n    size_t nh = minheap_size(&mf->hi);\n    if (nl > nh) {\n        return (double)maxheap_top(&mf->lo);\n    }\n    return ((double)maxheap_top(&mf->lo) + (double)minheap_top(&mf->hi)) / 2.0;\n}","cpp":"// 数据流中位数：大顶堆 lo 存较小的一半，小顶堆 hi 存较大的一半\nclass MedianFinder {\npublic:\n    void addNum(int v) {\n        lo_.push(v);                        // 1. 先塞进 lo\n        hi_.push(lo_.top());                // 2. lo 的最大值挪给 hi\n        lo_.pop();\n        if (hi_.size() > lo_.size()) {      // 3. 平衡两堆\n            lo_.push(hi_.top());\n            hi_.pop();\n        }\n    }\n\n    double findMedian() const {\n        if (lo_.size() > hi_.size()) return static_cast<double>(lo_.top());\n        return (static_cast<double>(lo_.top()) + hi_.top()) / 2.0;\n    }\n\nprivate:\n    std::priority_queue<int> lo_;                                       // 大顶堆（默认）\n    std::priority_queue<int, std::vector<int>, std::greater<int>> hi_;  // 小顶堆\n};","rs":"use std::cmp::Reverse;\nuse std::collections::BinaryHeap;\n\n/// 数据流中位数：大顶堆 lo 存较小的一半（用 Reverse 反一下），\n/// 小顶堆 hi 存较大的一半；两堆大小差不超过 1，中位数就在堆顶。\n#[derive(Default)]\npub struct MedianFinder {\n    lo: BinaryHeap<i32>,           // 大顶堆\n    hi: BinaryHeap<Reverse<i32>>,  // 小顶堆\n}\n\nimpl MedianFinder {\n    pub fn new() -> Self { Self::default() }\n\n    pub fn add_num(&mut self, v: i32) {\n        self.lo.push(v);                                  // 1. 先塞进 lo\n        if let Some(top) = self.lo.pop() {                // 2. lo 的最大值挪给 hi\n            self.hi.push(Reverse(top));\n        }\n        if self.hi.len() > self.lo.len() {                // 3. 平衡两堆\n            if let Some(Reverse(v)) = self.hi.pop() {\n                self.lo.push(v);\n            }\n        }\n    }\n\n    pub fn find_median(&self) -> f64 {\n        match (self.lo.peek(), self.hi.peek()) {\n            (Some(&a), Some(&Reverse(b))) if self.lo.len() == self.hi.len() => (a + b) as f64 / 2.0,\n            (Some(&a), _) => a as f64,\n            _ => f64::NAN,\n        }\n    }\n}"},{"c":"/* 原地堆排序（大顶堆）：建堆 O(n) + 反复\"堆顶换到末尾再下沉\" O(n log n)，\n   额外空间 O(1)。 */\nstatic void sift_down_max(int *a, size_t n, size_t i)\n{\n    int value = a[i];\n    while (2 * i + 1 < n) {\n        size_t child = 2 * i + 1;\n        if (child + 1 < n && a[child + 1] > a[child]) {\n            ++child;                                  /* 挑更大的那个孩子 */\n        }\n        if (a[child] <= value) {\n            break;                                    /* 已经比孩子都大 -> 到位 */\n        }\n        a[i] = a[child];                              /* 空洞法：孩子上移 */\n        i = child;\n    }\n    a[i] = value;\n}\n\nvoid heap_sort(int *a, size_t n)\n{\n    for (size_t i = n / 2; i > 0; --i) {              /* 1. 自底向上建大顶堆，O(n) */\n        sift_down_max(a, n, i - 1);\n    }\n    for (size_t end = n - 1; end > 0; --end) {        /* 2. 每轮把最大值归位 */\n        int t = a[0]; a[0] = a[end]; a[end] = t;\n        sift_down_max(a, end, 0);\n    }\n}","cpp":"// 标准库写法：make_heap 建堆 + sort_heap 排序，内部就是堆排序\nvoid heap_sort_stl(std::vector<int> &v) {\n    std::make_heap(v.begin(), v.end());   // 1. 建大顶堆 O(n)\n    std::sort_heap(v.begin(), v.end());   // 2. 反复取堆顶 O(n log n)\n}\n\n// 手写版：逻辑与 C 完全一致\nvoid sift_down(std::vector<int> &a, std::size_t n, std::size_t i) {\n    int value = a[i];\n    while (2 * i + 1 < n) {\n        std::size_t child = 2 * i + 1;\n        if (child + 1 < n && a[child + 1] > a[child]) ++child;\n        if (a[child] <= value) break;\n        a[i] = a[child];\n        i = child;\n    }\n    a[i] = value;\n}\n\nvoid heap_sort(std::vector<int> &a) {\n    const std::size_t n = a.size();\n    for (std::size_t i = n / 2; i > 0; --i) sift_down(a, n, i - 1);\n    for (std::size_t end = n - 1; end > 0; --end) {\n        std::swap(a[0], a[end]);\n        sift_down(a, end, 0);\n    }\n}","rs":"/// 原地堆排序（大顶堆）：建堆 O(n) + 反复取堆顶 O(n log n)，额外空间 O(1)。\npub fn heap_sort(a: &mut [i32]) {\n    let n = a.len();\n    if n < 2 {\n        return;\n    }\n    // 1. 自底向上建大顶堆\n    for i in (0..n / 2).rev() {\n        sift_down(a, n, i);\n    }\n    // 2. 每轮把堆顶（当前最大值）换到未排序区间的末尾，再修复堆\n    for end in (1..n).rev() {\n        a.swap(0, end);\n        sift_down(a, end, 0);\n    }\n}\n\nfn sift_down(a: &mut [i32], n: usize, mut i: usize) {\n    let value = a[i];\n    while 2 * i + 1 < n {\n        let mut child = 2 * i + 1;\n        if child + 1 < n && a[child + 1] > a[child] {\n            child += 1;\n        }\n        if a[child] <= value {\n            break;\n        }\n        a[i] = a[child];\n        i = child;\n    }\n    a[i] = value;\n}"}],"graph":[null,{"c":"/* 从 start 出发，求\"到每个顶点的最短边数\"。\n   关键：BFS 第一次到达某个顶点时，走的一定是最短路径 ——\n   因为队列保证\"距离小的先被处理\"。dist[i] = -1 表示不可达。\n   （Graph / Edge / IntQueue 复用上面的定义。） */\nvoid graph_bfs_dist(const Graph *g, int start, int *dist)\n{\n    for (int i = 0; i < g->n; ++i) {\n        dist[i] = -1;                              /* -1 = 未访问 */\n    }\n    dist[start] = 0;\n\n    IntQueue q;\n    queue_init(&q, (size_t)g->n);\n    queue_enqueue(&q, start);\n\n    while (!queue_empty(&q)) {\n        int v = 0;\n        queue_dequeue(&q, &v);\n        for (const Edge *e = g->adj[v]; e != NULL; e = e->next) {\n            if (dist[e->to] == -1) {               /* 第一次到达 = 最短路 */\n                dist[e->to] = dist[v] + 1;\n                queue_enqueue(&q, e->to);\n            }\n        }\n    }\n    queue_free(&q);\n}","cpp":"// 从 start 出发求到每个顶点的最短边数（无权图最短路）\nstd::vector<int> bfsDist(const std::vector<std::vector<int>> &adj, int start) {\n    std::vector<int> dist(adj.size(), -1);         // -1 = 未访问\n    dist[static_cast<std::size_t>(start)] = 0;\n\n    std::queue<int> q;\n    q.push(start);\n    while (!q.empty()) {\n        int v = q.front();\n        q.pop();\n        for (int nb : adj[static_cast<std::size_t>(v)]) {\n            if (dist[static_cast<std::size_t>(nb)] == -1) {\n                dist[static_cast<std::size_t>(nb)] =\n                    dist[static_cast<std::size_t>(v)] + 1;\n                q.push(nb);\n            }\n        }\n    }\n    return dist;\n}","rs":"/// 从 start 出发求到每个顶点的最短边数（无权图最短路）。\n/// 关键：BFS 第一次到达某点时走的一定是最短路，因为队列保证距离小的先出队。\npub fn bfs_dist(adj: &[Vec<usize>], start: usize) -> Vec<Option<usize>> {\n    let mut dist: Vec<Option<usize>> = vec![None; adj.len()];\n    dist[start] = Some(0);\n    let mut q = VecDeque::new();\n    q.push_back(start);\n\n    while let Some(v) = q.pop_front() {\n        let d = dist[v].expect(\"入队时已赋值\");\n        for &nb in &adj[v] {\n            if dist[nb].is_none() {\n                dist[nb] = Some(d + 1);\n                q.push_back(nb);\n            }\n        }\n    }\n    dist\n}"},{"c":"/* 统计无向图的连通分量个数：\n   外层扫每个顶点，遇到没访问过的就启动一次 DFS，计数器 +1。\n   一次 DFS 会吞掉整个连通块。 */\nint graph_count_components(const Graph *g)\n{\n    bool *seen = (bool *)calloc((size_t)g->n, sizeof *seen);\n    if (seen == NULL) {\n        return 0;\n    }\n\n    int count = 0;\n    for (int v = 0; v < g->n; ++v) {\n        if (seen[v]) {\n            continue;\n        }\n        ++count;                       /* 发现一个新的连通块 */\n        graph_dfs(g, v, seen);         /* 一次 DFS 吞掉它 */\n    }\n\n    free(seen);\n    return count;\n}","cpp":"// 统计无向图的连通分量个数（图的\"岛屿数量\"）\nstd::size_t countComponents(const std::vector<std::vector<int>> &adj) {\n    std::vector<bool> seen(adj.size(), false);\n    std::size_t count = 0;\n\n    for (std::size_t start = 0; start < adj.size(); ++start) {\n        if (seen[start]) continue;\n        ++count;                                  // 发现一个新的连通块\n        std::vector<int> st{static_cast<int>(start)};\n        while (!st.empty()) {\n            int v = st.back();\n            st.pop_back();\n            if (seen[static_cast<std::size_t>(v)]) continue;\n            seen[static_cast<std::size_t>(v)] = true;\n            for (int nb : adj[static_cast<std::size_t>(v)]) {\n                if (!seen[static_cast<std::size_t>(nb)]) st.push_back(nb);\n            }\n        }\n    }\n    return count;\n}","rs":"/// 统计无向图的连通分量个数（\"岛屿数量\"的抽象版）。\npub fn count_components(adj: &[Vec<usize>]) -> usize {\n    let mut seen = vec![false; adj.len()];\n    let mut count = 0;\n\n    for start in 0..adj.len() {\n        if seen[start] {\n            continue;\n        }\n        count += 1;                       // 发现一个新的连通块\n        let mut stack = vec![start];      // 用显式栈做迭代 DFS，避免递归爆栈\n        while let Some(v) = stack.pop() {\n            if seen[v] {\n                continue;\n            }\n            seen[v] = true;\n            for &nb in &adj[v] {\n                if !seen[nb] {\n                    stack.push(nb);\n                }\n            }\n        }\n    }\n    count\n}"},{"c":"/* 课程表问题：判断一堆\"先修关系\"能不能全部修完，\n   等价于判断有向图有没有环 —— 用 Kahn 拓扑排序。\n   如果排出来的序列长度 < 顶点数，说明有环。 */\nbool graph_can_finish(const Graph *g, int *order)\n{\n    int *indeg = (int *)calloc((size_t)g->n, sizeof *indeg);\n    if (indeg == NULL) {\n        return false;\n    }\n    for (int v = 0; v < g->n; ++v) {\n        for (const Edge *e = g->adj[v]; e != NULL; e = e->next) {\n            ++indeg[e->to];                        /* 统计入度 */\n        }\n    }\n\n    IntQueue q;\n    queue_init(&q, (size_t)g->n);\n    for (int v = 0; v < g->n; ++v) {\n        if (indeg[v] == 0) {\n            queue_enqueue(&q, v);                  /* 入度为 0 才能先修 */\n        }\n    }\n\n    int k = 0;\n    while (!queue_empty(&q)) {\n        int v = 0;\n        queue_dequeue(&q, &v);\n        order[k++] = v;\n        for (const Edge *e = g->adj[v]; e != NULL; e = e->next) {\n            if (--indeg[e->to] == 0) {             /* 前置课都修完了 */\n                queue_enqueue(&q, e->to);\n            }\n        }\n    }\n\n    queue_free(&q);\n    free(indeg);\n    return k == g->n;                              /* false = 有环，修不完 */\n}","cpp":"// 课程表：判断有向图有没有环（Kahn 拓扑排序）\nbool canFinish(int numCourses, const std::vector<std::pair<int, int>> &prereq) {\n    std::vector<std::vector<int>> adj(static_cast<std::size_t>(numCourses));\n    std::vector<int> indeg(static_cast<std::size_t>(numCourses), 0);\n\n    for (const auto &[a, b] : prereq) {            // 修 a 之前要先修 b：b -> a\n        adj[static_cast<std::size_t>(b)].push_back(a);\n        ++indeg[static_cast<std::size_t>(a)];\n    }\n\n    std::queue<int> q;\n    for (int i = 0; i < numCourses; ++i) {\n        if (indeg[static_cast<std::size_t>(i)] == 0) q.push(i);\n    }\n\n    int learned = 0;\n    while (!q.empty()) {\n        int v = q.front();\n        q.pop();\n        ++learned;\n        for (int nb : adj[static_cast<std::size_t>(v)]) {\n            if (--indeg[static_cast<std::size_t>(nb)] == 0) q.push(nb);\n        }\n    }\n    return learned == numCourses;                  // 排不完就说明有环\n}","rs":"/// 课程表：判断有向图有没有环（Kahn 拓扑排序）。\n/// 返回 None 表示有环，永远修不完。\npub fn topo_order(adj: &[Vec<usize>]) -> Option<Vec<usize>> {\n    let n = adj.len();\n    let mut indeg = vec![0usize; n];\n    for list in adj {\n        for &to in list {\n            indeg[to] += 1;\n        }\n    }\n\n    let mut q: VecDeque<usize> = (0..n).filter(|&v| indeg[v] == 0).collect();\n    let mut order = Vec::with_capacity(n);\n    while let Some(v) = q.pop_front() {\n        order.push(v);\n        for &to in &adj[v] {\n            indeg[to] -= 1;\n            if indeg[to] == 0 {\n                q.push_back(to);\n            }\n        }\n    }\n    if order.len() == n { Some(order) } else { None }\n}"}],"sort":[null,{"c":"/* 归并排序求逆序对：在 merge 的时候顺手统计。\n   关键：当取的是右半边的元素时，说明左半边剩下的**每一个**都比它大，\n   所以一次就能加上 (left_len - i) 个逆序对。总复杂度 O(n log n)。 */\nstatic long long merge_count(int *a, int *tmp, int lo, int mid, int hi)\n{\n    int i = lo, j = mid + 1, k = lo;\n    long long count = 0;\n\n    while (i <= mid && j <= hi) {\n        if (a[i] <= a[j]) {\n            tmp[k++] = a[i++];\n        } else {\n            tmp[k++] = a[j++];\n            count += (long long)(mid - i + 1);   /* 左半边剩下这么多都比它大 */\n        }\n    }\n    while (i <= mid) tmp[k++] = a[i++];\n    while (j <= hi)  tmp[k++] = a[j++];\n    for (i = lo; i <= hi; ++i) a[i] = tmp[i];\n    return count;\n}\n\nlong long count_inversions(int *a, int *tmp, int lo, int hi)\n{\n    if (lo >= hi) {\n        return 0;\n    }\n    int mid = lo + (hi - lo) / 2;\n    long long count = count_inversions(a, tmp, lo, mid)\n                    + count_inversions(a, tmp, mid + 1, hi)\n                    + merge_count(a, tmp, lo, mid, hi);\n    return count;\n}","cpp":"// 归并排序求逆序对：合并时若取右半边的元素，说明左半边剩下的都比它大\ntemplate <typename T>\nlong long merge_count(std::vector<T> &a, std::vector<T> &tmp,\n                      std::ptrdiff_t lo, std::ptrdiff_t mid, std::ptrdiff_t hi) {\n    std::ptrdiff_t i = lo, j = mid + 1, k = lo;\n    long long count = 0;\n\n    while (i <= mid && j <= hi) {\n        if (a[static_cast<std::size_t>(i)] <= a[static_cast<std::size_t>(j)]) {\n            tmp[static_cast<std::size_t>(k++)] = a[static_cast<std::size_t>(i++)];\n        } else {\n            tmp[static_cast<std::size_t>(k++)] = a[static_cast<std::size_t>(j++)];\n            count += static_cast<long long>(mid - i + 1);\n        }\n    }\n    while (i <= mid) tmp[static_cast<std::size_t>(k++)] = a[static_cast<std::size_t>(i++)];\n    while (j <= hi)  tmp[static_cast<std::size_t>(k++)] = a[static_cast<std::size_t>(j++)];\n    for (std::ptrdiff_t t = lo; t <= hi; ++t) {\n        a[static_cast<std::size_t>(t)] = tmp[static_cast<std::size_t>(t)];\n    }\n    return count;\n}\n\ntemplate <typename T>\nlong long count_inversions(std::vector<T> &a, std::vector<T> &tmp,\n                           std::ptrdiff_t lo, std::ptrdiff_t hi) {\n    if (lo >= hi) return 0;\n    const std::ptrdiff_t mid = lo + (hi - lo) / 2;\n    return count_inversions(a, tmp, lo, mid)\n         + count_inversions(a, tmp, mid + 1, hi)\n         + merge_count(a, tmp, lo, mid, hi);\n}","rs":"/// 归并排序求逆序对：合并时若取的是右半边的元素，\n/// 说明左半边剩下的每一个都比它大，一次就能加上 (mid - i + 1) 个逆序对。\n/// 总复杂度 O(n log n)，比朴素双层循环的 O(n²) 快得多。\npub fn count_inversions(a: &mut [i32]) -> usize {\n    let n = a.len();\n    if n < 2 {\n        return 0;\n    }\n    let mid = n / 2;\n    let mut count = count_inversions(&mut a[..mid]) + count_inversions(&mut a[mid..]);\n\n    let (left, right) = a.split_at(mid);\n    let mut merged = Vec::with_capacity(n);\n    let (mut i, mut j) = (0usize, 0usize);\n\n    while i < left.len() && j < right.len() {\n        if left[i] <= right[j] {\n            merged.push(left[i]);\n            i += 1;\n        } else {\n            count += left.len() - i;   // 左半边剩下的全都比 right[j] 大\n            merged.push(right[j]);\n            j += 1;\n        }\n    }\n    merged.extend_from_slice(&left[i..]);\n    merged.extend_from_slice(&right[j..]);\n    a.copy_from_slice(&merged);\n    count\n}"},{"c":"/* 快速排序的核心：Lomuto 分区。\n   i 指向\"小于区\"的下一个空位，j 从左往右扫；\n   j 遇到比基准小的就和 i 交换。最后把基准换到 i 的位置。 */\nstatic int partition(int *a, int lo, int hi)\n{\n    int pivot = a[hi];                 /* 取末尾元素为基准 */\n    int i = lo;\n\n    for (int j = lo; j < hi; ++j) {    /* 注意是 j < hi，a[hi] 是基准本身 */\n        if (a[j] < pivot) {\n            int t = a[i]; a[i] = a[j]; a[j] = t;\n            ++i;\n        }\n    }\n    int t = a[i]; a[i] = a[hi]; a[hi] = t;   /* 基准归位，这一步最容易忘 */\n    return i;                                /* 返回基准的最终下标 */\n}\n\nvoid quick_sort(int *a, int lo, int hi)\n{\n    if (lo >= hi) {\n        return;                        /* 0 或 1 个元素，天然有序 */\n    }\n    int p = partition(a, lo, hi);\n    quick_sort(a, lo, p - 1);          /* 注意是 p-1 */\n    quick_sort(a, p + 1, hi);          /* 和 p+1，写成 p 会死循环 */\n}","cpp":"// 快速排序的核心：Lomuto 分区（C++20）\ntemplate <typename T>\nstd::ptrdiff_t partitionRange(std::vector<T> &a, std::ptrdiff_t lo, std::ptrdiff_t hi) {\n    // 三数取中：避免\"已经有序\"的输入退化成 O(n^2)\n    const std::ptrdiff_t mid = lo + (hi - lo) / 2;\n    if (a[static_cast<std::size_t>(mid)] < a[static_cast<std::size_t>(lo)])\n        std::swap(a[static_cast<std::size_t>(mid)], a[static_cast<std::size_t>(lo)]);\n    if (a[static_cast<std::size_t>(hi)] < a[static_cast<std::size_t>(lo)])\n        std::swap(a[static_cast<std::size_t>(hi)], a[static_cast<std::size_t>(lo)]);\n    if (a[static_cast<std::size_t>(hi)] < a[static_cast<std::size_t>(mid)])\n        std::swap(a[static_cast<std::size_t>(hi)], a[static_cast<std::size_t>(mid)]);\n    std::swap(a[static_cast<std::size_t>(mid)], a[static_cast<std::size_t>(hi)]);\n\n    const T pivot = a[static_cast<std::size_t>(hi)];\n    std::ptrdiff_t i = lo;\n    for (std::ptrdiff_t j = lo; j < hi; ++j) {\n        if (a[static_cast<std::size_t>(j)] < pivot) {\n            std::swap(a[static_cast<std::size_t>(i)], a[static_cast<std::size_t>(j)]);\n            ++i;\n        }\n    }\n    std::swap(a[static_cast<std::size_t>(i)], a[static_cast<std::size_t>(hi)]);\n    return i;\n}\n\ntemplate <typename T>\nvoid quickSort(std::vector<T> &a, std::ptrdiff_t lo, std::ptrdiff_t hi) {\n    while (lo < hi) {\n        const std::ptrdiff_t p = partitionRange(a, lo, hi);\n        quickSort(a, lo, p - 1);       // 先递归小的那半边\n        lo = p + 1;                    // 大的那半边改用循环，递归深度降到 O(log n)\n    }\n}","rs":"/// 快速排序的核心：Lomuto 分区。\n/// 返回基准的最终下标；i 是\"小于区\"的下一个空位。\npub fn partition(a: &mut [i32]) -> usize {\n    let hi = a.len() - 1;\n    let pivot = a[hi];               // 取末尾元素为基准\n    let mut i = 0;\n\n    for j in 0..hi {\n        if a[j] < pivot {\n            a.swap(i, j);\n            i += 1;\n        }\n    }\n    a.swap(i, hi);                   // 基准归位\n    i\n}\n\n/// 原地快排：平均 O(n log n)，最坏 O(n^2)（基准总取到极值时）。\n/// 想避免最坏情况就用\"三数取中\"或随机基准。\npub fn quick_sort(a: &mut [i32]) {\n    if a.len() < 2 {\n        return;\n    }\n    let p = partition(a);\n    let (left, rest) = a.split_at_mut(p);\n    quick_sort(left);\n    quick_sort(&mut rest[1..]);\n}"}]};

m/w/cpp/container/vector\n- cppreference: std::optional（pop 空栈的返回语义）：https://en.cppreference.com/w/cpp/utility/optional\n- cppreference: std::out_of_range 与 std::stack 的接口对照：https://en.cppreference.com/w/cpp/container/stack\n- Rust std: Vec::push / pop / last / clear（栈操作对应关系）：https://doc.rust-lang.org/std/vec/struct.Vec.html\n- Rust std: Option（pop/peek 返回 None 的约定）：https://doc.rust-lang.org/std/option/enum.Option.html\n- LeetCode 20. Valid Parentheses（括号匹配的经典判定：\"([)]\" 与 \"(((\" 都是 false）：https://leetcode.com/problems/valid-parentheses/\n","queue":"# queue（循环队列）资料来源\n\n本目录的 `queue.c` / `queue.cpp` / `queue.rs` 用到的全部外部依据：\n\n1. Linux 内核 kfifo —— 环形缓冲的工业级参考实现，说明为何生产代码更倾向「容量固定的环形缓冲」\n   https://www.kernel.org/doc/html/latest/core-api/kernel-api.html\n   （源码：https://github.com/torvalds/linux/blob/master/include/linux/kfifo.h ）\n2. cppreference: std::deque —— C++ 版注释里「为什么 std::deque 是更工程的解法」的依据\n   https://en.cppreference.com/w/cpp/container/deque\n3. cppreference: std::vector —— 底层存储、capacity 与元素生命周期的语义\n   https://en.cppreference.com/w/cpp/container/vector\n4. cppreference: std::optional —— 出队用 optional 表达「可能没有值」\n   https://en.cppreference.com/w/cpp/utility/optional\n5. Rust std: std::collections::VecDeque —— 标准库环形缓冲，作为工程写法对照\n   https://doc.rust-lang.org/std/collections/struct.VecDeque.html\n6. Rust std: Vec —— 源码中 `Vec::push` / 索引 / `iter` 的语义\n   https://doc.rust-lang.org/std/vec/struct.Vec.html\n7. ISO/IEC 9899:2018（C17）委员会草案 N2310 —— C 版的 malloc/free 与 size_t 语义\n   https://www.open-std.org/jtc1/sc22/wg14/www/docs/n2310.pdf\n8. MSVC 文档：/std:c17 与 /std:c++20 编译选项（本目录的编译命令来源）\n   https://learn.microsoft.com/en-us/cpp/build/reference/std-specify-language-standard-version\n","hash":"# hash（哈希表 / 拉链法）资料来源\n\n本目录的 `hash.c` / `hash.cpp` / `hash.rs` 用到的全部外部依据：\n\n1. FNV Hash 官方规范 —— 本目录三份实现共用的 offset basis 与 prime 出处\n   http://www.isthe.com/chongo/tech/comp/fnv/index.html\n2. cppreference: std::unordered_map —— C++ 版注释里「与标准库同源」的依据（桶、负载因子、rehash）\n   https://en.cppreference.com/w/cpp/container/unordered_map\n3. cppreference: std::forward_list —— `before_begin()` / `erase_after()` 的语义，删除一节直接依赖\n   https://en.cppreference.com/w/cpp/container/forward_list\n4. libstdc++ `bits/hashtable.h` —— 标准库真实的拉链法实现（桶数组 + 全局节点链表）\n   https://github.com/gcc-mirror/gcc/blob/master/libstdc%2B%2B-v3/include/bits/hashtable.h\n5. Rust std: std::collections::HashMap —— 工程写法对照，以及 Rust 侧 `find` / `position` / `Vec::remove` 的文档\n   https://doc.rust-lang.org/std/collections/struct.HashMap.html\n6. Rust std: std::mem::replace —— `resize` 里换出旧桶数组所用 API（签名 `pub const fn replace<T>(dest: &mut T, src: T) -> T`）\n   https://doc.rust-lang.org/std/mem/fn.replace.html\n7. Rust std: u64::wrapping_mul —— FNV 乘法显式回绕的语义\n   https://doc.rust-lang.org/std/primitive.u64.html#method.wrapping_mul\n8. Sedgewick, *Algorithms in C, Part 5: Graph Algorithms / Hashing* —— 拉链法与再散列的教学框架\n   https://www.informit.com/store/algorithms-in-c-part-5-graph-algorithms-9780201316636\n","bst":"# bst（二叉搜索树）资料来源\n\n本目录的 `bst.c` / `bst.cpp` / `bst.rs` 用到的全部外部依据：\n\n1. Rust std: Option::as_deref —— 签名 `pub const fn as_deref(&self) -> Option<&T::Target> where T: Deref`（stable 1.40.0），\n   `cur.left.as_deref()` 能把 `Option<Box<Node>>` 借成 `Option<&Node>` 正是靠它\n   https://doc.rust-lang.org/std/option/enum.Option.html#method.as_deref\n2. Rust std: Option::take —— 签名 `pub const fn take(&mut self) -> Option<T>`（stable 1.0.0），\n   删除节点时「先取走孩子、再放回新子树」依赖它\n   https://doc.rust-lang.org/std/option/enum.Option.html#method.take\n3. Rust 源码核对（本次实际抓取）：core/src/option.rs 中 `as_deref` / `as_deref_mut` / `take` 的定义与 `#[stable]` 标记\n   https://github.com/rust-lang/rust/blob/master/library/core/src/option.rs\n4. Rust std: Box —— 递归类型与子树所有权的基础\n   https://doc.rust-lang.org/std/boxed/struct.Box.html\n5. 「Learning Rust With Entirely Too Many Linked Lists」—— Option<Box<Node>> 树/链表惯用法\n   https://rust-unofficial.github.io/too-many-lists/\n6. cppreference: std::unique_ptr —— C++ 版 RAII 所有权与 `std::move` 转移子树的语义\n   https://en.cppreference.com/w/cpp/memory/unique_ptr\n7. cppreference: std::optional —— min_value 用 optional 表达「空树没有最小值」\n   https://en.cppreference.com/w/cpp/utility/optional\n8. Open Data Structures: Binary Search Trees —— 删除三种情况（叶子 / 单孩子 / 中序后继替换）的标准表述\n   https://opendatastructures.org/ods-java/6_2_BinarySearchTree.html\n","heap":"# heap 主题资料来源\n\n- C 语言标准库 realloc / malloc / free（cppreference C 版）\n  https://en.cppreference.com/w/c/memory/realloc\n- C++ std::push_heap / std::pop_heap（cppreference）\n  https://en.cppreference.com/w/cpp/algorithm/push_heap\n  https://en.cppreference.com/w/cpp/algorithm/pop_heap\n- C++ std::vector（cppreference）\n  https://en.cppreference.com/w/cpp/container/vector\n- 二叉堆与 O(n) 建堆复杂度（维基百科 Binary heap）\n  https://en.wikipedia.org/wiki/Binary_heap\n- CLRS 第 6 章 Heapsort（MIT Press 官方书目页，建堆 O(n) 的势能/级数证明）\n  https://mitpress.mit.edu/9780262046305/introduction-to-algorithms/\n- Rust std::vec::Vec 文档（push/pop/swap/with_capacity）\n  https://doc.rust-lang.org/std/vec/struct.Vec.html\n- Rust std::collections::BinaryHeap 文档（对照用途）\n  https://doc.rust-lang.org/std/collections/binary_heap/struct.BinaryHeap.html\n","graph":"# graph 主题资料来源\n\n- 邻接表（维基百科 Adjacency list）\n  https://en.wikipedia.org/wiki/Adjacency_list\n- 广度优先搜索（维基百科 Breadth-first search）\n  https://en.wikipedia.org/wiki/Breadth-first_search\n- 深度优先搜索（维基百科 Depth-first search）\n  https://en.wikipedia.org/wiki/Depth-first_search\n- C 语言 calloc（cppreference C 版）\n  https://en.cppreference.com/w/c/memory/calloc\n- C++ std::queue（cppreference）\n  https://en.cppreference.com/w/cpp/container/queue\n- C++ std::vector（cppreference）\n  https://en.cppreference.com/w/cpp/container/vector\n- Rust std::collections::VecDeque（push_back / pop_front）\n  https://doc.rust-lang.org/std/collections/struct.VecDeque.html\n- Rust std::vec::Vec（Vec 的 push/len 与索引）\n  https://doc.rust-lang.org/std/vec/struct.Vec.html\n- CP-Algorithms: Breadth First Search（0-1 BFS 与常见实现）\n  https://cp-algorithms.com/graph/breadth-first-search.html\n","sort":"# sort 主题资料来源\n\n- 冒泡排序（维基百科 Bubble sort）\n  https://en.wikipedia.org/wiki/Bubble_sort\n- 插入排序（维基百科 Insertion sort）\n  https://en.wikipedia.org/wiki/Insertion_sort\n- 归并排序（维基百科 Merge sort）\n  https://en.wikipedia.org/wiki/Merge_sort\n- 快速排序与 Lomuto 分区、三数取中（维基百科 Quicksort）\n  https://en.wikipedia.org/wiki/Quicksort\n- C++ std::sort / std::is_sorted（cppreference）\n  https://en.cppreference.com/w/cpp/algorithm/sort\n- C 语言 qsort（cppreference C 版，作为对照）\n  https://en.cppreference.com/w/c/algorithm/qsort\n- Rust slice::sort（稳定 TimSort）与 sort_unstable（模式击败快速排序）\n  https://doc.rust-lang.org/std/primitive.slice.html#method.sort\n  https://doc.rust-lang.org/std/primitive.slice.html#method.sort_unstable\n- Rust slice::copy_from_slice\n  https://doc.rust-lang.org/std/primitive.slice.html#method.copy_from_slice\n"};
</script>

<script>
/* ==================== 02-core.js ==================== */
/* =====================================================================
 * 数据结构动画实验室 · 内核
 * 提供：代码高亮 / 代码块 / 动画播放器 / 键控 DOM 复用 / 指针动画 / 路由
 * ===================================================================== */
(function () {
'use strict';

const topics = [];
const DSV = {};
window.DSV = DSV;

/* ------------------------- 基础工具 ------------------------- */
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function h(str) {
  const t = document.createElement('template');
  t.innerHTML = String(str).trim();
  return t.content.firstElementChild;
}
function svgEl(tag, attrs, text) {
  const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  return e;
}
function html(node, str) { node.innerHTML = str; return node; }

/* ------------------------- 语法高亮 ------------------------- */
/* ---- C / C++ / Rust 关键字与标准库标识符 ---- */
const C_KW = 'auto|break|case|char|const|continue|default|do|double|else|enum|extern|float|for|goto|if|inline|int|long|register|restrict|return|short|signed|sizeof|static|struct|switch|typedef|union|unsigned|void|volatile|while|_Bool|_Noreturn|_Static_assert';
const CXX_KW = C_KW + '|alignas|alignof|and|and_eq|asm|bitand|bitor|catch|class|compl|concept|consteval|constexpr|constinit|const_cast|co_await|co_return|co_yield|decltype|delete|dynamic_cast|explicit|export|false|friend|mutable|namespace|new|noexcept|not|not_eq|nullptr|operator|or|or_eq|override|private|protected|public|reinterpret_cast|requires|static_assert|static_cast|template|this|thread_local|throw|true|try|typeid|typename|using|virtual|xor|xor_eq|final';
const RS_KW = 'as|async|await|break|const|continue|crate|dyn|else|enum|extern|fn|for|if|impl|in|let|loop|match|mod|move|mut|pub|ref|return|self|Self|static|struct|super|trait|type|unsafe|use|where|while';
const C_BI = 'printf|fprintf|sprintf|snprintf|puts|fputs|putchar|fopen|fclose|fgets|malloc|calloc|realloc|free|memcpy|memmove|memset|memcmp|strlen|strcmp|strncmp|strcpy|strncpy|strchr|strstr|assert|exit|NULL|size_t|ptrdiff_t|FILE|stdin|stdout|stderr|int8_t|int16_t|int32_t|int64_t|uint8_t|uint16_t|uint32_t|uint64_t|bool|true|false';
const CXX_BI = C_BI + '|std|cout|cin|cerr|clog|endl|vector|array|string|string_view|span|unique_ptr|shared_ptr|weak_ptr|make_unique|make_shared|move|forward|swap|sort|stable_sort|partial_sort|nth_element|push_heap|pop_heap|make_heap|sort_heap|deque|list|forward_list|unordered_map|unordered_set|map|set|optional|nullopt|pair|make_pair|initializer_list|runtime_error|out_of_range|invalid_argument|logic_error|length_error|numeric_limits|ostream|istream|template|typename|size_t|ptrdiff_t';
const RS_BI = 'Vec|String|Option|Some|None|Result|Ok|Err|Box|Rc|Arc|RefCell|Cell|HashMap|HashSet|BTreeMap|BTreeSet|VecDeque|BinaryHeap|usize|isize|u8|u16|u32|u64|u128|i8|i16|i32|i64|i128|f32|f64|bool|char|str|Clone|Copy|Debug|Default|PartialEq|Eq|PartialOrd|Ord|Hash|Iterator|IntoIterator|From|Into|TryFrom|TryInto|Display|Drop|Write|Read|ToString|len|push|pop|new|with_capacity|iter|into_iter|unwrap|expect|as_deref|as_ref|take|is_none|is_some|is_empty|to_string|to_owned|clone|from|capacity|reserve|swap|sort|sort_unstable|binary_search';

const RULES = {
  c: [
    ['com', /\/\/[^\n]*|\/\*[\s\S]*?\*\//],
    ['pre', /#[ \t]*[a-zA-Z_]+/],
    ['str', /"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'/],
    ['num', /\b(?:0[xXbB][0-9a-fA-F_]+|\d[\d_]*(?:\.[\d_]+)?(?:[eE][+-]?\d+)?)(?:[uUlLfF]{0,3}|(?:u|i|f)(?:8|16|32|64|128|size))?\b/],
    ['kw', new RegExp('\\b(?:' + C_KW + ')\\b')],
    ['bi', new RegExp('\\b(?:' + C_BI + ')\\b')],
    ['cls', /\b[A-Z][A-Za-z0-9_]*\b/],
    ['fn', /[A-Za-z_][A-Za-z0-9_]*(?=\s*\()/],
    ['op', /[{}()\[\];,.=+\-*/%<>!&|?:^~]+/]
  ],
  cpp: [
    ['com', /\/\/[^\n]*|\/\*[\s\S]*?\*\//],
    ['pre', /#[ \t]*[a-zA-Z_]+/],
    ['str', /R"\([\s\S]*?\)"|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'/],
    ['num', /\b(?:0[xXbB][0-9a-fA-F_]+|\d[\d_]*(?:\.[\d_]+)?(?:[eE][+-]?\d+)?)(?:[uUlLfF]{0,3}|(?:u|i|f)(?:8|16|32|64|128|size))?\b/],
    ['kw', new RegExp('\\b(?:' + CXX_KW + ')\\b')],
    ['bi', new RegExp('\\b(?:' + CXX_BI + ')\\b')],
    ['cls', /\b[A-Z][A-Za-z0-9_]*\b/],
    ['fn', /[A-Za-z_][A-Za-z0-9_]*(?=\s*\()/],
    ['op', /[{}()\[\];,.=+\-*/%<>!&|?:^~]+/]
  ],
  rs: [
    ['com', /\/\/[^\n]*|\/\*[\s\S]*?\*\//],
    ['chr', /b?'(?:\\.|[^'\\\n])'/],
    ['str', /b?"(?:\\.|[^"\\\n])*"|r#*"[\s\S]*?"#*/],
    ['life', /'[a-zA-Z_][a-zA-Z0-9_]*/],
    ['num', /\b(?:0[xXbB][0-9a-fA-F_]+|\d[\d_]*(?:\.[\d_]+)?(?:[eE][+-]?\d+)?)(?:[uUlLfF]{0,3}|(?:u|i|f)(?:8|16|32|64|128|size))?\b/],
    ['kw', new RegExp('\\b(?:' + RS_KW + ')\\b')],
    ['mac', /[a-z_][a-z0-9_]*!/],
    ['attr', /#!?\[[^\]]*\]/],
    ['bi', new RegExp('\\b(?:' + RS_BI + ')\\b')],
    ['cls', /\b[A-Z][A-Za-z0-9_]*\b/],
    ['fn', /[A-Za-z_][A-Za-z0-9_]*(?=\s*\()/],
    ['op', /[{}()\[\];,.=+\-*/%<>!&|?:^~#]+/]
  ]
};
const COMPILED = {};
function compiled(lang) {
  if (!COMPILED[lang]) {
    const rs = RULES[lang] || RULES.cpp;
    COMPILED[lang] = { re: new RegExp(rs.map(r => '(' + r[1].source + ')').join('|'), 'g'), cls: rs.map(r => r[0]) };
  }
  return COMPILED[lang];
}
function hl(code, lang) {
  lang = normLang(lang);
  const c = compiled(lang), re = c.re, cls = c.cls;
  let out = '', last = 0, m;
  re.lastIndex = 0;
  while ((m = re.exec(code)) !== null) {
    if (m.index > last) out += esc(code.slice(last, m.index));
    let gi = 1;
    while (gi < m.length && m[gi] === undefined) gi++;
    out += '<span class="tok-' + (cls[gi - 1] || 'op') + '">' + esc(m[0]) + '</span>';
    last = m.index + m[0].length;
    if (m[0] === '') re.lastIndex++;
  }
  out += esc(code.slice(last));
  return out;
}
function pyStr(q) { return q; }

const LANG_ALIAS = { c: 'c', cpp: 'cpp', 'c++': 'cpp', cxx: 'cpp', cc: 'cpp', rs: 'rs', rust: 'rs' };
const LANG_LABEL = { c: 'C', cpp: 'C++', rs: 'Rust' };
const LANG_ORDER = ['c', 'cpp', 'rs'];
function normLang(l) { return LANG_ALIAS[String(l == null ? '' : l).toLowerCase()] || 'cpp'; }

let codeSeq = 0;
function paneHtml(lang, name, src, i) {
  const l = normLang(lang);
  return '<div class="pane' + (i === 0 ? ' active' : '') + '" data-pane="' + i + '">' +
    '<div class="codebar"><span class="lang">' + LANG_LABEL[l] + '</span>' +
    (name ? '<span class="fname">' + esc(name) + '</span>' : '') +
    '<span class="sp"></span><button class="copybtn" data-copy>复制代码</button></div>' +
    '<pre class="code"><code>' + hl(src, l) + '</code></pre></div>';
}
function code(src, lang, name) {
  const l = normLang(lang);
  return '<div class="codebox"><div class="codebar"><span class="lang">' + LANG_LABEL[l] + '</span>' +
    (name ? '<span class="fname">' + esc(name) + '</span>' : '') +
    '<span class="sp"></span><button class="copybtn" data-copy>复制代码</button></div>' +
    '<pre class="code"><code>' + hl(src, l) + '</code></pre></div>';
}
function codeTabs(items) {
  const id = 'cb' + (++codeSeq);
  const tabs = items.map((it, i) => '<button class="codetab' + (i === 0 ? ' active' : '') + '" data-pane="' + i + '">' +
    esc(it.label || LANG_LABEL[normLang(it.lang)]) + '</button>').join('');
  const panes = items.map((it, i) => paneHtml(it.lang, it.name, it.code, i)).join('');
  return '<div class="codebox" id="' + id + '" data-tabs><div class="codetabs">' + tabs + '</div>' + panes + '</div>';
}

/* 练习答案：一个迷你语言切换块，和主代码共用同一个全局语言偏好 */
const EX_DATA = window.DSV_EX || {};
function answerFor(topic, i) {
  const arr = EX_DATA[topic];
  if (!arr || !arr[i]) return '';
  return answer(arr[i]);
}
function answer(codes) {
  const cur = currentLang();
  let h = '<div class="codelang" data-topic="ans"><span class="cl-label">答案</span>';
  LANG_ORDER.forEach(function (l) {
    if (!codes[l]) return;
    h += '<button class="langtab' + (l === cur ? ' active' : '') + '" data-lang="' + l + '">' + LANG_LABEL[l] + '</button>';
  });
  h += '</div><div class="stepblocks" data-topic="ans">';
  LANG_ORDER.forEach(function (l) {
    if (!codes[l]) return;
    h += '<div class="stepgroup' + (l === cur ? '' : ' off') + '" data-lang="' + l + '">' +
      '<div class="cstep" style="margin-bottom:10px"><div class="codebox">' +
      '<div class="codebar"><span class="lang">' + LANG_LABEL[l] + '</span><span class="sp"></span>' +
      '<button class="copybtn" data-copy>复制</button></div>' +
      '<pre class="code"><code>' + hl(codes[l], l) + '</code></pre></div></div></div>';

}

/* ------------------- 资料来源（教材 / 官方文档 / 标准库源码） ------------------- */
const SRC_DATA = window.DSV_SOURCES || {};
function cleanUrl(u) { return String(u).replace(/[）,.;：:]+$/, ''); }
function shortUrl(u) {
  const s = u.replace(/^https?:\/\//, '').replace(/\/$/, '');
  return s.length > 58 ? s.slice(0, 55) + '...' : s;
}
function sources(topic) {
  const raw = SRC_DATA[topic];
  if (!raw) return '';
  const items = [];
  let cur = null;
  raw.split('\n').forEach(function (line) {
    const t = line.trim();
    if (!t || t.charAt(0) === '#') return;
    const item = t.match(/^(?:[-*]|\d+[.、)])\s*(.*)$/);
    if (item) {
      let text = item[1].trim();
      let url = '';
      const m = text.match(/^(.*)[：:]\s*(https?:\/\/\S+)$/);
      if (m) { text = m[1]; url = cleanUrl(m[2]); }
      cur = { text: text, urls: url ? [url] : [] };
      items.push(cur);
      return;
    }
    const urls = t.match(/https?:\/\/[^\s）)】>]+/g);
    if (urls && urls.length && cur) {
      urls.forEach(function (u) { u = cleanUrl(u); if (u && cur.urls.indexOf(u) < 0) cur.urls.push(u); });
    } else if (cur && !cur.urls.length) {
      cur.text += ' ' + t;
    }
  });
  if (!items.length) return '';
  const li = items.map(function (it) {
    return '<li><span class="src-t">' + esc(it.text) + '</span>' +
      it.urls.map(function (u) {
        return '<br><a href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(shortUrl(u)) + '</a>';
      }).join('') + '</li>';
  }).join('');
  return '<details class="srcbox"><summary>📚 资料来源（教材 / 官方文档 / 标准库源码）</summary><ul>' +
    li + '</ul><p class="src-note">这一节的每一份实现都对照过上面这些来源写的，不是凭印象硬凑的。</p></details>';
}

function currentLang() {

/* ------------------- 分步代码块：一个语言切换器管住一整段 ------------------- */
const CODE_DATA = window.DSV_CODE_DATA || {};
function codeSteps(topic) {
  const data = CODE_DATA[topic];
  if (!data) return note('warn', '代码缺失', '尚未生成 ' + esc(topic) + ' 的代码数据。');
  const cur = currentLang();

  LANG_ORDER.forEach(function (l) {

      '<i>' + n + '</i></button>';
  });

  h += '<div class="stepblocks" data-topic="' + topic + '">';
  LANG_ORDER.forEach(function (l) {
    const entry = data[l];
    if (!entry) return;
    h += '<div class="stepgroup' + (l === cur ? '' : ' off') + '" data-lang="' + l + '">';
    h += '<div class="sg-hint">共 <b>' + entry.steps.length + '</b> 步 · 从上到下一步步来，' +
      '全部拼起来就是一份完整的 <b>' + esc(entry.file) + '</b></div>';
    entry.steps.forEach(function (s, i) {
      h += '<div class="cstep"><div class="cstep-head"><span class="cstep-no">' + (i + 1) + '</span><b>' + esc(s.title) + '</b>' +
        (s.note ? '<span class="cstep-note">' + esc(s.note) + '</span>' : '') + '</div>' +
        '<div class="codebox"><div class="codebar"><span class="lang">' + LANG_LABEL[l] + '</span>' +
        '<span class="fname">' + esc(entry.file) + '</span><span class="sp"></span>' +
        '<button class="copybtn" data-copy>复制这段</button></div>' +
        '<pre class="code"><code>' + hl(s.code, l) + '</code></pre></div></div>';
    });
    h += '</div>';
  });
  h += '</div>';
  return h;
}
document.addEventListener('click', function (e) {
  const t = e.target;
  if (!t || !t.closest) return;
  const lt = t.closest('.langtab');
  if (lt) { applyLang(lt.dataset.lang); return; }
  const ca = t.closest('[data-copyall]');
  if (ca) {
    const entry = (CODE_DATA[ca.dataset.copyall] || {})[currentLang()];
    if (entry) {
      const text = entry.steps.map(s => s.code).join('\n\n') + '\n';
      const done = () => { ca.textContent = '✓ 已复制完整程序'; setTimeout(() => { ca.textContent = '⧉ 复制完整程序'; }, 1600); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => fallback(text, done));
      else fallback(text, done);
    }
    return;
  }
  const tab = t.closest('.codetab');
  if (tab) {
    const box = tab.closest('[data-tabs]');
    Array.prototype.forEach.call(box.querySelectorAll('.codetab'), b => b.classList.toggle('active', b === tab));
    Array.prototype.forEach.call(box.querySelectorAll('.pane'), p => p.classList.toggle('active', p.dataset.pane === tab.dataset.pane));
    return;
  }
  const cp = t.closest('[data-copy]');
  if (cp) {
    const pane = cp.closest('.pane') || cp.closest('.codebox');
    const src = pane.querySelector('code').innerText;
    const done = () => { cp.textContent = '已复制 ✓'; cp.classList.add('ok'); setTimeout(() => { cp.textContent = '复制代码'; cp.classList.remove('ok'); }, 1400); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(src).then(done, () => fallback(src, done));
    else fallback(src, done);
  }
});
function fallback(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch (e) {}
  ta.remove();
}

/* ------------------------- 键控复用 + 幽灵动画 ------------------------- */
function fxOf(parent) {
  if (!parent.__fx) {
    if (getComputedStyle(parent).position === 'static') parent.style.position = 'relative';
    const d = document.createElement('div');
    d.className = 'fxlayer';
    d.style.cssText = 'position:absolute;inset:0;pointer-events:none;overflow:visible;';
    parent.appendChild(d);
    parent.__fx = d;
  }
  return parent.__fx;
}
function ghost(parent, node) {
  const pr = parent.getBoundingClientRect(), r = node.getBoundingClientRect();
  const g = node.cloneNode(true);
  g.classList.add('exit'); g.classList.remove('enter');
  g.style.cssText += ';position:absolute;left:' + (r.left - pr.left) + 'px;top:' + (r.top - pr.top) +
    'px;width:' + r.width + 'px;height:' + r.height + 'px;margin:0;';
  fxOf(parent).appendChild(g);
  setTimeout(() => g.remove(), 340);
}
function reconcile(parent, items, keyFn, create, update) {
  const prev = new Map();
  Array.prototype.forEach.call(parent.children, c => { if (c.__k !== undefined) prev.set(c.__k, c); });
  const next = [];
  items.forEach((it, idx) => {
    const k = String(keyFn(it, idx));
    let node = prev.get(k), fresh = false;
    if (node) prev.delete(k);
    else {
      node = create(it, idx);
      node.__k = k;
      fresh = true;
    }
    if (update) update(node, it, idx);
    if (fresh) {
      node.classList.add('enter');
      setTimeout(() => node.classList.remove('enter'), 380);
    }
    next.push(node);
  });
  prev.forEach(node => { ghost(parent, node); node.remove(); });
  let ref = parent.__fx || null;
  for (let n = next.length - 1; n >= 0; n--) { parent.insertBefore(next[n], ref); ref = next[n]; }
}

/* ------------------------- 指针动画 ------------------------- */
function ptr(view, label, cls) {
  const p = document.createElement('div');
  p.className = 'ptr' + (cls ? ' ' + cls : '');
  p.textContent = label;
  p.style.transition = 'none';
  p.style.opacity = '0';
  view.appendChild(p);
  requestAnimationFrame(() => { p.style.transition = ''; });
  return p;
}
function placePtr(p, target, view, dx, dy) {
  if (!target) { p.style.opacity = '0'; return; }
  const t = target.getBoundingClientRect(), s = view.getBoundingClientRect();
  const x = t.left - s.left + t.width / 2 - p.offsetWidth / 2 + (dx || 0);
  const y = t.top - s.top + t.height + (dy == null ? 3 : dy);
  p.style.transform = 'translate(' + x + 'px,' + y + 'px)';
  p.style.opacity = '1';
}
function hidePtr(p) { p.style.opacity = '0'; }

/* ------------------------- 动画播放器 ------------------------- */
const liveLabs = [];
function lab(host, opts) {
  const steps = opts.steps || [];
  const view = el('div', 'lab-view');
  if (opts.height) view.style.height = opts.height + 'px';
  const ctx = (opts.setup ? opts.setup(view) : {}) || {};
  ctx.view = view;
  view.appendChild(fxOf(view));
  ctx.fx = view.__fx;

  const expl = el('div', 'lab-explain');
  expl.innerHTML = '<span class="stepno">1/' + steps.length + '</span><span class="steptext"></span>';
  const stepno = expl.querySelector('.stepno'), steptext = expl.querySelector('.steptext');

  const list = el('ol', 'step-list');
  steps.forEach((s, i) => {
    const li = el('li', 'step-item');
    li.innerHTML = '<span class="sn">' + (i + 1) + '</span><span>' + esc(s.text) + '</span>';
    li.addEventListener('click', () => api.go(i));
    list.appendChild(li);
  });

  const bar = el('div', 'lab-bar');
  bar.innerHTML = '<span class="lab-title">' + esc(opts.title || '动画演示') + '</span><div class="lab-tools"></div>';
  const tools = bar.querySelector('.lab-tools');
  (opts.tools || []).forEach(t => {
    const b = el('button', 'btn ghost', t.label);
    b.addEventListener('click', () => t.on(ctx, api, view));
    tools.appendChild(b);
  });

  const ctrl = el('div', 'lab-ctrl');
  ctrl.innerHTML =
    '<button class="btn" data-act="prev">◀ 上一步</button>' +
    '<button class="btn primary" data-act="play">▶ 播放</button>' +
    '<button class="btn" data-act="next">下一步 ▶</button>' +
    '<button class="btn" data-act="reset">⟲ 重置</button>' +
    '<label class="speed">速度 <input type="range" min="0.5" max="4" step="0.5" value="1"><span class="sp">1×</span></label>' +
    '<button class="btn ghost" data-act="list">步骤列表 ▾</button>' +
    '<span class="lab-count">1 / ' + steps.length + '</span>';
  const playBtn = ctrl.querySelector('[data-act="play"]');
  const prevBtn = ctrl.querySelector('[data-act="prev"]');
  const nextBtn = ctrl.querySelector('[data-act="next"]');
  const countEl = ctrl.querySelector('.lab-count');
  const range = ctrl.querySelector('input');
  const spLabel = ctrl.querySelector('.sp');

  const wrap = el('div', 'lab');
  wrap.appendChild(bar); wrap.appendChild(view); wrap.appendChild(expl); wrap.appendChild(ctrl); wrap.appendChild(list);
  host.appendChild(wrap);

  let i = 0, playing = false, timer = null, speed = 1;

  function paint() {
    const s = steps[i];
    if (opts.draw) opts.draw(ctx, s, i, api);
    stepno.textContent = (i + 1) + '/' + steps.length;
    steptext.textContent = s.text;
    countEl.textContent = (i + 1) + ' / ' + steps.length;
    prevBtn.disabled = i === 0;
    nextBtn.disabled = i === steps.length - 1;
    Array.prototype.forEach.call(list.children, (li, k) => li.classList.toggle('active', k === i));
    const act = list.children[i];
    if (act && list.classList.contains('open')) act.scrollIntoView({ block: 'nearest' });
  }
  function schedule() {
    clearTimeout(timer);
    if (!playing) return;
    if (i >= steps.length - 1) { api.pause(); return; }
    const ms = (steps[i].ms || 1050) / speed;
    timer = setTimeout(() => { i++; paint(); schedule(); }, ms);
  }
  function setPlaying(v) {
    playing = v;
    playBtn.textContent = v ? '❚❚ 暂停' : '▶ 播放';
  }
  const api = {
    get index() { return i; },
    get playing() { return playing; },
    go(n) {
      const t = Math.max(0, Math.min(steps.length - 1, n));
      i = t;
      if (playing && i >= steps.length - 1) setPlaying(false);
      paint(); schedule();
    },
    next() { api.go(i + 1); },
    prev() { api.go(i - 1); },
    play() { if (i >= steps.length - 1) i = -1; setPlaying(true); paint(); schedule(); },
    pause() { setPlaying(false); clearTimeout(timer); },
    toggle() { playing ? api.pause() : api.play(); },
    reset() { api.pause(); i = 0; paint(); },
    autoplay(interval, limit) {
      api.pause(); i = 0; setPlaying(true); paint();
      let n = 0; const total = limit == null ? steps.length : limit;
      clearTimeout(timer);
      (function tick() {
        if (n >= total - 1) { setPlaying(false); return; }
        timer = setTimeout(() => { n++; i = n; paint(); schedule2(); }, interval || 600);
        function schedule2() { tick(); }
      })();
    },
    element: wrap
  };
  playBtn.addEventListener('click', api.toggle);
  prevBtn.addEventListener('click', api.prev);
  nextBtn.addEventListener('click', api.next);
  ctrl.querySelector('[data-act="reset"]').addEventListener('click', api.reset);
  ctrl.querySelector('[data-act="list"]').addEventListener('click', function () {
    list.classList.toggle('open');
    this.textContent = list.classList.contains('open') ? '步骤列表 ▴' : '步骤列表 ▾';
  });
  range.addEventListener('input', () => { speed = parseFloat(range.value); spLabel.textContent = speed + '×'; });

  paint();
  liveLabs.push(api);
  return api;
}

document.addEventListener('keydown', function (e) {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'summary') return;
  const labs = Array.prototype.slice.call(document.querySelectorAll('.lab'));
  const vis = labs.find(l => { const r = l.getBoundingClientRect(); return r.top < innerHeight * 0.75 && r.bottom > 120; });
  if (!vis) return;
  const api = liveLabs[labs.indexOf(vis)];
  if (!api) return;
  if (e.key === 'ArrowRight') { api.next(); e.preventDefault(); }
  else if (e.key === 'ArrowLeft') { api.prev(); e.preventDefault(); }
  else if (e.key === ' ') { api.toggle(); e.preventDefault(); }
});

/* ------------------------- 主题注册与路由 ------------------------- */
function register(t) { topics.push(t); }
function sorted() { return topics.slice().sort((a, b) => (a.order || 500) - (b.order || 500)); }
function progressList() {
  try { return JSON.parse(localStorage.getItem('dsv-done') || '[]'); } catch (e) { return []; }
}
function markDone(id, v) {
  const l = progressList().filter(x => x !== id);
  if (v) l.push(id);
  try { localStorage.setItem('dsv-done', JSON.stringify(l)); } catch (e) {}
  refreshNav();
}
function refreshNav() {
  const done = progressList();
  Array.prototype.forEach.call(document.querySelectorAll('.navlink'), a => a.classList.toggle('finished', done.indexOf(a.dataset.id) >= 0));
  const list = sorted().filter(t => !t.special);
  document.getElementById('doneCount').textContent = done.filter(x => list.some(t => t.id === x)).length;
  document.getElementById('totalCount').textContent = list.length;
}
function buildNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  let group = null;
  sorted().forEach(t => {
    if (t.group !== group) {
      group = t.group;
      if (group) nav.appendChild(el('div', 'navgroup', group));
    }
    const a = el('a', 'navlink');
    a.href = '#/' + t.id;
    a.dataset.id = t.id;
    a.dataset.search = (t.title + ' ' + (t.keywords || '') + ' ' + (t.group || '') + ' ' + t.id).toLowerCase();
    a.innerHTML = '<span class="ico">' + t.icon + '</span><span>' + esc(t.title) + '</span><span class="done">✓</span>';
    nav.appendChild(a);
  });
  refreshNav();
}
function renderDoc(t) {
  const doc = document.getElementById('doc');
  doc.innerHTML = '';
  const list = sorted();
  const pos = list.indexOf(t);
  if (!t.special) {
    const hero = el('div', 'hero');
    hero.style.padding = '8px 4px 0';
    hero.innerHTML = '<h1>' + t.icon + ' ' + esc(t.title) + '</h1><p>' + (t.lead || '') + '</p>';
    doc.appendChild(hero);
  }
  try {
    t.build(doc);
  } catch (err) {
    const box = el('div', 'card');
    box.style.borderColor = 'rgba(255,107,129,.5)';
    box.innerHTML = '<h2>⚠️ 这一节渲染出错了</h2><p class="lead">其他章节不受影响，可以直接从左侧切换。</p>' +
      '<pre class="code"><code>' + esc(String(err && err.stack ? err.stack : err)) + '</code></pre>';
    doc.appendChild(box);
    if (window.console) console.error('[DSV] build failed for topic', t.id, err);
  }
  if (!t.special) {
    const bar = el('div', 'donebar');
    const done = progressList().indexOf(t.id) >= 0;
    const btn = el('button', 'donebtn' + (done ? ' done' : ''), done ? '✓ 已通关' : '☐ 标记为已掌握');
    btn.addEventListener('click', () => {
      const now = progressList().indexOf(t.id) < 0;
      markDone(t.id, now);
      btn.classList.toggle('done', now);
      btn.textContent = now ? '✓ 已通关' : '☐ 标记为已掌握';
    });
    bar.appendChild(btn);
    const pager = el('div', 'pager');
    const prev = list.slice(0, pos).reverse().find(x => !x.special);
    const next = list.slice(pos + 1).find(x => !x.special);
    if (prev) pager.insertAdjacentHTML('beforeend', '<a href="#/' + prev.id + '">← ' + esc(prev.title) + '</a>');
    if (next) pager.insertAdjacentHTML('beforeend', '<a href="#/' + next.id + '">' + esc(next.title) + ' →</a>');
    bar.appendChild(pager);
    doc.appendChild(bar);
  }
  const cur = document.querySelector('.navlink[data-id="' + t.id + '"]');
  Array.prototype.forEach.call(document.querySelectorAll('.navlink'), a => a.classList.toggle('active', a === cur));
  document.getElementById('crumbs').innerHTML = t.special ? '<b>' + esc(t.title) + '</b>'
    : esc(t.group || '') + ' / <b>' + esc(t.title) + '</b>';
  document.title = t.title + ' · 数据结构动画实验室';
  document.getElementById('sidebar').classList.remove('open');
  window.scrollTo(0, 0);
}

<script>
