   fn head_index(&self) -> usize {\n        self.head\n    }\n\n    fn tail_index(&self) -> usize {\n        self.tail\n    }\n\n    /// 按「队首到队尾」的逻辑顺序遍历，跳过空槽。\n    fn iter(&self) -> impl Iterator<Item = &T> + '_ {\n        let size = self.len();\n        (0..size).filter_map(move |i| self.buf[(self.head + i) % self.slots()].as_ref())\n    }\n}"},{"title":"main：跑一遍","note":"让 tail 从 4 回绕到 0，并用 VecDeque 做工程写法对照","code":"use std::collections::VecDeque;\nuse std::fmt::Debug;\n\nfn dump<T: Debug>(tag: &str, q: &RingQueue<T>) {\n    let items: Vec<&T> = q.iter().collect();\n    println!(\n        \"{:<18} size={} head={} tail={} | front->back: {:?}\",\n        tag,\n        q.len(),\n        q.head_index(),\n        q.tail_index(),\n        items\n    );\n}\n\nfn main() {\n    let mut q: RingQueue<i32> = RingQueue::new(4); // 容量 4，底层 5 个槽位\n    println!(\"capacity={} slots={} (牺牲一格)\", q.capacity(), q.slots());\n    dump(\"init\", &q);\n\n    // 阶段一：一路入队到满，tail 从 0 走到 4\n    for v in 1..=5 {\n        let ok = q.enqueue(v);\n        println!(\n            \"enqueue({:<2}) -> {:<5} | head={} tail={} size={}\",\n            v,\n            ok.is_ok(),\n            q.head_index(),\n            q.tail_index(),\n            q.len()\n        );\n    }\n\n    // 阶段二：出队两个，腾出队首空间\n    for _ in 0..2 {\n        let v = q.dequeue();\n        println!(\n            \"dequeue()    -> value={:<2} | head={} tail={} size={}\",\n            v.map_or_else(|| \"none\".to_string(), |x| x.to_string()),\n            q.head_index(),\n            q.tail_index(),\n            q.len()\n        );\n    }\n\n    // 阶段三：再入队两个，tail 从 4 回绕到 0，这是环形队列的关键一步\n    for v in 6..=7 {\n        let ok = q.enqueue(v);\n        println!(\n            \"enqueue({:<2}) -> {:<5} | head={} tail={} size={}\",\n            v,\n            ok.is_ok(),\n            q.head_index(),\n            q.tail_index(),\n            q.len()\n        );\n    }\n    dump(\"after wrap\", &q);\n    println!(\"enqueue(8)  -> {} (判满生效)\", q.enqueue(8).is_ok());\n    println!(\"front() = {:?}\", q.front());\n\n    // 阶段四：全部出队，验证先进先出\n    let mut drained = Vec::new();\n    while let Some(v) = q.dequeue() {\n        drained.push(v);\n    }\n    println!(\"FIFO drain: {:?}\", drained);\n    println!(\n        \"drained: is_empty={} size={}\",\n        q.is_empty(),\n        q.len()\n    );\n    println!(\"dequeue on empty -> {:?}\", q.dequeue());\n\n    // 对照：同样的事情，工程上用 VecDeque 一行搞定，容量还会自动增长\n    let mut dq: VecDeque<i32> = VecDeque::new();\n    for v in 1..=5 {\n        dq.push_back(v); // 第 5 个不会失败，VecDeque 自己扩容\n    }\n    let a = dq.pop_front();\n    let b = dq.pop_front();\n    dq.push_back(6);\n    dq.push_back(7);\n    println!(\n        \"VecDeque 对照: push_back(5) 成功(自动扩容), pop_front={:?}/{:?}, 内容: {:?}\",\n        a, b, dq\n    );\n}"}]}},"hash":{"c":{"file":"hash.c","steps":[{"title":"桶与节点结构","note":"拉链法的链表节点与桶数组骨架","code":"#include <stdio.h>\n#include <stdlib.h>\n#include <stdbool.h>\n#include <string.h>\n#include <stdint.h>\n#include <assert.h>\n\n#define HASH_INIT_BUCKETS 4u    /* 初始桶数 */\n#define HASH_MAX_LOAD     0.75  /* 负载因子阈值：插入后超过它就扩容并 rehash */\n\n/* 拉链法的节点：落在同一个桶里的键值对串成一条单向链表 */\ntypedef struct Entry {\n    char         *key;   /* 堆上拷贝的键，生命周期归本节点所有 */\n    int           val;\n    struct Entry *next;  /* 同桶后继 */\n} Entry;\n\n/* 哈希表：桶数组 + 元素计数 */\ntypedef struct {\n    Entry **buckets;      /* 长度为 bucket_count 的指针数组，每个元素是一条链的头指针 */\n    size_t  bucket_count;\n    size_t  size;         /* 已存键值对个数，负载因子的分子 */\n} HashMap;\n\n/* 节点构造/析构：把「键必须自己拷贝一份」这件事收敛在两个函数里 */\nstatic Entry *entry_new(const char *key, int val)\n{\n    Entry *e = (Entry *)malloc(sizeof(Entry));\n    if (e == NULL) {\n        return NULL;\n    }\n    size_t n = strlen(key) + 1;           /* 连结尾的 '\\0' 一起拷 */\n    e->key = (char *)malloc(n);\n    if (e->key == NULL) {\n        free(e);                          /* 分配失败要回收已经拿到的内存 */\n        return NULL;\n    }\n    memcpy(e->key, key, n);               /* 不用 strdup：它是 POSIX，MSVC 上叫 _strdup */\n    e->val  = val;\n    e->next = NULL;\n    return e;\n}\n\nstatic void entry_free(Entry *e)\n{\n    if (e == NULL) {\n        return;\n    }\n    free(e->key);\n    free(e);\n}"},{"title":"哈希函数","note":"FNV-1a 64 位，把字符串摊到 bucket_count 个桶上","code":"static size_t hash_key(const char *key)\n{\n    /* FNV-1a：先异或再乘，乘数是 FNV 规范给定的素数；\n       offset basis 与 prime 见 SOURCES.md 里的 FNV 参考页。 */\n    uint64_t h = 1469598103934665603ULL;  /* 0xcbf29ce484222325 */\n    for (const unsigned char *p = (const unsigned char *)key; *p != '\\0'; ++p) {\n        h ^= (uint64_t)(*p);\n        h *= 1099511628211ULL;            /* 0x100000001b3，自然回绕等价于 mod 2^64 */\n    }\n    return (size_t)h;\n}\n\n/* 桶号 = 哈希值 mod 桶数。桶数取 2 的幂时这里可以改成位与，但取模对任意桶数都成立。 */\nstatic size_t hash_index(const HashMap *m, const char *key)\n{\n    return hash_key(key) % m->bucket_count;\n}"},{"title":"初始化与销毁","note":"桶数组清零分配，销毁时逐链释放每个节点","code":"bool hash_init(HashMap *m)\n{\n    if (m == NULL) {\n        return false;\n    }\n    Entry **buckets = (Entry **)calloc(HASH_INIT_BUCKETS, sizeof(Entry *));  /* calloc 直接给 NULL 头 */\n    if (buckets == NULL) {\n        return false;\n    }\n    m->buckets      = buckets;\n    m->bucket_count = HASH_INIT_BUCKETS;\n    m->size         = 0;\n    return true;\n}\n\nsize_t hash_size(const HashMap *m)\n{\n    assert(m != NULL);\n    return m->size;\n}\n\nsize_t hash_bucket_count(const HashMap *m)\n{\n    assert(m != NULL);\n    return m->bucket_count;\n}\n\ndouble hash_load(const HashMap *m)\n{\n    assert(m != NULL);\n    return (double)m->size / (double)m->bucket_count;   /* 负载因子 = 元素数 / 桶数 */\n}\n\nvoid hash_free(HashMap *m)\n{\n    if (m == NULL || m->buckets == NULL) {\n        return;\n    }\n    for (size_t i = 0; i < m->bucket_count; ++i) {\n        Entry *e = m->buckets[i];\n        while (e != NULL) {\n            Entry *next = e->next;        /* 先记住后继，再释放当前节点 */\n            entry_free(e);\n            e = next;\n        }\n    }\n    free(m->buckets);\n    m->buckets      = NULL;\n    m->bucket_count = 0;\n    m->size         = 0;\n}"},{"title":"插入或更新 put","note":"负载因子超阈值先扩容 rehash，再头插新节点或覆盖旧值","code":"/* 扩容：申请新桶数组，把旧链上的节点重新挂到新桶里。\n   只搬指针，不拷贝键，所以不会因为 rehash 失败而丢数据。 */\nstatic bool hash_rehash(HashMap *m, size_t new_count)\n{\n    Entry **fresh = (Entry **)calloc(new_count, sizeof(Entry *));\n    if (fresh == NULL) {\n        return false;                     /* 扩容失败：表保持原样，插入由调用者决定 */\n    }\n    for (size_t i = 0; i < m->bucket_count; ++i) {\n        Entry *e = m->buckets[i];\n        while (e != NULL) {\n            Entry *next = e->next;\n            size_t idx = hash_key(e->key) % new_count;\n            e->next = fresh[idx];         /* 头插到新桶 */\n            fresh[idx] = e;\n            e = next;\n        }\n    }\n    free(m->buckets);\n    m->buckets      = fresh;\n    m->bucket_count = new_count;\n    return true;\n}\n\n/* 返回值：1 = 新增，0 = 覆盖了已有键，-1 = 内存不足 */\nint hash_put(HashMap *m, const char *key, int val)\n{\n    assert(m != NULL && m->buckets != NULL && key != NULL);\n\n    /* 先判断「插入之后」的负载因子，超过阈值就把桶数翻倍 */\n    if ((double)(m->size + 1) / (double)m->bucket_count > HASH_MAX_LOAD) {\n        if (!hash_rehash(m, m->bucket_count * 2)) {\n            return -1;\n        }\n    }\n\n    size_t idx = hash_index(m, key);\n    for (Entry *e = m->buckets[idx]; e != NULL; e = e->next) {\n        if (strcmp(e->key, key) == 0) {\n            e->val = val;                 /* 键已存在：只更新值，size 不变 */\n            return 0;\n        }\n    }\n\n    Entry *e = entry_new(key, val);\n    if (e == NULL) {\n        return -1;\n    }\n    e->next = m->buckets[idx];            /* 头插 O(1)：新节点永远在链首 */\n    m->buckets[idx] = e;\n    m->size += 1;\n    return 1;\n}"},{"title":"查找 get","note":"定位桶后在链上顺序比较，未命中返回 false","code":"static Entry *hash_find(const HashMap *m, const char *key)\n{\n    if (m == NULL || m->buckets == NULL || key == NULL) {\n        return NULL;\n    }\n    for (Entry *e = m->buckets[hash_index(m, key)]; e != NULL; e = e->next) {\n        if (strcmp(e->key, key) == 0) {\n            return e;\n        }\n    }\n    return NULL;\n}\n\nbool hash_get(const HashMap *m, const char *key, int *out)\n{\n    const Entry *e = hash_find(m, key);\n    if (e == NULL) {\n        return false;\n    }\n    if (out != NULL) {\n        *out = e->val;\n    }\n    return true;\n}"},{"title":"删除 remove","note":"用二级指针在链上摘除节点，避免为头节点写特例","code":"bool hash_remove(HashMap *m, const char *key)\n{\n    assert(m != NULL && m->buckets != NULL && key != NULL);\n    size_t idx = hash_index(m, key);\n    Entry **link = &m->buckets[idx];      /* link 指向「当前节点的指针」本身 */\n    while (*link != NULL) {\n        Entry *e = *link;\n        if (strcmp(e->key, key) == 0) {\n            *link = e->next;              /* 摘链：头节点和中间节点走同一条路径 */\n            entry_free(e);\n            m->size -= 1;\n            return true;\n        }\n        link = &e->next;\n    }\n    return false;                         /* 走到链尾都没找到 */\n}"},{"title":"main：跑一遍","note":"打印扩容前后的桶数，并验证 put/get/remove","code":"static const char *hash_put_result(int rc)\n{\n    return rc == 1 ? \"inserted\" : (rc == 0 ? \"updated\" : \"oom\");\n}\n\nstatic void hash_dump(const HashMap *m, const char *tag)\n{\n    printf(\"%s: buckets=%zu size=%zu load=%.3f\\n\", tag, m->bucket_count, m->size, hash_load(m));\n    for (size_t i = 0; i < m->bucket_count; ++i) {\n        printf(\"  [%2zu]\", i);\n        for (const Entry *e = m->buckets[i]; e != NULL; e = e->next) {\n            printf(\" -> %s=%d\", e->key, e->val);\n        }\n        printf(\"\\n\");\n    }\n}\n\nint main(void)\n{\n    HashMap m;\n    if (!hash_init(&m)) {\n        fprintf(stderr, \"hash_init failed\\n\");\n        return 1;\n    }\n    printf(\"init: buckets=%zu size=%zu load=%.3f\\n\", hash_bucket_count(&m), hash_size(&m), hash_load(&m));\n\n    const char *keys[] = { \"apple\", \"banana\", \"cherry\", \"date\", \"elderberry\", \"fig\", \"grape\" };\n    const int   vals[] = { 10, 20, 30, 40, 50, 60, 70 };\n    const size_t n = sizeof(keys) / sizeof(keys[0]);\n\n    /* 依次插入 7 个键，观察负载因子超过 0.75 时桶数翻倍 */\n    for (size_t i = 0; i < n; ++i) {\n        size_t before = hash_bucket_count(&m);\n        int rc = hash_put(&m, keys[i], vals[i]);\n        printf(\"put(%-11s, %-2d) -> %-8s | buckets %zu -> %zu, size=%zu, load=%.3f\\n\",\n               keys[i], vals[i], hash_put_result(rc),\n               before, hash_bucket_count(&m), hash_size(&m), hash_load(&m));\n    }\n\n    /* 覆盖已有键：值被替换，size 不变 */\n    printf(\"put(apple, 111)    -> %s (键已存在，只改值)\\n\", hash_put_result(hash_put(&m, \"apple\", 111)));\n\n    hash_dump(&m, \"after inserts\");\n\n    const char *probes[] = { \"apple\", \"cherry\", \"kiwi\" };\n    for (size_t i = 0; i < sizeof(probes) / sizeof(probes[0]); ++i) {\n        int out = -1;\n        bool ok = hash_get(&m, probes[i], &out);\n        printf(\"get(%-7s) -> %-5s value=%d\\n\", probes[i], ok ? \"true\" : \"false\", out);\n    }\n\n    printf(\"remove(banana) -> %s\\n\", hash_remove(&m, \"banana\") ? \"true\" : \"false\");\n    printf(\"remove(banana) -> %s (重复删除应为 false)\\n\", hash_remove(&m, \"banana\") ? \"true\" : \"false\");\n    printf(\"remove(kiwi)   -> %s (不存在的键)\\n\", hash_remove(&m, \"kiwi\") ? \"true\" : \"false\");\n\n    hash_dump(&m, \"after remove\");\n\n    hash_free(&m);\n    printf(\"hash_free done\\n\");\n    return 0;\n}"}]},"cpp":{"file":"hash.cpp","steps":[{"title":"桶与节点结构","note":"以 vector 套 forward_list 表达拉链法哈希表","code":"#include <cstddef>\n#include <cstdint>\n#include <forward_list>\n#include <functional>\n#include <iomanip>\n#include <iostream>\n#include <optional>\n#include <stdexcept>\n#include <string>\n#include <utility>\n#include <vector>\n\n/*\n * HashTable<K, V, Hash>：拉链法（separate chaining）哈希表。\n *\n * 存储形态：std::vector<std::forward_list<std::pair<K, V>>>。\n *   - vector 负责桶数组：下标即桶号，定位 O(1)；\n *   - forward_list 是单链表：同桶冲突元素串成一条链，头插 O(1)、节点逐个分配；\n *   - std::unordered_map 的内部结构与这里同源，只是它把所有节点再串成一条全局链表，\n *     以便迭代器在 rehash 之后依然有效（本教学实现不提供这种稳定性）。\n * 负载因子超过 max_load_factor_ 时桶数翻倍并 rehash，保证平均查找长度 O(1 + alpha)。\n */\ntemplate <typename K>\nstruct HashPolicy;                    // 前置声明：哈希策略在第 2 步给出完整定义\n\ntemplate <typename K, typename V, typename Hash = HashPolicy<K>>\nclass HashTable {\npublic:\n    explicit HashTable(std::size_t bucket_count = 4, double max_load_factor = 0.75);\n\n    HashTable(const HashTable&) = default;            // vector/forward_list 深拷贝，副本互相独立\n    HashTable(HashTable&&) noexcept = default;        // 移动只是转移三个成员，无元素搬移\n    HashTable& operator=(const HashTable&) = default;\n    HashTable& operator=(HashTable&&) noexcept = default;\n    ~HashTable() = default;                           // 所有内存都由容器持有，无需手写析构\n\n    bool put(const K& key, const V& value);           // true = 新增，false = 覆盖旧值\n    std::optional<V> get(const K& key) const;         // 未命中返回 std::nullopt\n    bool remove(const K& key);\n    void clear() noexcept;\n\n    bool empty() const noexcept;\n    std::size_t size() const noexcept;\n    std::size_t bucket_count() const noexcept;\n    double load_factor() const noexcept;\n    const std::vector<std::forward_list<std::pair<K, V>>>& buckets() const noexcept;\n\nprivate:\n    std::size_t bucket_index(const K& key) const;\n    void rehash(std::size_t new_bucket_count);\n\n    std::vector<std::forward_list<std::pair<K, V>>> buckets_;\n    std::size_t size_;\n    double      max_load_factor_;\n    Hash        hash_{};\n};"},{"title":"哈希函数","note":"std","code":"template <typename K>\nstruct HashPolicy {\n    std::size_t operator()(const K& key) const {\n        return std::hash<K>{}(key);       // 通用回退：标准库已经为整数、指针、string 等都提供了特化\n    }\n};\n\n/* 与 C 版逐位一致的 FNV-1a 64 位实现：先异或再乘，乘数 0x100000001b3。 */\ntemplate <>\nstruct HashPolicy<std::string> {\n    std::size_t operator()(const std::string& key) const noexcept {\n        std::uint64_t h = 1469598103934665603ULL;   // 0xcbf29ce484222325\n        for (unsigned char c : key) {\n            h ^= static_cast<std::uint64_t>(c);\n            h *= 1099511628211ULL;                  // 无符号乘法自然回绕，等价于 mod 2^64\n        }\n        return static_cast<std::size_t>(h);\n    }\n};\n\ntemplate <typename K, typename V, typename Hash>\nstd::size_t HashTable<K, V, Hash>::bucket_index(const K& key) const\n{\n    return hash_(key) % buckets_.size();            // 桶号 = 哈希值 mod 桶数\n}"},{"title":"初始化与销毁","note":"构造函数固定桶数，clear 归还节点但保留桶数组","code":"template <typename K, typename V, typename Hash>\nHashTable<K, V, Hash>::HashTable(std::size_t bucket_count, double max_load_factor)\n    : buckets_(bucket_count), size_(0), max_load_factor_(max_load_factor)\n{\n    if (bucket_count == 0) {\n        throw std::invalid_argument(\"HashTable: bucket_count must be greater than zero\");\n    }\n    if (!(max_load_factor > 0.0)) {\n        throw std::invalid_argument(\"HashTable: max_load_factor must be positive\");\n    }\n}\n\ntemplate <typename K, typename V, typename Hash>\nvoid HashTable<K, V, Hash>::clear() noexcept\n{\n    for (auto& bucket : buckets_) {\n        bucket.clear();                  // forward_list::clear 逐个析构元素并归还节点\n    }\n    size_ = 0;\n    /* 析构函数不需要写：buckets_ 是 vector，离开作用域会自动释放全部桶与节点。 */\n}\n\ntemplate <typename K, typename V, typename Hash>\nbool HashTable<K, V, Hash>::empty() const noexcept\n{\n    return size_ == 0;\n}\n\ntemplate <typename K, typename V, typename Hash>\nstd::size_t HashTable<K, V, Hash>::size() const noexcept\n{\n    return size_;\n}\n\ntemplate <typename K, typename V, typename Hash>\nstd::size_t HashTable<K, V, Hash>::bucket_count() const noexcept\n{\n    return buckets_.size();\n}\n\ntemplate <typename K, typename V, typename Hash>\ndouble HashTable<K, V, Hash>::load_factor() const noexcept\n{\n    return static_cast<double>(size_) / static_cast<double>(buckets_.size());\n}\n\ntemplate <typename K, typename V, typename Hash>\nconst std::vector<std::forward_list<std::pair<K, V>>>& HashTable<K, V, Hash>::buckets() const noexcept\n{\n    return buckets_;\n}"},{"title":"插入或更新 put","note":"负载因子超阈值先扩容 rehash，再头插新节点或覆盖旧值","code":"template <typename K, typename V, typename Hash>\nvoid HashTable<K, V, Hash>::rehash(std::size_t new_bucket_count)\n{\n    std::vector<std::forward_list<std::pair<K, V>>> fresh(new_bucket_count);\n    for (auto& bucket : buckets_) {\n        for (auto& kv : bucket) {\n            const std::size_t idx = hash_(kv.first) % new_bucket_count;\n            fresh[idx].emplace_front(std::move(kv));   // 直接搬走节点内容，不重新构造键\n        }\n    }\n    buckets_.swap(fresh);                // 旧桶数组随 fresh 一起析构，节点已全部搬走\n}\n\ntemplate <typename K, typename V, typename Hash>\nbool HashTable<K, V, Hash>::put(const K& key, const V& value)\n{\n    /* 先算「插入之后」的负载因子，超过阈值就把桶数翻倍 */\n    if (static_cast<double>(size_ + 1) > max_load_factor_ * static_cast<double>(buckets_.size())) {\n        rehash(buckets_.size() * 2);\n    }\n\n    auto& bucket = buckets_[bucket_index(key)];\n    for (auto& kv : bucket) {\n        if (kv.first == key) {\n            kv.second = value;           // 键已存在：只更新值\n            return false;\n        }\n    }\n    bucket.emplace_front(key, value);    // 头插 O(1)\n    ++size_;\n    return true;\n}"},{"title":"查找 get","note":"定位桶后在链上比较键，用 optional 表达未命中","code":"template <typename K, typename V, typename Hash>\nstd::optional<V> HashTable<K, V, Hash>::get(const K& key) const\n{\n    const auto& bucket = buckets_[bucket_index(key)];\n    for (const auto& kv : bucket) {\n        if (kv.first == key) {\n            return kv.second;            // 命中：返回值的拷贝\n        }\n    }\n    return std::nullopt;                 // 未命中：类型系统里就没有值\n}"},{"title":"删除 remove","note":"forward_list 只能 erase_after，用 before_begin 处理头节点","code":"template <typename K, typename V, typename Hash>\nbool HashTable<K, V, Hash>::remove(const K& key)\n{\n    auto& bucket = buckets_[bucket_index(key)];\n    auto prev = bucket.before_begin();   // 指向「首个元素之前」的虚拟位置\n    for (auto it = bucket.begin(); it != bucket.end(); ++it) {\n        if (it->first == key) {\n            bucket.erase_after(prev);    // 摘掉 it 指向的节点，头节点也能统一处理\n            --size_;\n            return true;\n        }\n        prev = it;\n    }\n    return false;\n}"},{"title":"main：跑一遍","note":"打印扩容前后的桶数，并验证 put/get/remove","code":"static void dump(const std::string& tag, const HashTable<std::string, int>& t)\n{\n    std::cout << tag << \": buckets=\" << t.bucket_count() << \" size=\" << t.size()\n              << \" load=\" << std::fixed << std::setprecision(3) << t.load_factor() << '\\n';\n    const auto& bs = t.buckets();\n    for (std::size_t i = 0; i < bs.size(); ++i) {\n        std::cout << \"  [\" << std::setw(2) << i << ']';\n        for (const auto& kv : bs[i]) {\n            std::cout << \" -> \" << kv.first << '=' << kv.second;\n        }\n        std::cout << '\\n';\n    }\n}\n\nint main()\n{\n    HashTable<std::string, int> table;   // 初始 4 个桶，负载因子阈值 0.75\n    std::cout << \"init: buckets=\" << table.bucket_count() << \" size=\" << table.size()\n              << \" load=\" << std::fixed << std::setprecision(3) << table.load_factor() << '\\n';\n\n    const std::pair<const char*, int> data[] = {\n        {\"apple\", 10}, {\"banana\", 20}, {\"cherry\", 30}, {\"date\", 40},\n        {\"elderberry\", 50}, {\"fig\", 60}, {\"grape\", 70}\n    };\n\n    for (const auto& [key, val] : data) {\n        const std::size_t before = table.bucket_count();\n        const bool inserted = table.put(key, val);\n        std::cout << \"put(\" << std::left << std::setw(11) << key << \", \" << std::setw(2) << val\n                  << \") -> \" << std::setw(8) << (inserted ? \"inserted\" : \"updated\")\n                  << \" | buckets \" << before << \" -> \" << table.bucket_count()\n                  << \", size=\" << table.size() << \", load=\" << std::fixed << std::setprecision(3)\n                  << table.load_factor() << '\\n';\n    }\n\n    std::cout << \"put(apple, 111)    -> \" << (table.put(\"apple\", 111) ? \"inserted\" : \"updated\")\n              << \" (键已存在，只改值)\\n\";\n\n    dump(\"after inserts\", table);\n\n    for (const char* probe : {\"apple\", \"cherry\", \"kiwi\"}) {\n        const std::optional<int> v = table.get(probe);\n        std::cout << \"get(\" << std::left << std::setw(7) << probe << \") -> \"\n                  << std::setw(5) << (v ? \"true\" : \"false\")\n                  << \" value=\" << (v ? *v : -1) << '\\n';\n    }\n\n    std::cout << \"remove(banana) -> \" << (table.remove(\"banana\") ? \"true\" : \"false\") << '\\n';\n    std::cout << \"remove(banana) -> \" << (table.remove(\"banana\") ? \"true\" : \"false\")\n              << \" (重复删除应为 false)\\n\";\n    std::cout << \"remove(kiwi)   -> \" << (table.remove(\"kiwi\") ? \"true\" : \"false\")\n              << \" (不存在的键)\\n\";\n    std::cout << \"after remove: buckets=\" << table.bucket_count() << \" size=\" << table.size()\n              << \" load=\" << std::fixed << std::setprecision(3) << table.load_factor() << '\\n';\n\n    dump(\"after remove\", table);\n\n    table.clear();\n    std::cout << \"after clear: empty=\" << (table.empty() ? \"true\" : \"false\")\n              << \" size=\" << table.size() << \" buckets=\" << table.bucket_count() << '\\n';\n    return 0;\n}"}]},"rs":{"file":"hash.rs","steps":[{"title":"桶与节点结构","note":"用 Vec of Vec 表达拉链法哈希表的桶数组","code":"//! 拉链法（separate chaining）哈希表教学实现。\n//!\n//! 存储形态：Vec<Vec<(String, i32)>>。\n//!   - 外层 Vec 是桶数组，下标即桶号，定位 O(1)；\n//!   - 内层 Vec 是桶内的冲突链。这里刻意用 Vec 而不是单链表：安全 Rust 里手写\n//!     Option<Box<Node>> 链表，删除时要维护 prev 指针，代码量和出错面都会变大；\n//!     桶内元素通常很少（负载因子控制在 0.75 以下），Vec 的线性扫描完全够用。\n//!   - 负载因子超过 0.75 时桶数翻倍并 rehash，平均查找长度 O(1 + alpha)。\n//!\n//! 工程代码应当直接用 std::collections::HashMap（hashbrown 的开放寻址实现），\n//! 本文件手写拉链法只是为了把 rehash 与冲突处理摊开讲清楚。\n\nconst INIT_BUCKETS: usize = 4;\nconst MAX_LOAD: f64 = 0.75;\n\n/// 拉链法哈希表：键固定为 String，值固定为 i32，便于对照 C / C++ 版本。\n#[derive(Debug)]\nstruct HashTable {\n    buckets: Vec<Vec<(String, i32)>>, // 桶数组，每个桶是一条冲突链\n    size: usize,                      // 已存键值对个数，负载因子的分子\n}"},{"title":"哈希函数","note":"FNV-1a 64 位，与 C / C++ 版本逐位一致","code":"/// FNV-1a：先异或再乘。乘数用 wrapping_mul 显式声明「溢出即回绕」，\n/// 这正是 mod 2^64 的定义，也是调试模式下不会 panic 的写法。\nfn hash_key(key: &str) -> u64 {\n    let mut h: u64 = 0xcbf2_9ce4_8422_2325; // FNV offset basis\n    for byte in key.as_bytes() {\n        h ^= u64::from(*byte);\n        h = h.wrapping_mul(0x0000_0100_0000_01b3); // FNV prime\n    }\n    h\n}"},{"title":"初始化与销毁","note":"new 建立空桶数组，销毁由 Vec 的 Drop 自动完成","code":"impl HashTable {\n    /// 建立一张空表，初始桶数 INIT_BUCKETS。\n    fn new() -> Self {\n        // 不能用 vec![Vec::new(); n]（那要求 Vec<(String,i32)>: Clone），\n        // 用迭代器逐个构造，语义更直白。\n        let buckets: Vec<Vec<(String, i32)>> = (0..INIT_BUCKETS).map(|_| Vec::new()).collect();\n        HashTable { buckets, size: 0 }\n    }\n\n    /// 清空所有键值对，但保留已经扩容好的桶数组。\n    fn clear(&mut self) {\n        for bucket in &mut self.buckets {\n            bucket.clear();\n        }\n        self.size = 0;\n    }\n\n    fn size(&self) -> usize {\n        self.size\n    }\n\n    fn bucket_count(&self) -> usize {\n        self.buckets.len()\n    }\n\n    /// 负载因子 = 元素数 / 桶数。\n    fn load_factor(&self) -> f64 {\n        self.size as f64 / self.buckets.len() as f64\n    }\n\n    fn bucket_index(&self, key: &str) -> usize {\n        (hash_key(key) % self.buckets.len() as u64) as usize\n    }\n}"},{"title":"插入或更新 put","note":"负载因子超阈值先扩容 rehash，再头插或覆盖旧值","code":"impl HashTable {\n    /// 插入或更新。返回 true 表示新增，false 表示覆盖了已有键。\n    fn put(&mut self, key: &str, value: i32) -> bool {\n        // 先算「插入之后」的负载因子，超过阈值就把桶数翻倍\n        if (self.size + 1) as f64 > MAX_LOAD * self.buckets.len() as f64 {\n            self.resize(self.buckets.len() * 2);\n        }\n\n        let idx = self.bucket_index(key);\n        let bucket = &mut self.buckets[idx];\n        for entry in bucket.iter_mut() {\n            if entry.0.as_str() == key {\n                entry.1 = value; // 键已存在：只更新值\n                return false;\n            }\n        }\n        bucket.push((key.to_string(), value)); // 新键：追加到桶尾\n        self.size += 1;\n        true\n    }\n\n    /// 扩容：新建 new_count 个空桶，把旧桶里的键值对按新桶数重新分配。\n    ///\n    /// std::mem::replace 把旧桶数组整个换出来（旧位置留下空的 Vec），\n    /// 这样循环里可以自由修改 self.buckets，不会同时存在两个可变借用。\n    fn resize(&mut self, new_count: usize) {\n        let mut fresh: Vec<Vec<(String, i32)>> = (0..new_count).map(|_| Vec::new()).collect();\n        let old = std::mem::replace(&mut self.buckets, Vec::new());\n        for bucket in old {\n            for (key, value) in bucket {\n                let idx = (hash_key(&key) % new_count as u64) as usize;\n                fresh[idx].push((key, value)); // 移动所有权，键不做多余拷贝\n            }\n        }\n        self.buckets = fresh;\n    }\n}"},{"title":"查找 get","note":"定位桶后线性比较键，未命中返回 None","code":"impl HashTable {\n    /// 查值。未命中返回 None，而不是 -1 之类的哨兵值。\n    fn get(&self, key: &str) -> Option<i32> {\n        let idx = self.bucket_index(key);\n        self.buckets[idx]\n            .iter()\n            .find(|entry| entry.0.as_str() == key)\n            .map(|entry| entry.1)\n    }\n}"},{"title":"删除 remove","note":"定位桶后按位置删除并返回被删的值","code":"impl HashTable {\n    /// 删除键。返回 Some(旧值) 表示删掉了，None 表示键不存在。\n    fn remove(&mut self, key: &str) -> Option<i32> {\n        let idx = self.bucket_index(key);\n        let bucket = &mut self.buckets[idx];\n        let pos = bucket.iter().position(|entry| entry.0.as_str() == key)?; // ? 直接短路成 None\n        let (_, value) = bucket.remove(pos); // Vec::remove 保持桶内顺序\n        self.size -= 1;\n        Some(value)\n    }\n}"},{"title":"main：跑一遍","note":"打印扩容前后的桶数，并验证 put/get/remove","code":"fn dump(table: &HashTable, tag: &str) {\n    println!(\n        \"{}: buckets={} size={} load={:.3}\",\n        tag,\n        table.bucket_count(),\n        table.size(),\n        table.load_factor()\n    );\n    for (i, bucket) in table.buckets.iter().enumerate() {\n        print!(\"  [{:2}]\", i);\n        for (key, value) in bucket {\n            print!(\" -> {}={}\", key, value);\n        }\n        println!();\n    }\n}\n\nfn main() {\n    let mut table = HashTable::new();\n    println!(\n        \"init: buckets={} size={} load={:.3}\",\n        table.bucket_count(),\n        table.size(),\n        table.load_factor()\n    );\n\n    let data = [\n        (\"apple\", 10),\n        (\"banana\", 20),\n        (\"cherry\", 30),\n        (\"date\", 40),\n        (\"elderberry\", 50),\n        (\"fig\", 60),\n        (\"grape\", 70),\n    ];\n\n    for (key, value) in data {\n        let before = table.bucket_count();\n        let inserted = table.put(key, value);\n        println!(\n            \"put({:<11}, {:<2}) -> {:<8} | buckets {} -> {}, size={}, load={:.3}\",\n            key,\n            value,\n            if inserted { \"inserted\" } else { \"updated\" },\n            before,\n            table.bucket_count(),\n            table.size(),\n            table.load_factor()\n        );\n    }\n\n    println!(\n        \"put(apple, 111)    -> {} (键已存在，只改值)\",\n        if table.put(\"apple\", 111) { \"inserted\" } else { \"updated\" }\n    );\n\n    dump(&table, \"after inserts\");\n\n    for probe in [\"apple\", \"cherry\", \"kiwi\"] {\n        match table.get(probe) {\n            Some(v) => println!(\"get({:<7}) -> true  value={}\", probe, v),\n            None => println!(\"get({:<7}) -> false value=-1\", probe),\n        }\n    }\n\n    println!(\"remove(banana) -> {}\", table.remove(\"banana\").is_some());\n    println!(\n        \"remove(banana) -> {} (重复删除应为 false)\",\n        table.remove(\"banana\").is_some()\n    );\n    println!(\n        \"remove(kiwi)   -> {} (不存在的键)\",\n        table.remove(\"kiwi\").is_some()\n    );\n    println!(\n        \"after remove: buckets={} size={} load={:.3}\",\n        table.bucket_count(),\n        table.size(),\n        table.load_factor()\n    );\n\n    dump(&table, \"after remove\");\n\n    table.clear();\n    println!(\n        \"after clear: size={} buckets={}\",\n        table.size(),\n        table.bucket_count()\n    );\n}"}]}},"bst":{"c":{"file":"bst.c","steps":[{"title":"节点定义","note":"二叉搜索树节点与创建释放辅助函数","code":"#include <stdio.h>\n#include <stdlib.h>\n#include <stdbool.h>\n#include <assert.h>\n\n/*\n * 二叉搜索树（BST）的不变式：对任意节点 n，\n *   n->left 子树里所有值 < n->val < n->right 子树里所有值。\n * 因此中序遍历一定是严格递增序列——这既是性质，也是本文件验证正确性的手段。\n */\ntypedef struct BSTNode {\n    int              val;\n    struct BSTNode  *left;\n    struct BSTNode  *right;\n} BSTNode;\n\nstatic BSTNode *bst_node_new(int val)\n{\n    BSTNode *n = (BSTNode *)malloc(sizeof(BSTNode));\n    if (n == NULL) {\n        return NULL;                     /* malloc 返回值必须检查 */\n    }\n    n->val   = val;\n    n->left  = NULL;\n    n->right = NULL;\n    return n;\n}\n\n/* 后序释放整棵子树：先释放两个孩子，再释放自己 */\nvoid bst_free(BSTNode *root)\n{\n    if (root == NULL) {\n        return;\n    }\n    bst_free(root->left);\n    bst_free(root->right);\n    free(root);\n}"},{"title":"插入 insert","note":"递归返回新的子树根，重复值不插入","code":"/* 返回插入后的子树根。C 里没有引用参数，所以用「返回新根」的方式表达修改。 */\nBSTNode *bst_insert(BSTNode *root, int val)\n{\n    if (root == NULL) {\n        return bst_node_new(val);        /* 走到空位：在这里挂上新节点 */\n    }\n    if (val < root->val) {\n        root->left = bst_insert(root->left, val);\n    } else if (val > root->val) {\n        root->right = bst_insert(root->right, val);\n    }\n    /* val == root->val：重复键直接忽略，保持树中键唯一 */\n    return root;\n}"},{"title":"查找 search","note":"每次比较都能砍掉一半子树，所以是迭代而不是递归","code":"BSTNode *bst_search(BSTNode *root, int val)\n{\n    while (root != NULL) {\n        if (val == root->val) {\n            return root;                 /* 命中：返回节点指针 */\n        }\n        root = (val < root->val) ? root->left : root->right;   /* 只走一条路 */\n    }\n    return NULL;                         /* 走到空节点：不存在 */\n}"},{"title":"找最小值 min_value","note":"一路向左走到底就是最小值","code":"const BSTNode *bst_min_node(const BSTNode *root)\n{\n    if (root == NULL) {\n        return NULL;\n    }\n    while (root->left != NULL) {\n        root = root->left;               /* BST 性质：左孩子永远更小 */\n    }\n    return root;\n}\n\nbool bst_min_value(const BSTNode *root, int *out)\n{\n    const BSTNode *min = bst_min_node(root);\n    if (min == NULL) {\n        return false;                    /* 空树没有最小值 */\n    }\n    if (out != NULL) {\n        *out = min->val;\n    }\n    return true;\n}"},{"title":"删除 remove（三种情况）","note":"叶子直接删、单孩子顶替、双孩子用中序后继替换","code":"BSTNode *bst_remove(BSTNode *root, int val)\n{\n    if (root == NULL) {\n        return NULL;                     /* 空树或没找到：原样返回 */\n    }\n    if (val < root->val) {\n        root->left  = bst_remove(root->left, val);\n        return root;\n    }\n    if (val > root->val) {\n        root->right = bst_remove(root->right, val);\n        return root;\n    }\n\n    /* 命中了，分三种情况处理 */\n    if (root->left == NULL && root->right == NULL) {\n        /* 情况 1：叶子节点，直接摘掉 */\n        free(root);\n        return NULL;\n    }\n    if (root->left == NULL) {\n        /* 情况 2a：只有右孩子，让右孩子顶替自己的位置 */\n        BSTNode *child = root->right;\n        free(root);\n        return child;\n    }\n    if (root->right == NULL) {\n        /* 情况 2b：只有左孩子，让左孩子顶替自己的位置 */\n        BSTNode *child = root->left;\n        free(root);\n        return child;\n    }\n\n    /* 情况 3：左右孩子都在。找中序后继（右子树的最小值），\n       把它的值搬到当前节点，再去右子树里删掉那个后继节点。\n       后继节点最多只有右孩子，于是递归退化成情况 1 或情况 2。 */\n    const BSTNode *succ = bst_min_node(root->right);\n    root->val   = succ->val;\n    root->right = bst_remove(root->right, succ->val);\n    return root;\n}"},{"title":"中序遍历 inorder","note":"左-根-右，输出必然是递增序列","code":"static void inorder_walk(const BSTNode *root, int *out, size_t cap, size_t *n)\n{\n    if (root == NULL || *n >= cap) {\n        return;\n    }\n    inorder_walk(root->left, out, cap, n);\n    if (*n < cap) {\n        out[*n] = root->val;             /* 根在左右之间被访问，这就是「中序」 */\n        *n += 1;\n    }\n    inorder_walk(root->right, out, cap, n);\n}\n\n/* 把中序序列写进调用者提供的数组，返回元素个数（最多 cap 个） */\nsize_t bst_inorder(const BSTNode *root, int *out, size_t cap)\n{\n    size_t n = 0;\n    inorder_walk(root, out, cap, &n);\n    return n;\n}\n\n/* 验证序列严格递增：BST 正确性的直接判据 */\nbool bst_is_strictly_increasing(const int *a, size_t n)\n{\n    for (size_t i = 1; i < n; ++i) {\n        if (a[i - 1] >= a[i]) {\n            return false;\n        }\n    }\n    return true;\n}"},{"title":"main：跑一遍","note":"打印中序序列证明递增，并演示三种删除后依然递增","code":"static void bst_show(const BSTNode *root, const char *tag)\n{\n    int    buf[32];\n    size_t n = bst_inorder(root, buf, sizeof(buf) / sizeof(buf[0]));\n    printf(\"%-26s inorder =\", tag);\n    for (size_t i = 0; i < n; ++i) {\n        printf(\" %d\", buf[i]);\n    }\n    printf(\"  | increasing=%s\\n\", bst_is_strictly_increasing(buf, n) ? \"true\" : \"false\");\n}\n\nint main(void)\n{\n    static const int keys[] = { 8, 3, 10, 1, 6, 14, 4, 7, 13 };\n    const size_t nkeys = sizeof(keys) / sizeof(keys[0]);\n\n    BSTNode *root = NULL;\n    for (size_t i = 0; i < nkeys; ++i) {\n        root = bst_insert(root, keys[i]);\n    }\n    root = bst_insert(root, 6);          /* 重复键：应当被忽略 */\n    bst_show(root, \"after inserts\");\n\n    printf(\"search(7)  -> %s\\n\", bst_search(root, 7) != NULL ? \"found\" : \"not found\");\n    printf(\"search(13) -> %s\\n\", bst_search(root, 13) != NULL ? \"found\" : \"not found\");\n    printf(\"search(5)  -> %s\\n\", bst_search(root, 5) != NULL ? \"found\" : \"not found\");\n\n    int min_val = -1;\n    if (bst_min_value(root, &min_val)) {\n        printf(\"min_value  -> %d\\n\", min_val);\n    }\n\n    /* 情况 3 的预备知识：节点 6 的中序后继 = 它右子树的最小值 */\n    BSTNode *n6 = bst_search(root, 6);\n    if (n6 != NULL && bst_min_value(n6->right, &min_val)) {\n        printf(\"node 6 的中序后继(右子树最小值) = %d\\n\", min_val);\n    }\n\n    printf(\"--- 三种删除 ---\\n\");\n    root = bst_remove(root, 1);          /* 情况 1：叶子 */\n    bst_show(root, \"remove(1) leaf\");\n    root = bst_remove(root, 14);         /* 情况 2：只有一个孩子(13) */\n    bst_show(root, \"remove(14) one child\");\n    root = bst_remove(root, 6);          /* 情况 3：左右孩子都在 */\n    bst_show(root, \"remove(6) two children\");\n    root = bst_remove(root, 99);         /* 不存在的键：树不变 */\n    bst_show(root, \"remove(99) missing\");\n\n    bst_free(root);\n    printf(\"bst_free done\\n\");\n\n    /* 边界：空树上的删除与最小值查询 */\n    printf(\"remove on empty -> %s\\n\", bst_remove(NULL, 1) == NULL ? \"NULL\" : \"not NULL\");\n    printf(\"min_value on empty -> %s\\n\", bst_min_value(NULL, &min_val) ? \"true\" : \"false\");\n    return 0;\n}"}]},"cpp":{"file":"bst.cpp","steps":[{"title":"节点定义","note":"unique_ptr 表达子树所有权，析构递归释放整棵树","code":"#include <cstddef>\n#include <iostream>\n#include <memory>\n#include <optional>\n#include <string>\n#include <utility>\n#include <vector>\n\n/*\n * 二叉搜索树（BST）的不变式：对任意节点 n，\n *   n->left 子树的所有值 < n->val < n->right 子树的所有值。\n * 于是中序遍历必然是严格递增序列——这既是性质，也是本文件验证正确性的手段。\n *\n * 所有权模型：子树用 std::unique_ptr<Node> 独占持有。\n *   - 不再需要手写 free，也不会泄漏：删除节点就是让 unique_ptr 析构；\n *   - 拷贝被删除（unique_ptr 不可拷贝），移动是 O(1) 的指针转移；\n *   - 代价是整棵树的析构沿左孩子链递归，非常深的树可能爆栈。\n */\ntemplate <typename T>\nstruct Node {\n    T                     val;\n    std::unique_ptr<Node> left;\n    std::unique_ptr<Node> right;\n\n    explicit Node(const T& v) : val(v) {}\n};\n\ntemplate <typename T>\nclass Bst {\npublic:\n    Bst() noexcept = default;\n    Bst(const Bst&) = delete;                 // 独占所有权：不能拷贝\n    Bst& operator=(const Bst&) = delete;\n    Bst(Bst&&) noexcept = default;            // 可以移动，只转移根指针\n    Bst& operator=(Bst&&) noexcept = default;\n    ~Bst() = default;                         // 由 unique_ptr 链自动递归释放\n\n    void insert(const T& val);\n    const Node<T>* find(const T& val) const;\n    bool contains(const T& val) const;\n    std::optional<T> min_value() const;\n    bool remove(const T& val);\n    std::vector<T> inorder() const;\n\nprivate:\n    static void insert_at(std::unique_ptr<Node<T>>& slot, const T& val);\n    static const Node<T>* min_node(const Node<T>* n) noexcept;\n    static std::unique_ptr<Node<T>> remove_at(std::unique_ptr<Node<T>> node, const T& val);\n    static void collect(const Node<T>* n, std::vector<T>& out);\n\n    std::unique_ptr<Node<T>> root_;\n};"},{"title":"插入 insert","note":"递归找到空位挂上新节点，重复键忽略","code":"template <typename T>\nvoid Bst<T>::insert(const T& val)\n{\n    insert_at(root_, val);\n}\n\ntemplate <typename T>\nvoid Bst<T>::insert_at(std::unique_ptr<Node<T>>& slot, const T& val)\n{\n    if (!slot) {\n        slot = std::make_unique<Node<T>>(val);   // 空位：在这里挂上新节点\n        return;\n    }\n    if (val < slot->val) {\n        insert_at(slot->left, val);              // 传引用，所以能直接改写这个 slot\n    } else if (val > slot->val) {\n        insert_at(slot->right, val);\n    }\n    /* val == slot->val：重复键忽略，保持键唯一 */\n}"},{"title":"查找 search","note":"每一步都砍掉一半子树，所以写成循环","code":"template <typename T>\nconst Node<T>* Bst<T>::find(const T& val) const\n{\n    const Node<T>* cur = root_.get();\n    while (cur != nullptr) {\n        if (val == cur->val) {\n            return cur;                          // 命中\n        }\n        cur = (val < cur->val) ? cur->left.get() : cur->right.get();\n    }\n    return nullptr;                              // 走到空：不存在\n}\n\ntemplate <typename T>\nbool Bst<T>::contains(const T& val) const\n{\n    return find(val) != nullptr;\n}"},{"title":"找最小值 min_value","note":"一路向左走到底，空树返回 nullopt","code":"template <typename T>\nconst Node<T>* Bst<T>::min_node(const Node<T>* n) noexcept\n{\n    while (n != nullptr && n->left) {\n        n = n->left.get();                       // BST 性质：左孩子一定更小\n    }\n    return n;                                    // 没有左孩子时就是最小值\n}\n\ntemplate <typename T>\nstd::optional<T> Bst<T>::min_value() const\n{\n    const Node<T>* n = min_node(root_.get());\n    if (n == nullptr) {\n        return std::nullopt;                     // 空树没有最小值\n    }\n    return n->val;\n}"},{"title":"删除 remove（三种情况）","note":"叶子删掉、单孩子顶替、双孩子用中序后继替换","code":"template <typename T>\nbool Bst<T>::remove(const T& val)\n{\n    const bool existed = contains(val);\n    root_ = remove_at(std::move(root_), val);    // unique_ptr 的移动让「返回新子树根」零开销\n    return existed;\n}\n\ntemplate <typename T>\nstd::unique_ptr<Node<T>> Bst<T>::remove_at(std::unique_ptr<Node<T>> node, const T& val)\n{\n    if (!node) {\n        return nullptr;                          // 空树或没找到：原样返回\n    }\n    if (val < node->val) {\n        node->left = remove_at(std::move(node->left), val);\n        return node;\n    }\n    if (val > node->val) {\n        node->right = remove_at(std::move(node->right), val);\n        return node;\n    }\n\n    /* 情况 1：叶子节点，直接删除（node 析构即 free） */\n    if (!node->left && !node->right) {\n        return nullptr;\n    }\n    /* 情况 2：只有一个孩子，让孩子顶替自己的位置 */\n    if (!node->left) {\n        return std::move(node->right);\n    }\n    if (!node->right) {\n        return std::move(node->left);\n    }\n    /* 情况 3：左右孩子都在。取中序后继（右子树最小值）的值替换当前节点，\n       再去右子树里删掉那个后继；后继最多只有右孩子，于是递归退化为情况 1 或 2。 */\n    const T successor = min_node(node->right.get())->val;\n    node->val   = successor;\n    node->right = remove_at(std::move(node->right), successor);\n    return node;\n}"},{"title":"中序遍历 inorder","note":"左-根-右，产出递增序列","code":"template <typename T>\nvoid Bst<T>::collect(const Node<T>* n, std::vector<T>& out)\n{\n    if (!n) {\n        return;\n    }\n    collect(n->left.get(), out);\n    out.push_back(n->val);                       // 根在左右之间被访问，这就是「中序」\n    collect(n->right.get(), out);\n}\n\ntemplate <typename T>\nstd::vector<T> Bst<T>::inorder() const\n{\n    std::vector<T> out;\n    collect(root_.get(), out);\n    return out;\n}"},{"title":"main：跑一遍","note":"打印中序序列证明递增，并演示三种删除后依然递增","code":"template <typename T>\nstatic bool strictly_increasing(const std::vector<T>& seq)\n{\n    for (std::size_t i = 1; i < seq.size(); ++i) {\n        if (!(seq[i - 1] < seq[i])) {\n            return false;\n        }\n    }\n    return true;\n}\n\ntemplate <typename T>\nstatic void show(const Bst<T>& tree, const std::string& tag)\n{\n    const std::vector<T> seq = tree.inorder();\n    std::cout << tag;\n    std::cout << \" inorder =\";\n    for (const T& v : seq) {\n        std::cout << ' ' << v;\n    }\n    std::cout << \"  | increasing=\"\n              << (strictly_increasing(seq) ? \"true\" : \"false\") << '\\n';\n}\n\nint main()\n{\n    Bst<int> tree;\n    for (int v : {8, 3, 10, 1, 6, 14, 4, 7, 13}) {\n        tree.insert(v);\n    }\n    tree.insert(6);                              // 重复键：应当被忽略\n    show(tree, \"after inserts          \");\n\n    for (int probe : {7, 13, 5}) {\n        const Node<int>* hit = tree.find(probe);\n        std::cout << \"search(\" << probe << \")  -> \" << (hit ? \"found\" : \"not found\")\n                  << \" (contains=\" << (tree.contains(probe) ? \"true\" : \"false\") << \")\\n\";\n    }\n\n    const std::optional<int> min_val = tree.min_value();\n    std::cout << \"min_value  -> \" << (min_val ? std::to_string(*min_val) : std::string(\"none\")) << '\\n';\n\n    /* 情况 3 的预备知识：节点 6 的中序后继 = 它右子树的最小值 */\n    const Node<int>* n6 = tree.find(6);\n    if (n6 != nullptr) {\n        // 严格照 bst_min_node 的走法：从右孩子出发一路向左\n        const Node<int>* succ = n6->right ? n6->right.get() : nullptr;\n        while (succ != nullptr && succ->left) {\n            succ = succ->left.get();\n        }\n        std::cout << \"node 6 的中序后继(右子树最小值) = \" << (succ ? succ->val : -1) << '\\n';\n    }\n\n    std::cout << \"--- 三种删除 ---\\n\";\n    std::cout << \"remove(1)  -> \" << (tree.remove(1) ? \"true\" : \"false\") << '\\n';   // 情况 1：叶子\n    show(tree, \"remove(1) leaf         \");\n    std::cout << \"remove(14) -> \" << (tree.remove(14) ? \"true\" : \"false\") << '\\n';  // 情况 2：单孩子\n    show(tree, \"remove(14) one child   \");\n    std::cout << \"remove(6)  -> \" << (tree.remove(6) ? \"true\" : \"false\") << '\\n';   // 情况 3：双孩子\n    show(tree, \"remove(6) two children \");\n    std::cout << \"remove(99) -> \" << (tree.remove(99) ? \"true\" : \"false\") << '\\n';  // 不存在的键\n    show(tree, \"remove(99) missing     \");\n\n    Bst<int> empty_tree;\n    std::cout << \"empty: contains(1)=\" << (empty_tree.contains(1) ? \"true\" : \"false\")\n              << \" min_value=\" << (empty_tree.min_value() ? \"some\" : \"none\")\n              << \" remove(1)=\" << (empty_tree.remove(1) ? \"true\" : \"false\") << '\\n';\n\n    Bst<int> moved = std::move(tree);            // 移动：根指针转移，树结构不动\n    show(moved, \"after std::move        \");\n    return 0;\n}"}]},"rs":{"file":"bst.rs","steps":[{"title":"节点定义","note":"Option<Box<Node>> 表达子树，None 就是空树","code":"//! 二叉搜索树（BST）教学实现，纯安全代码，没有一处 unsafe。\n//!\n//! 不变式：对任意节点 n，n.left 子树的所有值 < n.val < n.right 子树的所有值。\n//! 于是中序遍历必然是严格递增序列——这既是性质，也是本文件验证正确性的手段。\n//!\n//! 所有权模型：子树用 Option<Box<Node>> 独占持有。\n//!   - None 表示空子树，不需要空指针，也不会解引用到无效地址；\n//!   - Box 把节点放在堆上，递归类型因此有确定大小；\n//!   - 删除节点就是让 Box 离开作用域自动释放，没有手写 free，也不可能泄漏。\n\n/// 树节点：值 + 左右子树。\n#[derive(Debug)]\nstruct Node {\n    val: i32,\n    left: Option<Box<Node>>,\n    right: Option<Box<Node>>,\n}\n\nimpl Node {\n    /// 构造一个左右都为空的叶子节点。\n    fn new(val: i32) -> Self {\n        Node {\n            val,\n            left: None,\n            right: None,\n        }\n    }\n}"},{"title":"插入 insert","note":"递归下降，遇到 None 就地放新节点，重复键忽略","code":"/// 把 val 插入以 node 为根的子树，返回插入后的子树根。\n///\n/// 这个「传入所有权、返回新根」的形状是安全 Rust 里改写树的标准写法：\n/// 递归调用的结果直接替换掉原来的孩子槽位，不需要裸指针，也不需要父指针。\nfn insert(node: Option<Box<Node>>, val: i32) -> Option<Box<Node>> {\n    match node {\n        None => Some(Box::new(Node::new(val))), // 空位：挂上新节点\n        Some(mut n) => {\n            if val < n.val {\n                n.left = insert(n.left.take(), val); // take 取出孩子，递归后再放回\n            } else if val > n.val {\n                n.right = insert(n.right.take(), val);\n            }\n            // val == n.val：重复键忽略，保持键唯一\n            Some(n)\n        }\n    }\n}"},{"title":"查找 search","note":"每步砍掉一半子树，写成循环即可","code":"/// 迭代版查找，命中返回节点引用。\n///\n/// 返回类型 `Option<&Node>` 的生存期由输入借用推出（生存期省略规则），\n/// 因此调用者拿到的引用绝不会比树本身活得更久。\nfn find(node: &Option<Box<Node>>, val: i32) -> Option<&Node> {\n    // as_deref 把 &Option<Box<Node>> 借用成 Option<&Node>，于是循环里只借不夺\n    let mut cur = node.as_deref();\n    while let Some(n) = cur {\n        if val == n.val {\n            return Some(n);\n        }\n        cur = if val < n.val {\n            n.left.as_deref()\n        } else {\n            n.right.as_deref()\n        };\n    }\n    None\n}\n\n/// 是否包含 val。\nfn search(node: &Option<Box<Node>>, val: i32) -> bool {\n    find(node, val).is_some()\n}"},{"title":"找最小值 min_value","note":"一路向左走到底","code":"/// 以 node 为根的子树的最小值（调用者保证 node 存在）。\nfn min_of(node: &Node) -> i32 {\n    let mut min = node.val;\n    let mut cur = node.left.as_deref();\n    // as_deref 把 Option<Box<Node>> 借用成 Option<&Node>，于是能在循环里连续左行\n    while let Some(next) = cur {\n        min = next.val;\n        cur = next.left.as_deref();\n    }\n    min\n}\n\n/// 整棵树的最小值；空树返回 None。\nfn min_value(node: &Option<Box<Node>>) -> Option<i32> {\n    node.as_deref().map(min_of)\n}"},{"title":"删除 remove（三种情况）","note":"叶子删掉、单孩子顶替、双孩子用中序后继替换","code":"/// 从以 node 为根的子树中删除 val，返回删除后的子树根。\nfn remove(node: Option<Box<Node>>, val: i32) -> Option<Box<Node>> {\n    let mut node = match node {\n        None => return None, // 空树或没找到：原样返回\n        Some(n) => n,\n    };\n\n    if val < node.val {\n        node.left = remove(node.left.take(), val);\n        return Some(node);\n    }\n    if val > node.val {\n        node.right = remove(node.right.take(), val);\n        return Some(node);\n    }\n\n    // 命中，按孩子个数分三种情况\n    match (node.left.take(), node.right.take()) {\n        (None, None) => None,               // 情况 1：叶子，直接摘掉（Box 在此释放）\n        (Some(left), None) => Some(left),   // 情况 2a：只有左孩子，顶替自己\n        (None, Some(right)) => Some(right), // 情况 2b：只有右孩子，顶替自己\n        (Some(left), Some(right)) => {\n            // 情况 3：两个孩子都在。取中序后继（右子树最小值）替换当前值，\n            // 再去右子树里删掉那个后继；后继最多只有右孩子，于是退化成情况 1 或 2。\n            let successor = min_of(&right);\n            node.val = successor;\n            node.left = Some(left);\n            node.right = remove(Some(right), successor);\n            Some(node)\n        }\n    }\n}"},{"title":"中序遍历 inorder","note":"左-根-右，产出递增序列","code":"/// 把以 node 为根的子树按中序写入 out。参数是 &Option<Box<Node>>，只借不夺。\nfn inorder(node: &Option<Box<Node>>, out: &mut Vec<i32>) {\n    if let Some(n) = node.as_deref() {\n        inorder(&n.left, out);\n        out.push(n.val); // 根在左右之间被访问，这就是「中序」\n        inorder(&n.right, out);\n    }\n}"},{"title":"main：跑一遍","note":"打印中序序列证明递增，并演示三种删除后依然递增","code":"/// 打印中序序列，并检查它是否严格递增。\nfn show(root: &Option<Box<Node>>, tag: &str) {\n    let mut seq = Vec::new();\n    inorder(root, &mut seq);\n    let increasing = seq.windows(2).all(|w| w[0] < w[1]);\n    println!(\"{:<26} inorder = {:?}  | increasing = {}\", tag, seq, increasing);\n}\n\n/// 删除并报告：先查在不在，再删，返回删除前的存在性（对照 C / C++ 的返回值语义）。\nfn remove_and_report(root: &mut Option<Box<Node>>, val: i32) -> bool {\n    let existed = search(root, val);\n    let taken = root.take(); // 先把根取出来，此时 root 变成 None\n    *root = remove(taken, val); // 删完再把新根放回去\n    existed\n}\n\nfn main() {\n    let mut root: Option<Box<Node>> = None;\n    for v in [8, 3, 10, 1, 6, 14, 4, 7, 13] {\n        root = insert(root, v);\n    }\n    root = insert(root, 6); // 重复键：应当被忽略\n    show(&root, \"after inserts\");\n\n    for probe in [7, 13, 5] {\n        println!(\"search({:<2}) -> {}\", probe, search(&root, probe));\n    }\n\n    match min_value(&root) {\n        Some(v) => println!(\"min_value  -> {}\", v),\n        None => println!(\"min_value  -> none\"),\n    }\n\n    // 情况 3 的预备知识：节点 6 的中序后继 = 它右子树的最小值\n    let successor = match find(&root, 6) {\n        Some(n6) => n6.right.as_deref().map(min_of),\n        None => None,\n    };\n    println!(\"node 6 的中序后继(右子树最小值) = {:?}\", successor);\n\n    println!(\"--- 三种删除 ---\");\n    println!(\"remove(1)  -> {}\", remove_and_report(&mut root, 1)); // 情况 1：叶子\n    show(&root, \"remove(1) leaf\");\n    println!(\"remove(14) -> {}\", remove_and_report(&mut root, 14)); // 情况 2：单孩子\n    show(&root, \"remove(14) one child\");\n    println!(\"remove(6)  -> {}\", remove_and_report(&mut root, 6)); // 情况 3：双孩子\n    show(&root, \"remove(6) two children\");\n    println!(\"remove(99) -> {}\", remove_and_report(&mut root, 99)); // 不存在的键：树不变\n    show(&root, \"remove(99) missing\");\n\n    // 边界：空树上的查找 / 最小值 / 删除\n    let empty: Option<Box<Node>> = None;\n    let empty_search = search(&empty, 1);\n    let empty_min = min_value(&empty);\n    let empty_removed_missing = remove(empty, 1).is_none();\n    println!(\n        \"empty: search(1)={} min_value={:?} remove(1)={}\",\n        empty_search, empty_min, empty_removed_missing\n    );\n}"}]}},"heap":{"c":{"file":"heap.c","steps":[{"title":"结构定义","note":"小顶堆用动态数组存完全二叉树，左 2i+1、右 2i+2、父 (i-1)/2","code":"#include <stdio.h>\n#include <stdlib.h>\n#include <stdbool.h>\n#include <assert.h>\n\ntypedef struct {\n    int    *data;\n    size_t  size;\n    size_t  cap;\n} IntHeap;"},{"title":"初始化与销毁","note":"延迟分配，realloc 扩容，heap_free 释放全部内存","code":"void heap_init(IntHeap *h)\n{\n    h->data = NULL;\n    h->size = 0;\n    h->cap  = 0;\n}\n\nvoid heap_free(IntHeap *h)\n{\n    free(h->data);\n    h->data = NULL;\n    h->size = 0;\n    h->cap  = 0;\n}\n\n/* 内部辅助：保证容量至少为 need，失败返回 false。 */\nstatic bool heap_reserve(IntHeap *h, size_t need)\n{\n    if (need <= h->cap) {\n        return true;\n    }\n    size_t ncap = h->cap ? h->cap * 2 : 4;\n    while (ncap < need) {\n        ncap *= 2;\n    }\n    int *p = (int *)realloc(h->data, ncap * sizeof *p);\n    if (p == NULL) {\n        return false;\n    }\n    h->data = p;\n    h->cap  = ncap;\n    return true;\n}"},{"title":"上浮 sift_up + 入堆 push","note":"新元素追加到末尾，再与父结点逐层比较上浮","code":"static void heap_sift_up(IntHeap *h, size_t i)\n{\n    const int value = h->data[i];\n    while (i > 0) {\n        const size_t parent = (i - 1) / 2;\n        if (h->data[parent] <= value) {\n            break;\n        }\n        h->data[i] = h->data[parent];\n        i = parent;\n    }\n    h->data[i] = value;\n}\n\nbool heap_push(IntHeap *h, int value)\n{\n    if (!heap_reserve(h, h->size + 1)) {\n        return false;\n    }\n    h->data[h->size] = value;\n    heap_sift_up(h, h->size);\n    ++h->size;\n    return true;\n}"},{"title":"下沉 sift_down + 出堆 pop","note":"堆顶与末尾交换后从根下沉，恢复小顶性质","code":"static void heap_sift_down(IntHeap *h, size_t i)\n{\n    const size_t n = h->size;\n    const int value = h->data[i];\n    for (;;) {\n        const size_t left = 2 * i + 1;\n        if (left >= n) {\n            break;\n        }\n        const size_t right = left + 1;\n        size_t best = left;\n        if (right < n && h->data[right] < h->data[left]) {\n            best = right;\n        }\n        if (h->data[best] >= value) {\n            break;\n        }\n        h->data[i] = h->data[best];\n        i = best;\n    }\n    h->data[i] = value;\n}\n\nbool heap_pop(IntHeap *h, int *out)\n{\n    if (h->size == 0) {\n        return false;\n    }\n    *out = h->data[0];\n    --h->size;\n    if (h->size > 0) {\n        h->data[0] = h->data[h->size];\n        heap_sift_down(h, 0);\n    }\n    return true;\n}"},{"title":"建堆 build_heap（O(n)）","note":"自底向上从 n/2-1 下沉到 0；每层结点数翻倍而高度减一，级数求和收敛所以是线性","code":"void heap_build(IntHeap *h)\n{\n    for (size_t i = h->size / 2; i > 0; ) {\n        --i;\n        heap_sift_down(h, i);\n    }\n}"},{"title":"main：跑一遍","note":"push/pop 与自底向上 build_heap 两条路径都验证","code":"static void heap_print(const IntHeap *h, const char *tag)\n{\n    printf(\"%s [\", tag);\n    for (size_t i = 0; i < h->size; ++i) {\n        printf(\"%s%d\", i == 0 ? \"\" : \" \", h->data[i]);\n    }\n    printf(\"]\\n\");\n}\n\n/* 校验小顶堆性质：每个非根结点都不小于其父结点。 */\nstatic bool heap_is_valid(const IntHeap *h)\n{\n    for (size_t i = 1; i < h->size; ++i) {\n        if (h->data[(i - 1) / 2] > h->data[i]) {\n            return false;\n        }\n    }\n    return true;\n}\n\nint main(void)\n{\n    IntHeap h;\n    heap_init(&h);\n\n    const int vals[] = { 5, 3, 8, 1, 9, 2, 7 };\n    const size_t nvals = sizeof vals / sizeof vals[0];\n    for (size_t i = 0; i < nvals; ++i) {\n        if (!heap_push(&h, vals[i])) {\n            fprintf(stderr, \"heap_push 失败\\n\");\n            heap_free(&h);\n            return 1;\n        }\n    }\n    heap_print(&h, \"push 之后:\");\n    printf(\"堆顶(最小) = %d, size = %zu, 堆性质 = %s\\n\",\n           h.data[0], h.size, heap_is_valid(&h) ? \"ok\" : \"bad\");\n\n    printf(\"连续 pop:\");\n    int v = 0;\n    while (heap_pop(&h, &v)) {\n        printf(\" %d\", v);\n    }\n    printf(\"\\n\");\n    heap_free(&h);\n\n    IntHeap g;\n    heap_init(&g);\n    const int raw[] = { 9, 5, 8, 1, 3, 2, 7, 6, 4, 0 };\n    const size_t nraw = sizeof raw / sizeof raw[0];\n    if (!heap_reserve(&g, nraw)) {\n        fprintf(stderr, \"heap_reserve 失败\\n\");\n        heap_free(&g);\n        return 1;\n    }\n    for (size_t i = 0; i < nraw; ++i) {\n        g.data[g.size++] = raw[i];\n    }\n    heap_print(&g, \"build 之前:\");\n\n    heap_build(&g);\n    heap_print(&g, \"build_heap 之后:\");\n    printf(\"堆顶(最小) = %d, size = %zu, 堆性质 = %s\\n\",\n           g.data[0], g.size, heap_is_valid(&g) ? \"ok\" : \"bad\");\n\n    printf(\"连续 pop:\");\n    while (heap_pop(&g, &v)) {\n        printf(\" %d\", v);\n    }\n    printf(\"\\n\");\n    heap_free(&g);\n\n    return 0;\n}"}]},"cpp":{"file":"heap.cpp","steps":[{"title":"结构定义","note":"泛型二叉堆（compare 决定大小顶），vector 存完全二叉树","code":"#include <algorithm>\n#include <cstddef>\n#include <functional>\n#include <iostream>\n#include <optional>\n#include <stdexcept>\n#include <utility>\n#include <vector>\n\ntemplate <typename T, typename Compare = std::less<T>>\nclass BinaryHeap {\npublic:\n    BinaryHeap() = default;\n    explicit BinaryHeap(Compare comp) : comp_(std::move(comp)) {}\n    explicit BinaryHeap(std::vector<T> values, Compare comp = Compare{});\n\n    BinaryHeap(const BinaryHeap&) = default;\n    BinaryHeap& operator=(const BinaryHeap&) = default;\n    BinaryHeap(BinaryHeap&&) noexcept = default;\n    BinaryHeap& operator=(BinaryHeap&&) noexcept = default;\n    ~BinaryHeap() = default;\n\n    void push(const T& value);\n    void push(T&& value);\n    std::optional<T> pop();\n    const T& top() const;\n    bool empty() const noexcept { return data_.empty(); }\n    std::size_t size() const noexcept { return data_.size(); }\n    void clear() noexcept { data_.clear(); }\n    const std::vector<T>& data() const noexcept { return data_; }\n\n    void std_push(T value);\n    std::optional<T> std_pop();\n\n    void build_heap() noexcept;\n\nprivate:\n    void sift_up(std::size_t i) noexcept;\n    void sift_down(std::size_t i) noexcept;\n\n    std::vector<T> data_{};\n    Compare comp_{};\n};"},{"title":"初始化与销毁","note":"RAII，vector 负责内存；五法则显式 default 保证拷贝与移动正确","code":"template <typename T, typename Compare>\nBinaryHeap<T, Compare>::BinaryHeap(std::vector<T> values, Compare comp)\n    : data_(std::move(values)), comp_(std::move(comp))\n{\n    build_heap();\n}"},{"title":"上浮 sift_up + 入堆 push","note":"末位元素沿父链上浮；std_push 用 std","code":"template <typename T, typename Compare>\nvoid BinaryHeap<T, Compare>::sift_up(std::size_t i) noexcept\n{\n    T value = std::move(data_[i]);\n    while (i > 0) {\n        const std::size_t parent = (i - 1) / 2;\n        if (!comp_(data_[parent], value)) {\n            break;\n        }\n        data_[i] = std::move(data_[parent]);\n        i = parent;\n    }\n    data_[i] = std::move(value);\n}\n\ntemplate <typename T, typename Compare>\nvoid BinaryHeap<T, Compare>::push(const T& value)\n{\n    data_.push_back(value);\n    sift_up(data_.size() - 1);\n}\n\ntemplate <typename T, typename Compare>\nvoid BinaryHeap<T, Compare>::push(T&& value)\n{\n    data_.push_back(std::move(value));\n    sift_up(data_.size() - 1);\n}\n\ntemplate <typename T, typename Compare>\nvoid BinaryHeap<T, Compare>::std_push(T value)\n{\n    data_.push_back(std::move(value));\n    std::push_heap(data_.begin(), data_.end(), comp_);\n}"},{"title":"下沉 sift_down + 出堆 pop","note":"末位补到根后与较优子结点交换下沉；std_pop 用 std","code":"template <typename T, typename Compare>\nvoid BinaryHeap<T, Compare>::sift_down(std::size_t i) noexcept\n{\n    const std::size_t n = data_.size();\n    T value = std::move(data_[i]);\n    for (;;) {\n        const std::size_t left = 2 * i + 1;\n        if (left >= n) {\n            break;\n        }\n        const std::size_t right = left + 1;\n        std::size_t best = left;\n        if (right < n && comp_(data_[left], data_[right])) {\n            best = right;\n        }\n        if (!comp_(value, data_[best])) {\n            break;\n        }\n        data_[i] = std::move(data_[best]);\n        i = best;\n    }\n    data_[i] = std::move(value);\n}\n\ntemplate <typename T, typename Compare>\nstd::optional<T> BinaryHeap<T, Compare>::pop()\n{\n    if (data_.empty()) {\n        return std::nullopt;\n    }\n    T out = std::move(data_.front());\n    data_.front() = std::move(data_.back());\n    data_.pop_back();\n    if (!data_.empty()) {\n        sift_down(0);\n    }\n    return out;\n}\n\ntemplate <typename T, typename Compare>\nconst T& BinaryHeap<T, Compare>::top() const\n{\n    if (data_.empty()) {\n        throw std::out_of_range(\"BinaryHeap::top: 堆为空\");\n    }\n    return data_.front();\n}\n\ntemplate <typename T, typename Compare>\nstd::optional<T> BinaryHeap<T, Compare>::std_pop()\n{\n    if (data_.empty()) {\n        return std::nullopt;\n    }\n    std::pop_heap(data_.begin(), data_.end(), comp_);\n    T out = std::move(data_.back());\n    data_.pop_back();\n    return out;\n}"},{"title":"建堆 build_heap（O(n)）","note":"从 i = n/2-1 下沉到 0；层数越高结点越多但高度越低，总代价线性","code":"template <typename T, typename Compare>\nvoid BinaryHeap<T, Compare>::build_heap() noexcept\n{\n    for (std::size_t i = data_.size() / 2; i > 0; ) {\n        --i;\n        sift_down(i);\n    }\n}"},{"title":"main：跑一遍","note":"手写 push/pop 与 std","code":"static void print_heap(const char *tag, const std::vector<int>& data)\n{\n    std::cout << tag << \" [\";\n    for (std::size_t i = 0; i < data.size(); ++i) {\n        std::cout << (i == 0 ? \"\" : \" \") << data[i];\n    }\n    std::cout << \"]\\n\";\n}\n\nint main()\n{\n    using MinHeap = BinaryHeap<int, std::greater<int>>;\n\n    MinHeap h;\n    for (int v : {5, 3, 8, 1, 9, 2, 7}) {\n        h.push(v);\n    }\n    print_heap(\"手写 push 之后:\", h.data());\n    std::cout << \"堆顶(最小) = \" << h.top() << \", size = \" << h.size() << \"\\n\";\n    std::cout << \"手写 pop:\";\n    while (const auto v = h.pop()) {\n        std::cout << ' ' << *v;\n    }\n    std::cout << \"\\n\";\n\n    MinHeap g(std::vector<int>{9, 5, 8, 1, 3, 2, 7, 6, 4, 0});\n    print_heap(\"build_heap 之后:\", g.data());\n    std::cout << \"堆顶(最小) = \" << g.top() << \", size = \" << g.size() << \"\\n\";\n    std::cout << \"build_heap pop:\";\n    while (const auto v = g.pop()) {\n        std::cout << ' ' << *v;\n    }\n    std::cout << \"\\n\";\n\n    MinHeap s;\n    for (int v : {5, 3, 8, 1, 9, 2, 7}) {\n        s.std_push(v);\n    }\n    std::cout << \"std_push 堆顶(最小) = \" << s.top() << \"\\n\";\n    std::cout << \"std_pop:\";\n    while (const auto v = s.std_pop()) {\n        std::cout << ' ' << *v;\n    }\n    std::cout << \"\\n\";\n\n    return 0;\n}"}]},"rs":{"file":"heap.rs","steps":[{"title":"结构定义","note":"Vec<i32> 存完全二叉树，左 2i+1、右 2i+2、父 (i-1)/2","code":"/// 小顶堆：用 Vec<i32> 顺序存储完全二叉树。\n#[derive(Debug, Clone, Default)]\npub struct MinHeap {\n    data: Vec<i32>,\n}"},{"title":"初始化与销毁","note":"Vec 的 Drop 自动释放；new/with_capacity/clear 提供构造与重置","code":"impl MinHeap {\n    /// 创建空堆。\n    pub fn new() -> Self {\n        Self { data: Vec::new() }\n    }\n\n    /// 预留容量，避免反复扩容。\n    pub fn with_capacity(capacity: usize) -> Self {\n        Self { data: Vec::with_capacity(capacity) }\n    }\n\n    /// 元素个数。\n    pub fn len(&self) -> usize {\n        self.data.len()\n    }\n\n    /// 是否为空。\n    pub fn is_empty(&self) -> bool {\n        self.data.is_empty()\n    }\n\n    /// 清空但保留容量。\n    pub fn clear(&mut self) {\n        self.data.clear();\n    }\n\n    /// 读取堆顶，空堆返回 None。\n    pub fn peek(&self) -> Option<i32> {\n        self.data.first().copied()\n    }\n}"},{"title":"上浮 sift_up + 入堆 push","note":"新元素 push 到末尾后沿父链上浮","code":"impl MinHeap {\n    fn sift_up(&mut self, mut i: usize) {\n        let value = self.data[i];\n        while i > 0 {\n            let parent = (i - 1) / 2;\n            if self.data[parent] <= value {\n                break;\n            }\n            self.data[i] = self.data[parent];\n            i = parent;\n        }\n        self.data[i] = value;\n    }\n\n    /// 入堆，均摊 O(log n)。\n    pub fn push(&mut self, value: i32) {\n        self.data.push(value);\n        let last = self.data.len() - 1;\n        self.sift_up(last);\n    }\n}"},{"title":"下沉 sift_down + 出堆 pop","note":"末尾元素补到根后与较小子结点交换下沉","code":"impl MinHeap {\n    fn sift_down(&mut self, mut i: usize) {\n        let n = self.data.len();\n        let value = self.data[i];\n        loop {\n            let left = 2 * i + 1;\n            if left >= n {\n                break;\n            }\n            let right = left + 1;\n            let mut best = left;\n            if right < n && self.data[right] < self.data[left] {\n                best = right;\n            }\n            if self.data[best] >= value {\n                break;\n            }\n            self.data[i] = self.data[best];\n            i = best;\n        }\n        self.data[i] = value;\n    }\n\n    /// 出堆，返回原来的堆顶；空堆返回 None。\n    pub fn pop(&mut self) -> Option<i32> {\n        if self.data.is_empty() {\n            return None;\n        }\n        let last = self.data.len() - 1;\n        self.data.swap(0, last);\n        let out = self.data.pop();\n        if !self.data.is_empty() {\n            self.sift_down(0);\n        }\n        out\n    }\n}"},{"title":"建堆 build_heap（O(n)）","note":"自底向上 i = n/2-1 .. 0 下沉；结点数随层数指数增长而高度线性下降，求和收敛到 O(n)","code":"impl MinHeap {\n    /// 用一组无序数据建堆：自底向上堆化，O(n)。\n    pub fn from_vec(values: Vec<i32>) -> Self {\n        let mut heap = Self { data: values };\n        heap.build_heap();\n        heap\n    }\n\n    /// 就地把当前数组调整为小顶堆。\n    pub fn build_heap(&mut self) {\n        let mut i = self.data.len() / 2;\n        while i > 0 {\n            i -= 1;\n            self.sift_down(i);\n        }\n    }\n}"},{"title":"main：跑一遍","note":"push/pop 与 build_heap 两条路径都验证","code":"fn main() {\n    let mut heap = MinHeap::with_capacity(7);\n    for value in [5, 3, 8, 1, 9, 2, 7] {\n        heap.push(value);\n    }\n    println!(\"push 之后堆顶(最小) = {:?}, len = {}\", heap.peek(), heap.len());\n\n    let mut popped = Vec::new();\n    while let Some(value) = heap.pop() {\n        popped.push(value);\n    }\n    println!(\"pop 序列: {:?}\", popped);\n\n    let mut built = MinHeap::from_vec(vec![9, 5, 8, 1, 3, 2, 7, 6, 4, 0]);\n    println!(\"build_heap 之后堆顶(最小) = {:?}, len = {}\", built.peek(), built.len());\n\n    let mut popped2 = Vec::new();\n    while let Some(value) = built.pop() {\n        popped2.push(value);\n    }\n    println!(\"build_heap pop 序列: {:?}\", popped2);\n}"}]}},"graph":{"c":{"file":"graph.c","steps":[{"title":"邻接表结构","note":"每个顶点挂一条边结点链表，无向图一条边存两个方向","code":"#include <stdio.h>\n#include <stdlib.h>\n#include <stdbool.h>\n#include <assert.h>\n\ntypedef struct AdjNode {\n    int              to;\n    struct AdjNode  *next;\n} AdjNode;\n\ntypedef struct {\n    AdjNode **heads;\n    size_t    n;\n    size_t    m;\n} Graph;"},{"title":"加边 add_edge","note":"头插法 O(1)，越界返回 false，无向边两侧都插入","code":"static AdjNode *adj_new(int to)\n{\n    AdjNode *node = (AdjNode *)malloc(sizeof *node);\n    if (node == NULL) {\n        return NULL;\n    }\n    node->to = to;\n    node->next = NULL;\n    return node;\n}\n\nbool graph_add_edge(Graph *g, int u, int v)\n{\n    if (u < 0 || v < 0 || (size_t)u >= g->n || (size_t)v >= g->n) {\n        return false;\n    }\n    AdjNode *a = adj_new(v);\n    AdjNode *b = adj_new(u);\n    if (a == NULL || b == NULL) {\n        free(a);\n        free(b);\n        return false;\n    }\n    a->next = g->heads[u];\n    g->heads[u] = a;\n    b->next = g->heads[v];\n    g->heads[v] = b;\n    ++g->m;\n    return true;\n}"},{"title":"建图与销毁","note":"calloc 顶点表，graph_free 逐条释放边结点与顶点表","code":"Graph *graph_create(size_t n)\n{\n    Graph *g = (Graph *)malloc(sizeof *g);\n    if (g == NULL) {\n        return NULL;\n    }\n    g->heads = (AdjNode **)calloc(n, sizeof *g->heads);\n    if (g->heads == NULL) {\n        free(g);\n        return NULL;\n    }\n    g->n = n;\n    g->m = 0;\n    return g;\n}\n\nvoid graph_free(Graph *g)\n{\n    if (g == NULL) {\n        return;\n    }\n    for (size_t i = 0; i < g->n; ++i) {\n        AdjNode *p = g->heads[i];\n        while (p != NULL) {\n            AdjNode *next = p->next;\n            free(p);\n            p = next;\n        }\n    }\n    free(g->heads);\n    free(g);\n}"},{"title":"广度优先 BFS","note":"数组队列 + visited，每个未访问顶点启动一次以覆盖整个图","code":"static void bfs_from(const Graph *g, int start, bool *visited, int *order, size_t *count)\n{\n    int *queue = (int *)malloc(g->n * sizeof *queue);\n    if (queue == NULL) {\n        return;\n    }\n    size_t head = 0;\n    size_t tail = 0;\n    visited[start] = true;\n    queue[tail++] = start;\n    while (head < tail) {\n        const int u = queue[head++];\n        order[(*count)++] = u;\n        for (const AdjNode *p = g->heads[u]; p != NULL; p = p->next) {\n            if (!visited[p->to]) {\n                visited[p->to] = true;\n                queue[tail++] = p->to;\n            }\n        }\n    }\n    free(queue);\n}\n\nsize_t graph_bfs(const Graph *g, int *order, size_t *components)\n{\n    bool *visited = (bool *)calloc(g->n, sizeof *visited);\n    if (visited == NULL) {\n        return 0;\n    }\n    size_t count = 0;\n    *components = 0;\n    for (size_t s = 0; s < g->n; ++s) {\n        if (!visited[s]) {\n            ++(*components);\n            bfs_from(g, (int)s, visited, order, &count);\n        }\n    }\n    free(visited);\n    return count;\n}"},{"title":"深度优先 DFS","note":"递归 + visited，同样对每个未访问顶点启动一次","code":"static void dfs_visit(const Graph *g, int u, bool *visited, int *order, size_t *count)\n{\n    visited[u] = true;\n    order[(*count)++] = u;\n    for (const AdjNode *p = g->heads[u]; p != NULL; p = p->next) {\n        if (!visited[p->to]) {\n            dfs_visit(g, p->to, visited, order, count);\n        }\n    }\n}\n\nsize_t graph_dfs(const Graph *g, int *order, size_t *components)\n{\n    bool *visited = (bool *)calloc(g->n, sizeof *visited);\n    if (visited == NULL) {\n        return 0;\n    }\n    size_t count = 0;\n    *components = 0;\n    for (size_t s = 0; s < g->n; ++s) {\n        if (!visited[s]) {\n            ++(*components);\n            dfs_visit(g, (int)s, visited, order, &count);\n        }\n    }\n    free(visited);\n    return count;\n}"},{"title":"main：跑一遍","note":"6 顶点 7 边（K4 加一条独立边），打印遍历顺序与连通分量数","code":"static void print_order(const char *tag, const int *order, size_t n)\n{\n    printf(\"%s:\", tag);\n    for (size_t i = 0; i < n; ++i) {\n        printf(\" %d\", order[i]);\n    }\n    printf(\"\\n\");\n}\n\nint main(void)\n{\n    Graph *g = graph_create(6);\n    if (g == NULL) {\n        fprintf(stderr, \"graph_create 失败\\n\");\n        return 1;\n    }\n\n    const int edges[][2] = {\n        {0, 1}, {0, 2}, {0, 3}, {1, 2}, {1, 3}, {2, 3}, {4, 5}\n    };\n    const size_t edge_count = sizeof edges / sizeof edges[0];\n    for (size_t i = 0; i < edge_count; ++i) {\n        if (!graph_add_edge(g, edges[i][0], edges[i][1])) {\n            fprintf(stderr, \"graph_add_edge 失败\\n\");\n            graph_free(g);\n            return 1;\n        }\n    }\n    printf(\"顶点数 n = %zu, 边数 m = %zu\\n\", g->n, g->m);\n\n    int *order = (int *)malloc(g->n * sizeof *order);\n    if (order == NULL) {\n        graph_free(g);\n        return 1;\n    }\n\n    size_t components = 0;\n    const size_t bfs_n = graph_bfs(g, order, &components);\n    print_order(\"BFS 顺序\", order, bfs_n);\n    printf(\"连通分量个数 = %zu\\n\", components);\n\n    const size_t dfs_n = graph_dfs(g, order, &components);\n    print_order(\"DFS 顺序\", order, dfs_n);\n    printf(\"连通分量个数 = %zu\\n\", components);\n\n    free(order);\n    graph_free(g);\n    return 0;\n}"}]},"cpp":{"file":"graph.cpp","steps":[{"title":"邻接表结构","note":"vector<vector<size_t>> 邻接表，顶点编号 0..n-1","code":"#include <cstddef>\n#include <iostream>\n#include <queue>\n#include <stdexcept>\n#include <utility>\n#include <vector>\n\nstruct Traversal {\n    std::vector<std::size_t> order;\n    std::size_t components = 0;\n};\n\nclass Graph {\npublic:\n    explicit Graph(std::size_t n);\n\n    void add_edge(std::size_t u, std::size_t v);\n    std::size_t vertex_count() const noexcept;\n    std::size_t edge_count() const noexcept;\n    Traversal bfs() const;\n    Traversal dfs() const;\n\nprivate:\n    void dfs_visit(std::size_t u, std::vector<bool>& visited, std::vector<std::size_t>& order) const;\n\n    std::vector<std::vector<std::size_t>> adj_;\n    std::size_t edges_ = 0;\n};"},{"title":"加边 add_edge","note":"越界抛 std","code":"void Graph::add_edge(std::size_t u, std::size_t v)\n{\n    if (u >= adj_.size() || v >= adj_.size()) {\n        throw std::out_of_range(\"Graph::add_edge: 顶点下标越界\");\n    }\n    adj_[u].push_back(v);\n    adj_[v].push_back(u);\n    ++edges_;\n}"},{"title":"建图与销毁","note":"构造函数分配顶点数组，析构由 vector 自动完成（RAII）","code":"Graph::Graph(std::size_t n) : adj_(n)\n{\n}\n\nstd::size_t Graph::vertex_count() const noexcept\n{\n    return adj_.size();\n}\n\nstd::size_t Graph::edge_count() const noexcept\n{\n    return edges_;\n}"},{"title":"广度优先 BFS","note":"std","code":"Traversal Graph::bfs() const\n{\n    Traversal result;\n    std::vector<bool> visited(adj_.size(), false);\n    std::queue<std::size_t> pending;\n    for (std::size_t s = 0; s < adj_.size(); ++s) {\n        if (visited[s]) {\n            continue;\n        }\n        ++result.components;\n        visited[s] = true;\n        pending.push(s);\n        while (!pending.empty()) {\n            const std::size_t u = pending.front();\n            pending.pop();\n            result.order.push_back(u);\n            for (const std::size_t v : adj_[u]) {\n                if (!visited[v]) {\n                    visited[v] = true;\n                    pending.push(v);\n                }\n            }\n        }\n    }\n    return result;\n}"},{"title":"深度优先 DFS","note":"递归 + visited，外层循环覆盖所有连通分量","code":"void Graph::dfs_visit(std::size_t u, std::vector<bool>& visited, std::vector<std::size_t>& order) const\n{\n    visited[u] = true;\n    order.push_back(u);\n    for (const std::size_t v : adj_[u]) {\n        if (!visited[v]) {\n            dfs_visit(v, visited, order);\n        }\n    }\n}\n\nTraversal Graph::dfs() const\n{\n    Traversal result;\n    std::vector<bool> visited(adj_.size(), false);\n    for (std::size_t s = 0; s < adj_.size(); ++s) {\n        if (!visited[s]) {\n            ++result.components;\n            dfs_visit(s, visited, result.order);\n        }\n    }\n    return result;\n}"},{"title":"main：跑一遍","note":"6 顶点 7 边，打印 BFS/DFS 顺序与连通分量个数","code":"static void print_order(const char *tag, const std::vector<std::size_t>& order)\n{\n    std::cout << tag << ':';\n    for (const std::size_t v : order) {\n        std::cout << ' ' << v;\n    }\n    std::cout << '\\n';\n}\n\nint main()\n{\n    Graph g(6);\n    const std::pair<std::size_t, std::size_t> edges[] = {\n        {0, 1}, {0, 2}, {0, 3}, {1, 2}, {1, 3}, {2, 3}, {4, 5}\n    };\n    for (const auto& e : edges) {\n        g.add_edge(e.first, e.second);\n    }\n    std::cout << \"顶点数 n = \" << g.vertex_count()\n              << \", 边数 m = \" << g.edge_count() << '\\n';\n\n    const Traversal bfs = g.bfs();\n    print_order(\"BFS 顺序\", bfs.order);\n    std::cout << \"连通分量个数 = \" << bfs.components << '\\n';\n\n    const Traversal dfs = g.dfs();\n    print_order(\"DFS 顺序\", dfs.order);\n    std::cout << \"连通分量个数 = \" << dfs.components << '\\n';\n\n    return 0;\n}"}]},"rs":{"file":"graph.rs","steps":[{"title":"邻接表结构","note":"Vec<Vec<usize>> 邻接表，顶点编号 0..n-1","code":"use std::collections::VecDeque;\n\n/// 无向图：adj[u] 保存与顶点 u 相邻的所有顶点。\n#[derive(Debug, Clone)]\npub struct Graph {\n    adj: Vec<Vec<usize>>,\n    edges: usize,\n}"},{"title":"加边 add_edge","note":"越界返回 Err，无向边两侧都 push，均摊 O(1)","code":"impl Graph {\n    /// 在无向图中加入一条边，顶点下标从 0 开始；下标越界时返回 Err。\n    pub fn add_edge(&mut self, u: usize, v: usize) -> Result<(), String> {\n        let n = self.adj.len();\n        if u >= n || v >= n {\n            return Err(format!(\"顶点下标越界: ({u}, {v})，顶点数 {n}\"));\n        }\n        self.adj[u].push(v);\n        self.adj[v].push(u);\n        self.edges += 1;\n        Ok(())\n    }\n}"},{"title":"建图与销毁","note":"new 构造，Vec 的 Drop 自动释放（无需手写析构）","code":"impl Graph {\n    /// 创建含 n 个顶点、没有边的图。\n    pub fn new(n: usize) -> Self {\n        Self {\n            adj: vec![Vec::new(); n],\n            edges: 0,\n        }\n    }\n\n    /// 顶点数。\n    pub fn vertex_count(&self) -> usize {\n        self.adj.len()\n    }\n\n    /// 边数。\n    pub fn edge_count(&self) -> usize {\n        self.edges\n    }\n}"},{"title":"广度优先 BFS","note":"VecDeque 队列 + visited，每个未访问顶点启动一次以覆盖全图","code":"impl Graph {\n    /// 返回（访问顺序, 连通分量个数）。\n    pub fn bfs(&self) -> (Vec<usize>, usize) {\n        let n = self.adj.len();\n        let mut visited = vec![false; n];\n        let mut order = Vec::with_capacity(n);\n        let mut queue = VecDeque::new();\n        let mut components = 0usize;\n        for start in 0..n {\n            if visited[start] {\n                continue;\n            }\n            components += 1;\n            visited[start] = true;\n            queue.push_back(start);\n            while let Some(u) = queue.pop_front() {\n                order.push(u);\n                for &v in &self.adj[u] {\n                    if !visited[v] {\n                        visited[v] = true;\n                        queue.push_back(v);\n                    }\n                }\n            }\n        }\n        (order, components)\n    }\n}"},{"title":"深度优先 DFS","note":"递归 + visited，同样覆盖所有连通分量","code":"impl Graph {\n    fn dfs_visit(&self, u: usize, visited: &mut [bool], order: &mut Vec<usize>) {\n        visited[u] = true;\n        order.push(u);\n        for &v in &self.adj[u] {\n            if !visited[v] {\n                self.dfs_visit(v, visited, order);\n            }\n        }\n    }\n\n    /// 返回（访问顺序, 连通分量个数）。\n    pub fn dfs(&self) -> (Vec<usize>, usize) {\n        let n = self.adj.len();\n        let mut visited = vec![false; n];\n        let mut order = Vec::with_capacity(n);\n        let mut components = 0usize;\n        for start in 0..n {\n            if !visited[start] {\n                components += 1;\n                self.dfs_visit(start, &mut visited, &mut order);\n            }\n        }\n        (order, components)\n    }\n}"},{"title":"main：跑一遍","note":"6 顶点 7 边，打印 BFS/DFS 顺序与连通分量个数","code":"fn main() {\n    let mut graph = Graph::new(6);\n    let edges = [\n        (0usize, 1usize),\n        (0, 2),\n        (0, 3),\n        (1, 2),\n        (1, 3),\n        (2, 3),\n        (4, 5),\n    ];\n    for &(u, v) in &edges {\n        graph.add_edge(u, v).expect(\"加边失败\");\n    }\n    println!(\n        \"顶点数 n = {}, 边数 m = {}\",\n        graph.vertex_count(),\n        graph.edge_count()\n    );\n\n    let (bfs_order, bfs_components) = graph.bfs();\n    println!(\"BFS 顺序: {bfs_order:?}\");\n    println!(\"连通分量个数 = {}\", bfs_components);\n\n    let (dfs_order, dfs_components) = graph.dfs();\n    println!(\"DFS 顺序: {dfs_order:?}\");\n    println!(\"连通分量个数 = {}\", dfs_components);\n}"}]}},"sort":{"c":{"file":"sort.c","steps":[{"title":"冒泡排序 bubble_sort","note":"相邻比较交换，一轮无交换则提前结束","code":"#include <stdio.h>\n#include <stdlib.h>\n#include <stdbool.h>\n#include <string.h>\n#include <assert.h>\n\nvoid bubble_sort(int *a, size_t n)\n{\n    for (size_t end = n; end > 1; --end) {\n        bool swapped = false;\n        for (size_t i = 1; i < end; ++i) {\n            if (a[i - 1] > a[i]) {\n                const int t = a[i - 1];\n                a[i - 1] = a[i];\n                a[i] = t;\n                swapped = true;\n            }\n        }\n        if (!swapped) {\n            break;\n        }\n    }\n}"},{"title":"插入排序 insertion_sort","note":"把 a[i] 插入前面已经有序的区间","code":"void insertion_sort(int *a, size_t n)\n{\n    for (size_t i = 1; i < n; ++i) {\n        const int key = a[i];\n        size_t j = i;\n        while (j > 0 && a[j - 1] > key) {\n            a[j] = a[j - 1];\n            --j;\n        }\n        a[j] = key;\n    }\n}"},{"title":"归并排序 merge_sort","note":"额外 malloc 一个临时数组，失败时回退插入排序保证正确性","code":"static void merge(int *a, int *tmp, size_t lo, size_t mid, size_t hi)\n{\n    size_t i = lo;\n    size_t j = mid;\n    size_t k = lo;\n    while (i < mid && j < hi) {\n        if (a[i] <= a[j]) {\n            tmp[k++] = a[i++];\n        } else {\n            tmp[k++] = a[j++];\n        }\n    }\n    while (i < mid) {\n        tmp[k++] = a[i++];\n    }\n    while (j < hi) {\n        tmp[k++] = a[j++];\n    }\n    for (size_t t = lo; t < hi; ++t) {\n        a[t] = tmp[t];\n    }\n}\n\nstatic void merge_sort_rec(int *a, int *tmp, size_t lo, size_t hi)\n{\n    if (hi - lo < 2) {\n        return;\n    }\n    const size_t mid = lo + (hi - lo) / 2;\n    merge_sort_rec(a, tmp, lo, mid);\n    merge_sort_rec(a, tmp, mid, hi);\n    merge(a, tmp, lo, mid, hi);\n}\n\nvoid merge_sort(int *a, size_t n)\n{\n    if (n < 2) {\n        return;\n    }\n    int *tmp = (int *)malloc(n * sizeof *tmp);\n    if (tmp == NULL) {\n        insertion_sort(a, n);\n        return;\n    }\n    merge_sort_rec(a, tmp, 0, n);\n    free(tmp);\n}"},{"title":"快速排序 quick_sort（Lomuto 分区）","note":"固定取末尾为主元保证确定性；最坏 O(n^2)，三数取中或随机主元可改善","code":"static size_t lomuto_partition(int *a, size_t lo, size_t hi)\n{\n    const int pivot = a[hi];\n    size_t i = lo;\n    for (size_t j = lo; j < hi; ++j) {\n        if (a[j] < pivot) {\n            const int t = a[i];\n            a[i] = a[j];\n            a[j] = t;\n            ++i;\n        }\n    }\n    const int t = a[i];\n    a[i] = a[hi];\n    a[hi] = t;\n    return i;\n}\n\nstatic void quick_sort_range(int *a, size_t lo, size_t hi)\n{\n    while (hi - lo > 1) {\n        const size_t p = lomuto_partition(a, lo, hi - 1);\n        if (p - lo < hi - (p + 1)) {\n            quick_sort_range(a, lo, p);\n            lo = p + 1;\n        } else {\n            quick_sort_range(a, p + 1, hi);\n            hi = p;\n        }\n    }\n}\n\nvoid quick_sort(int *a, size_t n)\n{\n    if (n > 1) {\n        quick_sort_range(a, 0, n);\n    }\n}"},{"title":"main：跑一遍","note":"同一组数据跑四种排序，逐一与期望升序数组比对","code":"static void print_array(const char *tag, const int *a, size_t n)\n{\n    printf(\"%s:\", tag);\n    for (size_t i = 0; i < n; ++i) {\n        printf(\" %d\", a[i]);\n    }\n    printf(\"\\n\");\n}\n\nstatic bool is_sorted(const int *a, size_t n)\n{\n    for (size_t i = 1; i < n; ++i) {\n        if (a[i - 1] > a[i]) {\n            return false;\n        }\n    }\n    return true;\n}\n\ntypedef void (*SortFn)(int *, size_t);\n\nstatic void run_and_check(const char *name, SortFn fn,\n                          const int *base, const int *expected, size_t n)\n{\n    int buffer[16];\n    assert(n <= sizeof buffer / sizeof buffer[0]);\n    memcpy(buffer, base, n * sizeof *buffer);\n    fn(buffer, n);\n    print_array(name, buffer, n);\n    if (!is_sorted(buffer, n) || memcmp(buffer, expected, n * sizeof *buffer) != 0) {\n        printf(\"  [失败] %s 结果不正确\\n\", name);\n        exit(EXIT_FAILURE);\n    }\n    printf(\"  %s 结果正确\\n\", name);\n}\n\nint main(void)\n{\n    const int base[] = { 5, 2, 9, 1, 5, 6, -3, 8,
