window.DSV_EX = {"array":[null,{"c":"/* 原地删除所有等于 value 的元素：读指针扫全部，写指针只在\"该保留\"时前进。\n   O(n) 时间、O(1) 额外空间，不用新建数组，也不会退化成 O(n^2)。 */\nvoid arrayRemoveAll(MyArray* a, int value)\n{\n    int w = 0;\n\n    for (int r = 0; r < a->size; r++)\n    {\n        if (a->data[r] != value)\n        {\n            a->data[w] = a->data[r];   /* 该留：写到 w 位置 */\n            w++;\n        }\n        /* 该删：w 原地不动，后面的元素自然覆盖上来 */\n    }\n\n    a->size = w;      /* 尾巴上的脏数据不用清，下次 pushBack 会覆盖 */\n}","cpp":"// 给 MyArray 再加一个成员函数（类里记得也补一行声明）\nvoid MyArray::removeAll(int value)\n{\n    int w = 0;                        // 写指针：下一个\"该保留\"的元素放到哪\n\n    for (int r = 0; r < size; r++)    // 读指针：扫过每一个元素\n    {\n        if (arr[r] != value)\n        {\n            arr[w] = arr[r];          // 该留 -> 挪到 w 位置\n            w++;\n        }\n        // 该删 -> w 不动，后面的元素自然覆盖上来\n    }\n\n    size = w;\n}","rs":"// 给 MyArray 再加一个方法\nimpl MyArray\n{\n    pub fn remove_all(&mut self, value: i32)\n    {\n        let mut w = 0;                     // 写指针\n\n        for r in 0..self.data.len()        // 读指针\n        {\n            if self.data[r] != value\n            {\n                self.data[w] = self.data[r];\n                w += 1;\n            }\n        }\n\n        self.data.truncate(w);             // 后面的都不要了\n    }\n}"}],"string":[null,{"c":"/* 朴素匹配 BF：i 扫主串，j 扫模式串；失配时 i 回到\"本轮起点的下一格\"，j 归零。\n   返回首次出现的下标，找不到返回 -1。最坏 O(n*m)。 */\nint bfMatch(SString* text, SString* pattern)\n{\n    int i = 0;\n    int j = 0;\n\n    while (i < text->length && j < pattern->length)\n    {\n        if (text->data[i] == pattern->data[j])\n        {\n            i++;                       /* 这一位对上了，两个指针一起走 */\n            j++;\n        }\n        else\n        {\n            i = i - j + 1;             /* 回退：本轮起点是 i-j，下一轮从它 +1 开始 */\n            j = 0;                     /* 模式串重新从头比 */\n        }\n    }\n\n    if (j == pattern->length)\n    {\n        return i - pattern->length;    /* 全比完了，起点就是 i-模式串长度 */\n    }\n    return -1;\n}","cpp":"// 给 SString 再加一个成员函数（类里记得补声明）\nint SString::bfMatch(SString* pattern)\n{\n    int i = 0;\n    int j = 0;\n\n    while (i < length && j < pattern->length)\n    {\n        if (data[i] == pattern->data[j])\n        {\n            i++;\n            j++;\n        }\n        else\n        {\n            i = i - j + 1;        // 回退到本轮起点的下一格\n            j = 0;\n        }\n    }\n\n    if (j == pattern->length)\n    {\n        return i - pattern->length;\n    }\n    return -1;\n}","rs":"// 给 SString 再加一个方法\nimpl SString\n{\n    fn bf_match(&self, pattern: &SString) -> i32\n    {\n        let mut i: usize = 0;\n        let mut j: usize = 0;\n\n        while i < self.length && j < pattern.length\n        {\n            if self.data[i] == pattern.data[j]\n            {\n                i += 1;\n                j += 1;\n            }\n            else\n            {\n                i = i - j + 1;        // 回退到本轮起点的下一格\n                j = 0;\n            }\n        }\n\n        if j == pattern.length\n        {\n            return (i - pattern.length) as i32;\n        }\n        -1\n    }\n}"},{"c":"/* 求 next：next[0] = -1 是哨兵；i 是\"已匹配前缀的下一位\"，j 是最长相等前后缀长度。\n   模式串 ababaa 的结果是 -1 0 0 1 2 3。 */\nvoid getNext(SString* pattern, int next[])\n{\n    int i = 0;\n    int j = -1;\n    next[0] = -1;\n\n    while (i < pattern->length - 1)\n    {\n        if (j == -1 || pattern->data[i] == pattern->data[j])\n        {\n            i++;\n            j++;\n            next[i] = j;       /* 多匹配一位，next 值就多 1 */\n        }\n        else\n        {\n            j = next[j];       /* 退到更短的公共前后缀继续试 */\n        }\n    }\n}\n\nvoid checkNext(void)\n{\n    SString p;\n    int next[100];\n    strInit(&p);\n    strAssign(&p, \"ababaa\");\n    getNext(&p, next);\n    printf(\"next =\");\n    for (int i = 0; i < p.length; i++) printf(\" %d\", next[i]);\n    printf(\"\\n\");\n}","cpp":"// 给 SString 再加成员函数 getNext（类里记得补声明）\nvoid SString::getNext(int next[])\n{\n    int i = 0;\n    int j = -1;\n    next[0] = -1;\n\n    while (i < length - 1)\n    {\n        if (j == -1 || data[i] == data[j])\n        {\n            i++;\n            j++;\n            next[i] = j;       // 多匹配一位，next 值就多 1\n        }\n        else\n        {\n            j = next[j];\n        }\n    }\n}\n\nvoid checkNext()\n{\n    SString p;\n    int next[100];\n    p.assign(\"ababaa\");\n    p.getNext(next);\n    std::cout << \"next =\";\n    for (int i = 0; i < p.getLength(); i++) std::cout << \" \" << next[i];\n    std::cout << std::endl;\n}","rs":"// 给 SString 再加一个方法\nimpl SString\n{\n    fn get_next(&self, next: &mut Vec<i32>)\n    {\n        let mut i: usize = 0;\n        let mut j: i32 = -1;\n        next[0] = -1;\n\n        while i < self.length - 1\n        {\n            if j == -1 || self.data[i] == self.data[j as usize]\n            {\n                i += 1;\n                j += 1;\n                next[i] = j;       // 多匹配一位，next 值就多 1\n            }\n            else\n            {\n                j = next[j as usize];\n            }\n        }\n    }\n}\n\nfn check_next()\n{\n    let mut p = SString::new();\n    p.assign(\"ababaa\");\n    let mut next = vec![0; p.length];\n    p.get_next(&mut next);\n    println!(\"next = {:?}\", next);   // 输出 [-1, 0, 0, 1, 2, 3]\n}"}],"linkedlist":[null,{"c":"/* 删除倒数第 k 个节点，只遍历一趟：\n   快指针先走 k 步，然后两个指针一起走，\n   快指针到尾时慢指针正好停在\"待删节点的前一个\"上。 */\nNode* listRemoveNthFromEnd(Node* head, int k)\n{\n    Node dummy;\n    dummy.data = 0;\n    dummy.next = head;              /* 哑结点：这样删头节点也不用特判 */\n\n    Node* fast = &dummy;\n    Node* slow = &dummy;\n\n    for (int i = 0; i < k; i++)\n    {\n        if (fast->next == NULL) return head;   /* k 比链表还长 */\n        fast = fast->next;\n    }\n\n    while (fast->next != NULL)      /* 两个指针一起走 */\n    {\n        fast = fast->next;\n        slow = slow->next;\n    }\n\n    Node* temp = slow->next;        /* slow 停在倒数第 k+1 个 */\n    slow->next = temp->next;\n    free(temp);\n\n    return dummy.next;\n}","cpp":"// 给 List 再加一个成员函数\nvoid List::removeNthFromEnd(int k)\n{\n    Node dummy;                     // 栈上的哑结点，不用 new\n    dummy.data = 0;\n    dummy.next = head;\n\n    Node* fast = &dummy;\n    Node* slow = &dummy;\n\n    for (int i = 0; i < k; i++)\n    {\n        fast = fast->next;\n    }\n\n    while (fast->next != nullptr)   // 两个指针一起走\n    {\n        fast = fast->next;\n        slow = slow->next;\n    }\n\n    Node* temp = slow->next;        // 先把要删的摘出来\n    slow->next = temp->next;        // 让前驱跨过它\n    delete temp;\n\n    head = dummy.next;              // 头可能变了，写回去\n    length--;\n}","rs":"// 给 List 再加上一个方法（写在 impl List { ... } 里面）\n//\n// 注意：C/C++ 里\"快慢指针一趟走完\"的写法在安全 Rust 里写不出来 ——\n// 它要同时持有两个 &mut 引用。所以这里退一步：先把值读进 Vec，删完再重建。\nimpl List\n{\n    pub fn remove_nth_from_end(&mut self, k: usize)\n    {\n        let mut values: Vec<i32> = Vec::new();\n        let mut cur = self.head.as_deref();\n\n        while let Some(node) = cur\n        {\n            values.push(node.data);\n            cur = node.next.as_deref();\n        }\n\n        let n = values.len();\n        if k == 0 || k > n\n        {\n            return;\n        }\n\n        values.remove(n - k);\n\n        let mut head: Option<Box<Node>> = None;\n        for i in (0..values.len()).rev()\n        {\n            head = Some(Box::new(Node { data: values[i], next: head }));\n        }\n\n        self.head = head;\n        self.length = values.len();\n    }\n}"},{"c":"/* 合并两个有序链表：哑结点 + 每次接上较小的那个头，\n   最后把没走完的那条链整段挂上去。 */\nNode* listMergeSorted(Node* a, Node* b)\n{\n    Node dummy;\n    dummy.data = 0;\n    dummy.next = NULL;\n\n    Node* tail = &dummy;\n\n    while (a != NULL && b != NULL)\n    {\n        if (a->data <= b->data) { tail->next = a; a = a->next; }\n        else                    { tail->next = b; b = b->next; }\n        tail = tail->next;\n    }\n\n    tail->next = (a != NULL) ? a : b;   /* 剩下的整条链直接接上 */\n    return dummy.next;\n}","cpp":"// 合并两个有序链表\nNode* mergeSorted(Node* a, Node* b)\n{\n    Node dummy;\n    dummy.data = 0;\n    dummy.next = nullptr;\n\n    Node* tail = &dummy;\n\n    while (a != nullptr && b != nullptr)\n    {\n        if (a->data <= b->data)\n        {\n            tail->next = a;\n            a = a->next;\n        }\n        else\n        {\n            tail->next = b;\n            b = b->next;\n        }\n        tail = tail->next;\n    }\n\n    tail->next = (a != nullptr) ? a : b;   // 剩下那条链整段接上\n    return dummy.next;\n}","rs":"// 合并两个有序链表（安全 Rust 版本：读成 Vec 归并后重建）\nfn collect_values(mut cur: Option<&Node>) -> Vec<i32>\n{\n    let mut out = Vec::new();\n\n    while let Some(node) = cur\n    {\n        out.push(node.data);\n        cur = node.next.as_deref();\n    }\n\n    out\n}\n\nfn merge_sorted(a: Option<Box<Node>>, b: Option<Box<Node>>) -> Option<Box<Node>>\n{\n    let va = collect_values(a.as_deref());\n    let vb = collect_values(b.as_deref());\n\n    let mut merged = Vec::new();\n    let mut i = 0;\n    let mut j = 0;\n\n    while i < va.len() && j < vb.len()\n    {\n        if va[i] <= vb[j] { merged.push(va[i]); i += 1; }\n        else              { merged.push(vb[j]); j += 1; }\n    }\n    while i < va.len() { merged.push(va[i]); i += 1; }\n    while j < vb.len() { merged.push(vb[j]); j += 1; }\n\n    let mut head: Option<Box<Node>> = None;\n    for k in (0..merged.len()).rev()\n    {\n        head = Some(Box::new(Node { data: merged[k], next: head }));\n    }\n\n    head\n}"}],"stack":[null,{"c":"/* 用两个栈实现队列：in 负责入队，out 负责出队。\n   只有当 out 为空时，才把 in 里的元素整体\"倒\"过去 —— 均摊 O(1)。\n\n     入队 1,2,3    in: [1,2,3]  out: []\n     出队          out 空 -> 倒过来 in: []  out: [3,2,1]  -> 弹出 1\n     再入队 4      in: [4]      out: [3,2]                 -> 弹出 2\n*/\ntypedef struct\n{\n    Stack in;\n    Stack out;\n} QueueByStacks;\n\nvoid qbsPush(QueueByStacks* q, int value)\n{\n    stackPush(&q->in, value);\n}\n\nint qbsPop(QueueByStacks* q)\n{\n    int value = 0;\n\n    if (q->out.size == 0)                  /* out 非空就别倒，否则顺序会乱 */\n    {\n        while (q->in.size != 0)\n        {\n            stackPop(&q->in, &value);\n            stackPush(&q->out, value);\n        }\n    }\n\n    stackPop(&q->out, &value);\n    return value;\n}","cpp":"// 用两个栈实现队列：in 负责入队，out 负责出队；均摊 O(1)\nclass QueueByStacks\n{\npublic:\n    void push(int value)\n    {\n        in.push(value);\n    }\n\n    int pop()\n    {\n        if (out.empty())            // 只在 out 空的时候倒一次\n        {\n            int value = 0;\n            while (in.peek(value))\n            {\n                in.pop();\n                out.push(value);\n            }\n        }\n\n        int top = 0;\n        out.peek(top);\n        out.pop();\n        return top;\n    }\n\nprivate:\n    Stack in;\n    Stack out;\n};","rs":"// 用两个栈实现队列：in 负责入队，out 负责出队；均摊 O(1)\npub struct QueueByStacks\n{\n    in_stack: Vec<i32>,\n    out_stack: Vec<i32>,\n}\n\nimpl QueueByStacks\n{\n    pub fn new() -> QueueByStacks\n    {\n        QueueByStacks { in_stack: Vec::new(), out_stack: Vec::new() }\n    }\n\n    pub fn push(&mut self, value: i32)\n    {\n        self.in_stack.push(value);\n    }\n\n    pub fn pop(&mut self) -> Option<i32>\n    {\n        if self.out_stack.is_empty()          // 只在 out 空的时候整体倒一次\n        {\n            while let Some(value) = self.in_stack.pop()\n            {\n                self.out_stack.push(value);\n            }\n        }\n\n        self.out_stack.pop()\n    }\n}"},{"c":"/* 最小栈：data 存数据，mins 存\"到当前为止的最小值\"，两个栈必须同步进出。\n   push / pop / min 全是 O(1)，代价是多一倍空间。 */\n#define MS_CAP 100\n\ntypedef struct\n{\n    int data[MS_CAP];\n    int mins[MS_CAP];\n    int size;\n} MinStack;\n\nvoid msInit(MinStack* m)\n{\n    m->size = 0;\n}\n\nvoid msPush(MinStack* m, int value)\n{\n    m->data[m->size] = value;\n\n    if (m->size == 0)\n    {\n        m->mins[m->size] = value;\n    }\n    else if (value < m->mins[m->size - 1])\n    {\n        m->mins[m->size] = value;                  /* 新的最小值 */\n    }\n    else\n    {\n        m->mins[m->size] = m->mins[m->size - 1];   /* 沿用上一轮的最小值 */\n    }\n\n    m->size++;\n}\n\nvoid msPop(MinStack* m)\n{\n    if (m->size > 0)\n    {\n        m->size--;      /* mins 跟着一起退，两个数组必须同步，漏了就全错 */\n    }\n}\n\nint msMin(MinStack* m)\n{\n    return m->mins[m->size - 1];\n}","cpp":"// 最小栈：数据数组 + \"历史最小值\"数组，push / pop / top / min 全是 O(1)\nclass MinStack\n{\npublic:\n    MinStack()\n    {\n        size = 0;\n    }\n\n    void push(int value)\n    {\n        data[size] = value;\n\n        if (size == 0)\n        {\n            mins[size] = value;\n        }\n        else if (value < mins[size - 1])\n        {\n            mins[size] = value;\n        }\n        else\n        {\n            mins[size] = mins[size - 1];\n        }\n\n        size++;\n    }\n\n    void pop()\n    {\n        if (size > 0)\n        {\n            size--;         // 两个数组必须同步\n        }\n    }\n\n    int top()\n    {\n        return data[size - 1];\n    }\n\n    int min()\n    {\n        return mins[size - 1];   // O(1) 取最小值\n    }\n\nprivate:\n    int data[100];\n    int mins[100];\n    int size;\n};","rs":"// 最小栈：mins 里记的是\"到当前为止的最小值\"，两个 Vec 必须同步进出\npub struct MinStack\n{\n    data: Vec<i32>,\n    mins: Vec<i32>,\n}\n\nimpl MinStack\n{\n    pub fn new() -> MinStack\n    {\n        MinStack { data: Vec::new(), mins: Vec::new() }\n    }\n\n    pub fn push(&mut self, value: i32)\n    {\n        let cur_min = match self.mins.last()\n        {\n            Some(&m) if m < value => m,     // 上一轮的最小值更小，就沿用\n            _ => value,                     // 否则新的最小值就是自己\n        };\n\n        self.data.push(value);\n        self.mins.push(cur_min);\n    }\n\n    pub fn pop(&mut self) -> Option<i32>\n    {\n        self.mins.pop();                    // 两个 Vec 必须同步\n        self.data.pop()\n    }\n\n    pub fn min(&self) -> Option<i32>\n    {\n        self.mins.last().copied()\n    }\n}"}],"queue":[null,{"c":"/* 用两个队列实现栈：每次 pop 时把 q[cur] 的前 n-1 个元素搬到另一个队列，\n   剩下的那一个就是栈顶；然后用 1-cur 这个下标技巧 O(1) 交换两个队列的角色。 */\ntypedef struct\n{\n    Queue q[2];\n    int cur;               /* 当前\"装数据\"的那个队列 */\n} StackByQueues;\n\nvoid sbqInit(StackByQueues* s, int cap)\n{\n    queueInit(&s->q[0], cap);\n    queueInit(&s->q[1], cap);\n    s->cur = 0;\n}\n\nvoid sbqPush(StackByQueues* s, int value)\n{\n    queueEnqueue(&s->q[s->cur], value);\n}\n\nint sbqPop(StackByQueues* s)\n{\n    int other = 1 - s->cur;\n\n    while (queueSize(&s->q[s->cur]) > 1)      /* 倒走 n-1 个 */\n    {\n        queueEnqueue(&s->q[other], queueDequeue(&s->q[s->cur]));\n    }\n\n    int top = queueDequeue(&s->q[s->cur]);\n    s->cur = other;                           /* O(1) 交换角色 */\n    return top;\n}","cpp":"// 用两个队列实现栈：push O(1)，pop O(n)\nclass StackByQueues\n{\npublic:\n    StackByQueues()\n    {\n        cur = 0;\n    }\n\n    void push(int value)\n    {\n        q[cur].enqueue(value);\n    }\n\n    int pop()\n    {\n        int other = 1 - cur;\n\n        while (q[cur].getSize() > 1)          // 倒走 n-1 个\n        {\n            int value = q[cur].dequeue();\n            q[other].enqueue(value);\n        }\n\n        int top = q[cur].dequeue();\n        cur = other;                          // O(1) 交换角色\n        return top;\n    }\n\nprivate:\n    Queue q[2];\n    int cur;\n};","rs":"// 用两个队列实现栈：push O(1)，pop O(n)\npub struct StackByQueues\n{\n    q: [Vec<i32>; 2],\n    cur: usize,\n}\n\nimpl StackByQueues\n{\n    pub fn new() -> StackByQueues\n    {\n        StackByQueues { q: [Vec::new(), Vec::new()], cur: 0 }\n    }\n\n    pub fn push(&mut self, value: i32)\n    {\n        self.q[self.cur].push(value);\n    }\n\n    pub fn pop(&mut self) -> Option<i32>\n    {\n        let other = 1 - self.cur;\n\n        while self.q[self.cur].len() > 1       // 倒走 n-1 个\n        {\n            let value = self.q[self.cur].remove(0);\n            self.q[other].push(value);\n        }\n\n        let top = self.q[self.cur].pop();\n        self.cur = other;                      // O(1) 交换角色\n        top\n    }\n}"},{"c":"/* 不牺牲格子的环形队列：多维护一个 size 字段来区分空和满，\n   容量就能 100% 用上。代价是多存一个计数器。 */\nbool rqFull(RingQueue* q)\n{\n    return q->size == q->capacity;\n}\n\nbool rqEmpty(RingQueue* q)\n{\n    return q->size == 0;\n}\n\nbool rqEnqueue(RingQueue* q, int value)\n{\n    if (rqFull(q))\n    {\n        return false;\n    }\n\n    q->data[q->tail] = value;\n    q->tail = (q->tail + 1) % q->capacity;\n    q->size++;\n    return true;\n}\n\nbool rqDequeue(RingQueue* q, int* out)\n{\n    if (rqEmpty(q))\n    {\n        return false;\n    }\n\n    *out = q->data[q->head];\n    q->head = (q->head + 1) % q->capacity;\n    q->size--;\n    return true;\n}","cpp":"// 用 size 字段区分空/满的环形队列：容量 100% 可用，不用牺牲格子\nclass RingQueue\n{\npublic:\n    RingQueue(int cap)\n    {\n        capacity = cap;\n        data = new int[capacity];\n        head = 0;\n        tail = 0;\n        count = 0;\n    }\n\n    ~RingQueue()\n    {\n        delete[] data;\n    }\n\n    bool full()\n    {\n        return count == capacity;\n    }\n\n    bool empty()\n    {\n        return count == 0;\n    }\n\n    bool enqueue(int value)\n    {\n        if (full())\n        {\n            return false;\n        }\n\n        data[tail] = value;\n        tail = (tail + 1) % capacity;\n        count++;\n        return true;\n    }\n\n    bool dequeue(int& out)\n    {\n        if (empty())\n        {\n            return false;\n        }\n\n        out = data[head];\n        head = (head + 1) % capacity;\n        count--;\n        return true;\n    }\n\nprivate:\n    int* data;\n    int capacity;\n    int head;\n    int tail;\n    int count;\n};","rs":"// 用 size 字段区分空/满的环形队列：容量 100% 可用\npub struct RingQueue\n{\n    data: Vec<Option<i32>>,\n    head: usize,\n    tail: usize,\n    count: usize,\n}\n\nimpl RingQueue\n{\n    pub fn new(capacity: usize) -> RingQueue\n    {\n        let mut data = Vec::new();\n        for _ in 0..capacity\n        {\n            data.push(None);\n        }\n\n        RingQueue { data, head: 0, tail: 0, count: 0 }\n    }\n\n    pub fn full(&self) -> bool\n    {\n        self.count == self.data.len()\n    }\n\n    pub fn empty(&self) -> bool\n    {\n        self.count == 0\n    }\n\n    pub fn enqueue(&mut self, value: i32) -> bool\n    {\n        if self.full()\n        {\n            return false;\n        }\n\n        self.data[self.tail] = Some(value);\n        self.tail = (self.tail + 1) % self.data.len();\n        self.count += 1;\n        true\n    }\n\n    pub fn dequeue(&mut self) -> Option<i32>\n    {\n        if self.empty()\n        {\n            return None;\n        }\n\n        let value = self.data[self.head];\n        self.data[self.head] = None;\n        self.head = (self.head + 1) % self.data.len();\n        self.count -= 1;\n        value\n    }\n}"}],"matrix":[null,{"c":"/* n 阶对称矩阵有 n*n 个位置，但 a[i][j] == a[j][i]。\n   只存下三角（含对角线）：第 0 行 1 个、第 1 行 2 个、……第 n-1 行 n 个，\n   一共 1+2+...+n = n*(n+1)/2 个存储单元，差不多是原来的一半。\n   下标从 0 开始：i >= j 时 k = i*(i+1)/2 + j；\n   i < j 时交换 i、j，取对称位置的下标。 */\nint symmetricIndex(int i, int j)\n{\n    if (i >= j)\n    {\n        return i * (i + 1) / 2 + j;\n    }\n    return j * (j + 1) / 2 + i;\n}\n\nint symmetricStorage(int n)\n{\n    return n * (n + 1) / 2;   /* n 阶只要这么多格 */\n}","cpp":"// 作为 SymMatrix 的成员函数（类里补 int indexOf(int i, int j);）\nint SymMatrix::indexOf(int i, int j)\n{\n    if (i >= j)\n    {\n        return i * (i + 1) / 2 + j;   // 下三角直接用公式\n    }\n    return j * (j + 1) / 2 + i;       // 上三角取镜像位置\n}\n\n// n 阶只需要 n*(n+1)/2 个单元，比 n*n 省掉整个上三角\nint SymMatrix::storageCount()\n{\n    return n * (n + 1) / 2;\n}","rs":"impl SymMatrix\n{\n    fn index_of(&self, i: usize, j: usize) -> usize\n    {\n        if i >= j\n        {\n            i * (i + 1) / 2 + j          // 下三角直接用公式\n        }\n        else\n        {\n            j * (j + 1) / 2 + i          // 上三角取镜像位置\n        }\n    }\n\n    // n 阶只需要 n*(n+1)/2 个单元\n    fn storage_count(&self) -> usize\n    {\n        self.n * (self.n + 1) / 2\n    }\n}"},{"c":"/* 普通转置：外层枚举原矩阵的每一列 col，内层把整个三元组表扫一遍，\n   遇到列号等于 col 的就放进目标表。外层 cols 次、内层 count 次，\n   所以是 O(cols * count)；快速转置用 num/pos 提前算好位置，\n   一趟就能放完，降到 O(cols + count)。 */\nvoid sparseTransposeSlow(SparseMatrix* source, SparseMatrix* target)\n{\n    target->rows = source->cols;\n    target->cols = source->rows;\n    target->count = source->count;\n\n    int dest = 0;\n    for (int col = 0; col < source->cols; col++)\n    {\n        for (int k = 0; k < source->count; k++)\n        {\n            if (source->data[k].col == col)\n            {\n                target->data[dest].row = source->data[k].col;   /* 行列互换 */\n                target->data[dest].col = source->data[k].row;\n                target->data[dest].value = source->data[k].value;\n                dest++;\n            }\n        }\n    }\n}","cpp":"// 给 SparseMatrix 再加一个成员函数，和快速转置对照着看\nvoid SparseMatrix::transposeSlow(SparseMatrix* target)\n{\n    target->rows = cols;\n    target->cols = rows;\n    target->count = count;\n\n    int dest = 0;\n    for (int col = 0; col < cols; col++)\n    {\n        for (int k = 0; k < count; k++)\n        {\n            if (data[k].col == col)\n            {\n                target->data[dest].row = data[k].col;   // 行列互换\n                target->data[dest].col = data[k].row;\n                target->data[dest].value = data[k].value;\n                dest++;\n            }\n        }\n    }\n}","rs":"// 给 SparseMatrix 再加一个方法，和快速转置对照着看\nimpl SparseMatrix\n{\n    fn transpose_slow(&self) -> SparseMatrix\n    {\n        let mut target = SparseMatrix::new(self.cols, self.rows);\n\n        for col in 0..self.cols\n        {\n            for k in 0..self.data.len()\n            {\n                if self.data[k].col == col\n                {\n                    target.data.push(Triple\n                    {\n                        row: self.data[k].col,      // 行列互换\n                        col: self.data[k].row,\n                        value: self.data[k].value,\n                    });\n                }\n            }\n        }\n\n        target\n    }\n}"}],"genlist":[null,{"c":"/* 空表深度为 1；原子对深度的贡献是 0；子表的贡献是它自己的深度。\n   整张表取所有元素贡献的最大值，再 +1（最外面那层括号）。 */\nint genlistDepth(GLNode* list)\n{\n    if (list == NULL || list->hp == NULL)\n    {\n        return 1;\n    }\n\n    int maxDepth = 0;\n    GLNode* p = list->hp;\n    while (p != NULL)\n    {\n        int childDepth = (p->tag == 0) ? 0 : genlistDepth(p);\n        if (childDepth > maxDepth)\n        {\n            maxDepth = childDepth;\n        }\n        p = p->tp;\n    }\n\n    return maxDepth + 1;\n}","cpp":"// 作为 GenList 的成员函数（类里补 int getDepth(GLNode* list);）\nint GenList::getDepth(GLNode* list)\n{\n    if (list == nullptr || list->hp == nullptr)\n    {\n        return 1;   // 空表\n    }\n\n    int maxDepth = 0;\n    GLNode* p = list->hp;\n    while (p != nullptr)\n    {\n        int childDepth = (p->tag == 0) ? 0 : getDepth(p);\n        if (childDepth > maxDepth)\n        {\n            maxDepth = childDepth;\n        }\n        p = p->tp;\n    }\n\n    return maxDepth + 1;   // 外面还有一层括号\n}","rs":"impl GLNode\n{\n    fn depth(&self) -> i32\n    {\n        if self.hp.is_none()\n        {\n            return 1;   // 空表\n        }\n\n        let mut max_depth = 0;\n        let mut p = self.hp.as_deref();\n        while let Some(node) = p\n        {\n            let child = if node.tag == 0 { 0 } else { node.depth() };\n            if child > max_depth\n            {\n                max_depth = child;\n            }\n            p = node.tp.as_deref();\n        }\n\n        max_depth + 1   // 外面还有一层括号\n    }\n}"},{"c":"/* 手算 (a,(b,(c,d)))：\n   第 1 步：最外层有两个元素 —— 原子 a 和子表 (b,(c,d))，所以长度 = 2。\n   第 2 步：原子 a 不再往下，深度贡献 0。\n   第 3 步：子表 (c,d) 里是 c、d 两个原子，深度 = 1 + max(0,0) = 1。\n   第 4 步：子表 (b,(c,d)) 里是 b（贡献 0）和 (c,d)（贡献 1），\n            深度 = 1 + max(0,1) = 2。\n   第 5 步：整个表 = 1 + max(a 的 0, 子表的 2) = 3。\n   结论：长度 2，深度 3。下面假设 root 已经构造好，调用函数验证。 */\nvoid checkSample(GLNode* root)\n{\n    printf(\"length = %d\\n\", genlistLength(root));   /* 2 */\n    printf(\"depth  = %d\\n\", genlistDepth(root));    /* 3 */\n}","cpp":"/* 手算 (a,(b,(c,d)))：\n   长度只数最外层：a 和 (b,(c,d))，共 2 个。\n   深度从里往外算：\n     (c,d)        = 1 + max(0,0) = 1\n     (b,(c,d))    = 1 + max(0,1) = 2\n     (a,(b,(c,d)))= 1 + max(0,2) = 3\n   所以长度 2，深度 3。 */\nvoid checkSample(GenList* g, GenList::GLNode* root)\n{\n    std::cout << \"length = \" << g->getLength(root) << std::endl;   // 2\n    std::cout << \"depth  = \" << g->getDepth(root) << std::endl;    // 3\n}","rs":"// 手算 (a,(b,(c,d)))：\n//   长度：最外层只有 a 和 (b,(c,d)) 两个元素 -> 2。\n//   深度：原子 a 贡献 0；\n//         (c,d) 深度 = 1；\n//         (b,(c,d)) 深度 = 1 + max(0,1) = 2；\n//         整个表深度 = 1 + max(0,2) = 3。\nfn check_sample(root: &GLNode)\n{\n    println!(\"length = {}\", root.length());   // 2\n    println!(\"depth  = {}\", root.depth());    // 3\n}"}],"tree":[null,{"c":"/* 统计叶子节点：叶子就是左右孩子都为空的节点。\n   空树返回 0，叶子返回 1，其他节点把左右子树的叶子数加起来。 */\nint treeLeafCount(TreeNode* root)\n{\n    if (root == NULL)\n    {\n        return 0;                       /* 空树没有叶子 */\n    }\n\n    if (root->left == NULL && root->right == NULL)\n    {\n        return 1;                       /* 自己就是叶子 */\n    }\n\n    return treeLeafCount(root->left) + treeLeafCount(root->right);\n}","cpp":"// 给 Tree 类再加一个成员函数（类里补一行：int leafCount(Node* node);）\nint Tree::leafCount(Tree::Node* node)\n{\n    if (node == nullptr)\n    {\n        return 0;                       // 空树没有叶子\n    }\n\n    if (node->left == nullptr && node->right == nullptr)\n    {\n        return 1;                       // 自己就是叶子\n    }\n\n    return leafCount(node->left) + leafCount(node->right);\n}","rs":"// 统计叶子节点：左右孩子都为空就算一个叶子\nfn leaf_count(node: &Option<Box<Node>>) -> i32\n{\n    match node\n    {\n        None => 0,                      // 空树没有叶子\n        Some(n) =>\n        {\n            if n.left.is_none() && n.right.is_none()\n            {\n                1                       // 自己就是叶子\n            }\n            else\n            {\n                leaf_count(&n.left) + leaf_count(&n.right)\n            }\n        }\n    }\n}"},{"c":"/* 交换每个节点的左右孩子。后序遍历最方便：先递归把左右子树都换好，\n   回来时再把自己的两个孩子交换一下，递归到头整棵树就都换完了。\n   （前序也能做，只是\"先换自己再递归\"读起来没有后序自然。） */\nvoid treeSwapChildren(TreeNode* root)\n{\n    if (root == NULL)\n    {\n        return;\n    }\n\n    treeSwapChildren(root->left);\n    treeSwapChildren(root->right);\n\n    TreeNode* temp = root->left;        /* 交换自己的左右孩子 */\n    root->left = root->right;\n    root->right = temp;\n}","cpp":"// 给 Tree 类再加一个成员函数（类里补一行：void swapChildren(Node* node);）\n// 后序遍历最方便：先递归换好左右子树，回来再交换自己的两个孩子。\nvoid Tree::swapChildren(Tree::Node* node)\n{\n    if (node == nullptr)\n    {\n        return;\n    }\n\n    swapChildren(node->left);           // 后序：先把两棵子树换好\n    swapChildren(node->right);\n\n    Node* temp = node->left;            // 回来再换自己的左右孩子\n    node->left = node->right;\n    node->right = temp;\n}","rs":"// 后序遍历最方便：先换好左右子树，回来再交换自己的两个孩子\nfn swap_children(node: &mut Option<Box<Node>>)\n{\n    if let Some(n) = node\n    {\n        swap_children(&mut n.left);\n        swap_children(&mut n.right);\n\n        let left = n.left.take();       // 先把左孩子取出来\n        n.left = n.right.take();        // 右孩子挪到左边\n        n.right = left;                 // 原来取出的左孩子放到右边\n    }\n}"}],"bst":[null,{"c":"/* 判断一棵树是不是 BST：不能只比较\"父子\"，必须给每个节点带上一个区间。\n   反例 [10,5,15,3,12]：12 是 5 的右孩子（12 > 5 通过），但 12 < 10，所以不是 BST。 */\nbool bstIsValid(BSTNode* node, int low, int high)\n{\n    if (node == NULL)\n    {\n        return true;\n    }\n\n    if (node->data <= low || node->data >= high)\n    {\n        return false;                 /* 跑到祖先给的区间外面去了 */\n    }\n\n    return bstIsValid(node->left, low, node->data)        /* 左孩子的上限是自己 */\n        && bstIsValid(node->right, node->data, high);     /* 右孩子的下限是自己 */\n}\n\n/* 调用：bstIsValid(root, INT_MIN, INT_MAX)，需要 #include <limits.h> */","cpp":"// 给 BST 再加一个成员函数（类里补一行：bool isValid(Node* node, int low, int high);）\nbool BST::isValid(Node* node, int low, int high)\n{\n    if (node == nullptr)\n    {\n        return true;\n    }\n\n    if (node->data <= low || node->data >= high)\n    {\n        return false;\n    }\n\n    return isValid(node->left, low, node->data)\n        && isValid(node->right, node->data, high);\n}\n\n// 调用：isValid(root, INT_MIN, INT_MAX)","rs":"// 用 i64 当边界，就不会被 i32 的极值卡住\nfn is_valid(node: &Option<Box<Node>>, low: i64, high: i64) -> bool\n{\n    let n = match node\n    {\n        Some(n) => n,\n        None => return true,\n    };\n\n    let v = n.data as i64;\n    if v <= low || v >= high\n    {\n        return false;\n    }\n\n    is_valid(&n.left, low, v) && is_valid(&n.right, v, high)\n}\n\n// 调用：is_valid(&root, i64::MIN, i64::MAX)"},{"c":"/* 有序数组 -> 高度最小的 BST：每次取中间元素做根，左右两半递归。\n   取中点能保证左右子树节点数尽量相等，树高就是 O(log n)。 */\nBSTNode* bstFromSorted(int arr[], int lo, int hi)\n{\n    if (lo > hi)\n    {\n        return NULL;                       /* 空区间 -> 空子树 */\n    }\n\n    int mid = lo + (hi - lo) / 2;          /* 这样写不会溢出 */\n\n    BSTNode* node = bstNodeNew(arr[mid]);\n    node->left = bstFromSorted(arr, lo, mid - 1);\n    node->right = bstFromSorted(arr, mid + 1, hi);\n\n    return node;\n}","cpp":"// 给 BST 再加一个成员函数\nBST::Node* BST::buildFromSorted(int arr[], int lo, int hi)\n{\n    if (lo > hi)\n    {\n        return nullptr;                    // 空区间 -> 空子树\n    }\n\n    int mid = lo + (hi - lo) / 2;          // 取中间，左右子树节点数才尽量相等\n\n    Node* node = new Node;\n    node->data = arr[mid];\n    node->left = buildFromSorted(arr, lo, mid - 1);\n    node->right = buildFromSorted(arr, mid + 1, hi);\n\n    return node;\n}","rs":"// 有序切片 -> 高度最小的 BST\nfn sorted_to_bst(values: &[i32]) -> Option<Box<Node>>\n{\n    if values.is_empty()\n    {\n        return None;                       // 空区间 -> 空子树\n    }\n\n    let mid = values.len() / 2;            // 取中间做根\n\n    Some(Box::new(Node {\n        data: values[mid],\n        left: sorted_to_bst(&values[..mid]),\n        right: sorted_to_bst(&values[mid + 1..]),\n    }))\n}"}],"heap":[null,{"c":"/* 数据流中位数：小的一半放 lo，大的一半放 hi，两边数量差不超过 1。\n   大顶堆偷个懒 —— 用\"存负数的小顶堆\"来实现，这样只要写一份堆的代码。 */\ntypedef struct\n{\n    MinHeap lo;        /* 实际是大顶堆（里面存的是相反数） */\n    MinHeap hi;        /* 小顶堆 */\n    int loCount;\n    int hiCount;\n} MedianFinder;\n\nvoid mfInit(MedianFinder* m)\n{\n    heapInit(&m->lo);\n    heapInit(&m->hi);\n    m->loCount = 0;\n    m->hiCount = 0;\n}\n\nvoid mfAdd(MedianFinder* m, int value)\n{\n    heapPush(&m->lo, -value);                 /* 1. 先无脑塞进 lo */\n    m->loCount++;\n\n    heapPush(&m->hi, -heapPop(&m->lo));       /* 2. lo 里最大的挪给 hi */\n    m->loCount--;\n    m->hiCount++;\n\n    if (m->hiCount > m->loCount)              /* 3. 平衡两边 */\n    {\n        heapPush(&m->lo, -heapPop(&m->hi));\n        m->hiCount--;\n        m->loCount++;\n    }\n}\n\ndouble mfMedian(MedianFinder* m)\n{\n    if (m->loCount > m->hiCount)\n    {\n        return -heapTop(&m->lo);              /* lo 存的是负数，取回来要变号 */\n    }\n\n    return (heapTop(&m->hi) - heapTop(&m->lo)) / 2.0;\n}","cpp":"// 数据流中位数：小的一半放 lo，大的一半放 hi\nclass MedianFinder\n{\npublic:\n    MedianFinder()\n    {\n        loCount = 0;\n        hiCount = 0;\n    }\n\n    void addNum(int value)\n    {\n        lo.push(-value);                   // 1. 先无脑塞进 lo（存的是相反数）\n        loCount++;\n\n        int biggest = lo.pop();            // 2. lo 里最大的挪给 hi\n        loCount--;\n        hi.push(-biggest);\n        hiCount++;\n\n        if (hiCount > loCount)             // 3. 两边数量差不超过 1\n        {\n            lo.push(-hi.pop());\n            hiCount--;\n            loCount++;\n        }\n    }\n\n    double findMedian()\n    {\n        int topLo = 0;\n        int topHi = 0;\n        lo.top(topLo);\n        hi.top(topHi);\n\n        if (loCount > hiCount)\n        {\n            return -topLo;                 // lo 存的是负数，取回来要变号\n        }\n\n        return (topHi - topLo) / 2.0;\n    }\n\nprivate:\n    MinHeap lo;        // 实际是大顶堆\n    MinHeap hi;        // 小顶堆\n    int loCount;\n    int hiCount;\n};","rs":"// 数据流中位数：小的一半放 lo，大的一半放 hi\npub struct MedianFinder\n{\n    lo: MinHeap,       // 实际是大顶堆（存的是相反数）\n    hi: MinHeap,       // 小顶堆\n}\n\nimpl MedianFinder\n{\n    pub fn new() -> MedianFinder\n    {\n        MedianFinder { lo: MinHeap::new(), hi: MinHeap::new() }\n    }\n\n    pub fn add_num(&mut self, value: i32)\n    {\n        self.lo.push(-value);                     // 1. 先无脑塞进 lo\n\n        if let Some(biggest) = self.lo.pop()      // 2. lo 里最大的挪给 hi\n        {\n            self.hi.push(-biggest);\n        }\n\n        if self.hi.len() > self.lo.len()          // 3. 平衡两边\n        {\n            if let Some(smallest) = self.hi.pop()\n            {\n                self.lo.push(-smallest);\n            }\n        }\n    }\n\n    pub fn find_median(&self) -> f64\n    {\n        let top_lo = match self.lo.top() { Some(v) => -v, None => 0 };\n        let top_hi = match self.hi.top() { Some(v) => v, None => 0 };\n\n        if self.lo.len() > self.hi.len()\n        {\n            return top_lo as f64;\n        }\n\n        (top_lo + top_hi) as f64 / 2.0\n    }\n}"},{"c":"/* 原地堆排序（大顶堆）：先把数组整理成大顶堆，再反复把堆顶换到末尾。\n   时间 O(n log n)，额外空间 O(1)。 */\nstatic void siftDownMax(int arr[], int n, int i)\n{\n    while (true)\n    {\n        int left = 2 * i + 1;\n        int right = 2 * i + 2;\n        int biggest = i;\n\n        if (left < n && arr[left] > arr[biggest])   biggest = left;\n        if (right < n && arr[right] > arr[biggest]) biggest = right;\n        if (biggest == i) break;                    /* 比两个孩子都大，到位了 */\n\n        int temp = arr[i];\n        arr[i] = arr[biggest];\n        arr[biggest] = temp;\n        i = biggest;\n    }\n}\n\nvoid heapSort(int arr[], int n)\n{\n    for (int i = n / 2 - 1; i >= 0; i--)      /* 1. 自底向上建大顶堆，O(n) */\n    {\n        siftDownMax(arr, n, i);\n    }\n\n    for (int end = n - 1; end > 0; end--)     /* 2. 每轮把最大值换到末尾 */\n    {\n        int temp = arr[0];\n        arr[0] = arr[end];\n        arr[end] = temp;\n\n        siftDownMax(arr, end, 0);\n    }\n}","cpp":"// 原地堆排序（大顶堆）：建堆 O(n) + 反复取堆顶 O(n log n)\nvoid siftDownMax(int arr[], int n, int i)\n{\n    while (true)\n    {\n        int left = 2 * i + 1;\n        int right = 2 * i + 2;\n        int biggest = i;\n\n        if (left < n && arr[left] > arr[biggest])   biggest = left;\n        if (right < n && arr[right] > arr[biggest]) biggest = right;\n        if (biggest == i) break;\n\n        int temp = arr[i];\n        arr[i] = arr[biggest];\n        arr[biggest] = temp;\n        i = biggest;\n    }\n}\n\nvoid heapSort(int arr[], int n)\n{\n    for (int i = n / 2 - 1; i >= 0; i--)       // 1. 自底向上建大顶堆\n    {\n        siftDownMax(arr, n, i);\n    }\n\n    for (int end = n - 1; end > 0; end--)      // 2. 堆顶换到末尾，再修复堆\n    {\n        int temp = arr[0];\n        arr[0] = arr[end];\n        arr[end] = temp;\n\n        siftDownMax(arr, end, 0);\n    }\n}","rs":"// 原地堆排序（大顶堆）：建堆 O(n) + 反复取堆顶 O(n log n)\nfn sift_down_max(arr: &mut [i32], n: usize, mut i: usize)\n{\n    loop\n    {\n        let left = 2 * i + 1;\n        let right = 2 * i + 2;\n        let mut biggest = i;\n\n        if left < n && arr[left] > arr[biggest] { biggest = left; }\n        if right < n && arr[right] > arr[biggest] { biggest = right; }\n        if biggest == i { break; }\n\n        arr.swap(i, biggest);\n        i = biggest;\n    }\n}\n\nfn heap_sort(arr: &mut [i32])\n{\n    let n = arr.len();\n    if n < 2\n    {\n        return;\n    }\n\n    let mut i = n / 2;                  // 1. 自底向上建大顶堆\n    while i > 0\n    {\n        i -= 1;\n        sift_down_max(arr, n, i);\n    }\n\n    let mut end = n - 1;                // 2. 每轮把最大值换到末尾\n    while end > 0\n    {\n        arr.swap(0, end);\n        sift_down_max(arr, end, 0);\n        end -= 1;\n    }\n}"}],"graph":[null,{"c":"/* 从 start 出发，求\"到每个顶点的最短边数\"。\n   关键：BFS 第一次到达某个顶点时，走的一定是最短路 ——\n   因为队列保证了\"距离小的先被处理\"。dist[i] = -1 表示走不到。 */\nvoid graphBfsDist(Graph* g, int start, int dist[])\n{\n    for (int i = 0; i < g->vertexCount; i++)\n    {\n        dist[i] = -1;\n    }\n    dist[start] = 0;\n\n    int* queue = (int*)malloc(sizeof(int) * g->vertexCount);\n    int head = 0;\n    int tail = 0;\n\n    queue[tail] = start;\n    tail++;\n\n    while (head < tail)\n    {\n        int v = queue[head];\n        head++;\n\n        for (Edge* e = g->adj[v]; e != NULL; e = e->next)\n        {\n            if (dist[e->to] == -1)          /* 第一次到达 = 最短路 */\n            {\n                dist[e->to] = dist[v] + 1;\n                queue[tail] = e->to;\n                tail++;\n            }\n        }\n    }\n\n    free(queue);\n}","cpp":"// 从 start 出发求到每个顶点的最短边数（无权图最短路）\nvoid Graph::bfsDistance(int start, int dist[])\n{\n    for (int i = 0; i < vertexCount; i++)\n    {\n        dist[i] = -1;                  // -1 表示还没走到\n    }\n    dist[start] = 0;\n\n    int* queue = new int[vertexCount];\n    int head = 0;\n    int tail = 0;\n\n    queue[tail] = start;\n    tail++;\n\n    while (head < tail)\n    {\n        int v = queue[head];\n        head++;\n\n        for (Edge* e = adj[v]; e != nullptr; e = e->next)\n        {\n            if (dist[e->to] == -1)     // 第一次到达，走的就是最短路\n            {\n                dist[e->to] = dist[v] + 1;\n                queue[tail] = e->to;\n                tail++;\n            }\n        }\n    }\n\n    delete[] queue;\n}","rs":"// 从 start 出发求到每个顶点的最短边数\nfn bfs_distance(adj: &Vec<Vec<usize>>, start: usize) -> Vec<i32>\n{\n    let mut dist = vec![-1; adj.len()];    // -1 表示还没走到\n    dist[start] = 0;\n\n    let mut queue: Vec<usize> = Vec::new();\n    let mut head = 0;\n\n    queue.push(start);\n\n    while head < queue.len()\n    {\n        let v = queue[head];\n        head += 1;\n\n        for &nb in &adj[v]\n        {\n            if dist[nb] == -1              // 第一次到达，走的就是最短路\n            {\n                dist[nb] = dist[v] + 1;\n                queue.push(nb);\n            }\n        }\n    }\n\n    dist\n}"},{"c":"/* 统计无向图有几个连通分量：\n   外层扫每个顶点，遇到没访问过的就启动一次 DFS，计数器加一。\n   一次 DFS 会把整个连通块吃掉。 */\nint graphCountComponents(Graph* g)\n{\n    bool* visited = (bool*)calloc(g->vertexCount, sizeof(bool));\n    int count = 0;\n\n    for (int v = 0; v < g->vertexCount; v++)\n    {\n        if (!visited[v])                 /* 遇到一个还没访问过的顶点 */\n        {\n            count++;\n            graphDfsVisit(g, v, visited);   /* 一次 DFS 吞掉整个连通块 */\n        }\n    }\n\n    free(visited);\n    return count;\n}","cpp":"// 统计无向图的连通分量个数（\"岛屿数量\"的抽象版）\nint Graph::countComponents()\n{\n    bool* visited = new bool[vertexCount];\n\n    for (int i = 0; i < vertexCount; i++)\n    {\n        visited[i] = false;\n    }\n\n    int count = 0;\n\n    for (int v = 0; v < vertexCount; v++)\n    {\n        if (!visited[v])              // 遇到一个还没访问过的顶点\n        {\n            count++;\n            dfsVisit(v, visited);     // 一次 DFS 吞掉整个连通块\n        }\n    }\n\n    delete[] visited;\n    return count;\n}","rs":"// 统计无向图的连通分量个数（用栈做迭代 DFS，避免递归太深）\nfn count_components(adj: &Vec<Vec<usize>>) -> usize\n{\n    let mut visited = vec![false; adj.len()];\n    let mut count = 0;\n\n    for start in 0..adj.len()\n    {\n        if visited[start]\n        {\n            continue;\n        }\n\n        count += 1;                       // 发现一个新的连通块\n\n        let mut stack: Vec<usize> = Vec::new();\n        stack.push(start);\n\n        while let Some(v) = stack.pop()\n        {\n            if visited[v]\n            {\n                continue;\n            }\n            visited[v] = true;\n\n            for &nb in &adj[v]\n            {\n                if !visited[nb]\n                {\n                    stack.push(nb);\n                }\n            }\n        }\n    }\n\n    count\n}"},{"c":"/* 课程表：判断一堆\"先修关系\"能不能全部修完。\n   等价于判断有向图有没有环 —— 用拓扑排序，排不完就说明有环。\n   这里用邻接矩阵 + 入度数组，只要 20 行，慢一点但好懂。 */\nbool canFinish(int numCourses, int prereq[][2], int n)\n{\n    bool graph[100][100] = { false };      /* graph[b][a] = true 表示先修 b 再修 a */\n    int indegree[100] = { 0 };\n\n    for (int i = 0; i < n; i++)\n    {\n        int a = prereq[i][0];\n        int b = prereq[i][1];\n        graph[b][a] = true;\n        indegree[a]++;\n    }\n\n    int learned = 0;\n\n    for (int round = 0; round < numCourses; round++)\n    {\n        for (int v = 0; v < numCourses; v++)\n        {\n            if (indegree[v] == 0)          /* 入度为 0 就能先修 */\n            {\n                indegree[v] = -1;          /* 标记成\"已经修了\" */\n                learned++;\n\n                for (int w = 0; w < numCourses; w++)\n                {\n                    if (graph[v][w])\n                    {\n                        indegree[w]--;\n                    }\n                }\n\n                break;                     /* 一轮修一门，简单优先 */\n            }\n        }\n    }\n\n    return learned == numCourses;          /* 排不完 -> 有环 */\n}","cpp":"// 课程表：判断有向图有没有环（拓扑排序）\nbool canFinish(int numCourses, bool graph[100][100])\n{\n    int indegree[100] = { 0 };\n\n    for (int v = 0; v < numCourses; v++)\n    {\n        for (int w = 0; w < numCourses; w++)\n        {\n            if (graph[v][w])               // v -> w\n            {\n                indegree[w]++;\n            }\n        }\n    }\n\n    int learned = 0;\n\n    for (int round = 0; round < numCourses; round++)\n    {\n        for (int v = 0; v < numCourses; v++)\n        {\n            if (indegree[v] == 0)          // 入度为 0 就能先修\n            {\n                indegree[v] = -1;          // 标记成\"已经修了\"\n                learned++;\n\n                for (int w = 0; w < numCourses; w++)\n                {\n                    if (graph[v][w])\n                    {\n                        indegree[w]--;\n                    }\n                }\n\n                break;\n            }\n        }\n    }\n\n    return learned == numCourses;          // 排不完 -> 有环\n}","rs":"// 课程表：判断有向图有没有环（拓扑排序）\nfn can_finish(num_courses: usize, prereq: &[(usize, usize)]) -> bool\n{\n    let mut graph = vec![vec![false; num_courses]; num_courses];   // graph[b][a] 表示 b -> a\n    let mut indegree = vec![0i32; num_courses];\n\n    for &(a, b) in prereq\n    {\n        graph[b][a] = true;\n        indegree[a] += 1;\n    }\n\n    let mut learned = 0;\n\n    for _ in 0..num_courses\n    {\n        for v in 0..num_courses\n        {\n            if indegree[v] == 0                // 入度为 0 就能先修\n            {\n                indegree[v] = -1;              // 标记成\"已经修了\"\n                learned += 1;\n\n                for w in 0..num_courses\n                {\n                    if graph[v][w]\n                    {\n                        indegree[w] -= 1;\n                    }\n                }\n\n                break;\n            }\n        }\n    }\n\n    learned == num_courses                     // 排不完 -> 有环\n}"}],"search":[null,{"c":"/* 折半查找（循环版）：表必须有序，找到返回下标，找不到返回 -1。\n   n = 11 时判定树最多 4 层，所以最多比较 4 次：\n   2^3 = 8 < 11 <= 16 = 2^4。 */\nint binarySearch(int a[], int n, int key)\n{\n    int low = 0;\n    int high = n - 1;\n\n    while (low <= high)\n    {\n        int mid = (low + high) / 2;\n\n        if (a[mid] == key)\n        {\n            return mid;\n        }\n        else if (a[mid] < key)\n        {\n            low = mid + 1;              /* 到右半边找 */\n        }\n        else\n        {\n            high = mid - 1;             /* 到左半边找 */\n        }\n    }\n\n    return -1;\n}","cpp":"// 手写折半查找（循环版），可以直接替换 Search::binary 的函数体。\n// n = 11 时判定树最多 4 层，所以最多比较 4 次：2^3 = 8 < 11 <= 16 = 2^4。\nint Search::binary(int key)\n{\n    int low = 0;\n    int high = size - 1;\n\n    while (low <= high)\n    {\n        int mid = (low + high) / 2;\n\n        if (data[mid] == key)\n        {\n            return mid;\n        }\n        else if (data[mid] < key)\n        {\n            low = mid + 1;              // 到右半边找\n        }\n        else\n        {\n            high = mid - 1;             // 到左半边找\n        }\n    }\n\n    return -1;\n}","rs":"// n = 11 时最多比较 4 次：2^3 = 8 < 11 <= 16 = 2^4\nfn binary_search(a: &[i32], key: i32) -> i32\n{\n    let mut low: i32 = 0;\n    let mut high = a.len() as i32 - 1;\n\n    while low <= high\n    {\n        let mid = (low + high) / 2;\n\n        if a[mid as usize] == key\n        {\n            return mid;\n        }\n        else if a[mid as usize] < key\n        {\n            low = mid + 1;              // 到右半边找\n        }\n        else\n        {\n            high = mid - 1;             // 到左半边找\n        }\n    }\n\n    -1\n}"},{"c":"/* 按判定树层数加权求 ASL：区间中点就是这一层的根，贡献 depth 次比较；\n   左右两半递归下去层数加一，最后除以元素个数就是平均查找长度。 */\nint aslSum(int low, int high, int depth)\n{\n    if (low > high)\n    {\n        return 0;                       /* 空区间，没有节点 */\n    }\n\n    int mid = (low + high) / 2;         /* 中点先被比较到，它在第 depth 层 */\n    int left = aslSum(low, mid - 1, depth + 1);\n    int right = aslSum(mid + 1, high, depth + 1);\n\n    return depth + left + right;\n}\n\ndouble asl(int n)\n{\n    return (double)aslSum(0, n - 1, 1) / n;\n}","cpp":"// 给 Search 类再加两个成员函数，并在类里补上声明\nint Search::aslSum(int low, int high, int depth)\n{\n    if (low > high)\n    {\n        return 0;                       // 空区间，没有节点\n    }\n\n    int mid = (low + high) / 2;         // 中点在第 depth 层，贡献 depth 次\n    int left = aslSum(low, mid - 1, depth + 1);\n    int right = aslSum(mid + 1, high, depth + 1);\n\n    return depth + left + right;\n}\n\ndouble Search::asl()\n{\n    return (double)aslSum(0, size - 1, 1) / size;\n}","rs":"// 按判定树层数加权求和：中点在第 depth 层，左右两半递归时层数加一\nfn asl_sum(low: i32, high: i32, depth: i32) -> i32\n{\n    if low > high\n    {\n        return 0;                       // 空区间，没有节点\n    }\n\n    let mid = (low + high) / 2;\n    let left = asl_sum(low, mid - 1, depth + 1);\n    let right = asl_sum(mid + 1, high, depth + 1);\n\n    depth + left + right\n}\n\nfn asl(n: i32) -> f64\n{\n    asl_sum(0, n - 1, 1) as f64 / n as f64\n}"}],"hash":[null,{"c":"/* FNV-1a 字符串哈希：三行就能把一个字符串压成一个 32 位整数，\n   而且分布挺均匀，是真实工程里常用的哈希函数。 */\nunsigned int hashStr(const char* text)\n{\n    unsigned int h = 2166136261u;          /* FNV 的固定起点 */\n\n    for (int i = 0; text[i] != '\\0'; i++)\n    {\n        h = h ^ (unsigned char)text[i];    /* 1. 先异或一个字节 */\n        h = h * 16777619u;                 /* 2. 再乘 FNV 质数 */\n    }\n\n    return h;\n}\n\n/* 桶下标 = hash % 桶数。注意要用无符号数，不然取模可能得到负数 */\nint bucketOf(const char* text, int bucketCount)\n{\n    return (int)(hashStr(text) % (unsigned int)bucketCount);\n}","cpp":"// FNV-1a 字符串哈希：实现极简，分布均匀\nunsigned int hashStr(const char* text)\n{\n    unsigned int h = 2166136261u;          // FNV 的固定起点\n\n    for (int i = 0; text[i] != '\\0'; i++)\n    {\n        h = h ^ (unsigned char)text[i];    // 1. 先异或一个字节\n        h = h * 16777619u;                 // 2. 再乘 FNV 质数\n    }\n\n    return h;\n}\n\n// 算桶下标。用无符号数取模，省得去处理负数\nint bucketOf(const char* text, int bucketCount)\n{\n    return (int)(hashStr(text) % (unsigned int)bucketCount);\n}","rs":"// FNV-1a 字符串哈希：实现极简，分布均匀\nfn hash_str(text: &str) -> u32\n{\n    let mut h: u32 = 2_166_136_261;        // FNV 的固定起点\n\n    for b in text.as_bytes()\n    {\n        h = h ^ (*b as u32);               // 1. 先异或一个字节\n        h = h.wrapping_mul(16_777_619);    // 2. 再乘 FNV 质数\n        // 必须用 wrapping_mul：Rust 的整数乘法溢出在 debug 下会直接 panic\n    }\n\n    h\n}\n\nfn bucket_of(text: &str, bucket_count: usize) -> usize\n{\n    hash_str(text) as usize % bucket_count\n}"}],"sort":[null,{"c":"/* 归并排序求逆序对：在合并的时候顺手统计。\n   关键：如果这一步取的是右半边的元素，说明左半边剩下的**每一个**都比它大，\n   一次就能加上好几个逆序对。总复杂度 O(n log n)。 */\nlong long mergeCount(int arr[], int temp[], int lo, int mid, int hi)\n{\n    int i = lo;\n    int j = mid + 1;\n    int k = lo;\n    long long count = 0;\n\n    while (i <= mid && j <= hi)\n    {\n        if (arr[i] <= arr[j])\n        {\n            temp[k] = arr[i];\n            i++;\n        }\n        else\n        {\n            temp[k] = arr[j];\n            j++;\n            count += (mid - i + 1);      /* 左半边剩下的这么多都比它大 */\n        }\n        k++;\n    }\n\n    while (i <= mid) { temp[k] = arr[i]; i++; k++; }\n    while (j <= hi)  { temp[k] = arr[j]; j++; k++; }\n\n    for (int t = lo; t <= hi; t++)\n    {\n        arr[t] = temp[t];\n    }\n\n    return count;\n}\n\nlong long countInversions(int arr[], int temp[], int lo, int hi)\n{\n    if (lo >= hi)\n    {\n        return 0;\n    }\n\n    int mid = lo + (hi - lo) / 2;\n\n    long long count = countInversions(arr, temp, lo, mid);\n    count += countInversions(arr, temp, mid + 1, hi);\n    count += mergeCount(arr, temp, lo, mid, hi);\n\n    return count;\n}","cpp":"// 归并排序求逆序对：合并时若取右半边的元素，\n// 说明左半边剩下的每一个都比它大，一次就能加上好几个逆序对\nlong long mergeCount(int arr[], int temp[], int lo, int mid, int hi)\n{\n    int i = lo;\n    int j = mid + 1;\n    int k = lo;\n    long long count = 0;\n\n    while (i <= mid && j <= hi)\n    {\n        if (arr[i] <= arr[j])\n        {\n            temp[k] = arr[i];\n            i++;\n        }\n        else\n        {\n            temp[k] = arr[j];\n            j++;\n            count += (mid - i + 1);\n        }\n        k++;\n    }\n\n    while (i <= mid) { temp[k] = arr[i]; i++; k++; }\n    while (j <= hi)  { temp[k] = arr[j]; j++; k++; }\n\n    for (int t = lo; t <= hi; t++)\n    {\n        arr[t] = temp[t];\n    }\n\n    return count;\n}\n\nlong long countInversions(int arr[], int temp[], int lo, int hi)\n{\n    if (lo >= hi)\n    {\n        return 0;\n    }\n\n    int mid = lo + (hi - lo) / 2;\n\n    long long count = countInversions(arr, temp, lo, mid);\n    count += countInversions(arr, temp, mid + 1, hi);\n    count += mergeCount(arr, temp, lo, mid, hi);\n\n    return count;\n}","rs":"// 归并排序求逆序对：O(n log n)，比双层循环的 O(n^2) 快得多\nfn count_inversions(arr: &mut [i32]) -> usize\n{\n    let n = arr.len();\n    if n < 2\n    {\n        return 0;\n    }\n\n    let mid = n / 2;\n    let mut count = count_inversions(&mut arr[..mid]) + count_inversions(&mut arr[mid..]);\n\n    let (left, right) = arr.split_at(mid);\n    let mut merged = Vec::new();\n    let mut i = 0;\n    let mut j = 0;\n\n    while i < left.len() && j < right.len()\n    {\n        if left[i] <= right[j]\n        {\n            merged.push(left[i]);\n            i += 1;\n        }\n        else\n        {\n            count += left.len() - i;      // 左半边剩下的全都比 right[j] 大\n            merged.push(right[j]);\n            j += 1;\n        }\n    }\n\n    while i < left.len() { merged.push(left[i]); i += 1; }\n    while j < right.len() { merged.push(right[j]); j += 1; }\n\n    arr.copy_from_slice(&merged);\n    count\n}"},{"c":"/* 快速排序的核心：Lomuto 分区。\n   i 指向\"小于区\"的下一个空位，j 从左往右扫；\n   j 遇到比基准小的就和 i 交换。最后把基准换到 i 的位置。 */\nint partition(int arr[], int lo, int hi)\n{\n    int pivot = arr[hi];               /* 取末尾元素当基准 */\n    int i = lo;\n\n    for (int j = lo; j < hi; j++)      /* 注意是 j < hi，arr[hi] 是基准本身 */\n    {\n        if (arr[j] < pivot)\n        {\n            int temp = arr[i];\n            arr[i] = arr[j];\n            arr[j] = temp;\n            i++;\n        }\n    }\n\n    int temp = arr[i];                 /* 基准归位，这一步最容易忘 */\n    arr[i] = arr[hi];\n    arr[hi] = temp;\n\n    return i;                          /* 返回基准的最终下标 */\n}\n\nvoid quickSort(int arr[], int lo, int hi)\n{\n    if (lo >= hi)\n    {\n        return;\n    }\n\n    int p = partition(arr, lo, hi);\n    quickSort(arr, lo, p - 1);         /* 注意是 p-1 */\n    quickSort(arr, p + 1, hi);         /* 和 p+1，写成 p 会死循环 */\n}","cpp":"// 快速排序的核心：Lomuto 分区\nint partition(int arr[], int lo, int hi)\n{\n    int pivot = arr[hi];               // 取末尾元素当基准\n    int i = lo;                        // i 指向\"小于区\"的下一个空位\n\n    for (int j = lo; j < hi; j++)      // 注意是 j < hi，arr[hi] 是基准本身\n    {\n        if (arr[j] < pivot)\n        {\n            int temp = arr[i];\n            arr[i] = arr[j];\n            arr[j] = temp;\n            i++;\n        }\n    }\n\n    int temp = arr[i];                 // 基准归位，这一步最容易忘\n    arr[i] = arr[hi];\n    arr[hi] = temp;\n\n    return i;\n}\n\nvoid quickSort(int arr[], int lo, int hi)\n{\n    if (lo >= hi)\n    {\n        return;\n    }\n\n    int p = partition(arr, lo, hi);\n    quickSort(arr, lo, p - 1);         // 注意是 p-1\n    quickSort(arr, p + 1, hi);         // 和 p+1\n}","rs":"// 快速排序的核心：Lomuto 分区\nfn partition(arr: &mut [i32]) -> usize\n{\n    let hi = arr.len() - 1;\n    let pivot = arr[hi];               // 取末尾元素当基准\n    let mut i = 0;                     // i 指向\"小于区\"的下一个空位\n\n    for j in 0..hi                     // 注意是 j < hi，arr[hi] 是基准本身\n    {\n        if arr[j] < pivot\n        {\n            arr.swap(i, j);\n            i += 1;\n        }\n    }\n\n    arr.swap(i, hi);                   // 基准归位\n    i                                  // 返回基准的最终下标\n}\n\nfn quick_sort(arr: &mut [i32])\n{\n    if arr.len() <= 1\n    {\n        return;\n    }\n\n    let p = partition(arr);\n    let (left, rest) = arr.split_at_mut(p);\n\n    quick_sort(left);\n    quick_sort(&mut rest[1..]);        // rest[0] 是基准，已经就位了，跳过\n}"}]};

st-lang.org/std/collections/struct.VecDeque.html\n- 队列（FIFO）原理：https://en.wikipedia.org/wiki/Queue_(abstract_data_type)\n","matrix":"# 资料来源 · matrix（数组 / 矩阵）\n\n- 严蔚敏、吴伟民《数据结构（C 语言版）》第 5 章\"数组和广义表\"：二维数组的行主序存储、对称矩阵的下三角压缩、稀疏矩阵的三元组表示与快速转置（本节的公式与 `num`/`pos` 写法都来自这本教材）。\n- 行主序与列主序的区别（为什么 C 语言二维数组按行连续存放）：https://en.wikipedia.org/wiki/Row-_and_column-major_order\n- 对称矩阵（定义与 `a[i][j] = a[j][i]` 的性质）：https://en.wikipedia.org/wiki/Symmetric_matrix\n- 稀疏矩阵的存储格式（三元组、压缩稀疏行等）：https://en.wikipedia.org/wiki/Sparse_matrix\n- cppreference: C 数组（二维数组 `a[i][j]` 与 `*(*(a+i)+j)` 的等价关系）：https://en.cppreference.com/w/c/language/array\n- cppreference: sizeof（为什么地址偏移要乘\"每个元素的大小\"）：https://en.cppreference.com/w/cpp/language/sizeof\n- Rust std: Vec（本节用 `Vec<i32>` 存压缩后的一维数组）：https://doc.rust-lang.org/std/vec/struct.Vec.html\n- 快速转置的复杂度分析（O(cols + count) 与普通转置 O(cols × count) 的对比）：https://en.wikipedia.org/wiki/Transpose#Implementation\n","genlist":"# 资料来源 · genlist（广义表）\n\n- 严蔚敏、吴伟民《数据结构（C 语言版）》第 5 章\"数组和广义表\"：广义表的定义、头尾链表表示法、求表头/表尾/深度/长度的递归算法（本节的 `tag + hp + tp` 结构就是这本教材的写法）。\n- 广义表（Generalized list）的定义与例子：https://en.wikipedia.org/wiki/Generalized_list\n- 递归与树形结构的遍历（广义表本质上是一棵普通的树，深度 = 树高）：https://en.wikipedia.org/wiki/Tree_traversal\n- cppreference: C 结构体与自引用指针（`struct GLNode*` 为什么必须带 `struct` 关键字）：https://en.cppreference.com/w/c/language/struct\n- Rust std: Option（`Some/None` 怎么表示\"空表\"）：https://doc.rust-lang.org/std/option/enum.Option.html\n- Rust std: Box（堆上分配一个节点，离开作用域自动递归释放）：https://doc.rust-lang.org/std/boxed/struct.Box.html\n- Rust 所有权与 Drop（为什么本节不用手写 destroy，`clear` 赋 None 就能释放整条链）：https://doc.rust-lang.org/book/ch04-00-understanding-ownership.html\n- 头尾链表表示法与孩子兄弟表示法的等价性（广义表 ↔ 二叉树）：https://en.wikipedia.org/wiki/Generalized_list#Representation\n","tree":"# 资料来源 · tree（树和二叉树）\n\n- 严蔚敏《数据结构（C 语言版）》第 6 章（二叉树的遍历、节点数与树高）：https://book.douban.com/subject/24699581/\n- Wikipedia：Tree traversal（前序 / 中序 / 后序 / 层序的定义与例子）：https://en.wikipedia.org/wiki/Tree_traversal\n- Wikipedia：Huffman coding（每次合并两个最小权值的贪心过程）：https://en.wikipedia.org/wiki/Huffman_coding\n- cppreference：new / delete 表达式（二叉链表节点的申请与释放）：https://en.cppreference.com/w/cpp/language/new\n- cppreference：nullptr（空指针，比 NULL 更安全）：https://en.cppreference.com/w/cpp/language/nullptr\n- Rust std：Option 与 Option::take（Rust 里表示空孩子、取出子树）：https://doc.rust-lang.org/std/option/enum.Option.html\n- Rust std：Box（把节点放到堆上，递归类型才有着落）：https://doc.rust-lang.org/std/boxed/struct.Box.html\n- LeetCode 102. Binary Tree Level Order Traversal（练习层序遍历）：https://leetcode.com/problems/binary-tree-level-order-traversal/\n- LeetCode 226. Invert Binary Tree（练习第 2 题：交换左右孩子）：https://leetcode.com/problems/invert-binary-tree/\n","bst":"# 资料来源 · bst（二叉搜索树）\n\n- 《算法导论》第 12 章（BST 的插入、查询、删除三种情况）：https://en.wikipedia.org/wiki/Introduction_to_Algorithms\n- Open Data Structures 第 6 章（BST 的删除与\"中序后继\"讲得很清楚）：https://opendatastructures.org/\n- cppreference: new / delete 表达式（节点的申请与释放）：https://en.cppreference.com/w/cpp/language/new\n- cppreference: 递归（三种深度优先遍历都是递归）：https://en.cppreference.com/w/cpp/language/function\n- Rust std: Option / Option::take（Rust 里\"把子树取出来、挂回去\"全靠它）：https://doc.rust-lang.org/std/option/enum.Option.html\n- LeetCode 98. Validate Binary Search Tree（\"只比较父子\"错在哪，反例就在这题）：https://leetcode.com/problems/validate-binary-search-tree/\n- LeetCode 108. Convert Sorted Array to Binary Search Tree（练习第 2 题）：https://leetcode.com/problems/convert-sorted-array-to-binary-search-tree/\n- 二叉搜索树：https://en.wikipedia.org/wiki/Binary_search_tree\n","heap":"# 资料来源 · heap（二叉堆）\n\n- 《算法导论》第 6 章（堆、sift-up / sift-down、为什么建堆是 O(n)）：https://en.wikipedia.org/wiki/Introduction_to_Algorithms\n- cppreference: std::push_heap / std::pop_heap（标准库在哪儿替你干活）：https://en.cppreference.com/w/cpp/algorithm/push_heap\n- cppreference: std::priority_queue（标准库的优先队列，默认就是大顶堆）：https://en.cppreference.com/w/cpp/container/priority_queue\n- Rust std: Vec::swap（sift 时交换父子节点）：https://doc.rust-lang.org/std/vec/struct.Vec.html\n- Rust std: BinaryHeap（标准库的堆只有大顶堆，要小顶堆得用 Reverse<T> 包一层）：https://doc.rust-lang.org/std/collections/binary_heap/struct.BinaryHeap.html\n- LeetCode 295. Find Median from Data Stream（练习第 1 题，两个堆夹住中位数）：https://leetcode.com/problems/find-median-from-data-stream/\n- 二叉堆：https://en.wikipedia.org/wiki/Binary_heap\n- 堆排序：https://en.wikipedia.org/wiki/Heapsort\n","graph":"# 资料来源 · graph（图 / 邻接表 / BFS / DFS）\n\n- 《算法导论》第 22 章（BFS、DFS、拓扑排序）：https://en.wikipedia.org/wiki/Introduction_to_Algorithms\n- cppreference: new[] / delete[]（C 版本用链表做邻接表时的内存管理）：https://en.cppreference.com/w/cpp/language/new\n- cppreference: std::vector（用 vector<vector<int>> 存邻接表更省心）：https://en.cppreference.com/w/cpp/container/vector\n- Rust std: Vec / Vec 作为队列（Rust 侧存邻接表、当 BFS 队列）：https://doc.rust-lang.org/std/vec/struct.Vec.html\n- LeetCode 200. Number of Islands（连通分量 / \"岛屿数量\"）：https://leetcode.com/problems/number-of-islands/\n- LeetCode 207. Course Schedule（拓扑排序判断有没有环）：https://leetcode.com/problems/course-schedule/\n- 广度优先搜索（为什么它第一次到达就是最短路）：https://en.wikipedia.org/wiki/Breadth-first_search\n- 深度优先搜索：https://en.wikipedia.org/wiki/Depth-first_search\n","search":"# 资料来源 · search（查找）\n\n- 严蔚敏《数据结构（C 语言版）》第 9 章（顺序查找、折半查找、分块查找与 ASL）：https://book.douban.com/subject/24699581/\n- Wikipedia：Binary search algorithm（循环写法、比较次数与 log2 的关系）：https://en.wikipedia.org/wiki/Binary_search_algorithm\n- Wikipedia：Linear search（哨兵可以把\"越界判断\"从循环里省掉）：https://en.wikipedia.org/wiki/Linear_search\n- Wikipedia：Sentinel value（哨兵值的定义与用法）：https://en.wikipedia.org/wiki/Sentinel_value\n- VisuAlgo：Binary Search Tree / 查找可视化（看折半查找的判定树怎么长出来）：https://visualgo.net/en/bst\n- cppreference：std::binary_search（标准库版本，只回答\"在不在\"）：https://en.cppreference.com/w/cpp/algorithm/binary_search\n- Rust std：slice::binary_search（标准库的折半查找，返回 Result）：https://doc.rust-lang.org/std/primitive.slice.html#method.binary_search\n- LeetCode 704. Binary Search（练习第 1 题）：https://leetcode.com/problems/binary-search/\n- 分块查找（索引顺序表查找）讲解：https://www.cnblogs.com/ciyeer/p/8945569.html\n","hash":"# 资料来源 · hash（哈希表 / 拉链法）\n\n- FNV Hash 官 <script>
/* ==================== 02-core.js ==================== */

(function () {
'use strict';

const topics = [];
const DSV = {};
window.DSV = DSV;

/* ------------------------- 基础工具 ------------------------- */
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function h(str) {
  const t = document.createElement('template');
  t.innerHTML = String(str).trim();
  return t.content.firstElementChild;
}
function svgEl(tag, attrs, text) {
  const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  return e;
}
function html(node, str) { node.innerHTML = str; return node; }

/* ------------------------- 语法高亮 ------------------------- */
/* ---- C / C++ / Rust 关键字与标准库标识符 ---- */
const C_KW = 'auto|break|case|char|const|continue|default|do|double|else|enum|extern|float|for|goto|if|inline|int|long|register|restrict|return|short|signed|sizeof|static|struct|switch|typedef|union|unsigned|void|volatile|while|_Bool|_Noreturn|_Static_assert';
const CXX_KW = C_KW + '|alignas|alignof|and|and_eq|asm|bitand|bitor|catch|class|compl|concept|consteval|constexpr|constinit|const_cast|co_await|co_return|co_yield|decltype|delete|dynamic_cast|explicit|export|false|friend|mutable|namespace|new|noexcept|not|not_eq|nullptr|operator|or|or_eq|override|private|protected|public|reinterpret_cast|requires|static_assert|static_cast|template|this|thread_local|throw|true|try|typeid|typename|using|virtual|xor|xor_eq|final';
const RS_KW = 'as|async|await|break|const|continue|crate|dyn|else|enum|extern|fn|for|if|impl|in|let|loop|match|mod|move|mut|pub|ref|return|self|Self|static|struct|super|trait|type|unsafe|use|where|while';
const C_BI = 'printf|fprintf|sprintf|snprintf|puts|fputs|putchar|fopen|fclose|fgets|malloc|calloc|realloc|free|memcpy|memmove|memset|memcmp|strlen|strcmp|strncmp|strcpy|strncpy|strchr|strstr|assert|exit|NULL|size_t|ptrdiff_t|FILE|stdin|stdout|stderr|int8_t|int16_t|int32_t|int64_t|uint8_t|uint16_t|uint32_t|uint64_t|bool|true|false';
const CXX_BI = C_BI + '|std|cout|cin|cerr|clog|endl|vector|array|string|string_view|span|unique_ptr|shared_ptr|weak_ptr|make_unique|make_shared|move|forward|swap|sort|stable_sort|partial_sort|nth_element|push_heap|pop_heap|make_heap|sort_heap|deque|list|forward_list|unordered_map|unordered_set|map|set|optional|nullopt|pair|make_pair|initializer_list|runtime_error|out_of_range|invalid_argument|logic_error|length_error|numeric_limits|ostream|istream|template|typename|size_t|ptrdiff_t';
const RS_BI = 'Vec|String|Option|Some|None|Result|Ok|Err|Box|Rc|Arc|RefCell|Cell|HashMap|HashSet|BTreeMap|BTreeSet|VecDeque|BinaryHeap|usize|isize|u8|u16|u32|u64|u128|i8|i16|i32|i64|i128|f32|f64|bool|char|str|Clone|Copy|Debug|Default|PartialEq|Eq|PartialOrd|Ord|Hash|Iterator|IntoIterator|From|Into|TryFrom|TryInto|Display|Drop|Write|Read|ToString|len|push|pop|new|with_capacity|iter|into_iter|unwrap|expect|as_deref|as_ref|take|is_none|is_some|is_empty|to_string|to_owned|clone|from|capacity|reserve|swap|sort|sort_unstable|binary_search';

const RULES = {
  c: [
    ['com', /\/\/[^\n]*|\/\*[\s\S]*?\*\//],
    ['pre', /#[ \t]*[a-zA-Z_]+/],
    ['str', /"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'/],
    ['num', /\b(?:0[xXbB][0-9a-fA-F_]+|\d[\d_]*(?:\.[\d_]+)?(?:[eE][+-]?\d+)?)(?:[uUlLfF]{0,3}|(?:u|i|f)(?:8|16|32|64|128|size))?\b/],
    ['kw', new RegExp('\\b(?:' + C_KW + ')\\b')],
    ['bi', new RegExp('\\b(?:' + C_BI + ')\\b')],

function cleanUrl(u) { return String(u).replace(/[）,.;：:]+$/, ''); }

  const s = u.replace(/^https?:\/\//, '').replace(/\/$/, '');

}
function sources(topic) {
  const raw = SRC_DATA[topic];

  raw.split('\n').forEach(function (line) {
    const t = line.trim();
    if (!t || t.charAt(0) === '#') return;
    const item = t.match(/^(?:[-*]|\d+[.、)])\s*(.*)$/);
    if (item) {
      let text = item[1].trim();
      let url = '';
      const m = text.match(/^(.*)[：:]\s*(https?:\/\/\S+)$/);
      if (m) { text = m[1]; url = cleanUrl(m[2]); }
      cur = { text: text, urls: url ? [url] : [] };
      items.push(cur);

    const urls = t.match(/https?:\/\/[^\s）)】>]+/g);
    if (urls && urls.length && cur) {
      urls.forEach(function (u) { u = cleanUrl(u); if (u && cur.urls.indexOf(u) < 0) cur.urls.push(u); });
    } else if (cur && !cur.urls.length) {

  else if (e.key === 'ArrowLeft') { api.prev(); e.preventDefault(); }
  else if (e.key === ' ') { api.toggle(); e.preventDefault(); }
});

/* ------------------------- 主题注册与路由 ------------------------- */
function register(t) { topics.push(t); }
function sorted() { return topics.slice().sort((a, b) => (a.order || 500) - (b.order || 500)); }
function progressList() {
  try { return JSON.parse(localStorage.getItem('dsv-done') || '[]'); } catch (e) { return []; }
}
function markDone(id, v) {
  const l = progressList().filter(x => x !== id);
  if (v) l.push(id);
  try { localStorage.setItem('dsv-done', JSON.stringify(l)); } catch (e) {}
  refreshNav();
}
function refreshNav() {
  const done = progressList();
  Array.prototype.forEach.call(document.querySelectorAll('.navlink'), a => a.classList.toggle('finished', done.indexOf(a.dataset.id) >= 0));
  const list = sorted().filter(t => !t.special);
  document.getElementById('doneCount').textContent = done.filter(x => list.some(t => t.id === x)).length;
  document.getElementById('totalCount').textContent = list.length;
}
function buildNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  let group = null;
  sorted().forEach(t => {
    if (t.group !== group) {
      group = t.group;
      if (group) nav.appendChild(el('div', 'navgroup', group));
    }
    const a = el('a', 'navlink');
    a.href = '#/' + t.id;
    a.dataset.id = t.id;
    a.dataset.search = (t.title + ' ' + (t.keywords || '') + ' ' + (t.group || '') + ' ' + t.id).toLowerCase();
    a.innerHTML = '<span class="ico">' + t.icon + '</span><span>' + esc(t.title) + '</span><span class="done">✓</span>';
    nav.appendChild(a);
  });
  refreshNav();
}
function renderDoc(t) {
  const doc = document.getElementById('doc');
  doc.innerHTML = '';
  const list = sorted();
  const pos = list.indexOf(t);
  if (!t.special) {
    const hero = el('div', 'hero');
    hero.style.padding = '8px 4px 0';
    hero.innerHTML = '<h1>' + t.icon + ' ' + esc(t.title) + '</h1><p>' + (t.lead || '') + '</p>';
    doc.appendChild(hero);
  }
  try {
    t.build(doc);
  } catch (err) {
    const box = el('div', 'card');
    box.style.borderColor = 'rgba(255,107,129,.5)';
    box.innerHTML = '<h2>⚠️ 这一节渲染出错了</h2><p class="lead">其他章节不受影响，可以直接从左侧切换。</p>' +
      '<pre class="code"><code>' + esc(String(err && err.stack ? err.stack : err)) + '</code></pre>';
    doc.appendChild(box);
    if (window.console) console.error('[DSV] build failed for topic', t.id, err);
  }
  if (!t.special) {
    const bar = el('div', 'donebar');
    const done = progressList().indexOf(t.id) >= 0;
    const btn = el('button', 'donebtn' + (done ? ' done' : ''), done ? '✓ 已通关' : '☐ 标记为已掌握');
    btn.addEventListener('click', () => {
      const now = progressList().indexOf(t.id) < 0;
      markDone(t.id, now);
      btn.classList.toggle('done', now);
      btn.textContent = now ? '✓ 已通关' : '☐ 标记为已掌握';
    });
    bar.appendChild(btn);
    const pager = el('div', 'pager');
    const prev = list.slice(0, pos).reverse().find(x => !x.special);
    const next = list.slice(pos + 1).find(x => !x.special);
    if (prev) pager.insertAdjacentHTML('beforeend', '<a href="#/' + prev.id + '">← ' + esc(prev.title) + '</a>');
    if (next) pager.insertAdjacentHTML('beforeend', '<a href="#/' + next.id + '">' + esc(next.title) + ' →</a>');
    bar.appendChild(pager);
    doc.appendChild(bar);
  }
  const cur = document.querySelector('.navlink[data-id="' + t.id + '"]');
  Array.prototype.forEach.call(document.querySelectorAll('.navlink'), a => a.classList.toggle('active', a === cur));
  document.getElementById('crumbs').innerHTML = t.special ? '<b>' + esc(t.title) + '</b>'
    : esc(t.group || '') + ' / <b>' + esc(t.title) + '</b>';
  document.title = t.title + ' · 数据结构动画实验室';
  document.getElementById('sidebar').classList.remove('open');
  window.scrollTo(0, 0);
}
function route() {
  const id = (location.hash || '').replace(/^#\/?/, '') || 'home';
  const t = sorted().find(x => x.id === id) || sorted().find(x => x.id === 'home');
  if (!t) return;
  liveLabs.length = 0;
  renderDoc(t);
}
window.addEventListener('hashchange', route);

function stampData() {
  const node = document.getElementById('dataPill');
  if (!node) return;
  const keys = Object.keys(CODE_DATA);
  let steps = 0;
  keys.forEach(function (t) {
    LANG_ORDER.forEach(function (l) { if (CODE_DATA[t] && CODE_DATA[t][l]) steps += CODE_DATA[t][l].steps.length; });
  });
  if (keys.length) node.innerHTML = '教学代码 <b>' + steps + '</b> 块 · <b>' + keys.length + '</b> 节 · ' + LANG_LABEL[currentLang()];
  else node.innerHTML = '<b style="color:#ff6b81">代码数据未加载，请按 Ctrl+F5 强制刷新</b>';
}

function bindChrome() {
  document.getElementById('search').addEventListener('input', function () {
    const q = this.value.trim().toLowerCase();
    Array.prototype.forEach.call(document.querySelectorAll('.navlink'), a => {
      a.style.display = (!q || a.dataset.search.indexOf(q) >= 0) ? '' : 'none';
    });
    Array.prototype.forEach.call(document.querySelectorAll('.navgroup'), g => {
      let n = g.nextElementSibling, any = false;
      while (n && n.classList.contains('navlink')) { if (n.style.display !== 'none') { any = true; break; } n = n.nextElementSibling; }
      g.style.display = any ? '' : 'none';
    });
  });
  document.getElementById('menuBtn').addEventListener('click', () => document.getElementById('sidebar').classList.toggle('open'));
}

Object.assign(DSV, {
  register, esc, el, h, html, svgEl, hl, code, codeTabs, codeSteps, applyLang, currentLang, normLang, LANG_LABEL,
  card, note, mini, table, ex, answer, answerFor, sources,
  lab, reconcile, ghost, fxOf, ptr, placePtr, hidePtr, liveLabs, sorted, topics, route
});
const boot = function () { stampData(); buildNav(); bindChrome(); route(); };
if (document.readyState === 'loading') window.addEventListener('DOMContentLoaded', boot);
else boot();
})();

</script>

<script>
/* ==================== 04-array.js ==================== */
/* ============================ 1. 动态数组 ============================ */
(function () {
'use strict';
const D = window.DSV;

function P(arr, size, cap, o) {
  const s = { arr: arr.slice(), size: size, cap: cap, hl: [], ok: [], bad: [], dim: [], op: '', tag: '' };
  return Object.assign(s, o || {});
}

const steps = [
  { text: '初始状态：申请了一块能放 4 个格子的连续内存（capacity = 4），但一个元素都还没放（size = 0）。注意数组长度和"用了几格"是两回事。',
    s: P([], 0, 4, { op: 'new DynamicArray(4)', tag: 'size = 0, capacity = 4' }) },

  { text: 'push(1)：直接把 1 写进下标 0，size 变成 1。因为还在容量范围内，这一步是 O(1)。',
    s: P([1], 1, 4, { op: 'push(1)', hl: [0], tag: 'O(1)' }) },

  { text: 'push(2)、push(3)、push(4)：继续往尾部写。只要 size < capacity，每次都只是"写一格 + size 加一"，全是 O(1)。',
    s: P([1, 2, 3, 4], 4, 4, { op: 'push(2) push(3) push(4)', hl: [3], tag: 'O(1) × 3' }) },

  { text: 'push(5) 来了 —— 但是 size == capacity，4 格全满，后面没有位置了。这时候必须"扩容"。',
    s: P([1, 2, 3, 4], 4, 4, { op: 'push(5)  →  满了！', bad: [0, 1, 2, 3], tag: 'size == capacity' }) },

  { text: '扩容第一步：申请一块 2 倍大小的新内存（capacity 从 4 变成 8）。注意这里是"新开一块"，不是"原地变大"——连续内存没法凭空延长。',
    s: P([1, 2, 3, 4], 4, 8, { op: 'new Array(8)', dim: [0, 1, 2, 3], tag: 'capacity: 4 → 8' }) },

  { text: '扩容第二步：把旧数组的 4 个元素按顺序复制到新数组。这一步要碰每一个元素，所以是 O(n)——这是动态数组唯一"贵"的操作。',
    s: P([1, 2, 3, 4], 4, 8, { op: 'copy 旧数组 → 新数组', hl: [0, 1, 2, 3], tag: 'O(n)' }) },

  { text: '扩容完成后，终于能把 5 写进下标 4 了。size = 5，capacity = 8。关键洞察：一次扩容后剩下的 3 个位置都免费，所以把"扩容的代价"摊到每次 push 上，平均还是 O(1)（均摊复杂度）。',
    s: P([1, 2, 3, 4, 5], 5, 8, { op: 'push(5) 成功', ok: [4], tag: '均摊 O(1)' }) },

  { text: 'insert(2, 99)：要在下标 2 插队。可下标 2 已经被 3 占了，所以必须把 2 号及以后的元素统统往后挪一格。注意必须"从后往前"挪，否则前面的值会被后面的覆盖。',
    s: P([1, 2, 3, 4, 5], 5, 8, { op: 'insert(2, 99) → 先搬移', hl: [2, 3, 4], tag: 'O(n)' }) },

  { text: '腾出位置后写入 99，size = 6。一次插入最坏要搬 n 个元素，所以 insert 是 O(n)——这也是为什么"频繁在头部插入"的场景不该用数组。',
    s: P([1, 2, 99, 3, 4, 5], 6, 8, { op: 'arr[2] = 99', ok: [2], tag: 'size = 6' }) },

  { text: 'remove(0)：删除下标 0。删完之后序列中间出现空档，所以后面的元素必须集体往前挪一格。同样是 O(n)。',
    s: P([1, 2, 99, 3, 4, 5], 6, 8, { op: 'remove(0) → 前移', hl: [0], bad: [0], tag: 'O(n)' }) },

  { text: 'size 变成 5。注意最后那一格（下标 5）的值我们只是"逻辑上不要了"，并没有真的擦掉——下次 push 会直接覆盖它。这就是数组的删除比插入"便宜一点点"的地方：不用清零。',
    s: P([2, 99, 3, 4, 5, 5], 5, 8, { op: 'size--', ok: [0], dim: [5], tag: '脏数据下标 5 会被下次 push 覆盖' }) }
];

D.register({
  id: 'array', title: '动态数组', icon: '▦', group: '一、线性结构', order: 10,
  blurb: '最基础也最万能的容器，一切"按下标访问"的根基',
  badge: '均摊 O(1)',
  keywords: 'array 数组 list 列表 动态数组 扩容 capacity size',
  lead: '数组是唯一能让你"用一下标就瞬间拿到元素"的结构。它的代价是：内存必须连续，插入删除要搬元素。',
  build(doc) {
    /* ---- 概念 ---- */
    const c1 = D.card({ title: '一句话讲清', icon: '💡', badge: 'Array / List' });
    D.html(c1.querySelector('.body'),
      '<p>数组就是<b>一块连续的内存</b>，里面整齐地排着一模一样的格子，每格编号 0、1、2……' +
      '因为格子大小相同、地址连续，所以"第 i 个格子在哪"可以<b>直接算出来</b>：' +
      '<code class="inl">地址 = 基地址 + i × 单格大小</code>。这就是"随机访问 O(1)"的全部秘密。</p>' +
      '<p>但固定长度的数组不好用（现实中你常常不知道要存多少），于是有了<b>动态数组</b>：' +
      '它内部还是一个普通数组，只是额外记录了 <code class="inl">size</code>（用了几个）和 ' +
      '<code class="inl">capacity</code>（开了几个），满了就申请一块 2 倍大的新内存把数据搬过去。</p>' +
      D.mini([['O(1)', '按下标读/写'], ['均摊 O(1)', '尾部 push/pop'], ['O(n)', '中间插入/删除'], ['O(n)', '按值查找']]) +
      D.note('warn', '最容易搞混的两个词',
        '<b>size</b> 是"我存了几个元素"（逻辑长度），<b>capacity</b> 是"我申请了几格"（物理容量）。' +
        '遍历、判断越界只能用 size；访问 <code class="inl">data[i]</code> 且 i &lt; capacity 是安全的，' +
        '但 i ≥ size 时读到的是"垃圾值"，逻辑上不算元素。'));

    /* ---- 动画 ---- */
    const c2 = D.card({ title: '动画：扩容 / 插入 / 删除到底搬了什么', icon: '🎬', badge: '必须看 3 遍' });
    const body2 = c2.querySelector('.body');
    D.html(body2, '<p>下面这个动画演示了动态数组最重要的一次"内部事件"——<b>扩容</b>，以及为什么插入删除要 O(n)。' +
      '建议顺序：先播一遍看个整体，再一步步走，每步停下来问自己"这一格现在是脏的还是有效的"。</p>');
    D.lab(body2, {
      title: '动态数组 · 扩容与搬移',
      height: 300,
      steps: steps,
      setup(view) {
        const inner = D.el('div');
        inner.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:14px;';
        inner.innerHTML =
          '<div class="row" style="gap:10px;flex-wrap:wrap;justify-content:center">' +
          '<span class="chip" data-k="size">size = 0</span>' +
          '<span class="chip" data-k="cap">capacity = 4</span>' +
          '<span class="chip warm" data-k="op">—</span>' +
          '</div>' +
          '<div data-k="box" style="position:relative;border:1.5px dashed #2e3f63;border-radius:14px;padding:14px 16px 30px;">' +
          '<div data-k="caplabel" style="position:absolute;left:14px;top:-11px;background:#0a1120;padding:0 8px;font-family:var(--mono);font-size:11px;color:#6d80a3">capacity = 4</div>' +
          '<div class="row" data-k="cells" style="gap:10px"></div>' +
          '</div>' +
          '<div data-k="tag" style="font-size:12.5px;color:#93a6c8;font-family:var(--mono)"></div>';
        view.appendChild(inner);
        return {
          cells: inner.querySelector('[data-k="cells"]'),
          size: inner.querySelector('[data-k="size"]'),
          cap: inner.querySelector('[data-k="cap"]'),
          op: inner.querySelector('[data-k="op"]'),
          caplabel: inner.querySelector('[data-k="caplabel"]'),
          tag: inner.querySelector('[data-k="tag"]')
        };
      },
      draw(c, step) {
        const s = step.s;
        const items = [];
        for (let i = 0; i < s.cap; i++) {
          let cls = '';
          const has = i < s.size;
          if (!has) cls = 'empty';
          if (s.dim.indexOf(i) >= 0) cls += ' dim';
          if (s.hl.indexOf(i) >= 0) cls += ' hl';
          if (s.ok.indexOf(i) >= 0) cls += ' ok';
          if (s.bad.indexOf(i) >= 0) cls += ' bad';
          items.push({ i: i, v: has ? s.arr[i] : (s.dim.indexOf(i) >= 0 ? s.arr[i] : null), cls: cls });
        }
        D.reconcile(c.cells, items, it => it.i,
          () => D.el('div', 'cell'),
          (node, it) => {
            node.className = 'cell' + (it.cls ? ' ' + it.cls : '');
            node.innerHTML = (it.v === null ? '' : '<span>' + it.v + '</span>') +
              '<span class="lbl">' + it.i + '</span>';
          });
        c.size.textContent = 'size = ' + s.size;
        c.cap.textContent = 'capacity = ' + s.cap;
        c.op.textContent = s.op;
        c.caplabel.textContent = 'capacity = ' + s.cap;
        c.tag.textContent = s.tag;
        c.caplabel.parentElement.style.borderColor = s.cap > 4 ? 'rgba(56,217,208,.45)' : '#2e3f63';
      }
    });
    doc.appendChild(c2);

    /* ---- 要点 ---- */
    const c3 = D.card({ title: '自己写的时候，这 6 个点必须想清楚', icon: '🔧', badge: '实现要点' });
    D.html(c3.querySelector('.body'),
      '<h3 class="sec">1. 扩容为什么是"2 倍"而不是"+1"</h3>' +
      '<p>如果每次满了只加 1 格，那 push n 次就要搬 1+2+3+…+n ≈ O(n²) 次，等于白干。' +
      '翻倍的话，第 k 次扩容要搬 2^k 个元素，但那次扩容之后又能免费塞 2^k 个，' +
      '把总代价摊到 n 次 push 上就是 O(1)。<b>记住结论：扩容倍数必须是常数倍。</b></p>' +
      '<h3 class="sec">2. 插入必须"从后往前"搬</h3>' +
      '<p>要在下标 2 插入，得把 2、3、4 依次后移。如果你从下标 2 开始正着搬，' +
      '<code class="inl">data[3] = data[2]</code> 之后 <code class="inl">data[2]</code> 还是原值，' +
      '下一步 <code class="inl">data[4] = data[3]</code> 就会把刚写进去的复制一遍，原 data[3] 丢了。' +
      '<b>倒着搬，才能保证读的位置永远在被写位置的前面。</b></p>' +
      '<h3 class="sec">3. 删除是"从前往后"搬</h3>' +
      '<p>正好反过来：把后面的元素往前覆盖。<code class="inl">data[0] = data[1]</code> 之后 data[1] 已经没用了，' +
      '再 <code class="inl">data[1] = data[2]</code>，正着走就不会丢数据。删完只要 <code class="inl">size--</code>，不用擦值。</p>' +
      '<h3 class="sec">4. size 和 capacity 的分工</h3>' +
      '<p>凡是"逻辑"（有几个元素、越不越界、遍历到哪）都看 size；凡是"物理"（能不能直接写下标 i）都看 capacity。' +
      '很多人写 push 时忘了先判断 <code class="inl">size === capacity</code>，结果数据被静默丢掉。</p>' +
      '<h3 class="sec">5. 删/缩容时的内存泄漏</h3>' +
      '<p>在 Java/JS 这类有 GC 的语言里，<code class="inl">pop</code> 之后如果对象引用还留在数组里，' +
      '那块内存就回收不掉。所以 pop 里要写 <code class="inl">data[size] = null</code> 主动断开引用。' +
      '大数组里存大对象时，这是个真实的性能问题。</p>' +
      '<h3 class="sec">6. 什么时候不该用数组</h3>' +
      '<p>频繁在头部插删（用链表或双端队列）、元素类型差异巨大（用链表/哈希）、' +
      '需要按 key 找（用哈希）。数组的强项只有两个：<b>按下标随机访问</b> 和 <b>尾部追加</b>，' +
      '以及一个隐藏优势——<b>缓存友好</b>（连续内存，CPU 预读友好，同样 O(n) 遍历比链表快好几倍）。');
    doc.appendChild(c3);

    /* ---- 代码 ---- */
    const c4 = D.card({ title: '分步实现 · C / C++ / Rust', icon: '⌨️', badge: '7 个步骤' });
    D.html(c4.querySelector('.body'),
      '<p>三种语言、同一套步骤。<b>点右上角切换语言，整页跟着一起换。</b>把每一步按顺序拼起来，就是一份能直接编译运行的完整程序。</p>' +
      '<p>这些代码刻意写得<b>朴素</b>：不用 template、不用智能指针、不用 STL 容器，就是最普通的 ' +
      '<code class="inl">class</code> / <code class="inl">struct</code> + 指针 + 循环，' +
      '和你在 Dev-C++ 里手写出来的样子一样 —— 每一行都能看懂，也都能自己敲出来。</p>' +
      '<p><b>关于文件组织：</b>平时是把类声明放 <code class="inl">.h</code>、实现放 <code class="inl">.cpp</code>；' +
      '这里为了能直接复制下来编译运行，把两部分放在同一个文件里了，工程里再拆开即可。</p>' +
      D.codeSteps('array') +
      D.sources('array') +
      D.note('tip', '亲手验证"均摊 O(1)"',
        '在扩容分支里加一行打印（C：<code class="inl">fprintf(stderr, "grow -> %zu\\n", cap)</code>，' +
        'C++：<code class="inl">std::cerr</code>，Rust：<code class="inl">eprintln!</code>），' +
        '然后连续追加 100 个元素。你会看到扩容只发生了 5～6 次（4→8→16→32→64→128）——' +
        '这就是"均摊"最直观的证据。'));
    doc.appendChild(c4);

    /* ---- 练习 ---- */
    const c5 = D.card({ title: '动手练', icon: '✎', badge: '不做等于没学' });
    D.html(c5.querySelector('.body'),
      D.ex('合上页面，只给你签名 <code class="inl">insert(index, v)</code>，默写完整实现（越界检查 → 扩容 → 倒着搬 → 写入 → size++）。' +
        '写完对照上面<b>第 5 步</b>，检查三件事：① 搬移方向对不对 ② 有没有"先扩容再搬" ③ size 最后加没加。') +
      D.ex('实现 <code class="inl">remove_all(v)</code>：删除数组里所有等于 v 的元素，要求 <b>O(n)</b> 时间、<b>O(1)</b> 额外空间' +
        '（不允许新建数组，也不允许反复 remove 造成 O(n²)）。提示：双指针——读指针扫全部，写指针只在"该保留"时前进。',
        D.answerFor('array', 1)) +
      D.ex('如果扩容改成"每次 +4"，push 1000 个元素总共要搬多少次？改成"每次 ×2"呢？请用计算说明为什么后者是均摊 O(1)。',
        '<p>每次 +4：第 k 次扩容搬 4k 个元素，搬完能免费写 4 个，所以在第 k 次扩容前要 push 4k 次。' +
        '总搬移量 ≈ 4(1+2+…+k) ≈ 2k²，而总元素数 n ≈ 4k²/…——总之是 <b>O(n²)</b>。</p>' +
        '<p>每次 ×2：第 k 次扩容搬 2^k 个，扩容前刚好 push 了 2^k 次。总搬移量 ≈ 2^1+2^2+…+2^k ≈ 2^(k+1) ≈ 2n，' +
        '摊到 n 次 push 上就是常数 → <b>均摊 O(1)</b>。</p>'));
    doc.appendChild(c5);
  }
});
})();

(function () {
